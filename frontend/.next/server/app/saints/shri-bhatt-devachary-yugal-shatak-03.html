x-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Home\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Saints\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"shri bhatt devachary yugal shatak (03)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री भट्ट देवाचार्य  युगल शतक (03)\",\"hinglishName\":\"shri bhatt devachary yugal shatak (03)\",\"slug\":\"shri-bhatt-devachary-yugal-shatak-03\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-113\",\"title\":\"जै जै वृन्दावन आनंद मूल । नाम लेत पावत जु प्रणय रति\",\"category\":\"Shloka\",\"sanskrit_text\":\"जै जै वृन्दावन आनंद मूल ।नाम लेत पावत जु प्रणय रति, जुगल किसोर देत निज कूल ।।सरन आय पाये राधाधव, मिटी अनेक जनम की भूल ।ऐसैं जानि वृंदावन श्रीभट, रज पै वारि कोटि मष तूल ।।\",\"hindi_text\":\"जै जै वृन्दावन आनंद मूल ।\\nनाम लेत पावत जु प्रणय रति, जुगल किसोर देत निज कूल ।।\\nसरन आय पाये राधाधव, मिटी अनेक जनम की भूल ।\\nऐसैं जानि वृंदावन श्रीभट, रज पै वारि कोटि मष तूल ।।\\nश्री भट्ट देवाचार्य - युगल शतक (03)\\nआनंद का मूल स्रोत श्री वृंदावन धाम ही है, जिसका नाम हृदय से उच्चारण करने मात्र से प्रेम रस की वर्षा होती है और श्री युगल सरकार अपना रहस्यमय धाम वास प्रदान करते हैं जो देव दुर्लभ है । वृंदावन धाम की शरण लेने मात्र से श्री राधावर श्री कृष्ण का नित्य संग प्राप्त होता है और अनंत कोटि पाप कटते हैं और अनंत जन्म की बिगड़ी बन जाती है । श्री भट्ट देवाचार्य के शब्दों में वृंदावन धाम की रज पर अनंत कोटी धार्मिक कृत्य एवं यज्ञ आदि को न्योछावर कर देना चाहिए ।\",\"english_text\":null,\"english_translation\":\"All Glories to the Vrindavan Dham, the origin of the unlimited nectarian bliss. Simply by pronouncing the name of Vrindavan from the bottom of the heart, one receives the topmost love bliss, and Shri Yugal Sarkar grant their personal private residence. Simply by taking shelter at Vrindavan Dham, One gets the association of Shri Krishna, the beloved of Shri Radha, that will positively rectify the misfortune of uncountable lifetimes. Shri Bhata Devacharya says, always Keep in mind, the importance of Shri Vrindavan Dham and sacrifice millions of oblations, and religious duties on the dust of Vrindavan, which is fully surcharged with the love of Yugal sarkar, that provides the bliss of Vrindavan ceaselessly.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b54069f5dbf5475ed9a43db/jai-jai-vrindavan-anand-mool-naam-leta-pawat-ju-pranay-rati-yugal-kishori-det-nij-kool-saran-aaye-paye-radhadhav-miti-anek-janam-ki-bhool-aisi-jani-vrindavan-shri-bhata-raj-pe-vari-koti-mash-tool-shri-bhata-devacharya-yugal-shatak-03\",\"author\":\"श्री भट्ट देवाचार्य  युगल शतक (03)\",\"status\":\"published\",\"content_text\":\"जै जै वृन्दावन आनंद मूल ।\\nनाम लेत पावत जु प्रणय रति, जुगल किसोर देत निज कूल ।।\\nसरन आय पाये राधाधव, मिटी अनेक जनम की भूल ।\\nऐसैं जानि वृंदावन श्रीभट, रज पै वारि कोटि मष तूल ।।\\nश्री भट्ट देवाचार्य - युगल शतक (03)\\nआनंद का मूल स्रोत श्री वृंदावन धाम ही है, जिसका नाम हृदय से उच्चारण करने मात्र से प्रेम रस की वर्षा होती है और श्री युगल सरकार अपना रहस्यमय धाम वास प्रदान करते हैं जो देव दुर्लभ है । वृंदावन धाम की शरण लेने मात्र से श्री राधावर श्री कृष्ण का नित्य संग प्राप्त होता है और अनंत कोटि पाप कटते हैं और अनंत जन्म की बिगड़ी बन जाती है । श्री भट्ट देवाचार्य के शब्दों में वृंदावन धाम की रज पर अनंत कोटी धार्मिक कृत्य एवं यज्ञ आदि को न्योछावर कर देना चाहिए ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b54069f5dbf5475ed9a43db/jai-jai-vrindavan-anand-mool-naam-leta-pawat-ju-pranay-rati-yugal-kishori-det-nij-kool-saran-aaye-paye-radhadhav-miti-anek-janam-k

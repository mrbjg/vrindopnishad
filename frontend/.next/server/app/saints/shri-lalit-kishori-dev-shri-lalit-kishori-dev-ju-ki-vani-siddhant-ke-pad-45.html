नि ललित लाडिली तन मन वचननि हियो सिरावै॥ [4]\",\"hindi_text\":\"इस पृथ्वी मंडल या बैकुंठ धाम या फिर कहीं किसी भी लोक चले जाओ परंतु यह निर्विवाद सत्य है कि सर्वोपरि श्री वृंदावन की अनन्य विलासिनी श्री नित्य बिहारिनि श्री राधा के बिना कहीं प्रेम का विशुद्ध पूर्णतम दाता नहीं है । [1 \u0026 2]\\nक्योंकि जिन के प्रेम में वशीभूत होकर स्वयं श्री लालजी तन मन प्राणों से निरंतर मिले रहते हुए भी आकुल और व्याकुल होकर नित्य सतत श्री प्यारी जू के रंग को बढ़ाते हैं एवं उनकी सेवा करते हैं । [3]\\nऐसे ही अद्भुत सुख से श्री कुंज बिहारिनि लाडली हमारे तन मन और प्राणों को सतत सिराति रहती हैं (हमको रस में डुबाती रहती हैं )। [4]\",\"english_text\":null,\"english_translation\":\"This is an indisputable truth that without Nitya Biharini, The One and only Shri Radharani, The one who is an absolute giver of the topmost treasure of love, The Supreme Goddess of Vrindavan Dham, There exists no pure love anywhere or with anyone. [1]\\nEven if you roam anywhere in this material world, or any other abode or even to the Vaikuntha Dham where Lord Vishnu resides, You will not find anyone like her. [2]\\nThis the effect of her love that Shri Krishn, despite being always present with her through body and mind, desires to please her and serve her incessantly. [3]\\nShri Lalit Kishori says, \\\"Even we, the sakhis are also blessed by her in the same way as Shri Krishn is, day and night remain intoxicated in her nectar. So this way, She immersed our body, mind, and soul in the bliss.\\\" [4]\",\"description\":\"https://www.brajrasik.org/hi/articles/5dacb5c99e23170061760ccc/priya-bin-suddh-prem-nahin-paavai-shri-lalit-kishori-dev\",\"author\":\"श्री ललित किशोरी देव, श्री ललित किशोरी देव जू की वाणी, सिद्धांत के पद (45)\",\"status\":\"published\",\"content_text\":\"प्रिया बिन सुद्ध प्रेम नहीं पावै। [1]\\nभुव मंडल बैकुंठलोक की लौं उँच नीच केतौ किन धावै॥ [2]\\nएतौ मिलैं मिल्योई चाहत छिन छिन प्रीतम रंग बढावै। [3]\\nश्रीकुंजबिहारिनि ललित लाडिली तन मन वचननि हियो सिरावै॥ [4]\\n- श्री ललित किशोरी देव, श्री ललित किशोरी देव जू की वाणी, सिद्धांत के पद (45)\\nइस पृथ्वी मंडल या बैकुंठ धाम या फिर कहीं किसी भी लोक चले जाओ परंतु यह निर्विवाद सत्य है कि सर्वोपरि श्री वृंदावन की अनन्य विलासिनी श्री नित्य बिहारिनि श्री राधा के बिना कहीं प्रेम का विशुद्ध पूर्णतम दाता नहीं है । [1 \u0026 2]\\nक्योंकि जिन के प्रेम में वशीभूत होकर स्वयं श्री लालजी तन मन प्राणों से निरंतर मिले रहते हुए भी आकुल और व्याकुल होकर नित्य सतत श्री प्यारी जू के रंग को बढ़ाते हैं एवं उनकी सेवा करते हैं । [3]\\nऐसे ही अद्भुत सुख से श्री कुंज बिहारिनि लाडली हमारे तन मन और प्राणों को सतत सिराति रहती हैं (हमको रस में डुबाती रहती हैं )। [4]\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5dacb5c99e23170061760ccc/priya-bin-suddh-prem-nahin-paavai-shri-lalit-kishori-dev\",\"slug\":\"priya-bin-suddh-prem-nahin-pavai\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/cbf73327883ccb7f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/fe995a1e4635138b.css\",\"precedence\":\"next\",\"c

)\nजो कोऊ वृन्दावन बसि जानै।\nसब कछु तज भजै हरि - राधा - मन पूरन पन ठानै॥\nछक्यौ रहै भरि भाव निरन्तर करि लीला रस पानै।\nरसिक सँग रुचि-रंग रचै नित प्रीति-रीति उर आनै॥ .\nचकित नैंन चाहै द्रुम - बेली दंपति हित पहिचानै।\nघूमत फिरै तीर जमुना के निधरक ह्वै गुन गानै॥\nआस बास रज ही मैं राखै स्रम न करै भ्रम भानै।\nआनँदघन रस भीजि रीझि सों जनम सफलता मानै॥\n- श्री आनँदघन जी, पदावली  (692)\nजो कोई भी समस्त इच्छाओं को त्याग कर वृंदावन में वास करता है, और दिव्य युगल श्री राधा कृष्ण की उपासना करता है, वह परमार्थ की पूर्णता को प्राप्त करता है और सदैव संतुष्ट रहता है। इस प्रकार साधक, दिन-रात प्रेम भाव में छका हुआ, निरन्तर लीला रस का पान करता रहता है। उस साधक को, रसिक संतों की संगति के परिणाम स्वरुप , मन में निस्वार्थ भाव से सेवा करने की इच्छा उत्पन्न होती है, एवं विभिन्न साखियों (रसिक संतों) के माध्यम से सेवा की विधि एवं रीति को समझता है। इसके पश्चात वह चकित नैनों से श्री जुगल किशोर के सुंदरता का पान करता हुआ वृंदावन में विचरण करता रहता हैं। वह यमुना के तीर पर घूमते हुए, भयमुक्त और प्रेमपूर्वक श्री राधा कृष्ण के गुणों का गान करता रहता है। तब वह विभिन्न प्रकार की साधनाओं से उदासीन, मात्र रजरानी का आश्रय ग्रहण कर उसी रज में पड़ा रहता है। श्री आनंदघन कह रहें हैं \"इस प्रकार वह साधक, रस में डूबा हुआ अपने जीवन को सफल अनुभव करता है।\""])</script><script>self.__next_f.push([1,"b:[\"slug\",\"shri-anndaghan-padavali-692\",\"d\"]\n10:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"saints\",\"shri-anndaghan-padavali-692\"],\"initialTree\":[\"\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shri-anndaghan-padavali-692\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"shri-anndaghan-padavali-692\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shri-anndaghan-padavali-692\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\ "verses\":[{\"id\":\"local-55\",\"title\":\"जो कोऊ वृन्दावन बसि जानै\",\"category\":\"Shloka\",\"sanskrit_text\":\"जो कोऊ वृन्दावन बसि जानै।सब कछु तज भजै हरि - राधा - मन पूरन पन ठानै॥छक्यौ रहै भरि भाव निरन्तर करि लीला रस पानै।रसिक सँग रुचि-रंग रचै नित प्रीति-रीति उर आनै॥ .चकित नैंन चाहै द्रुम - बेली दंपति हित पहिचानै।घूमत फिरै तीर जमुना के निधरक ह्वै गुन गानै॥आस बास रज ही मैं राखै स्रम न करै भ्रम भानै।आनँदघन रस भीजि रीझि सों जनम सफलता मानै॥\",\"hindi_text\":\"जो कोई भी समस्त इच्छाओं को त्याग कर वृंदावन में वास करता है, और दिव्य युगल श्री राधा कृष्ण की उपासना करता है, वह परमार्थ की पूर्णता को प्राप्त करता है और सदैव संतुष्ट रहता है। इस प्रकार साधक, दिन-रात प्रेम भाव में छका हुआ, निरन्तर लीला रस का पान करता रहता है। उस साधक को, रसिक संतों की संगति के परिणाम स्वरुप , मन में निस्वार्थ भाव से सेवा करने की इच्छा उत्पन्न होती है, एवं विभिन्न साखियों (रसिक संतों) के माध्यम से सेवा की विधि एवं रीति को समझता है। इसके पश्चात वह चकित नैनों से श्री जुगल किशोर के सुंदरता का पान करता हुआ वृंदावन में विचरण करता रहता हैं। वह यमुना के तीर पर घूमते हुए, भयमुक्त और प्रेमपूर्वक श्री राधा कृष्ण के गुणों का गान करता रहता है। तब वह विभिन्न प्रकार की साधनाओं से उदासीन, मात्र रजरानी का आश्रय ग्रहण कर उसी रज में पड़ा रहता है। श्री आनंदघन कह रहें हैं \\\"इस प्रकार वह साधक, रस में डूबा हुआ अपने जीवन को सफल अनुभव करता है।\\\"\",\"english_text\":null,\"english_translation\":\"Whoever resides at Vrindavan while giving up all the desires, thus, worshiping the Divine Couple Shri Radha Krishn, attains spiritual perfection and becomes satisfied forever.\\nThus, being intoxicated in love- trance day and night, tastes the sweetness of ever new nectar of love incessantly.\\nThus, with the association of Rasik saints, desire to serve selflesslely occurs in mind and day and night, understand the mode of love through various sakhis (Rasik saints).\\nThus, the eyes become overwhelmed with ecstasy by seeing the nectar waves of Vrindavan and Shri Radha Krishn’s beauty.\\nThus, while roaming near the bank of Yam

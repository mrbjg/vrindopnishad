nts\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Saints\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"shri bhatt devacharya\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री भट्ट देवाचार्य\",\"hinglishName\":\"shri bhatt devacharya\",\"slug\":\"shri-bhatt-devacharya\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-299\",\"title\":\"रे मन वृन्दाविपिन निहार\",\"category\":\"Shloka\",\"sanskrit_text\":\"रे मन वृन्दाविपिन निहार |\",\"hindi_text\":\"अरे मन ! वृन्दावन की शोभा को निहार, यदि तुझे अनंत कोटि चिंतामणि भी मिलें, तो भी हाथ पसारकर वृन्दावन की सीमा से मत जा, यदि स्वयं श्री कृष्ण भी वृन्दावन की सीमा के बाहर मिलें तो भी उनको मत निहार, और अपने मन में यही आशा रख की,यह तन भी वृन्दावन रज से ही ओत प्रोत रहे  |\",\"english_text\":null,\"english_translation\":\"O Mind, Look at the extraordinary sight and magnificence of Vrindavan. O Mind, if you get millions of wish-fulfilling jewel, still you should never leave Vrindavan. O Mind, Even Lord Hari outside the Vrindavan’s boundary, should not even be looked upon. Shri Bhata Devacharya says since the dust of Vrindavan is so surcharged with Radha Krishna prema, let all your hopes confined to the dust of Vrindavan alone i.e every pore of the body is absorbed in the dust of Vrindavan (from the mind and body one is totally surrendered to dust of Vrindavan).\",\"description\":\"https://www.brajrasik.org/hi/articles/5ac86be99f7ab760360f9c23/re-mana-vrindavipin-nihaar-shri-bhata-devacharya\",\"author\":\"श्री भट्ट देवाचार्य\",\"status\":\"published\",\"content_text\":\"रे मन वृन्दाविपिन निहार |\\nयद्पि मिले कोटि चिंतामणि तदपि न हाथ पसार ||\\nविपिन राज सीमा के बाहर हरिहूँ को न निहार |\\nजय श्री भट्ट धूरि धूसर तन, यह आसा उर धार ||\\n- श्री भट्ट देवाचार्य\\nअरे मन ! वृन्दावन की शोभा को निहार, यदि तुझे अनंत कोटि चिंतामणि भी मिलें, तो भी हाथ पसारकर वृन्दावन की सीमा से मत जा, यदि स्वयं श्री कृष्ण भी वृन्दावन की सीमा के बाहर मिलें तो भी उनको मत निहार, और अपने मन में यही आशा रख की,यह तन भी वृन्दावन रज से ही ओत प्रोत रहे  |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5ac86be99f7ab760360f9c23/re-mana-vrindavipin-nihaar-shri-bhata-devacharya\",\"slug\":\"re-man-vrindavipin-nihara\"},{\"id\":\"local-547\",\"title\":\"रे मन वृन्दाविपिन निहार\",\"category\":\"Shloka\",\"sanskrit_text\":\"रे मन वृन्दाविपिन निहार, यद्पि मिले कोटि चिंतामणि तदपि न हाथ पसार |विपिन राज सीमा के बाहर हरिहूँ को न निहार ||\",\"hindi_text\":\"अरे मन ! वृन्दावन की शोभा को निहार, यदि तुझे अनंत कोटि चिंतामणि भी मिलें, तो भी हाथ पसारकर वृन्दावन की सीमा से मत जा, यदि स्वयं श्री कृष्ण भी वृन्दावन की सीमा के बाहर मिलें तो भी उनको मत निहार, और अपने मन में यही आशा रख की,यह तन भी वृन्दावन रज से ही ओत प्रोत रहे  |\",\"english_text\":null,\"english_translation\":\"O Mind, Look at the extraordinary sight and magnificence of Vrindavan. O Mind, if you get millions of wish-fulfilling jewel, still you should never leave Vrindavan. O Mind, Even if you get Lord Hari outside the Vrindavan’s boundary, still you should not even look at him.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a92af4782274812fecf96b2/re-mana-vrindavipin-nihaar-yadpi-mile-koti-chintamani-tadapi-na-hath-pasaar-vipin-raaj-seema-ke-bahar-harihun-ko-na-nihaar-shri-bhata-devacharya\",\"author\":\"श्री भट्ट देवाचार्य\",\"status\":\"published\",\"content_text\":\"रे मन वृन्दाविपिन निहार, यद्पि मिले कोटि चिंतामणि तदपि न हाथ पसार |\\nविपिन राज सीमा के बाहर हरिहूँ को न निहार ||\\n- श्री भट्ट देवाचार्य\\nअरे मन ! वृन्दावन की शोभा को निहार, यदि तुझे अनंत कोटि चिंतामणि भी मिलें, तो भी हाथ पसारकर वृन्दावन की सीमा से मत जा, यदि स्वयं श्री कृष्ण भी वृन्दावन की सीमा के बाहर मिलें तो भी उनको मत निहार, और अपने मन में यही आशा रख की,यह तन भी वृन्दावन रज से ही ओत प्रोत रहे  |\",\"tags\

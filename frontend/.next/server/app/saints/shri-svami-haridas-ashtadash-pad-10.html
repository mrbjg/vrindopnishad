 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Home\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Saints\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"shri svami haridas, ashtadash pad (10)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री स्वामी हरिदास, अष्टादश पद (10)\",\"hinglishName\":\"shri svami haridas, ashtadash pad (10)\",\"slug\":\"shri-svami-haridas-ashtadash-pad-10\",\"biography\":\"\",\"metadata\":{\"lineageEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"lineageHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"timelineEn\":\"1478–1573 AD (Vikram Samvat 1535 - 1630)\",\"timelineHi\":\"1478–1573 ईस्वी (विक्रम संवत 1535 - 1630)\",\"associatedPlacesEn\":\"Nidhivan, Vrindavan\",\"associatedPlacesHi\":\"निधिवन, वृंदावन\",\"discipleOfEn\":\"Shri Ashudhir Dev Ji (his father and guru)\",\"discipleOfHi\":\"श्री आशुधीर देव जी (पिता एवं गुरु)\",\"influencedByEn\":\"Nimbarka Sampradaya philosophy\",\"influencedByHi\":\"निम्बार्क संप्रदाय सिद्धांत\",\"associatedSampradayaEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"associatedSampradayaHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"devotionalMoodEn\":\"Nitya Vihar, Sakhi Bhava (Lalita Sakhi incarnate)\",\"devotionalMoodHi\":\"नित्य विहार, सखी भाव (ललिता सखी अवतार)\",\"teachingsEn\":\"Worship of the Divine Couple in the mood of Lalita Sakhi; focused purely on the eternal love-play (Nitya Vihar) in the secluded bowers (Nikunj) of Vrindavan, entirely devoid of majesty (aishwarya) or physical separation (viraha).\",\"teachingsHi\":\"ललिता सखी के भाव में युगल उपासना; वृंदावन के निकुंजों में होने वाले अखंड नित्य विहार रस पर पूर्ण ध्यान, जिसमें ऐश्वर्य भाव या वियोग का कोई स्थान नहीं है।\",\"literaryStyleEn\":\"Composed Kelimal (केलिमाल) and Siddhanta Pada (सिद्धान्त के पद) in sweet Braj Bhasha, characterized by deep musicality, classical raag notations, and intimate description of the Divine Couple's pastimes.\",\"literaryStyleHi\":\"मधुर ब्रजभाषा में 'केलिमाल' और 'सिद्धान्त के पद' की रचना की, जो राग-रागिनियों की शास्त्रीय विधा और निकुंज लीलाओं के सूक्ष्म चित्रण से परिपूर्ण हैं।\",\"biographyEn\":\"Swami Haridas was a spiritual master, classical music pioneer, and the founding acharya of the Haridasi Sampradaya. He is widely revered as the direct incarnation of Lalita Sakhi, the chief confidante of Srimati Radharani. Swami Haridas performed his intense bhajan in the sacred grove of Nidhivan in Vrindavan. His musical devotion was so deep and pure that the Divine Couple, Shri Radha and Krishna, appeared before him and manifested themselves in a single, combined deity form—Sri Bankey Bihari Ji. Swami Haridas taught that the ultimate spiritual destination is not cosmic liberation or majestic worship, but witnessing the confidential loving service of the Divine Couple in the eternal groves of Braj.\",\"biographyHi\":\"स्वामी हरिदास वृंदावन के रसिक शिरोमणि संत और भारतीय शास्त्रीय संगीत के महान आचार्य थे। उन्हें श्री राधा जी की प्रधान सखी श्री ललिता जी का साक्षात् अवतार माना जाता है। उन्होंने वृंदावन के निधिवन को अपनी साधना स्थली बनाया, जहाँ उनके संगीत अनुराग से खिंचकर युगल सरकार ने बांके बिहारी जी के रूप में प्रकट होकर दर्शन दिए। तानसेन और बैजू बावरा जैसे संगीत सम्राट इनके शिष्य थे। स्वामी जी ने सिद्ध किया कि भक्ति शुष्क तपस्या नहीं, बल्कि राग-रागिनियों के माध्यम से प्रभु चरणों में पूर्ण आत्मसमर्पण है।\",\"relatedSaints\":[{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"},{\"nameEn\":\"Shri Hariram Vyas\",\"nameHi\":\"श्री हरिराम व्यास\",\"slug\":\"hariram-vyas\"}],\"relatedGranthas\":[{\"nameEn\":\"Kelimal\",\"nameHi\":\"केलिमाल\",\"slug\":\"kelimal\"},{\"nameEn\":\"Siddhanta Pada\",\"nameHi\":\"सिद्धान्त के पद\",\"slug\":\"siddhanta-pada\"}],\"associatedGlossary\":[{\"termEn\":\"Nitya Vihar\",\"termHi\":\"नित्य विहार\",\"slug\":\"nitya-vihar\"},{\"termEn\":\"Nikunj\",\"termHi\":\"निकुंज\",\"slug\":\"nikunj\"},{\"termEn\":\"Sakhi Bhava\",\"termHi\":\"सखी भाव\",\"slug\":\"sakhi-bhava\"}],\"faq\":[{\"qEn\":\"Who was Swami Haridas?\",\"aEn\":\"Swami Haridas was a 16th-century rasik saint, musicologist, and founder of the Haridasi Sampradaya, renowned for manifesting the Bankey Bihari deity through his music in Nidhivan.\",\"qHi\":\"स्वामी हरिदास कौन थे?\",\"aHi\":\"स्वामी हरिदास 16वीं शताब्दी के एक महान रसिक संत, संगीतकार और हरिदासी संप्रदाय के प्रवर्तक थे, जिन्होंने अपने संगीत साधना से निधिवन में ठाकुर बांके बिहारी जी को प्रकट किया था।\"},{\"qEn\":\"Who were the famous disciples of Swami Haridas?\",\"aEn\":\"The legendary musicians Tansen (the royal singer of Akbar's court) and Baiju Bawra were disciples of Swami Haridas.\",\"qHi\":\"स्वामी हरिदास के प्रसिद्ध शिष्य कौन थे?\",\"aHi\":\"अकबर के दरबार के नवरत्नों में से एक संगीत सम्राट तानसेन और बैजू बावरा स्वामी हरिदास जी के प्रमुख शिष्य थे।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-505\",\"title\":\"हरि के नाम कों आलस कत करत है रे\",\"category\":\"Shloka\",\"sanskrit_text\":\"हरि के नाम कों आलस कत करत है रे काल फिरत सर सांधे। [1]बेर कुबेर कछू नहिं जानत चढ्यौ फिरत है कांधे॥ [2]हीरा बहुत जवाहर संचे कहा भयौ हस्ती दर बाँधे। [3]कहें श्री हरिदास महल में बनिता बनि ठाढ़ी भई॥ [4]एकौ न चलत जब आवत अन्त की आँधें॥ [5]\",\"hindi_text\":\"हरि नाम जप में आलास क्यों करते हो, काल तुम्हें ले जाने के लिए धनुष पर बाण चढ़ाये फिर रहा है। [1]\\nवह न तो शुभ समय को जानता है न तो अशुभ समय को, वह तुम्हें ले जाने के लिए तुम्हारे कंधे पर बैठा है। [2]\\nजौहरी जीवन पर्यन्त हीरा संचित करता है लेकिन उससे क्या लाभ, क्या वे हीरे मोती मृत्यु के बाद उसके काम आएंगे ? दरवाजे पर हाथी, घोड़े, आदि बंधे हो तो क्या वो तुम्हें काल से बचा लेंगे ?  जब मृत्यु पश्चात् अस्थि पर उसके हाथ बाँध दिए जाते हैं तब उन संचित हीरों का क्या लाभ हुआ। [3]\\nतुम्हारी सुन्दर पत्नी श्रृंगारित होकर महल में आरती की थाली लिए तुम्हारी प्रतीक्षा में हो तो उससे क्या ? [4]\\nजब अंत समय की आंधी आती है तब कुछ काम नहीं आता, कोई साथ नहीं रहता। [5]\",\"english_text\":null,\"english_translation\":\"Why do you delay in chanting the name of Hari, when the inevitable time of death roams with its arrow set on the bow, ready to take you? [1]\\nIt knows neither auspicious nor inauspicious times, it sits on your shoulder, always waiting to take you away. [2]\\nA jeweler may collect diamonds throughout his life, but what benefit is there in that? Will those diamonds and pearls be of any use after death? If elephants and horses are tied outside your door, will they save you from death? [3]\\nWhat is the point if your beautifully adorned wife waits for you in the palace with an aarti plate? [4]\\nWhen the final storm of death arrives, nothing will come to your aid, and no one will remain with you. [5]\",\"description\":\"https://www.brajrasik.org/hi/articles/5d959e2d89c4660060055e0a/hari-ke-naam-kon-aalas-kat-karat-hai-re-shri-swami-haridas-ashtadash-pada-10\",\"author\":\"श्री स्वामी हरिदास, अष्टादश पद (10)\",\"status\":\"published\",\"content_text\":\"(राग आसावरी)\\nहरि के नाम कों आलस कत करत है रे काल फिरत सर सांधे। [1]\\nबेर कुबेर कछू नहिं जानत चढ्यौ फिरत है कांधे॥ [2]\\nहीरा बहुत जवाहर संचे कहा भयौ हस्ती दर बाँधे। [3]\\nकहें श्री हरिदास महल में बनिता बनि ठाढ़ी भई॥ [4]\\nएकौ न चलत जब आवत अन्त की आँधें॥ [5]\\n- श्री स्वामी हरिदास, अष्टादश पद (10)\\nहरि नाम जप में आलास क्यों करते हो, काल तुम्हें ले जाने के लिए धनुष पर बाण चढ़ाये फिर रहा है। [1]\\nवह न तो शुभ समय को जानता है न तो अशुभ समय को, वह तुम्हें ले जाने के लिए तुम्हारे कंधे पर बैठा है। [2]\\nजौहरी जीवन पर्यन्त हीरा संचित करता है लेकिन उससे क्या लाभ, क्या वे हीरे मोती मृत्यु के बाद उसके काम आएंगे ? दरवाजे पर हाथी, घोड़े, आदि बंधे हो तो क्या वो तुम्हें काल से बचा लेंगे ?  जब मृत्यु पश्चात् अस्थि पर उसके हाथ बाँध दिए जाते हैं तब उन संचित हीरों का क्या लाभ हुआ। [3]\\nतुम्हारी सुन्दर पत्नी श्रृंगारित होकर महल में आरती की थाली लिए तुम्हारी प्रतीक्षा में हो तो उससे क्या ? [4]\\nजब अंत समय की आंधी आती है तब कुछ काम नहीं आता, कोई साथ नहीं रहता। [5]\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d959e2d89c4660060055e0a/hari-ke-naam-kon-aalas-kat-karat-hai-re-shri-swami-haridas-ashtadash-pada-10\",\"slug\":\"hari-ke-nam-kon-alas-kat-karat-hai-re\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/cbf73327883ccb7f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/fe995a1e4635138b.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/848f1edf91a8622f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"className\":\"dark\",\"children\":[\"$\",\"body\",null,{\"className\":\"antialiased\",\"children\":[\"$\",\"$Lc\",null,{\"children\":[\"$\",\"$L9\",null,{\"par

\":\"/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Saints\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"shri haridas, kelimala\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री हरिदास, केलिमाल\",\"hinglishName\":\"shri haridas, kelimala\",\"slug\":\"shri-haridas-kelimala\",\"biography\":\"\",\"metadata\":{\"lineageEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"lineageHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"timelineEn\":\"1478–1573 AD (Vikram Samvat 1535 - 1630)\",\"timelineHi\":\"1478–1573 ईस्वी (विक्रम संवत 1535 - 1630)\",\"associatedPlacesEn\":\"Nidhivan, Vrindavan\",\"associatedPlacesHi\":\"निधिवन, वृंदावन\",\"discipleOfEn\":\"Shri Ashudhir Dev Ji (his father and guru)\",\"discipleOfHi\":\"श्री आशुधीर देव जी (पिता एवं गुरु)\",\"influencedByEn\":\"Nimbarka Sampradaya philosophy\",\"influencedByHi\":\"निम्बार्क संप्रदाय सिद्धांत\",\"associatedSampradayaEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"associatedSampradayaHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"devotionalMoodEn\":\"Nitya Vihar, Sakhi Bhava (Lalita Sakhi incarnate)\",\"devotionalMoodHi\":\"नित्य विहार, सखी भाव (ललिता सखी अवतार)\",\"teachingsEn\":\"Worship of the Divine Couple in the mood of Lalita Sakhi; focused purely on the eternal love-play (Nitya Vihar) in the secluded bowers (Nikunj) of Vrindavan, entirely devoid of majesty (aishwarya) or physical separation (viraha).\",\"teachingsHi\":\"ललिता सखी के भाव में युगल उपासना; वृंदावन के निकुंजों में होने वाले अखंड नित्य विहार रस पर पूर्ण ध्यान, जिसमें ऐश्वर्य भाव या वियोग का कोई स्थान नहीं है।\",\"literaryStyleEn\":\"Composed Kelimal (केलिमाल) and Siddhanta Pada (सिद्धान्त के पद) in sweet Braj Bhasha, characterized by deep musicality, classical raag notations, and intimate description of the Divine Couple's pastimes.\",\"literaryStyleHi\":\"मधुर ब्रजभाषा में 'केलिमाल' और 'सिद्धान्त के पद' की रचना की, जो राग-रागिनियों की शास्त्रीय विधा और निकुंज लीलाओं के सूक्ष्म चित्रण से परिपूर्ण हैं।\",\"biographyEn\":\"Swami Haridas was a spiritual master, classical music pioneer, and the founding acharya of the Haridasi Sampradaya. He is widely revered as the direct incarnation of Lalita Sakhi, the chief confidante of Srimati Radharani. Swami Haridas performed his intense bhajan in the sacred grove of Nidhivan in Vrindavan. His musical devotion was so deep and pure that the Divine Couple, Shri Radha and Krishna, appeared before him and manifested themselves in a single, combined deity form—Sri Bankey Bihari Ji. Swami Haridas taught that the ultimate spiritual destination is not cosmic liberation or majestic worship, but witnessing the confidential loving service of the Divine Couple in the eternal groves of Braj.\",\"biographyHi\":\"स्वामी हरिदास वृंदावन के रसिक शिरोमणि संत और भारतीय शास्त्रीय संगीत के महान आचार्य थे। उन्हें श्री राधा जी की प्रधान सखी श्री ललिता जी का साक्षात् अवतार माना जाता है। उन्होंने वृंदावन के निधिवन को अपनी साधना स्थली बनाया, जहाँ उनके संगीत अनुराग से खिंचकर युगल सरकार ने बांके बिहारी जी के रूप में प्रकट होकर दर्शन दिए। तानसेन और बैजू बावरा जैसे संगीत सम्राट इनके शिष्य थे। स्वामी जी ने सिद्ध किया कि भक्ति शुष्क तपस्या नहीं, बल्कि राग-रागिनियों के माध्यम से प्रभु चरणों में पूर्ण आत्मसमर्पण है।\",\"relatedSaints\":[{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"},{\"nameEn\":\"Shri Hariram Vyas\",\"nameHi\":\"श्री हरिराम व्यास\",\"slug\":\"hariram-vyas\"}],\"relatedGranthas\":[{\"nameEn\":\"Kelimal\",\"nameHi\":\"केलिमाल\",\"slug\":\"kelimal\"},{\"nameEn\":\"Siddhanta Pada\",\"nameHi\":\"सिद्धान्त के पद\",\"slug\":\"siddhanta-pada\"}],\"associatedGlossary\":[{\"termEn\":\"Nitya Vihar\",\"termHi\":\"नित्य विहार\",\"slug\":\"nitya-vihar\"},{\"termEn\":\"Nikunj\",\"termHi\":\"निकुंज\",\"slug\":\"nikunj\"},{\"termEn\":\"Sakhi Bhava\",\"termHi\":\"सखी भाव\",\"slug\":\"sakhi-bhava\"}],\"faq\":[{\"qEn\":\"Who was Swami Haridas?\",\"aEn\":\"Swami Haridas was a 16th-century rasik saint, musicologist, and founder of the Haridasi Sampradaya, renowned for manifesting the Bankey Bihari deity through his music in Nidhivan.\",\"qHi\":\"स्वामी हरिदास कौन थे?\",\"aHi\":\"स्वामी हरिदास 16वीं शताब्दी के एक महान रसिक संत, संगीतकार और हरिदासी संप्रदाय के प्रवर्तक थे, जिन्होंने अपने संगीत साधना से निधिवन में ठाकुर बांके बिहारी जी को प्रकट किया था।\"},{\"qEn\":\"Who were the famous disciples of Swami Haridas?\",\"aEn\":\"The legendary musicians Tansen (the royal singer of Akbar's court) and Baiju Bawra were disciples of Swami Haridas.\",\"qHi\":\"स्वामी हरिदास के प्रसिद्ध शिष्य कौन थे?\",\"aHi\":\"अकबर के दरबार के नवरत्नों में से एक संगीत सम्राट तानसेन और बैजू बावरा स्वामी हरिदास जी के प्रमुख शिष्य थे।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-124\",\"title\":\"रोम रोम रसना जो होती, तऊ तेरे गुन न बखाने जात\",\"category\":\"Shloka\",\"sanskrit_text\":\"रोम रोम रसना जो होती, तऊ तेरे गुन न बखाने जात |कहा कहों एक जीभ सखी री, बात की बात बात |श्री हरिदास के स्वामी श्याम कहत री, प्यारी तू राखत प्राण आधार |\",\"hindi_text\":\"श्री कृष्ण श्री राधा रानी से कहते हैं कि यहां तक कि मेरे पास लाखों जिव्हा बोलना के लिए होती हो भी मैं आपके समस्त गुणों का पूरी तरह से वर्णन नहीं कर सकता। दुर्भाग्य से, मुझे केवल एक जीभ मिली है। श्री हरिदास के शब्दों में, बिहारी जी ने बिहारीनी श्री राधा से कहा, \\\"प्यारी राधा आप, मेरे प्राणों का आधार हैं \\\"।\",\"english_text\":null,\"english_translation\":\"\\\"Rom Rom Rasna Jo Hoti, Tau Tere Gun Na Bakhane Jaat,\\nKaha Kahon Ek Jeebh Sakhi Ri, Baat Ki Baat Baat.\\nShri Haridas Ke Swami Shyam Kahat ri, Pyari Tu Rakhat Praan Aadhar\\\"\\n- Shri Haridas - Kelimal\\nO Radhe, Even if I possess millions of tongues inside every pore of my being, still I cannot describe your virtues completely. Unfortunately, I have got only one tongue. In the words of Shri Haridas, Bihariji says to Biharini Shri Radha, ”Pyari Ju, the treasure of my life is you!”.\",\"description\":\"https://www.brajrasik.org/hi/articles/5aac180a9f7ab760360f9bff/rom-rom-rasna-jo-hoti-tau-tere-gun-na-bakhane-jaat-kaha-kahon-ek-jeebh-sakhi-ri-baat-ki-baat-baat-shri-haridas-kelimal\",\"author\":\"श्री हरिदास, केलिमाल\",\"status\":\"published\",\"content_text\":\"रोम रोम रसना जो होती, तऊ तेरे गुन न बखाने जात |\\nकहा कहों एक जीभ सखी री, बात की बात बात |\\nश्री हरिदास के स्वामी श्याम कहत री, प्यारी तू राखत प्राण आधार |\\n- श्री हरिदास, केलिमाल\\nश्री कृष्ण श्री राधा रानी से कहते हैं कि यहां तक कि मेरे पास लाखों जिव्हा बोलना के लिए होती हो भी मैं आपके समस्त गुणों का पूरी तरह से वर्णन नहीं कर सकता। दुर्भाग्य से, मुझे केवल एक जीभ मिली है। श्री हरिदास के शब्दों में, बिहारी जी ने बिहारीनी श्री राधा से कहा, \\\"प्यारी राधा आप, मेरे प्राणों का आधार हैं \\\"।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5aac180a9f7ab760360f9bff/rom-rom-rasna-jo-hoti-tau-tere-gun-na-bakhane-jaat-kaha-kahon-ek-jeebh-sakhi-ri-baat-ki-baat-baat-shri-haridas-kelimal\",\"slug\":\"rom-rom-rasana-jo-hoti-tau-tere-gun-n-bakhane-jata\"},{\"id\":\"local-276\",\"title\":\"ऐसि तौ विचित्र जोरि बनी, ऐसि कहुँ देखि सुनि न बनी\",\"category\":\"Shloka\",\"sanskrit_text\":\"ऐसि तौ विचित्र जोरि बनी, ऐसि कहुँ देखि सुनि न बनी\",\"hindi_text\":\"श्री हरिदास जी कहते हैं की दिव्य दम्पति यह प्रिय प्रियतम की ऐसी जोरि है जो न तो कभी देखि है न सुनी है।\",\"english_text\":null,\"english_translation\":\"During the leela, Priyaji becomes Priytam \u0026 Priytam becomes Priyaji. After that, they merge into one. Swami Shri Haridas Ji says the divine couple’s leela is ever-new and no one has seen and listen this before.\",\"description\":\"https://www.brajrasik.org/hi/articles/58d5530211ec2c04484ebf9c/aisi-tau-vichitra-jori-bani-aisi-kahun-dekhi-suni-na-bani-swami-haridas-kelimal\",\"author\":\"श्री हरिदास, केलिमाल\",\"status\":\"published\",\"content_text\":\"ऐसि तौ विचित्र जोरि बनी, ऐसि कहुँ देखि

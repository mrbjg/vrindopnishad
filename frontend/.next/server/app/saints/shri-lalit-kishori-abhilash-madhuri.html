Shri Radha herself is seated in her name) he gets nectar of ultimate divine bliss. With this chant, both Radha Krishn gets pleased with the person and shower him the ultimate bliss and bless that devotee with their personal service. Each and every moment, the devotee's bliss keeps on increasing, with the effect of this 'Radha' name chanting and the image of the divine form of Biharini Shri Radha, is continually reflected in his heart. In the words of Shri Lalit Kishori, this 'Radha' name is the essence of all of the divine nectarine bliss cum pleasures and for all Rasik saints, this 'Radha' name is the basis of their life and soul.\",\"description\":\"https://www.brajrasik.org/hi/articles/5aac0abc9f7ab760360f9bf9/radhey-radhey-jo-jana-kahe-maha-prem-ras-soi-lahe-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"श्री ललित किशोरी  अभिलाष माधुरी\",\"status\":\"published\",\"content_text\":\"राधे राधे जो जन कहै। महा प्रेम रस सोई लह||\\nप्रिया लाल तिनके सुख ढरें। रीझि रीझि अंक में भरें||\\nछिन छिन अति आनंद बढ़ाये। श्री कुंज बिहारिनि निरखि सिहावें||\\nयही बात सब सुख को सार। रसिकनी जीवन प्रान अधार||\\n- श्री ललित किशोरी - अभिलाष माधुरी\\nललित किशोरी जी के शब्दों में जो जन श्री \\\"राधे राधे\\\" कहता है (यह मानकर की किशोरीजी उनके नाम में बैठी हैं ) वह महा प्रेम रस प्राप्त करता है। प्रिया लाल उनसे रीझ कर उनको परम सुख प्रदान करते हैं और अपनी निज सेवा देते हैं। उनका हर क्षण आनंद बढ़ता ही जाता है, इस राधा नाम के प्रभाव से और कुंज बिहारिनि श्री राधा के रूप की छवि उनके हृदय में छाई रहती है। श्री ललित किशोरी जी के शब्दों में यह राधा नाम सब रस एवम सुख का मानो सार ही है और रसिकों के प्राण जीवन का आधार है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5aac0abc9f7ab760360f9bf9/radhey-radhey-jo-jana-kahe-maha-prem-ras-soi-lahe-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radhe-radhe-jo-jan-kahai-maha-prem-ras-soi-lahai\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]

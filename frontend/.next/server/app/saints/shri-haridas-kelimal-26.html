:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"saints\",\"shri-haridas-kelimal-26\"],\"initialTree\":[\"\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shri-haridas-kelimal-26\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"shri-haridas-kelimal-26\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shri-haridas-kelimal-26\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"श्री हरिदास, केलिमाल (26)\\\",\\\"alternateName\\\":\\\"shri haridas, kelimal (26)\\\",\\\"description\\\":\\\"Vaishnava saint of the Braj tradition.\\\",\\\"url\\\":\\\"https://path.vrindopnishad.in/saints/shri-haridas-kelimal-26\\\",\\\"knowsAbout\\\":[\\\"Vaishnavism\\\",\\\"Bhakti Yoga\\\",\\\"Braj Rasik Heritage\\\",\\\"Vrindavan\\\"]}\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Home\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Saints\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/saints\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"shri haridas, kelimal (26)\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/saints/shri-haridas-kelimal-26\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-4xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Home\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Saints\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"shri haridas, kelimal (26)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री हरिदास, केलिमाल (26)\",\"hinglishName\":\"shri haridas, kelimal (26)\",\"slug\":\"shri-haridas-kelimal-26\",\"biography\":\"\",\"metadata\":{\"lineageEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"lineageHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"timelineEn\":\"1478–1573 AD (Vikram Samvat 1535 - 1630)\",\"timelineHi\":\"1478–1573 ईस्वी (विक्रम संवत 1535 - 1630)\",\"associatedPlacesEn\":\"Nidhivan, Vrindavan\",\"associatedPlacesHi\":\"निधिवन, वृंदावन\",\"discipleOfEn\":\"Shri Ashudhir Dev Ji (his father and guru)\",\"discipleOfHi\":\"श्री आशुधीर देव जी (पिता एवं गुरु)\",\"influencedByEn\":\"Nimbarka Sampradaya philosophy\",\"influencedByHi\":\"निम्बार्क संप्रदाय सिद्धांत\",\"associatedSampradayaEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"associatedSampradayaHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"devotionalMoodEn\":\"Nitya Vihar, Sakhi Bhava (Lalita Sakhi incarnate)\",\"devotionalMoodHi\":\"नित्य विहार, सखी भाव (ललिता सखी अवतार)\",\"teachingsEn\":\"Worship of the Divine Couple in the mood of Lalita Sakhi; focused purely on the eternal love-play (Nitya Vihar) in the secluded bowers (Nikunj) of Vrindavan, entirely devoid of majesty (aishwarya) or physical separation (viraha).\",\"teachingsHi\":\"ललिता सखी के भाव में युगल उपासना; वृंदावन के निकुंजों में होने वाले अखंड नित्य विहार रस पर पूर्ण ध्यान, जिसमें ऐश्वर्य भाव या वियोग का कोई स्थान नहीं है।\",\"literaryStyleEn\":\"Composed Kelimal (केलिमाल) and Siddhanta Pada (सिद्धान्त के पद) in sweet Braj Bhasha, characterized by deep musicality, classical raag notations, and intimate description of the Divine Couple's pastimes.\",\"literaryStyleHi\":\"मधुर ब्रजभाषा में 'केलिमाल' और 'सिद्धान्त के पद' की रचना की, जो राग-रागिनियों की शास्त्रीय विधा और निकुंज लीलाओं के सूक्ष्म चित्रण से परिपूर्ण हैं।\",\"biographyEn\":\"Swami Haridas was a spiritual master, classical music pioneer, and the founding acharya of the Haridasi Sampradaya. He is widely revered as the direct incarnation of Lalita Sakhi, the chief confidante of Srimati Radharani. Swami Haridas performed his intense bhajan in the sacred grove of Nidhivan in Vrindavan. His musical devotion was so deep and pure that the Divine Couple, Shri Radha and Krishna, appeared before him and manifested themselves in a single, combined deity form—Sri Bankey Bihari Ji. Swami Haridas taught that the ultimate spiritual destination is not cosmic liberation or majestic worship, but witnessing the confidential loving service of the Divine Couple in the eternal groves of Braj.\",\"biographyHi\":\"स्वामी हरिदास वृंदावन के रसिक शिरोमणि संत और भारतीय शास्त्रीय संगीत के महान आचार्य थे। उन्हें श्री राधा जी की प्रधान सखी श्री ललिता जी का साक्षात् अवतार माना जाता है। उन्होंने वृंदावन के निधिवन को अपनी साधना स्थली बनाया, जहाँ उनके संगीत अनुराग से खिंचकर युगल सरकार ने बांके बिहारी जी के रूप में प्रकट होकर दर्शन दिए। तानसेन और बैजू बावरा जैसे संगीत सम्राट इनके शिष्य थे। स्वामी जी ने सिद्ध किया कि भक्ति शुष्क तपस्या नहीं, बल्कि राग-रागिनियों के माध्यम से प्रभु चरणों में पूर्ण आत्मसमर्पण है।\",\"relatedSaints\":[{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"},{\"nameEn\":\"Shri Hariram Vyas\",\"nameHi\":\"श्री हरिराम व्यास\",\"slug\":\"hariram-vyas\"}],\"relatedGranthas\":[{\"nameEn\":\"Kelimal\",\"nameHi\":\"केलिमाल\",\"slug\":\"kelimal\"},{\"nameEn\":\"Siddhanta Pada\",\"nameHi\":\"सिद्धान्त के पद\",\"slug\":\"siddhanta-pada\"}],\"associatedGlossary\":[{\"termEn\":\"Nitya Vihar\",\"termHi\":\"नित्य विहार\",\"slug\":\"nitya-vihar\"},{\"termEn\":\"Nikunj\",\"termHi\":\"निकुंज\",\"slug\":\"nikunj\"},{\"termEn\":\"Sakhi Bhava\",\"termHi\":\"सखी भाव\",\"slug\":\"sakhi-bhava\"}],\"faq\":[{\"qEn\":\"Who was Swami Haridas?\",\"aEn\":\"Swami Haridas was a 16th-century rasik saint, musicologist, and founder of the Haridasi Sampradaya, renowned for manifesting the Bankey Bihari deity through his music in Nidhivan.\",\"qHi\":\"स्वामी हरिदास कौन थे?\",\"aHi\":\"स्वामी हरिदास 16वीं शताब्दी के एक महान रसिक संत, संगीतकार और हरिदासी संप्रदाय के प्रवर्तक थे, जिन्होंने अपने संगीत साधना से निधिवन में ठाकुर बांके बिहारी जी को प्रकट किया था।\"},{\"qEn\":\"Who were the famous disciples of Swami Haridas?\",\"aEn\":\"The legendary musicians Tansen (the royal singer of Akbar's court) and Baiju Bawra were disciples of Swami Haridas.\",\"qHi\":\"स्वामी हरिदास के प्रसिद्ध शिष्य कौन थे?\",\"aHi\":\"अकबर के दरबार के नवरत्नों में से एक संगीत सम्राट तानसेन और बैजू बावरा स्वामी हरिदास जी के प्रमुख शिष्य थे।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-597\",\"title\":\"प्यारी तेरी महिमा वरनी न जाय जिहिं आलस काम बस कीन\",\"category\":\"Shloka\",\"sanskrit_text\":\"प्यारी तेरी महिमा वरनी न जायजिहिं आलस काम बस कीन।ताकौ दंड हमैं लागत है री भए आधीन।साढे ग्यारह ज्यौं औंटि दूजे नव सत साजि सहज हीतामैं जवादि कर्पूर कस्तूरी कुमकुम के रंग भीन।श्रीहरिदास के स्वामी स्यामा कुंजबिहारी रस बस करि लीन।।\",\"hindi_text\":\"प्रियतम कह रहे हैं- आपकी महिमा का वर्णन मैं कैसे करुँ ? मुझे काम - प्रेम ने बस मे कर रखा और आप अति सुकुमारी हैं, आलस में केलि को बिसार दिया। आपके लिए मैं चाहना रुपी काम में भींज रहा हूँ, उसका दंड मुझे भरना पड़ रहा है क्योंकि कामना के आधीन हूँ।  आपने स्वर्ण समान तन में सोलहश्रृंगार कर रखा है। मेरा वर्ण तो श्याम है और आप के महा कंचन रुपी तन कुमकुम, कपूर, कस्तूरी, जावदि के सुगंध रंग से भीगा हुआ मनोहर है। श्री हरिदास जी की स्वामिनी श्री राधे जी ने श्याम कुञ्ज बिहारी को रस बस में लीन कर रखा है ।\",\"english_text\":null,\"english_translation\":\"Shri Lal Ji tells Ladli Ji “Oh Radha, I have no words or vocabulary to describe your greatness. I am like a mad cupid who is always engrossed in your divine, blissful beauty. I need you more than you need me. Your \\\"Madhurya\\\" has made me your slave. Swami Haridas Ji says Shyama Ji has enchanted Shyam Sundar Ji so much that he has sold himself in her hands. Ladli Ji on hearing this looked at Bihari Ji with a slide glance and came near him to assure him that she too loves him equally.\",\"description\":\"https://www.brajrasik.org/hi/articles/5902ff4c11ec2c04484ebff6/pyari-teri-mahima-barni-na-jaye-pad-by-swami-shri-haridas-ji\",\"author\":\"श्री हरिदास, केलिमाल (26)\",\"status\":\"published\",\"content_text\":\"(राग कानहारौं  )\\nप्यारी तेरी महिमा वरनी न जाय\\nजिहिं आलस काम बस कीन।\\nताकौ दंड हमैं लागत है री भए आधीन।\\nसाढे ग्यारह ज्यौं औंटि दूजे नव सत साजि सहज ही\\nतामैं जवादि कर्पूर कस्तूरी कुमकुम के रंग भीन।\\nश्रीहरिदास के स्वामी स्यामा कुंजबिहारी रस बस करि लीन।।\\nश्री हरिदास, केलिमाल (26)\\nप्रियतम कह रहे हैं- आपकी महिमा का वर्णन मैं कैसे करुँ ? मुझे काम - प्रेम ने बस मे कर रखा और आप अति सुकुमारी हैं, आलस में केलि को बिसार दिया। आपके लिए मैं चाहना रुपी काम में भींज रहा हूँ, उसका दंड मुझे भरना पड़ रहा है क्योंकि कामना के आधीन हूँ।  आपने स्वर्ण समान तन में सोलहश्रृंगार कर रखा है। मेरा वर्ण तो श्याम है और आप के महा कंचन रुपी तन कुमकुम, कपूर, कस्तूरी, जावदि के सुगंध रंग से भीगा हुआ मनोहर है। श्री हरिदास जी की स्वामिनी श्री राधे जी ने श्याम कुञ्ज बिहारी को रस बस में लीन कर रखा है ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5902ff4c11ec2c04484ebff6/pyari-teri-mahima-barni-na-jaye-pad-by-swami-shri-haridas-ji\",\"slug\":\"pyari-teri-mahima-varani-n-jay-jihin-alas-kam-bas-kina\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\"

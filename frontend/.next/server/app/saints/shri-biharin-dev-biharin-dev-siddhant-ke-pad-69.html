ple Shri Radha Krishn, never thinks about going out from the boundary of Vrindavan and its bliss!\",\"description\":\"https://www.brajrasik.org/hi/articles/5c0f83747e32750058872af4/ashta-sidhi-nav-nidhi-mukti-pad-dein-bauravat-deekh-shri-biharin-dev-ji-shri-biharin-dev-ji-ki-vani-69\",\"author\":\"श्री बिहारिन देव  बिहारिन देव जी की वाणी, सिद्धांत के पद (69)\",\"status\":\"published\",\"content_text\":\"अष्ट सिद्धि, नव निद्धि मुक्ति पद दें बौरावत दीख।\\nश्री बिहारी दास अनन्य न टरि हैं, तजि वृन्दावन बीख।\\n- श्री बिहारिन देव - बिहारिन देव जी की वाणी, सिद्धांत के पद (69)\\nश्री हरि सकामी लोगों को अष्ट सिद्धि, नव निद्धि एवं मुक्ति पद देकर बहका देते हैं, किन्तु युगल सरकार रस के अनन्य उपासक, निज वृन्दावन केलि महल की सीमा एवं रस को छोड़कर एक क्षण के लिए भी इन चक्करों में नहीं फसते।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5c0f83747e32750058872af4/ashta-sidhi-nav-nidhi-mukti-pad-dein-bauravat-deekh-shri-biharin-dev-ji-shri-biharin-dev-ji-ki-vani-69\",\"slug\":\"asht-siddhi-nav-niddhi-mukti-pad-den-bauravat-dikha\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0

ure and mind that he can not stay in one place steady even for a second. His style of love is also ever changing and he can not stay at one in love all the time. \"Apu ganwar, ganwar gwaal sanga, ati swatantra madamaat.\"\nHe himself is uncivilized and all his friends too are uneducated milk-boys. Thus he seems to be totally unrestrained and intoxicated in love all the time.\n\"Yaha “Kripalu” kacchu bata atapatee, rasika janana mana bhat.\"\nShri Kripalu Ji Mahaprabhu replies sarcastically on behalf of the sakhi, who was listening to all this, “O Sakhi! Is there not something, which is inscrutable in His personality? Since despite all these shortcomings, all the Rasiks adore Him.”\nLocation\n:\nKamara is located in Kokilavan.b:T1c91,"])</script><script>self.__next_f.push([1,"एक बार श्री कृष्ण कि श्री राधा से मिलने की इच्छा हुई । जिस मार्ग से श्री राधा रानी को आना था वे उसी मार्ग को ध्यान से देख रहे थे। श्री कृष्ण ने बांसुरी की धुन से श्री राधा नाम पुकारा। श्री राधा रानी और उनकी सखियाँ बांसुरी की धुन से मोहित हो कर श्री कृष्ण से मिलने के लिए निकल गई। गोपियों का श्री कृष्ण से साथ विनोद करने का मन था। गोपियों ने शब्द किये बिना श्री कृष्ण का कंबल चुरा लिया। श्री कृष्ण अपना कंबल ढूंढने लगे । भक्त कवि श्री सूरदास ने इस रस लीला का विस्तार से वर्णन किया है । इस कविता में कन्हैया यशोदा मैया से शिकायत करते है कि मैं गाय को चराने के लिए जंगल में गया था। वे दूर तक चली गयीं । मैं उन्हें ढूंढते हुए उनके पीछे चला गया और अपना कंबल वहीँ भूल गया। कुछ सखियों ने चुपचाप मेरा कंबल चुरा लिया। जब मैं लौटा तो कंबल मुझे नहीं मिला। मैंने सखियों से पूछा मेरा कंबल कहाँ है? यदि आपने इसे लिया है तो वापस कर दो। एक सखी बोली आपका कंबल यमुना में गिर गया और नीचे की तरफ बह गया। मैंने इसको अपनी आँखों से देखा था। एक और ने कहा कान्हा मैंने एक गाय को आपका कंबल खाते हुए देखा था। कान्हा मैया से कहते है कि मैया, मुझे बताओ कैसे एक भोली गाय कंबल खा सकती है और सखियों ने मुझसे कहा अगर आप मेरे सामने नृत्य करोगे तो मैं आपको एक नया कंबल दे दूंगी । मैया ये सखियाँ मुझे कई तरह से चिढ़ा रही हैं। यह कहते हुए कान्हा कि आँखें आंसू से भर गईं। मैया ने उसके लाला (श्री कृष्ण) को ऊपर उठाकर उनको अपने ह्रदय से लगा लिया। इस गाँव को कामर कहा जाता है क्योंकि कृष्ण पूरी तरह से प्रेम में लिप्त थे।और उत्सुकता से श्री राधा के लिए इंतजार कर रहे थे। इसका नाम कामर है क्योंकि श्री कृष्णा ने अपने काले कंबल या कामर के लिए पुकारा था। यहाँ गोपी-कुंड, गोपी-जल विहार, हरि-कुंड, मोहन-कुंड, और मोहन जी और दुर्वासा जी के मंदिर मिलते हैं।\nजगदगुरु श्री कृपालु जी महाराज द्वारा लिखित एक पद नीचे है:\nकामरी वारे पै, का मरी जात।\nकारो रंग कौन बड़ नीको, द्वै तातरु द्वै मात।\nअति बेपीर, अहीर जाति को, हरजाई बलभ्रात।\nगति - मति - रति अति चंचल अलि ज्यों, छिन थिर रहि न सकात।\nआपु गँवार, गँवार-ग्वार सँग, अति स्वतंत्र मदमात।\nयह ‘कृपालु’ कछु बात अटपटी, रसिक-जनन मनभात।।\n(प्रेम रस मदिरा:- मिलन–माधुरी) -जगद्गुरु श्री कृपालु जी महाराज।\nभावार्थ:-(एक सखी अपनी अंतरंग सखी से विनोद भरे शब्दों में प्रियतम श्यामसुन्दर की निन्दा-सी करती हुई कहती है।) अरी सखी! तू काली कामरी ओढ़ने वाले श्यामसुन्दर पर क्यों मरी जा रही है? तू ही बता उसके शरीर का काला रंग भला कौन-सा अच्छा रंग है? उसके दो बाप एवं दो माताएं हैं, वह अत्यन्त ही निष्ठुर है। उसकी जाति अहीर की है एवं वह बलराम का भाई अनंतानन्त गोपियों से प्रेम करता है। उसकी बुद्धि तथा उसका प्रेम भौंरे के समान इतना चंचल है कि एक क्षण भी स्थिर नहीं रह सकता। स्वयं अशिक्षित है (अध्ययन तो मथुरा जाने के पश्चात् किया था।) अशिक्षित ग्वालों का संग है। अपनी इच्छा से कार्य करने वाला तथा उन्मत्त भी है। अतएव तू उसके प्रेम में मतवारी मत बन। ‘श्री कृपालु जी’ कहते हैं कि अरी सखी! तू प्रेम की इन अन्तरंग अटपटी बातों को नहीं समझ सकती। इसे तो रसिकजन ही समझते हैं कि जिसका जिससे प्रेम हो जाता है वह किसी भी प्रकार छूट नहीं सकता। अतएव वह सर्वथा विवश है।\nस्थान\n:\nकामर कोकिला वन में स्थित है ।"])</script><script>self.__next_f.push([1,"d:[\"slug\",\"prem-ras-madira-milanamadhuri-jagadguru-shri-kripalu-maharaj\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"saints\",\"prem-ras-madira-milanamadhuri-jagadguru-shri-

ंदिर के नाम से भी जाना जाता है जो निधिवन के पास स्थित है। मंदिर का असली नाम ललित निकुंज है। मंदिर में राधा और कृष्ण की मूर्ति हैं। उनके छोटे आकार के कारण उन्हें छोटा राधा रमण भी कहा जाता है। मंदिर प्रांगण के पूर्व छोर पर, एक बड़ा हॉल है जिसे बसंती कमरा (दरबार हॉल) कहा जाता है जो बेल्जियम ग्लास के झूमर और अति सुंदर चित्रों से सुशोभित है जो भगवान राधा-कृष्ण के प्रेमपूर्ण अतीत को दर्शाता है। यह कमरा बसंत पंचमी के अवसर पर वर्ष में केवल दो बार खोला जाता है और इसके मध्य भाग में फव्वारे भी हैं। ललित किशोरी और ललित मोहिनी ठाकुर जी के सेवक यहां मौजूद हैं। मंदिर के पास श्री ललित किशोरी की समाधि भी स्थित है।\nवृंदावन जाने के बाद, श्री ललित किशोरी ने वृंदावन की पवित्र भूमि को कभी नहीं छोड़ने का संकल्प लिया, और उनके भाई ललित मोहिनी ने भी इसका पालन किया। उन्हें वृंदावन की रज से इतना लगाव था कि उन्होंने प्रकृति के आह्वान को सहजता से सोचा भी नहीं था। इसलिए उन्होंने आगरा की मिट्टी से बने बर्तनों में मूत्र और मल किया और उन्हें ब्रज से बाहर फेंक दिया जाता था ।\nमंदिर का समय:\nगर्मी\nसवेरे 7:30 बजे - मंगला आरती\nशाम  7:30 बजे - शयन आरती\nसर्दी\nसवेरे 08:30 बजे - मंगला आरती\nशाम  06:30 बजे - शयन आरती\nस्थान\n:\nशाहजी मंदिर निधिवन, वृन्दावन के पास है।"])</script><script>self.__next_f.push([1,"a:T4f1,due to its exquisite spiral pillars is located near Nidhivan. The temple’s real name is Lalit Nikunj. The temple has the deities of Radha and Krishna. The deities due to their small size are also called as chhote Radha Raman. On the east end of the temple courtyard, there is a large hall called as ‘Basanti Kamra’ (Durbar Hall) adorned with Belgian Glass chandeliers and exquisite paintings depicting the loving pastimes of Lord Radha-Krishna. This room is opened only twice a year during the occasion of Basant Panchami and also has fountains in its central part. Lalit Kishori and Lalit Mohini\nSevya Thakur\nare present here. Samadhi of Shri Lalit Kishori is also located near the temple.\nAfter moving to Vrindavan, Shri Lalit Kishori made a vow never to leave the holy land of Vrindavan, and his brother Lalit Mohini followed suit. He had so much love for the dust of Vrindavan that he found it impossible to even think of easing the call of nature upon it. So he used to pass urine and stool in pots made from Agra clay and have them couriered out of Braj for disposal.\nTimings of Temple:\nSummer\nMangla Aarti: 07:30 AM\nShayan Aarti: 07:30 PM\nWinter\nMangla Aarti: 08:30 AM\nShayan Aarti: 06:30 PM\nLocation:\nShahji temple is located near Nidhivan, Vrindavan.b:Tbde,"])</script><script>self.__next_f.push([1,"शाहजी मंदिर, इसके अति सुंदर टेड़े स्तंभ  है, जिसे टेड़े खंबे वाला मंदिर के नाम से भी जाना जाता है जो निधिवन के पास स्थित है। मंदिर का असली नाम ललित निकुंज है। मंदिर में राधा और कृष्ण की मूर्ति हैं। उनके छोटे आकार के कारण उन्हें छोटा राधा रमण भी कहा जाता है। मंदिर प्रांगण के पूर्व छोर पर, एक बड़ा हॉल है जिसे बसंती कमरा (दरबार हॉल) कहा जाता है जो बेल्जियम ग्लास के झूमर और अति सुंदर चित्रों से सुशोभित है जो भगवान राधा-कृष्ण के प्रेमपूर्ण अतीत को दर्शाता है। यह कमरा बसंत पंचमी के अवसर पर वर्ष में केवल दो बार खोला जाता है और इसके मध्य भाग में फव्वारे भी हैं। ललित किशोरी और ललित मोहिनी ठाकुर जी के सेवक यहां मौजूद हैं। मंदिर के पास श्री ललित किशोरी की समाधि भी स्थित है।\nवृंदावन जाने के बाद, श्री ललित किशोरी ने वृंदावन की पवित्र भूमि को कभी नहीं छोड़ने का संकल्प लिया, और उनके भाई ललित मोहिनी ने भी इसका पालन किया। उन्हें वृंदावन की रज से इतना लगाव था कि उन्होंने प्रकृति के आह्वान को सहजता से सोचा भी नहीं था। इसलिए उन्होंने आगरा की मिट्टी से बने बर्तनों में मूत्र और मल किया और उन्हें ब्रज से बाहर फेंक दिया जाता था ।\nमंदिर का समय:\nगर्मी\nसवेरे 7:30 बजे - मंगला आरती\nशाम  7:30 बजे - शयन आरती\nसर्दी\nसवेरे 08:30 बजे - मंगला आरती\nशाम  06:30 बजे - शयन आरती\nस्थान\n:\nशाहजी मंदिर निधिवन, वृन्दावन के पास है।"])</script><script>self.__next_f.push([1,"d:[\"slug\",\"tede-khambe-wala-mandir\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"saints\",\"tede-khambe-wal

([1,"\n11:I[1060,[],\"\"]\n9:Tcd8,"])</script><script>self.__next_f.push([1,"श्री रूप गोस्वामी भाव भक्ति पर पहुंचे हुए जीवों के लक्षण बताए हैं। यह लक्षण हर उस जीव में पाए जाते हैं जो भाव भक्ति पर पहुंच जाता है, यह नौ प्रकार के लक्षण इस प्रकार हैं:\n1)\nक्षान्ति:\nसहनशीलता । अत्यंत कष्ट एवं दुखद परिस्थिति में भी शांति एवं सहनशीलता बनाए रखना ।\n2)\nअव्यर्थ-कालत्वं:\nसमय का सदुपयोग। हर समय केवल श्री राधा रानी और श्री कृष्ण एवं गुरुदेव के वचनों एवं सेवा का ही स्मरण बना रहे और बिल्कुल भी समय का दुरुपयोग ना हो।\n3)\nविरक्ति:\nवैराग्य। इंद्रिय संतुष्टि की वस्तुओं के प्रति पूर्ण उदासीनता।\n4)\nमान-शुन्यता:\nझूठी प्रतिष्ठा का अभाव, स्वयं में मान न चाहना। इतनी विनम्रता हो की अपने में मान चाहने की भावना ही न हो।\n5)\nआशा-बन्धः\nहर समय आशा बंध रहना अर्थात हर क्षण अनुभव करना कि श्री राधा कृष्ण मुझ पर कृपा अवश्य करेंगे।\n6)\nसमुत्कण्ठा:\nअपना लक्ष्य अर्थात श्री राधा कृष्ण की सेवा प्राप्त करने की सर्वोच्च उत्कंठा।\n7)\nनाम-गाने सदा रुचिः\nअपने इष्ट देव अर्थात श्री राधा कृष्ण का नाम इतना अधिक प्रिय लगे कि उसको गाने एवं रटन की नित्य रुचि हो ।\n8)\nआसक्तिस् तद्-गुणाख्याने :\nअपने प्रभु के गुणों का गान करने  एवं वर्णन करने की भीतर से प्रगाढ़ आसक्ति हो।\n9)\nप्रीतिस् तद्-वसति-स्थले:\nभगवान के धाम जैसे श्री वृंदावन धाम से एवं वृंदावन वास करने की प्रीति हो।\nइन 9 लक्षणों से अपने आप को माप लेना चाहिए कि हम भाव भक्ति पर पहुंचे हैं या नहीं और अगर नहीं पहुंचे तो अभी बहुत साधना करने की आवश्यकता है।"])</script><script>self.__next_f.push([1,"a:T6c0,When bhakti is executed on the transcendental platform of pure goodness (suddha-sattva), it is like a sun-ray of love for Krishna. At such a time, bhakti causes the heart to be softened by various tastes, and one is then situated in bhava (ecstatic emotion).” There are 9 symptoms of Bhava Bhakti.\n\"kshantir avyartha-kalatvam viraktir mana-sunyata\nasa-bandhah samutkantha nama-gane sada rucih\nasaktis tad-gunakhyane pritis tad-vasati-sthale\nity-adayo ‘nubhavah syur jata-bhavankure jane\"\nBhakti-rasamrita-sindhu (1.3.1)\nVerse reveal nine symptoms which can be seen in the character of one who has achieved the stage of bhava. These symptoms are seen as an excellent criterion for determining advancement in bhakti, as opposed to other types of displays which may be easily imitated.\n1)\nKshanti\n: perseverance. Remaining tolerant and patient, even amid disturbance.\n2)\nAvyartha-kalatvam\n: utilization of time. Refers to constant engagement in devotional seva (service).\n3)\nVirakti: detachment\n. Completely indifferent to the objects of sense gratification.\n4)\nMana-shunyata\n: absence of false prestige or pridelessness. To feel humble, free from the longing for being shown respect.\n5)\nAsha-bandha\n: hope. To be always certain that Krishna will bestow His mercy on oneself.\n6)\nSamutkanta\n: An intense eagerness to achieve or ardent desire for attaining one’s desired supreme object (prema).\n7)\nNama-gane sada ruci\n: Thirst arising out of affection for constantly chanting the Lord’s holy names.\n8)\nAsaktis tad-gunakhyane\n: A natural attachment to describe the Lord’s most sweet qualities, pastimes, and so on.\n9)\nPritis tad-vasati-sthale\n: The desire to reside in the places of the Lord’s pastimes such as Vrindavana.b:Tf61,"])</script><script>self.__next_f.push([1,"क्षान्तिर् अव्यर्थ-कालत्वं विरक्तिर् मान-शुन्यता ।\nआशा-बन्धः समुत्कण्ठा नाम-गाने सदा रुचिः ॥१.३.२५॥\nआसक्तिस् तद्-गुणाख्याने प्रीतिस् तद्-वसति-स्थले ।\nइत्य् आदयो’नुभावाः स्युर् जात-भावाङ्कुरे जने ॥१.३.२६॥\n- भक्ति रसामृत सिंधु, श्रील रूप गोस्वामी\nश्री रूप गोस्वामी भाव भक्ति पर पहुंचे हुए जीवों के लक्षण बताए हैं। यह लक्षण हर उस जीव में पाए जाते हैं जो भाव भक्ति पर पहुंच जाता है, यह नौ प्रकार के लक्षण इस प्रकार हैं:\n1)\nक्षान्ति:\nसहनशीलता । अत्यंत कष्ट एवं दुखद परिस्थिति में भी शांति एवं सहनशीलता बनाए रखना ।\n2)\nअव्यर्थ-कालत्वं:\nसमय का सदुपयोग। हर समय केवल श्री राधा रानी और श्री कृष्ण एवं गुरुदेव के वचनों एवं सेवा का ही स्मरण बना रहे और बिल्कुल भी समय का दुरुपयोग ना हो।\n3)\nविरक्ति:\nवैराग्य। इंद्रिय संतुष्टि की वस्तुओं के प्रति पूर्ण उदासीनता।\n4)\nमान-शुन्यता:\nझूठी प्रतिष्ठा का अभाव, स्वयं में मान न चाहना। इतनी विनम्रता हो की अपने में मान चाहने की भावना ही न हो।\n5)\nआशा-बन्धः\nहर समय आशा बंध रहना अर्थात हर क्षण अनुभव करना कि श्री राधा कृष्ण मुझ पर कृपा अवश्य करेंगे।\n6)\nसमुत्कण्ठा:\nअपना लक्ष्य अर्थात श्री राधा कृष्ण की सेवा प्राप्त करने की सर्वोच्च उत्कंठा।\n7)\nनाम-गाने सदा रुचिः\nअपने इष्ट देव अर्थात श्री राधा कृष्ण का नाम इतना अधिक प्रिय लगे कि उसको गाने एवं रटन की नित्य रुचि हो ।\n8)\nआसक्तिस् तद्-गुणाख्याने :\nअपने प्रभु के गुणों का गान करने  एवं वर्णन करने की भीतर से प्रगाढ़ आसक्ति हो।\n9)\nप्रीतिस् तद्-वसति-स्थले:\nभगवान के धाम जैसे श्री वृंदावन धाम से एवं वृंदावन वास करने की प्रीति हो।\nइन 9 लक्षणों से अपने आप को माप लेना चाहिए कि हम भाव भक्ति पर पहुंचे हैं या नहीं और अगर नहीं पहुंचे तो अभी बहुत साधना करने की आवश्यकता है।"])</script><script>self.__next_f.push([1,"d:[\"slug\",\"bhakti-rasamrit-sindhu-shril-rup-gosvami\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"saints\",\"bhakti-rasamrit-sindhu-shril-rup-gosvami\"],\"initialTree\":[\"\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"bhakti-rasamrit-sindhu-shril-rup-gosvami\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"bhakti-rasamrit-sindhu-shril-rup-gosvami\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"bhakti-rasamrit-sindhu-shril-rup-gosvami\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"भक्ति रसामृत सिंधु, श्रील रूप गोस्वामी\\\",\\\"alternateName\\\":\\\"bhakti rasamrit sindhu, shril rup gosvami\\\",\\\"description\\\":\\\"Vaishnava saint of the Braj tradition.\\\",\\\"url\\\":\\\"https://path.vrindopnishad.in/saints/bhakti-rasamri

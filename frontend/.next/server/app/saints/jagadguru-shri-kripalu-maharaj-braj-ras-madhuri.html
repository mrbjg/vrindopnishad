"\\n- जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\\nपहले श्री राधा का नाम और फिर श्री कृष्ण का नाम उच्चारण करें। श्री राधा के बिना श्री कृष्ण की पूजा करना एक अपराध है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5aecb7ea9f7ab760360f9c4b/krishn-kahu-pachey-pratham-kahu-radha-shri-radha-taji-bhajat-shyam-apradha-quote-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"krishn-kahu-pachhe-pratham-kahu-radha\"},{\"id\":\"local-139\",\"title\":\"राधे राधे रटें श्याम\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधे राधे रटें श्याम, राधे रटें श्याम श्याम |राधे श्याम युगल नाम मेरो है जीवन ||\",\"hindi_text\":\"जगद्गुरु श्री कृपालु जी महाराज कहते हैं कि श्याम \\\"राधे राधे\\\" रटते है और राधा \\\"श्याम श्याम\\\" रटती हैं परन्तु दिव्य युगल का युगल नाम \\\"राधे श्याम\\\" मेरा जीवन है।\",\"english_text\":null,\"english_translation\":\"Jagadguru Shri Kripalu Ji Maharaj says, Shyam chants “Radhey Radhey” and Radhey chants “Shyam Shyam”. However Divine Couple's Yugal name ”Radhey Shyam” is my life.\",\"description\":\"https://www.brajrasik.org/hi/articles/5adf21aa9f7ab760360f9c35/radhey-radhey-ratein-shyam-radhey-ratein-shyam-shyam-radhey-shyam-yugal-naam-mero-hai-jeewan-jagadguru-shri-kripalu-ji-maharaj-braj-ras-madhuri\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\",\"status\":\"published\",\"content_text\":\"राधे राधे रटें श्याम, राधे रटें श्याम श्याम |\\nराधे श्याम युगल नाम मेरो है जीवन ||\\n- जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\\nजगद्गुरु श्री कृपालु जी महाराज कहते हैं कि श्याम \\\"राधे राधे\\\" रटते है और राधा \\\"श्याम श्याम\\\" रटती हैं परन्तु दिव्य युगल का युगल नाम \\\"राधे श्याम\\\" मेरा जीवन है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5adf21aa9f7ab760360f9c35/radhey-radhey-ratein-shyam-radhey-ratein-shyam-shyam-radhey-shyam-yugal-naam-mero-hai-jeewan-jagadguru-shri-kripalu-ji-maharaj-braj-ras-madhuri\",\"slug\":\"radhe-radhe-raten-shyama\"},{\"id\":\"local-157\",\"title\":\"नित सेवा मांगूँ श्यामा श्याम तेरी, न भुक्ति नाहीं मुक्ति मांगूँ मैं\",\"category\":\"Shloka\",\"sanskrit_text\":\"नित सेवा मांगूँ श्यामा श्याम तेरी, न भुक्ति नाहीं मुक्ति मांगूँ मैं।\",\"hindi_text\":\"हे श्री श्यामा श्याम मैं केवल आपकी सेवा मांगती हूँ, न मुझे मुक्ति चाहित न भुक्ति।\",\"english_text\":null,\"english_translation\":\"Oh Radha Krishn I desire only selfless service of Yours and wish that my selfless devotion increases every moment. I have no desire for Bhukti (Luxuries) and Mukti (Liberation).\",\"description\":\"https://www.brajrasik.org/hi/articles/5900fe8111ec2c04484ebff4/nita-sewa-mangu-shyama-shyam-teri-jagadguru-shri-kripaluji-maharaj\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\",\"status\":\"published\",\"content_text\":\"नित सेवा मांगूँ श्यामा श्याम तेरी, न भुक्ति नाहीं मुक्ति मांगूँ मैं।\\n- जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\\nहे श्री श्यामा श्याम मैं केवल आपकी सेवा मांगती हूँ, न मुझे मुक्ति चाहित न भुक्ति।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5900fe8111ec2c04484ebff4/nita-sewa-mangu-shyama-shyam-teri-jagadguru-shri-kripaluji-maharaj\",\"slug\":\"nit-seva-mangun-shyama-shyam-teri-n-bhukti-nahin-mukti-mangun-main\"},{\"id\":\"local-210\",\"title\":\"हमारी राधे रानी रस की खानी\",\"category\":\"Shloka\",\"sanskrit_text\":\"हमारी राधे रानी रस की खानी,विराजें नित वृन्दावन रजधानी ||\",\"hindi_text\":\"हमारी श्री राधा रस की खान हैं। इनकी राजधानी श्री वृंदावन धाम है और वह हर पल वहां उपस्थित हैं।\",\"english_text\":null,\"english_translation\":\"Our Shri Radha is the treasure of sweet nectar. Her capital is Shri Vrindavan and She is present there every moment.\",\"description\":\"https://www.brajrasik.org/hi/articles/5afa85839f7ab760360f9c59/humari-radhey-rani-ras-ki-khani-virajein-nita-vrindavan-rajdhani-jagadguru-shri-kripalu-ji-maharaj-braj-ras-madhuri\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\",\"status\":\"published\",\"content_text\":\"हमारी राधे रानी रस की खानी,\\nविराजें नित वृन्दावन रजधानी ||\\n- जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\\nहमारी श्री राधा रस की खान हैं। इनकी राजधानी श्री वृंदावन धाम है और वह हर पल वहां उपस्थित हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5afa85839f7ab760360f9c59/humari-radhey-rani-ras-ki-khani-virajein-nita-vrindavan-rajdhani-jagadguru-shri-kripalu-ji-maharaj-braj-ras-madhuri\",\"slug\":\"hamari-radhe-rani-ras-ki-khani\"},{\"id\":\"local-318\",\"title\":\"माया की कौन कहे, मायापति घबराये\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\" माया की कौन कहे, मायापति घबराये,ओह माँ श्यामा तेरी जो चरण शरण आये || \\\"\",\"hindi_text\":\"माया के बारे में क्या कहना है, यहां तक कि माया के शासक (श्री कृष्ण) भी उनसे डरते हैं जो श्री राधा के चरणों में आश्रय लेते हैं।\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5b10dee29f7ab760360f9c74/maya-ki-kaun-kahe-mayapati-ghabraaye-o-maa-shyama-teri-jo-charan-sharan-aaye-jagadguru-shri-kripalu-ji-maharaj-braj-ras-madhuri\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\",\"status\":\"published\",\"content_text\":\"\\\" माया की कौन कहे, मायापति घबराये,\\nओह माँ श्यामा तेरी जो चरण शरण आये || \\\"\\n- जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\\nमाया के बारे में क्या कहना है, यहां तक कि माया के शासक (श्री कृष्ण) भी उनसे डरते हैं जो श्री राधा के चरणों में आश्रय लेते हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b10dee29f7ab760360f9c74/maya-ki-kaun-kahe-mayapati-ghabraaye-o-maa-shyama-teri-jo-charan-sharan-aaye-jagadguru-shri-kripalu-ji-maharaj-braj-ras-madhuri\",\"slug\":\"maya-ki-kaun-kahe-mayapati-ghabaraye\"},{\"id\":\"local-328\",\"title\":\"है चाह\\\" कृपालु\\\" मेरी, तेरी ही कहलाये\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\"है चाह\\\" कृपालु\\\" मेरी, तेरी ही कहलाये,भूले भटके कबहुँ, तव सेवा मिल जाये |\\\"\",\"hindi_text\":\"हे श्री राधा, मेरी यही इच्छा है कि मैं आपकी ही केवल कहलाऊँ, और भूले भटके देर से ही सही, मुझे आपकी सेवा प्राप्त हो जाए।\",\"english_text\":null,\"english_translation\":\"Oh, Radha ! My only wish to be called yours alone and by your grace, I would definitely get an opportunity to serve you.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4b3be759e8c72a534d8670/hei-chaaha-kripalu-meri-teri-hee-kahalaye-bhule-bhatake-kabahun-tava-seva-mila-jaye-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\",\"status\":\"published\",\"content_text\":\"\\\"है चाह\\\" कृपालु\\\" मेरी, तेरी ही कहलाये,\\nभूले भटके कबहुँ, तव सेवा मिल जाये |\\\"\\n- जगद्गुरु श्री कृपालु जी महाराज, ब्रज रस माधुरी\\nहे श्री राधा, मेरी यही इच्छा है कि मैं आपकी ही केवल कहलाऊँ, और भूले भटके देर से ही सही, मुझे आपकी सेवा प्राप्त हो जाए।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4b3be759e8c72a534d8670/hei-chaaha-kripalu-meri-teri-hee-kahalaye-bhule-bhatake-kabahun-tava-seva-mila-jaye-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"hai-chah-kripalu-meri-teri-hi-kahalaye\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\

बियोग महा जोगी लौं, जागत ही बीतत जुग जाम॥ [2]\nकबहुंक किसल पीठ रचि पचि कै, कबहुंक पाठ करत गुन ग्राम।\nकबहुंक लोचन मूदि मौन ह्वै, चित चिंतत ये अंग अभिराम॥ [3]\nतरपन नैन हृदै होमत हवि, बिप्र भोज बोलत बिश्राम।\nसूर स्याम कृस गात सकल अंग, दरसन दै पिय पुजवहु काम॥ [4]\n- श्री सूरदास जी\nहे श्री राधा! जब से श्री कृष्ण ने आपका नाम सुना है तब से \"हा राधा, हा राधा\" बस यही मंत्र नित्य जप रहे हैं। [1]\nअपने प्रिय सखाओं को छोड़कर श्री कृष्ण रात्रि में यमुना तट पर निकुंज में रहते हैं और आपके वियोग के विरह में महान योगी की भांति संपूर्ण रात्रि जागते हुए व्यतीत करते हैै एवं हर प्रहर युगों के समान अनुभव करते हैं। [2]\nकभी-कभी वह स्वयं पत्तों की शय्या का निर्माण करते हैं, कभी-कभी आपके गुणों का गान करते हैं, कभी-कभी वह हर प्रकार से मौन होकर अपनी आँखें बंद कर लेतें हैं और आपके अंग-प्रत्यंगों का ध्यान करते हैं! [3]\nश्री कृष्ण की आँखें आपको देखने के लिए तड़प रही हैं, उनका हृदय आपके वियोग में यज्ञ की प्रतिक्षण वर्धमान अग्नि की भांति जल रही है। श्री कृष्ण का सम्पूर्ण शरीर भोजन न करने के कारण अब दुर्बल हो गया है। श्री सुरदास जी कहते हैं, \"हे श्री राधे! श्री कृष्ण को शीघ्र अपना दर्शन दीजिये एवं उनकी इच्छा पूर्ण कीजिये।\" [4]"])</script><script>self.__next_f.push([1,"b:[\"slug\",\"shri-suradasa\",\"d\"]\n10:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"saints\",\"shri-suradasa\"],\"initialTree\":[\"\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shri-suradasa\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"shri-suradasa\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shri-suradasa\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"श्री सूरदास\\\",\\\"alternateName\\\":\\\"shri suradasa\\\",\\\"description\  अब वह भी चला गया हमारा नहीं रहा ।\",\"english_text\":null,\"english_translation\":\"Braj Gopis say to Uddhav: “There is only one mind, not ten or twenty. It can be attached to either Radha Krishn or anything else.\\\"\",\"description\":\"https://www.brajrasik.org/hi/articles/58d5551411ec2c04484ebfa3/udho-man-na-bhaye-das-bees-soordas\",\"author\":\"श्री सूरदास जी\",\"status\":\"published\",\"content_text\":\"उधो, मन न भए दस बीस - श्री सूरदास\\n- श्री सूरदास जी\\nगोपियां कहती है, हे उद्धव, मन तो हमारा एक ही है, दस-बीस मन तो हैं नहीं कि एक को किसी के लगा दें और दूसरे को किसी और में। अब वह भी नहीं है, कृष्ण के साथ अब वह भी चला गया हमारा नहीं रहा ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/58d5551411ec2c04484ebfa3/udho-man-na-bhaye-das-bees-soordas\",\"slug\":\"dhani-dhani-dhani-haun-kunvari-radhika\"},{\"id\":\"local-301\",\"title\":\"धनि धनि धनि हौं कुँवरि राधिका\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ धनि धनि धनि हौं कुँवरि राधिका, नंदनंदन जा सौं रति मानी | ”\",\"hindi_text\":\"नित्य किशोर श्री राधारानी धन्य, धन्य, धन्य हैं जिन्हे स्वयं नंदनंदन अपनी रति मानते हैं |\",\"english_text\":null,\"english_translation\":\"All Glories to Shri Radha, the one who is ever youthful. Even Lord Krishn desires you all the time.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4f34fa59e8c72a534d86e1/dhani-dhani-dhani-haun-kunwari-radhika-nandnandan-ja-son-rati-maani-shri-soordas-ji\",\"author\":\"श्री सूरदास जी\",\"status\":\"published\",\"content_text\":\"“ धनि धनि धनि हौं कुँवरि राधिका, नंदनंदन जा सौं रति मानी | ”\\n- श्री सूरदास जी\\nनित्य किशोर श्री राधारानी धन्य, धन्य, धन्य हैं जिन्हे स्वयं नंदनंदन अपनी रति मानते हैं |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4f34fa59e8c72a534d86e1/dhani-dhani-dhani-haun-kunwari-radhika-nandnandan-ja-son-rati-maani-shri-soordas-ji\",\"slug\":\"dhani-dhani-dhani-haun-kunvari-radhika\"},{\"id\":\"local-513\",\"title\":\"जब तै श्रवन सुन्यौ तेरौ नाम\",\"category\":\"Shloka\",\"sanskrit_text\":\"जब तै श्रवन सुन्यौ तेरौ नाम।तब तै हा राधा राधा हरि, इहै जु मंत्र जपत दुरि दाम॥ [1]रहत निकुंज निसि कालिंद्री तट, सुहृद सखा छाडे सुख धाम।बिरह बियोग महा जोगी लौं, जागत ही बीतत जुग जाम॥ [2]कबहुंक किसल पीठ रचि पचि कै, कबहुंक पाठ करत गुन ग्राम।कबहुंक लोचन मूदि मौन ह्वै, चित चिंतत ये अंग अभिराम॥ [3]तरपन नैन हृदै होमत हवि, बिप्र भोज बोलत बिश्राम।सूर स्याम कृस गात सकल अंग, दरसन दै पिय पुजवहु काम॥ [4]\",\"hindi_text\":\"हे श्री राधा! जब से श्री कृष्ण ने आपका नाम सुना है तब से \\\"हा राधा, हा राधा\\\" बस यही मंत्र नित्य जप रहे हैं। [1]\\nअपने प्रिय सखाओं को छोड़कर श्री कृष्ण रात्रि में यमुना तट पर निकुंज में रहते हैं और आपके वियोग के विरह में महान योगी की भांति संपूर्ण रात्रि जागते हुए व्यतीत करते हैै एवं हर प्रहर युगों के समान अनुभव करते हैं। [2]\\nकभी-कभी वह स्वयं पत्तों की शय्या का निर्माण करते हैं, कभी-कभी आपके गुणों का गान करते हैं, कभी-कभी वह हर प्रकार से मौन होकर अपनी आँखें बंद कर लेतें हैं और आपके अंग-प्रत्यंगों का ध्यान करते हैं! [3]\\nश्री कृष्ण की आँखें आपको देखने के लिए तड़प रही हैं, उनका हृदय आपके वियोग में यज्ञ की प्रतिक्षण वर्धमान अग्नि की भांति जल रही है। श्री कृष्ण का सम्पूर्ण शरीर भोजन न करने के कारण अब दुर्बल हो गया है। श्री सुरदास जी कहते हैं, \\\"हे श्री राधे! श्री कृष्ण को शीघ्र अपना दर्शन दीजिये एवं उनकी इच्छा पूर्ण कीजिये।\\\" [4]\",\"english_text\":null,\"english_translation\":\"Shri Surdas says, Ever since the name of Shri Radha has entered Shri Krishn's ears, He is chanting only this Mantra \\\"Radha Radha\\\". [1]\\nHe is staying late at night near Yamuna at Nikunj, Vrindavan groves, leaving alone all his friends, happiness and home. He yearns for you. Like a great Yogi He is constantly wakeful through hours that are ages for him. [2]\\nSometimes He spreads himself a bed of tender leaves; sometimes He chants your treasure house of virtues; Sometimes He closes his eyes in utter silence and meditates on every limb of yours! [3]\\nHis eyes are agonizing to see you, His heart turned into fire-oblation in your separation. So as Shri Krishn's whole body is lean now because of having no meal. Says Sura Das, let Him see you Oh Radhe, Fulfill his desire! [4]\",\"description\":\"https://www.brajrasik.org/hi/articles/5d9e438b707a670060edfedd/jab-tai-shravan-sunyau-terau-naam-shri-surdas-ji\",\"author\":\"श्री सूरदास जी\",\"status\":\"published\",\"content_text\":\"$9\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d9e438b707a670060edfedd/jab-tai-shravan-sunyau-terau-naam-shri-surdas-ji\",\"slug\":\"jab-tai-shravan-sunyau-terau-nama\"},{\"id\":\"local-607\",\"title\":\"'रस की बात मधुप नीरस सुन रसिक होय सो जानै'\",\"category\":\"Shloka\",\"sanskrit_text\":\"रस की बात मधुप नीरस सुन रसिक होय सो जानै।\",\"hindi_text\":\"गोपियों द्वारा ज्ञानी उद्धव को उत्तर: रस की वार्ता नीरस हृदय को नहीं भाती, वह केवल रसिक हृदय से ही समझी एवं ग्रहण की जाती है।\",\"english_text\":null,\"english_translation\":\"Gopis reply to Uddhav Gyani: The necatrine talks of bliss can't be understood and relished by the monotonous heart. Only Rasik heart can understand the matters of Rasa (nectar).\",\"description\":\"https://www.brajrasik.org/hi/articles/5db06ecd8d4cd6006046501d/ras-ki-baat-madhup-niras-sun-rasik-hoy-so-jaanai-shri-surdas-ji\",\"author\":\"श्री सूरदास जी\",\"status\":\"published\",\"content_text\":\"रस की बात मधुप नीरस सुन रसिक होय सो जानै।\\n- श्री सूरदास जी\\nगोपियों द्वारा ज्ञानी उद्धव को उत्तर: रस की वार्ता नीरस हृदय को नहीं भाती, वह केवल रसिक हृदय से ही समझी एवं ग्रहण की जाती है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5db06ecd8d4cd6006046501d/ras-ki-baat-madhup-niras-sun-rasik-hoy-so-jaanai-shri-surdas-ji\",\"slug\":\"ras-ki-bat-madhup-niras-sun-rasik-hoy-so-janai\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/cbf73327883ccb7f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/fe995a1e4635138b.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/848f1edf91a8622f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"className\":\"dark\",\"children\":[\"$\",\"body\",null,{\"className\":\"antialiased\",\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[\"$\",\"title\",null,{\"children\":\"404: This page could not be found.\"}],[\"$\",\"div\",null,{\"style\":{\"fontFamily\":\"system-ui,\\\"Segoe UI\\\",Roboto,Helvetica,Arial,sans-

ं में सुगन्धित तेल लगाउंगी ?\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b66990ef96927004faaba74/swamini-kab-yon-tumhe-ladaun-shri-kishori-ali-kishori-ali-granthwali\",\"slug\":\"svamini-kab-yaun-tumhe-laaun\"},{\"id\":\"local-631\",\"title\":\"जय जय श्री वृन्दावन धाम\",\"category\":\"Shloka\",\"sanskrit_text\":\"जय जय श्री वृन्दावन धाम,सब सुख दैंन परम हितकारी, रसिकन कौ विश्राम |अली किशोरी कौन कहे गुन, निज गुन गावत श्याम |\",\"hindi_text\":\"श्री अली किशोरी जी कहते हैं, श्री वृन्दावन धाम की जय हो जय हो, क्योंकि श्री वृन्दावन धाम परम हितकारी है, यह सब सुखों को देने वाला एवं रसिको का विश्राम है । जिस वृन्दावन धाम के गुणगान स्वयं श्री कृष्ण करते है तो फिर इसके बारे में कौन क्या कहे ?\",\"english_text\":null,\"english_translation\":\"All Glories to Shri Vrindavan Dham. The divine place provides ultimate bliss, is supreme auspicious and resting place of the Rasik saints. Shri Ali Kishori says, What else I or anyone else can say, Even Shri Krishn himself sings the glories of Vrindavan all the time.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b27f0c39f7ab760360f9ca4/jai-jai-shri-vrindavan-dham-sab-sukh-dain-param-hitakari-rasikan-kou-vishram-ali-kishori-kaun-kahe-gun-nij-gun-gavat-shyam-shri-ali-kishori-shri-kishori-ali-granthawali\",\"author\":\"श्री अली किशोरी, श्री किशोरी अली ग्रंथवाली\",\"status\":\"published\",\"content_text\":\"जय जय श्री वृन्दावन धाम,\\nसब सुख दैंन परम हितकारी, रसिकन कौ विश्राम |\\nअली किशोरी कौन कहे गुन, निज गुन गावत श्याम |\\n- श्री अली किशोरी, श्री किशोरी अली ग्रंथवाली\\nश्री अली किशोरी जी कहते हैं, श्री वृन्दावन धाम की जय हो जय हो, क्योंकि श्री वृन्दावन धाम परम हितकारी है, यह सब सुखों को देने वाला एवं रसिको का विश्राम है । जिस वृन्दावन धाम के गुणगान स्वयं श्री कृष्ण करते है तो फिर इसके बारे में कौन क्या कहे ?\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":

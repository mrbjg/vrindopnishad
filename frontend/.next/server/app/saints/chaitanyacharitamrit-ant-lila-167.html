</script><script>self.__next_f.push([1,"श्री रूप गोस्वामी ने एक बार विचार किया, \"श्री चैतन्य महाप्रभु जी की अंततः हृदय की इच्छा को पूरा करने के लिए, मैं एक नाटक लिखूंगा । इस नाटक में मैं वृंदावन में श्री राधा और श्री कृष्ण के केली लीलाओं की सुंदरता को समझाऊंगा, और उनका वियोग भी, जब भगवान श्री कृष्ण वृन्दावन को छोड़ देंगे और मथुरा और द्वारिका जाएंगे।\"\nउन्होंने इस बारे में लिखना चाहा, लेकिन जब वह जगन्नाथ पुरी की तरफ जा रहे थे, तब सत्यभामा-देवी, भगवान श्री कृष्ण की प्रमुख रानी, उन्हें स्वप्न में दिखाई पड़ीं और उनसे कहा, \"कृपया केवल एक नाटक न लिखें । इस नाटक को दो भागों में विभाजित करें। \"\nफिर, जब श्री रूप गोस्वामी जी अंततः जगन्नाथ पुरी पहुंचे और श्री चैतन्य महाप्रभुजी के सम्मुख उपस्थित हुए, तब उन्होंने स्वप्न की पुष्टि करने हेतु श्री महाप्रभुजी से स्वप्न की बात बताई की उनके स्वप्न में श्रीमती सत्यभामा ने क्या आदेश किया है । श्रीमन्महाप्रभु ने उन्हें बताया, \"श्री कृष्ण को वृन्दावन से अलग न करो ।\"\nचैतन्य-चरितामृत (अंत लीला 1.67):\nभगवान श्री चैतन्य महाप्रभुजी ने श्री रूप गोस्वामी जी से कहा \"श्री कृष्ण को यदुकुमार के रूप में जाना जाता है । वासुदेव श्री कृष्ण और नंदनंदन श्री कृष्ण, यह दोनों एक नहीं, भिन्न हैं । यदुकुमार श्री कृष्ण मथुरा और द्वारका के नगरों में अपनी लीला प्रकट करते हैं, लेकिन नंद महाराज के पुत्र श्री कृष्ण, किसी भी परिस्थिति में वृंदावन कभी नहीं छोड़ते हैं। वे वृंदावन से एक पग भी बाहर नहीं रखते । \"\nश्री कृष्ण, जो श्री राधा से प्रेम करते हैं, वह कभी वृंदावन से बाहर नहीं जाते हैं, वस्तुतः, यह रहस्य बहुत कम लोग ही जनतें हैं । अपने प्रेमी सहयोगियों को सर्वोच्च रस प्रदान करने के लिए और स्वयं आनंद लेने के लिए, श्री कृष्ण ने वृन्दावन में श्री राधारानी के साथ अपने शुद्ध प्रेम स्वरुप से ही प्रकट रहते हैं । इसलिए वृंदावन के रसिक लिखते हैं: \"हमरो मुरली वारो श्याम\" (बांसुरी धारक श्री कृष्ण ही हमारा है)। बांसुरी धारक वृन्दावन के श्री कृष्ण ही हमारे हैं, इसलिए हमको मथुरा या द्वारका वाले श्री कृष्ण के बारे में नहीं मालूम।"])</script><script>self.__next_f.push([1,"a:T77a,Once Roop Goswami thought, “In order to fulfill the innermost heart’s desire of Sri Chaitanya Mahaprabhu, I will write a drama. In this drama I will explain the beauty of the union of Shri Radha and Sri Krishna in Vrindavan, and also Their separation pastimes, when Lord Krishna leaves Vrindavan and goes to Mathura and Dwarka.\"\nHe intended to write about this, but while he was traveling towards Jagannath Puri, then Satyabhama-devi, Lord Krishna’s chief queen, appeared to him in a dream and told him, “Please don’t make only one drama. Please divide it into two parts.”\nThen, when Srila Roop Goswami finally arrived at Jagannatha Puri and met with Sri Chaitanya Mahaprabhu, He confirmed what he had heard from Srimati Satyabhama in his dream. Sriman Mahaprabhu told him, “Don’t take Sri Krishna out of Vrindavan.”\nChaitanya-charitamrita (Antya 1.67):\nkrishno ’nyo yadu-sambhuto\nyah purnah so ’sty atah parah\nvrindavanam parityajya\nsa kvachin naiva gachchati\nLord Chaitanya Mahaprabhu told Rupa Goswami. “The Krishna known as Yadukumara is Vasudeva Krishna. He is different from the Krishna who is the son of Nanda Maharaja. Yadukumara Krishna manifests his pastimes in the cities of Mathura and Dwaraka, but Krishna, the son of Nanda Maharaja never leaves Vrindavan at any cost. He never takes an inch of step outside Vrindavan.”\nShri Krishna, the one who is soul beloved of Radha, he never goes out of Vrindavan, however, this mystery is known to very few people only. To give supreme pleasure to His loving associates and even to relish His own wonderful pastimes, Sri Krishna manifested in Vrindavan in his pure Madhurya form with Radharani. Therefore Rasik Saints of Vrindavan used to recite: \"Humaro Murali Waaro Shyam\" (The flute holder Krishna is ours only). The flute holder Krishna is only our, all in all, we don't want or try to know much about Krishna of Mathura or Dwarka.b:T121a,"])</script><script>self.__next_f.push([1,"श्री रूप गोस्वामी ने एक बार विचार किया, \"श्री चैतन्य महाप्रभु जी की अंततः हृदय की इच्छा को पूरा करने के लिए, मैं एक नाटक लिखूंगा । इस नाट

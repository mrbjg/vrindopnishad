ितवनि से किस भांति श्री लाल जी के चित्त का आकर्षण कर रखा है कि लालजी एक क्षण के लिए आपसे अपनी पलकें झपकाना ही भूल गए हैं। श्री विट्ठल विपुल देव जी कहते हैं कि बिहारी यूँ तो प्रत्येक क्षण आपके संग ही बिराजते हैं, परन्तु उनकी ललक एवं प्यास बढ़ती ही जा रही है।\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5c10b6881516e700594614b7/ras-bas-hota-laal-pyari-shri-vitthal-vipul-dev-ji\",\"author\":\"श्री विठ्ठल विपुल देव जी, श्री विठ्ठल विपुल देव जू की वाणी (17)\",\"status\":\"published\",\"content_text\":\"(राग सारंग)\\nरस बस होत लाल प्यारी तेरी बदन झलक ।\\nअपनें सहज सुभाव की माधुरी बनी है ललाट पर पतरी अलक ॥\\nकौन हूँ भाँति चितवनि चितयौ तबतें मोहनजू की न लागें पलक।\\nश्रीबीठलबिपुल बिनोद बिहारी सों हिल-मिलि जैसे बाढ़ै छिन छिन मदन ललक॥\\n- श्री विठ्ठल विपुल देव जी, श्री विठ्ठल विपुल देव जू की वाणी (17)\\nहे श्री राधिका प्यारी, श्याम सुन्दर आपके रस के नित्य ही वशीभूत रहते हैं, आपके दिव्य स्वरुप की हर क्षण, एक झलक पाने के लिए लालायित रहते हैं। आपके सहज स्वाभाव की माधुरी और ललाट पर काली घुंघराली लटों की शोभा अनिर्वचनीय है। आपने तिरछी चितवनि से किस भांति श्री लाल जी के चित्त का आकर्षण कर रखा है कि लालजी एक क्षण के लिए आपसे अपनी पलकें झपकाना ही भूल गए हैं। श्री विट्ठल विपुल देव जी कहते हैं कि बिहारी यूँ तो प्रत्येक क्षण आपके संग ही बिराजते हैं, परन्तु उनकी ललक एवं प्यास बढ़ती ही जा रही है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5c10b6881516e700594614b7/ras-bas-hota-laal-pyari-shri-vitthal-vipul-dev-ji\",\"slug\":\"ras-bas-hot-lal-pyari-teri-badan-jhalaka\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"t

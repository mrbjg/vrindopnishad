ic/chunks/4785-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"ClientProvi"])</script><script>self.__next_f.push([1,"ders\"]\n1a:I[1060,[],\"\"]\n6:T1d8f,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"आजु निकुंज मंजु में खेलत\",\"description\":\"https://www.brajrasik.org/hi/articles/5a9d8c2e9f7ab760360f9bef/aaju-nikunj-manju-mein-khelat-naval-kishor-naveel-kisori-shri-hita-harivansh-mahaprabhu-hit-chaturasi-7\",\"articleBody\":\"आजु निकुंज मंजु में खेलत, नवल किसोर नवीन किसोरी |  अति अनुपम अनुराग परसपर, सुनि अभूत भूतल पर जोरी ||विद्रुम फटिक विविध निर्मित धर, नव कर्पूर पराग न थोरी |  कौंमल किसलय सैंन सुपेसल, तापर स्याम निवेसित गोरी ||मिथुन हास परिहास परायन, पीक कपोल कमल पर झोरी |  गौर स्याम भुज कलह मनोहर, नीवी बंधन मोचत डोरी ||हरि उर मुकुर बिलोकि अपनपी, विभ्रम विकल मान जुत भोरी |  चिबुक सुचारु प्रलोइ प्रवोधत, पिय प्रतिबिंब जनाइ निहोरी ||'नेति नेति' बचनामृत सुनि सुनि, ललितादिक देखतिं दुरि चोरी |  (जै श्री) हित हरिवंश करत कर धूनन, प्रनय कोप मालावलि तोरी ||\\nसुन्दर निकुंज मंदिर में नवल किशोर श्याम एवं नवल किशोरी श्री राधा रस क्रीड़ा संलग्न हैं। दोनों का पारस्परिक अनुराग भी अति अनुपम है। यह अनोखी जोड़ी भूतल (स्थित श्रीवृन्दावन) में ही सुनी एवं देखी जाती है। निकुंज मंदिर की भूमि दिव्य मूँगा स्फटिक आदि नाना मणियों से खचित है। उस मणिमय भूमि पर नव कर्पूर की रज बिखर रही है। सुकोमल नव पल्लव रचित एक शय्या सुशोभित है। उस शय्या पर श्याम सुन्दर ने श्री प्रिया जी को आग्रह पूर्वक विराज मान किया है। भाव यह है कि उन्हें निकुंजारतगत शय्या में पौढ़ाया है। हास परिहास परायण युगल किशोर ने परस्पर कपोल-कमल पर ताम्दूल की पीक अंकित करके रस विस्तार किया है। उस समय गौर-श्याम का बाहु कलह बड़ा मनोहर प्रतीत होता है। पश्चात् श्याम सुन्दर श्री प्रियाजी के कटि बन्धन मुक्त करने का सरस प्रयास करते हैं। श्रीराधा प्रियतम के उज्जवल वक्ष में अपनी छवि देखकर विभ्रम से व्याकुल तथा मान-युक्त हो जाती हैं। तब प्रियतम उनके अत्यन्त सुन्दर चिबुक को सहलाकर अनुनयपूर्ण निवेदन करते हुए यह स्पष्ट करते हैं कि यह आपकी सुन्दर छवि का ही प्रति बिम्ब है। श्री हित हरिवंश कहते हैं कि इस प्रेम कलह में श्री प्रिया के मुख से 'नेति-नेति' वचनामृत सुनकर ललितादि सहचरी छिपकर चोरी चोरी इस प्रेम कलह का दर्शन कर रही हैं। श्री प्रिया जी ने हाथापाई करते हुए प्रणय कोप वश श्री लाल जी के वृक्ष स्थल की मालाएँ तोड दीं।\\nIn the temple of the beautiful Nikunj at Vrindavan, the blissfulness of divine pastimes of youthful Radha Krishn duo continues to exist. The couple is ever-new as always.\\n\\\"Ati Nupam Anurag Parspar, Suni Abhoot Bhootal Par Jori\\\"\\nThe mutual affection among themselves is also very unique. This unique pair is heard and seen in this mood, only in the earth Surface (located in Shri Vrindavan only).\\n\\\"Vidrum Phatik Vividh Nirmit Dhar, Nava Kapoor Prag Na Thori”\\nThe land of the Nikunja temple is enriched with divine coral rhinestone like gems. On that gem riched surface fresh camphor dust are spreaded.\\n\\\"Komal Kislay Roun Supesal, Tapar Shyam Nivesit Gori”\\nA Well decorated bed is so adorned. With eagerness, Shree Krishn helps Shree Radha to take a seat there. The fun-filled both Radha Krishn increased the divine bliss of the situation.\\n\\\"Mithoon Haas Parihaas Parayan, Peek Kapol Kamal Par Jhori”\\nAt that time, the pastimes of 'Radha Krishn’ relishing the bliss, joking and laughing at the time was very fascinating. After that Shri Krishna was trying his best to please Shri Radheyrani.\\n\\\"Gaur Shyam Bhuj Kalah Manohar, Nivi Bandhan Mochat Dori”\\nAt that time, the pastimes of 'Radha Krishn quarrel with each other was fascinating too. At that moment, Shri Krishna was trying his best to free the fastenings at Shri Radharani's waist.\\n\\\"Hari Ura Mukur Biloki Apanpi, Vibhrim Vikal Maan Juta Bhori”\\nShree Radha, saw the image of her on the shining chest of Shree Krishn, by misunderstanding she becomes distraught or angry.\\n\\\"Chibuk Suchari Praloi Prabhodhat, Piya Pratibimb Janai Nihori”\\nThen beloved Krishn tickled his chin and appealing to her in a humble manner, makes clear that \\\"Oh Radhe, You are extremely innocent, it is a mere reflection of your beautiful image only”.\\n\\\"Neti Neti Bachnamrit Suni Suni, Lalitadik Dekhati Duti Chori”\\nThe companions like Laita and others watching and listening to this divine scene of quarrel secretly in Nikunj Van.\\n\\\"Jai Shri Hita Harivansh Karat Kar Dhunan, Pranay Kopa Malavali Tori\\\"\\nShree Hit Harivansh Mahaprabhu says that, in this divine pastimes of the quarrel of Radha Krishn at Nikunj, Shri Radha saying \\\"No not my image\\\" in a fascinating way, Shree Radha is now angry with Shri Krishn, and breaks all of the garlands on his chest. In the temple of the beautiful Nikunj at Vrindavan, the blissfulness of divine pastimes of youthful Radha Krishn duo continues to exist.\",\"author\":{\"@type\":\"Person\",\"name\":\"श्री हित हरिवंश महाप्रभु, हित चौरासी (7)\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"Vrindopnishad\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:Tc42,"])</script><script>self.__next_f.push([1,"सुन्दर निकुंज मंदिर में नवल किशोर श्याम एवं नवल किशोरी श्री राधा रस क्रीड़ा संलग्न हैं। दोनों का पारस्परिक अनुराग भी अति अनुपम है। यह अनोखी जोड़ी भूतल (स्थित श्रीवृन्दावन) में ही सुनी एवं देखी जाती है। निकुंज मंदिर की भूमि दिव्य मूँगा स्फटिक आदि नाना मणियों से खचित है। उस मणिमय भूमि पर नव कर्पूर की रज बिखर रही है। सुकोमल नव पल्लव रचित एक शय्या सुशोभित है। उस शय्या पर श्याम सुन्दर ने श्री प्रिया जी को आग्रह पूर्वक विराज मान किया है। भाव यह है कि उन्हें निकुंजारतगत शय्या में पौढ़ाया है। हास परिहास परायण युगल किशोर ने परस्पर कपोल-कमल पर ताम्दूल की पीक अंकित करके रस विस्तार किया है। उस समय गौर-श्याम का बाहु कलह बड़ा मनोहर प्रतीत होता है। पश्चात् श्याम सुन्दर श्री प्रियाजी के कटि बन्धन मुक्त करने का सरस प्रयास करते हैं। श्रीराधा प्रियतम के उज्जवल वक्ष में अपनी छवि देखकर विभ्रम से व्याकुल तथा मान-युक्त हो जाती है iful image only”.\n\"Neti Neti Bachnamrit Suni Suni, Lalitadik Dekhati Duti Chori”\nThe companions like Laita and others watching and listening to this divine scene of quarrel secretly in Nikunj Van.\n\"Jai Shri Hita Harivansh Karat Kar Dhunan, Pranay Kopa Malavali Tori\"\nShree Hit Harivansh Mahaprabhu says that, in this divine pastimes of the quarrel of Radha Krishn at Nikunj, Shri Radha saying \"No not my image\" in a fascinating way, Shree Radha is now angry with Shri Krishn, and breaks all of the garlands on his chest. In the temple of the beautiful Nikunj at Vrindavan, the blissfulness of divine pastimes of youthful Radha Krishn duo continues to exist."])</script><script>self.__next_f.push([1,"10:T1208,"])</script><script>self.__next_f.push([1,"(राग विभास)\nआजु निकुंज मंजु में खेलत, नवल किसोर नवीन किसोरी |  अति अनुपम अनुराग परसपर, सुनि अभूत भूतल पर जोरी ||\nविद्रुम फटिक विविध निर्मित धर, नव कर्पूर पराग न थोरी |  कौंमल किसलय सैंन सुपेसल, तापर स्याम निवेसित गोरी ||\nमिथुन हास परिहास परायन, पीक कपोल कमल पर झोरी |  गौर स्याम भुज कलह मनोहर, नीवी बंधन मोचत डोरी ||\nहरि उर मुकुर बिलोकि अपनपी, विभ्रम विकल मान जुत भोरी |  चिबुक सुचारु प्रलोइ प्रवोधत, पिय प्रतिबिंब जनाइ निहोरी ||\n'नेति नेति' बचनामृत सुनि सुनि, ललितादिक देखतिं दुरि चोरी |  (जै श्री) हित हरिवंश करत कर धूनन, प्रनय कोप मालावलि तोरी ||\n- श्री हित हरिवंश महाप्रभु, हित चौरासी (7)\nसुन्दर निकुंज मंदिर में नवल किशोर श्याम एवं नवल किशोरी श्री राधा रस क्रीड़ा संलग्न हैं। दोनों का पारस्परिक अनुराग भी अति अनुपम है। यह अनोखी जोड़ी भूतल (स्थित श्रीवृन्दावन) में ही सुनी एवं देखी जाती है। निकुंज मंदिर की भूमि दिव्य मूँगा स्फटिक आदि नाना मणियों से खचित है। उस मणिमय भूमि पर नव कर्पूर की रज बिखर रही है। सुकोमल नव पल्लव रचित एक शय्या सुशोभित है। उस शय्या पर श्याम सुन्दर ने श्री प्रिया जी को आग्रह पूर्वक विराज मान किया है। भाव यह है कि उन्हें निकुंजारतगत शय्या में पौढ़ाया है। हास परिहास परायण युगल किशोर ने परस्पर कपोल-कमल पर ताम्दूल की पीक अंकित करके रस विस्तार किया है। उस समय गौर-श्याम का बाहु कलह बड़ा मनोहर प्रतीत होता है। पश्चात् श्याम सुन्दर श्री प्रियाजी के कटि बन्धन मुक्त करने का सरस प्रयास करते हैं। श्रीराधा प्रियतम के उज्जवल वक्ष में अपनी छवि देखकर विभ्रम से व्याकुल तथा मान-युक्त हो जाती हैं। तब प्रियतम उनके अत्यन्त सुन्दर चिबुक को सहलाकर अनुनयपूर्ण निवेदन करते हुए यह स्पष्ट करते हैं कि यह आपकी सुन्दर छवि का ही प्रति बिम्ब है। श्री हित हरिवंश कहते हैं कि इस प्रेम कलह में श्री प्रिया के मुख से 'नेति-नेति' वचनामृत सुनकर ललितादि सहचरी छिपकर चोरी चोरी इस प्रेम कलह का दर्शन कर रही हैं। श्री प्रिया जी ने हाथापाई करते हुए प्रणय कोप वश श्री लाल जी के वृक्ष स्थल की मालाएँ तोड दीं।"])</script><script>self.__next_f.push([1,"11:[\"Braj Rasik\",\"Mass Import\"]\n12:[]\n13:[]\n14:[]\n"])</script><script>self.__next_f.push([1,"d:{\"id\":\"local-566\",\"title\":\"आजु निकुंज मंजु में खेलत\",\"category\":\"Shloka\",\"sanskrit_text\":\"आजु निकुंज मंजु में खेलत, नवल किसोर नवीन किसोरी |  अति अनुपम अनुराग परसपर, सुनि अभूत भूतल पर जोरी ||विद्रुम फटिक विविध निर्मित धर, नव कर्पूर पराग न थोरी |  कौंमल किसलय सैंन सुपेसल, तापर स्याम निवेसित गोरी ||मिथुन हास परिहास परायन, पीक कपोल कमल पर झोरी |  गौर स्याम भुज कलह मनोहर, नीवी बंधन मोचत डोरी ||हरि उर मुकुर बिलोकि अपनपी, विभ्रम विकल मान जुत भोरी |  चिबुक सुचारु प्रलोइ प्रवोधत, पिय प्रतिबिंब जनाइ निहोरी ||'नेति नेति' बचनामृत सुनि सुनि, ललितादिक देखतिं दुरि चोरी |  (जै श्री) हित हरिवंश करत कर धूनन, प्रनय कोप मालावलि तोरी ||\",\"hindi_text\":\"$e\",\"english_text\":null,\"english_translation\":\"$f\",\"description\":\"https://www.brajrasik.org/hi/articles/5a9d8c2e9f7ab760360f9bef/aaju-nikunj-manju-mein-khelat-naval-kishor-naveel-kisori-shri-hita-harivansh-mahaprabhu-hit-chaturasi-7\",\"author\":\"श्री हित हरिवंश महाप्रभु, हित चौरासी (7)\",\"status\":\"published\",\"content_text\":\"$10\",\"tags\":\"$11\",\"image_urls\":\"$12\",\"video_urls\":\"$13\",\"media_links\":\"$14\",\"source_url\":\"https://www.brajrasik.org/hi/articles/5a9d8c2e9f7ab760360f9bef/aaju-nikunj-manju-mein-khelat-naval-kishor-naveel-kisori-shri-hita-harivansh-mahaprabhu-hit-chaturasi-7\",\"slu \"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"आजु निकुंज मंजु में खेलत\"}]]}],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-566\",\"title\":\"आजु निकुंज मंजु में खेलत\",\"category\":\"Shloka\",\"sanskrit_text\":\"आजु निकुंज मंजु में खेलत, नवल किसोर नवीन किसोरी |  अति अनुपम अनुराग परसपर, सुनि अभूत भूतल पर जोरी ||विद्रुम फटिक विविध निर्मित धर, नव कर्पूर पराग न थोरी |  कौंमल किसलय सैंन सुपेसल, तापर स्याम निवेसित गोरी ||मिथुन हास परिहास परायन, पीक कपोल कमल पर झोरी |  गौर स्याम भुज कलह मनोहर, नीवी बंधन मोचत डोरी ||हरि उर मुकुर बिलोकि अपनपी, विभ्रम विकल मान जुत भोरी |  चिबुक सुचारु प्रलोइ प्रवोधत, पिय प्रतिबिंब जनाइ निहोरी ||'नेति नेति' बचनामृत सुनि सुनि, ललितादिक देखतिं दुरि चोरी |  (जै श्री) हित हरिवंश करत कर धूनन, प्रनय कोप मालावलि तोरी ||\",\"hindi_text\":\"$a\",\"english_text\":null,\"english_translation\":\"$b\",\"description\":\"https://www.brajrasik.org/hi/articles/5a9d8c2e9f7ab760360f9bef/aaju-nikunj-manju-mein-khelat-naval-kishor-naveel-kisori-shri-hita-harivansh-mahaprabhu-hit-chaturasi-7\",\"author\":\"श्री हित हरिवंश महाप्रभु, हित चौरासी (7)\",\"status\":\"published\",\"content_text\":\"$c\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a9d8c2e9f7ab760360f9bef/aaju-nikunj-manju-mein-khelat-naval-kishor-naveel-kisori-shri-hita-harivansh-mahaprabhu-hit-chaturasi-7\",\"slug\":\"aju-nikunj-mnju-men-khelata\"},\"initialRelatedSaint\":{\"name\":\"श्री हित हरिवंश\",\"hinglishName\":\"shri hit harivnsha\",\"slug\":\"shri-hit-harivnsh-mahaprabhu\",\"biography\":\"श्री हित हरिवंश महाप्रभु, श्री वृंदावन धाम के रसिक शिरोमणि संत और श्री कृष्ण की वंशी के अवतार हैं। वे श्री राधारानी को ही अपना गुरु और इष्ट मानते हैं और राधावल्लभ संप्रदाय के मुख्य आचार्य हैं। इनकी उपासना में मुख्य रूप से सहचरी भाव है, जिसमें श्री राधा चरण प्रधानता है।\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-503\",\"title\":\"जय श्री हित हरिवंश असीस देत मुख\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ जय श्री हित हरिवंश असीस देत मुख, चिरजीवो भूतल यह जोरि | ”\",\"hindi_text\":\"श्री हित हरिवंश महाप्रभु अपने मुख से आशीष देते हैं कि राधा कृष्ण की यह जोड़ी श्री वृन्दावन धाम में क्रीड़ा करती हुई चिरजीवी रहे।\",\"english_text\":null,\"english_translation\":\"Shri Hita Harivansh Mahaprabhu Gives Blessings to The Pair of Shri Radha Krishna and Says “ May They Always Remain Happy and Together for Countless Years in Shri Vrindavan Dham ”.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4e131559e8c72a534d86b9/jay-shri-hit-harivansh-aasees-det-mukh-chirjeevo-bhutal-yeh-jori-shri-hita-harivansh-mahaprahu\",\"author\":\"श्री हित हरिवंश महाप्रभु\",\"status\":\"published\",\"content_text\":\"“ जय श्री हित हरिवंश असीस देत मुख, चिरजीवो भूतल यह जोरि | ”\\n- श्री हित हरिवंश महाप्रभु\\nश्री हित हरिवंश महाप्रभु अपने मुख से आशीष देते हैं कि राधा कृष्ण की यह जोड़ी श्री वृन्दावन धाम में क्रीड़ा करती हुई चिरजीवी रहे।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4e131559e8c72a534d86b9/jay-shri-hit-harivansh-aasees-det-mukh-chirjeevo-bhutal-yeh-jori-shri-hita-harivansh-mahaprahu\",\"slug\":\"jay-shri-hit-harivnsh-asis-det-mukha\"}],\"books\":[],\"rawItem\":{\"id\":\"saint-local-1\",\"title\":\"श्री हित हरिवंश महाप्रभु\",\"hindi_text\":\"श्री हित हरिवंश महाप्रभु, श्री वृंदावन धाम के रसिक शिरोमणि संत और श्री कृष्ण की वंशी के अवतार हैं। वे श्री राधारानी को ही अपना गुरु और इष्ट मानते हैं और राधावल्लभ संप्रदाय के मुख्य आचार्य हैं। इनकी उपासना में मुख्य रूप से सहचरी भाव है, जिसमें श्री राधा चरण प्रधानता है।\",\"english_translation\":\"\",\"description\":\"https://www.brajrasik.org/hi/tag/hitharivansh\",\"tags\":[\"Braj Rasik\",\"Saint\",\"Biography\"],\"author\":\"BrajRasik.org\",\"category\":\"saint\",\"slug\":\"shri-hit-harivnsh-mahaprabhu\"}},\"initialRelatedBook\":null,\"initialRelatedRaga\":{\"name\":\"राग परसपर\",\"hinglishName\":\"rag parasapara\",\"slug\":\"rag-parasapara\",\"verses\":[\"$d\"],\"imageUrl\":null},\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$L15\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"content\",\"children\",\"$16\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L17\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L15\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L17\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/cbf73327883ccb7f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/fe995a1e4635138b.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/848f1edf91a8622f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"className\":\"dark\",\"children\":[\"$\",\"body\",null,{\"className\":\"antialiased\",\"children\":[\"$\",\"$L18\",null,{\"children\":[\"$\",\"$L15\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\

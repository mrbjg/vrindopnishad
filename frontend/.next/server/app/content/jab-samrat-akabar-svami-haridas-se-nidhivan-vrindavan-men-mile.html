43179a996.js\",\"1401\",\"static/chunks/d8b2f613-9822c7accee3e330.js\",\"1464\",\"static/chunks/4ea34a6d-26b267dedec28637.js\",\"9762\",\"static/chunks/44530001-97951b7dfbe773fa.js\",\"4785\",\"static/chunks/4785-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"ClientProvi"])</script><script>self.__next_f.push([1,"ders\"]\n17:I[1060,[],\"\"]\n6:T2f10,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"जब सम्राट अकबर स्वामी हरिदास से निधिवन, वृंदावन में मिले\",\"description\":\"https://www.brajrasik.org/hi/articles/5b128c0f9f7ab760360f9c77/when-emperor-akbar-met-swami-haridas-at-nidhi-van-vrindavan\",\"articleBody\":\"\\nरसिक शिरोमणि, स्वामी हरिदास जी, ललिता सखी के अवतार, श्री बिहारीजी को भक्ति गीतों को गहराई से गाकर उनकी भक्ति किया करते थे। उन्होंने व्यक्तिगत रूप से इनकी रचना की थी। वे अपने भाव वीणा पर गाते थे | गायन करते समय, वे इतना मगन हो जाते थे कि वे अपनी सुध-बुध ही भूल जाते थे | और दिन-रात भक्ति कीर्तन गान किया करते थे। प्रसिद्ध बैजुबावरा और तानसेन उनके शिष्य थे। अकबर ने तानसेन के मुख से स्वामी हरिदास की महिमा के बारे में सुना (जो सम्राट के दरबार में अनमोल व्यक्ति थे)। लेकिन स्वामी हरिदास किसी व्यक्ति विशेष का मनोरंजन नहीं करते थे वो केवल \\\"श्री बिहारीजी\\\" के लिए ही गाया करते थे। इसलिए एक दिन सम्राट अकबर ने साधारण व्यक्ति का रूप धारण किया और तानसेन के साथ, निधिवन में स्वामी हरिदास की भजन कुटिया के पास आए। तानसेन, जो संगीत के बहुत विशेषज्ञ थे जान बूझकर अपनी वीना लाए और अब एक गीत गाया जिसमें खुद से ही त्रुटि की। स्वामी हरिदास ने फिर वीना को तानसेन के हाथों से लिया और उसी गीत को गाना शुरू कर दिया जिसे तानसेन ने गाया था । उनके गायन ने अकबर को मंत्रमुग्ध कर दिया। स्वामी हरिदास का गायन इतना प्यारा और आकर्षक था कि हिरण, पक्षियों और जंगल के अन्य जानवर भी उस स्थान पर आए जहां उन्होंने चुपचाप उस मधुर-रस को सुना। सम्राट अकबर के आश्चर्य की कोई सीमा नहीं थी। वह इतने प्रसन्न थे कि वह तुरंत स्वामी हरिदास को कुछ प्रस्तुत करना चाहते थे, लेकिन बुद्धिमान तानसेन ने सम्राट को ऐसा नहीं करने का संकेत दिया क्योंकि यह हरिदास जी के भाव को बदल देगा और उनको वह पसंद नहीं आएगा । इन महान व्यक्तित्व स्वामी श्री हरिदास जी की समाधि आज भी निधिवन में है |\\nबाद में अकबर ने स्वामी श्री हरिदास से सेवा मांगी। जब उन्होंने बार-बार स्वामीजी से वृंदावन के लिए कुछ करने का अवसर देने का अनुरोध किया तो स्वामीजी ने कहा, \\\"आपकी इतनी चाह है और इतनी उत्सुक इच्छा रखते हैं तो कृपया यमुना घाट की टूटी हुई सीढ़ियों में से एक की मरम्मत करें।\\\" उन्होंने अपने शिष्यों को राजा को टूटी हुई सीढ़ी की ओर मार्गदर्शन करने का निर्देश दिया। अकबर अब वास्तव में निराश थे। उन्होंने सोचा कि ऋषि एक महान संगीतकार हो सकते हैं लेकिन इस समय पागल लग रहे हैं। वे हिंदुस्तान के राजा को क्षतिग्रस्त सीढ़ी की मरम्मत के लिए कह रहा हैं ? मैं वह हूं जिसने विशाल किलों और मस्जिदों का निर्माण करवाया है और अब वे मुझे टूटी हुई सीढ़ी दिखाने के लिए ले जा रहे हैं जिसकी मुझे मरम्मत करनी चाहिए? क्या मज़ाक है? लेकिन उन पर बेहतर ज्ञान प्रबल था अतएव उन्होंने धैर्य रखा और संतों के साथ चलते रहे। जैसे ही वे यमुना किनारे पहुंचे तो शिष्यों ने टूटी हुई सीढ़ी की ओर इशारा किया, उनके सामने एक दिव्य प्रकाश फ़ैल गया। वे अब देख रहे थे की वे सामान्य चिनाई पत्थर से बने हुए घाट नहीं थे बल्कि वे सोने-चाँदी एवं रत्न-जड़ित घाट थे। सभी रत्न (रूबी, हीरे, नीलमणि, पन्ना आदि) उच्च शुद्धता के थे एवं व्यवस्थित तरीके से लगे हुए थे। उनकी लागत का अनुमान लगाना भी संभव नहीं था। फिर भी उसने टूटे हुए कोने को देखने की कोशिश की और दूसरे कोने के साथ तुलना में पाया कि इस मिलान के लिए मिलान करने वाले रत्नों को पाने में सक्षम नहीं होंगे भले ही वह सौ गुना समृद्ध हो जाए या इस मरम्मत के लिए अर्जित संचित सम्पूर्ण धन भी व्यय कर दे क्योंकि वह दिव्य है।\\nअब वे स्वामीजी की वास्तविक प्रकृति को जान चुके थे। दृश्य फिर से बदल गया। अब घाट सामान्य पत्थर-मसाले की चिनाई के रूप में दिखाई दिया। लेकिन अकबर की मरम्मत कराने की हिम्मत नहीं थी। वे निराशा के साथ स्वामी जी के पास वापस चले गए, उन्हें दंडवत किया, वृंदावन में कुछ भी छूने के लिए अपनी अक्षमता स्वीकार की और तानसेन के साथ दिल्ली चले गए।\\nRasik Shiromani, Swami Haridas ji, incarnation of Lalita Sakhi, used to please Shri Bihariji by sweetly singing devotional songs, he had personally composed as he played the vina. While singing, he would become so absorbed that he would forget his body and mind and kept on singing day and night. The famous Baijubavara and Tansena were his disciples. Upon hearing about Swami Haridasa’s glories from the mouth of Tansena, who was the jewel among Emperor. Akbara’s ministers, Akbarahimself desired to relish the nectar of Haridasa’s blissful music. But Swami Haridas had firmly resolved not to entertain anyone but his deity \\\"Shri Bihariji\\\". Therefore one day Emperor Akbara disguised himself as an ordinary man and, along with Tansena, came to Swami Haridas’s bhajana kutira in Nidhivan. Tansena, who also was very expert in music, had purposely brought his vina along and now began to sing a sweet song. His singing enchanted Akbara. Swami Haridasa then took the Vina from the hands of Tansena and began to sing the same song, pointing out the errors that Tansena had made in singing it. Swami Haridasa’s singing was so sweet and attractive that even the deer, birds and other animals of the forest came to that spot, where they listened silently. Emperor Akbara’s amazement knew no bounds. He was so pleased that he immediately wanted to present something to Swami Haridas, but the wise Tansena indicated to the emperor not to do so as it would alter Haridas’s mood. The samadhi of this great personality is still present in Nidhivan.\\nAfterwards, Akbar asked for the service from Swami Shri Haridas. When he repeatedly requested Swamiji to grant him opportunity to do something for Vrindavan at least, Swamiji said, \\\"You are so persistent and have such a keen desire, kindly get one of the broken stairs of Yamuna Ghat repaired.\\\" He directed his disciples to guide King to the broken stair. Akbar was now really disappointed. The thought the sage may be a great musician but seems to be mad at the same time. He is telling me, the King of Hindustan to get a damaged stair repaired? I am the one who have constructed huge forts and mosques and now they are taking me to show the broken stair which I should get repaired? What a joke? But better sense prevailed on him; he kept his cool and followed the saints. As he reached Yamuna bank and the accompanying saint pointed to broken stair, the scene before him changed in a flash. What he was now seeing was not ordinary stone-mortar masonry, but he saw the ghat made up of precious metals (gold and silver) and studded with rare gems. Rubys, diamonds, sapphires, emeralds etc of such high purity and size were studded so generously that it was impossible to estimate the cost. Even then he tried to look at the broken corner and found on comparision with other corner, that he would not be able to get the matching gems for repair even if he was hundred times richer and spent all his fortune for this repair.\\nNow he knew the real nature of Swamiji. The scene changed again, now the ghat appeared to be ordinary stone-mortar masonry, but Akbar did not dare to undertake the repairs. Disillusioned, he walked back to Swamiji, bowed to him in dandvat, admitted his incapacity to touch anything in Vrindavan and left for Delhi along with Mian Tansen.\",\"author\":{\"@type\":\"Person\",\"name\":\"Braj Rasik Heritage\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"Vrindopnishad\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:T1fcd,"])</script><script>self.__next_f.push([1,"रसिक शिरोमणि, स्वामी हरिदास जी, ललिता सखी के अवतार, श्री बिहारीजी को भक्ति गीतों को गहराई से गाकर उनकी भक्ति किया करते थे। उन्होंने व्यक्तिगत रूप से इनकी रचना की थी। वे अपने भाव वीणा पर गाते थे | गायन करते समय, वे इतना मगन हो जाते थे कि वे अपनी सुध-बुध ही भूल जाते थे | और दिन-रात भक्ति कीर्तन गान किया करते थे। प्रसिद्ध बैजुबावरा और तानसेन उनके शिष्य थे। अकबर ने तानसेन के मुख से स्वामी हरिदास की महिमा के बारे में सुना (जो सम्राट के दरबार में अनमोल व्यक्ति थे)। लेकिन स्वामी हरिदास किसी व्यक्ति विशेष का मनोरंजन नहीं करते थे वो केवल \"श्री बिहारीजी\" के लिए ही गाया करते थे। इसलिए एक दिन सम्राट अकबर ने साधारण व्यक्ति का रूप धारण किया और तानसेन के साथ, निधिवन में स्वामी हरिदास की भजन कुटिया के पास आए। तानसेन, जो संगीत के बहुत विशेषज्ञ थे जान बूझकर अपनी वीना लाए और अब एक गीत गाया जिसमें खुद से ही त्रुटि की। स्वामी हरिदास ने फिर वीना को तानसेन के हाथों से लिया और उसी गीत को गाना शुरू कर दिया जिसे तानसेन ने गाया था । उनके गायन ने अकबर को मंत्रमुग्ध कर दिया। स्वामी हरिदास का गायन इतना प्यारा और आकर्षक था कि हिरण, पक्षियों और जंगल के अन्य जानवर भी उस स्थान पर आए जहां उन्होंने चुपचाप उस मधुर-रस को सुना। सम्राट अकबर के आश्चर्य की कोई सीमा नहीं थी। वह इतने प्रसन्न थे कि वह तुरंत स्वामी हरिदास को कुछ प्रस्तुत करना चाहते थे, लेकिन बुद्धिमान तानसेन ने सम्राट को ऐसा नहीं करने का संकेत दिया क्योंकि यह हरिदास जी के भाव को बदल देगा और उनको वह पसंद नहीं आएगा । इन महान व्यक्तित्व स्वामी श्री हरिदास जी की समाधि आज भी निधिवन में है |\nबाद में अकबर ने स्वामी श्री हरिदास से सेवा मांगी। जब उन्होंने बार-बार स्वामीजी से वृंदावन के लिए कुछ करने का अवसर देने का अनुरोध किया तो स्वामीजी ने कहा, \"आपकी इतनी चाह है और इतनी उत्सुक इच्छा रखते हैं तो कृपया यमुना घाट की टूटी हुई सीढ़ियों में से एक की मरम्मत करें।\" उन्होंने अपने शिष्यों को राजा को टूटी हुई सीढ़ी की ओर मार्गदर्शन करने का निर्देश दिया। अकबर अब वास्तव में निराश थे। उन्होंने सोचा कि ऋषि एक महान संगीतकार हो सकते हैं लेकिन इस समय पागल लग रहे हैं। वे हिंदुस्तान के राजा को क्षतिग्रस्त सीढ़ी की मरम्मत के लिए कह रहा हैं ? मैं वह हूं जिसने विशाल किलों और मस्जिदों का निर्माण करवाया है और अब वे मुझे टूटी हुई सीढ़ी दिखाने के लिए ले जा रहे हैं जिसकी मुझे मरम्मत करनी चाहिए? क्या मज़ाक है? लेकिन उन पर बेहतर ज्ञान प्रबल था अतएव उन्होंने धैर्य रखा और संतों के साथ चलते रहे। जैसे ही वे यमुना किनारे पहुंचे तो शिष्यों ने टूटी हुई सीढ़ी की ओर इशारा किया, उनके सामने एक दिव्य प्रकाश फ़ैल गया। वे अब देख रहे थे की वे सामान्य चिनाई पत्थर से बने हुए घाट नहीं थे बल्कि वे सोने-चाँदी एवं रत्न-जड़ित घाट थे। सभी रत्न (रूबी, हीरे, नीलमणि, पन्ना आदि) उच्च शुद्धता के थे एवं व्यवस्थित तरीके से लगे हुए थे। उनकी लागत का अनुमान लगाना भी संभव नहीं था। फिर भी उसने टूटे हुए कोने को देखने की कोशिश की और दूसरे कोने के साथ तुलना में पाया कि इस मिलान के लिए मिलान करने वाले रत्नों को पाने में सक्षम नहीं होंगे भले ही वह सौ गुना समृद्ध हो जाए या इस मरम्मत के लिए अर्जित संचित सम्पूर्ण धन भी व्यय कर दे क्योंकि वह दिव्य है।\nअब वे स्वामीजी की वास्तविक प्रकृति को जान चुके थे। दृश्य फिर से बदल गया। अब घाट सामान्य पत्थर-मसाले की चिनाई के रूप में दिखाई दिया। लेकिन अकबर की मरम्मत कराने की हिम्मत नहीं थी। वे निराशा के साथ स्वामी जी के पास वापस चले गए, उन्हें दंडवत किया, वृंदावन में कुछ भी छूने के लिए अपनी अक्षमता स्वीकार की और तानसेन के साथ दिल्ली चले गए।"])</script><script>self.__next_f.push([1,"b:Tcf1,"])</script><script>self.__next_f.push([1,"Rasik Shiromani, Swami Haridas ji, incarnation of Lalita Sakhi, used to please Shri Bihariji by sweetly singing devotional songs, he had personally composed as he played the vina. While singing, he would become so absorbed that he would forget his body and mind and kept on singing day and night. The famous Baijubavara and Tansena were his disciples. Upon hearing about Swami Haridasa’s glories from the mouth of Tansena, who was the jewel among Emperor. Akbara’s ministers, Akbarahimself desired to relish the nectar of Haridasa’s blissful music. But Swami Haridas had firmly resolved not to entertain anyone but his deity \"Shri Bihariji\". Therefore one day Emperor Akbara disguised himself as an ordinary man and, along with Tansena, came to Swami Haridas’s bhajana kutira in Nidhivan. Tansena, who also was very expert in music, had purposely brought his vina along and now began to sing a sweet song. His singing enchanted Akbara. Swami Haridasa then took the Vina from the hands of Tansena and began to sing the same song, pointing out the errors that Tansena had made in singing it. Swami Haridasa’s s

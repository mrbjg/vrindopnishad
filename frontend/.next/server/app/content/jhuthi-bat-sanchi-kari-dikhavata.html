4785\",\"static/chunks/4785-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"ClientProvid"])</script><script>self.__next_f.push([1,"ers\"]\n14:I[1060,[],\"\"]\n6:Td92,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"झूठी बात सांची करि दिखावत\",\"description\":\"https://www.brajrasik.org/hi/articles/5daf529599ef5400603fa6b8/jhoothi-baat-saanchi-kari-dikhaavat-shri-swami-haridas-ashtadash-pad-14\",\"articleBody\":\"झूठी बात सांची करि दिखावत हौ हरि नागर। [1]निसि दिन बुनत उधेरत जात प्रपंच कौ सागर॥ [2]ठाट बनाय धरयौ मिहरी कौ है पुरुषतें आगर। [3]सुनि हरिदास यहैं जिय जानों सपनें कौ सौ जागर॥ [4]\\nप्रस्तुत पद में श्री हरिदास जी जीव की अति प्रबल संसार आसक्ति को देखकर श्री बिहारी जी से कहते हैं कि आप ऐसे नागर नटवर शिरोमणि हो जो कि इस मिथ्या (झूठे) मायिक जगत को ही सच्चा कर दिखा रहे हो। [1]\\nदिन रात इस माया रूपी प्रपंच के बुन को बुनते हो और उधेड़ते हो (बुन बना रहे हो), और आपकी माया इतनी प्रबल है कि जीव आपको भूलकर इसी माया को सत्य मान बैठे हैं। [2]\\nहे पुरुषोत्तम, आपने इस संसार का ऐसा ठाट-बाट बनाया है कि जीव इसमें इस तरह लिप्त हो गए हैं कि वे आपके स्वरूप की ओर देखना ही नहीं चाहते। [3]\\nश्री हरिदास जी जीवों को चेतावनी देते हुए कहते हैं कि, “अरे भाई! जैसे सपने से जागने पर उसकी कोई महत्ता नहीं रह जाती, वैसे ही यह संसार भी एक झूठा सपना है। सत्य तो केवल श्री हरि का भजन है।” [4]\\nIn this verse, Shri Haridas Ji, observing the soul’s deep attachment to the material world, addresses Shri Bihari Ji, “You are the jewel among the masters, skillfully making this illusory world appear real.” [1]\\nDay and night, you masterfully weave and unravel the web of maya (illusion), so potent that it causes beings to forget you and embrace this illusion as the ultimate reality. [2]\\nO Supreme one, you have designed this world so magnificently that souls have become deeply entangled in it, losing the desire to turn toward your divine form. [3]\\nShri Haridas Ji warns the souls, “O brothers! Just as a dream holds no importance once you wake up, similarly, this world is also a false dream. The only truth is devotion to Shri Hari.” [4]\",\"author\":{\"@type\":\"Person\",\"name\":\"श्री स्वामी हरिदास, अष्टादश पद (14)\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"Vrindopnishad\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"b:[\"Braj Rasik\",\"Mass Import\"]\nc:[]\nd:[]\ne:[]\n"])</script><script>self.__next_f.push([1,"a:{\"id\":\"local-17\",\"title\":\"झूठी बात सांची करि दिखावत\",\"category\":\"Shloka\",\"sanskrit_text\":\"झूठी बात सांची करि दिखावत हौ हरि नागर। [1]निसि दिन बुनत उधेरत जात प्रपंच कौ सागर॥ [2]ठाट बनाय धरयौ मिहरी कौ है पुरुषतें आगर। [3]सुनि हरिदास यहैं जिय जानों सपनें कौ सौ जागर॥ [4]\",\"hindi_text\":\"प्रस्तुत पद में श्री हरिदास जी जीव की अति प्रबल संसार आसक्ति को देखकर श्री बिहारी जी से कहते हैं कि आप ऐसे नागर नटवर शिरोमणि हो जो कि इस मिथ्या (झूठे) मायिक जगत को ही सच्चा कर दिखा रहे हो। [1]\\nदिन रात इस माया रूपी प्रपंच के बुन को बुनते हो और उधेड़ते हो (बुन बना रहे हो), और आपकी माया इतनी प्रबल है कि जीव आपको भूलकर इसी माया को सत्य मान बैठे हैं। [2]\\nहे पुरुषोत्तम, आपने इस संसार का ऐसा ठाट-बाट बनाया है कि जीव इसमें इस तरह लिप्त हो गए हैं कि वे आपके स्वरूप की ओर देखना ही नहीं चाहते। [3]\\nश्री हरिदास जी जीवों को चेतावनी देते हुए कहते हैं कि, “अरे भाई! जैसे सपने से जागने पर उसकी कोई महत्ता नहीं रह जाती, वैसे ही यह संसार भी एक झूठा सपना है। सत्य तो केवल श्री हरि का भजन है।” [4]\",\"english_text\":null,\"english_translation\":\"In this verse, Shri Haridas Ji, observing the soul’s deep attachment to the material world, addresses Shri Bihari Ji, “You are the jewel among the masters, skillfully making this illusory world appear real.” [1]\\nDay and night, you masterfully weave and unravel the web of maya (illusion), so potent that it causes beings to forget you and embrace this illusion as the ultimate reality. [2]\\nO Supreme one, you have designed this world so magnificently that souls have become deeply entangled in it, losing the desire to turn toward your divine form. [3]\\nShri Haridas Ji warns the souls, “O brothers! Just as a dream holds no importance once you wake up, similarly, this world is also a false dream. The only truth is devotion to Shri Hari.” [4]\",\"description\":\"https://www.brajrasik.org/hi/articles/5daf529599ef5400603fa6b8/jhoothi-baat-saanchi-kari-dikhaavat-shri-swami-haridas-ashtadash-pad-14\",\"author\":\"श्री स्वामी हरिदास, अष्टादश पद (14)\",\"status\":\"published\",\"content_text\":\"(राग कल्याण एवं कान्हरौ)\\nझूठी बात सांची करि दिखावत हौ हरि नागर। [1]\\nनिसि दिन बुनत उधेरत जात प्रपंच कौ सागर॥ [2]\\nठाट बनाय धरयौ मिहरी कौ है पुरुषतें आगर। [3]\\nसुनि हरिदास यहैं जिय जानों सपनें कौ सौ जागर॥ [4]\\n- श्री स्वामी हरिदास, अष्टादश पद (14)\\nप्रस्तुत पद में श्री हरिदास जी जीव की अति प्रबल संसार आसक्ति को देखकर श्री बिहारी जी से कहते हैं कि आप ऐसे नागर नटवर शिरोमणि हो जो कि इस मिथ्या (झूठे) मायिक जगत को ही सच्चा कर दिखा रहे हो। [1]\\nदिन रात इस माया रूपी प्रपंच के बुन को बुनते हो और उधेड़ते हो (बुन बना रहे हो), और आपकी माया इतनी प्रबल है कि जीव आपको भूलकर इसी माया को सत्य मान बैठे हैं। [2]\\nहे पुरुषोत्तम, आपने इस संसार का ऐसा ठाट-बाट बनाया है कि जीव इसमें इस तरह लिप्त हो गए हैं कि वे आपके स्वरूप की ओर देखना ही नहीं चाहते। [3]\\nश्री हरिदास जी जीवों को चेतावनी देते हुए कहते हैं कि, “अरे भाई! जैसे सपने से जागने पर उसकी कोई महत्ता नहीं रह जाती, वैसे ही यह संसार भी एक झूठा सपना है। सत्य तो केवल श्री हरि का भजन है।” [4]\",\"tags\":\"$b\",\"image_urls\":\"$c\",\"video_urls\":\"$d\",\"media_links\":\"$e\",\"source_url\":\"https://www.brajrasik.org/hi/articles/5daf529599ef5400603fa6b8/jhoothi-baat-saanchi-kari-dikhaavat-shri-swami-haridas-ashtadash-pad-14\",\"slug\":\"jhuthi-bat-sanchi-kari-dikhavata\"}\n"])</script><script>self.__next_f.push([1,"10:[\"slug\",\"jhuthi-bat-sanchi-kari-dikhavata\",\"d\"]\n15:[]\n"])</script><script>self.__next_f.p \"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-17\",\"title\":\"झूठी बात सांची करि दिखावत\",\"category\":\"Shloka\",\"sanskrit_text\":\"झूठी बात सांची करि दिखावत हौ हरि नागर। [1]निसि दिन बुनत उधेरत जात प्रपंच कौ सागर॥ [2]ठाट बनाय धरयौ मिहरी कौ है पुरुषतें आगर। [3]सुनि हरिदास यहैं जिय जानों सपनें कौ सौ जागर॥ [4]\",\"hindi_text\":\"प्रस्तुत पद में श्री हरिदास जी जीव की अति प्रबल संसार आसक्ति को देखकर श्री बिहारी जी से कहते हैं कि आप ऐसे नागर नटवर शिरोमणि हो जो कि इस मिथ्या (झूठे) मायिक जगत को ही सच्चा कर दिखा रहे हो। [1]\\nदिन रात इस माया रूपी प्रपंच के बुन को बुनते हो और उधेड़ते हो (बुन बना रहे हो), और आपकी माया इतनी प्रबल है कि जीव आपको भूलकर इसी माया को सत्य मान बैठे हैं। [2]\\nहे पुरुषोत्तम, आपने इस संसार का ऐसा ठाट-बाट बनाया है कि जीव इसमें इस तरह लिप्त हो गए हैं कि वे आपके स्वरूप की ओर देखना ही नहीं चाहते। [3]\\nश्री हरिदास जी जीवों को चेतावनी देते हुए कहते हैं कि, “अरे भाई! जैसे सपने से जागने पर उसकी कोई महत्ता नहीं रह जाती, वैसे ही यह संसार भी एक झूठा सपना है। सत्य तो केवल श्री हरि का भजन है।” [4]\",\"english_text\":null,\"english_translation\":\"In this verse, Shri Haridas Ji, observing the soul’s deep attachment to the material world, addresses Shri Bihari Ji, “You are the jewel among the masters, skillfully making this illusory world appear real.” [1]\\nDay and night, you masterfully weave and unravel the web of maya (illusion), so potent that it causes beings to forget you and embrace this illusion as the ultimate reality. [2]\\nO Supreme one, you have designed this world so magnificently that souls have become deeply entangled in it, losing the desire to turn toward your divine form. [3]\\nShri Haridas Ji warns the souls, “O brothers! Just as a dream holds no importance once you wake up, similarly, this world is also a false dream. The only truth is devotion to Shri Hari.” [4]\",\"description\":\"https://www.brajrasik.org/hi/articles/5daf529599ef5400603fa6b8/jhoothi-baat-saanchi-kari-dikhaavat-shri-swami-haridas-ashtadash-pad-14\",\"author\":\"श्री स्वामी हरिदास, अष्टादश पद (14)\",\"status\":\"published\",\"content_text\":\"(राग कल्याण एवं कान्हरौ)\\nझूठी बात सांची करि दिखावत हौ हरि नागर। [1]\\nनिसि दिन बुनत उधेरत जात प्रपंच कौ सागर॥ [2]\\nठाट बनाय धरयौ मिहरी कौ है पुरुषतें आगर। [3]\\nसुनि हरिदास यहैं जिय जानों सपनें कौ सौ जागर॥ [4]\\n- श्री स्वामी हरिदास, अष्टादश पद (14)\\nप्रस्तुत पद में श्री हरिदास जी जीव की अति प्रबल संसार आसक्ति को देखकर श्री बिहारी जी से कहते हैं कि आप ऐसे नागर नटवर शिरोमणि हो जो कि इस मिथ्या (झूठे) मायिक जगत को ही सच्चा कर दिखा रहे हो। [1]\\nदिन रात इस माया रूपी प्रपंच के बुन को बुनते हो और उधेड़ते हो (बुन बना रहे हो), और आपकी माया इतनी प्रबल है कि जीव आपको भूलकर इसी माया को सत्य मान बैठे हैं। [2]\\nहे पुरुषोत्तम, आपने इस संसार का ऐसा ठाट-बाट बनाया है कि जीव इसमें इस तरह लिप्त हो गए हैं कि वे आपके स्वरूप की ओर देखना ही नहीं चाहते। [3]\\nश्री हरिदास जी जीवों को चेतावनी देते हुए कहते हैं कि, “अरे भाई! जैसे सपने से जागने पर उसकी कोई महत्ता नहीं रह जाती, वैसे ही यह संसार भी एक झूठा सपना है। सत्य तो केवल श्री हरि का भजन है।” [4]\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5daf529599ef5400603fa6b8/jhoothi-baat-saanchi-kari-dikhaavat-shri-swami-haridas-ashtadash-pad-14\",\"slug\":\"jhuthi-bat-sanchi-kari-dikhavata\"},\"initialRelatedSaint\":{\"name\":\"श्री स्वामी हरिदास, अष्टादश पद (14)\",\"hinglishName\":\"shri svami haridas, ashtadash pad (14)\",\"slug\":\"shri-svami-haridas-ashtadash-pad-14\",\"biography\":\"\",\"metadata\":{\"lineageEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"lineageHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"timelineEn\":\"1478–1573 AD (Vikram Samvat 1535 - 1630)\",\"timelineHi\":\"1478–1573 ईस्वी (विक्रम संवत 1535 - 1630)\",\"associatedPlacesEn\":\"Nidhivan, Vrindavan\",\"associatedPlacesHi\":\"निधिवन, वृंदावन\",\"discipleOfEn\":\"Shri Ashudhir Dev Ji (his father and guru)\",\"discipleOfHi\":\"श्री आशुधीर देव जी (पिता एवं गुरु)\",\"influencedByEn\":\"Nimbarka Sampradaya philosophy\",\"influencedByHi\":\"निम्बार्क संप्रदाय सिद्धांत\",\"associatedSampradayaEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"associatedSampradayaHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"devotionalMoodEn\":\"Nitya Vihar, Sakhi Bhava (Lalita Sakhi incarnate)\",\"devotionalMoodHi\":\"नित्य विहार, सखी भाव (ललिता सखी अवतार)\",\"teachingsEn\":\"Worship of the Divine Couple in the mood of Lalita Sakhi; focused purely on the eternal love-play (Nitya Vihar) in the secluded bowers (Nikunj) of Vrindavan, entirely devoid of majesty (aishwarya) or physical separation (viraha).\",\"teachingsHi\":\"ललिता सखी के भाव में युगल उपासना; वृंदावन के निकुंजों में होने वाले अखंड नित्य विहार रस पर पूर्ण ध्यान, जिसमें ऐश्वर्य भाव या वियोग का कोई स्थान नहीं है।\",\"literaryStyleEn\":\"Composed Kelimal (केलिमाल) and Siddhanta Pada (सिद्धान्त के पद) in sweet Braj Bhasha, characterized by deep musicality, classical raag notations, and intimate description of the Divine Couple's pastimes.\",\"literaryStyleHi\":\"मधुर ब्रजभाषा में 'केलिमाल' और 'सिद्धान्त के पद' की रचना की, जो राग-रागिनियों की शास्त्रीय विधा और निकुंज लीलाओं के सूक्ष्म चित्रण से परिपूर्ण हैं।\",\"biographyEn\":\"Swami Haridas was a spiritual master, classical music pioneer, and the founding acharya of the Haridasi Sampradaya. He is widely revered as the direct incarnation of Lalita Sakhi, the chief confidante of Srimati Radharani. Swami Haridas performed his intense bhajan in the sacred grove of Nidhivan in Vrindavan. His musical devotion was so deep and pure that the Divine Couple, Shri Radha and Krishna, appeared before him and manifested themselves in a single, combined deity form—Sri Bankey Bihari Ji. Swami Haridas taught that the ultimate spiritual destination is not cosmic liberation or majestic worship, but witnessing the confidential loving service of the Divine Couple in the eternal groves of Braj.\",\"biographyHi\":\"स्वामी हरिदास वृंदावन के रसिक शिरोमणि संत और भारतीय शास्त्रीय संगीत के महान आचार्य थे। उन्हें श्री राधा जी की प्रधान सखी श्री ललिता जी का साक्षात् अवतार माना जाता है। उन्होंने वृंदावन के निधिवन को अपनी साधना स्थली बनाया, जहाँ उनके संगीत अनुराग से खिंचकर युगल सरकार ने बांके बिहारी जी के रूप में प्रकट होकर दर्शन दिए। तानसेन और बैजू बावरा जैसे संगीत सम्राट इनके शिष्य थे। स्वामी जी ने सिद्ध किया कि भक्ति शुष्क तपस्या नहीं, बल्कि राग-रागिनियों के माध्यम से प्रभु चरणों में पूर्ण आत्मसमर्पण है।\",\"relatedSaints\":[{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"},{\"nameEn\":\"Shri Hariram Vyas\",\"nameHi\":\"श्री हरिराम व्यास\",\"slug\":\"hariram-vyas\"}],\"relatedGranthas\":[{\"nameEn\":\"Kelimal\",\"nameHi\":\"केलिमाल\",\"slug\":\"kelimal\"},{\"nameEn\":\"Siddhanta Pada\",\"nameHi\":\"सिद्धान्त के पद\",\"slug\":\"siddhanta-pada\"}],\"associatedGlossary\":[{\"termEn\":\"Nitya Vihar\",\"termHi\":\"नित्य विहार\",\"slug\":\"nitya-vihar\"},{\"termEn\":\"Nikunj\",\"termHi\":\"निकुंज\",\"slug\":\"nikunj\"},{\"termEn\":\"Sakhi Bhava\",\"termHi\":\"सखी भाव\",\"slug\":\"sakhi-bhava\"}],\"faq\":[{\"qEn\":\"Who was Swami Haridas?\",\"aEn\":\"Swami Haridas was a 16th-century rasik saint, musicologist, and founder of the Haridasi Sampradaya, renowned for manifesting the Bankey Bihari deity through his music in Nidhivan.\",\"qHi\":\"स्वामी हरिदास कौन थे?\",\"aHi\":\"स्वामी हरिदास 16वीं शताब्दी के एक महान रसिक संत, संगीतकार और हरिदासी संप्रदाय के प्रवर्तक थे, जिन्होंने अपने संगीत साधना से निधिवन में ठाकुर बांके बिहारी जी को प्रकट किया था।\"},{\"qEn\":\"Who were the famous disciples of Swami Haridas?\",\"aEn\":\"The legendary musicians Tansen (the royal singer of Akbar's court) and Baiju Bawra were disciples of Swami Haridas.\",\"qHi\":\"स्वामी हरिदास के प्रसिद्ध शिष्य कौन थे?\",\"aHi\":\"अकबर के दरबार के नवरत्नों में से एक संगीत सम्राट तानसेन और बैजू बावरा स्वामी हरिदास जी के प्रमुख शिष्य थे।\"}]},\"imageUrl\":null,\"verses\":[\"$a\"],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\

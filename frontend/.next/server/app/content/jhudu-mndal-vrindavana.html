_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"झुडू मंडल, वृंदावन\",\"description\":\"https://www.brajrasik.org/hi/articles/5888867558f4ac271a08b949/jhadu-mandal-vrindavan-radha-ranis-anklet-found-her-darshan-to-shyamananda\",\"articleBody\":\"स्थान:\\nझाडू मंडल यमुना जी के तट पर स्थित है, जो इमली तला और श्रिंगार वट के बहुत पास है।\\nThe following incident also took place here. Once, a long time ago, an old woman lived at Jhadu-mandala, and in her house she had a grindstone. She used this stone to grind wheat for others and in this way carried on her livelihood. She had an unflinching devotion to Krishna As she ground wheat, her beautiful voice sang the sweet names of Krishna while the grindstone made a rumbling gharr-gharr sound. One day, as she was grinding during the early hours before dawn, absorbed in singing the sweet names of Krishna a beautiful dark-complexioned young boy appeared and put one foot on the grindstone. “Maiya,” He said, “why do you turn the grindstone in such a way that it makes this rumbling gharr-gharr sound? I cannot sleep because of it.” The old lady became a little fearful and said, “My dear son, if I do not work the grindstone, how will I maintain my life?”​The beautiful, dark-complexioned boy replied, “I will put My footprint on your grindstone. People will come to take darshana of this footprint and give generous offerings. Their offerings will easily maintain you. Thus, you won’t need to use the grindstone anymore.” Saying this, the dark-complexioned boy disappeared.\\nWhen morning came, the old lady saw that the boy’s footprint had fully appeared on her grindstone. A crowd of people lined up, desirous to take darshana of the footprint, and this crowd increased day by day. The old lady was able to maintain herself easily through the donations she received, and she was always absorbed in remembering this pastime of Krishna.\\nLocation:\\nJhadhu Mandal is located on the bank of Yamuna Ji, very near cript>self.__next_f.push([1,"मशहूर श्रील जीव गोस्वामी और श्यामानंद की इस स्थान से लीला जुडी हुई है। जीव गोस्वामी ने श्यामानंद को राधा कृष्ण के समय के इस प्राचीन स्थान को सँभालने की सेवा दी थी। एक दिन, जब वह सुबह के शुरुआती घंटों में घूम रहा था, श्यामानंद को सुनहरी पायल के घुंघरू मिले। पहले ही जीव गोस्वामी ने उन्हें किसी भी खोयी हुई वस्तु को तुरंत उसके मालिक को वापस करने का निर्देश दिया था किसी और को नहीं। अगर कोई अन्य खोयी हुई वस्तु का दावा करने का प्रयास करता है, तो उन्हें जीव गोस्वामी को सूचित करना चाहिए अर्थात् जीव गोस्वामी को बताना चाहिए। इसलिए श्यामानंद ने सुनहरी पायल अपने ऊपरी रिधान के कोने में बहुत ध्यान से बांध लिया। थोड़ी देर बाद, दो ब्रज बाला (युवा लड़कियां) उनके पास आईं और कहा, \"आपको मिला हुई पायल हमारी सखी की है, और हम इसकी तलाश में आये हैं। आप इसे हमें दे सकते हैं। \"श्री श्यामानंद ने नम्रता से जवाब दिया,\" जो भी पायल से संबंधित है उसे व्यक्तिगत रूप से आना चाहिए। मैं तुम्हें यह नहीं दूंगा। \"युवा लड़कियों ने जवाब दिया,\" क्या आपको कोई शर्म नहीं है? आप इस छोटी बहू के चेहरे को देखने की इच्छा कैसे हिम्मत कर सकते हैं? \"लेकिन श्यामानंद ने अपने शब्दों का अड़े रहे और उन्हें घुंघरू नहीं दिया। दोनों युवा लड़कियां अपनी प्रेमिका को श्यामानंद के सामने लाई और कहा, \" इनके पाँव के चारों ओर घुंघरू बांधो।\" श्री श्यामानंद ने अपने हाथों से भावमय होकर प्रेम से घुंघरू बांध दिया। ये युवा लड़कियां श्री राधा रानी खुद और उनकी दो सखी, ललिता और विशाखा के अलावा अन्य कोई नहीं थीं। इस घटना से, श्यामानंद का जीवन धन्य हो गया। पहले उनका नाम दुखी-कृष्ण दास था, लेकिन राधा रानी की दया प्राप्त करने पर उनका नाम श्यामानंद दास बन गया। ललिता देवी ने श्यामानंद के माथे पर घुंगरू लगाया। आज भी, श्यामानंद के प्रभु के आध्यात्मिक परिवार वंश में वे अपने माथे पर पायल के आकार में एक तिलक पहनते हैं।\nइस जगह पर एक और लीला हुई थी। एक बार बहुत समय पहले एक बूढी औरत झाड़ू मंडल में रहती थी और उनकी घर में एक चक्की था। वह इस चक्की का प्रयोग दूसरे लोगो का गेहूँ पीसने के लिए करती थी और इस तरह से वो अपना गुजारा करती थी। वह बूढी औरत श्री कृष्ण की बहुत बड़ी भक्त थी। जब वो चक्की चलाया करती थी तो चक्की घर्र-घर्र की आवाज करती थी और उनकी प्यारी आवाज श्री कृष्ण के गीत गया करती थी। एक दिन सुबह सुबह औरत चक्की चला रही थी और श्री कृष्ण का नाम जपने में व्यस्त थी। एक सुन्दर काले रंग की आकृति प्रकट हुई और उसने एक पाँव चक्की के ऊपर रख दिया उसने कहा \"मैया\" आप इस चाकी को इस तरह क्यों चलते हो की मैं सो नहीं पता यहाँ घर्र-घर्र की आवाज करती है? बूढी औरत थोड़ी घबरा गई और बोली -\"मेरे प्रिय पुत्र अगर मैं चक्की नहीं चलाऊंगी तो मेरे जीवन का गुजरा कैसे होगा काले रंग की आकृति वाले लड़के ने उत्तर दिया -\"मैं अपने चरण के निशान इस पत्थर पे रख देता हूँ। लोग इसके दर्शन करने के लिए आगे और दान देंगे। दान से तुम्हारा गुजरा हो जाएगा। \"अब तुम इस चक्की को और प्रयोग नहीं करोगी \" इतना कहकर वो आकृति अदृश्य हो गई। सुबह जब सुबह बूढी औरत ने चक्की को देखा तो उस चक्की पर पैरों की निशान बन चुके थी। उस आकृति को देखने की इच्छा से लोग पंक्तियों में खड़े थी और लोगो की भीड़ दिन प्रति दिन बढ़ती ही जा रही थी। दान की वजह से बूढी औरत अपना जीवन गुजारने में समर्थ थी । वह औरत हमेशा श्री कृष्ण की लीला में व्यस्त रहने लगी ।\nस्थान:\nझाडू मंडल यमुना जी के तट पर स्थित है, जो इमली तला और श्रिंगार वट के बहुत पास है।"])</script><script>self.__next_f.push([1,"d:[\"slug\",\"jhudu-mndal-vrindavana\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"content\",\"jhudu-mndal-vrindavana\"],\"initialTree\":[\"\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"jhudu-mndal-vrindavana\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"jhudu-mndal-vrindavana\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"jhudu-mndal-vrindavana\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Brea ull,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$Lc\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"content\",\"children\",\"$d\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Le\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Lc\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Le\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/cbf73327883ccb7f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/fe995a1e4635138b.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/848f1edf91a8622f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"className\":\"dark\",\"children\":[\"$\",\"body\",null,{\"className\":\"antialiased\",\"children\":[\"$\",\"$Lf\",null,{\"children\":[\"$\",\"$Lc\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Le\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFou

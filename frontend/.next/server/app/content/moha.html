 अनन्यनिश्चयात्म ग्रन्थ - उत्तरार्ध (34)\\nभावार्थ - प्राणी इस संसार में न तो किसी के साथ आये हैं और न (इस संसार से) किसी के साथ गये हैं। (सब अकेले पैदा होते हैं और अकेले ही मरते हैं।) यह मिलाप तो यहीं संसार यात्रा में हो गया है। दुनिया ममता के जाल में फँसी है, इसीलिए लोग पिता, पुत्र, माता, ससुर, जमाई पत्नी, मित्र, गुरु, शिष्य, धन, भाई बंधु आदि को अपना मानकर उनसे बिछुडने पर विलाप करते हैं। गुरु तो नित्य हैं श्यामा श्याम का ही स्वरूप है। भगवतरसिक जी कहते हैं कि लोग अनुभव की कमी के कारण संसार के सुखभोग में ऐसे सुध बुध खोये हैं कि हम कौन हैं, कहा जा रहे हैं, कहाँ से आये हैं, किसलिए आये है, आदि बातों का इन्हें होश ही नहीं है।\\n\\\"Moh Phaans Jaga Bandhi Rahyao, Bishthure Kaam Bilaap.\\nBichure Kaam Bilaap, Maani Sut, Pitu, Pati, Maata.\\nSasur, Jamaee, Jubati, Suhrid, Guru, Sish, Dhan, Bhraata.\\nNij Anubhav Ki Bhool, Bihaar Bhagavat Biramaye.\\nKo Ham, Kahaan Ko Jaata, Kahaan Te, Kihi Lagi Aaye.\\\"\\n- Shri Bhagwat Rasik, Bhagwat Rasik Ki Vani, AnanyaNishchayatma Granth - Uttarardh (34)\\nThe living beings neither have come with anyone in this world and nor have gone with anyone. (All are born alone and die alone). All these companions made in this world in the course of the time only. The world is trapped in false attachments, so people mourn for father, son, mother, father-in-law, son in law, wife, friend, master, disciple, wealth, brothers etc. as they believe they all are their own. Bhagvat Rasik ji says that, due to lack of experience, people have been lost in the false, temporary happiness of the world so that they have gone unaware of the ultimate truth of human life that, Who we are, where we are going, where we are coming from, for which reason we come for etc.\",\"author\":{\"@type\":\"Person\",\"name\":\"श्री भगवत रसिक, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ  उत्तरार्ध (34)\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"Vrindopnishad\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:T417,\"Moh Phaans Jaga Bandhi Rahyao, Bishthure Kaam Bilaap.\nBichure Kaam Bilaap, Maani Sut, Pitu, Pati, Maata.\nSasur, Jamaee, Jubati, Suhrid, Guru, Sish, Dhan, Bhraata.\nNij Anubhav Ki Bhool, Bihaar Bhagavat Biramaye.\nKo Ham, Kahaan Ko Jaata, Kahaan Te, Kihi Lagi Aaye.\"\n- Shri Bhagwat Rasik, Bhagwat Rasik Ki Vani, AnanyaNishchayatma Granth - Uttarardh (34)\nThe living beings neither have come with anyone in this world and nor have gone with anyone. (All are born alone and die alone). All these companions made in this world in the course of the time only. The world is trapped in false attachments, so people mourn for father, son, mother, father-in-law, son in law, wife, friend, master, disciple, wealth, brothers etc. as they believe they all are their own. Bhagvat Rasik ji says that, due to lack of experience, people have been lost in the false, temporary happiness of the world so that they have gone unaware of the ultimate truth of human life that, Who we are, where we are going, where we are coming from, for which reason we come for etc.c:[\"slug\",\"moha\",\"d\"]\n11:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"content\",\"moha\"],\"initialTree\":[\"\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"moha\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"moha\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"moha\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\  हैं। गुरु तो नित्य हैं श्यामा श्याम का ही स्वरूप है। भगवतरसिक जी कहते हैं कि लोग अनुभव की कमी के कारण संसार के सुखभोग में ऐसे सुध बुध खोये हैं कि हम कौन हैं, कहा जा रहे हैं, कहाँ से आये हैं, किसलिए आये है, आदि बातों का इन्हें होश ही नहीं है।\",\"english_text\":null,\"english_translation\":\"$a\",\"description\":\"https://www.brajrasik.org/hi/articles/5ae412279f7ab760360f9c3b/maya-faans-jaga-bandhi-rahyo-pada-by-shri-bhagwat-rasik-bhagwad-rasik-ki-vaani\",\"author\":\"श्री भगवत रसिक, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ  उत्तरार्ध (34)\",\"status\":\"published\",\"content_text\":\"मोह-फाँस जग बँधि रह्यौ, बिष्ठुरे करत बिलाप ||\\nबिछुरे करत बिलाप, मानि सुत, पितु, पति, माता |\\nससुर, जमाई, जुबति, सुहृद, गुरु, सिष, धन, भ्राता\\nनिज अनुभव की भूल, बिभव भगवत बिरमाये |\\nको हम, कहँ को जात, कहाँ ते, किहि लगि आये ||\\n- श्री भगवत रसिक, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ - उत्तरार्ध (34)\\nभावार्थ - प्राणी इस संसार में न तो किसी के साथ आये हैं और न (इस संसार से) किसी के साथ गये हैं। (सब अकेले पैदा होते हैं और अकेले ही मरते हैं।) यह मिलाप तो यहीं संसार यात्रा में हो गया है। दुनिया ममता के जाल में फँसी है, इसीलिए लोग पिता, पुत्र, माता, ससुर, जमाई पत्नी, मित्र, गुरु, शिष्य, धन, भाई बंधु आदि को अपना मानकर उनसे बिछुडने पर विलाप करते हैं। गुरु तो नित्य हैं श्यामा श्याम का ही स्वरूप है। भगवतरसिक जी कहते हैं कि लोग अनुभव की कमी के कारण संसार के सुखभोग में ऐसे सुध बुध खोये हैं कि हम कौन हैं, कहा जा रहे हैं, कहाँ से आये हैं, किसलिए आये है, आदि बातों का इन्हें होश ही नहीं है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5ae412279f7ab760360f9c3b/maya-faans-jaga-bandhi-rahyo-pada-by-shri-bhagwat-rasik-bhagwad-rasik-ki-vaani\",\"slug\":\"moha\"},\"initialRelatedSaint\":{\"name\":\"श्री भगवत रसिक, भगवत रसिक की वाणी,\",\"hinglishName\":\"shri bhagavat rasik, bhagavat rasik ki vani,\",\"slug\":\"shri-bhagavat-rasik-bhagavat-rasik-ki-vani\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-67\",\"title\":\"श्री भगवत उर धारी, भक्ति करि मन को दाबै\",\"category\":\"Shloka\",\"sanskrit_text\":\"श्री भगवत उर धारी, भक्ति करि मन को दाबै |गुरु आज्ञा अनुकूल रहै, नहीं वेदन खावै ||\",\"hindi_text\":\"निर्विरोध मनरंजन\\n(11)\\nजो व्यक्ति श्री हरी को हृदय स्थल में विराजमान करके उनकी सच्ची भक्ति करता है और मन को वश में करके गुरु की आज्ञा के अनुसार चलता है, उसे संसार की कोई वेदना नहीं भुकतनी पड़ती |\",\"english_text\":null,\"english_translation\":\"No pain of the material world can disturb the one who performs true devotion to Shri Krishn by contemplating on him while subduing the sensual pleasures and following the instructions of the spiritual master.\",\"description\":\"https://www.brajrasik.org/hi/articles/5ba92b11cc5cca0056cd3225/shri-bhagwat-ura-dhari-bhakti-kari-mana-ko-daabe-shri-bhagwat-rasik-bhagwat-rasik-ki-vani-11\",\"author\":\"श्री भगवत रसिक, भगवत रसिक की वाणी,\",\"status\":\"published\",\"content_text\":\"श्री भगवत उर धारी, भक्ति करि मन को दाबै |\\nगुरु आज्ञा अनुकूल रहै, नहीं वेदन खावै ||\\n- श्री भगवत रसिक, भगवत रसिक की वाणी,\\nनिर्विरोध मनरंजन\\n(11)\\nजो व्यक्ति श्री हरी को हृदय स्थल में विराजमान करके उनकी सच्ची भक्ति करता है और मन को वश में करके गुरु की आज्ञा के अनुसार चलता है, उसे संसार की कोई वेदना नहीं भुकतनी पड़ती |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5ba92b11cc5cca0056cd3225/shri-bhagwat-ura-dhari-bhakti-kari-mana-ko-daabe-shri-bhagwat-rasik-bhagwat-rasik-ki-vani-11\",\"slug\":\"shri-bhagavat-ur-dhari-bhakti-kari-man-ko-dabai\"},{\"id\":\"local-192\",\"title\":\"पायन परि बिनती करे, से रस मुख्य सिंगार\",\"category\":\"Shloka\",\"sanskrit_text\":\"पायन परि बिनती करे, से रस मुख्य सिंगार ||\",\"hindi_text\":\"अनन्यरसिकभरण ग्रंथ 1 (8)\\nलाल जी श्री प्रिया जी के चरणों में पड़ कर उनसे जो दैन्य पूर्वक विनय किया करते हैं वही मुख्य रस श्रृंगार रस है।\",\"english_text\":null,\"english_translation\":\"Falling at the lotus feet of Sri Radha, the way Shri Krishn plea to her in a very humble manner, that is main bliss called \\\"Shringar Rasa\\\".\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0ba1c09f7ab760360f9c69/payan-pare-binati-kare-se-ras-mukhya-singaar-shri-bhagwat-rasik-shri-bhagwat-rasik-ki-bani\",\"author\":\"श्री भगवत रसिक, भगवत रसिक की वाणी,\",\"status\":\"published\",\"content_text\":\"पायन परि बिनती करे, से रस मुख्य सिंगार ||\\n- श्री भगवत रसिक, भगवत रसिक की वाणी,\\nअनन्यरसिकभरण ग्रंथ 1 (8)\\nलाल जी श्री प्रिया जी के चरणों में पड़ कर उनसे जो दैन्य पूर्वक विनय किया करते हैं वही मुख्य रस श्रृंगार रस है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0ba1c09f7ab760360f9c69/payan-pare-binati-kare-se-ras-mukhya-singaar-shri-bhagwat-rasik-shri-bhagwat-rasik-ki-bani\",\"slug\":\"payan-pari-binati-kare-se-ras-mukhy-singara\"},{\"id\":\"local-326\",\"title\":\"लात हनी भृगु हृदय में\",\"category\":\"Shloka\",\"sanskrit_text\":\"लात हनी भृगु हृदय में, हरि कीन्हीं सनमान।अम्बरीष अपराध सुनि, भगवत मूंदे कान॥\",\"hindi_text\":\"अनन्य निश्चयात्मक ग्रंथ [पूर्वार्ध] (19)\\nजब भृगुजी ने भगवान् के वक्षस्थल पर लात मारी तो भगवान् ने अपने ऊपर किये हुए पादाघात के अपराध पर रुष्ट न होकर भृगुजी का सम्मान किया। किन्तु जब भगवान् ने यह सुना कि दुर्वासाजी ने मेरे भक्त अम्बरीष का अपराध किया है, तो उन्होंने अपने कान बंद कर लिये और चक्र चला दिया। भगवान् अपने भक्त के प्रति अपराध किये जाने की बात भी सुन नहीं सकते, फिर यह तो वे कभी भी बर्दाश्त नहीं कर सकते कि उनके भक्त पर कोई अपराध करे।\",\"english_text\":null,\"english_translation\":\"When Bhrigu kicked Śrī Hari's chest, Śrī Hari remained unperturbed and honored him fully. Yet upon hearing of Durvāsā's offense against devotee Ambarīśa, Śrī Hari closed His ears and dispatched Sudarśana Cakra to slay Durvāsā—He cannot tolerate even hearing of harm planned against His devotees.\",\"description\":\"https://www.brajrasik.org/hi/articles/5aa1daee9f7ab760360f9bf1/laat-hani-bhrigu-hridey-mein-hari-kinhi-sanmaan-ambrish-apradh-suni-bhagwat-munde-kaan-shri-bhagwat-rasik-bhagwat-rasik-ki-vaani\",\"author\":\"श्री भगवत रसिक, भगवत रसिक की वाणी,\",\"status\":\"published\",\"content_text\":\"लात हनी भृगु हृदय में, हरि कीन्हीं सनमान।\\nअम्बरीष अपराध सुनि, भगवत मूंदे कान॥\\n- श्री भगवत रसिक, भगवत रसिक की वाणी,\\nअनन्य निश्चयात्मक ग्रंथ [पूर्वार्ध] (19)\\nजब भृगुजी ने भगवान् के वक्षस्थल पर लात मारी तो भगवान् ने अपने ऊपर किये हुए पादाघात के अपराध पर रुष्ट न होकर भृगुजी का सम्मान किया। किन्तु जब भगवान् ने यह सुना कि दुर्वासाजी ने मेरे भक्त अम्बरीष का अपराध किया है, तो उन्होंने अपने कान बंद कर लिये और चक्र चला दिया। भगवान् अपने भक्त के प्रति अपराध किये जाने की बात भी सुन नहीं सकते, फिर यह तो वे कभी भी बर्दाश्त नहीं कर सकते कि उनके भक्त पर कोई अपराध करे।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5aa1daee9f7ab760360f9bf1/laat-hani-bhrigu-hridey-mein-hari-kinhi-sanmaan-ambrish-apradh-suni-bhagwat-munde-kaan-shri-bhagwat-rasik-bhagwat-rasik-ki-vaani\",\"slug\":\"lat-hani-bhrigu-hriday-men\"},{\"id\":\"local-500\",\"title\":\"हमारी दंपति संपति केलि\",\"category\":\"Shloka\",\"sanskrit_text\":\"हमारी दंपति संपति केलि।\",\"hindi_text\":\"अनन्यरसिकभरण ग्रंथ 12 (5)\\nश्री भगवत रसिक जी कहते हैं कि प्रिया प्रियतम की केलि लीला ही हमारी सम्पति है।\",\"english_text\":null,\"english_translation\":\"Shri Bhagwat Rasik says the treasure of my life is the ‘Keli’ leela of the divine couple Shri Radha Krishn.\",\"description\":\"https://www.brajrasik.org/hi/articles/5bc0c7936972640059a3b0f3/humari-dampati-sampati-keli-shri-bhagwat-rasik-bhagwat-rasik-ki-vani\",\"author\":\"श्री भगवत रसिक, भगवत रसिक की वाणी,\",\"status\":\"published\",\"content_text\":\"हमारी दंपति संपति केलि।\\n- श्री भगवत रसिक, भगवत रसिक की वाणी,\\nअनन्यरसिकभरण ग्रंथ 12 (5)\\nश्री भगवत रसिक जी कहते हैं कि प्रिया प्रियतम की केलि लीला ही हमारी सम्पति है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5bc0c7936972640059a3b0f3/humari-dampati-sampati-keli-shri-bhagwat-rasik-bhagwat-rasik-ki-vani\",\"slug\":\"hamari-dnpati-snpati-keli\"},{\"id\":\"local-641\",\"title\":\"भगवत रसिक संग जो चाहै, प्रथमहै लोभै त्यागै\",\"category\":\"Shloka\",\"sanskrit_text\":\"भगवत रसिक संग जो चाहै, प्रथमहै लोभै त्यागै |देह, गेह, सुत, सम्पति, द्वारा तब हरी सौं अनुरागै ||\",\"hindi_text\":\"अनन्य निश्चयात्मक ग्रंथ [पूर्वार्ध]\\n(05)\\nश्री भगवतरसिकजी कहते हैं कि जो साधक परम रसिक श्रीयुगल की नित्य संगति के अभिलाशी हैं, उन्हें सर्वप्रथम लोभ का परित्याग कर देना चाहिये, फिर शरीर, घर, पुत्र, धन, दौलत, स्त्री आदि के प्रति अनासक्त होकर हरी से प्रेम करना चाहिए |\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5bb05b78d8c34c0056850711/bhagwat-rasik-sang-jo-chahe-prathamhe-lobhe-tyage-shri-bhagwat-rasik-ki-vani-05\",\"author\":\"श्री भगवत रसिक, भगवत रसिक की वाणी,\",\"status\":\"published\",\"content_text\":\"भगवत रसिक संग जो चाहै, प्रथमहै लोभै त्यागै |\\nदेह, गेह, सुत, सम्पति, द्वारा तब हरी सौं अनुरागै ||\\n- श्री भगवत रसिक, भगवत रसिक की वाणी,\\nअनन्य निश्चयात्मक ग्रंथ [पूर्वार्ध]\\n(05)\\nश्री भगवतरसिकजी कहते हैं कि जो साधक परम रसिक श्रीयुगल की नित्य संगति के अभिलाशी हैं, उन्हें सर्वप्रथम लोभ का परित्याग कर देना चाहिये, फिर शरीर, घर, पुत्र, धन, दौलत, स्त्री आदि के प्रति अनासक्त होकर हरी से प्रेम करना चाहिए |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5bb05b78d8c34c0056850711/bhagwat-rasik-sang-jo-chahe-prathamhe-lobhe-tyage-shri-bhagwat-rasik-ki-vani-05\",\"slug\":\"bhagavat-rasik-sng-jo-chahai-prathamahai-lobhai-tyagai\"}],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\

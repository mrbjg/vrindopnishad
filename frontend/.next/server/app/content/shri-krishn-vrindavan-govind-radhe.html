"content_text\":\"“ श्री कृष्ण वृन्दावन गोविन्द राधे,\\nनित नई नई करें लीला बतादे || ”\\n-जगदगुरु श्री कृपालु जी महाराज, राधा गोविन्द गीत (4870)\\nश्री कृष्ण लगातार वृंदावन में नयी नयी लीला करते हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a3659c159e8c72a534d8625/shri-krishn-vrindavan-govind-radhey-nitya-nai-nai-karein-leela-batade-jagadguru-shri-kripaluji-maharaj-radha-govind-geet-4870\",\"slug\":\"shri-krishn-vrindavan-govind-radhe\"},\"initialRelatedSaint\":{\"name\":\"जगदगुरु श्री कृपालु  महाराज\",\"hinglishName\":\"jagadaguru shri kripalu maharaja\",\"slug\":\"jagadaguru-shri-kripalu-maharaja\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-6\",\"title\":\"जो भी मेरी प्यारी पर जाए वारी वारी\",\"category\":\"Shloka\",\"sanskrit_text\":\"जो भी मेरी प्यारी पर जाए वारी वारी , वाही बड़भागी पर जाऊँ वारी वारी ||\",\"hindi_text\":\"जो भी राधारानी पर अपना सर्वस्व लुटायेगा, मैं उस बड़भागी जीव पर अपना सर्वस्व लुटाऊंगा।\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5a4cced859e8c72a534d8691/jo-bhi-meri-pyari-par-jaye-vari-vari-vahi-badhbhagi-par-jaun-vari-vari-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"जो भी मेरी प्यारी पर जाए वारी वारी , वाही बड़भागी पर जाऊँ वारी वारी ||\\n-जगदगुरु श्री कृपालु जी महाराज\\nजो भी राधारानी पर अपना सर्वस्व लुटायेगा, मैं उस बड़भागी जीव पर अपना सर्वस्व लुटाऊंगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4cced859e8c72a534d8691/jo-bhi-meri-pyari-par-jaye-vari-vari-vahi-badhbhagi-par-jaun-vari-vari-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"jo-bhi-meri-pyari-par-jae-vari-vari\"},{\"id\":\"local-64\",\"title\":\"नहीं उऋण कबहुँ उपकार\",\"category\":\"Shloka\",\"sanskrit_text\":\"नहीं उऋण कबहुँ उपकार, बलिहार बलिहार॥\",\"hindi_text\":\"हे श्री राधा, मैं कभी भी अपके कृपा के ऋण से मुक्त नहीं हो सकता। मैं अपने आप को बार-बार आपको न्योछावर करता हूँ।\",\"english_text\":null,\"english_translation\":\"O Shri Radha, I Can Never Be Free from Your Debt. I Sacrifice Myself on You Again and Again.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4e116f59e8c72a534d86b4/nahin-urina-kabahun-upakaar-balihaar-balihaar-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"नहीं उऋण कबहुँ उपकार, बलिहार बलिहार॥\\n- जगदगुरु श्री कृपालु जी महाराज\\nहे श्री राधा, मैं कभी भी अपके कृपा के ऋण से मुक्त नहीं हो सकता। मैं अपने आप को बार-बार आपको न्योछावर करता हूँ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4e116f59e8c72a534d86b4/nahin-urina-kabahun-upakaar-balihaar-balihaar-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"nahin-urin-kabahun-upakara\"},{\"id\":\"local-275\",\"title\":\"नरक स्वर्ग अपवर्ग आदि की\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ नरक स्वर्ग अपवर्ग आदि की, ख़ाक वृथा मत छानिये |तुम हो नित्य किंकरी जिनकी, तीन स्वरुप पहचानिये || ”\",\"hindi_text\":\"हे अज्ञानी प्राणी, तुम बिना किसी उदेश्य के नरक और स्वर्ग आदि में भटकते हो ? तुम श्री राधा के नित्य दास हो। इसे पहचानने की कोशिश करो |\",\"english_text\":null,\"english_translation\":\"O ignorant beings, Why are you aimlessly wandering into hell and heaven etc for nothing? You are natural and eternal servant of Shri Radha. Try to recognize it.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4f37e259e8c72a534d86e6/narak-swarg-apavarg-aadi-ki-khaak-vritha-math-chaniye-tum-ho-nitya-kinkari-jinki-teen-swaroop-pehchaniye-his-holiness-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"“ नरक स्वर्ग अपवर्ग आदि की, ख़ाक वृथा मत छानिये |\\nतुम हो नित्य किंकरी जिनकी, तीन स्वरुप पहचानिये || ”\\n- जगदगुरु श्री कृपालु जी महाराज\\nहे अज्ञानी प्राणी, तुम बिना किसी उदेश्य के नरक और स्वर्ग आदि में भटकते हो ? तुम श्री राधा के नित्य दास हो। इसे पहचानने की कोशिश करो |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4f37e259e8c72a534d86e6/narak-swarg-apavarg-aadi-ki-khaak-vritha-math-chaniye-tum-ho-nitya-kinkari-jinki-teen-swaroop-pehchaniye-his-holiness-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"narak-svarg-apavarg-adi-ki\"},{\"id\":\"local-281\",\"title\":\"ऐसी कृपा करू कृपामयी राधे\",\"category\":\"Shloka\",\"sanskrit_text\":\"ऐसी कृपा करू कृपामयी राधे,तोहि भूलूँ नहीं पल छिन्न आधे॥\",\"hindi_text\":\"ओह दयामयी राधे, मुझे आप ऐसा आशीष दो कि मैं आपको आधे क्षण के लिए भी नहीं भूलूँ l\",\"english_text\":null,\"english_translation\":\"Oh, Graceful Radhey, bless me such that I never forget you for even half a moment.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4b1e9959e8c72a534d8659/aisi-kripa-karu-kripamayi-radhey-tohi-bhulun-nahin-pal-chinn-aadhey-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"ऐसी कृपा करू कृपामयी राधे,\\nतोहि भूलूँ नहीं पल छिन्न आधे॥\\n- जगदगुरु श्री कृपालु जी महाराज\\nओह दयामयी राधे, मुझे आप ऐसा आशीष दो कि मैं आपको आधे क्षण के लिए भी नहीं भूलूँ l\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4b1e9959e8c72a534d8659/aisi-kripa-karu-kripamayi-radhey-tohi-bhulun-nahin-pal-chinn-aadhey-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"aisi-kripa-karu-kripamayi-radhe\"},{\"id\":\"local-311\",\"title\":\"“मन तेरो सांचो यार ब्रजराज कुमार |  रसिकन दरबार तेरो सांचो घर बार || ”\",\"category\":\"Shloka\",\"sanskrit_text\":\"“मन तेरो सांचो यार ब्रजराज कुमार |रसिकन दरबार तेरो सांचो घर बार || ”\",\"hindi_text\":\"हे मन! तेरा सच्चा यार ब्रज का राजकुमार श्री कृष्ण ही है और रसिकों का संग एवं उनका दरबार ही तेरा वास्तविक घर है |\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5a6cc20582274812fecf966e/mana-tero-sancho-yaar-brajraaj-kumar-rasikan-darbar-tero-sancho-ghar-baar-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"“मन तेरो सांचो यार ब्रजराज कुमार |\\nरसिकन दरबार तेरो सांचो घर बार || ”\\n- जगदगुरु श्री कृपालु जी महाराज\\nहे मन! तेरा सच्चा यार ब्रज का राजकुमार श्री कृष्ण ही है और रसिकों का संग एवं उनका दरबार ही तेरा वास्तविक घर है |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a6cc20582274812fecf966e/mana-tero-sancho-yaar-brajraaj-kumar-rasikan-darbar-tero-sancho-ghar-baar-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"man-tero-sancho-yar-brajaraj-kumar-rasikan-darabar-tero-sancho-ghar-bar\"},{\"id\":\"local-323\",\"title\":\"जेहि रस लगी हरि हर तरसत\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ जेहि रस लगी हरि हर तरसत, बरसत एहि दरबार | ”\",\"hindi_text\":\"भगवान ब्रह्मा, विष्णु, शंकर आदि भी जिस दिव्य आनंद रसामृत के लिए लालियत रहते हैं, वह रस श्री राधा रानी के दरबार में नित्य बरस रहा है।\",\"english_text\":null,\"english_translation\":\"The nectar of divine bliss, which is craved for even by Lord Brahma, Vishnu, Shankar, perpetually flows in the kingdom of Shri Radha.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a36554159e8c72a534d8619/jehi-ras-lagi-hari-har-tarsat-barsat-ehi-darbar-jagadguru-shri-kripaluji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"“ जेहि रस लगी हरि हर तरसत, बरसत एहि दरबार | ”\\n- जगदगुरु श्री कृपालु जी महाराज\\nभगवान ब्रह्मा, विष्णु, शंकर आदि भी जिस दिव्य आनंद रसामृत के लिए लालियत रहते हैं, वह रस श्री राधा रानी के दरबार में नित्य बरस रहा है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a36554159e8c72a534d8619/jehi-ras-lagi-hari-har-tarsat-barsat-ehi-darbar-jagadguru-shri-kripaluji-maharaj\",\"slug\":\"jehi-ras-lagi-hari-har-tarasata\"},{\"id\":\"local-368\",\"title\":\"तेहि मोहिं साधन हीन जान के रसिकन दई बताई\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ तेहि मोहिं साधन हीन जान के रसिकन दई बताई,सोइ कृपालु बिन मोल मिळत निधि, राधे नाम सदाई ||”\",\"hindi_text\":\"मुझे पूरी तरह से साधन हीन देखते हुए, रसिक संतों ने दिव्य खजाने के रहस्य के बारे में बताया है | जगदगुरु श्री कृपालु जी महाराज कहते हैं, \\\"यह अनमोल खजाना श्री राधा का नाम है, जो कि सब को बिना किसी दाम के उपलब्ध है।\",\"english_text\":null,\"english_translation\":\"Considering me totally helpless, the Rasik saints revealed the secret about the divine treasure. Jagadguru Shri Kripalu Ji Maharaj says “That priceless treasure is the divine name of Shri Radha, which is always accessible to anyone free of cost.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5a518d1e82274812fecf9647/tehi-mohin-saadhan-heen-jaan-ke-rasikan-daee-baai-soi-kripalu-bin-mol-milat-nidhi-raadhe-naam-sadaee-his-holiness-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"“ तेहि मोहिं साधन हीन जान के रसिकन दई बताई,\\nसोइ कृपालु बिन मोल मिळत निधि, राधे नाम सदाई ||”\\n- जगदगुरु श्री कृपालु जी महाराज\\nमुझे पूरी तरह से साधन हीन देखते हुए, रसिक संतों ने दिव्य खजाने के रहस्य के बारे में बताया है | जगदगुरु श्री कृपालु जी महाराज कहते हैं, \\\"यह अनमोल खजाना श्री राधा का नाम है, जो कि सब को बिना किसी दाम के उपलब्ध है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a518d1e82274812fecf9647/tehi-mohin-saadhan-heen-jaan-ke-rasikan-daee-baai-soi-kripalu-bin-mol-milat-nidhi-raadhe-naam-sadaee-his-holiness-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"tehi-mohin-sadhan-hin-jan-ke-rasikan-dai-batai\"},{\"id\":\"local-382\",\"title\":\"नर तनु शरद चाँदनी बीते, पुनि अँधियारी रात\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\" नर तनु शरद चाँदनी बीते, पुनि अँधियारी रात \\\"\",\"hindi_text\":\"जैसे कुछ क्षणों में पूर्णिमा की रात्री व्यतीत हो जाती है, उसी प्रकार यह मानव जीवन भी कुछ क्षणों में समाप्त हो जाएगा, यदि इस मानव जीवन में हरी भक्ति नहीं की, तो जीवन समाप्त होते ही नर्क की रात्री उपस्थित है।\",\"english_text\":null,\"english_translation\":\"The splendor of moonlight of human life is temporary. There will be nothing except utter darkness hereafter if One doesn’t perform the practice of devotion.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4d7bc259e8c72a534d86a8/nara-tanu-sharad-chandani-beeti-puni-andhiyari-raat-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"\\\" नर तनु शरद चाँदनी बीते, पुनि अँधियारी रात \\\"\\n- जगदगुरु श्री कृपालु जी महाराज\\nजैसे कुछ क्षणों में पूर्णिमा की रात्री व्यतीत हो जाती है, उसी प्रकार यह मानव जीवन भी कुछ क्षणों में समाप्त हो जाएगा, यदि इस मानव जीवन में हरी भक्ति नहीं की, तो जीवन समाप्त होते ही नर्क की रात्री उपस्थित है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4d7bc259e8c72a534d86a8/nara-tanu-sharad-chandani-beeti-puni-andhiyari-raat-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"nar-tanu-sharad-chandani-bite-puni-andhiyari-rata\"},{\"id\":\"local-394\",\"title\":\"पाय तिहारो प्रेम किशोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ पाय तिहारो प्रेम किशोरी, छके प्रेमरस ब्रज की खोरी || ”\",\"hindi_text\":\"हे किशोरी श्री राधे! आप से प्रेम का उपहार प्राप्त करके मैं ब्रज की एक एक गली में विहरण करूँगा ।\",\"english_text\":null,\"english_translation\":\"O Kishori Shri Radhey! Receiving the gift of love from You and completely submerged in divine love-bliss, let me stroll in each and every lane of Braj.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a51931182274812fecf964b/paay-tihaaro-prem-kishoree-chhake-premaras-braj-ki-khori-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"“ पाय तिहारो प्रेम किशोरी, छके प्रेमरस ब्रज की खोरी || ”\\n- जगदगुरु श्री कृपालु जी महाराज\\nहे किशोरी श्री राधे! आप से प्रेम का उपहार प्राप्त करके मैं ब्रज की एक एक गली में विहरण करूँगा ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a51931182274812fecf964b/paay-tihaaro-prem-kishoree-chhake-premaras-braj-ki-khori-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"pay-tiharo-prem-kishori\"},{\"id\":\"local-482\",\"title\":\"नित्य विहार करत बनि सहचरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\"नित्य विहार करत बनि सहचरी, विरह न रस पल आधा |प्रेम, रस, रूप अगाधा राधा ||\\\"\",\"hindi_text\":\"श्री राधारानी के अनन्य भक्त, उन्ही की सहचरी बन कर नित्य विहार का रस पाते हैं।\",\"english_text\":null,\"english_translation\":\"The exclusive devotees of Shri Radha become eternal participants as a “Sehchari” of her divine pastimes (Nitya Vihaar) without being separated, even for half a moment.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4e0d0059e8c72a534d86aa/nitya-vihaar-karat-bani-sehchari-virah-na-ras-pal-aadha-prem-ras-roop-agadha-radha-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"\\\"नित्य विहार करत बनि सहचरी, विरह न रस पल आधा |\\nप्रेम, रस, रूप अगाधा राधा ||\\\"\\n-जगदगुरु श्री कृपालु जी महाराज\\nश्री राधारानी के अनन्य भक्त, उन्ही की सहचरी बन कर नित्य विहार का रस पाते हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4e0d0059e8c72a534d86aa/nitya-vihaar-karat-bani-sehchari-virah-na-ras-pal-aadha-prem-ras-roop-agadha-radha-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"nity-vihar-karat-bani-sahachari\"},{\"id\":\"local-516\",\"title\":\"जोई भज ‘राधा राधा\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\" जोई भज ‘राधा राधा’, तेही अपनावती राधा,दे प्रेम सुधा राधा, सोइ मम ‘कृपालु’ राधा || \\\"\",\"hindi_text\":\"जो जीव ‘राधा राधा’ निरंतर भजता है उसको श्री किशोरी जी अपना लेती हैं और अपनी प्रेम सुधा भक्ति देती हैं, ऐसी कृपालु श्री राधा हैं ।\",\"english_text\":null,\"english_translation\":\"Shri Radha accepts and gives the nectar of Divine love to those, who chant Her name constantly.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4cd26059e8c72a534d8698/joi-bhaj-radha-radha-tehi-apnavati-radha-de-prem-sudha-radha-soi-mam-kripalu-radha-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"\\\" जोई भज ‘राधा राधा’, तेही अपनावती राधा,\\nदे प्रेम सुधा राधा, सोइ मम ‘कृपालु’ राधा || \\\"\\n- जगदगुरु श्री कृपालु जी महाराज\\nजो जीव ‘राधा राधा’ निरंतर भजता है उसको श्री किशोरी जी अपना लेती हैं और अपनी प्रेम सुधा भक्ति देती हैं, ऐसी कृपालु श्री राधा हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4cd26059e8c72a534d8698/joi-bhaj-radha-radha-tehi-apnavati-radha-de-prem-sudha-radha-soi-mam-kripalu-radha-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"joi-bhaj-radha-radha\"},{\"id\":\"local-522\",\"title\":\"कहँ लौं बैकुंठ लोकहूँ, रूचि नहीं तुक सपनेहुँ मोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ कहँ लौं बैकुंठ लोकहूँ, रूचि नहीं तुक सपनेहुँ मोरी |इक भावत चंचल नंदनंदन, एक वृषभानुलली भोरी || ”\",\"hindi_text\":\"यहां तक कि 'बैकुंठ' का रस सपने में भी मुझे आकर्षित नहीं करता है। एक नटखट श्रीकृष्ण और भोरी श्री राधारानी का युगल रस ही मुझे केवल आकर्षित करता है ।\",\"english_text\":null,\"english_translation\":\"Even the nectar of ‘Baikunth’ does not attract me, not even in my dreams. I relish the bliss of mischievous Shri Krishn and innocent Radha Rani.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4b3e7b59e8c72a534d8677/kajhan-laun-kaha-beikuntha-lokahoonruchi-nahin-tuka-sapanuhun-mori-ika-bhavata-chanchala-nandnandan-ika-vrishbhanu-lalee-bhori-jagadguru-shri-kripalu-ji-mahara\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"“ कहँ लौं बैकुंठ लोकहूँ, रूचि नहीं तुक सपनेहुँ मोरी |\\nइक भावत चंचल नंदनंदन, एक वृषभानुलली भोरी || ”\\n- जगदगुरु श्री कृपालु जी महाराज\\nयहां तक कि 'बैकुंठ' का रस सपने में भी मुझे आकर्षित नहीं करता है। एक नटखट श्रीकृष्ण और भोरी श्री राधारानी का युगल रस ही मुझे केवल आकर्षित करता है ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4b3e7b59e8c72a534d8677/kajhan-laun-kaha-beikuntha-lokahoonruchi-nahin-tuka-sapanuhun-mori-ika-bhavata-chanchala-nandnandan-ika-vrishbhanu-lalee-bhori-jagadguru-shri-kripalu-ji-mahara\",\"slug\":\"kahn-laun-baikunth-lokahun-ruchi-nahin-tuk-sapanehun-mori\"},{\"id\":\"local-598\",\"title\":\"भलो बुरो जस तेरो री किशोरी राधे\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\" भलो बुरो जस तेरो री किशोरी राधे || ”\",\"hindi_text\":\"हे किशोरी राधे, चाहे भला हूँ या बुरा हूँ, मैं आपका हूँ।\",\"english_text\":null,\"english_translation\":\"Oh Kishori Radha (one who is ever young), whether I am good or bad, I am yours.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4c267459e8c72a534d8683/bhalo-buro-jas-tero-ri-kishori-radhey-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगदगुरु श्री कृपालु जी महाराज\",\"status\":\"published\",\"content_text\":\"\\\" भलो बुरो जस तेरो री किशोरी राधे || ”\\n-जगदगुरु श्री कृपालु जी महाराज\\nहे किशोरी राधे, चाहे भला हूँ या बुरा हूँ, मैं आपका हूँ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4c267459e8c72a534d8683/bhalo-buro-jas-tero-ri-kishori-radhey-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"bhalo-buro-jas-tero-ri-kishori-radhe\"}],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना

7830f0-bde263843179a996.js\",\"1401\",\"static/chunks/d8b2f613-9822c7accee3e330.js\",\"1464\",\"static/chunks/4ea34a6d-26b267dedec28637.js\",\"9762\",\"static/chunks/44530001-97951b7dfbe773fa.js\",\"4785\",\"static/chunks/4785-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"ClientProvide"])</script><script>self.__next_f.push([1,"rs\"]\n12:I[1060,[],\"\"]\n6:T1464,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"पुराना रास मंडल, वृंदावन / श्री रासेश्वरी जी महाराज वृंदावन\",\"description\":\"https://www.brajrasik.org/hi/articles/5b4987549f7ab760360f9cd6/old-raas-mandal-vrindavan-shri-raseshwari-ji-maharaj-vrindavan\",\"articleBody\":\"रास मंडल में श्री हरिराम व्यास ने किशोरीजी को पायल पहनाई:\\nयहां रास मंडल में एक बार श्री राधा-कृष्ण रास नृत्य कर रहे थे और राधारानी की पायल टूट गई, व्यासजी (विशाखा सखी के अवतार) जो कि लीला में लीन थे, उन्होंने तुरंत अपनी तुलसी माला को गले से तोड़कर श्री प्रिया जू के चरणों में बांध दिया । वैष्णवों में से कुछ ने उनके इस व्यवहार के बारे में शिकायत की। लेकिन वह अपने निर्णय पर बहुत दृढ़ थे क्योंकि उन्होंने सुझाव दिया था कि श्री राधारानी की सेवा में इसका इस्तेमाल नहीं किया जा सकता है तो यह मेरे लिए किस काम का है। इस बात को सुनकर सब दंग रह गए।\\nश्री सेवक जी (दामोदरदास जी) :\\nश्री दामोदर दास जी जिनको सेवक जी के नाम से भी जाना जाता है, वह इसी जगह वृक्ष के नीचे बैठे हुए निकुंज लीला में पधार गए थे। ऐसा भी माना जाता है कि वह उस वृक्ष में लीन हो गए ।\\nश्री ध्रुवदास जी:\\nश्री ध्रुवदास जी: ध्रुवदास जी, श्री हित हरिवंशजी के तीसरे पुत्र, श्री गोपीनाथजी के शिष्य बने। कहा जाता है कि जब श्री ध्रुवदास जी को राधा रानी ने दर्शन दिए थे तब उनके हृदय में अपनी शक्ति दी थी जिससे उन्होंने इसी जगह पर बयालीस लीला नामक ग्रंथ लिखा जिसमें श्री राधा कृष्ण की निकुंज लीलाओं का वर्णन उन्होंने किया है।\\nमंदिर का समय:\\nगर्मी\\nसवेरे 6:00 बजे - मंगला आरती\\nशाम  7:15 बजे - शयन आरती\\nसर्दी\\nसवेरे 6:30 बजे - मंगला आरती\\nशाम  6:15 बजे - शयन आरती\\nस्थान:\\nहित रास मंडल, यमुना के किनारे, चीर घाट के पास स्थित है। इसको बड़ा रास मंडल भी कहते हैं।\\nIt has so happened that Shri Radha-Krishna was doing the Raas dance and Radharani’s anklet broke, Vyasji being absorbed in Leela, present there because of his divinity, instantly mended it with his sacred thread. Some of the Vaishnavas complained about his behavior of removing his sacred thread of tulsi beaded necklace and putting it on Shri Radha’s feet. He, in fact, was very firm on his decision as he suggested for what purpose is this sacred thread to me if it cannot be used in the service of Shri Radharani. Seeing this moment, everyone was stunned.\\nDivine Pastimes of Shri Sewak Ji:\\n(Damodardas Ji): Damodardas Ji was a disciple of Shri Hitharivansh Ji. Shri Sewak ji merged with a banyan tree becoming one with the Lord near Raas Mandala in Vrindavan.\\nDivine Pastimes of Shri Dhruvdas Ji:\\nShri Dhruvdas Ji: Dhruvdas Ji became a disciple of Shri Gopinathji, the third son of Shri Hit Harivanshji. Near Raas Mandal, Shri Radha-Krishna appeared once for his ardent desire. Actually sighting the Lord he composed padas compiled in the text ‘Bayalees Leela’ which showed the divine path to several bhaktas.\\nTimings of Temple:\\nSummer\\nMangla Aarti: 06:00 AM\\nShayan Aarti: 7:15 PM\\nWinter\\nMangla Aarti: 06:30 AM\\nShayan Aarti: 6:15 PM\\nLocation:\\nHit Raas Mandal is located at the bank of Yamuna, near to Cheer Ghat.\",\"author\":{\"@type\":\"Person\",\"name\":\"Braj Rasik Heritage\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"Vrindopnishad\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:Tc3a,"])</script><script>self.__next_f.push([1,"यहां रास मंडल में एक बार श्री राधा-कृष्ण रास नृत्य कर रहे थे और राधारानी की पायल टूट गई, व्यासजी (विशाखा सखी के अवतार) जो कि लीला में लीन थे, उन्होंने तुरंत अपनी तुलसी माला को गले से तोड़कर श्री  Shri Hit Harivanshji. Near Raas Mandal, Shri Radha-Krishna appeared once for his ardent desire. Actually sighting the Lord he composed padas compiled in the text ‘Bayalees Leela’ which showed the divine path to several bhaktas.\nTimings of Temple:\nSummer\nMangla Aarti: 06:00 AM\nShayan Aarti: 7:15 PM\nWinter\nMangla Aarti: 06:30 AM\nShayan Aarti: 6:15 PM\nLocation:\nHit Raas Mandal is located at the bank of Yamuna, near to Cheer Ghat.c:T1207,"])</script><script>self.__next_f.push([1,"इस स्थान का विशेष महत्व है क्योंकि यहाँ श्री श्री रासेश्वरी (राधारानी) जी की प्रतिमा श्याम रंग (काली) रूप में उपस्थित है।\nकहा जाता है कि इस जगह श्री कृष्ण की भक्ति में लीन रहने की वजह से, राधारानी के शरीर का रंग पूरी तरह से श्याम रंग में बदल गया। इसीलिए इस स्थान को श्री श्रीजी रासेश्वरी जी महाराज के नाम से भी जाना जाता है।\nश्री हित हरिवंश रास मंडल, श्री हितहरिवंश महाप्रभु से जुड़ा हुआ है। कहा जाता है कि हित हरिवंश महाप्रभु ने अपने जीवन का अधिकांश समय सेवा कुंज, हित रास मंडल और मदन टेर (वराह घाट) वृंदावन में बिताया।\nरास मंडल में श्री हरिराम व्यास ने किशोरीजी को पायल पहनाई:\nयहां रास मंडल में एक बार श्री राधा-कृष्ण रास नृत्य कर रहे थे और राधारानी की पायल टूट गई, व्यासजी (विशाखा सखी के अवतार) जो कि लीला में लीन थे, उन्होंने तुरंत अपनी तुलसी माला को गले से तोड़कर श्री प्रिया जू के चरणों में बांध दिया । वैष्णवों में से कुछ ने उनके इस व्यवहार के बारे में शिकायत की। लेकिन वह अपने निर्णय पर बहुत दृढ़ थे क्योंकि उन्होंने सुझाव दिया था कि श्री राधारानी की सेवा में इसका इस्तेमाल नहीं किया जा सकता है तो यह मेरे लिए किस काम का है। इस बात को सुनकर सब दंग रह गए।\nश्री सेवक जी (दामोदरदास जी) :\nश्री दामोदर दास जी जिनको सेवक जी के नाम से भी जाना जाता है, वह इसी जगह वृक्ष के नीचे बैठे हुए निकुंज लीला में पधार गए थे। ऐसा भी माना जाता है कि वह उस वृक्ष में लीन हो गए ।\nश्री ध्रुवदास जी:\nश्री ध्रुवदास जी: ध्रुवदास जी, श्री हित हरिवंशजी के तीसरे पुत्र, श्री गोपीनाथजी के शिष्य बने। कहा जाता है कि जब श्री ध्रुवदास जी को राधा रानी ने दर्शन दिए थे तब उनके हृदय में अपनी शक्ति दी थी जिससे उन्होंने इसी जगह पर बयालीस लीला नामक ग्रंथ लिखा जिसमें श्री राधा कृष्ण की निकुंज लीलाओं का वर्णन उन्होंने किया है।\nमंदिर का समय:\nगर्मी\nसवेरे 6:00 बजे - मंगला आरती\nशाम  7:15 बजे - शयन आरती\nसर्दी\nसवेरे 6:30 बजे - मंगला आरती\nशाम  6:15 बजे - शयन आरती\nस्थान:\nहित रास मंडल, यमुना के किनारे, चीर घाट के पास स्थित है। इसको बड़ा रास मंडल भी कहते हैं।"])</script><script>self.__next_f.push([1,"e:[\"slug\",\"purana-ras-mndal-vrindavan-shri-raseshvari-ji-maharaj-vrindavana\",\"d\"]\n13:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"content\",\"purana-ras-mndal-vrindavan-shri-raseshvari-ji-maharaj-vrindavana\"],\"initialTree\":[\"\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"purana-ras-mndal-vrindavan-shri-raseshvari-ji-maharaj-vrindavana\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"purana-ras-mndal-vrindavan-shri-raseshvari-ji-maharaj-vrindavana\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"purana-ras-mndal-vrindavan-shri-raseshvari-ji-maharaj-vrindavana\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Home\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Library\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/content\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"पुराना रास मंडल, वृंदावन / श्री रासेश्वरी जी महाराज वृंदावन\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/content/purana-ras-mndal-vrindavan-shri-raseshvari-ji-maharaj-vrindavana\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-6xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L7\",null,{\"href\":\"/\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Home\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[[\"$\",\"$L7\",null,{\"href\":\"/content\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"Library\"}],[\"$\",\"span\",null,{\"children\":\"→\"}]],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"पुराना रास मंडल, वृंदावन / श्री रासेश्वरी जी महाराज वृंदावन\"}]]}],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-63\",\"title\":\"पुराना रास मंडल, वृंदावन / श्री रासेश्वरी जी महाराज वृंदावन\",\"category\":\"Shloka\",\"sanskrit_text\":\"रास मंडल में श्री हरिराम व्यास ने किशोरीजी को पायल पहनाई:\",\"hindi_text\":\"$a\",\"english_text\":null,\"english_translation\":\"$b\",\"description\":\"https://www.brajrasik.org/hi/articles/5b4987549f7ab760360f9cd6/old-raas-mandal-vrindavan-shri-raseshwari-ji-maharaj-vrindavan\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"$c\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b4987549f7ab760360f9cd6/old-raas-mandal-vrindavan-shri-raseshwari-ji-maharaj-vrindavan\",\"slug\":\"purana-ras-mndal-vrindavan-shri-raseshvari-ji-maharaj-vrindavana\"},\"initialRelatedSaint\":null,\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"childre

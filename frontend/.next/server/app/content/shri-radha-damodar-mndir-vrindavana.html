le.\\nGiriraj Charan Shila History:\\nSripad Sanatan Goswami used to live in Vrindavan near Sri Radha Madanmohan temple. Everyday he would go to Goverdhan hill from Vrindavan for Parikrama. When he got old even then this routinge was carried and continue with Parikrama seeing this Lord himself appeared before him and told him that he is happy with his devotion and asked goswamipad to stay at Vrindavan and serve Radha Krishna. Srila Sanatan Goswami said that without coming to the Govardhan Hill he feels pain and grief. Then Krishna gave him a Govardhan Sila with His Foot Print, Flute, Stick \u0026 cows foot print on that and told goswamipad that by doing four Parikaramas of this Govardhan Sila with four signs you will get the complete benefit of Govardhan Parikrama. This Sila has been served in this temple since then, many devotees come to this temple to do Parikrama everyday.\\nTimings of Temple:\\n4:45 AM -- Mangla Aarti\\n8:30 AM -- Shringar Aarti\\n12:30 PM - Rajbhog Aarti\\n6:00 PM -- Sandhya Aarti\\n9:00 PM -- Shayan Aarti\\nLocation:\\nRadha Damodar Temple is located in Vrindavan at Nikunj Lane, very near to Sewa Kunj.\",\"author\":{\"@type\":\"Person\",\"name\":\"Braj Rasik Heritage\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"Vrindopnishad\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:T560,Jeeva Goswami's Samadhi is located at Radha Damodar Mandir. Srila Krsna Dasa Kaviraja Goswami Samadhi: Srila Krishna Dasa Kaviraja Goswami's samadhi is also located at Radha Damodar Mandir. Pushpa Samadhis of other Vaishnav saints are also located at the temple.\nGiriraj Charan Shila History:\nSripad Sanatan Goswami used to live in Vrindavan near Sri Radha Madanmohan temple. Everyday he would go to Goverdhan hill from Vrindavan for Parikrama. When he got old even then this routinge was carried and continue with Parikrama seeing this Lord himself appeared before him and told him that he is happy with his devotion and asked goswamipad to stay at Vrindavan and serve Radha Krishna. Srila Sanatan Goswami said that without coming to the Govardhan Hill he feels pain and grief. Then Krishna gave him a Govardhan Sila with His Foot Print, Flute, Stick \u0026 cows foot print on that and told goswamipad that by doing four Parikaramas of this Govardhan Sila with four signs you will get the complete benefit of Govardhan Parikrama. This Sila has been served in this temple since then, many devotees come to this temple to do Parikrama everyday.\nTimings of Temple:\n4:45 AM -- Mangla Aarti\n8:30 AM -- Shringar Aarti\n12:30 PM - Rajbhog Aarti\n6:00 PM -- Sandhya Aarti\n9:00 PM -- Shayan Aarti\nLocation:\nRadha Damodar Temple is located in Vrindavan at Nikunj Lane, very near to Sewa Kunj.b:T11fa,"])</script><script>self.__next_f.push([1,"श्री श्री राधा दामोदर मंदिर 1542 ईसवी में श्री जीव गोस्वामी द्वारा स्थापित एक प्राचीन मंदिर है। राधा दामोदर की सेवा श्री जीव गोस्वामी द्वारा की जाती थी।\nश्री राधा दामोदर को श्रील रूप गोस्वामी द्वारा प्रकट किया जिन्हे उन्होंने सेवा और पूजा के लिए अपने प्रिय शिष्य और भतीजे-जीव गोस्वामी को दिया। श्री रूप गोस्वामी, श्री जीव गोस्वामी की समाधि। श्री रूप गोस्वामी के भजन कुटिया और समाधि: श्री श्री राधा-कृष्ण की शीर्ष सेवक श्री रूप मंजरी हैं। उनका भजन-कुटिया और समाधि-मंदिर श्री श्री राधा दामोदर मंदिर के आंगन में स्थित हैं।\nजीव गोस्वामी समाधि: जीव गोस्वामी की समाधि राधा दामोदर मंदिर में स्थित है।\nश्रीला कृष्ण दास कविराज गोस्वामी समाधि: श्रीला कृष्ण दास कविराज गोस्वामी की समाधि राधा दामोदर मंदिर में भी स्थित है। अन्य वैष्णव संतों की पुष्प समाधि भी मंदिर में स्थित हैं।\nगिरिराज चरण शिला इतिहास: श्रीपाद सनातन गोस्वामी श्री राधा मदनमोहन मंदिर के पास वृंदावन में रहते थे। हर दिन वह परिक्रमा के लिए वृंदावन से गोवर्धन जाते थे। जब वह बूढ़े हो गए तब भी वहां मार्ग पर चलते थे और परिक्रमा किया करते थे और यह देखकर यह भगवान स्वयं उनके सामने प्रकट हुए और उसे बताया कि वह उनकी भक्ति से खुश हैं और वृंदावन में रहने और राधा कृष्ण की सेवा करने के लिए गोस्वामी पाद जी से कहा। श्रील सनातन गोस्वामी ने कहा कि गोवर्धन न आने आने पर उन्हें दर्द और दुःख महसूस होता है। तब श्री कृष्ण ने उन्हें अपने चरण चिन्ह, बांसुरी, छड़ी और गायों के चरण चिन्ह के साथ एक गोवर्धन शिला दी और गोस्वामी पाद को बताया कि इस गोवर्धन शीला के चार चिन्ह के साथ आपको गोवर्धन परिक्रमा का पूरा लाभ मिलेगा। तब से इस मंदिर में इस शिला को स्थापित किया गया है। कई भक्त मंदिर परिक्रमा करने के लिए इस मंदिर में आते हैं।\nमंदिर का समय:\nसवेरे 4:45 बजे - मंगला आरती\nसवेरे 8:30 बजे - श्रृंगार आरती\nदोपहर 12:30 बजे - राजभोग आरती\nशाम 6:00 बजे - संध्या आरती\nशाम  9:00 बजे - शयन आरती\nस्थान:\nराधा दामोदर मंदिर, सेवा कुंज के नज़दीक निकुंज वन में वृंदावन में स्थित है।"])</script><script>self.__next_f.push([1,"d:[\"slug\",\"shri-radha-damodar-mndir-vrindavana\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"content\",\"shri-radha-damodar-mndir-vrindavana\"],\"initialTree\":[\"\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"shri-radha-damodar-mndir-vrindavana\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"shri-radha-damodar-mndir-vrindavana\\\"}\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"shri-radha-damodar-mndir-vrindavana\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"Home\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"Library\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/content\\\"},{\\\"@  श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar

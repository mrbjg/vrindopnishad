री ध्रुवदास, बयालीस लीला, वृन्दावन शत लीला (102)\\nश्री वृन्दावन जिनका धाम है (अर्थात् श्री राधारानी का), उन्हीं की कृपा-बल से ही कोई यहाँ वास कर सकता है, अन्यथा नहीं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a51904f82274812fecf964a/jinko-vrindavipin-hai-kripa-tinhi-ki-hoi-vrindavan-mein-tabhi-tau-rahan-pai-hai-soi-102-shri-dhruvdas-vrindavan-shat-leela-102\",\"slug\":\"jinakau-vrindavipin-hai\"},\"initialRelatedSaint\":{\"name\":\"श्री ध्रुवदास, बयालीस लीला\",\"hinglishName\":\"shri dhruvadas, bayalis lila\",\"slug\":\"shri-dhruvadas-bayalis-lila\",\"biography\":\"\",\"metadata\":{\"lineageEn\":\"Radhavallabh Sampradaya\",\"lineageHi\":\"राधावल्लभ संप्रदाय\",\"timelineEn\":\"17th Century AD\",\"timelineHi\":\"17वीं शताब्दी\",\"associatedPlacesEn\":\"Vrindavan\",\"associatedPlacesHi\":\"वृंदावन\",\"discipleOfEn\":\"Shri Hit Harilal Ji (disciplic lineage of Shri Hit Harivansh)\",\"discipleOfHi\":\"श्री हित हरिलाल जी (श्री हित हरिवंश महाप्रभु की शिष्य परंपरा)\",\"influencedByEn\":\"Shri Hit Harivansh Mahaprabhu\",\"influencedByHi\":\"श्री हित हरिवंश महाप्रभु\",\"associatedSampradayaEn\":\"Radhavallabh Sampradaya\",\"associatedSampradayaHi\":\"राधावल्लभ संप्रदाय\",\"devotionalMoodEn\":\"Manjari Bhava, Sahachari Bhava\",\"devotionalMoodHi\":\"मंजरी भाव, सहचरी भाव\",\"teachingsEn\":\"Detailed categorization of the levels of devotion (Bhakti), descriptions of the beauty of Srimati Radharani, and instructions on how to meditate on the pastimes of the Nikunj.\",\"teachingsHi\":\"भक्ति के विभिन्न चरणों का वर्गीकरण, श्री राधारानी के नख-शिख सौंदर्य का वर्णन और निकुंज लीलाओं के ध्यान की क्रमिक विधि का प्रतिपादन।\",\"literaryStyleEn\":\"Author of the monumental Bayalees Leela (बयालीस लीला), written in structured, elegant Braj Bhasha poetry. His style is highly descriptive, analytical, and serving as a study guide for sadhakas.\",\"literaryStyleHi\":\"महान ग्रंथ 'बयालीस लीला' के रचयिता, जो सरल, सुबोध और शास्त्रीय ब्रजभाषा काव्य में रचित है। उनका लेखन विश्लेषणात्मक है जो साधकों को ध्यान की गहराइयों में ले जाता है।\",\"biographyEn\":\"Shri Dhruvdas was a stellar saint and one of the most prolific writers in the history of the Radhavallabh Sampradaya. Living in the 17th century, he took it upon himself to systematically record and explain the esoteric teachings of the earlier rasik acharyas. His life was spent in quiet meditation and literary composition in the groves of Vrindavan. His masterpiece, the \\\"Bayalees Leela\\\" (Forty-Two Lilas), is a collection of 42 separate tracts covering theological concepts, meditation guidelines, descriptions of Vrindavan forest, and intimate love pastimes of the Divine Couple. His works remain the most accessed manuals for studying the philosophy of Braj Ras.\",\"biographyHi\":\"श्री ध्रुवदास राधावल्लभ संप्रदाय के सर्वाधिक रचनाकार संतों में से एक हैं। उन्होंने पूर्ववर्ती आचार्यों के सिद्धांतों को साधकों के लिए सुलभ बनाने हेतु 'बयालीस लीला' ग्रंथ की रचना की। ध्रुवदास जी ने शांत स्वभाव से वृंदावन के कुंजों में रहकर केवल लेखन और स्मरण किया। उनके ग्रंथों में भक्ति के सैद्धांतिक पक्ष और निकुंज लीला के व्यावहारिक अनुभव का ऐसा संगम है जो अन्यत्र मिलना दुर्लभ है।\",\"relatedSaints\":[{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"},{\"nameEn\":\"Shri Premanand Ji Maharaj\",\"nameHi\":\"श्री प्रेमानंद जी महाराज\",\"slug\":\"premanand-ji-maharaj\"}],\"relatedGranthas\":[{\"nameEn\":\"Bayalees Leela\",\"nameHi\":\"बयालीस लीला\",\"slug\":\"bayalees-leela\"}],\"associatedGlossary\":[{\"termEn\":\"Manjari Bhava\",\"termHi\":\"मंजरी भाव\",\"slug\":\"manjari-bhava\"},{\"termEn\":\"Lila\",\"termHi\":\"लीला\",\"slug\":\"lila\"},{\"termEn\":\"Seva\",\"termHi\":\"सेवा\",\"slug\":\"seva\"}],\"faq\":[{\"qEn\":\"What is the Bayalees Leela?\",\"aEn\":\"The Bayalees Leela is a collection of 42 distinct poetic works composed by Dhruvdas Ji, covering everything from Vrindavan glory to details of aesthetic devotion.\",\"qHi\":\"बयालीस लीला क्या है?\",\"aHi\":\"'बयालीस लीला' श्री ध्रुवदास जी द्वारा रचित ४२ अलग-अलग लीला-काव्यों का संग्रह है, जिसमें वृंदावन धाम की महिमा से लेकर सखी भाव की साधना का सम्पूर्ण विवेचन है।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-4\",\"title\":\"जो वाको देखे है जाई, सोइ रूप वन्त है जाई\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\"जो वाको देखे है जाई, सोइ रूप वन्त है जाई\\\"\",\"hindi_text\":\"जो श्री राधारानी की और निहारता है एवं उनका रूप ध्यान करता है वह रूपवान हो जाता है।\",\"english_text\":null,\"english_translation\":\"\\\"Jo Vako Dekhe Hai Jaai,\\nSoi Roop Vant Hai Jai\\\"\\n- Shri Dhruv Das - Bayalees Leela\\nOne who glances and meditates on Radharani becomes attractive and good looking.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a36594e59e8c72a534d8623/jo-vako-dekhe-hai-jaai-soi-roop-vant-hai-jai-shri-dhruv-das-bayalees-leela\",\"author\":\"श्री ध्रुवदास, बयालीस लीला\",\"status\":\"published\",\"content_text\":\"\\\"जो वाको देखे है जाई, सोइ रूप वन्त है जाई\\\"\\n- श्री ध्रुवदास, बयालीस लीला\\nजो श्री राधारानी की और निहारता है एवं उनका रूप ध्यान करता है वह रूपवान हो जाता है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a36594e59e8c72a534d8623/jo-vako-dekhe-hai-jaai-soi-roop-vant-hai-jai-shri-dhruv-das-bayalees-leela\",\"slug\":\"jo-vako-dekhe-hai-jai-soi-rup-vant-hai-jai\"},{\"id\":\"local-102\",\"title\":\"अंग अंग सब लाल के\",\"category\":\"Shloka\",\"sanskrit_text\":\"अंग अंग सब लाल के, झुकत प्रिया की ओर।सहज प्रेम कौ ढार परयौ, बँधे नेह की डोर॥\",\"hindi_text\":\"श्री श्यामसुन्दर का अंग-अंग श्री प्रिया की ओर झुका रहता है, अर्थात् वे सम्पूर्ण रूप से श्री प्रिया में आसक्त रहते हैं। उनके मन में सहज प्रेम का ढाल लगा हुआ है, अर्थात् उनके मन की सम्पूर्ण वृत्तियाँ श्री प्रिया की ओर दौड़ती रहती हैं। इसका कारण यह है कि वे प्रेम की डोर से बँधे हुए हैं।\",\"english_text\":null,\"english_translation\":\"Every part of Śrī Kṛṣṇa’s body (his actions and thoughts as well) is fully inclined towards Śrī Rādhā i.e., he is completely surrendered to her. The reason for this is that he is tied with the thread of divine love.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4b14a559e8c72a534d864a/ang-ang-sab-laal-ke-jhukar-priya-ki-aur-sahaj-prem-ko-daar-paryo-bandhey-neh-ki-dor-shri-dhruv-das\",\"author\":\"श्री ध्रुवदास, बयालीस लीला\",\"status\":\"published\",\"content_text\":\"अंग अंग सब लाल के, झुकत प्रिया की ओर।\\nसहज प्रेम कौ ढार परयौ, बँधे नेह की डोर॥\\n- श्री ध्रुवदास, बयालीस लीला\\nश्री श्यामसुन्दर का अंग-अंग श्री प्रिया की ओर झुका रहता है, अर्थात् वे सम्पूर्ण रूप से श्री प्रिया में आसक्त रहते हैं। उनके मन में सहज प्रेम का ढाल लगा हुआ है, अर्थात् उनके मन की सम्पूर्ण वृत्तियाँ श्री प्रिया की ओर दौड़ती रहती हैं। इसका कारण यह है कि वे प्रेम की डोर से बँधे हुए हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4b14a559e8c72a534d864a/ang-ang-sab-laal-ke-jhukar-priya-ki-aur-sahaj-prem-ko-daar-paryo-bandhey-neh-ki-dor-shri-dhruv-das\",\"slug\":\"ang-ang-sab-lal-ke\"},{\"id\":\"local-269\",\"title\":\"नवल किशोरी कुँवरि की सहजहि ऐसी बानि\",\"category\":\"Shloka\",\"sanskrit_text\":\"नवल किशोरी कुँवरि की, सहजहि ऐसी बानि।ताको संग न छाँड़हीं, नैकु सरन गहे आनी॥\",\"hindi_text\":\"श्री राधा रानी की सहज स्वभाव ही इतनी करुणामयी है कि जो भी एक बार उनकी शरण में आ जाता है, वे उसका साथ कभी नहीं छोड़तीं — न एक क्षण के लिए, न किसी भी कारण से।\",\"english_text\":null,\"english_translation\":\"Śrī Rādhā is so tender-hearted that she never leaves the person who surrenders to her, even once.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4b3c5e59e8c72a534d8671/naval-kishori-kunwari-ki-sahajhi-aisi-bani-takon-sang-ba-chaadhin-neki-saran-gaye-aani-shri-dhruv-das\",\"author\":\"श्री ध्रुवदास, बयालीस लीला\",\"status\":\"published\",\"content_text\":\"नवल किशोरी कुँवरि की, सहजहि ऐसी बानि।\\nताको संग न छाँड़हीं, नैकु सरन गहे आनी॥\\n- श्री ध्रुवदास, बयालीस लीला\\nश्री राधा रानी की सहज स्वभाव ही इतनी करुणामयी है कि जो भी एक बार उनकी शरण में आ जाता है, वे उसका साथ कभी नहीं छोड़तीं — न एक क्षण के लिए, न किसी भी कारण से।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4b3c5e59e8c72a534d8671/naval-kishori-kunwari-ki-sahajhi-aisi-bani-takon-sang-ba-chaadhin-neki-saran-gaye-aani-shri-dhruv-das\",\"slug\":\"naval-kishori-kunvari-ki-sahajahi-aisi-bani\"},{\"id\":\"local-366\",\"title\":\"या रस को साधन नहीं कोई, कुंवरि कृपा ते जो कछु होइ\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\"या रस को साधन नहीं कोई, कुंवरि कृपा ते जो कछु होइ\\\"\",\"hindi_text\":\"नित्य विहार रुपी दुर्लभ रस को प्राप्त करने का कोई और साधन नहीं, एक मात्र कुंवरी श्री राधा की कृपा से ही सुलभ है ।\",\"english_text\":null,\"english_translation\":\"There are no means of obtaining the topmost, the rarest of the rare bliss of Vrindavan called ‘Nitya Vihar’ other than the mercy of the one who is ever young i.e Shri Radha.\",\"description\":\"https://www.brajrasik.org/hi/articles/5bfaa00874377100587eb55c/ya-ras-ko-sadhan-nahin-koi-kunwari-kripa-te-jo-kachu-hoi-shri-dhruvdas-bayalees-leela\",\"author\":\"श्री ध्रुवदास, बयालीस लीला\",\"status\":\"published\",\"content_text\":\"\\\"या रस को साधन नहीं कोई, कुंवरि कृपा ते जो कछु होइ\\\"\\n- श्री ध्रुवदास, बयालीस लीला\\nनित्य विहार रुपी दुर्लभ रस को प्राप्त करने का कोई और साधन नहीं, एक मात्र कुंवरी श्री राधा की कृपा से ही सुलभ है ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5bfaa00874377100587eb55c/ya-ras-ko-sadhan-nahin-koi-kunwari-kripa-te-jo-kachu-hoi-shri-dhruvdas-bayalees-leela\",\"slug\":\"ya-ras-ko-sadhan-nahin-koi-kunvari-kripa-te-jo-kachhu-hoi\"},{\"id\":\"local-520\",\"title\":\"युगल प्रेम रस मगन जे, तेइ आपने मानि\",\"category\":\"Shloka\",\"sanskrit_text\":\"युगल प्रेम रस मगन जे, तेइ आपने मानि,सब विधि अंतर खोलि के तिन ही सो हित मानि ।यह रस परसै नाहिं जिन तू परसै ताहि,तासों नातो नाहिं कछु यह रस रुचै न जाहि ॥\",\"hindi_text\":\"श्री ध्रुवदास भक्त को कुछ सलाह देते हैं, वह कहते हैं कि ब्रज रस मार्ग जो कि भक्ति का मार्ग है बहुत ही सूक्ष्म, गहरा और विशेष है| आपको इस बारे में किसी से बात नहीं करनी चाहिए, जब तक कि वह वास्तव में इसमें रूचि नहीं रखता और इसके अतिरिक्त आपका वास्तविक परिवार वही है, जो इस दिव्य भक्ति रस मार्ग में चलते हैं एवं ब्रज रस मार्ग के रसिक जनों की आज्ञा का पालन करते हैं।\",\"english_text\":null,\"english_translation\":\"Shri Dhruvdas, Braj Rasik of Vrindavan, gives some advice to a devotee, He says the Braj Ras Marg which is the path of devotion is very subtle, deep and very special. You should not talk about this to anyone unless he is really interested in it, more over your real family and friends are only those who follow this path of divine love consciousness.\",\"description\":\"https://www.brajrasik.org/hi/articles/593ae0a88c96df553692f9d1/yugal-prem-ras-magan-te-pad-written-by-shri-dhruvdas\",\"author\":\"श्री ध्रुवदास, बयालीस लीला\",\"status\":\"published\",\"content_text\":\"युगल प्रेम रस मगन जे, तेइ आपने मानि,\\nसब विधि अंतर खोलि के तिन ही सो हित मानि ।\\nयह रस परसै नाहिं जिन तू परसै ताहि,\\nतासों नातो नाहिं कछु यह रस रुचै न जाहि ॥\\n- श्री ध्रुवदास, बयालीस लीला\\nश्री ध्रुवदास भक्त को कुछ सलाह देते हैं, वह कहते हैं कि ब्रज रस मार्ग जो कि भक्ति का मार्ग है बहुत ही सूक्ष्म, गहरा और विशेष है| आपको इस बारे में किसी से बात नहीं करनी चाहिए, जब तक कि वह वास्तव में इसमें रूचि नहीं रखता और इसके अतिरिक्त आपका वास्तविक परिवार वही है, जो इस दिव्य भक्ति रस मार्ग में चलते हैं एवं ब्रज रस मार्ग के रसिक जनों की आज्ञा का पालन करते हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/593ae0a88c96df553692f9d1/yugal-prem-ras-magan-te-pad-written-by-shri-dhruvdas\",\"slug\":\"yugal-prem-ras-magan-je-tei-apane-mani\"},{\"id\":\"local-584\",\"title\":\"जिनके है यह प्रेम रस\",\"category\":\"Shloka\",\"sanskrit_text\":\"जिनके है यह प्रेम रस, सोई जानत रीत।जो हारै तो पाईए, नेह खेत में जीत॥\",\"hindi_text\":\"जिनको (श्री राधा-कृष्ण को) इस प्रेम-रस का अनुभव है, वे ही इसकी रीति जानते हैं। उनको मालूम है कि प्रेम के क्षेत्र में वही जीतता है जो सम्पूर्ण रूप से अपनी पराजय स्वीकार कर लेता है।\",\"english_text\":null,\"english_translation\":\"Those (Śrī Rādhā Kṛṣṇa) who have divine love only know its custom. They know that in the world of love, the one who completely accepts his own defeat only wins.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4b222c59e8c72a534d865f/jinke-hai-yeh-prem-ras-soi-janat-reet-jo-hare-to-payie-neh-khet-mein-jeet-shri-dhruv-das\",\"author\":\"श्री ध्रुवदास, बयालीस लीला\",\"status\":\"published\",\"content_text\":\"जिनके है यह प्रेम रस, सोई जानत रीत।\\nजो हारै तो पाईए, नेह खेत में जीत॥\\n- श्री ध्रुवदास, बयालीस लीला\\nजिनको (श्री राधा-कृष्ण को) इस प्रेम-रस का अनुभव है, वे ही इसकी रीति जानते हैं। उनको मालूम है कि प्रेम के क्षेत्र में वही जीतता है जो सम्पूर्ण रूप से अपनी पराजय स्वीकार कर लेता है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4b222c59e8c72a534d865f/jinke-hai-yeh-prem-ras-soi-janat-reet-jo-hare-to-payie-neh-khet-mein-jeet-shri-dhruv-das\",\"slug\":\"jinake-hai-yah-prem-rasa\"},{\"id\":\"local-634\",\"title\":\"अवगुण करे समुद्र सम गिनत न अपनों जान\",\"category\":\"Shloka\",\"sanskrit_text\":\"अवगुण करे समुद्र सम, गिनत न अपनों जान।राई सम भजन को, मानत मेरु समान॥\",\"hindi_text\":\"समुद्र के समान अवगुण होते हुए भी किशोरीजी उन अवगुणों को देखती नहीं और राई के समान भजन करते हुए भी, अर्थात् बहुत ही थोड़ा, उस भजन को भी किशोरी जी सुमेरु पर्वत के समान मानती हैं।\",\"english_text\":null,\"english_translation\":\"Even though I possess an ocean of bad qualities, Rādhārānī doesn't even look at it considering me to be her very own and even if I do devotion to the size of a mustard seed, she looks upon it equal to the huge mountain of Meru!\",\"description\":\"https://www.brajrasik.org/hi/articles/5a35255559e8c72a534d8605/avgun-kare-samudra-sam-ginat-na-apno-jaan-rai-sam-bhajan-ko-manat-meru-saman-shri-dhruvdas-bayalees-leela\",\"author\":\"श्री ध्रुवदास, बयालीस लीला\",\"status\":\"published\",\"content_text\":\"अवगुण करे समुद्र सम, गिनत न अपनों जान।\\nराई सम भजन को, मानत मेरु समान॥\\n- श्री ध्रुवदास, बयालीस लीला\\nसमुद्र के समान अवगुण होते हुए भी किशोरीजी उन अवगुणों को देखती नहीं और राई के समान भजन करते हुए भी, अर्थात् बहुत ही थोड़ा, उस भजन को भी किशोरी जी सुमेरु पर्वत के समान मानती हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a35255559e8c72a534d8605/avgun-kare-samudra-sam-ginat-na-apno-jaan-rai-sam-bhajan-ko-manat-meru-saman-shri-dhruvdas-bayalees-leela\",\"slug\":\"avagun-kare-samudr-sam-ginat-n-apanon-jana\"}],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"content\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"

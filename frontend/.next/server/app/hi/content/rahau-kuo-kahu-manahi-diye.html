tic/chunks/4785-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"Cli"])</script><script>self.__next_f.push([1,"entProviders\"]\n14:I[1060,[],\"\"]\n6:Tea5,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"रहौ कोऊ काहू मनहि दिये\",\"description\":\"https://www.brajrasik.org/hi/articles/5c04f1d6a369d0005797073c/raho-kou-kahu-manhi-diye-mere-prannath-shri-shyama-sapath-karon-trin-chiye-shri-hita-harivansh-mahaprabhu-hita-safut-vani-20\",\"articleBody\":\"रहौ कोऊ काहू मनहि दिये।मेरे प्राणनाथ श्री श्यामा सपथ करौं तृण छिये ।।जे अवतार कदंब भजत हैं धरि दृढ़ ब्रत जु हिये।तेऊ उमगि तजत मर्जादा वन बिहार रस पिये।।खोये रतन फिरत जे घर-घर कौन काज जिए ।(जैश्री) हित हरिवंश अनत सचु नाहीं बिनु या रजहिं लिये।।\\nप्रस्तुत पद में श्री हित हरिवंश महाप्रभु ने श्री राधारानी के प्रति निष्ठा को शपथ खा कर व्यक्त किया है एवं श्री वृन्दावन धाम की उनकी एकमात्र निष्ठा को भी व्यक्त किया है।\\nकोई किसी में भी मन लगाए रहे मैं तो तृण स्पर्श करके शपथ पूर्वक कहता हूँ कि मेरे प्राणनाथ केवल एक श्रीश्यामा ही है।\\nजो लोग दृढ़ व्रत धारण करके अवतारों के समूह को भजते हैं वे भी वृन्दावन के प्रेम विहार रस का पान करते ही उमँग कर अपनी मर्यादा को त्याग देते हैं।\\nजो रत्न को खोकर घर-घर भीख माँगते फिरते हैं उनके जीने से लाभ ही क्या है ? श्री हित हरिवंश महाप्रभु कहते हैं कि वृन्दावन की रज प्राप्ति किये बिना अन्यत्र हर जगह अशांति ही मिलेगी।\\nIn the present post, Shri Hita Harivansh Mahaprabhu has expressed his exclusive loyalty and devotion to Sri Radharani and expressed the supremacy of the Vrindavan Dham and its dust over all the other abodes.\\nHe says, Let anyone do the devotion of anyone (any incarnation or group of incarnations), But I am taking an oath that the Lord and soul of my life is one and only Shri Shyama (Shri Radha).\\nThose who worship firmly and dedicated to the group of different incarnations of Lord Krishn, give up their devotion and decorums, by merely drinking a drop of the nectar of Vrindavan's Van Vihar (Eternal Evergoing love-play of Shri Yugal Sarkar with Sakhis in Vrindavan Dham).\\nWhat is the purpose of living like a beggar and begging for happiness from door to door?\\nShri Hita Harivansh Mahaprabhu says, \\\"There is no bliss anywhere without attaining this dust of Vrindavan\\\".\",\"author\":{\"@type\":\"Person\",\"name\":\"श्री हित हरिवंश महाप्रभु, श्री हित स्फुट वाणी (20)\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"b:[\"Braj Rasik\",\"Mass Import\"]\nc:[]\nd:[]\ne:[]\n"])</script><script>self.__next_f.push([1,"a:{\"id\":\"local-220\",\"title\":\"रहौ कोऊ काहू मनहि दिये\",\"category\":\"Shloka\",\"sanskrit_text\":\"रहौ कोऊ काहू मनहि दिये।मेरे प्राणनाथ श्री श्यामा सपथ करौं तृण छिये ।।जे अवतार कदंब भजत हैं धरि दृढ़ ब्रत जु हिये।तेऊ उमगि तजत मर्जादा वन बिहार रस पिये।।खोये रतन फिरत जे घर-घर कौन काज जिए ।(जैश्री) हित हरिवंश अनत सचु नाहीं बिनु या रजहिं लिये।।\",\"hindi_text\":\"प्रस्तुत पद में श्री हित हरिवंश महाप्रभु ने श्री राधारानी के प्रति निष्ठा को शपथ खा कर व्यक्त किया है एवं श्री वृन्दावन धाम की उनकी एकमात्र निष्ठा को भी व्यक्त किया है।\\nकोई किसी में भी मन लगाए रहे मैं तो तृण स्पर्श करके शपथ पूर्वक कहता हूँ कि मेरे प्राणनाथ केवल एक श्रीश्यामा ही है।\\nजो लोग दृढ़ व्रत धारण करके अवतारों के समूह को भजते हैं वे भी वृन्दावन के प्रेम विहार रस का पान करते ही उमँग कर अपनी मर्यादा को त्याग देते हैं।\\nजो रत्न को खोकर घर-घर भीख माँगते फिरते हैं उनके जीने से लाभ ही क्या है ? श्री हित हरिवंश महाप्रभु कहते हैं कि वृन्दावन की रज प्राप्ति किये बिना अन्यत्र हर जगह अशांति ही मिलेगी।\",\"english_text\":null,\"english_translation\":\"In the present post, Shri Hita Harivansh Mahaprabhu has expressed his exclusive loyalty and devotion to Sri Radharani and expressed the supremacy of the Vrindavan Dham and its dust over all the other abodes.\\nHe says, Let anyone do the devotion of anyone (any incarnation or group of incarnations), But I am taking an oath that the Lord and soul of my life is one and only Shri Shyama (Shri Radha).\\nThose who worship firmly and dedicated to the group of different incarnations of Lord Krishn, give up their devotion and decorums, by merely drinking a drop of the nectar of Vrindavan's Van Vihar (Eternal Evergoing love-play of Shri Yugal Sarkar with Sakhis in Vrindavan Dham).\\nWhat is the purpose of living like a beggar and begging for happiness from door to door?\\nShri Hita Harivansh Mahaprabhu says, \\\"There is no bliss anywhere without attaining this dust of Vrindavan\\\".\",\"description\":\"https://www.brajrasik.org/hi/articles/5c04f1d6a369d0005797073c/raho-kou-kahu-manhi-diye-mere-prannath-shri-shyama-sapath-karon-trin-chiye-shri-hita-harivansh-mahaprabhu-hita-safut-vani-20\",\"author\":\"श्री हित हरिवंश महाप्रभु, श्री हित स्फुट वाणी (20)\",\"status\":\"published\",\"content_text\":\"रहौ कोऊ काहू मनहि दिये।\\nमेरे प्राणनाथ श्री श्यामा सपथ करौं तृण छिये ।।\\nजे अवतार कदंब भजत हैं धरि दृढ़ ब्रत जु हिये।\\nतेऊ उमगि तजत मर्जादा वन बिहार रस पिये।।\\nखोये रतन फिरत जे घर-घर कौन काज जिए ।\\n(जैश्री) हित हरिवंश अनत सचु नाहीं बिनु या रजहिं लिये।।\\n- श्री हित हरिवंश महाप्रभु, श्री हित स्फुट वाणी (20)\\nप्रस्तुत पद में श्री हित हरिवंश महाप्रभु ने श्री राधारानी के प्रति निष्ठा को शपथ खा कर व्यक्त किया है एवं श्री वृन्दावन धाम की उनकी एकमात्र निष्ठा को भी व्यक्त किया है।\\nकोई किसी में भी मन लगाए रहे मैं तो तृण स्पर्श करके शपथ पूर्वक कहता हूँ कि मेरे प्राणनाथ केवल एक श्रीश्यामा ही है।\\nजो लोग दृढ़ व्रत धारण करके अवतारों के समूह को भजते हैं वे भी वृन्दावन के प्रेम विहार रस का पान करते ही उमँग कर अपनी मर्यादा को त्याग देते हैं।\\nजो रत्न को खोकर घर-घर भीख माँगते फिरते हैं उनके जीने से लाभ ही क्या है ? श्री हित हरिवंश महाप्रभु कहते हैं कि वृन्दावन की रज प्राप्ति किये बिना अन्यत्र हर जगह अशांति ही मिलेगी।\",\"tags\":\"$b\",\"image_urls\":\"$c\",\"video_urls\":\"$d\",\"media_links\":\"$  up their devotion and decorums, by merely drinking a drop of the nectar of Vrindavan's Van Vihar (Eternal Evergoing love-play of Shri Yugal Sarkar with Sakhis in Vrindavan Dham).\\nWhat is the purpose of living like a beggar and begging for happiness from door to door?\\nShri Hita Harivansh Mahaprabhu says, \\\"There is no bliss anywhere without attaining this dust of Vrindavan\\\".\",\"description\":\"https://www.brajrasik.org/hi/articles/5c04f1d6a369d0005797073c/raho-kou-kahu-manhi-diye-mere-prannath-shri-shyama-sapath-karon-trin-chiye-shri-hita-harivansh-mahaprabhu-hita-safut-vani-20\",\"author\":\"श्री हित हरिवंश महाप्रभु, श्री हित स्फुट वाणी (20)\",\"status\":\"published\",\"content_text\":\"रहौ कोऊ काहू मनहि दिये।\\nमेरे प्राणनाथ श्री श्यामा सपथ करौं तृण छिये ।।\\nजे अवतार कदंब भजत हैं धरि दृढ़ ब्रत जु हिये।\\nतेऊ उमगि तजत मर्जादा वन बिहार रस पिये।।\\nखोये रतन फिरत जे घर-घर कौन काज जिए ।\\n(जैश्री) हित हरिवंश अनत सचु नाहीं बिनु या रजहिं लिये।।\\n- श्री हित हरिवंश महाप्रभु, श्री हित स्फुट वाणी (20)\\nप्रस्तुत पद में श्री हित हरिवंश महाप्रभु ने श्री राधारानी के प्रति निष्ठा को शपथ खा कर व्यक्त किया है एवं श्री वृन्दावन धाम की उनकी एकमात्र निष्ठा को भी व्यक्त किया है।\\nकोई किसी में भी मन लगाए रहे मैं तो तृण स्पर्श करके शपथ पूर्वक कहता हूँ कि मेरे प्राणनाथ केवल एक श्रीश्यामा ही है।\\nजो लोग दृढ़ व्रत धारण करके अवतारों के समूह को भजते हैं वे भी वृन्दावन के प्रेम विहार रस का पान करते ही उमँग कर अपनी मर्यादा को त्याग देते हैं।\\nजो रत्न को खोकर घर-घर भीख माँगते फिरते हैं उनके जीने से लाभ ही क्या है ? श्री हित हरिवंश महाप्रभु कहते हैं कि वृन्दावन की रज प्राप्ति किये बिना अन्यत्र हर जगह अशांति ही मिलेगी।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5c04f1d6a369d0005797073c/raho-kou-kahu-manhi-diye-mere-prannath-shri-shyama-sapath-karon-trin-chiye-shri-hita-harivansh-mahaprabhu-hita-safut-vani-20\",\"slug\":\"rahau-kuo-kahu-manahi-diye\"},\"initialRelatedSaint\":{\"name\":\"श्री हित हरिवंश , श्री हित स्फुट वाणी (20)\",\"hinglishName\":\"shri hit harivnsh , shri hit sfut vani (20)\",\"slug\":\"shri-hit-harivnsh-mahaprabhu\",\"biography\":\"श्री हित हरिवंश महाप्रभु, श्री वृंदावन धाम के रसिक शिरोमणि संत और श्री कृष्ण की वंशी के अवतार हैं। वे श्री राधारानी को ही अपना गुरु और इष्ट मानते हैं और राधावल्लभ संप्रदाय के मुख्य आचार्य हैं। इनकी उपासना में मुख्य रूप से सहचरी भाव है, जिसमें श्री राधा चरण प्रधानता है।\",\"metadata\":null,\"imageUrl\":null,\"verses\":[\"$a\"],\"books\":[],\"rawItem\":{\"id\":\"saint-local-1\",\"title\":\"श्री हित हरिवंश महाप्रभु\",\"hindi_text\":\"श्री हित हरिवंश महाप्रभु, श्री वृंदावन धाम के रसिक शिरोमणि संत और श्री कृष्ण की वंशी के अवतार हैं। वे श्री राधारानी को ही अपना गुरु और इष्ट मानते हैं और राधावल्लभ संप्रदाय के मुख्य आचार्य हैं। इनकी उपासना में मुख्य रूप से सहचरी भाव है, जिसमें श्री राधा चरण प्रधानता है।\",\"english_translation\":\"\",\"description\":\"https://www.brajrasik.org/hi/tag/hitharivansh\",\"tags\":[\"Braj Rasik\",\"Saint\",\"Biography\"],\"author\":\"BrajRasik.org\",\"category\":\"saint\",\"slug\":\"shri-hit-harivnsh-mahaprabhu\"}},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$Lf\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$10\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L11\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Lf\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\"],\

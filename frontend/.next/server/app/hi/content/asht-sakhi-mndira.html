tatic/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"Cli"])</script><script>self.__next_f.push([1,"entProviders\"]\n14:I[1060,[],\"\"]\n6:Tc29,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"अष्ट सखी मंदिर\",\"description\":\"https://www.brajrasik.org/hi/articles/5a86871382274812fecf969a/shri-ashta-sakhi-temple-vrindavan\",\"articleBody\":\"\\nवृंदावन में श्री बिहारी जी मंदिर के बहुत ही पास, अष्ट सखी मंदिर या श्री राधा रास बिहारी नाम का मन्दिर है। यह मंदिर सदियों पुराना है एवं  यह मंदिर दिव्य युगल और उनकी अष्ट सखी को समर्पित है। यह मंदिर श्री राधा रानी रास बिहारी अष्ट सखी मंदिर के नाम से जाना जाता है। यह मंदिर भगवान श्री कृष्ण और श्री राधारानी के दिव्य रास लीला का घर है। यह बाँके बिहारी मंदिर के बहुत पास में स्थित है। मंदिर का हाल ही में पुन निर्माण और आधुनिकरण किया गया है। अष्ट सखियों में से ललिता और विशाखा को मुख्य सखी माना जाता है। सभी साखियों का एक ही उदेश्य है कि वे श्री राधा श्री कृष्ण की सेवा करें और अष्ट सखियाँ इस प्रकार हैं : ललिता, विशाखा, चंपकलता, चित्रा, तुंगविद्या , इंदरलेखा, रंगदेवी, सुदेवी।\\nIn Vrindavan very near to Shri Bihariji temple, is the temple called Ashta Sakhi temple or Shri Radha Ras Bihari temple. The temple is centuries old and is dedicated to the divine couple and their Ashta Sakhi’s - the eight “friends” of Shri Radha who were intimately involved in her intimate pastimes. The temple is called – Shree Radha Ras Behari Ashta Sakhi Mandir and it is home to the divine Ras Leela of Lord Krishna and Radharani. It is located in close proximity to the Banke Behari mandir. The temple has been recently restored and modernized with exemplary attention to detail. Of the eight sakhis, two – i.e Lalita and Vishaka are considered to be the leaders. All the sakhis have a single mission – to serve Radha Krishn and they are her foremost friends and companions. The eight sakhis are: Lalita, Vishakha, Champaklata, Chitra, Tungvidya, Indulekha, Rangdevi, Sudevi.\",\"author\":{\"@type\":\"Person\",\"name\":\"ब्रज रसिक धरोहर\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:T1975,"])</script><script>self.__next_f.push([1,"बहुत समय पहले की बात है श्री वृंदावन में एक बाबा का निवास था , जो युगल स्वरुप की उपासना किया करते थे। एक बार वे बाबा संध्या वंदन के उपरांत कुञ्जवन की राहपर जा रहे थे। मार्ग में बाबा जब एक वटवृक्ष के नीचे होकर निकले तो उनकी जटा उस वटवृक्ष की जटाओं में उलझ गयी। बहुत प्रयास किया सुलझाने का परन्तु जटा नहीं सुलझी। महात्मा भी महात्मा ही होते हैं। वे आसन जमा कर बैठ गये कि जिसने जटा उलझाई है वो सुलझाने आएगा तो ठीक है नहीं तो मैं ऐसे ही बैठा रहूँगा और प्राण त्याग दूंगा। बाबा को बैठे हुए तीन दिन बीत गये।\nएक सांवला सलोना ग्वाला आया जो पांच-सात वर्ष का था। वो बालक ब्रजभाषा में बड़े दुलार से बोला - \" बाबा ! तुम्हारी तो जटा उलझ गयी, अरे मैं सुलझा दऊँ का ?\" और जैसे ही वो बालक जटा सुलझाने आगे बढ़ा -बाबा ने कहा - \" हाथ मत लगाना , पीछे हटो...कौन हो तुम ?\" ग्वाला - 'अरे ! हमारो जे ही गाम है महाराज! गैया चरा रह्यो तो मैंने देखि बाबा की जटा उलझ गई है तो सोची मैं जाय के सुलझा दऊँ। बाबा -'ना ना ना दूर हट जा। जिसने जटा उलझाई है वही सुलझायगा। ग्वाला - \"अरे महाराज ! तो जाने उलझाई है वाको नाम बताय देयो वाहे बुला लाऊँगो ।\" बाबा - \"तू जा— नाम नहीं बताते हम। कुछ देर तक वो बालक बाबा को समझाता रहा परन्तु जब बाबा नहीं माने तो ग्वाले में से साक्षात्मुरली बजाते हुए भगवान् बांके बिहारी प्रकट हो गये। सांवरिया सरकार बोले - \" महात्मन ! मैंने जटा उलझाई है ? तो लो आ गया मैं।\" और जैसेही सांवरिया जटा सुलझाने आगे बढ़े -बाबा ने कहा - 'हाथ मत लगाना , पीछे हटो। पहले बताओ तुम कौन से कृष्ण हो ?'\nबाबा के वचन सुनकर श्री कृष्ण सोच में पड़ गए कि अरे कृष्ण भी क्या दस-पांच हैं ? श्री कृष्ण बोले -'कौन से कृष्ण हो मतलब ?' बाबा - 'देखो श्री कृष्ण कई हैं। एक देवकी नंदन श्री कृष्ण हैं, एक यशोदानंदन श्री कृष्ण, एक द्वारिकधीश श्री कृष्ण, एक नित्य निकुञ्ज बिहारी श्री कृष्ण।' श्री कृष्ण - 'आपको कौन से चाहिए ?' बाबा - 'मैं तो नित्य निकुञ्जबिहारी श्री कृष्ण का परमोपासक हूँ।' श्री कृष्ण - 'वही तो मैं हूँ। अब सुलझा दूँ क्या ?' जैसे ही श्री कृष्ण जटा सुलझाने के लिए आगे बढ़े तो बाबा बोले - \" हाथ मत लगाना , पीछे हटो। अरे ! नित्य निकुञ्जबिहारी तो किशोरी जू के बिना, मेरी स्वामिनी श्री राधा रानी के बिना एक पल भी नहीं रहते और आप तो अकेले ही खड़े हो।\" बाबा के इतना कहते ही आकाश में बिजली सी चमकी और साक्षात श्री वृषभानुनंदिनी, वृन्दावनेश्वरी, श्री राधिका रानी बाबा के समक्ष प्रकट हो गईं और बोलीं - \"अरे बाबा !\nमैं ही तो ये श्री कृष्ण हूँ और श्री कृष्ण ही तो राधा हैं । हम दोनों एक हैं \" अब तो युगल सरकार का दर्शन पाकर बाबा आनंद विभोर हो उठे। उनकी आँखों से अश्रुधारा बहने लगी। अब जैसे ही श्री राधा-कृष्ण जटा सुलझाने आगे बढ़े -बाबा चरणों में गिर पड़े और बोले - अब जटा क्या सुलझाते हो प्रभु , अब तो जीवन ही सुलझा दो। बाबा ने ऐसी प्रार्थना की और प्रणाम करते करते उनका शरीर शांत हो गया। स्वामिनी जी ने उनको नित्य लीला में स्थान प्रदान किया।"])</script><script>self.__next_f.push([1,"b:Tafd,"])</script><script>self.__next_f.push([1,"Once upon a time in Braj, at Kadambkhandi near Barsana, there lived one saint named Naga Ji, who used to meditate on Yugal Swaroop (Radha and Krishna together). One day, He was going to groves in the evening passing through the big trees, where his hair got stuck with falling branches of one of the trees. He tried a lot to detach his hair but he wasn't able to do so. So he sat under the tree saying “whoever has had my hair stuck to the branches, shall only resolve it, else he will be going lifeless. Three days were passed and baba was still sitting under the tree.\nOne 5-7-year-old beautiful boy came near baba. The boy said politely in Braj language - “Baba can I resolve your stuck hair from branches?” As soon as the boy went ahead to resolve it, Baba suddenly said - “Don't touch it, stay back. Who are you?” Boy - “Ohh baba I am from this village only, I was roaming here to feed cows and saw you in this condition so I thought to help you.” Baba - “No no, stay away. whoever has done this shall resolve it.”\nBoy - “Baba you can tell me the name of the person who had done this, I will call him”.\nBaba - you go from here. I won’t tell you any name. This way, the boy was continuously convincing him but baba didn't agree. When Boy saw that Baba was not willing to take help from him, Suddenly Lord Krishna (with his beautiful flute in his hand) originated from that boy. Lord Krishna then said - Dear Baba! I have done this so here I am.\nAnd as soon as Lord Krishna went ahead to resolve his hair,\nBaba suddenly said - “Don’t touch, Stay back. First, tell me Which Krishn are you?” After listening to Baba's words Shri Krishna thought “whether there are 5-10 Krishn?”\nThen Shri Krishn said - “What do you mean by which Krishn?”\nBaba said - “See, there are many Krishn. One is Devkinandan Krishn, one is Yashoda Nandan Shree Krishn, one is Dwarika Dheesh Krishn, one is Nitya Nikunj Bihari Shri Krishn”.\nShri Krishn said - “Which Shri Krishn do you want?”\nBaba- “I am a follower of Nitya Nikunj Bihari.”\nShree Krishn said - “Yes, I am the same. Can I do it now?”\nAs soon as Shri Krishna went ahead to resolve it, And baba said - “Don't touch it, stay away. Nitya Nikunj Shri Krishna cannot live without Radha Rani for even a single second and you are standing here alone.”\nAs soon as baba said that, there was a thunderstorm struck in the clouds, and then “Shri Vrishbhanu Nandini, Vrindavaneshwari, Shri Radha Rani came in front of baba and said - “Oh baba! See now, we both are here. We both are one.”\nWith the presence of both (yugal sarkar) baba was amazed to see them. He started crying in happiness and both of them together resolved baba’s hairs. Yugal Sarkar Ki Jai. Albeli Sarkar Ki Jai. All Glories to the Rasik Saints of Braj."])</script><script>self.__next_f.push([1,"c:T1975,"])</script><script>self.__next_f.push([1,"बहुत समय पहले की बात है श्री वृंदावन में एक बाबा का निवास था , जो युगल स्वरुप की उपासना कि ]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"asht-sakhi-mndira\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"मुख्यपृष्ठ\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"पुस्तकालय\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"अष्ट सखी मंदिर\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content/asht-sakhi-mndira\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-6xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L7\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[[\"$\",\"$L7\",null,{\"href\":\"/hi/content\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"पुस्तकालय\"}],[\"$\",\"span\",null,{\"children\":\"→\"}]],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"अष्ट सखी मंदिर\"}]]}],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-570\",\"title\":\"अष्ट सखी मंदिर\",\"category\":\"General\",\"sanskrit_text\":null,\"hindi_text\":\"वृंदावन में श्री बिहारी जी मंदिर के बहुत ही पास, अष्ट सखी मंदिर या श्री राधा रास बिहारी नाम का मन्दिर है। यह मंदिर सदियों पुराना है एवं  यह मंदिर दिव्य युगल और उनकी अष्ट सखी को समर्पित है। यह मंदिर श्री राधा रानी रास बिहारी अष्ट सखी मंदिर के नाम से जाना जाता है। यह मंदिर भगवान श्री कृष्ण और श्री राधारानी के दिव्य रास लीला का घर है। यह बाँके बिहारी मंदिर के बहुत पास में स्थित है। मंदिर का हाल ही में पुन निर्माण और आधुनिकरण किया गया है। अष्ट सखियों में से ललिता और विशाखा को मुख्य सखी माना जाता है। सभी साखियों का एक ही उदेश्य है कि वे श्री राधा श्री कृष्ण की सेवा करें और अष्ट सखियाँ इस प्रकार हैं : ललिता, विशाखा, चंपकलता, चित्रा, तुंगविद्या , इंदरलेखा, रंगदेवी, सुदेवी।\",\"english_text\":null,\"english_translation\":\"In Vrindavan very near to Shri Bihariji temple, is the temple called Ashta Sakhi temple or Shri Radha Ras Bihari temple. The temple is centuries old and is dedicated to the divine couple and their Ashta Sakhi’s - the eight “friends” of Shri Radha who were intimately involved in her intimate pastimes. The temple is called – Shree Radha Ras Behari Ashta Sakhi Mandir and it is home to the divine Ras Leela of Lord Krishna and Radharani. It is located in close proximity to the Banke Behari mandir. The temple has been recently restored and modernized with exemplary attention to detail. Of the eight sakhis, two – i.e Lalita and Vishaka are considered to be the leaders. All the sakhis have a single mission – to serve Radha Krishn and they are her foremost friends and companions. The eight sakhis are: Lalita, Vishakha, Champaklata, Chitra, Tungvidya, Indulekha, Rangdevi, Sudevi.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a86871382274812fecf969a/shri-ashta-sakhi-temple-vrindavan\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"वृंदावन में श्री बिहारी जी मंदिर के बहुत ही पास, अष्ट सखी मंदिर या श्री राधा रास बिहारी नाम का मन्दिर है। यह मंदिर सदियों पुराना है एवं  यह मंदिर दिव्य युगल और उनकी अष्ट सखी को समर्पित है। यह मंदिर श्री राधा रानी रास बिहारी अष्ट सखी मंदिर के नाम से जाना जाता है। यह मंदिर भगवान श्री कृष्ण और श्री राधारानी के दिव्य रास लीला का घर है। यह बाँके बिहारी मंदिर के बहुत पास में स्थित है। मंदिर का हाल ही में पुन निर्माण और आधुनिक

िधौं नाहीं ||हौं तोसों कहौं प्यारे, आँखिन मूंदी रहौं ।लाल निकसि कहूँ जाहिं ||\",\"hindi_text\":\"श्री कृष्ण राधा रानी को बताते हैं: \\\"हे राधा, जिस तरह से मैं आपकी आंखों में अपना रूप देखता हूं, क्या आप भी उसी तरह देखते हैं या नहीं?\\\" इसके बारे में सुनते हुए किशोरी जी ने जवाब दिया, \\\"हे प्रियम! मैं आपको सत्य बताता हूं, मैं केवल अपनी आंखें बंद करता हूं ताकि आपका मोहक रूप मेरी आंखों से बाहर नहीं निकल सके।\",\"english_text\":null,\"english_translation\":\"Shri Krishn tells Radha Rani : “O Radha, the way I see my form in your eyes, do you also see in the same way or not?” Listening to this, Kishori Ji replied, “O Priytam! I tell you the truth, I close my eyes only so that your enchanting form doesn’t slip out of my eyes.\",\"description\":\"https://www.brajrasik.org/hi/articles/58d5668811ec2c04484ebfbc/pyaaree-jaiso-tero-aankhin-mein-swami-haridas-kelimal\",\"author\":\"श्री केलीमल, स्वामी श्री हरिदास जी\",\"status\":\"published\",\"content_text\":\"प्यारी जैसो तेरो आँखिन में, मैं हौं अपनपौं देखत|\\nतैसो तुम देखती हो किधौं नाहीं ||\\nहौं तोसों कहौं प्यारे, आँखिन मूंदी रहौं ।\\nलाल निकसि कहूँ जाहिं ||\\n- श्री केलीमल, स्वामी श्री हरिदास जी\\nश्री कृष्ण राधा रानी को बताते हैं: \\\"हे राधा, जिस तरह से मैं आपकी आंखों में अपना रूप देखता हूं, क्या आप भी उसी तरह देखते हैं या नहीं?\\\" इसके बारे में सुनते हुए किशोरी जी ने जवाब दिया, \\\"हे प्रियम! मैं आपको सत्य बताता हूं, मैं केवल अपनी आंखें बंद करता हूं ताकि आपका मोहक रूप मेरी आंखों से बाहर नहीं निकल सके।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/58d5668811ec2c04484ebfbc/pyaaree-jaiso-tero-aankhin-mein-swami-haridas-kelimal\",\"slug\":\"pyari-jaiso-tero-ankhin-men-main-haun-apanapaun-dekhata-taiso-tum-dekhati-ho-kidhaun-nahin-haun-toson-kahaun-pyare-ankhin-mundi-rahaun-lal-nikasi-kahun-jahin\"},\"initialRelatedSaint\":{\"name\":\"स्वामी श्री हरिदास\",\"hinglishName\":\"svami shri haridasa\",\"slug\":\"svami-shri-haridasa\",\"biography\":\"स्वामी श्री हरिदास, वृंदावन के रसिक शिरोमणि संत थे, जो श्री ललिता सखी के अवतार थे, जो श्री राधारानी की मुख्य सखी हैं। स्वामी हरिदास जी ने 'केलिमाल' की रचना में 'अखंड नित्य विहार' रस निकुंज उपासना को प्रस्तुत किया है ।\",\"metadata\":{\"lineageEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"lineageHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"timelineEn\":\"1478–1573 AD (Vikram Samvat 1535 - 1630)\",\"timelineHi\":\"1478–1573 ईस्वी (विक्रम संवत 1535 - 1630)\",\"associatedPlacesEn\":\"Nidhivan, Vrindavan\",\"associatedPlacesHi\":\"निधिवन, वृंदावन\",\"discipleOfEn\":\"Shri Ashudhir Dev Ji (his father and guru)\",\"discipleOfHi\":\"श्री आशुधीर देव जी (पिता एवं गुरु)\",\"influencedByEn\":\"Nimbarka Sampradaya philosophy\",\"influencedByHi\":\"निम्बार्क संप्रदाय सिद्धांत\",\"associatedSampradayaEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"associatedSampradayaHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"devotionalMoodEn\":\"Nitya Vihar, Sakhi Bhava (Lalita Sakhi incarnate)\",\"devotionalMoodHi\":\"नित्य विहार, सखी भाव (ललिता सखी अवतार)\",\"teachingsEn\":\"Worship of the Divine Couple in the mood of Lalita Sakhi; focused purely on the eternal love-play (Nitya Vihar) in the secluded bowers (Nikunj) of Vrindavan, entirely devoid of majesty (aishwarya) or physical separation (viraha).\",\"teachingsHi\":\"ललिता सखी के भाव में युगल उपासना; वृंदावन के निकुंजों में होने वाले अखंड नित्य विहार रस पर पूर्ण ध्यान, जिसमें ऐश्वर्य भाव या वियोग का कोई स्थान नहीं है।\",\"literaryStyleEn\":\"Composed Kelimal (केलिमाल) and Siddhanta Pada (सिद्धान्त के पद) in sweet Braj Bhasha, characterized by deep musicality, classical raag notations, and intimate description of the Divine Couple's pastimes.\",\"literaryStyleHi\":\"मधुर ब्रजभाषा में 'केलिमाल' और 'सिद्धान्त के पद' की रचना की, जो राग-रागिनियों की शास्त्रीय विधा और निकुंज लीलाओं के सूक्ष्म चित्रण से परिपूर्ण हैं।\",\"biographyEn\":\"Swami Haridas was a spiritual master, classical music pioneer, and the founding acharya of the Haridasi Sampradaya. He is widely revered as the direct incarnation of Lalita Sakhi, the chief confidante of Srimati Radharani. Swami Haridas performed his intense bhajan in the sacred grove of Nidhivan in Vrindavan. His musical devotion was so deep and pure that the Divine Couple, Shri Radha and Krishna, appeared before him and manifested themselves in a single, combined deity form—Sri Bankey Bihari Ji. Swami Haridas taught that the ultimate spiritual destination is not cosmic liberation or majestic worship, but witnessing the confidential loving service of the Divine Couple in the eternal groves of Braj.\",\"biographyHi\":\"स्वामी हरिदास वृंदावन के रसिक शिरोमणि संत और भारतीय शास्त्रीय संगीत के महान आचार्य थे। उन्हें श्री राधा जी की प्रधान सखी श्री ललिता जी का साक्षात् अवतार माना जाता है। उन्होंने वृंदावन के निधिवन को अपनी साधना स्थली बनाया, जहाँ उनके संगीत अनुराग से खिंचकर युगल सरकार ने बांके बिहारी जी के रूप में प्रकट होकर दर्शन दिए। तानसेन और बैजू बावरा जैसे संगीत सम्राट इनके शिष्य थे। स्वामी जी ने सिद्ध किया कि भक्ति शुष्क तपस्या नहीं, बल्कि राग-रागिनियों के माध्यम से प्रभु चरणों में पूर्ण आत्मसमर्पण है।\",\"relatedSaints\":[{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"},{\"nameEn\":\"Shri Hariram Vyas\",\"nameHi\":\"श्री हरिराम व्यास\",\"slug\":\"hariram-vyas\"}],\"relatedGranthas\":[{\"nameEn\":\"Kelimal\",\"nameHi\":\"केलिमाल\",\"slug\":\"kelimal\"},{\"nameEn\":\"Siddhanta Pada\",\"nameHi\":\"सिद्धान्त के पद\",\"slug\":\"siddhanta-pada\"}],\"associatedGlossary\":[{\"termEn\":\"Nitya Vihar\",\"termHi\":\"नित्य विहार\",\"slug\":\"nitya-vihar\"},{\"termEn\":\"Nikunj\",\"termHi\":\"निकुंज\",\"slug\":\"nikunj\"},{\"termEn\":\"Sakhi Bhava\",\"termHi\":\"सखी भाव\",\"slug\":\"sakhi-bhava\"}],\"faq\":[{\"qEn\":\"Who was Swami Haridas?\",\"aEn\":\"Swami Haridas was a 16th-century rasik saint, musicologist, and founder of the Haridasi Sampradaya, renowned for manifesting the Bankey Bihari deity through his music in Nidhivan.\",\"qHi\":\"स्वामी हरिदास कौन थे?\",\"aHi\":\"स्वामी हरिदास 16वीं शताब्दी के एक महान रसिक संत, संगीतकार और हरिदासी संप्रदाय के प्रवर्तक थे, जिन्होंने अपने संगीत साधना से निधिवन में ठाकुर बांके बिहारी जी को प्रकट किया था।\"},{\"qEn\":\"Who were the famous disciples of Swami Haridas?\",\"aEn\":\"The legendary musicians Tansen (the royal singer of Akbar's court) and Baiju Bawra were disciples of Swami Haridas.\",\"qHi\":\"स्वामी हरिदास के प्रसिद्ध शिष्य कौन थे?\",\"aHi\":\"अकबर के दरबार के नवरत्नों में से एक संगीत सम्राट तानसेन और बैजू बावरा स्वामी हरिदास जी के प्रमुख शिष्य थे।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-135\",\"title\":\"माई री, सहज जोरी प्रगट\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\"माई री, सहज जोरी प्रगट भई, जु रंग की गौर-स्याम घन-दामिनि जैसैं। प्रथम हूँ हुती, अब हूँ आगें हूँ रहिहै, न टरिहै तैसैं”​\",\"hindi_text\":\"अरि सखी राधा कृष्ण की जोरि जो गौर एवं श्यामल रंग की है, ऐसी विचित्र जोरि के समान न तो कभी कोई जोरि थी, न है और न ही आगे होगी|\",\"english_text\":null,\"english_translation\":\"Oh dear! The pair of Radha Krishn which is of white and blue complexioned is unparalleled, has been unparalleled and will always remain unparalleled.\",\"description\":\"https://www.brajrasik.org/hi/articles/58fe454a11ec2c04484ebfd7/mai-ri-sahaj-jori-pragat-bhai-ju-rang-ki-gaur-syam-ghan-damini-jaisen-quote-by-swami-shri-haridas\",\"author\":\"स्वामी श्री हरिदास\",\"status\":\"published\",\"content_text\":\"\\\"माई री, सहज जोरी प्रगट भई, जु रंग की गौर-स्याम घन-दामिनि जैसैं। प्रथम हूँ हुती, अब हूँ आगें हूँ रहिहै, न टरिहै तैसैं”​\\n- स्वामी श्री हरिदास\\nअरि सखी राधा कृष्ण की जोरि जो गौर एवं श्यामल रंग की है, ऐसी विचित्र जोरि के समान न तो कभी कोई जोरि थी, न है और न ही आगे होगी|\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/58fe454a11ec2c04484ebfd7/mai-ri-sahaj-jori-pragat-bhai-ju-rang-ki-gaur-syam-ghan-damini-jaisen-quote-by-swami-shri-haridas\",\"slug\":\"mai-ri-sahaj-jori-pragata\"},{\"id\":\"local-150\",\"title\":\"श्री हरिदास के स्वामी स्यामा\",\"category\":\"Shloka\",\"sanskrit_text\":\"श्री हरिदास के स्वामी स्यामा-कुंजबिहारी की,सोभा बरनी न जाये, जो मिलें रसिक कोटि कवी ||\",\"hindi_text\":\"यदि अनंत कोटि रसिक संत भी बताना चाहें, तो भी राधा कृष्ण के आलौकिक सौंदर्य का वर्णन नहीं कर सकते।\",\"english_text\":null,\"english_translation\":\"There are no words to describe the beauty of Radha Krishn, which even millions of Rasik Saints cannot describe.\",\"description\":\"https://www.brajrasik.org/hi/articles/5aae61479f7ab760360f9c00/shri-haridaas-ke-swami-shyamakunjbihari-ki-sobha-barani-na-jaaye-jo-milen-rasik-koti-kavi-kelimal-swami-shri-haridas\",\"author\":\"स्वामी श्री हरिदास\",\"status\":\"published\",\"content_text\":\"श्री हरिदास के स्वामी स्यामा-कुंजबिहारी की,\\nसोभा बरनी न जाये, जो मिलें रसिक कोटि कवी ||\\n- स्वामी श्री हरिदास\\nयदि अनंत कोटि रसिक संत भी बताना चाहें, तो भी राधा कृष्ण के आलौकिक सौंदर्य का वर्णन नहीं कर सकते।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5aae61479f7ab760360f9c00/shri-haridaas-ke-swami-shyamakunjbihari-ki-sobha-barani-na-jaaye-jo-milen-rasik-koti-kavi-kelimal-swami-shri-haridas\",\"slug\":\"shri-haridas-ke-svami-syama\"},{\"id\":\"local-416\",\"title\":\"“रोम रोम रसना जो होती, तऊ तेरे गुन न बखाने जात || ”\",\"category\":\"Shloka\",\"sanskrit_text\":\"“रोम रोम रसना जो होती, तऊ तेरे गुन न बखाने जात || ”\",\"hindi_text\":\"श्री राधे, यदि मेरे रोम रोम जिह्वा होती तब भी आपके गुणों का बखान करने में असमर्थ है ।\",\"english_text\":null,\"english_translation\":\"- Swami Shri Haridas - Kelimal\\nO Radhe, Even if I possess millions of tongues inside every pore of my being, still I cannot describe your virtues completely.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4cd2c459e8c72a534d8699/rom-rom-rasna-jo-hoti-tau-tere-gun-na-bakhane-jaat-swami-shri-haridas-kelimal\",\"author\":\"स्वामी श्री हरिदास\",\"status\":\"published\",\"content_text\":\"“रोम रोम रसना जो होती, तऊ तेरे गुन न बखाने जात || ”\\n- स्वामी श्री हरिदास\\nश्री राधे, यदि मेरे रोम रोम जिह्वा होती तब भी आपके गुणों का बखान करने में असमर्थ है ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4cd2c459e8c72a534d8699/rom-rom-rasna-jo-hoti-tau-tere-gun-na-bakhane-jaat-swami-shri-haridas-kelimal\",\"slug\":\"rom-rom-rasana-jo-hoti-tau-tere-gun-n-bakhane-jat\"},{\"id\":\"local-514\",\"title\":\"हरि के नाम को आलस क्यों करत हैं रे\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\" हरि के नाम को आलस क्यों करत हैं रे, काल फिरत सर साँधे | ”\",\"hindi_text\":\"मृत्यु रूपी काल धनुष पर बाण चढ़ाए हुए एक दम तैयार खड़ी है, इसलिए हरि कि भक्ति में लापरवाही मत करो।\",\"english_text\":null,\"english_translation\":\"Do not procrastinate the devotion of God because the Yamraj (God of death) is ready with his bow and arrow.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4c247a59e8c72a534d867e/hari-ke-naam-ko-aalas-kyun-karat-hari-re-kaal-firat-sar-sandhey-swami-shri-haridas\",\"author\":\"स्वामी श्री हरिदास\",\"status\":\"published\",\"content_text\":\"\\\" हरि के नाम को आलस क्यों करत हैं रे, काल फिरत सर साँधे | ”\\n- स्वामी श्री हरिदास\\nमृत्यु रूपी काल धनुष पर बाण चढ़ाए हुए एक दम तैयार खड़ी है, इसलिए हरि कि भक्ति में लापरवाही मत करो।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4c247a59e8c72a534d867e/hari-ke-naam-ko-aalas-kyun-karat-hari-re-kaal-firat-sar-sandhey-swami-shri-haridas\",\"slug\":\"hari-ke-nam-ko-alas-kyon-karat-hain-re\"}],\"books\":[],\"rawItem\":{\"id\":\"saint-local-0\",\"title\":\"स्वामी श्री हरिदास\",\"hindi_text\":\"स्वामी श्री हरिदास, वृंदावन के रसिक शिरोमणि संत थे, जो श्री ललिता सखी के अवतार थे, जो श्री राधारानी की मुख्य सखी हैं। स्वामी हरिदास जी ने 'केलिमाल' की रचना में 'अखंड नित्य विहार' रस निकुंज उपासना को प्रस्तुत किया है ।\",\"english_translation\":\"\",\"description\":\"https://www.brajrasik.org/hi/tag/haridas\",\"tags\":[\"Braj Rasik\",\"Saint\",\"Biography\"],\"author\":\"BrajRasik.org\",\"category\":\"saint\",\"slug\":\"svami-shri-haridasa\"}},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"lang\":\"hi\",\"children\":[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]}]],null],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/cbf73327

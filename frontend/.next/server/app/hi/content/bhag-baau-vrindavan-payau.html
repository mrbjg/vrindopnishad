 से श्री रसिक देव कह रहे हैं -\\nहे भाई! तुमको सर्वोपरि श्रीनित्यविहारिनीजू का निज विलासरस महल श्रीवृन्दावन का अखंड वास प्राप्त हो गया है, यह तुम्हारा अहो भाग्य है।\\nमनुष्य, देवता एवं मुनिगण भी वृन्दावन की इस रज की वांछा करते हैं, एवं ब्रह्मा तथा भगवान शिव इस रज को माथे पर चढ़ाते हैं। [1]\\nश्री राधा के चरण कमलों से आच्छादित श्री वृंदावन की रज के बिना यह दुर्लभ मानव जीवन असंख्य बार व्यर्थ गया है।\\nउसी रज ने मुझ पर अब कृपा की है और मुझे सर्वोच्च आश्रय और अपार आनंद प्रदान किया है। [2]\\nजो वृंदावन आता है वह अपने वास्तविक सम्बन्धी अर्थात श्री श्यामा श्याम और सखियों (उनके रसिक भक्त) से मिलता है। वे सम्बन्धी खुले हाथों से हमारा स्वागत करते हैं और श्री हरि प्रसन्नता पूर्वक अपने कंठ से लगाते हैं।\\nश्री श्यामा श्याम नित्य ही वृंदावन के विभिन्न स्थानों में विचरण करते हैं और हमें उनके सखी (रासिकों) से मिलने में सहायता करते हैं तथा हमें उनका सहयोग प्रदान करने में भी सहायता करते हैं। [3]\\nइस दिव्य स्थान पर पहुंचकर, भक्तों से मिल कर और श्यामा श्यामा की कृपा और वृंदावन की रज को पाकर, किसी को भी फिर कभी दुखी नहीं होना चाहिए, क्योंकि लक्ष्य की प्राप्ति हो गयी है और अनगिनत जन्मों का आवागमन आखिरकार समाप्त हो गया है।\\nश्री रसिक बिहारी देव कहते हैं, \\\"श्री बिहारीजी और बिहारिनी श्री राधारानी का प्रेम प्राप्त कर के और वृंदावन की पावन रज से युक्त होकर अपने आप को बहुत भाग्यशाली समझना चाहिए\\\"। [4]\\nThe following verse is dedicated to the dust of Vrindavan. Shri Rasik Bihari Dev Ju says, It's due to utmost fortune, that one gets a residence (or visit) in Shri Vrindavan Dham.\\nThe dust of this place is rarely achieved even by the heavenly \u0026 celestial beings, human beings, sages, and even Lord Brahma and Lord Shiva. [1]\\nThis rare human life has been wasted innumerable times without the dust of Vrindavan (Dust of Shri Radha’s lotus feet).\\nThe same dust has graced me and provided me with the topmost shelter and immense bliss.  [2]\\nOne who comes to Vrindavan meets their actual relatives after a long time i.e. Shri Shyama Shyam and sakhis (their Rasik devotees). Those relatives welcome us with their open arms and Shri Hari opens his arms to embrace the soul happily.\\nShri Shyama Shyam continually dwells together in the different places of Vrindavan and helps us meet their other Sakhi devotees (Rasiks gathering 'Samaaj') and helps us provide their association. [3]\\nAfter reaching to this divine place, meeting the devotees, and getting the grace of Shyama Shyama and the dust of Vrindavan, no one should ever be sad again, since one has hit the target on the right spot and the rat race of uncountable lifetimes finally over.\\nShri Rasik Bihari Dev says, that one gets the love of Shri Bihariji and Biharini Shri Radharani and should consider oneself to be very fortunate to be blessed with the holy dust of Vrindavan. [4]\",\"author\":{\"@type\":\"Person\",\"name\":\"श्री रसिक बिहारी देव, श्री रसिक बिहारी देव जू की वाणी, सिद्धांत के पद (3)\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:Td4d,"])</script><script>self.__next_f.push([1,"श्रीवृन्दावन अखंड वास करनेवाले निज आश्रित जनों से श्री रसिक देव कह रहे हैं -\nहे भाई! तुमको सर्वोपरि श्रीनित्यविहारिनीजू का निज विलासरस महल श्रीवृन्दावन का अखंड वास प्राप्त हो गया है, यह तुम्हारा अहो भाग्य है।\nमनुष्य, देवता एवं मुनिगण भी वृन्दावन की इस रज की वांछा करते हैं, एवं ब्रह्मा तथा भगवान शिव इस रज को माथे पर चढ़ाते हैं। [1]\nश्री राधा के चरण कमलों से आच्छादित श्री वृंदावन की रज के बिना यह दुर्लभ मानव जीवन असंख्य बार व्यर्थ गया है।\nउसी रज ने मुझ पर अब कृपा की है और मुझे सर्वोच्च आश्रय और अपार आनंद प्रदान किया है। [2]\nजो वृंदावन आता है वह अपने वास्तविक सम्बन्धी अर्थात श्री श्यामा श्याम और सखियों (उनके रसिक भक्त) से मिलता है। वे सम्बन्धी खुले हाथों से हमारा स्वागत करते हैं और श्री हरि प्रसन्नता पूर्वक अपने कंठ से लगाते हैं।\nश्री श्यामा श्याम नित्य ही वृंदावन के विभिन्न स्थानों में विचरण करते हैं और हमें उनके सखी (रासिकों) से मिलने में सहायता करते हैं तथा हमें उनका सहयोग प्रदान करने में भी सहायता करते हैं। [3]\nइस दिव्य स्थान पर पहुंचकर, भक्तों से मिल कर और श्यामा श्यामा की कृपा और वृंदावन की रज को पाकर, किसी को भी फिर कभी दुखी नहीं होना चाहिए, क्योंकि लक्ष्य की प्राप्ति हो गयी है और अनगिनत जन्मों का आवागमन आखिरकार समाप्त हो गया है।\nश्री रसिक बिहारी देव कहते हैं, \"श्री बिहारीजी और बिहारिनी श्री राधारानी का प्रेम प्राप्त कर के और वृंदावन की पावन रज से युक्त होकर अपने आप को बहुत भाग्यशाली समझना चाहिए\"। [4]"])</script><script>self.__next_f.push([1,"b:T59a,The following verse is dedicated to the dust of Vrindavan. Shri Rasik Bihari Dev Ju says, It's due to utmost fortune, that one gets a residence (or visit) in Shri Vrindavan Dham.\nThe dust of this place is rarely achieved even by the heavenly \u0026 celestial beings, human beings, sages, and even Lord Brahma and Lord Shiva. [1]\nThis rare human life has been wasted innumerable times without the dust of Vrindavan (Dust of Shri Radha’s lotus feet).\nThe same dust has graced me and provided me with the topmost shelter and immense bliss.  [2]\nOne who comes to Vrindavan meets their actual relatives after a long time i.e. Shri Shyama Shyam and sakhis (their Rasik devotees). Those relatives welcome us with their open arms and Shri Hari opens his arms to embrace the soul happily.\nShri Shyama Shyam continually dwells together in the different places of Vrindavan and helps us meet their other Sakhi devotees (Rasiks gathering 'Samaaj') and helps us provide their association. [3]\nAfter reaching to this divine place, meeting the devotees, and getting the grace of Shyama Shyama and the dust of Vrindavan, no one should ever be sad again, since one has hit the target on the right spot and the rat race of uncountable lifetimes finally over.\nShri Rasik Bihari Dev says, that one gets the love of Shri Bihariji and Biharini Shri Radharani and should consider oneself to be very fortunate to be blessed with the holy dust of Vrindavan. [4]c:T1182,"])</script><script>sel थानों में विचरण करते हैं और हमें उनके सखी (रासिकों) से मिलने में सहायता करते हैं तथा हमें उनका सहयोग प्रदान करने में भी सहायता करते हैं। [3]\nइस दिव्य स्थान पर पहुंचकर, भक्तों से मिल कर और श्यामा श्यामा की कृपा और वृंदावन की रज को पाकर, किसी को भी फिर कभी दुखी नहीं होना चाहिए, क्योंकि लक्ष्य की प्राप्ति हो गयी है और अनगिनत जन्मों का आवागमन आखिरकार समाप्त हो गया है।\nश्री रसिक बिहारी देव कहते हैं, \"श्री बिहारीजी और बिहारिनी श्री राधारानी का प्रेम प्राप्त कर के और वृंदावन की पावन रज से युक्त होकर अपने आप को बहुत भाग्यशाली समझना चाहिए\"। [4]"])</script><script>self.__next_f.push([1,"11:[\"Braj Rasik\",\"Mass Import\"]\n12:[]\n13:[]\n14:[]\nd:{\"id\":\"local-558\",\"title\":\"भाग बड़ौ वृन्दावन पायौ\",\"category\":\"Shloka\",\"sanskrit_text\":\"भाग बड़ौ वृन्दावन पायौ।जा रज कौं सुर नर मुनि वंछित विधि संकर सिर नायौ॥ [1]बहुतक जुग या रज बिनु बीते जन्म जन्म डहकायौ।सो रज अब कृपा करि दीनी अभै निसान बजायौ॥ [2]आइ मिल्यौ परिवार आपने हरि हँसि कंठ लगायौ।स्यामा स्यामा जू बिहरत दोऊ सखी समाज मिलायौ॥ [3]सोग संताप करौ मति कोई दाव भलौ बनि आयौ।श्रीरसिकबिहारी की गति पाई धनि धनि लोक कहायौ॥ [4]\",\"hindi_text\":\"$e\",\"english_text\":null,\"english_translation\":\"$f\",\"description\":\"https://www.brajrasik.org/hi/articles/5b36b3ba9f7ab760360f9cc8/bhaag-bado-vrindavan-payo-shri-rasik-bihari-dev-ju-from-shri-rasik-bihari-dev-ju-ki-vani-03\",\"author\":\"श्री रसिक बिहारी देव, श्री रसिक बिहारी देव जू की वाणी, सिद्धांत के पद (3)\",\"status\":\"published\",\"content_text\":\"$10\",\"tags\":\"$11\",\"image_urls\":\"$12\",\"video_urls\":\"$13\",\"media_links\":\"$14\",\"source_url\":\"https://www.brajrasik.org/hi/articles/5b36b3ba9f7ab760360f9cc8/bhaag-bado-vrindavan-payo-shri-rasik-bihari-dev-ju-from-shri-rasik-bihari-dev-ju-ki-vani-03\",\"slug\":\"bhag-baau-vrindavan-payau\"}\n16:[\"slug\",\"bhag-baau-vrindavan-payau\",\"d\"]\n1b:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"content\",\" पायौ\",\"category\":\"Shloka\",\"sanskrit_text\":\"भाग बड़ौ वृन्दावन पायौ।जा रज कौं सुर नर मुनि वंछित विधि संकर सिर नायौ॥ [1]बहुतक जुग या रज बिनु बीते जन्म जन्म डहकायौ।सो रज अब कृपा करि दीनी अभै निसान बजायौ॥ [2]आइ मिल्यौ परिवार आपने हरि हँसि कंठ लगायौ।स्यामा स्यामा जू बिहरत दोऊ सखी समाज मिलायौ॥ [3]सोग संताप करौ मति कोई दाव भलौ बनि आयौ।श्रीरसिकबिहारी की गति पाई धनि धनि लोक कहायौ॥ [4]\",\"hindi_text\":\"$a\",\"english_text\":null,\"english_translation\":\"$b\",\"description\":\"https://www.brajrasik.org/hi/articles/5b36b3ba9f7ab760360f9cc8/bhaag-bado-vrindavan-payo-shri-rasik-bihari-dev-ju-from-shri-rasik-bihari-dev-ju-ki-vani-03\",\"author\":\"श्री रसिक बिहारी देव, श्री रसिक बिहारी देव जू की वाणी, सिद्धांत के पद (3)\",\"status\":\"published\",\"content_text\":\"$c\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b36b3ba9f7ab760360f9cc8/bhaag-bado-vrindavan-payo-shri-rasik-bihari-dev-ju-from-shri-rasik-bihari-dev-ju-ki-vani-03\",\"slug\":\"bhag-baau-vrindavan-payau\"},\"initialRelatedSaint\":{\"name\":\"श्री रसिक बिहारी देव, श्री रसिक बिहारी देव जू की वाणी, सिद्धांत के पद (3)\",\"hinglishName\":\"shri rasik bihari dev, shri rasik bihari dev ju ki vani, siddhant ke pad (3)\",\"slug\":\"shri-rasik-bihari-dev-shri-rasik-bihari-dev-ju-ki-vani-siddhant-ke-pad-3\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[\"$d\"],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$L15\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$16\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$und

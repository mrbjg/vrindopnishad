slug%5D/page-5f41a875ac9e9dd8.js\"],\"default\"]\n12:I[4707,[],\"\"]\n14:I[6423,[],\"\"]\n15:I[2046,[\"9213\",\"static/chunks/ef7830f0-bde263843179a996.js\",\"1401\",\"static/chunks/d8b2f613-9822c7accee3e330.js\",\"1464\",\"static/chunks/4ea34a6d-26b267dedec28637.js\",\"9762\",\"static/chunks/44530001-97951b7dfbe773fa.js\",\"4785\",\"static/chunks/4785-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"Cl"])</script><script>self.__next_f.push([1,"ientProviders\"]\n17:I[1060,[],\"\"]\n6:T22d3,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"जब श्री राधा रानी रूप गोस्वामी और सनातन गोस्वामी के लिए मीठे चावल लेकर आती है\",\"description\":\"https://www.brajrasik.org/hi/articles/588e41c458f4ac271a08b950/when-radha-rani-brings-sweet-rice-for-roop-goswami-and-sanatan-goswami\",\"articleBody\":\"\\nएक दिन श्री रूप गोस्वामी सनातन गोस्वामी के लिए कुछ मीठे चावल बनाना चाहते थे परन्तु उनकी कुटिया में मीठे चावल बनाने के लिए आवश्यक वस्तुऐं नहीं था । श्री राधारानी, जो कि सभी भक्तो के मन को जानतीं हैं, उनको इस विषय के बारे में ज्ञात हुआ | इसलिए एक किशोर गोपी के कपड़े पहनकर वह रूप गोस्वामी के लिए दूध, चावल और चीनी ले आयीं और कहा, \\\"स्वामी जी! स्वामी जी! मैं आपके लिए उपहार में कच्चे चावल लेकर आयी हूँ। कृपया इसे स्वीकार करें।\\\" उस किशोरी के शब्द सुनकर श्री रूप गोस्वामी ने अपनी कुटिया का दरवाजा खोला और बाहर देखा। वहां उन्होंने एक सुन्दर किशोर लड़की को खाने का कुछ सामान लिए हुऐ देखा। रूप गोस्वामी ने कहा, \\\"तुम यहाँ क्यों आयी हो?\\\"  \\\" स्वामी जी! मैं सिर्फ आपके लिए ये कच्चे चावल लाई हूँ। \\\"तुमने मेरे लिए इतना कष्ट क्यों किया?\\\" बाबा!  इसमें  कष्ट क्या! मैं यहाँ केवल एक संत को विनम्र सेवा प्रदान करने आयी हूँ।\\\" दूध, चीनी और कच्चे चावलों को स्वीकार करते हुऐ रूप गोस्वामी ने कहा की,\\\" जब तक मैं इन वस्तुओं को अंदर रख आऊं, तब तक तुम यहाँ बैठो।\\\" किशोरी ने कहा,\\\" मुझे क्षमा कीजिये! मुझे कुछ काम करना है।\\\" यह कहकर किशोरी अन्तर्ध्यान हो गयी। जब रूप गोस्वामी मुड़े तो वे ये सब देखकर आश्चर्यचकित रह गये की वह जा चुकी थी। थोड़ी देर बाद उन्होंने मीठे चावल बनाये और अपने आराध्य गोविंद देव को भोग लगाया। कुछ समय बाद उन्होंने सनातन गोस्वामी जो कि अभी-अभी पहुंचे थे, उन्हें प्रसाद दिया।\\nप्रसाद लेते हुऐ सनातन गोस्वामी ने एक असामान्य और मोहक प्रसन्नता अनुभव की। उन्होंने श्री रूप से पूछा,\\\" तुम्हे यह दूध और चावल कहाँ से मिले?\\\" रूप गोस्वामी ने कहा,\\\" एक किशोर गोपी लड़की यहाँ आयी और मुझे ये सब दिया\\\"। सनातन ने कहा,\\\"एक किशोरी लड़की एकदम से यहाँ आयी और तुम्हे दूध और चावल दिए!\\\" रूप गोस्वामी ने उत्तर दिया,\\\" हाँ वह एकदम अचानक से आयी। विचित्र बात तो ये है की मैं सोच रहा था की सनातन के लिए मीठे चावल कैसे बना सकता हूँ। और तभी वह जादू की तरह दूध, चावल और चीनी के साथ प्रकट हो गयी।\\\" ये सब सुनकर सनातन गोस्वामी की आँखों से प्रेम के अश्रु गिर पड़े। उन्होंने कहा,\\\" जब वह तुम्हारी आँखों के सामने थी तो तुमने कुछ पता नहीं किया?\\\" वे स्वयं श्री राधा ठकुरानी थी जो दूध और चावल लेकर आयी थी। उनकी सेवा लेकर हमने अच्छा नहीं किया। अब हम कभी भी अपने वांछित लक्ष्य को पूरा नहीं कर पाएंगे\\\" और इस प्रकार सनातन गोस्वामी बड़े ही विनम्र भाव से बार-बार अपने आप को कोसते रहे की उन्होंने उनकी सेवा ली जिनकी केवल सेवा का लक्ष्य ही लेकर वह आये हैं।\\nयह कथा भक्ति रत्नाकर में वर्णित है।\\nOne day Shri Rupa Goswami wanted to prepare some sweet rice for Sanatana Goswami, but didn't have the necessary provisions for making sweet rice in his kutir. At that time, she who brings about the fulfillment of the inner aspiration of devotees, Radha Rani, could understand everything. And so, in the dress of a young gopi girl she brought milk, rice, and sugar to Rupa Goswami, saying, \\\"Swamiji! Swamiji! I have brought you a gift of uncooked rice. Please accept it. Hearing the words of the young girl, Shri Rupa Goswami opened the door to his hut and looked out. There he saw a beautiful young gopi maiden with some offerings of food. Rupa Goswami said, \\\"Little girl! Whay have you come here?\\\" \\\"Swamiji! I have only brought you some simple uncooked food.\\\" \\\"Why have you taken such trouble for me?\\\" \\\"Baba! What trouble? I have only come to render a humble service to a saintly person.\\\" Accepting the offering of milk, sugar and uncooked rice, Rupa Goswami said, \\\"Young girl please take your seat, while I put these things away.\\\" The girl said, \\\"I'm sorry, but I have some work to do.\\\" Saying this, the girl disappeared. When Rupa Goswami turned around and saw that she had gone, he was very bewildered by all this. At length, he prepared the sweet rice and offered the bhoga to his deity, Govindadeva. After some time, he gave the prasada to Sanatana Goswami, who had just arrived. While honoring prasada, Sanatana Goswami experienced an unusual and enchanting kind of joy. He asked Shri Rupa, \\\"Where did you get this milk and rice from?\\\" Rupa Goswami said, \\\"A young gopi girl came by and gave it to me.\\\" Sanatana said, \\\"A young girl just came by all of a sudden and gave you this milk and rice?\\\" Rupa Goswami replied, \\\"Yes, she just came by all of a sudden. The strange thing is, I was just thinking, 'how can I make some sweet rice for Sanatana,' and she just appeared, as if by magic, with this milk and rice and some sugar.\\\" hearing this, tears of prema began falling from the eyes of Sanatana Goswami. He said, \\\"Can't you recognize something when it is right before your eyes? It was Shri Radha Thakurani Herself who has brought you milk and rice. By accepting service from Her we are ruined. Now we shall never attain our desired goal.\\\" And in this way, Sanatana Goswami out of extreme humbleness continually condemned himself again and again for having accepted service from that person whom he most aspired to serve: Shri Radha Thakurani. This pastime of Shri Sanatana Goswami is recorded in the Bhakti Ratnakara.\",\"author\":{\"@type\":\"Person\",\"name\":\"ब्रज रसिक धरोहर\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:T1612,"])</script><script>self.__next_f.push([1,"एक दिन श्री रूप गोस्वामी सनातन गोस्वामी के लिए कुछ मीठे चावल बनाना चाहते थे परन्तु उनकी कुटिया में मीठे चावल बनाने के लिए आवश्यक वस्तुऐं नहीं था । श्री राधारानी, जो कि सभी भक्तो के मन को जानतीं हैं, उनको इस विषय के बारे में ज्ञात हुआ | इसलिए एक किशोर गोपी के कपड़े पहनकर वह रूप गोस्वामी के लिए दूध, चावल और चीनी ले आयीं और कहा, \"स्वामी जी! स्वामी जी! मैं आपके लिए उपहार में कच्चे चावल लेकर आयी हूँ। कृपया इसे स्वीकार करें।\" उस किशोरी के शब्द सुनकर श्री रूप गोस्वामी ने अपनी कुटिया का दरवाजा खोला और बाहर देखा। वहां उन्होंने एक सुन्दर किशोर लड़की को खाने का कुछ सामान लिए हुऐ देखा। रूप गोस्वामी ने कहा, \"तुम यहाँ क्यों आयी हो?\"  \" स्वामी जी! मैं सिर्फ आपके लिए ये कच्चे चावल लाई हूँ। \"तुमने मेरे लिए इतना कष्ट क्यों किया?\" बाबा!  इसमें  कष्ट क्या! मैं यहाँ केवल एक संत को विनम्र सेवा प्रदान करने आयी हूँ।\" दूध, चीनी और कच्चे चावलों को स्वीकार करते हुऐ रूप गोस्वामी ने कहा की,\" जब तक मैं इन वस्तुओं को अंदर रख आऊं, तब तक तुम यहाँ बैठो।\" किशोरी ने कहा,\" मुझे क्षमा कीजिये! मुझे कुछ काम करना है।\" यह कहकर किशोरी अन्तर्ध्यान हो गयी। जब रूप गोस्वामी मुड़े तो वे ये सब देखकर आश्चर्यचकित रह गये की वह जा चुकी थी। थोड़ी देर बाद उन्होंने मीठे चावल बनाये और अपने आराध्य गोविंद देव को भोग लगाया। कुछ समय बाद उन्होंने सनातन गोस्वामी जो कि अभी-अभी पहुंचे थे, उन्हें प्रसाद दिया।\nप्रसाद लेते हुऐ सनातन गोस्वामी ने एक असामान्य और मोहक प्रसन्नता अनुभव की। उन्होंने श्री रूप से पूछा,\" तुम्हे यह दूध और चावल कहाँ से मिले?\" रूप गोस्वामी ने कहा,\" एक किशोर गोपी लड़की यहाँ आयी और मुझे ये सब दिया\"। सनातन ने कहा,\"एक किशोरी लड़की एकदम से यहाँ आयी और तुम्हे दूध और चावल दिए!\" रूप गोस्वामी ने उत्तर दिया,\" हाँ वह एकदम अचानक से आयी। विचित्र बात तो ये है की मैं सोच रहा था की सनातन के लिए मीठे चावल कैसे बना सकता हूँ। और तभी वह जादू की तरह दूध, चावल और चीनी के साथ प्रकट हो गयी।\" ये सब सुनकर सनातन गोस्वामी की आँखों से प्रेम के अश्रु गिर प ांवला सलोना ग्वाला आया जो पांच-सात वर्ष का था। वो बालक ब्रजभाषा में बड़े दुलार से बोला - \" बाबा ! तुम्हारी तो जटा उलझ गयी, अरे मैं सुलझा दऊँ का ?\" और जैसे ही वो बालक जटा सुलझाने आगे बढ़ा -बाबा ने कहा - \" हाथ मत लगाना , पीछे हटो...कौन हो तुम ?\" ग्वाला - 'अरे ! हमारो जे ही गाम है महाराज! गैया चरा रह्यो तो मैंने देखि बाबा की जटा उलझ गई है तो सोची मैं जाय के सुलझा दऊँ। बाबा -'ना ना ना दूर हट जा। जिसने जटा उलझाई है वही सुलझायगा। ग्वाला - \"अरे महाराज ! तो जाने उलझाई है वाको नाम बताय देयो वाहे बुला लाऊँगो ।\" बाबा - \"तू जा— नाम नहीं बताते हम। कुछ देर तक वो बालक बाबा को समझाता रहा परन्तु जब बाबा नहीं माने तो ग्वाले में से साक्षात्मुरली बजाते हुए भगवान् बांके बिहारी प्रकट हो गये। सांवरिया सरकार बोले - \" महात्मन ! मैंने जटा उलझाई है ? तो लो आ गया मैं।\" और जैसेही सांवरिया जटा सुलझाने आगे बढ़े -बाबा ने कहा - 'हाथ मत लगाना , पीछे हटो। पहले बताओ तुम कौन से कृष्ण हो ?'\nबाबा के वचन सुनकर श्री कृष्ण सोच में पड़ गए कि अरे कृष्ण भी क्या दस-पांच हैं ? श्री कृष्ण बोले -'कौन से कृष्ण हो मतलब ?' बाबा - 'देखो श्री कृष्ण कई हैं। एक देवकी नंदन श्री कृष्ण हैं, एक यशोदानंदन श्री कृष्ण, एक द्वारिकधीश श्री कृष्ण, एक नित्य निकुञ्ज बिहारी श्री कृष्ण।' श्री कृष्ण - 'आपको कौन से चाहिए ?' बाबा - 'मैं तो नित्य निकुञ्जबिहारी श्री कृष्ण का परमोपासक हूँ।' श्री कृष्ण - 'वही तो मैं हूँ। अब सुलझा दूँ क्या ?' जैसे ही श्री कृष्ण जटा सुलझाने के लिए आगे बढ़े तो बाबा बोले - \" हाथ मत लगाना , पीछे हटो। अरे ! नित्य निकुञ्जबिहारी तो किशोरी जू के बिना, मेरी स्वामिनी श्री राधा रानी के बिना एक पल भी नहीं रहते और आप तो अकेले ही खड़े हो।\" बाबा के इतना कहते ही आकाश में बिजली सी चमकी और साक्षात श्री वृषभानुनंदिनी, वृन्दावनेश्वरी, श्री राधिका रानी बाबा के समक्ष प्रकट हो गईं और बोलीं - \"अरे बाबा !\nमैं ही तो ये श्री कृष्ण हूँ और श्री कृष्ण ही तो राधा हैं । हम दोनों एक हैं \" अब तो युगल सरकार का दर्शन पाकर बाबा आनंद विभोर हो उठे। उनकी आँखों से अश्रुधारा बहने लगी। अब जैसे ही श्री राधा-कृष्ण जटा सुलझाने आगे बढ़े -बाबा चरणों में गिर पड़े और बोले - अब जटा क्या सुलझाते हो प्रभु , अब तो जीवन ही सुलझा दो। बाबा ने ऐसी प्रार्थना की और प्रणाम करते करते उनका शरीर शांत हो गया। स्वामिनी जी ने उनको नित्य लीला में स्थान प्रदान किया।"])</script><script>self.__next_f.push([1,"e:Tafd,"])</script><script>self.__next_f.push([1,"Once upon a time in Braj, at Kadambkhandi near Barsana, there lived one saint named Naga Ji, who used to meditate on Yugal Swaroop (Radha and Krishna together). One day, He was going to groves in the evening passing through the big trees, where his hair got stuck with falling branches of one of the trees. He tried a lot to detach his hair but he wasn't able to do so. So he sat under the tree saying “whoever has had my hair stuck to the branches, shall only resolve it, else he will be going lifeless. Three days were passed and baba was still sitting under the tree.\nOne 5-7-year-old beautiful boy came near baba. The boy said politely in Braj language - “Baba can I resolve your stuck hair from branches?” As soon as the boy went ahead to resolve it, Baba suddenly said - “Don't touch it, stay back. Who are you?” Boy - “Ohh baba I am from this village only, I was roaming here to feed cows and saw you in this condition so I thought to help you.” Baba - “No no, stay away. whoever has done this shall resolve it.”\nBoy - “Baba you can tell me the name of the person who had done this, I will call him”.\nBaba - you go from here. I won’t tell you any name. This way, the boy was continuously convincing him but baba didn't agree. When Boy saw that Baba was not willing to take help from him, Suddenly Lord Krishna (with his beautiful flute in his hand) originated from that boy. Lord Krishna then said - Dear Baba! I have done this so here I am.\nAnd as soon as Lord Krishna went ahead to resolve his hair,\nBaba suddenly said - “Don’t touch, Stay back. First, tell me Which Krishn are you?” After listening to Baba's words Shri Krishna thought “whether there are 5-10 Krishn?”\nThen Shri Krishn said - “What do you mean by which Krishn?”\nBaba said - “See, there are many Krishn. One is Devkinandan Krishn, one is Yashoda Nandan Shree Krishn, one is Dwarika Dheesh Krishn, one is Nitya Nikunj Bihari Shri Krishn”.\nShri Krishn said - “Which Shri Krishn do you want?”\nBaba- “I am a follower of Nitya Nikunj Bihari.”\nShree Krishn said - “Yes, I am the same. Can I do it now?”\nAs soon as Shri Krishna went ahead to resolve it, And baba said - “Don't touch it, stay away. Nitya Nikunj Shri Krishna cannot live without Radha Rani for even a single second and you are standing here alone.”\nAs soon as baba said that, there was a thunderstorm struck in the clouds, and then “Shri Vrishbhanu Nandini, Vrindavaneshwari, Shri Radha Rani came in front of baba and said - “Oh baba! See now, we both are here. We both are one.”\nWith the presence of both (yugal sarkar) baba was amazed to see them. He started crying in happiness and both of them together resolved baba’s hairs. Yugal Sarkar Ki Jai. Albeli Sarkar Ki Jai. All Glories to the Rasik Saints of Braj."])</script><script>self.__next_f.push([1,"f:T1975,"])</script><script>self.__next_f.push([1,"बहुत समय पहले की बात है श्री वृंदावन में एक बाबा का निवास था , जो युगल स्वरुप की उपासना किया करते थे। एक बार वे बाबा संध्या वंदन के उपरांत कुञ्जवन की राहपर जा रहे थे। मार्ग में बाबा जब एक वटवृक्ष के नीचे होकर निकले तो उनकी जटा उस वटवृक्ष की जटाओं में उलझ गयी। बहुत प्रयास किया सुलझाने का परन्तु जटा नहीं सुलझी। महात्मा भी महात्मा ही होते हैं। वे आसन जमा कर बैठ गये कि जिसने जटा उलझाई है वो सुलझाने आएगा तो ठीक है नहीं तो मैं ऐसे ही बैठा रहूँगा और प्राण त्याग दूंगा। बाबा को बैठे हुए तीन दिन बीत गये।\nएक सांवला सलोना ग्वाला आया जो पांच-सात वर्ष का था। वो बालक ब्रजभाषा में बड़े दुलार से बोला - \" बाबा ! तुम्हारी तो जटा उलझ गयी, अरे मैं सुलझा दऊँ का ?\" और जैसे ही वो बालक जटा सुलझाने आगे बढ़ा -बाबा ने कहा - \" हाथ मत लगाना , पीछे हटो...कौन हो तुम ?\" ग्वाला - 'अरे ! हमारो जे ही गाम है महाराज! गैया चरा रह्यो तो मैंने देखि बाबा की जटा उलझ गई है तो सोची मैं जाय के सुलझा दऊँ। बाबा -'ना ना ना दूर हट जा। जिसने जटा उलझाई है वही सुलझायगा। ग्वाला - \"अरे महाराज ! तो जाने उलझाई है वाको नाम बताय देयो वाहे बुला लाऊँगो ।\" बाबा - \"तू जा— नाम नहीं बताते हम। कुछ देर तक वो बालक बाबा को समझाता रहा परन्तु जब बाबा नहीं माने तो ग्वाले में से साक्षात्मुरली बजाते हुए भगवान् बांके बिहारी प्रकट हो गये। सांवरिया सरकार बोले - \" महात्मन ! मैंने जटा उलझाई है ? तो लो आ गया मैं।\" और जैसेही सांवरिया जटा सुलझाने आगे बढ़े -बाबा ने कहा - 'हाथ मत लगाना , पीछे हटो। पहले बताओ तुम कौन से कृष्ण हो ?'\nबाबा के वचन सुनकर श्री कृष्ण सोच में पड़ गए कि अरे कृष्ण भी क्या दस-पांच हैं ? श्री कृष्ण बोले -'कौन से कृष्ण हो मतलब ?' बाबा - 'देखो श्री कृष्ण कई हैं। एक देवकी नंदन श्री कृष्ण हैं, एक यशोदानंदन श्री कृष्ण, एक द्वारिकधीश श्री कृष्ण, एक नित्य निकुञ्ज बिहारी श्री कृष्ण।' श्री कृष्ण - 'आपको कौन से चाहिए ?' बाबा - 'मैं तो नित्य निकुञ्जबिहारी श्री कृष्ण का परमोपासक हूँ।' श्री कृष्ण - 'वही तो मैं हूँ। अब सुलझा दूँ क्या ?' जैसे ही श्री कृष्ण जटा सुलझाने के लिए आगे बढ़े तो बाबा बोले - \" हाथ मत लगाना , पीछे हटो। अरे ! नित्य निकुञ्जबिहारी तो किशोरी जू के बिना, मेरी स्वामिनी श्री राधा रानी के बिना एक पल भी नहीं रहते और आप तो अकेले ही खड़े हो।\" बाबा के इतना कहते ही आकाश में बिजली सी चमकी और साक्षात श्री वृषभानुनंदिनी, वृन्दावनेश्वरी, श्री राधिका रानी बाबा के समक्ष प्रकट हो गईं और बोलीं - \"अरे बाबा !\nमैं ही तो ये श्री कृष्ण हूँ और श्री कृष्ण ही तो राधा हैं । हम दोनों एक हैं \" अब तो युगल सरकार का दर्शन पाकर बाबा आनंद विभोर हो उठे। उनकी आँखों से अश्रुधारा बहने लगी। अब जैसे ही श्री राधा-कृष्ण जटा सुलझाने आगे बढ़े -बाबा चरणों में गिर पड़े और बोले - अब जटा क्या सुलझाते हो प्रभु , अब तो जीवन ही सुलझा दो। बाबा ने ऐसी प्रार्थना की और प्रणाम करते करते उनका शरीर शांत हो गया। स्वामिनी जी ने उनको नित्य लीला में स्थान प्रदान किया।"])</script><script>self.__next_f.push([1,"10:Tde8,"])</script><script>self.__next_f.push([1,"एक बार श्री राधा रानी रास-लीला के मध्य एक उदास मनोदशा (मान) में थीं । रास-लीला वृन्दावन धाम में मनोहर जगह हो रही थी। मान की लीला में उन्होंने रास लीला का त्याग कर, यमुना को पार करके वो एक एकांत वन में आ गई। श्री राधा रानी ने श्री कृष्ण के वियोग में आंसू बहाये। उनकी आँखों से आंसू बहने लगी और उन आसुओं से एक कुंड बन गया और इसका नाम मानसरोवर हो गया । श्री कृष्ण भी व्याकुल हो कर, श्री राधा रानी को ढूंढते हुए इस सरोवर पर पहुंचे। वे अपनी बांसुरी और अपने मस्तक को श्री राधा रानी के कोमल चरणों में रख कर अपनी भूल स्वीकारते हैं और आश्वासन देते हैं कि वह फिर से ऐसा नहीं करेंगे।\nब्रज में यह आकर्षक स्थान मोर, कोकिला, हंस, हिरण और अन्य पक्षी और पशुओं तथा पीलू, कदंब और तमाल के वृक्ष और उनकी छाया से सुशोभित है। यह दृश्य इस वन में आज भी आँखों को मोहित करता है और दिव्य युगल श्री राधा रानी और श्री कृष्ण की रास-लीला की स्मृति दिलाता है।\nमान सरोवर के किनारे एक बहुत पुराना मंदिर है। जिसमे एक चित्र मैं श्री कृष्ण, श्री राधा रानी के मान अवस्था को दूर करने के लिए अपनी बांसुरी और मस्तक, श्री राधा रानी के कमल स्वरुप चरणों में रख देते है। ये चित्र अभी भी इस मंदिर मैं लगा हुआ है।\nश्री कृष्ण कहते हैं \"सामरा-गरेला-धनदानाम-ममा शिरासि मंडनं देहि पढा-पल्लवं उदारम \" - आपके चरणों से दूरी के कारण मेरे हृदय की ज्वाला शांत नहीं हो रही, कृपया आप अपने कमल रुपी चरण मेरे सर पर रखिये और मेरे मस्तक की शोभा बढ़ाइए\"।\nयह स्थान यमुना जी की दूसरी ओर है, धीर समीर से एक कच्चा रास्ता है, जहाँ से यमुना जी को पार करके जाया जा सकता है।"])</script><script>self.__next_f.push([1,"11:Tde8,"])</script><script>self.__next_f.push([1,"एक बार श्री राधा रानी रास-लीला के मध्य एक उदास मनोदशा (मान) में थीं । रास-लीला वृन्दावन धाम में मनोहर जगह हो रही थी। मान की लीला में उन्होंने रास लीला का त्याग कर, यमुना को पार करके वो एक एकांत वन में आ गई। श्री राधा रानी ने श्री कृष्ण के वियोग में आंसू बहाये। उनकी आँखों से आंसू बहने लगी और उन आसुओं से एक कुंड बन गया और इसका नाम मानसरोवर हो गया । श्री कृष्ण भी व्याकुल हो कर, श्री राधा रानी को ढूंढते हुए इस सरोवर पर पहुंचे। वे अपनी बांसुरी और अपने मस्तक को श्री राधा रानी के कोमल चरणों में रख कर अपनी भूल स्वीकारते हैं और आश्वासन देते हैं कि वह फिर से ऐसा नहीं करेंगे।\nब्रज में यह आकर्षक स्थान मोर, कोकिला, हंस, हिरण और अन्य पक्षी और पशुओं तथा पीलू, कदंब और तमाल के वृक्ष और उनकी छाया से सुशोभित है। यह दृश्य इस वन में आज भी आँखों को मोह

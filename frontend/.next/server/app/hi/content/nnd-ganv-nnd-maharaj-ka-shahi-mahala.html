tic/chunks/44530001-97951b7dfbe773fa.js\",\"4785\",\"static/chunks/4785-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"Cli"])</script><script>self.__next_f.push([1,"entProviders\"]\n14:I[1060,[],\"\"]\n6:Tde0,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"नंद गाँव नंद महाराज का शाही महल\",\"description\":\"https://www.brajrasik.org/hi/articles/58dbffe011ec2c04484ebfcf/nandgaon-palace-of-shri-nandbaba\",\"articleBody\":\"\\nनंद महाराज का राजमहल, नंद गाँव में स्थित है। नंद गाँव बरसाना के उत्तर में 8.5 किलोमीटर की दूरी पर स्थित है । नंद गाँव मथुरा के उत्तर-पश्चिम में लगभग 50 किलोमीटर दूर स्थित है।\\nभगवान शिव ने श्री कृष्ण की उपासना कर उनसे एक वरदान माँगा की उनके बाल रूप के दर्शन प्राप्त हों । श्री कृष्ण ने उनको बाल रूप के दर्शन देकर उन्हें प्रसन्न किया और उनसे कहा कि वह नंद गाँव में एक पहाड़ के रूप में स्वयं को स्थापित कर लें । नंद गाँव में भगवान शिव नंदेश्वर पहाड़ी पर बैठ गए। नंदबाबा का महल नंदेश्वर पहाड़ी पर स्थित है।\\nयहाँ माता यशोदा, पिता नंद बाबा और कृष्ण-बलराम ने बचपन में कई लीलाऐं की हैं। प्रतिदिन माता यशोदा, बलराम और श्री कृष्ण का नए-नए प्रकार से श्रृंगार करती थीं । श्री कृष्ण और बलराम अपने मित्रों के साथ प्रतिदिन गाय चराने जाते थे । इसी स्थान पर माता यशोदा ने श्री राधा रानी को अपनी गोद में बिठाया था जिसके पश्चात् उनकी आँखों से आंसू बहने लगे थे ।\\nThe royal palace of Nanda Maharaj, is situated in Nandagaon. Nandgaon is located about 8.5 km to the north of Barsana. Nandgaon is located about 50 Kms on the north west of Mathura.\\nLord Shiva pleased his worshipful deity Shri Krishna and asked for the boon to have darshan of his childhood pastimes. Shri Krishn pleased with him and asked him to situate himself in Nandagaon in the form of a hill. Lord Shiva became Nandeshwar Hill at Nandgaon. Nandbaba's Palace is located at Nandeshwar Hill.\\nHere, Mother Yashoda, Father Nandbaba and Krishnam Baldev performed many of Their childhood, boyhood and youth pastimes. Every day, Mother Yashoda used to decorate Balrama and Krishna in different ways. Shri Krishn and Balram with Their friends, go to cow grazing daily. Here, Mother Yashoda used to put Radharani on her lap before seeing Her off with tearful eyes.\",\"author\":{\"@type\":\"Person\",\"name\":\"ब्रज रसिक धरोहर\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:T1975,"])</script><script>self.__next_f.push([1,"बहुत समय पहले की बात है श्री वृंदावन में एक बाबा का निवास था , जो युगल स्वरुप की उपासना किया करते थे। एक बार वे बाबा संध्या वंदन के उपरांत कुञ्जवन की राहपर जा रहे थे। मार्ग में बाबा जब एक वटवृक्ष के नीचे होकर निकले तो उनकी जटा उस वटवृक्ष की जटाओं में उलझ गयी। बहुत प्रयास किया सुलझाने का परन्तु जटा नहीं सुलझी। महात्मा भी महात्मा ही होते हैं। वे आसन जमा कर बैठ गये कि जिसने जटा उलझाई है वो सुलझाने आएगा तो ठीक है नहीं तो मैं ऐसे ही बैठा रहूँगा और प्राण त्याग दूंगा। बाबा को बैठे हुए तीन दिन बीत गये।\nएक सांवला सलोना ग्वाला आया जो पांच-सात वर्ष का था। वो बालक ब्रजभाषा में बड़े दुलार से बोला - \" बाबा ! तुम्हारी तो जटा उलझ गयी, अरे मैं सुलझा दऊँ का ?\" और जैसे ही वो बालक जटा सुलझाने आगे बढ़ा -बाबा ने कहा - \" हाथ मत लगाना , पीछे हटो...कौन हो तुम ?\" ग्वाला - 'अरे ! हमारो जे ही गाम है महाराज! गैया चरा रह्यो तो मैंने देखि बाबा की जटा उलझ गई है तो सोची मैं जाय के सुलझा दऊँ। बाबा -'ना ना ना दूर हट जा। जिसने जटा उलझाई है वही सुलझायगा। ग्वाला - \"अरे महाराज ! तो जाने उलझाई है वाको नाम बताय देयो वाहे बुला लाऊँगो ।\" बाबा - \"तू जा— नाम नहीं बताते हम। कुछ देर तक वो बालक बाबा को समझाता रहा परन्तु जब बाबा नहीं माने तो ग्वाले में से साक्षात्मुरली बजाते हुए भगवान् बांके बिहारी प्रकट हो गये। सांवरिया सरकार बोले - \" महात्मन ! मैंने जटा उलझाई है ? तो लो आ गया मैं।\" और जैसेही सांवरिया जटा सुलझाने आगे बढ़े -बाबा ने कहा - 'हाथ मत लगाना , पीछे हटो। पहले बताओ तुम कौन से कृष्ण हो ?'\nबाबा के वचन सुनकर श्री कृष्ण सोच में पड़ गए कि अरे कृष्ण भी क्या दस-पांच हैं ? श्री कृष्ण बोले -'कौन से कृष्ण हो मतलब ?' बाबा - 'देखो श्री कृष्ण कई हैं। एक देवकी नंदन श्री कृष्ण हैं, एक यशोदानंदन श्री कृष्ण, एक द्वारिकधीश श्री कृष्ण, एक नित्य निकुञ्ज बिहारी श्री कृष्ण।' श्री कृष्ण - 'आपको कौन से चाहिए ?' बाबा - 'मैं तो नित्य निकुञ्जबिहारी श्री कृष्ण का परमोपासक हूँ।' श्री कृष्ण - 'वही तो मैं हूँ। अब सुलझा दूँ क्या ?' जैसे ही श्री कृष्ण जटा सुलझाने के लिए आगे बढ़े तो बाबा बोले - \" हाथ मत लगाना , पीछे हटो। अरे ! नित्य निकुञ्जबिहारी तो किशोरी जू के बिना, मेरी स्वामिनी श्री राधा रानी के बिना एक पल भी नहीं रहते और आप तो अकेले ही खड़े हो।\" बाबा के इतना कहते ही आकाश में बिजली सी चमकी और साक्षात श्री वृषभानुनंदिनी, वृन्दावनेश्वरी, श्री राधिका रानी बाबा के समक्ष प्रकट हो गईं और बोलीं - \"अरे बाबा !\nमैं ही तो ये श्री कृष्ण हूँ और श्री कृष्ण ही तो राधा हैं । हम दोनों एक हैं \" अब तो युगल सरकार का दर्शन पाकर बाबा आनंद विभोर हो उठे। उनकी आँखों से अश्रुधारा बहने लगी। अब जैसे ही श्री राधा-कृष्ण जटा सुलझाने आगे बढ़े -बाबा चरणों में गिर पड़े और बोले - अब जटा क्या सुलझाते हो प्रभु , अब तो जीवन ही सुलझा दो। बाबा ने ऐसी प्रार्थना की और प्रणाम करते करते उनका शरीर शांत हो गया। स्वामिनी जी ने उनको नित्य लीला में स्थान प्रदान किया।"])</script><script>self.__next_f.push([1,"b:Tafd,"])</script><script>self.__next_f.push([1,"Once upon a time in Braj, at Kadambkhandi near Barsana, there lived one saint named Naga Ji, who used to meditate on Yugal Swaroop (Radha and Krishna together). One day, He was going to groves in the evening passing through the big trees, where his hair got stuck with falling branches of one of the trees. He tried a lot to detach his hair but he wasn't able to do so. So he sat under the tree saying “whoever has had my hair stuck to the branches, shall only resolve it, else he will be going lifeless. Three days were passed and baba was still sitting under the tree.\nOne 5-7-year-old beautiful boy came near baba. The boy said politely in Braj language - “Baba can I resolve your stuck hair from branches?” As soon as the boy went ahead to resolve it, Baba suddenly said - “Don't touch it, stay back. Who are you?” Boy - “Ohh baba I am from this village only, I was roaming here to feed cows and saw you in this condition so I thought to help you.” Baba - “No no, stay away. whoever has done this shall resolve it.”\nBoy - “Baba you can tell me the name of the person who had done this, I will call him”.\nBaba - you go from here. I won’t tell you any name. This way, the boy was continuously convincing him but baba didn't agree. When Boy saw that Baba was not willing to take help from him, Suddenly Lord Krishna (with his beautiful flute in his hand) originated from that boy. Lord Krishna then said - Dear Baba! I have done this so here I am.\nAnd as soon as Lord Krishna went ahead to resolve his hair,\nBaba suddenly said - “Don’t touch, Stay back. First, tell me Which Krishn are you?” After listening to Baba's words Shri Krishna thought “whether there are 5-10 Krishn?”\nThen Shri Krishn said - “What do you mean by which Krishn?”\nBaba said - “See, there are many Krishn. One is Devkinandan Krishn, one is Yashoda Nandan Shree Krishn, one is Dwarika Dheesh Krishn, one is Nitya Nikunj Bihari Shri Krishn”.\nShri Krishn said - “Which Shri Krishn do you want?”\nBaba- “I am a follower of Nitya Nikunj Bihari.”\nShree Krishn said - “Yes, I am the same. Can I do it now?”\nAs soon as Shri Krishna went ahead to resolve it, And baba said - “Don't touch it, stay away. Nitya Nikunj Shri Krishna cannot live without Radha Rani for even a single second and you are standing here alone.”\nAs soon as baba said that, there was a thunderstorm struck in the clouds, and then “Shri Vrishbhanu Nandini, Vrindavaneshwari, Shri Radha Rani came in front of baba and said - “Oh baba! See now, we both are here. We both are one.”\nWith the presence of both (yugal sarkar) baba was amazed to see them. He started crying in happiness and both of them together resolved baba’ 6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"content\",\"nnd-ganv-nnd-maharaj-ka-shahi-mahala\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"nnd-ganv-nnd-maharaj-ka-shahi-mahala\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"nnd-ganv-nnd-maharaj-ka-shahi-mahala\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"nnd-ganv-nnd-maharaj-ka-shahi-mahala\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"मुख्यपृष्ठ\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"पुस्तकालय\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"नंद गाँव नंद महाराज का शाही महल\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content/nnd-ganv-nnd-maharaj-ka-shahi-mahala\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-6xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L7\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[[\"$\",\"$L7\",null,{\"href\":\"/hi/content\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"पुस्तकालय\"}],[\"$\",\"span\",null,{\"children\":\"→\"}]],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"नंद गाँव नंद महाराज का शाही महल\"}]]}],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-258\",\"title\":\"नंद गाँव नंद महाराज का शाही महल\",\"category\":\"General\",\"sanskrit_text\":null,\"hindi_text\":\"नंद महाराज का राजमहल, नंद गाँव में स्थित है। नंद गाँव बरसाना के उत्तर में 8.5 किलोमीटर की दूरी पर स्थित है । नंद गाँव मथुरा के उत्तर-पश्चिम में लगभग 50 किलोमीटर दूर स्थित है।\\nभगवान शिव ने श्री कृष्ण की उपासना कर उनसे एक वरदान माँगा की उनके बाल रूप के दर्शन प्राप्त हों । श्री कृष्ण ने उनको बाल रूप के दर्शन देकर उन्हें प्रसन्न किया और उनसे कहा कि वह नंद गाँव में एक पहाड़ के रूप में स्वयं को स्थापित कर लें । नंद गाँव में भगवान शिव नंदेश्वर पहाड़ी पर बैठ गए। नंदबाबा का महल नंदेश्वर पहाड़ी पर स्थित है।\\nयहाँ माता यशोदा, पिता नंद बाबा और कृष्ण-बलराम ने बचपन में कई लीलाऐं की हैं। प्रतिदिन माता यशोदा, बलराम और श्री कृष्ण का नए-नए प्रकार से श्रृंगार करती थीं । श्री कृष्ण और बलराम अपने मित्रों के साथ प्रतिदिन गाय चराने जाते थे । इसी स्थान पर माता यशोदा ने श्री राधा रानी को अपनी गोद में बिठाया था जिसके पश्चात् उनकी आँखों से आंसू बहने लगे थे ।\",\"english_text\":null,\"english_translation\":\"The royal palace of Nanda Maharaj, is situated in Nandagaon. Nandgaon is located about 8.5 km to the north of Barsana. Nandgaon is located about 50 Kms on the north west of Mathura.\\nLord Shiva pleased his worshipful deity Shri Krishna and asked for the boon to have darshan of his childhood pastimes. Shri Krishn pleased with him and asked him to situate himself in Nandagaon in the form of a hill. Lord Shiva became Nandeshwar Hill at Nandgaon. Nandbaba's Palace is located at Nandeshwar Hill.\\nHere, Mother Yashoda, Father Nandbaba and Krishnam Baldev performed many of Their childhood, boyhood and youth pastimes. Every day, Mother Yashoda used to decorate Balrama and Krishna in different ways. Shri Krishn and Balram with Their friends, go to cow grazing daily. Here, Mother Yashoda used to put Radharani on her lap before seeing Her off with tearful eyes.\",\"description\":\"https://www.brajrasik.org/hi/articles/58dbffe011ec2c04484ebfcf/nandgaon-palace-of-shri-nandbaba\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"नंद महाराज का राजमहल, नंद गाँव में स्थित है। नंद गाँव बरसाना के उत्तर में 8.5 किलोमीटर की दूरी पर स्थित है । नंद गाँव मथुरा के उत्तर-पश्चिम में लगभग 50 किलोमीटर दूर स्थित है।\\nभगवान शिव ने श्री कृष्ण की उपासना कर उनसे एक वरदान माँगा की उनके बाल रूप के दर्शन प्राप्त हों । श्री कृष्ण ने उनको बाल रूप के दर्शन देकर उन्हें प्रसन्न किया और उनसे कहा कि वह नंद गाँव में एक पहाड़ के रूप में स्वयं को स्थापित कर लें । नंद गाँव में भगवान शिव नंदेश्वर पहाड़ी पर बैठ गए। नंदबाबा का महल नंदेश्वर पहाड़ी पर स्थित है।\\nयहाँ माता यशोदा, पिता नंद बाबा और कृष्ण-बलराम ने बचपन में कई लीलाऐं की हैं। प्रतिदिन माता यशोदा, बलराम और श्री कृष्ण का नए-नए प्रकार से श्रृंगार करती थीं । श्री कृष्ण और बलराम अपने मित्रों के साथ प्रतिदिन गाय चराने जाते थे । इसी स्थान पर माता यशोदा ने श्री राधा रानी को अपनी गोद में बिठाया था जिसके पश्चात् उनकी आँखों से आंसू बहने लगे थे ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/58dbffe011ec2c04484ebfcf/nandgaon-palace-of-shri-nandbaba\",\"slug\":\"nnd-ganv-nnd-maharaj-ka-shahi-mahala\"},\"initialRelatedSaint\":null,\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-2\",\"title\":\"नागा बाबा कदम्ब खंडी\",\"category\":\"General\",\"sanskrit_text\":null,\"hindi_text\":\"$a\",\"english_text\":null,\"english_translation\":\"$b\",\"description\":\"https://www.brajrasik.org/hi/articles/585f1f3e283dcc7a480eeb93/naga-ji-barsana-braj-yugal-swaroop-upasak-devotee.\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"$c\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/585f1f3e283dcc7a480eeb93/naga-ji-barsana-braj-yugal-swaroop-upasak-devotee.\"

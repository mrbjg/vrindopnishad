hasau-laughter.\nPlease meditate on Shri Shri Radhika`-Krishnacandra. Tossed by the waves in the wonderful whirlpool of Kamadeva's nectar ocean, Their hearts and limbs are now exhausted. In many ways They talk, laugh, and touch each other's limbs. Their pastimes fill the gopis with wonder in a secluded forest grove.\nText 27\nbahula-surata-khelayasa-sankhinna-gatrau\ndayita-nija-sakhibhir vijyamanau patantaih\nsarasa-bhujaga-valli-pallavam-vadi-vaktrau\nsmara nibhrta-nikunje radhika-krishnacandrau\nbahula-many; surata-amorous; khela-by pastimes; ayasa-by fatigue; sankhinna-distressed; gatrau-limbs; dayita-beloved; nija-own; sakhibhih-with friends; vijyamanau-fanned; patantaih-falling; sarasa-nectarean; bhujaga-bhujaga; valli-vines; pallavam-blossoms; vadi-speaking; vaktrau-mouths.\nPlease meditate on Shri Shri Radhika`-Krishnacandra. Their limbs, exhausted from many amorous pastimes, are fanned by Their dear gopi friends. The sweet bhujana vines of Their lips blossom with flowers of the word \"Yes\" in a secluded forest grove.\nText 28\nmitha-uru-pulaka-shri-dor-lata-baddha-kanthau\nvyati-milita-mukhendu kinkini-lalitanghri\nnava-rati-rasa-khela-sranti-tandralu-netrau\nsmara nibhrta-nikunje radhika-krishnacandrau\nmitha-of each other; uru-great; pulaka-hairs standing up; shri-handsome; doh-of arms; lata-vines; baddha-bound; kanthau-necks; vyatimilita-intimately meeting; mukha-face; indu-moons; kinkini-anklets; lalita-charming; anghri-feet; nava-new; rati-amorous; rasa-nectar; khela-pastimes; sranti-fatigue; tandralu-sleepy; netrau-eyes.\nPlease meditate on Shri Shri Radhika`-Krishnacandra. The hairs of Their bodies erect, the flowering vines of Their arms entwined around each other's neck, the moons of Their faces touching, and the anklets on their graceful feet playfully tinkling, exhausted from drinking the nectar of ever-new amorous pastimes, They close Their eyes in sleep in a secluded forest grove.\nText 29\nsurata-rasa-samudre padam a-cuda-magnau\ntruti-lavam iva yatam- manyamanau tri-yamam\npratinimisam asimojjrmbhitananga-trsnau\nsmara nibhrta-nikunje radhika-krishnacandrau\nsurata-of amorous pastimes; rasa-of nectar; samudre-oceans; padam-foot; a-up to; cuda-the top of the head; magnau-plunged; truti-lavam-a fraction of a second; iva-like; yatam-passed; manyamanau-considering; tri-yamam-the nine hours; pratinimisam-at every moment; asima-limitless; ujjrmbhita-expanding; ananga-amorous; trsnau-thirst.\nPlease meditate on Shri Shri Radhika`-Krishnacandra who, plunged from head to foot in the nectar ocean of transcendental amorous love, and thinking that the nine hours of night pass as swiftly as a moment, at every moment thirst to taste limitless amorous pastimes in a secluded forest grove.\nText 30\ntad-ati-madhura-dhamni namni vatsalya-matrat\nkatham api kalaniyau kasyacid bhama-simni\nsruti-tatibhir agamyau sat-sabhajasra-sangau\nsmara nibhrta-nikunje radhika-krishnacandrau\ntat-of Them; ati-very; madhura-sweet; dhamni-splendor; namni-names; vatsalya-by love; matrat-alone; katham api-something; kalaniyau-may be understood; kasyacit-by someone; bhama-of splendor; simni-the limit; sruti-tatibhih-by the Vedas\nagamyau-unapproachable; sat-of the saintly; sabha-in the assembly; ajasra-eternal; sangau-association.\nPlease meditate on Shri Shri Radhika`-Krishnacandra, who stay in a secluded forest grove. They are two abodes of sweetness. They stay at the apeo of all splendor. Only a person filled with love can see that They are both present in Their holy names. The Vedas cannot approach Them. They always stay with Their saintly devotees.\nText 31\nparama-rasa-rahasyananda-nihsyandi-vrnda-\nvana-vipina-nikunje divya-divyair vilasaih\nniravadhi rasamanau radhika-krishnacandrau;\nbhaja sakalam upeksya tavakah sastra-yuktih\nparama-supreme; rasa-nectar; rahasya-confidential; ananda-bliss; nihsyandi-flowing; vrnda-abundance; vana-vipina-forest; nikunje-in the grove; divya-divyaih-transcendental; vilasaih-with pastimes; niravadhi-limitless; rasamanau-tasting; radhika-krishnacandrau-Radhika`-Krishnacandra; bhaja-please worship; sakalam-everything; upeksya-ignoring; tavakah-of you; sastra-of books; yuktih-logic.\nPlease ignore the arguments of any opposing books and worship Shri Shri Radhika`-Krishnacandra, who enjoy limitless transcendental pastimes in the forest groves of Vrndavana, groves filled with the flowing nectar of the transcendental bliss of Their sweet and secret pastimes.\nText 32\nstavam imam ati-ramyam- radhika-krishnacandra-\npramada-bhara-vilasair adbhutam- bhava-yuktah\npathati ya iha ratrau nityam avyagra-citto\nvimala-matisu radhalisu sakhyam- labheta\nstavam-prayer; imam-this; ati-ramyam-very beautiful; radhika-krishnacandra-of Shri Shri Radhika`-Krishnacandra; pramada-bliss; bhara-abundance; vilasaih-with pastimes; adbhutam-wonderful; bhava-yuktah-with love; pathati-reads; ya-one who; iha-here; ratrau-at night; nityam-regularly; avyagra-fixed; cittah-attention; vimala-pure; matisu-in hearts; radha-of Shri Radha; alisu-among the friends; sakhyam-friendship; labheta-obtains.\nMay a person who every evening lovingly and attentively reads these prayers wonderful and beautiful with Shri Shri Radhika`-Krishnacandra's blissful pastimes, attain the friendship of Shri Radha's pure-hearted friends."])</script><script>self.__next_f.push([1,"c:T8969,"])</script><script>self.__next_f.push([1,"श्लोक 1\nनव ललितवयस्कौ नव्यलावण्यपुञ्जौ\nनव रस चलचित्तौ नूतनप्रेमवित्तौ।\nनव निधुवनलीला कौतुकेनातिलोलौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nरे मन! तू परम मनोहर कैशोर वयस वाले और मुक्ता फल की छाया की तरह नव-लावण्य के राशि रूप तथा नवायमान श्रृंगाररस में चञ्चल चित्त वाले तथा जिनके नवीन प्रेम ही परम धन है और निधुवन की लीला कौतुक में अत्यन्त चञ्चल श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 2\nद्रुतकनक- सुगौरस्निग्धमेघौघनील\nच्छविभिरखिलबृन्दारण्यमुद्भाषयन्तौ।\nमृदुलनवदुकूले नीलपीते दधानौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nहे मन ! द्रवायमान सुवर्ण तथा सघन मेघ समूह की भाँति गौर नील कान्तियों से समग्र वृन्दाबन को भासमान करने वाले, नवीन मृदुल नील पीत पाटम्बर धारीणि, श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 3\nप्रथममिलनभीतोद्भाषिताश्वासवाचौ\nप्रियतम - भुजरोधव्यग्रहस्तौ रतोत्कौ।\nअलमलमितिलीला गद्गदोक्त्युन्मदान्धौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nनव संगम में भीत तथा कोमल आश्वासना देने वाले, भुज प्रसारण तथा भुज रोध में व्यग्र हस्त वाले, क्रीडा में उत्कण्ठित, \"छोड़िये छोड़िये मत जाइये, मत जाइये\" इस प्रकार गद्गद् बोलने वाले, आनन्दमत्त श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 4\nप्रियरतिसमनुज्ञामार्गनानम्रवक्वो\nन्नमितचिवुकदृष्ट्या स्मेरकान्ताननाब्जौ।\nकिमिह कुरुष इत्यास्वाद्यवाक्किञ्चनोक्ती\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nप्रिय के रति प्रयोग में अनुमति जान कर नम्रवदना तथा चिबुक उठा कर उसमें दृष्टि के द्वारा ईषत् हास्य युक्त मनोहर बदन कमल वाले और \"सखी मण्डल के बीच यह क्या करते हैं\" इस प्रकार आस्वाद योग्य वचन समूह को बोलने वाली, तथा रहस्य प्रकाशक मन्द मन्द बोलने वाले श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 5\nप्रतिपद प्रतिकूलानुग्रहव्यग्रमूर्त्ती\nबहु विरचित नाना चाटुकारप्रकारौ।\nनवसुरत -विलासोत्सुक्यगूढ़प्रकाशौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nपद-पद में प्रिया के द्वारा हठ करने के कारण तथा प्रिय के द्वारा आग्रह करने के कारण चंचल मूर्ति वाले, नाना प्रकार के चाटु वचन व्यवहारकारी, नव नव सुरत प्रयोग के विलास में उत्कण्ठित होकर प्रिया के द्वारा गोपन तथा प्रिय के द्वारा प्रकाश करने वाले श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 6\nसुरतकलह सौख्यैः काकुवादप्रणामा-\nधिकविरचितमान्यौ दुर्गमप्रेमभंगौ।\nस्मितमधुरमृदूपालम्भह्रन्नीतकान्तौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nसुरत कलह सुख में काकुवाद और प्रणाम के द्वारा अधिक गौरव बढ़ाने वाले, जिनके प्रेम सागर की तरङ्ग दुर्बोध है, उन मन्दहास्य के साथ कोमल तिरस्कारादि करने में व्यग्र हृदय श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 7\nनव किशलयतल्पे कल्पयन्तौ विचित्रां\nसुरतसमरलीलामुन्मदानंगरङ्गौ।\nललित वलय काञ्ची नूपूरध्वानरम्यौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nनवीन किसलय निर्मित शय्या में विचित्र सुरत युद्ध बढ़ाने वाले, उद्गत अनङ्ग रङ्ग में मत्तता जिनके, ललित वलय, किंकिणी, नूपुर ध्वनियों से मनोहर श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 8\nप्रियकरपरिमर्दोजृम्भमानोरुवक्षो-\nरुहमनसिजकण्डूद्दण्डकन्दर्पलोलौ।\nनमित दयितपाणि स्पृष्टनीवीनिवन्धौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nश्रीकृष्ण के हस्त द्वारा बारम्बार संघर्ष से उठा है स्तन कमलों में कामकण्डू जिनकी तथा उद्दण्डता कन्दर्प केलि के कारण चंचल हृदय जिनके ऐसे दोनों, नीविबन्धन स्पर्श करने में वा कराने में जिनसे प्रिय के हस्तकमल स्थापित हुए हैं ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 9\nप्रियतम-कृत-गाढ़ाश्लेषखर्व्वायितोरु\nस्तनमुकुल मनोज्ञावल्लभैकात्मतेच्छुः।\nकिमपि रचित शुष्कक्रन्दितोदारहासौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nप्रियतम के गाढ़ आलिंगन से खर्व्वित स्तन मुकुल के द्वारा मनोहारिणी, प्रियतमा के साथ एकात्मता भाव को चाहने वाले, शुष्क रोदन करने वाली तथा उदार हास्ययुक्त श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 10\nसततसुरततृष्णाव्याकुलाबुन्मदिष्णू\nविपुलपुलकराजद्गौरनीलोज्वलाङ्गौ।\nमिथ उरुपरिरम्भादेकदेहायमानौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nनिरन्तर सुरत रस तृष्णा में व्याकुल, उन्मत्त, विपुल पुलकावलि से शोभायमान गौर नील उज्वल शरीर वाले और परस्पर के निविड़ आलिंगन से मानो एक देह रूप, श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 11\nसततमपरिमानोज्जृम्भमानानुरागौ\nमदरसभरसिन्धू लोलदोलायिताङ्गौ।\nदलितसक्लसेतू धन्यगोप्येकरम्यौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nजिनके निरन्तर उच्छलित असीम अनुराग गर्व रसाधिक्य के सागर के समान, चंचल दोलायमान अङ्ग हैं और जिनके नाश हो रहा है धैर्य्य दैन्यादिक भाव समूह अथवा लोकवेद से अतीत, सुकृत स्वरूपा गोपियों से मनोहर श्री राधिका कृष्ण चन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 12\nविलुलितवरबेणी - हारमालावतंसौ\nमृदुलमधुरहासोल्लासिवक्त्रेन्दुविम्बौ।\nअतिरस मदलोलौ चित्रकन्दर्पकेली\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nजिनकी श्रेष्ठ वेणियाँ, हार, माल्य, भूषणादिक विदलायमान हो गये हैं और मन्द मधुर हास्य से जिनका मुख चन्द्रविम्ब उल्लसित है तथा जिनकी अतिशय सुरत गर्व से चपल, विस्मापनी कन्दर्पसम्बन्धिनी क्रीडा है ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 13\nसुरतरसमदान्धौ सन्ततं सन्तरन्तौ\nत्रुटित वलय काञ्ची दाम हारावलिकौ।\nमणिकनक विभूषोत्सारभास्वत्पराङ्गौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nसुरतरस के गर्व सागर में निरन्तर तहरने वाले, जिनके वलय, किंकिणी, पुष्पों की मालायें हार समूह टूट गये हैं, मणि कनक भूषणादिक अस्त व्यस्त हो जाने से जिनके उत्तम अंग प्रत्यंग शोभायमान हो रहे हैं, ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्च में स्मरण कर।\nश्लोक 14\nस्तवकित मणिदाम्ना प्रेयसागुम्फितात्य-\nद्भुत सुललितवेणी प्रेयसीक्लृप्तचूडौ।\nमिथ उदयदखण्ड प्रेम रज्जू विबद्धौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nगुच्छायमान तथा प्रिय के द्वारा ग्रंथित (गूंथी हुई) मणिमाला से जिनकी वेणी सुललित हो रही है, और श्रीप्रिया के द्वारा जिनकी चूडा रची गयी है, परस्पर के उदय प्राप्त अखण्ड प्रेम रज्जु से परस्पर विशेषरूप से बन्ध जाने वाले, ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 15\nजघनलुलितवेणी विस्फुरत्वर्हचूडौ\nकनक रुचिरचूडा कंकणद्वन्द्वपाणी।\nविलसदरुणरोचिः पतिकौशेयवासौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजंघों में चञ्चल मनोहर वेणी वाली तथा शोभायमान मयूरपंख की चुडा वाले, सुवर्ण निम्मित रुचिर चूडा तथा दोनों हस्त में कंकण धारण करने वाले, शोभायमान अरुण कान्ति तथा पीत कौशेय वस्त्र धारण कारी श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 16\nकनकजलदगात्रौ नीलशोणाब्जनेत्रौ\nमृगमदरसभालौ मालती कुन्दमालौ।\nतरलतरुणवेशौ नीलपीताम्बरेशौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजो सुवर्ण तथा जलद शरीर वाले हैं और जिनके नील तथा रक्त कमल की तरह नेत्र हैं और जो कपोल देश में मृगमद रस तथा गले में मालती, कुन्द माला धारण करते हैं, जिनका नवीन वेश है, नीलाम्बर तथा पीताम्बर धारी उन श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 17\nललितनवकिशोरौ नव्यलावण्यपुञ्जौ\nसकलरसिक चूडालंकृती मुग्धबेशौ।\nमधुरमधुर मूर्ती विद्युदम्भोदकान्ती\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nअभिनव ललित किशोर वय वाले, नवीन लावण्य की राशि, रसिक समुदाय के शिरोभूषण के अलंकार स्वरूप अर्थात परम रसिक शेखर, सुन्दर वेषधारी, अत्यन्त मधुर मूर्ति वाले, विद्युत् तथा मेघ की कान्ति की तरह कान्तियुक्त अर्थात् कान्त्यामृत तथा रसिकतामृतों की वर्षण से निजापेक्षित भक्त शस्यों के जीवनरूप श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 18\nकिमपि परमशोभामाधुरीरूपचेष्टा\nहसित ललित दृष्टपात्यद्भूतोत्कर्षकाष्ठाम्।\nपरमरसरहस्यावेशतः सन्दधानौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nपरम रस रहस्य में आवेश के कारण जो अत्यन्त शोभा, माधुर्य्य, सौन्दर्य्य, चेष्टा, हास्य, रसमयी भर्त्सना, परिहास, कोपसूचक दृष्टि इत्यादि के द्वारा अद्भुतता की चरम सीमा को धारण करने वाले हैं, उन श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 19\nनिखिलनिगमगूढ़ौ नित्यमन्यान्यगाढ़\nप्रणयभरविवृद्धौ तुङ्गितानङ्ग चेष्टौ\nसुरतरसमदान्वौ न्यस्तजीवौ मिथोऽङ्गे।\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nअत्यन्त प्रेम विषय के कारण निखिल निगम करके गुप्त रूप, नित्य परस्पर निविड प्रीति के आधिक्य वश वृद्धि प्राप्त अर्थात् पुष्ट है, और जो प्राकृत अनंगचेष्टा में शोभायमान, सुरतरस मदान्ध, परस्पर एक दूसरे के लिये जीवन समर्पण करने वाले हैं उन श्रीराधिकाकृष्णचंद्रको निभृत निकुञ्ज में स्मरण कर।\nश्लोक 20\nरमणवदनचन्द्रे दत्तताम्बुलवीटी\nनिजरसनिधिवक्त्रे दत्ततच्चर्व्यभागौ।\nमिथ उरुरसदाङ्ग स्पर्शलोलुभ्यमानौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nपरस्पर-परस्पर के रमणीय वदनचन्द्र में ताम्बूल का वीड़ा अर्पण करने वाले तथा प्रियतम के द्वारा उसका चर्व्वणांश प्रियतमा के मुख में प्रदान करने में व्यग्र और परस्पर अत्यन्त रसद अंग प्रत्यंगों को स्पर्श करने में लोलुप श्रीराधिका कृष्णचन्द्र को निभृतनिकुञ्ज में स्मरण कर।\nश्लोक 21\nअति रसमदवेगान्निस्त्रपाधैर्य्यदृष्टी\nक्रम समुदित तत्तत् सौरताश्चर्य्यनिती।\nवहिरतिरसलीलानुव्रताज्ञामवर्ण्णौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nअत्यन्त रस मत्तता के वेग से जिनकी लज्जा रहित तथा धैर्य्य शून्य दृष्टि है और जिनकी क्रम से सुरतचर्य्या की आश्चर्य्यनीति उदय हो रही है और जिनके लीलागृह के बाहर अत्यन्त रसमयी उनकी लीला के पात्र रूप सखी मन्जरी गण विराजमान होकर उन लीला का वर्णन करते हुए आस्वादन कर रहे हैं, उन श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 22\nरजत भवन रन्ध्रायातसन्मन्दशीता\nनिलविदलिततुङ्गानङ्गसंग्रामखेदौ।\nक्षणसहचररम्यारव्धभूयो विहारौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nमणिमय भवन के गवाक्ष रन्ध्रों में जाने आने वाले सुगन्ध मन्द शीतल पवनों से जिनके अनंग संग्राम के श्रम लुप्त हो रहा है और जो उत्सव परायण सहचरी गणोंके द्वारा उत्सुक हो पुनर्वार विहार सुख आरम्भ कर रहे हैं उन श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 23\nतदति ललित लीला लोल लोलाङ्ग लक्ष्यौ\nसुललित ललितादे र्निर्णिमेषाक्षिरन्ध्रैः।\nहृदयमुपनयन्तौ पूर्ण सौख्याम्बुराशी\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nमधुररस परिकरों की मनोहारिणी अति सुन्दर सुरतलीला में जिनके कटि, नितम्ब, बाहु, मुखादिक सकल अंग चंचलायमान होने के कारण मानों लक्ष संख्या हो रहे हैं और जो सुललित ललितादि सखियों के निमेष रहित नयन द्वारों से हृदय देश में प्राप्त हो रहे हैं तथा जो पूर्ण सौख्य के सागर रूप हैं, ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 24\nप्रणयमयवयस्याः कुञ्जरन्ध्रार्पिताक्षी:\nक्षितितलमनुलब्ध्वानन्दमूर्च्छा पतन्तीः।\nप्रतिरतिविदधानौ चेष्टितैश्चित्रचित्रैः\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nरति के पद-पद में विचित्र से विचित्र चेष्टाओं के द्वारा निकुंज गवाक्ष जाल के छिद्रों में नयन अर्पण करने वाली अथच पृथ्वी में आनन्द मूर्छा को प्राप्त होने वाली प्रेममयी सखियों को हृदय में धारण करने वाले, श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 25\nबहुविधपरिमृष्टान्योन्यगात्रावजस्त्र\nबहुविध परिपृच्छा कारितान्यान्यवाचौ।\nअनिमिषनयनालि स्वादितान्यान्यवक्त्रौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nनिरन्तर पारस्परिक हस्त कमल के द्वारा अंग समूह मार्जन करने वाले तथा अनेक प्रकार की जिज्ञासाओं के द्वारा अनेक प्रकार की वचन रचना सृष्टि करने वाले, निमेष रहित नयन रूप सखियों के द्वारा पारस्परिक मुख कमल आस्वादनकारी श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 26\nमनसिजरससिन्धोरद्भुतावर्त्तवेग\nभ्रमिततनुमनस्कौ केलिविस्मापिताली।\nबहुविधरसगात्रस्पर्शजल्पप्रहासौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजिनके शरीर और मन कन्दर्परस - सागर के अद्भुत आवर्त्तन ( घूर्णन ) के वेग से चलायमान हैं और जो क्रीड़ा समूह से सखीवृन्दों को विस्मय करने वाले हैं तथा जो परस्पर अनेक प्रकार के रसमय शरीर का स्पर्श और हास्य वचन युक्त हैं उन श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 27\nवहुलसुरतखेलायाससंखिन्नगात्रौ\nदयितनिजसखिभि र्वीज्यमानौ पटान्तैः।\nसरसभुजगवल्ली पल्लवास्वादिवक्त्रौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजिनके शरीर अनेक प्रकार की सुरतक्रीड़ा के परिश्रम से खेद प्राप्त हो रहा है तथा जो निज प्रिय सखियों के द्वारा पटाञ्चल से वीज्यमान हैं और जिनके मुख कमल सरस ताम्बूल पल्लव के आस्वादन से शोभायमान है, ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 28\nमिथ उरुपुलकश्री दोर्ल्लताबद्धकण्ठौ\nव्यतिमिलितमुखेन्दू किंकणी लालितांघ्री।\nनवरतिरसखेला श्रान्तितन्द्रालुनेत्रौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nविपुल पुलकावलि से परस्पर शोभायमान, जिनके गल-देश परस्पर की भुजलताओं से वेष्टित है और परस्पर के मुख कमल में परस्पर मुख मिलाने वाले, तथा जिनके चरण कमल किंकिणी से शोभायमान है और जो नवीन रतिरस क्रीड़ा से श्रान्ति प्राप्त हैं अर्थात् जिनके नेत्र कमल निद्रारस से व्याकुल हैं ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 29\nसुरतरससमुद्रे पादमाचूडमग्नौ\nत्रुटिलवमिव यातां मन्यमानौ त्रियामाम्।\nप्रतिनिमिषमसीमोजृम्भितानङ्गतृष्णौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nसुरत रस सागर में आपाद मस्तक (चरण से लेकर मस्तक पर्यन्त) मग्न शील, त्रुटि लव काल को भी एक रात्रि मानने वाले, तथा जिनके निमेष-निमेष में असीम अनंग तृष्णा उठती है ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 30\nतदतिमधुरधाम्नि नाम्नि वात्सल्यमात्रात्\nकथमपि कलनीयौ कस्यचिद्भाग्यसीम्नः।\nश्रूतिततिभिरगम्यौ सत्सभाजस्रसङ्गौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nनाम धाम के वात्सल्य मात्र अर्थात् अति अल्पमात्र यत् किंचित् नाम धाम के अनुशीलन से सीमा प्राप्त सौभाग्य क्षेत्र शील किसी व्यक्ति का हेला व श्रद्धा से भी ग्रहण रूप, वेद समूह से अगम्य, निखिल सज्जनों द्वारा वन्दनीय, केवल सखी मञ्जरियों की सभा में संप्राप्त श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 31\nपरमरसग्हस्य नन्दनिस्यन्दिवृन्दा\nवनविपिननिकुञ्जे दिव्यदिव्यै र्विलासैः।\nनिरवधिरसमानौ राधिका कृष्णचन्द्रौ\nभज सकलमुपेक्ष्य तावकी शास्त्रयुक्ती॥\nरे मन ! देह, गेह, शास्त्रयुक्ति, प्रभृति का पूर्णतः उपेक्षा करके परमरस रहस्य आनन्द के सागर रूप वृन्दावन के निकुंज में दिव्यातिदिव्य विलासों से निरन्तर शोभायमान श्रीराधिका कृष्णचन्द्र का भजन कर।\nश्लोक 32\nस्तवमिममतिरम्यं राधिकाकृष्णचन्द्र\nप्रमदभरविलासैरद्भूतं भावयुक्तः।\nपठति य इह रात्रौ नित्यमव्यग्रचित्तः\nविमलमतिसु राधालीसु सख्यं लभेत॥\nजो भावयुक्त होकर रात्रिकाल में स्थिरचित्त से राधिका कृष्ण चंद्र के प्रमोद भरे विलासों से अद्भुत मनोहर इस स्तव का पाठ करे वह विमल मतिवाली राधिका की सखियों में सख्य रूप को प्राप्त होता है अर्थात् सखी रूप होकर युगल सरकार की सेवा को प्राप्त करता है।\nइति श्रीमद् रूप गोस्वामिना विरचितः\nश्रीनिकुञ्जरहस्यस्तवः समाप्तः"])</script><script>self.__next_f.push([1,"e:T8969,"])</script><script>self.__next_f.push([1,"श्लोक 1\nनव ललितवयस्कौ नव्यलावण्यपुञ्जौ\nनव रस चलचित्तौ नूतनप्रेमवित्तौ।\nनव निधुवनलीला कौतुकेनातिलोलौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nरे मन! तू परम मनोहर कैशोर वयस वाले और मुक्ता फल की छाया की तरह नव-लावण्य के राशि रूप तथा नवायमान श्रृंगाररस में चञ्चल चित्त वाले तथा जिनके नवीन प्रेम ही परम धन है और निधुवन की लीला कौतुक में अत्यन्त चञ्चल श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 2\nद्रुतकनक- सुगौरस्निग्धमेघौघनील\nच्छविभिरखिलबृन्दारण्यमुद्भाषयन्तौ।\nमृदुलनवदुकूले नीलपीते दधानौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nहे मन ! द्रवायमान सुवर्ण तथा सघन मेघ समूह की भाँति गौर नील कान्तियों से समग्र वृन्दाबन को भासमान करने वाले, नवीन मृदुल नील पीत पाटम्बर धारीणि, श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 3\nप्रथममिलनभीतोद्भाषिताश्वासवाचौ\nप्रियतम - भुजरोधव्यग्रहस्तौ रतोत्कौ।\nअलमलमितिलीला गद्गदोक्त्युन्मदान्धौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nनव संगम में भीत तथा कोमल आश्वासना देने वाले, भुज प्रसारण तथा भुज रोध में व्यग्र हस्त वाले, क्रीडा में उत्कण्ठित, \"छोड़िये छोड़िये मत जाइये, मत जाइये\" इस प्रकार गद्गद् बोलने वाले, आनन्दमत्त श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 4\nप्रियरतिसमनुज्ञामार्गनानम्रवक्वो\nन्नमितचिवुकदृष्ट्या स्मेरकान्ताननाब्जौ।\nकिमिह कुरुष इत्यास्वाद्यवाक्किञ्चनोक्ती\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nप्रिय के रति प्रयोग में अनुमति जान कर नम्रवदना तथा चिबुक उठा कर उसमें दृष्टि के द्वारा ईषत् हास्य युक्त मनोहर बदन कमल वाले और \"सखी मण्डल के बीच यह क्या करते हैं\" इस प्रकार आस्वाद योग्य वचन समूह को बोलने वाली, तथा रहस्य प्रकाशक मन्द मन्द बोलने वाले श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 5\nप्रतिपद प्रतिकूलानुग्रहव्यग्रमूर्त्ती\nबहु विरचित नाना चाटुकारप्रकारौ।\nनवसुरत -विलासोत्सुक्यगूढ़प्रकाशौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nपद-पद में प्रिया के द्वारा हठ करने के कारण तथा प्रिय के द्वारा आग्रह करने के कारण चंचल मूर्ति वाले, नाना प्रकार के चाटु वचन व्यवहारकारी, नव नव सुरत प्रयोग के विलास में उत्कण्ठित होकर प्रिया के द्वारा गोपन तथा प्रिय के द्वारा प्रकाश करने वाले श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 6\nसुरतकलह सौख्यैः काकुवादप्रणामा-\nधिकविरचितमान्यौ दुर्गमप्रेमभंगौ।\nस्मितमधुरमृदूपालम्भह्रन्नीतकान्तौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nसुरत कलह सुख में काकुवाद और प्रणाम के द्वारा अधिक गौरव बढ़ाने वाले, जिनके प्रेम सागर की तरङ्ग दुर्बोध है, उन मन्दहास्य के साथ कोमल तिरस्कारादि करने में व्यग्र हृदय श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 7\nनव किशलयतल्पे कल्पयन्तौ विचित्रां\nसुरतसमरलीलामुन्मदानंगरङ्गौ।\nललित वलय काञ्ची नूपूरध्वानरम्यौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nनवीन किसलय निर्मित शय्या में विचित्र सुरत युद्ध बढ़ाने वाले, उद्गत अनङ्ग रङ्ग में मत्तता जिनके, ललित वलय, किंकिणी, नूपुर ध्वनियों से मनोहर श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 8\nप्रियकरपरिमर्दोजृम्भमानोरुवक्षो-\nरुहमनसिजकण्डूद्दण्डकन्दर्पलोलौ।\nनमित दयितपाणि स्पृष्टनीवीनिवन्धौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nश्रीकृष्ण के हस्त द्वारा बारम्बार संघर्ष से उठा है स्तन कमलों में कामकण्डू जिनकी तथा उद्दण्डता कन्दर्प केलि के कारण चंचल हृदय जिनके ऐसे दोनों, नीविबन्धन स्पर्श करने में वा कराने में जिनसे प्रिय के हस्तकमल स्थापित हुए हैं ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 9\nप्रियतम-कृत-गाढ़ाश्लेषखर्व्वायितोरु\nस्तनमुकुल मनोज्ञावल्लभैकात्मतेच्छुः।\nकिमपि रचित शुष्कक्रन्दितोदारहासौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nप्रियतम के गाढ़ आलिंगन से खर्व्वित स्तन मुकुल के द्वारा मनोहारिणी, प्रियतमा के साथ एकात्मता भाव को चाहने वाले, शुष्क रोदन करने वाली तथा उदार हास्ययुक्त श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 10\nसततसुरततृष्णाव्याकुलाबुन्मदिष्णू\nविपुलपुलकराजद्गौरनीलोज्वलाङ्गौ।\nमिथ उरुपरिरम्भादेकदेहायमानौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nनिरन्तर सुरत रस तृष्णा में व्याकुल, उन्मत्त, विपुल पुलकावलि से शोभायमान गौर नील उज्वल शरीर वाले और परस्पर के निविड़ आलिंगन से मानो एक देह रूप, श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 11\nसततमपरिमानोज्जृम्भमानानुरागौ\nमदरसभरसिन्धू लोलदोलायिताङ्गौ।\nदलितसक्लसेतू धन्यगोप्येकरम्यौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nजिनके निरन्तर उच्छलित असीम अनुराग गर्व रसाधिक्य के सागर के समान, चंचल दोलायमान अङ्ग हैं और जिनके नाश हो रहा है धैर्य्य दैन्यादिक भाव समूह अथवा लोकवेद से अतीत, सुकृत स्वरूपा गोपियों से मनोहर श्री राधिका कृष्ण चन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 12\nविलुलितवरबेणी - हारमालावतंसौ\nमृदुलमधुरहासोल्लासिवक्त्रेन्दुविम्बौ।\nअतिरस मदलोलौ चित्रकन्दर्पकेली\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nजिनकी श्रेष्ठ वेणियाँ, हार, माल्य, भूषणादिक विदलायमान हो गये हैं और मन्द मधुर हास्य से जिनका मुख चन्द्रविम्ब उल्लसित है तथा जिनकी अतिशय सुरत गर्व से चपल, विस्मापनी कन्दर्पसम्बन्धिनी क्रीडा है ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 13\nसुरतरसमदान्धौ सन्ततं सन्तरन्तौ\nत्रुटित वलय काञ्ची दाम हारावलिकौ।\nमणिकनक विभूषोत्सारभास्वत्पराङ्गौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nसुरतरस के गर्व सागर में निरन्तर तहरने वाले, जिनके वलय, किंकिणी, पुष्पों की मालायें हार समूह टूट गये हैं, मणि कनक भूषणादिक अस्त व्यस्त हो जाने से जिनके उत्तम अंग प्रत्यंग शोभायमान हो रहे हैं, ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्च में स्मरण कर।\nश्लोक 14\nस्तवकित मणिदाम्ना प्रेयसागुम्फितात्य-\nद्भुत सुललितवेणी प्रेयसीक्लृप्तचूडौ।\nमिथ उदयदखण्ड प्रेम रज्जू विबद्धौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nगुच्छायमान तथा प्रिय के द्वारा ग्रंथित (गूंथी हुई) मणिमाला से जिनकी वेणी सुललित हो रही है, और श्रीप्रिया के द्वारा जिनकी चूडा रची गयी है, परस्पर के उदय प्राप्त अखण्ड प्रेम रज्जु से परस्पर विशेषरूप से बन्ध जाने वाले, ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 15\nजघनलुलितवेणी विस्फुरत्वर्हचूडौ\nकनक रुचिरचूडा कंकणद्वन्द्वपाणी।\nविलसदरुणरोचिः पतिकौशेयवासौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजंघों में चञ्चल मनोहर वेणी वाली तथा शोभायमान मयूरपंख की चुडा वाले, सुवर्ण निम्मित रुचिर चूडा तथा दोनों हस्त में कंकण धारण करने वाले, शोभायमान अरुण कान्ति तथा पीत कौशेय वस्त्र धारण कारी श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 16\nकनकजलदगात्रौ नीलशोणाब्जनेत्रौ\nमृगमदरसभालौ मालती कुन्दमालौ।\nतरलतरुणवेशौ नीलपीताम्बरेशौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजो सुवर्ण तथा जलद शरीर वाले हैं और जिनके नील तथा रक्त कमल की तरह नेत्र हैं और जो कपोल देश में मृगमद रस तथा गले में मालती, कुन्द माला धारण करते हैं, जिनका नवीन वेश है, नीलाम्बर तथा पीताम्बर धारी उन श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 17\nललितनवकिशोरौ नव्यलावण्यपुञ्जौ\nसकलरसिक चूडालंकृती मुग्धबेशौ।\nमधुरमधुर मूर्ती विद्युदम्भोदकान्ती\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nअभिनव ललित किशोर वय वाले, नवीन लावण्य की राशि, रसिक समुदाय के शिरोभूषण के अलंकार स्वरूप अर्थात परम रसिक शेखर, सुन्दर वेषधारी, अत्यन्त मधुर मूर्ति वाले, विद्युत् तथा मेघ की कान्ति की तरह कान्तियुक्त अर्थात् कान्त्यामृत तथा रसिकतामृतों की वर्षण से निजापेक्षित भक्त शस्यों के जीवनरूप श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 18\nकिमपि परमशोभामाधुरीरूपचेष्टा\nहसित ललित दृष्टपात्यद्भूतोत्कर्षकाष्ठाम्।\nपरमरसरहस्यावेशतः सन्दधानौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nपरम रस रहस्य में आवेश के कारण जो अत्यन्त शोभा, माधुर्य्य, सौन्दर्य्य, चेष्टा, हास्य, रसमयी भर्त्सना, परिहास, कोपसूचक दृष्टि इत्यादि के द्वारा अद्भुतता की चरम सीमा को धारण करने वाले हैं, उन श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 19\nनिखिलनिगमगूढ़ौ नित्यमन्यान्यगाढ़\nप्रणयभरविवृद्धौ तुङ्गितानङ्ग चेष्टौ\nसुरतरसमदान्वौ न्यस्तजीवौ मिथोऽङ्गे।\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nअत्यन्त प्रेम विषय के कारण निखिल निगम करके गुप्त रूप, नित्य परस्पर निविड प्रीति के आधिक्य वश वृद्धि प्राप्त अर्थात् पुष्ट है, और जो प्राकृत अनंगचेष्टा में शोभायमान, सुरतरस मदान्ध, परस्पर एक दूसरे के लिये जीवन समर्पण करने वाले हैं उन श्रीराधिकाकृष्णचंद्रको निभृत निकुञ्ज में स्मरण कर।\nश्लोक 20\nरमणवदनचन्द्रे दत्तताम्बुलवीटी\nनिजरसनिधिवक्त्रे दत्ततच्चर्व्यभागौ।\nमिथ उरुरसदाङ्ग स्पर्शलोलुभ्यमानौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nपरस्पर-परस्पर के रमणीय वदनचन्द्र में ताम्बूल का वीड़ा अर्पण करने वाले तथा प्रियतम के द्वारा उसका चर्व्वणांश प्रियतमा के मुख में प्रदान करने में व्यग्र और परस्पर अत्यन्त रसद अंग प्रत्यंगों को स्पर्श करने में लोलुप श्रीराधिका कृष्णचन्द्र को निभृतनिकुञ्ज में स्मरण कर।\nश्लोक 21\nअति रसमदवेगान्निस्त्रपाधैर्य्यदृष्टी\nक्रम समुदित तत्तत् सौरताश्चर्य्यनिती।\nवहिरतिरसलीलानुव्रताज्ञामवर्ण्णौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nअत्यन्त रस मत्तता के वेग से जिनकी लज्जा रहित तथा धैर्य्य शून्य दृष्टि है और जिनकी क्रम से सुरतचर्य्या की आश्चर्य्यनीति उदय हो रही है और जिनके लीलागृह के बाहर अत्यन्त रसमयी उनकी लीला के पात्र रूप सखी मन्जरी गण विराजमान होकर उन लीला का वर्णन करते हुए आस्वादन कर रहे हैं, उन श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 22\nरजत भवन रन्ध्रायातसन्मन्दशीता\nनिलविदलिततुङ्गानङ्गसंग्रामखेदौ।\nक्षणसहचररम्यारव्धभूयो विहारौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nमणिमय भवन के गवाक्ष रन्ध्रों में जाने आने वाले सुगन्ध मन्द शीतल पवनों से जिनके अनंग संग्राम के श्रम लुप्त हो रहा है और जो उत्सव परायण सहचरी गणोंके द्वारा उत्सुक हो पुनर्वार विहार सुख आरम्भ कर रहे हैं उन श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 23\nतदति ललित लीला लोल लोलाङ्ग लक्ष्यौ\nसुललित ललितादे र्निर्णिमेषाक्षिरन्ध्रैः।\nहृदयमुपनयन्तौ पूर्ण सौख्याम्बुराशी\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nमधुररस परिकरों की मनोहारिणी अति सुन्दर सुरतलीला में जिनके कटि, नितम्ब, बाहु, मुखादिक सकल अंग चंचलायमान होने के कारण मानों लक्ष संख्या हो रहे हैं और जो सुललित ललितादि सखियों के निमेष रहित नयन द्वारों से हृदय देश में प्राप्त हो रहे हैं तथा जो पूर्ण सौख्य के सागर रूप हैं, ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 24\nप्रणयमयवयस्याः कुञ्जरन्ध्रार्पिताक्षी:\nक्षितितलमनुलब्ध्वानन्दमूर्च्छा पतन्तीः।\nप्रतिरतिविदधानौ चेष्टितैश्चित्रचित्रैः\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nरति के पद-पद में विचित्र से विचित्र चेष्टाओं के द्वारा निकुंज गवाक्ष जाल के छिद्रों में नयन अर्पण करने वाली अथच पृथ्वी में आनन्द मूर्छा को प्राप्त होने वाली प्रेममयी सखियों को हृदय में धारण करने वाले, श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 25\nबहुविधपरिमृष्टान्योन्यगात्रावजस्त्र\nबहुविध परिपृच्छा कारितान्यान्यवाचौ।\nअनिमिषनयनालि स्वादितान्यान्यवक्त्रौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nनिरन्तर पारस्परिक हस्त कमल के द्वारा अंग समूह मार्जन करने वाले तथा अनेक प्रकार की जिज्ञासाओं के द्वारा अनेक प्रकार की वचन रचना सृष्टि करने वाले, निमेष रहित नयन रूप सखियों के द्वारा पारस्परिक मुख कमल आस्वादनकारी श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 26\nमनसिजरससिन्धोरद्भुतावर्त्तवेग\nभ्रमिततनुमनस्कौ केलिविस्मापिताली।\nबहुविधरसगात्रस्पर्शजल्पप्रहासौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजिनके शरीर और मन कन्दर्परस - सागर के अद्भुत आवर्त्तन ( घूर्णन ) के वेग से चलायमान हैं और जो क्रीड़ा समूह से सखीवृन्दों को विस्मय करने वाले हैं तथा जो परस्पर अनेक प्रकार के रसमय शरीर का स्पर्श और हास्य वचन युक्त हैं उन श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 27\nवहुलसुरतखेलायाससंखिन्नगात्रौ\nदयितनिजसखिभि र्वीज्यमानौ पटान्तैः।\nसरसभुजगवल्ली पल्लवास्वादिवक्त्रौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजिनके शरीर अनेक प्रकार की सुरतक्रीड़ा के परिश्रम से खेद प्राप्त हो रहा है तथा जो निज प्रिय सखियों के द्वारा पटाञ्चल से वीज्यमान हैं और जिनके मुख कमल सरस ताम्बूल पल्लव के आस्वादन से शोभायमान है, ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 28\nमिथ उरुपुलकश्री दोर्ल्लताबद्धकण्ठौ\nव्यतिमिलितमुखेन्दू किंकणी लालितांघ्री।\nनवरतिरसखेला श्रान्तितन्द्रालुनेत्रौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nविपुल पुलकावलि से परस्पर शोभायमान, जिनके गल-देश परस्पर की भुजलताओं से वेष्टित है और परस्पर के मुख कमल में परस्पर मुख मिलाने वाले, तथा जिनके चरण कमल किंकिणी से शोभायमान है और जो नवीन रतिरस क्रीड़ा से श्रान्ति प्राप्त हैं अर्थात् जिनके नेत्र कमल निद्रारस से व्याकुल हैं ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 29\nसुरतरससमुद्रे पादमाचूडमग्नौ\nत्रुटिलवमिव यातां मन्यमानौ त्रियामाम्।\nप्रतिनिमिषमसीमोजृम्भितानङ्गतृष्णौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nसुरत रस सागर में आपाद मस्तक (चरण से लेकर मस्तक पर्यन्त) मग्न शील, त्रुटि लव काल को भी एक रात्रि मानने वाले, तथा जिनके निमेष-निमेष में असीम अनंग तृष्णा उठती है ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 30\nतदतिमधुरधाम्नि नाम्नि वात्सल्यमात्रात्\nकथमपि कलनीयौ कस्यचिद्भाग्यसीम्नः।\nश्रूतिततिभिरगम्यौ सत्सभाजस्रसङ्गौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nनाम धाम के वात्सल्य मात्र अर्थात् अति अल्पमात्र यत् किंचित् नाम धाम के अनुशीलन से सीमा प्राप्त सौभाग्य क्षेत्र शील किसी व्यक्ति का हेला व श्रद्धा से भी ग्रहण रूप, वेद समूह से अगम्य, निखिल सज्जनों द्वारा वन्दनीय, केवल सखी मञ्जरियों की सभा में संप्राप्त श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 31\nपरमरसग्हस्य नन्दनिस्यन्दिवृन्दा\nवनविपिननिकुञ्जे दिव्यदिव्यै र्विलासैः।\nनिरवधिरसमानौ राधिका कृष्णचन्द्रौ\nभज सकलमुपेक्ष्य तावकी शास्त्रयुक्ती॥\nरे मन ! देह, गेह, शास्त्रयुक्ति, प्रभृति का पूर्णतः उपेक्षा करके परमरस रहस्य आनन्द के सागर रूप वृन्दावन के निकुंज में दिव्यातिदिव्य विलासों से निरन्तर शोभायमान श्रीराधिका कृष्णचन्द्र का भजन कर।\nश्लोक 32\nस्तवमिममतिरम्यं राधिकाकृष्णचन्द्र\nप्रमदभरविलासैरद्भूतं भावयुक्तः।\nपठति य इह रात्रौ नित्यमव्यग्रचित्तः\nविमलमतिसु राधालीसु सख्यं लभेत॥\nजो भावयुक्त होकर रात्रिकाल में स्थिरचित्त से राधिका कृष्ण चंद्र के प्रमोद भरे विलासों से अद्भुत मनोहर इस स्तव का पाठ करे वह विमल मतिवाली राधिका की सखियों में सख्य रूप को प्राप्त होता है अर्थात् सखी रूप होकर युगल सरकार की सेवा को प्राप्त करता है।\nइति श्रीमद् रूप गोस्वामिना विरचितः\nश्रीनिकुञ्जरहस्यस्तवः समाप्तः"])</script><script>self.__next_f.push([1,"f:T6120,"])</script><script>self.__next_f.push([1,"Text 1\nnava-lalita-vayaskau nutna-lavanya-punjau\nnava-rasa-cala-cittau nutana-prema-vittau\nnava-nidhuvana-lila-kautukenati-lolau\nsmara nibhrta-nikunje radhika-krishnacandrau\nnava-new; lalita-charming and playful; vayaskau-youth; nutna-new; lavanya-beauty; punjau-abundance; nava-new; rasa-nectar; cala-restless; cittau-hearts; nutana-new; prema-love; vittau-wealth; nava-new; nidhuvana-amorous; lila-pastimes; kautukena-with eagerness; ati-very; lolau-restless; smara-please remember; nibhrta-secluded; nikunje-in a forest grove; radhika-krishnacandrau-Shri Shri Radhika`-Krishnacandra.\nPlease meditate on Shri Shri Radhika`-Krishnacandra, who are charming, playful, and youthful, who are filled with ever-new beauty and handsomeness, whose hearts are restless with ever-fresh nectar, who are filled with ever-new love, and who are overcome with bliss as They enjoy ever-new amorous pastimes in a secluded forest grove.\nText 2\ndhrta-kanaka-su-gaura-snigdha-meghaugha-nila-\ncchavibhir akhila-vrndaranyam udbhasayantau\nmrdula-nava-dukule nila-pite dadhanau\nsmara nibhrta-nikunje radhika-krishnacandrau\ndhrta-held; kanaka-gold; su-very; gaura-fair; snigdha-glistening; megha-of clouds; augha-a host; nila-dark; cchavibhih-with splendor; akhila-all; vrndaranyam-Vrndavana forest; udbhasayantau-illuminating; mrdula-fine; nava-new; dukule-silk garments; nila-blue; pite-and yellow; dadhanau-wearing.\nPlease meditate on Shri Shri Radhika`-Krishnacandra, who, fair like molten gold and dark like a host of glistening monsoon clouds, illuminate the entire forest of Vrndavana, and who wear blue and yellow new, fine, and soft silk garments in a secluded forest grove.\nText 3\nprathama-milana-bhitodbhasitasvasa-vacau\npriyatama-bhuja-rodha-vyagra-hastau ratotkau\nalam alam iti lila-gadgadokty-unmadandhau\nsmara nib te on Shri Shri Radhika`-Krishnacandra. Tossed by the waves in the wonderful whirlpool of Kamadeva's nectar ocean, Their hearts and limbs are now exhausted. In many ways They talk, laugh, and touch each other's limbs. Their pastimes fill the gopis with wonder in a secluded forest grove.\nText 27\nbahula-surata-khelayasa-sankhinna-gatrau\ndayita-nija-sakhibhir vijyamanau patantaih\nsarasa-bhujaga-valli-pallavam-vadi-vaktrau\nsmara nibhrta-nikunje radhika-krishnacandrau\nbahula-many; surata-amorous; khela-by pastimes; ayasa-by fatigue; sankhinna-distressed; gatrau-limbs; dayita-beloved; nija-own; sakhibhih-with friends; vijyamanau-fanned; patantaih-falling; sarasa-nectarean; bhujaga-bhujaga; valli-vines; pallavam-blossoms; vadi-speaking; vaktrau-mouths.\nPlease meditate on Shri Shri Radhika`-Krishnacandra. Their limbs, exhausted from many amorous pastimes, are fanned by Their dear gopi friends. The sweet bhujana vines of Their lips blossom with flowers of the word \"Yes\" in a secluded forest grove.\nText 28\nmitha-uru-pulaka-shri-dor-lata-baddha-kanthau\nvyati-milita-mukhendu kinkini-lalitanghri\nnava-rati-rasa-khela-sranti-tandralu-netrau\nsmara nibhrta-nikunje radhika-krishnacandrau\nmitha-of each other; uru-great; pulaka-hairs standing up; shri-handsome; doh-of arms; lata-vines; baddha-bound; kanthau-necks; vyatimilita-intimately meeting; mukha-face; indu-moons; kinkini-anklets; lalita-charming; anghri-feet; nava-new; rati-amorous; rasa-nectar; khela-pastimes; sranti-fatigue; tandralu-sleepy; netrau-eyes.\nPlease meditate on Shri Shri Radhika`-Krishnacandra. The hairs of Their bodies erect, the flowering vines of Their arms entwined around each other's neck, the moons of Their faces touching, and the anklets on their graceful feet playfully tinkling, exhausted from drinking the nectar of ever-new amorous pastimes, They close Their eyes in sleep in a secluded forest grove.\nText 29\nsurata-rasa-samudre padam a-cuda-magnau\ntruti-lavam iva yatam- manyamanau tri-yamam\npratinimisam asimojjrmbhitananga-trsnau\nsmara nibhrta-nikunje radhika-krishnacandrau\nsurata-of amorous pastimes; rasa-of nectar; samudre-oceans; padam-foot; a-up to; cuda-the top of the head; magnau-plunged; truti-lavam-a fraction of a second; iva-like; yatam-passed; manyamanau-considering; tri-yamam-the nine hours; pratinimisam-at every moment; asima-limitless; ujjrmbhita-expanding; ananga-amorous; trsnau-thirst.\nPlease meditate on Shri Shri Radhika`-Krishnacandra who, plunged from head to foot in the nectar ocean of transcendental amorous love, and thinking that the nine hours of night pass as swiftly as a moment, at every moment thirst to taste limitless amorous pastimes in a secluded forest grove.\nText 30\ntad-ati-madhura-dhamni namni vatsalya-matrat\nkatham api kalaniyau kasyacid bhama-simni\nsruti-tatibhir agamyau sat-sabhajasra-sangau\nsmara nibhrta-nikunje radhika-krishnacandrau\ntat-of Them; ati-very; madhura-sweet; dhamni-splendor; namni-names; vatsalya-by love; matrat-alone; katham api-something; kalaniyau-may be understood; kasyacit-by someone; bhama-of splendor; simni-the limit; sruti-tatibhih-by the Vedas\nagamyau-unapproachable; sat-of the saintly; sabha-in the assembly; ajasra-eternal; sangau-association.\nPlease meditate on Shri Shri Radhika`-Krishnacandra, who stay in a secluded forest grove. They are two abodes of sweetness. They stay at the apeo of all splendor. Only a person filled with love can see that They are both present in Their holy names. The Vedas cannot approach Them. They always stay with Their saintly devotees.\nText 31\nparama-rasa-rahasyananda-nihsyandi-vrnda-\nvana-vipina-nikunje divya-divyair vilasaih\nniravadhi rasamanau radhika-krishnacandrau;\nbhaja sakalam upeksya tavakah sastra-yuktih\nparama-supreme; rasa-nectar; rahasya-confidential; ananda-bliss; nihsyandi-flowing; vrnda-abundance; vana-vipina-forest; nikunje-in the grove; divya-divyaih-transcendental; vilasaih-with pastimes; niravadhi-limitless; rasamanau-tasting; radhika-krishnacandrau-Radhika`-Krishnacandra; bhaja-please worship; sakalam-everything; upeksya-ignoring; tavakah-of you; sastra-of books; yuktih-logic.\nPlease ignore the arguments of any opposing books and worship Shri Shri Radhika`-Krishnacandra, who enjoy limitless transcendental pastimes in the forest groves of Vrndavana, groves filled with the flowing nectar of the transcendental bliss of Their sweet and secret pastimes.\nText 32\nstavam imam ati-ramyam- radhika-krishnacandra-\npramada-bhara-vilasair adbhutam- bhava-yuktah\npathati ya iha ratrau nityam avyagra-citto\nvimala-matisu radhalisu sakhyam- labheta\nstavam-prayer; imam-this; ati-ramyam-very beautiful; radhika-krishnacandra-of Shri Shri Radhika`-Krishnacandra; pramada-bliss; bhara-abundance; vilasaih-with pastimes; adbhutam-wonderful; bhava-yuktah-with love; pathati-reads; ya-one who; iha-here; ratrau-at night; nityam-regularly; avyagra-fixed; cittah-attention; vimala-pure; matisu-in hearts; radha-of Shri Radha; alisu-among the friends; sakhyam-friendship; labheta-obtains.\nMay a person who every evening lovingly and attentively reads these prayers wonderful and beautiful with Shri Shri Radhika`-Krishnacandra's blissful pastimes, attain the friendship of Shri Radha's pure-hearted friends."])</script><script>self.__next_f.push([1,"10:T8969,"])</script><script>self.__next_f.push([1,"श्लोक 1\nनव ललितवयस्कौ नव्यलावण्यपुञ्जौ\nनव रस चलचित्तौ नूतनप्रेमवित्तौ।\nनव निधुवनलीला कौतुकेनातिलोलौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nरे मन! तू परम मनोहर कैशोर वयस वाले और मुक्ता फल की छाया की तरह नव-लावण्य के राशि रूप तथा नवायमान श्रृंगाररस में चञ्चल चित्त वाले तथा जिनके नवीन प्रेम ही परम धन है और निधुवन की लीला कौतुक में अत्यन्त चञ्चल श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 2\nद्रुतकनक- सुगौरस्निग्धमेघौघनील\nच्छविभिरखिलबृन्दारण्यमुद्भाषयन्तौ।\nमृदुलनवदुकूले नीलपीते दधानौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nहे मन ! द्रवायमान सुवर्ण तथा सघन मेघ समूह की भाँति गौर नील कान्तियों से समग्र वृन्दाबन को भासमान करने वाले, नवीन मृदुल नील पीत पाटम्बर धारीणि, श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 3\nप्रथममिलनभीतोद्भाषिताश्वासवाचौ\nप्रियतम - भुजरोधव्यग्रहस्तौ रतोत्कौ।\nअलमलमितिलीला गद्गदोक्त्युन्मदान्धौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nनव संगम में भीत तथा कोमल आश्वासना देने वाले, भुज प्रसारण तथा भुज रोध में व्यग्र हस्त वाले, क्रीडा में उत्कण्ठित, \"छोड़िये छोड़िये मत जाइये, मत जाइये\" इस प्रकार गद्गद् बोलने वाले, आनन्दमत्त श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 4\nप्रियरतिसमनुज्ञामार्गनानम्रवक्वो\nन्नमितचिवुकदृष्ट्या स्मेरकान्ताननाब्जौ।\nकिमिह कुरुष इत्यास्वाद्यवाक्किञ्चनोक्ती\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nप्रिय के रति प्रयोग में अनुमति जान कर नम्रवदना तथा चिबुक उठा कर उसमें दृष्टि के द्वारा ईषत् हास्य युक्त मनोहर बदन कमल वाले और \"सखी मण्डल के बीच यह क्या करते हैं\" इस प्रकार आस्वाद योग्य वचन समूह को बोलने वाली, तथा रहस्य प्रकाशक मन्द मन्द बोलने वाले श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 5\nप्रतिपद प्रतिकूलानुग्रहव्यग्रमूर्त्ती\nबहु विरचित नाना चाटुकारप्रकारौ।\nनवसुरत -विलासोत्सुक्यगूढ़प्रकाशौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nपद-पद में प्रिया के द्वारा हठ करने के कारण तथा प्रिय के द्वारा आग्रह करने के कारण चंचल मूर्ति वाले, नाना प्रकार के चाटु वचन व्यवहारकारी, नव नव सुरत प्रयोग के विलास में उत्कण्ठित होकर प्रिया के द्वारा गोपन तथा प्रिय के द्वारा प्रकाश करने वाले श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 6\nसुरतकलह सौख्यैः काकुवादप्रणामा-\nधिकविरचितमान्यौ दुर्गमप्रेमभंगौ।\nस्मितमधुरमृदूपालम्भह्रन्नीतकान्तौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nसुरत कलह सुख में काकुवाद और प्रणाम के द्वारा अधिक गौरव बढ़ाने वाले, जिनके प्रेम सागर की तरङ्ग दुर्बोध है, उन मन्दहास्य के साथ कोमल तिरस्कारादि करने में व्यग्र हृदय श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 7\nनव किशलयतल्पे कल्पयन्तौ विचित्रां\nसुरतसमरलीलामुन्मदानंगरङ्गौ।\nललित वलय काञ्ची नूपूरध्वानरम्यौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nनवीन किसलय निर्मित शय्या में विचित्र सुरत युद्ध बढ़ाने वाले, उद्गत अनङ्ग रङ्ग में मत्तता जिनके, ललित वलय, किंकिणी, नूपुर ध्वनियों से मनोहर श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में तू स्मरण कर।\nश्लोक 8\nप्रियकरपरिमर्दोजृम्भमानोरुवक्षो-\nरुहमनसिजकण्डूद्दण्डकन्दर्पलोलौ।\nनमित दयितपाणि स्पृष्टनीवीनिवन्धौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nश्रीकृष्ण के हस्त द्वारा बारम्बार संघर्ष से उठा है स्तन कमलों में कामकण्डू जिनकी तथा उद्दण्डता कन्दर्प केलि के कारण चंचल हृदय जिनके ऐसे दोनों, नीविबन्धन स्पर्श करने में वा कराने में जिनसे प्रिय के हस्तकमल स्थापित हुए हैं ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 9\nप्रियतम-कृत-गाढ़ाश्लेषखर्व्वायितोरु\nस्तनमुकुल मनोज्ञावल्लभैकात्मतेच्छुः।\nकिमपि रचित शुष्कक्रन्दितोदारहासौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nप्रियतम के गाढ़ आलिंगन से खर्व्वित स्तन मुकुल के द्वारा मनोहारिणी, प्रियतमा के साथ एकात्मता भाव को चाहने वाले, शुष्क रोदन करने वाली तथा उदार हास्ययुक्त श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 10\nसततसुरततृष्णाव्याकुलाबुन्मदिष्णू\nविपुलपुलकराजद्गौरनीलोज्वलाङ्गौ।\nमिथ उरुपरिरम्भादेकदेहायमानौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nनिरन्तर सुरत रस तृष्णा में व्याकुल, उन्मत्त, विपुल पुलकावलि से शोभायमान गौर नील उज्वल शरीर वाले और परस्पर के निविड़ आलिंगन से मानो एक देह रूप, श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 11\nसततमपरिमानोज्जृम्भमानानुरागौ\nमदरसभरसिन्धू लोलदोलायिताङ्गौ।\nदलितसक्लसेतू धन्यगोप्येकरम्यौ\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nजिनके निरन्तर उच्छलित असीम अनुराग गर्व रसाधिक्य के सागर के समान, चंचल दोलायमान अङ्ग हैं और जिनके नाश हो रहा है धैर्य्य दैन्यादिक भाव समूह अथवा लोकवेद से अतीत, सुकृत स्वरूपा गोपियों से मनोहर श्री राधिका कृष्ण चन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 12\nविलुलितवरबेणी - हारमालावतंसौ\nमृदुलमधुरहासोल्लासिवक्त्रेन्दुविम्बौ।\nअतिरस मदलोलौ चित्रकन्दर्पकेली\nस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\nजिनकी श्रेष्ठ वेणियाँ, हार, माल्य, भूषणादिक विदलायमान हो गये हैं और मन्द मधुर हास्य से जिनका मुख चन्द्रविम्ब उल्लसित है तथा जिनकी अतिशय सुरत गर्व से चपल, विस्मापनी कन्दर्पसम्बन्धिनी क्रीडा है ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 13\nसुरतरसमदान्धौ सन्ततं सन्तरन्तौ\nत्रुटित वलय काञ्ची दाम हारावलिकौ।\nमणिकनक विभूषोत्सारभास्वत्पराङ्गौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nसुरतरस के गर्व सागर में निरन्तर तहरने वाले, जिनके वलय, किंकिणी, पुष्पों की मालायें हार समूह टूट गये हैं, मणि कनक भूषणादिक अस्त व्यस्त हो जाने से जिनके उत्तम अंग प्रत्यंग शोभायमान हो रहे हैं, ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्च में स्मरण कर।\nश्लोक 14\nस्तवकित मणिदाम्ना प्रेयसागुम्फितात्य-\nद्भुत सुललितवेणी प्रेयसीक्लृप्तचूडौ।\nमिथ उदयदखण्ड प्रेम रज्जू विबद्धौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nगुच्छायमान तथा प्रिय के द्वारा ग्रंथित (गूंथी हुई) मणिमाला से जिनकी वेणी सुललित हो रही है, और श्रीप्रिया के द्वारा जिनकी चूडा रची गयी है, परस्पर के उदय प्राप्त अखण्ड प्रेम रज्जु से परस्पर विशेषरूप से बन्ध जाने वाले, ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 15\nजघनलुलितवेणी विस्फुरत्वर्हचूडौ\nकनक रुचिरचूडा कंकणद्वन्द्वपाणी।\nविलसदरुणरोचिः पतिकौशेयवासौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजंघों में चञ्चल मनोहर वेणी वाली तथा शोभायमान मयूरपंख की चुडा वाले, सुवर्ण निम्मित रुचिर चूडा तथा दोनों हस्त में कंकण धारण करने वाले, शोभायमान अरुण कान्ति तथा पीत कौशेय वस्त्र धारण कारी श्रीराधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 16\nकनकजलदगात्रौ नीलशोणाब्जनेत्रौ\nमृगमदरसभालौ मालती कुन्दमालौ।\nतरलतरुणवेशौ नीलपीताम्बरेशौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजो सुवर्ण तथा जलद शरीर वाले हैं और जिनके नील तथा रक्त कमल की तरह नेत्र हैं और जो कपोल देश में मृगमद रस तथा गले में मालती, कुन्द माला धारण करते हैं, जिनका नवीन वेश है, नीलाम्बर तथा पीताम्बर धारी उन श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 17\nललितनवकिशोरौ नव्यलावण्यपुञ्जौ\nसकलरसिक चूडालंकृती मुग्धबेशौ।\nमधुरमधुर मूर्ती विद्युदम्भोदकान्ती\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nअभिनव ललित किशोर वय वाले, नवीन लावण्य की राशि, रसिक समुदाय के शिरोभूषण के अलंकार स्वरूप अर्थात परम रसिक शेखर, सुन्दर वेषधारी, अत्यन्त मधुर मूर्ति वाले, विद्युत् तथा मेघ की कान्ति की तरह कान्तियुक्त अर्थात् कान्त्यामृत तथा रसिकतामृतों की वर्षण से निजापेक्षित भक्त शस्यों के जीवनरूप श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 18\nकिमपि परमशोभामाधुरीरूपचेष्टा\nहसित ललित दृष्टपात्यद्भूतोत्कर्षकाष्ठाम्।\nपरमरसरहस्यावेशतः सन्दधानौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nपरम रस रहस्य में आवेश के कारण जो अत्यन्त शोभा, माधुर्य्य, सौन्दर्य्य, चेष्टा, हास्य, रसमयी भर्त्सना, परिहास, कोपसूचक दृष्टि इत्यादि के द्वारा अद्भुतता की चरम सीमा को धारण करने वाले हैं, उन श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 19\nनिखिलनिगमगूढ़ौ नित्यमन्यान्यगाढ़\nप्रणयभरविवृद्धौ तुङ्गितानङ्ग चेष्टौ\nसुरतरसमदान्वौ न्यस्तजीवौ मिथोऽङ्गे।\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nअत्यन्त प्रेम विषय के कारण निखिल निगम करके गुप्त रूप, नित्य परस्पर निविड प्रीति के आधिक्य वश वृद्धि प्राप्त अर्थात् पुष्ट है, और जो प्राकृत अनंगचेष्टा में शोभायमान, सुरतरस मदान्ध, परस्पर एक दूसरे के लिये जीवन समर्पण करने वाले हैं उन श्रीराधिकाकृष्णचंद्रको निभृत निकुञ्ज में स्मरण कर।\nश्लोक 20\nरमणवदनचन्द्रे दत्तताम्बुलवीटी\nनिजरसनिधिवक्त्रे दत्ततच्चर्व्यभागौ।\nमिथ उरुरसदाङ्ग स्पर्शलोलुभ्यमानौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nपरस्पर-परस्पर के रमणीय वदनचन्द्र में ताम्बूल का वीड़ा अर्पण करने वाले तथा प्रियतम के द्वारा उसका चर्व्वणांश प्रियतमा के मुख में प्रदान करने में व्यग्र और परस्पर अत्यन्त रसद अंग प्रत्यंगों को स्पर्श करने में लोलुप श्रीराधिका कृष्णचन्द्र को निभृतनिकुञ्ज में स्मरण कर।\nश्लोक 21\nअति रसमदवेगान्निस्त्रपाधैर्य्यदृष्टी\nक्रम समुदित तत्तत् सौरताश्चर्य्यनिती।\nवहिरतिरसलीलानुव्रताज्ञामवर्ण्णौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nअत्यन्त रस मत्तता के वेग से जिनकी लज्जा रहित तथा धैर्य्य शून्य दृष्टि है और जिनकी क्रम से सुरतचर्य्या की आश्चर्य्यनीति उदय हो रही है और जिनके लीलागृह के बाहर अत्यन्त रसमयी उनकी लीला के पात्र रूप सखी मन्जरी गण विराजमान होकर उन लीला का वर्णन करते हुए आस्वादन कर रहे हैं, उन श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 22\nरजत भवन रन्ध्रायातसन्मन्दशीता\nनिलविदलिततुङ्गानङ्गसंग्रामखेदौ।\nक्षणसहचररम्यारव्धभूयो विहारौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nमणिमय भवन के गवाक्ष रन्ध्रों में जाने आने वाले सुगन्ध मन्द शीतल पवनों से जिनके अनंग संग्राम के श्रम लुप्त हो रहा है और जो उत्सव परायण सहचरी गणोंके द्वारा उत्सुक हो पुनर्वार विहार सुख आरम्भ कर रहे हैं उन श्री राधिका कृष्णचन्द्र को निभृत निकुञ्ज में स्मरण कर।\nश्लोक 23\nतदति ललित लीला लोल लोलाङ्ग लक्ष्यौ\nसुललित ललितादे र्निर्णिमेषाक्षिरन्ध्रैः।\nहृदयमुपनयन्तौ पूर्ण सौख्याम्बुराशी\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nमधुररस परिकरों की मनोहारिणी अति सुन्दर सुरतलीला में जिनके कटि, नितम्ब, बाहु, मुखादिक सकल अंग चंचलायमान होने के कारण मानों लक्ष संख्या हो रहे हैं और जो सुललित ललितादि सखियों के निमेष रहित नयन द्वारों से हृदय देश में प्राप्त हो रहे हैं तथा जो पूर्ण सौख्य के सागर रूप हैं, ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 24\nप्रणयमयवयस्याः कुञ्जरन्ध्रार्पिताक्षी:\nक्षितितलमनुलब्ध्वानन्दमूर्च्छा पतन्तीः।\nप्रतिरतिविदधानौ चेष्टितैश्चित्रचित्रैः\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nरति के पद-पद में विचित्र से विचित्र चेष्टाओं के द्वारा निकुंज गवाक्ष जाल के छिद्रों में नयन अर्पण करने वाली अथच पृथ्वी में आनन्द मूर्छा को प्राप्त होने वाली प्रेममयी सखियों को हृदय में धारण करने वाले, श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 25\nबहुविधपरिमृष्टान्योन्यगात्रावजस्त्र\nबहुविध परिपृच्छा कारितान्यान्यवाचौ।\nअनिमिषनयनालि स्वादितान्यान्यवक्त्रौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nनिरन्तर पारस्परिक हस्त कमल के द्वारा अंग समूह मार्जन करने वाले तथा अनेक प्रकार की जिज्ञासाओं के द्वारा अनेक प्रकार की वचन रचना सृष्टि करने वाले, निमेष रहित नयन रूप सखियों के द्वारा पारस्परिक मुख कमल आस्वादनकारी श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 26\nमनसिजरससिन्धोरद्भुतावर्त्तवेग\nभ्रमिततनुमनस्कौ केलिविस्मापिताली।\nबहुविधरसगात्रस्पर्शजल्पप्रहासौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजिनके शरीर और मन कन्दर्परस - सागर के अद्भुत आवर्त्तन ( घूर्णन ) के वेग से चलायमान हैं और जो क्रीड़ा समूह से सखीवृन्दों को विस्मय करने वाले हैं तथा जो परस्पर अनेक प्रकार के रसमय शरीर का स्पर्श और हास्य वचन युक्त हैं उन श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 27\nवहुलसुरतखेलायाससंखिन्नगात्रौ\nदयितनिजसखिभि र्वीज्यमानौ पटान्तैः।\nसरसभुजगवल्ली पल्लवास्वादिवक्त्रौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nजिनके शरीर अनेक प्रकार की सुरतक्रीड़ा के परिश्रम से खेद प्राप्त हो रहा है तथा जो निज प्रिय सखियों के द्वारा पटाञ्चल से वीज्यमान हैं और जिनके मुख कमल सरस ताम्बूल पल्लव के आस्वादन से शोभायमान है, ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 28\nमिथ उरुपुलकश्री दोर्ल्लताबद्धकण्ठौ\nव्यतिमिलितमुखेन्दू किंकणी लालितांघ्री।\nनवरतिरसखेला श्रान्तितन्द्रालुनेत्रौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nविपुल पुलकावलि से परस्पर शोभायमान, जिनके गल-देश परस्पर की भुजलताओं से वेष्टित है और परस्पर के मुख कमल में परस्पर मुख मिलाने वाले, तथा जिनके चरण कमल किंकिणी से शोभायमान है और जो नवीन रतिरस क्रीड़ा से श्रान्ति प्राप्त हैं अर्थात् जिनके नेत्र कमल निद्रारस से व्याकुल हैं ऐसे श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 29\nसुरतरससमुद्रे पादमाचूडमग्नौ\nत्रुटिलवमिव यातां मन्यमानौ त्रियामाम्।\nप्रतिनिमिषमसीमोजृम्भितानङ्गतृष्णौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nसुरत रस सागर में आपाद मस्तक (चरण से लेकर मस्तक पर्यन्त) मग्न शील, त्रुटि लव काल को भी एक रात्रि मानने वाले, तथा जिनके निमेष-निमेष में असीम अनंग तृष्णा उठती है ऐसे श्री राधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 30\nतदतिमधुरधाम्नि नाम्नि वात्सल्यमात्रात्\nकथमपि कलनीयौ कस्यचिद्भाग्यसीम्नः।\nश्रूतिततिभिरगम्यौ सत्सभाजस्रसङ्गौ\nस्मर निभृतनिकुञ्जे राधिका कृष्णचन्द्रौ॥\nनाम धाम के वात्सल्य मात्र अर्थात् अति अल्पमात्र यत् किंचित् नाम धाम के अनुशीलन से सीमा प्राप्त सौभाग्य क्षेत्र शील किसी व्यक्ति का हेला व श्रद्धा से भी ग्रहण रूप, वेद समूह से अगम्य, निखिल सज्जनों द्वारा वन्दनीय, केवल सखी मञ्जरियों की सभा में संप्राप्त श्रीराधिका कृष्णचन्द्र को निभृत निकुंज में स्मरण कर।\nश्लोक 31\nपरमरसग्हस्य नन्दनिस्यन्दिवृन्दा\nवनविपिननिकुञ्जे दिव्यदिव्यै र्विलासैः।\nनिरवधिरसमानौ राधिका कृष्णचन्द्रौ\nभज सकलमुपेक्ष्य तावकी शास्त्रयुक्ती॥\nरे मन ! देह, गेह, शास्त्रयुक्ति, प्रभृति का पूर्णतः उपेक्षा करके परमरस रहस्य आनन्द के सागर रूप वृन्दावन के निकुंज में दिव्यातिदिव्य विलासों से निरन्तर शोभायमान श्रीराधिका कृष्णचन्द्र का भजन कर।\nश्लोक 32\nस्तवमिममतिरम्यं राधिकाकृष्णचन्द्र\nप्रमदभरविलासैरद्भूतं भावयुक्तः।\nपठति य इह रात्रौ नित्यमव्यग्रचित्तः\nविमलमतिसु राधालीसु सख्यं लभेत॥\nजो भावयुक्त होकर रात्रिकाल में स्थिरचित्त से राधिका कृष्ण चंद्र के प्रमोद भरे विलासों से अद्भुत मनोहर इस स्तव का पाठ करे वह विमल मतिवाली राधिका की सखियों में सख्य रूप को प्राप्त होता है अर्थात् सखी रूप होकर युगल सरकार की सेवा को प्राप्त करता है।\nइति श्रीमद् रूप गोस्वामिना विरचितः\nश्रीनिकुञ्जरहस्यस्तवः समाप्तः"])</script><script>self.__next_f.push([1,"11:[\"Braj Rasik\",\"Mass Import\"]\n12:[]\n13:[]\n14:[]\nd:{\"id\":\"local-268\",\"title\":\"श्री निकुंज रहस्य\",\"category\":\"Shloka\",\"sanskrit_text\":\"श्लोक 1नव ललितवयस्कौ नव्यलावण्यपुञ्जौनव रस चलचित्तौ नूतनप्रेमवित्तौ।नव निधुवनलीला कौतुकेनातिलोलौस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\",\"hindi_text\":\"$e\",\"english_text\":null,\"english_translation\":\"$f\",\"description\":\"https://www.brajrasik.org/hi/articles/5902fe7311ec2c04484ebff5/shri-nikunjarahasyastava-prayer-by-shri-roop-goswami\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"$10\",\"tags\":\"$11\",\"image_urls\":\"$12\",\"video_urls\":\"$13\",\"media_links\":\"$14\",\"source_url\":\"https://www.brajrasik.org/hi/articles/5902fe7311ec2c04484ebff5/shri-nikunjarahasyastava-prayer-by-shri-roop-goswami\",\"slug\":\"shri-nikunj-rahasya\"}\n16:[\"slug\",\"shri-nikunj-rahasya\",\"d\"]\n1b:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"content\",\"shri-nikunj-rahasya\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"shri-nikunj-rahasya\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"shri-nikunj-rahasya\\\"}\",{}]}]}]}]},\"$undefined\" /www.brajrasik.org/hi/articles/5902fe7311ec2c04484ebff5/shri-nikunjarahasyastava-prayer-by-shri-roop-goswami\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"$c\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5902fe7311ec2c04484ebff5/shri-nikunjarahasyastava-prayer-by-shri-roop-goswami\",\"slug\":\"shri-nikunj-rahasya\"},\"initialRelatedSaint\":null,\"initialRelatedBook\":null,\"initialRelatedRaga\":{\"name\":\"राग गर्व\",\"hinglishName\":\"rag garva\",\"slug\":\"rag-garva\",\"verses\":[\"$d\"],\"imageUrl\":null},\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$L15\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$16\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L17\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L15\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L17\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"lang\":\"hi\",\"children\":[\"$\",\"$L15\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L17\

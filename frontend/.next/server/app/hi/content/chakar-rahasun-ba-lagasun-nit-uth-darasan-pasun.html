your divine leelas (sports).\",\"description\":\"https://www.brajrasik.org/hi/articles/5da992fb0384260060487b0d/chaakar-rahsun-baag-lagaasun-nit-uth-darsan-paasun-meerabai\",\"author\":\"मीराबाई\",\"status\":\"published\",\"content_text\":\"\\\"चाकर रहसूं बाग़ लगासूं, नित उठ दरसन पासूं\\nब्रिन्दाबन की कुञ्ज गलिन में, तेरी लीला गासूं\\\"\\n- मीराबाई\\nहे कृष्ण, मैं सदा आपकी दासी रहूँगी और आपके लिए एक बाग लगाउँगी। प्रतिदिन सुबह उठ कर आपका दर्शन करुँगी। वृंदावन की कुञ्ज गलियों में विचरण कर, मैं आपके दिव्य लीलाओं को गाऊँगी।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5da992fb0384260060487b0d/chaakar-rahsun-baag-lagaasun-nit-uth-darsan-paasun-meerabai\",\"slug\":\"chakar-rahasun-ba-lagasun-nit-uth-darasan-pasun\"},\"initialRelatedSaint\":{\"name\":\"मीराबाई\",\"hinglishName\":\"mirabai\",\"slug\":\"mirabai\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[\"$9\",{\"id\":\"local-343\",\"title\":\"आली म्हाँने लागे बृन्दावन नीकौ\",\"category\":\"Shloka\",\"sanskrit_text\":\"आली म्हाँने लागे बृन्दावन नीकौ।घर घर तुलसी ठाकुर पूजादरसण गोविन्द जी को ॥निर्मल नीर बहत जमुना मेंभोजन दूध दही को।रतनसिंघासन आप विराजैमुकट धर्यो तुलसी को॥कुंजन कुंजन फिरत राधिकासबद सुणत मुरली को।मीरा के प्रभु गिरधर नागरभजन बिना नर फीको॥\",\"hindi_text\":\"हे सखी, मुझे वृंदावन अति प्रिय लगता है। यहाँ हर घर में श्री तुलसी जी विराजमान हैं एवं श्री ठाकुर जी की पूजा होती है एवं नित्य दर्शन होता है। श्री जमुना जी में निर्मल एवं स्वच्छ जल बह रहा है एवं यहाँ पर दूध एवं दही का भोग श्री ठाकुर जी को लगाया जा रहा है। श्री ठाकुर जी रत्न एवं मणियों के सिंहासन पर विराजमान हैं परंतु श्री तुलसी जी के पत्रों से निर्मीत मुकुट धारण किया है। श्री राधिका जी विभिन्न कुंजों में विचरण कर रहीं हैं जहाँ मुरली की मधुर धुन सुनाई दे रही है। श्री मीराबाई कह रहीं हैं \\\"प्रभु श्री गिरिधर नागर के भजन के बिना यह मनुष्य शरीर फीका एवं निरर्थक है।\\\"\",\"english_text\":null,\"english_translation\":\"O Sakhi, I love Vrindavan from the bottom of my heart. There is Tulasi in every house, worship of Shri Thakurji and their Darshan in every house.\\nThe water of river Yamuna is holy and dairy products like Milk and curd is easily available.\\nShri Thakurji is gorgeously adorned in the gem-studded throne, wearing the dazzling crown of Tulasi.\\nShri Radha is wandering in various groves of Vrindavan to listen to the beautiful melodies of Thakurji’s flute.\\nShri Mirabai says, “Shri Giridhar Nagar Krishn is the Lord of my life and without Bhajana (devotion) this human form is utterly useless”.\",\"description\":\"https://www.brajrasik.org/hi/articles/5d852b906851f9006900c88c/aali-mhane-laage-brindavan-neekau-meerabai\",\"author\":\"मीराबाई\",\"status\":\"published\",\"content_text\":\"आली म्हाँने लागे बृन्दावन नीकौ।\\nघर घर तुलसी ठाकुर पूजा\\nदरसण गोविन्द जी को ॥\\nनिर्मल नीर बहत जमुना में\\nभोजन दूध दही को।\\nरतनसिंघासन आप विराजै\\nमुकट धर्यो तुलसी को॥\\nकुंजन कुंजन फिरत राधिका\\nसबद सुणत मुरली को।\\nमीरा के प्रभु गिरधर नागर\\nभजन बिना नर फीको॥\\n- मीराबाई\\nहे सखी, मुझे वृंदावन अति प्रिय लगता है। यहाँ हर घर में श्री तुलसी जी विराजमान हैं एवं श्री ठाकुर जी की पूजा होती है एवं नित्य दर्शन होता है। श्री जमुना जी में निर्मल एवं स्वच्छ जल बह रहा है एवं यहाँ पर दूध एवं दही का भोग श्री ठाकुर जी को लगाया जा रहा है। श्री ठाकुर जी रत्न एवं मणियों के सिंहासन पर विराजमान हैं परंतु श्री तुलसी जी के पत्रों से निर्मीत मुकुट धारण किया है। श्री राधिका जी विभिन्न कुंजों में विचरण कर रहीं हैं जहाँ मुरली की मधुर धुन सुनाई दे रही है। श्री मीराबाई कह रहीं हैं \\\"प्रभु श्री गिरिधर नागर के भजन के बिना यह मनुष्य शरीर फीका एवं निरर्थक है।\\\"\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d852b906851f9006900c88c/aali-mhane-laage-brindavan-neekau-meerabai\",\"slug\":\"ali-mhanne-lage-brindavan-nikau\"}],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[

।\\nShri Radha Lalitadik Mere Jeevani Praan Aadhar,\\nSarveshu Vyaas Das Ko Van Hai, Vrindavanhi Abhaar\\\"\\n- His Holiness Shri Hariram Vyas (Vishakha Avtaar) - Vyas Vaani\\nShri Radha and her sakhis like Lalita are the treasure of my life. Shri Hariram Vyas descencion of Vishakha sakhi says, All glories to Shri Vrindavan, the place where she is present every moment.\",\"author\":{\"@type\":\"Person\",\"name\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:Ta95,"])</script><script>self.__next_f.push([1,"(राग सारंग)\nहम कब होहिंगे ब्रजवासी।\nठाकुर नंदकिशोर हमारे, ठकुराइनि राधा सी।।\nकब मिलि हैं वे सखी सहेली, हरिवंशी हरिदासी।\nवंशीवट की शीतल छहियाँ, सुभग नदी जमुना सी।।\nजाकी वैभव करत लालसा, कर-मीत कमलासी।\nइतनी आस व्यास की पुजवहु वृन्दाविपिन विलासी |\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (104)\nविशाखा अवतार श्री हरिराम व्यास जी के शब्दों में ऐसा कब होगा की हम सच्चे ब्रजवासी बन जाएंगे, क्यूंकि हमारे ठाकुर श्री कृष्ण हैं एवं श्री राधारानी सी हमारी ठकुरानी हैं | ऐसा कब होगा की हमें हमारी प्राण प्यारी सखियाँ, हरिदासी (ललिता सखी), हरिवंशी (हित सखी) का संग भी मिलेगा | ऐसा कब होगा की हम वृन्दावन में श्री राधा कृष्ण के साथ लीला में भाग लेंगे जहाँ बंशीवट (जहाँ श्री कृष्ण ने महारास लीला की थी) की शीतल छाया है, जहाँ सुन्दर रस रानी यमुना नदी बह रही है | यह ऐसा दिव्य धाम हैं जहाँ महालक्ष्मी भी हाथ जोड़ कर वृन्दावन धाम की सीमा के बाहर खड़ी है, परन्तु उनको वृंदावन धाम में प्रवेश नहीं हो पा रहा | श्री हरिराम व्यास जी कहते हैं की मेरी इतनी ही आशा को अब पूरा कर दो, की मुझे वृन्दावन धाम में सेवा का अवसर मिल जाए एवं अब मुझे वृन्दावन धाम सच्चा ब्रजवासी बनादे|"])</script><script>self.__next_f.push([1,"b:Ta95,"])</script><script>self.__next_f.push([1,"(राग सारंग)\nहम कब होहिंगे ब्रजवासी।\nठाकुर नंदकिशोर हमारे, ठकुराइनि राधा सी।।\nकब मिलि हैं वे सखी सहेली, सका पान करके जिज्ञासु, भावुक एवं रसिक वृन्द अति उत्तम रसिक-अनन्य-परमहंस पदवी को प्राप्त कर लेते हैं। उन्होंने स्वयं कहा है -\nप्याय अधर सुधा महा मधु मत्त मिलि कौतुक कियौ।\nकिये कौ सुख अल्प सखि सुनि कह्यौ भरि उमँग्यौ हियौ॥\nउनके रस के पदों को समझना साधारण साधक की बुद्धि एवं दृष्टि से बहुत भिन्न है। वे उस सर्वोच्च रस में निमग्न थे जहाँ उपास्य और उपासक इतना घुल-मिल जाते हैं कि उपास्य उपासकों को अपने समतुल्य या अपने से बड़ा मान कर उसके अधीन रहने लगता है और उपासक उपास्य से कुछ भी लेने की इच्छा ना रख कर हमेशा उसे देते ही रहते हैं। निरंतर उपास्य के सुख का ध्यान होने के कारण, उनके सुख के लिए उन्हें आशीर्वाद देना चाहते हैं। यही उन्होंने अपने पदों में भी लिखा है:\n\"देत आसीस विहारिनि दासी करहुं नवल नित रलियां“\nकिशोरीजी के चरणों में प्रगाढ़ प्रेम होने के कारण वे बिहारी जी से सदा बेपरवाह रहते और उन्होंने एक पद में इसका वर्णन भी किया है:\n\"किये रहै ऐंड बिहारी हूँ सौं हम बेपरवाह विहारिनि के“\nस्वामी श्री बिहारिन देव जी ने 1670 के लगभग नित्य निकुंज में प्रवेश किया। उनकी समाधि निधिवन में है। उनकी शिष्य परंपरा में स्वामी श्री नागरीदास जी और श्री सरस दास जी प्रधान थे।"])</script><script>self.__next_f.push([1,"d:T37b1,"])</script><script>self.__next_f.push([1,"Born in the Suradhwaj Brahmin dynasty, King Mitrasen was the Chief Minister of Badshah. He was a great soul and generous. The couple didn't have any child and were extremely unhappy even after having huge property. Even after doing many diligence, donations, virtues, devotional ceremonies, and Yantra-Mantras, they didn't get any child and the hope is also vanished. Seeing the King's displeasure, his dear friend and Proficient Minister Shri Chaturbhujdas Ji Goud consoled the king and said that like you, I too became very sad after trying many resources for the son. One day, suddenly I departed to Vrindavan. Seeing the saint Shiromani Shri Swami Haridas Ji Maharaj there, my heart was very happy and thought that \"O Swami Ji, if you know my heart's desire then please give me a son.\nOn seeing me, Swami Ji called me near and said - You are depressed without any son. You will have two sons full of devotion, knowledge, and disinterest. They will stay with you for eighteen years, then they will come to me.\nThen I told him - O compassionate! please give me one child and another one to my friend. He is very sad without a son.\nThen he appreciated the friendly spirit and preached the true friend sentiment and said - first you will have a son here. After five years, you should tell this story to your friend. He should come here with his wife then he will get a son.\nNow that auspicious occasion has come. You have to get darshan of Rasik Ananya Nripati Shri Swami Haridas Ji Maharaj.\nListening to Shri Chaturbhuj Das Ji, the body and mind of Mitrasen were filled with joy, as if the soul returned again to the body. He came to Nidhuvan with great devotion from his heart to visit Shri Swami Haridas Ji Maharaj. He prostrated and put hundred gold coins in the lotus feet of Shri Swami Ji with love, Shri Swami Ji Maharaj was pleased to see him. With folded hands, Mitrasen said - By the mercy of Chaturbhuj Das, I had darshan of you, and now my birth and life succeeded. According to your command, I have come to your shelter.\nShri Swami Ji Maharaj said - Well done that you came here. Now you couple stay in Mathura and one day, you will definitely get a son. Take these gold coins and serve saints with all your heart. When the son is one year old, then bring him here.\nA year later, Shri Biharinidas appeared as an idol of devotion, knowledge, disinterest, and love of Yugal Shri Nitya-Vihari. Mitrasen and Chaturbhuj Das were overjoyed to hear. Donated a lot of money and served the saints in pleasure. After a year, they came to Nidhuvan and bowed down to Shri Swami Ji Maharaj and placed the baby to the lotus feet.\nShri Swami Ji Maharaj saw the beauty of the child and smiled knowing him to be his successor, said - This child is very fortunate. He will remain with you for thirty-three years, then he will come to me and will take renunciation. Know him a one in millions. Then Shri Swami Ji Maharaj blessed the child with Neck Kanthi, Tilak, Prasadi, and cloths and named him Biharinidas.\nThe parents took charnamrit of Shri Swami Ji and sprinkled on the head of the child. The boy walked on his knees and caught the Karuva (small earthen pot) of Shri Swami Ji Maharaj. Shri Swami Ji Maharaj said softly - not now Biharinidas, come later and take it.\nStaying for seven days in Vrindavan, Mitrasen returned to Delhi with his friend seeking permission from Shri Swami Ji Maharaj. The couple began to remain engrossed in joy by seeing their child.\nAfter the demise of his father, Shri Bihari Das was appointed in the Government Service. But his mind was not in peace during his service. Soon after the last rites, of his father, his innate devotion prevailed and his mind became tired of worldly affairs and he dreamt of surrendering his life to Radha Krishn and doing devotion at Vrindavan in complete detachment. He kept on thinking about residing in Vrindavan. He writes as:\n\"बसी वृंदावन उत्तम ठाऊँ, सत्संगति परमारथ पाऊं |\nनित दंपति संपत्ति दिखाऊं, श्री बिहारिनिदासी भई गुन गाऊं ||\"\nSpiritual Life:\nWhen Biharinidas grew up, he used to imitate the character of Sri Yugal-Leela or the character of Rasik Mahipati Shri Swami Ji Maharaj in playing with friends. He used to preach to the children about the form of Shri Swami Ji Maharaj. He used to chant Shri Haridas's name with meditation and preach the same to others. Shri Krishnadas was six years older than Biharinidas, son of Shri Chaturbhujadas Ji. He was also born by the grace of Shri Swami Ji Maharaj and he named him Krishnadas. He used to be covered in the love-color of Nityavihara day and night. He was very much in love with Biharinidas, as if they had two bodies and one soul. Both of them were immersed in the sweet conversation of Shri Yugal and of Shri Swami Ji Maharaj.\nIn spite of having favorable luxury and wealth of gross happiness, Shri Biharinidas Ji seemed to have a disinterest in the worldly luxuries. His heart was inhabited by the lotus feet of Shri Swami Haridas. Continuously, chanting the name of Shri Haridas and pagination in the color of Nitya Vihar was the nature of his body, mind, and soul. And with association with Shri Krishna Das, he was immersed in Nitya Vihar day and night.\nOne day Shri Krishnadas Ji felt fervent disinterest. He said to Shri Biharinidas Ji - This body is now twenty-one years old. Till now, I am untouched from the effect of this kali yuga by the grace of Guru Maharaj, if I get into bad association now, then my life will be ruined. That is why I will now go to Shri Vrindavan in the shelter of Shri Guru Shri Swami Ji Maharaj. He will bless me and make me the ultimate deviant of devotion, prudence, and continual prosperity, when will such a rare auspicious occasion be accessible?\nShri Biharinidas Ji said - You are supreme flawless, Vairagya Shiromani and purely blessed. Immediately go to Shri Vrindavan. I too will come soon and take refuge of the lotus feet  Shri Guru Maharaj. Saying this, Shri Biharinidas greeted him. Shri Krishnadas Ji immediately came to Shri Vrindavan and was happy to find shelter in the lotus feet of Shri Swami Ji Maharaj.\nSeeing the pure love of Shri Krishnadas Ji, Shri Swami Ji Maharaj held his hand in the hands of Shri Vithalvipuldev Ji and said - he is a body part of mine. Take him in your shelter.\nShri Vithalvipuladev obeyed and made Shri Krishnadas Ji the ultimate bright righteous follower, preached him the path of Shri Haridas, drenched him in Nityavihar essence.\nHere, Shri Biharinidas Ji, with the qualities of beauty, modesty, etc., was loved by everyone but still untouched by worldly affairs. In fifteen years of age, his beauty, glory, and youth grew, yet he was free from desire, anger, greed, and attachment. With love and devotion, he used to chant the name of Shri Haridas and the Yugal's mantra. The discrete discussion was not pleasant for him. He was very generous, benevolent, true, brave, patient, and humble in nature.\nWhen his father King Mitrasen left the body, Shah handed him the post of Chief Minister. Shah used to respect him very much after listening to his quality from his Minister Shri Chaturbhuj Das.\nVrindavan Arrival:\nHe once went to war on behalf of Shah. There, their comrades betrayed with the rival on the pretext of the treaty and poisoned the secretary. Due to this, Biharinidas suffered a lot. After cutting his right hand, which had given life blessings to the enemy secretary, and donating the entire splendor, started walking to Shri Vrindavan, then the enemy secretary Kamalapati-sons Nanakaram and Shuklabardhar came in front of him and prayed for self-defense and welfare. Then you said - believe in my word. Keep the body of your deceased father and my hand together. In fifteen days my hand will appear and your father will be alive. All this was the act of time - abandon the sorrow and confusion from the heart, saying this, he walks to Vrindavan. Arriving at Vrindavan, after bowing down to Shri Swami Ji Maharaj, the severed hand came out again. Shri Swami Ji Maharaj put his lotus hand on the head of Biharinidas and blessed him, as if holding the moon on his forehead and assuming the form of Lalita Sakhi, and providing the Sakhi form with the right to serve Shri Radha Krishna in Nitya Nikunj. At that time, this poem sprouted from your mouth -\nश्री स्वामी हरिदास कर अम्बुज परसत माथ।\nमानौं रचि खचि चन्द्रिका राखी सखियनि साथ॥\nराखी सखियनि साथ नाम घृत दासि बिहारिनि।\nनिरखति नित्य बिहार लता गृह रन्ध्र निहारिनि॥\nअति नागर वर जानि निकट स्यामा अभिरामी।\nदुतीय रूप इक धर्म धुरा बाहत श्री स्वामी॥\nAfter receiving the unique grace of Shri Swami Ji Maharaj, Shri Swami Biharini Dev went very far in the path of worship of Rasik-Ananya Dharma and Nityabihar Rasa-Riti. His life and his words were very high quality and very firm. He followed a high ideal of Rasik-exclusive path and was a very great Rasik of high caliber. His words were the expansions of the Vani of Shri Swami Ji Maharaj, which is deep, succulent, and is attractive for the followers of this path.\nHe gave up all his worldly desires. With the grace of the dust of Vrindavan, his mind got a very deep attachment in the feet of Shri Radharani and finally, he never looked back to the world.\nIt was as if his heart was drenched in Shri Radharani’s (Swaminiji’s) seva, where he writes in his poems:\n“ मेरे विषै विसन वर वाम, तन गोरी मन भोरी नवल किशोरी राधा नाम |\nनिस बासर जागत सोवत चितवत अंग अंग अभिराम |\nअंजन मंजन करात परम रूचि चोप चौगुनी काम ||\nताकि हिलगी तजै मैं अपने कर्म धर्म धन धाम |\nदई पीठि सब जगतें लगतें पायो बन विश्राम ||\"\nAs soon as he took Shelter in the feet of Shri Radharani, by residing in Vrindavan and giving up the material desires, His fickle mind has finally got the ultimate rest and relief.\nHe became totally dependent upon Brajwasis (residents of Braj) for food. This way he started living renounced life by begging food from them. He described it as:\n\"रुचे मोहि ब्रजवासिन के टूक\"\nHe has expressed his unique loyalty to Braj Dham and Brajwasis. In one pada, he has not hesitated to tell himself the pet of Brajwasis.\n\"हौं ब्रजवासिन कौ पाल्यो पीला\"\nNow with the passing time, He became totally lost in the Nitya Vihar Ras. There is a very famous incidence related to his life. Once, while going for a bath in the Yamuna, he had dantun (brush) in his mouth. He remained standing on the road for three days, remained absorbed in divine bliss singing a certain verse:\n“Viharat Laal Viharin Dou, Shri Yamuna ke Teere Teere\"\n(Yugal Sarkar (Radha \u0026 Krishna) are performing leelas and are passing at the bank of Yamuna).\nAfter eating Prasad of Bihariji, he gained back consciousness. It is said that after this incidence, He gave up the Prakat (physical) Bihariji Sewa and remain absorbed in Mansik (Mind) Sewa.\nHe writes this way saying, some get intoxicated with drugs, but Biharin Das is always intoxicated in the divine bliss of Shree Shyama Shyam.\n\"कोऊ मदमाते भांग के, कोउ अमल अफीम,\nश्री बिहारीदास रसमाधुरी, मत्त मुदित तोफीम”\nAfter few days, Swami Sri Haridas Ji entered Nikunj Leela, 7 days after his departure, Vithal Vipul Dev Ji also entered Nikunja. After that Viharin Dev Ji became the Acharya. Shri Biharin Dev Ji remained Acharya of the sect for a long time.\nCompositions:\nHis compositions has two parts - one is the principal aspect, the other is the aspect of the Rasa (Nectar). The composition of Rasa is a reflection of his experience. The way he felt while living as a part of Shri Lalita Ji in a sarcastic form, the experience of inner heart came out as the voice of the Rasa, which the curious followers and Rasik saints drink and feel the nectar of Nitya Vihar Rasa. He himself has said -\nप्याय अधर सुधा महा मधु मत्त मिलि कौतुक कियौ।\nकिये कौ सुख अल्प सखि सुनि कह्यौ भरि उमँग्यौ हियौ॥\nHis compositions are very different for a normal sadhak’s (spiritual aspirant) understanding. He was indulged in this pure happiness where the seeker and the master are so united that now the master considers his seekers equal to himself or rather higher than himself, and, seeker keeps on giving selflessly without actually seeking anything from his master. Because of his continuous thought for his master’s happiness alone, he seeks blessings for his master's happiness only. That is how he narrates in his padas related to Shyama Shyam. Therefore He gives blessings to the pair of Radha Krishn.\n\"देत आसीस विहारिनि दासी करहुं नवल नित रलियां “\nHe even says, due to his immense love for Kishori Ji, Shri Radharani, he doesn’t mind Bihariji, which he describes in the lines:\n\"किये रहै ऐंड बिहारी हूँ सौं, हम बेपरवाह विहारिनि के“\nThis says as Since we belong to Shri Radha, So we are fearless from everyone including Shri Krishn.\nSwami Shri Biharin Dev Ji entered Nikunja around 1670. His samadhi is still in Nidhivan. In his disciple tradition, Swami Shri Nagaridas Ji and Shri Saras Das were his main followers."])</script><script>self.__next_f.push([1,"e:T72ee,"])</script><script>self.__next_f.push([1,"जन्म:\nसूरध्वज ब्राह्मण वंशी राजा मित्रसेन बादशाह के प्रधान दीवान थे। वे महान् धर्मात्मा तथा उदार थे। अतुल सम्पत्ति होने पर भी दम्पती सन्तान के बिना अत्यन्त दुःखी थे। दान, पुण्य, देवतादि का यजन और यंत्र-मंत्र आदि अनेक यत्न करने पर भी मन की आशा-पल्लवित न होते देखकर उनके मन में अतीव उदासी छा गई। एक दिन राजा की खिन्नता देखकर उनके प्रिय मित्र और प्रवीण दीवान श्रीचतुर्भुजदास जी गौड़ ने राजा को सांत्वना देते हुए कहा कि आपकी भाँति मैं भी पुत्र हेतु अनेक साधन कराने के उपरान्त अति दुःखी और उदास हो गया था। एक दिन अचानक श्री वृन्दावन चला गया। वहाँ संत शिरोमणि श्री स्वामी हरिदास जी महाराज के दर्शनकर हृदय को अतीव हर्ष हुआ और मन में विचार आया की यदि ये संत सुखस्वरूप हैं तो कृपा कर मुझे पुत्र प्रदान करें।\nउन्होंने देखते ही मुझे निकट बुलाकर कहा - तू पुत्र के बिना उदास है। तेरे भक्ति, ज्ञान और वैराग्य सम्पन्न दो पुत्र होंगे। वे अठारह वर्ष तेरे पास रहेंगे, फिर मेरे पास आकर कुंजबिहारी लाल के विमल विलास को विलसेंगे।\nतब मैंने उनसे कहा - करुणानिधान! एक पुत्र मेरे हो और एक मेरे मित्र के घर हो। वह पुत्र के बिना महादुःखी है।\nतब उन्होंने मित्र भावना की सराहना की और सच्चे मित्र भाव का उपदेश देकर कहा - प्रथम तेरे यहाँ पुत्र होगा। पाँच वर्ष के बाद तू अपने मित्र को यह वृत्तान्त सुनाना। वे अपनी पत्नी सहित यहाँ आवें और पुत्र को गोद खिलावें।\nअब वह शुभ अवसर आ गया है। आप रसिक अनन्य नृपति श्री स्वामी हरिदास जी महाराज के दर्शन और वर पाकर अद्भुत लाभ लीजिये।\nश्रीचतुर्भुजदास जी की बात सुनकर मित्रसेन के तन-मन-प्राण आनंद से भर गये, मानो जाते हुए प्राण फिर से शरीर में लौट आये। वे अत्यन्त श्रद्धापूर्वक हर्षोत्कण्ठा से पत्नी सहित श्रीस्वामी हरिदास जी महाराज के दर्शन के लिए निधुवन आये। प्रीति सहित प्रणाम किया और शत मुहरें भेंटकर श्री स्वामी जी महाराज के श्रीमुखचन्द्र के दर्शन करके परमानन्दित हुए। हाथ जोड़कर विनती करते हुए मित्रसेन बोले - चतुर्भुजदास की दया से आप श्री के दर्शन करके जन्म-जीवन सफल हुआ। आपने जो यहाँ आने की आज्ञा दी थी, सो मैं आपकी शरण में आ गया हूँ।\nश्रीस्वामी जी महाराज ने कहा - अच्छा किया जो तुम आये। अब तुम दम्पती कुछ एक दिन मथुरा में वास करो, पुत्र प्राप्ति अवश्य होगी। ये मुहरें उठा लो और मन लगाकर विप्र तथा साधु-संतों की सेवा करो। जब पुत्र एक वर्ष का हो जाय, तब उसे लेकर यहाँ आना।\nएक वर्ष बाद भक्ति, ज्ञान, वैराग्य और युगल श्री नित्य-विहारी के प्रेम की मूर्ति रूप पुत्र-रत्न प्रकट हुआ। मित्रसेन और चतुर्भुजदास जी सुनकर हर्षोत्फुल्ल हो उठे। आनन्दावेश में बहुत सा धन दान दिया और संत सेवा करी। एक वर्ष बीतने पर वे निधुवन आये और श्रीस्वामी जी महाराज को प्रणाम करके शिशु को श्रीचरणों से लगाया।\nश्रीस्वामी जी महाराज रूप-लावण्य युत शिशु को अपना सरस अंश जान हँसकर बोले - यह बालक अति बड़भागी है। यह तैंतीस वर्ष तुम्हारे पास रहेगा, फिर विरक्त, महाअनुरागी और त्यागी होकर हमारे निकट रहेगा। कोटि पुत्रों के समान इसे जानना। फिर श्रीस्वामी जी महाराज ने बालक को कण्ठी, तिलक, प्रसादी, वस्त्रादिक देकर सिर पर हाथ फेरते हुए आशीर्वाद दिया और बिहारिणिदास नाम रखा।\nमाता-पिता ने श्रीस्वामी जी महाराज के चरण प्रक्षालन करके बालक के सिर पर जल छिड़का और चरणामृत पिलाया। बालक ने किलकते हुए घुटुरुवन चलकर श्री स्वामी जी महाराज का करुवा पकड़ लिया। मित्रसेन ने निवारण किया तो श्रीस्वामी जी महाराज मृदु मुस्काते हुए बोले - बिहारिणिदास अभी नहीं, फिर आकर इसे ग्रहण करना।\nसात दिवस वृन्दावन वासकर मित्रसेन श्रीस्वामी जी महाराज से आज्ञा माँगकर मित्र सहित दिल्ली लौट आए। तेज-प्रभाव पुंज अनूप पुत्र-रत्न को लाड़ लड़ाकर दम्पती आनन्द-सिन्धु में नित्य मग्न रहने लगे।\nआध्यात्मिक जीवन:\nबिहारिणिदास जब बड़े हुए तब बराबर के सखाओं के संग खेल में श्री युगल-लीला का या रसिक महीपति श्रीस्वामी जी महाराज के चरित्र का अनुकरण करते थे। वे खेल-खेल में बालकों को श्रीस्वामी जी महाराज के स्वरूप का उपदेश देते थे। वे ध्यान सहित श्री हरिदास नाम जपते और सबसे ही ध्यान-जप करवाते थे। सचिव श्रीचतुर्भुजदास जी के पुत्र बिहारिणिदास से छह वर्ष बड़े थे। इनका जन्म भी श्रीस्वामी जी महाराज की कृपा से ही हुआ था और उन्होंने ही इनका नाम कृष्णदास रखा था। वे नित्यविहार के प्रेम-रंग में रात-दिन छके रहते थे। वे बिहारिणिदास से अति स्नेह करते थे, मानो एक प्राण-दो देह हों। दोनों परस्पर श्री युगल की और श्रीस्वामी जी महाराज की रसमयी मधुर चर्चा में अहर्निश छके रहते थे।\nसकल सुख-सम्पत्तिमय अनुकूल वैभव-विलास प्राप्त होते हुए भी श्री बिहारिणिदास जी को सब लवण समान खारी-असार व दुःखद लगते थे। उनके हृदय-कमल पर तो श्री हरिदास चरण बसे हुए थे। निरन्तर श्री हरिदास नाम को रटना और नित्य केलि रंग में पगना ही तन-मन-प्राणों का स्वभाव बना हुआ था। ऐसे ही श्रीहरिदास चरण के और नित्यविहार के अनन्य अनुरागी श्रीकृष्णदास उनको जी मिल गये।\nएक दिन श्री कृष्णदास जी को उत्कट वैराग्य उत्पन्न हो आया। वे श्री बिहारिणिदास जी से बोले - यह शरीर इक्कीस वर्ष का होने को आया है। अब तक तो श्रीगुरु-कृपा से अमल और अविकारी बने रहे, यदि अब कहीं कुसंग लग गया तो विषय-रस में फँसकर सर्वस्व खो बैठेंगे। इसलिए मैं अभी श्री वृन्दावन श्री गुरु-श्रीस्वामी जी महाराज की शरण में जाऊँगा। वे कृपा वृष्टि कर मुझे परम विरक्त, भक्ति व विवेक सम्पन्न और नित्य नवेली केलि के अनुरागी बनावेंगे। फिर ऐसा दुर्लभ शुभ अवसर कब सुलभ होगा?\nगद्गद कण्ठ से श्रीबिहारिणिदास जी बोले - आप परम निष्काम, वैराग्य-शिरोमणि और धन्य-धन्य हैं। आप तत्काल श्री वृन्दावन जाइये। मैं भी जल्दी ही आऊँगा और श्रीगुरु-चरणारविन्दों में प्रणाम करूँगा। ऐसा कहकर उन्होंने सभा सहित प्रणाम किया। श्री कृष्णदास जी तत्क्षण चलकर श्री वृन्दावन आये और नित्यविहार-सार आधार श्रीस्वामीजी महाराज के चरणकमलों में शरण पाकर परमानन्दित हुए।\nश्री कृष्णदास जी की निर्मल प्रीति देखकर श्रीस्वामी जी महाराज ने उनका हाथ श्री वीठलविपुलदेव जी के हाथ में पकड़ाते हुए कहा - यह मेरा निज अंश है। इसको तुम अपनी शरण में ले लो।\nश्री वीठलविपुलदेव जी ने आज्ञा मानकर श्री कृष्णदास जी को निज अनुगामी व परम उज्ज्वल धर्मी बना, श्री हरिदास तत्त्व सुखसार उपदेश कर नित्यविहार-सार रस में सराबोर कर दिया।\nइधर श्री बिहारिणिदास जी रूप-लावण्य, शील-स्वभाव आदि गुणों से सबके प्रिय नयनांजनवत् होकर भी निरंजनवत् परम विरक्त और उपशम स्वभाव से युक्त थे। पन्द्रह वर्ष की आयु, रूप-लावण्य, तेज और यौवन की वृद्धि तथा महान् सुख वैभव, फिर भी काम, क्रोध, लोभ, मद एवं मोह रहित, प्रेम-भक्ति-भाव सहित श्री हरिदास नाम व युगल मंत्र जापमय जीवन। असत् चर्चा सुहाती ही नहीं थी। अति उदार, उपकार परायण, सत्य, शूर, धीर तथा नम्र स्वभाव से इनकी शोभा शत गुण वर्द्धित होती थी।\nजब इनके पिता राजा मित्रसेन ने शरीर त्यागा, तब शाह ने इनको मुख्य दीवान का पद सौंप दिया। इनके दीवान श्रीचतुर्भुजदास जी से इनकी गुणावली सुन शाह बहुत सुख मानते और आदर करते।\nश्री बिहारिणिदास अपने मन को वृंदावन जाकर बस जाने की सीख देने लगे। उन्होंने लिखा है:\n\"बसी वृंदावन उत्तम ठाऊँ, सत्संगति परमारथ पाऊं।\nनित दंपति संपत्ति दिखाऊं, श्री बिहारिनिदासी भई गुन गाऊं॥\"\nवृन्दावन आगमन:\nएक बार शाह की ओर से ये युद्ध में गये। वहाँ इनके साथियों ने प्रतिपक्षी से संधि के बहाने विश्वासघात करके उसे विष दे दिया। इससे इनको भारी कष्ट हुआ। आप अपना दाहिना हाथ, जिससे शत्रु सचिव को अभय दान दिया था, काटकर और सम्पूर्ण वैभव को लुटाकर श्रीवृन्दावन को चलने लगे, तब शत्रु सचिव कमलापति के पुत्र नानकराम और शुक्लाबरधर इनके सम्मुख आये और अत्यन्त कातर होकर आत्मरक्षा और कल्याण की प्रार्थना करने लगे। तब आप बोले - मेरे वचन में विश्वास करो। तुम्हारे मृतक पिता का शरीर और मेरे हाथ को एक साथ रखना। पन्द्रह दिन में मेरा हाथ प्रकट हो जायेगा और तुम्हारे पिता जीवित हो जायेंगे। यह सब होनहार का - काल का कृत्य था, ऐसा समझकर हृदय से दुःख और भ्रम का त्याग करो - ऐसा कहकर श्रीवृन्दावन को चल दिये। वृन्दावन पहुँचकर श्रीस्वामी जी महाराज को प्रणाम करते ही कटा हाथ पुनः निकल आया। श्रीस्वामी जी महाराज ने सिर पर कर-कमल धर आशीर्वाद दिया, मानो माथे पर चन्द्रिका धारण कर, नित्यसिद्ध सखी-स्वरूप प्रदान करके सखियों के मध्य लता-रन्ध्रों से नित्यविहार सुख के अवलोकन का अधिकारी बना दिया। उस समय आपके श्री मुख से यह कुण्डलिया स्फुरित हुई -\nश्री स्वामी हरिदास कर अम्बुज परसत माथ।\nमानौं रचि खचि चन्द्रिका राखी सखियनि साथ॥\nराखी सखियनि साथ नाम घृत दासि बिहारिनि।\nनिरखति नित्य बिहार लता गृह रन्ध्र निहारिनि॥\nअति नागर वर जानि निकट स्यामा अभिरामी।\nदुतीय रूप इक धर्म धुरा बाहत श्री स्वामी॥\nश्रीस्वामी जी महाराज का अनुपम कृपा-प्रसाद प्राप्त कर श्रीस्वामी बिहारिणिदेव जी रसिक-अनन्य धर्म और नित्यविहार रस-रीति की उपासना में बहुत ही आगे बढ़ गये। उनकी रहनी-कहनी अत्यन्त उच्च कोटि की और सुदृढ़ थी। उनकी रहनी में रसिक-अनन्य धर्म का उच्च आदर्श व परम हंसता का उच्च प्रकाश था तथा उनकी कहनी में श्रीस्वामी जी महाराज की सूत्ररूपा वाणी का ही विशद विकास है, उसी की विस्तृत व्याख्या है; जो अति गम्भीर, सरस और सहृदय रसिकजनों के मन को मोहने वाली और आह्लादकारिणी है।\nवृन्दावन की रज की कृपा से उनका मन श्री राधारानी के चरणों में ऐसा रमा कि उन्होंने सारे संसार को पीठ दिखा दी। उनका हृदय श्री स्वामिनी जी की सेवा में एवं अंग-अंग की शोभा निरखने में मानो रम सा गया। उन्होंने स्वयं पद में लिखा है:\n“ मेरे विषै विसन वर वाम, तन गोरी मन भोरी नवल किशोरी राधा नाम॥\nनिस बासर जागत सोवत चितवत अंग अंग अभिराम।\nअंजन मंजन करात परम रूचि चोप चौगुनी काम॥\nताकि हिलगी तजै मैं अपने कर्म धर्म धन धाम।\nदई पीठि सब जगतें लगतें पायो बन विश्राम॥“\nअर्थात जैसे ही उन्होंने जगत को पीठ दिखा कर व वृन्दावन वास कर तन से गोरी और मन से अत्यंत भोरी नवल किशोरीजी श्री राधारानी की शरण ली है एवं राधा नाम धारण किया है, वैसे ही उनके मन ने परम विश्राम पाया है।\nअब वे मान-अभिमान सब त्याग कर केवल ब्रजवासियों के टूक खाकर जीवन निर्वाह करने लगे।\n\"रुचे मोहि ब्रजवासिन के टूक\"\nउन्होंने कई पदों में ब्रजधाम और ब्रजवासियों में अपनी अनन्य निष्ठा व्यक्त की है। एक पद में तो उन्होंने अपने आपको ब्रजवासियों का पालतू पिल्ला तक कहने में संकोच नहीं किया है -\n\"हौं ब्रजवासिन कौ पाल्यो पीला“\nअब वे सदा नित्य विहार के चिंतन में डूबे रहते, श्यामा-श्याम की लीला माधुरी के आस्वादन और उनके गुणगान में मस्त रहते व आहार-विहार, भोजन, स्नानादि सब भूले रहते। उनके जीवन से संबंधित एक बहुत प्रसिद्ध घटना है। एक बार वे यमुना में स्नान करने गए, उनके मुंह में दातुन था। वे तीन दिनों तक सड़क पर खड़े रहे, एक ही पद का गान करते और आनंद में समाहित रहे:\n\"बिहरत लाल-बिहारिन दोऊ श्री जमुना के तीरें तीरें\"\nयुगल सरकार (राधा और कृष्ण) लीला प्रदर्शन कर रहे हैं और यमुना के किनारे विहरण कर रहे हैं।\nउन्होंने स्वयं लिखा है कि कोई भांग के नशे में चूर रहता है कोई अफीम के नशे में, बिहारिन दास जी श्यामा-श्याम की रस माधुरी के नशे में मस्त रहते।\n\"कोऊ मदमाते भांग के, कोउ अमल अफीम,\nश्री बिहारीदास रसमाधुरी, मत्त मुदित तोफीम”\nकुछ दिन बाद स्वामी श्री हरिदास जी महाराज नित्य निकुंज में प्रवेश कर गए व उनके सात दिन बाद श्री विट्ठल विपुल देव जी भी नित्य निकुंज में प्रवेश कर गए। उनके पश्चात तब बिहारिन देव जी संप्रदाय के आचार्य हुए। इस समय उनके ऊपर ज़िम्मेदारी थी - भक्ति और वैराग्य-पूर्ण जीवन के चरण आदर्श की स्थापना के दायित्व को अंगीकार करके साधकों का पथ-प्रदर्शन करना। श्री बिहारिन देव जी ने इस दायित्व को पूरी तरह निभाया। श्री बिहारिन देव जी दीर्घ काल तक संप्रदाय के आचार्य रहे।\nग्रन्थ रचना:\nउनकी वाणी के दो भाग हैं - एक सिद्धान्त पक्ष व दूसरा रस पक्ष। रस पक्ष की वाणी तो उनके अनुभव का उच्छलन है। श्री ललिता जी के अंग-संग सखी रूप में रहकर उन्होंने जैसे अनुभव किया, वह उनके आपूर्ण हृदय से उमड़कर रस की वाणी के रूप में बाहर प्रकट हो गया, जिसका पान करके जिज्ञासु, भावुक एवं रसिक वृन्द अति उत्तम रसिक-अनन्य-परमहंस पदवी को प्राप्त कर लेते हैं। उन्होंने स्वयं कहा है -\nप्याय अधर सुधा महा मधु मत्त मिलि कौतुक कियौ।\nकिये कौ सुख अल्प सखि सुनि कह्यौ भरि उमँग्यौ हियौ॥\nउनके रस के पदों को समझना साधारण साधक की बुद्धि एवं दृष्टि से बहुत भिन्न है। वे उस सर्वोच्च रस में निमग्न थे जहाँ उपास्य और उपासक इतना घुल-मिल जाते हैं कि उपास्य उपासकों को अपने समतुल्य या अपने से बड़ा मान कर उसके अधीन रहने लगता है और उपासक उपास्य से कुछ भी लेने की इच्छा ना रख कर हमेशा उसे देते ही रहते हैं। निरंतर उपास्य के सुख का ध्यान होने के कारण, उनके सुख के लिए उन्हें आशीर्वाद देना चाहते हैं। यही उन्होंने अपने पदों में भी लिखा है:\n\"देत आसीस विहारिनि दासी करहुं नवल नित रलियां“\nकिशोरीजी के चरणों में प्रगाढ़ प्रेम होने के कारण वे बिहारी जी से सदा बेपरवाह रहते और उन्होंने एक पद में इसका वर्णन भी किया है:\n\"किये रहै ऐंड बिहारी हूँ सौं हम बेपरवाह विहारिनि के“\nस्वामी श्री बिहारिन देव जी ने 1670 के लगभग नित्य निकुंज में प्रवेश किया। उनकी समाधि निधिवन में है। उनकी शिष्य परंपरा में स्वामी श्री नागरीदास जी और श्री सरस दास जी प्रधान थे।"])</script><script>self.__next_f.push([1,"f:Tf90,"])</script><script>self.__next_f.push([1,"यह कुछ ही साल पुरानी कथा है । एक सज्जन बरसाना के गहवर वन में घूम रहे थे । बहुत घबराए हुए अपनी मृत पत्नी को 'किशोरी किशोरी' बुलाते हुए जा रहे थे, इतने में राधा रानी अपनी सखीयाँ सहित आ गयी, वो यह नाम सुनकर आचम्भित हुई और ललिता सखी को पूछने लगी, यह कौन है जो मेरा नाम इतनी करुण क्रंदन युक्त ले रहा है।\nसखी उनको समझाने लगी, हे राधा रानी, यह आपको नहीं बुला रहा है, ये अपनी पत्नी किशोरी की मृत्यु से बेचैन है। अकारण करुण श्री राधा प्यारी बोली, हे सखी! यह गहवर वन में ये मेरा ही नाम ले रहा है। उसको मेरे पास बुलाओ। राधा रानी ने उन पर कृपा दृष्टि डाल उनपर कृपा कर दी। यह दिव्य लीला उस सज्जन के साथ ही हुई। और इस लीला को देखते देखते वो मूर्छित हो गए । इसके बाद वो \"किशोरी अली\" नाम से राधा रानी के भक्त बन गए । राधा रानी की अपार कृपा और प्रेम पाकर वो दिव्य शरीर प्राप्त किये और दिव्य लीला में प्रवेश किए । वे गहवर वन में वास किए। किशोरी अली जी की समाधि श्रीकृष्ण कुण्ड [श्री राधा सरोवर]के पास लता- पत्तों के बीच स्थित है । यह भक्तों के लिए एक प्रेरणास्रोत है।\nश्री किशोरी अलि जी का एक प्रसिद्ध पद जिन्हें ब्रज में सभी गाते हैं वह इस प्रकार है:\nआधौ नाम तारिहै राधा |\n'रा' के कहत रोग सब मिटिहैं, 'धा' के कहत मिटै सब बाधा ||\nराधा राधा नाम की महिमा, गावत वेद पुराण अगाधा |\nअलि किशोरी रटौ निरंतर, वेगहि लग जाय भाव समाधा ||\n- श्री अली किशोरी\nराधा नाम का अर्धांश अर्थात 'रा' का रूपध्यान युक्त उच्चारण करते समस्त मानस रोग मिट जाते हैं, ‘धा' कहते ही जीव की समस्त बाधाएं मिट जाती हैं। वेदो और पुरानो में राधा नाम का ही महिमा मंडन है किन्तु वो भी 'नेती नेती' कहकर हार मान जाते है। रसिक संत अलि किशोरी जी कहते हैं राधा नाम का रूप ध्यान युक्त निरंतर रटन करने से जल्द ही भाव समाधि में प्रवेश मिल जाता है।"])</script><script>self.__next_f.push([1,"11:[\"slug\",\"shri-radha-lalitadik-mere-jivani-pran-adhar-sarveshu-vyas-das-ko-van-hai-vrindavanahi-abhar\",\"d\"]\n16:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"content\",\"shri-radha-lalitadik-mere-jivani-pran-adhar-sarveshu-vyas-das-ko-van-hai-vrindavanahi-abhar\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"shri-radha-lalitadik-mere-jivani-pran-adhar-sarveshu-vyas-das-ko-van-hai-vrindavanahi-abhar\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"shri-radha-lalitadik-mere-jivani-pran-adhar-sarveshu-vyas-das-ko-van-hai-vrindavanahi-abhar\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"shri-radha-lalitadik-mere-jivani-pran-adhar-sarveshu-vyas-das-ko-van-hai-vrindavanahi-abhar\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"मुख्यपृष्ठ\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"पुस्तकालय\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"श्री राधा ललितादिक मेरे जीवनी प्राण आधार, सर्वेषु व्यास दास को वन है वृन्दावनहि अभार ||\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content/shri-radha-lalitadik-mere-jivani-pran-adhar-sarveshu-vyas-das-ko-van-hai-vrindavanahi-abhar\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-6xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L7\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[[\"$\",\"$L7\",null,{\"href\":\"/hi/content\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"पुस्तकालय\"}],[\"$\",\"span\",null,{\"children\":\"→\"}]],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"श्री राधा ललितादिक मेरे जीवनी प्राण आधार, सर्वेषु व्यास दास को वन है वृन्दावनहि अभार ||\"}]]}],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-551\",\"title\":\"श्री राधा ललितादिक मेरे जीवनी प्राण आधार, सर्वेषु व्यास दास को वन है वृन्दावनहि अभार ||\",\"category\":\"Katha\",\"sanskrit_text\":\"श्री राधा ललितादिक मेरे जीवनी प्राण आधार,सर्वेषु व्यास दास को वन है वृन्दावनहि अभार ||\",\"hindi_text\":\"श्री राधा ललितादिक मेरे जीवनी प्राण आधार,\\nसर्वेषु व्यास दास को वन है वृन्दावनहि अभार ||\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी\\nश्री राधा और ललिता आदि उनकी साखियां मेरे जीवन का प्राण हैं। विशाखा अवतार श्री हरिराम व्यास का कहना है, श्री वृंदावन की महिमा अपरम्पार है जहां वह हर पल उपस्थित हैं ।\",\"english_text\":null,\"english_translation\":\"Shri Radha Lalitadik Mere Jeevani Praan Aadhar,\\nSarveshu Vyaas Das Ko Van Hai, Vrindavanhi Abhaar\\\"\\n- His Holiness Shri Hariram Vyas (Vishakha Avtaar) - Vyas Vaani\\nShri Radha and her sakhis like Lalita are the treasure of my life. Shri Hariram Vyas descencion of Vishakha sakhi says, All glories to Shri Vrindavan, the place where she is present every moment.\",\"description\":\"https://www.brajrasik.org/hi/articles/5acbcf039f7ab760360f9c26/shri-radha-lalitadik-mere-jeevani-praan-aadhar-quote-by-shri-hariram-vyas\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी\",\"status\":\"published\",\"content_text\":\"श्री राधा ललितादिक मेरे जीवनी प्राण आधार,\\nसर्वेषु व्यास दास को वन है वृन्दावनहि अभार ||\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी\\nश्री राधा और ललिता आदि उनकी साखियां मेरे जीवन का प्राण हैं। विशाखा अवतार श्री हरिराम व्यास का कहना है, श्री वृंदावन की महिमा अपरम्पार है जहां वह हर पल उपस्थित हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5acbcf039f7ab760360f9c26/shri-radha-lalitadik-mere-jeevani-praan-aadhar-quote-by-shri-hariram-vyas\",\"slug\":\"shri-radha-lalitadik-mere-jivani-pran-adhar-sarveshu-vyas-das-ko-van-hai-vrindavanahi-abhar\"},\"initialRelatedSaint\":{\"name\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, पूर्वार्ध (104)\",\"hinglishName\":\"shri hariram vyas (vishakha avatara) vyas vani, purvardh (104)\",\"slug\":\"shri-hariram-vyas-vishakha-avatara-vyas-vani-purvardh-104\",\"biography\":\"\",\"metadata\":{\"lineageEn\":\"Vaishnav Rasik Tradition (Haritrayi)\",\"lineageHi\":\"वैष्णव रसिक परंपरा (हरित्रयी)\",\"timelineEn\":\"1510–1612 AD\",\"timelineHi\":\"1510–1612 ईस्वी\",\"associatedPlacesEn\":\"Vyas Ghera, Vrindavan\",\"associatedPlacesHi\":\"व्यास घेरा, वृंदावन\",\"discipleOfEn\":\"Shri Madhavdas Bhatta (disciple of Hit Harivansh)\",\"discipleOfHi\":\"श्री माधवदास भट्ट जी (हित हरिवंश महाप्रभु के शिष्य)\",\"influencedByEn\":\"Swami Haridas and Shri Hit Harivansh Mahaprabhu (forming the Haritrayi)\",\"influencedByHi\":\"स्वामी हरिदास एवं श्री हित हरिवंश महाप्रभु (हरित्रयी परंपरा)\",\"associatedSampradayaEn\":\"Radhavallabh / Haritrayi Tradition\",\"associatedSampradayaHi\":\"राधावल्लभ / हरित्रयी परंपरा\",\"devotionalMoodEn\":\"Humility, Raganuga Bhakti, Sakhi Bhava\",\"devotionalMoodHi\":\"परम विनम्रता, रागानुगा भक्ति, सखी भाव\",\"teachingsEn\":\"Emphasized pure, unadorned devotion based on absolute humility, rejection of caste pride, and criticism of ritualistic hypocrisy. Believed that only a humble heart can experience the sweet nectar of Vrindavan.\",\"teachingsHi\":\"जाति-पाति के अभिमान का त्याग, बाह्य कर्मकांडों का विरोध और परम विनम्रता पर आधारित भक्ति। उनका मानना था कि केवल अहंकार रहित हृदय ही वृंदावन रस का अधिकारी है।\",\"literaryStyleEn\":\"Author of Vyas Vani (व्यास वाणी), written in bold, direct Braj Bhasha. His verses contain both ecstatic descriptions of the Divine Couple and sharp, instructional remarks on behavior and sincerity.\",\"literaryStyleHi\":\"'Vyas Vani' के रचयिता, जो अपनी स्पष्टवादिता और ठेठ ब्रजभाषा के लिए जानी जाती है। इनके पदों में लीला रस के साथ-साथ साधकों के लिए व्यावहारिक उपदेश भी प्रचुरता में हैं।\",\"biographyEn\":\"Shri Hariram Vyas, affectionately known as Vyas Ji, was a prominent contemporary of Swami Haridas and Hit Harivansh Mahaprabhu. Together, these three saints are celebrated as the \\\"Haritrayi\\\" (spiritual triad) of Vrindavan, who established the foundations of Rasik theology. Born in Orchha, Madhya Pradesh, Hariram Vyas left his high royal position and vast scholarship to live as a humble beggar in the dust of Vrindavan. He established his ashram at Vyas Ghera and worshiped the deity of Jugal Kishor Ji. His writings are famously candid, warning devotees against spiritual vanity and urging them to seek the shelter of true saintly association (Sadhu Sanga).\",\"biographyHi\":\"श्री हरिराम व्यास (व्यास जी) वृंदावन के ऐतिहासिक त्रिमूर्ति 'हरित्रयी' के तीसरे स्तम्भ थे। वे ओरछा के एक प्रतिष्ठित विद्वान थे, परंतु सब कुछ त्यागकर वृंदावन की धूल में आ बसे। उन्होंने व्यास घेरा में रहकर युगल किशोर जी की सेवा की। व्यास जी अपनी बेबाक और स्पष्ट टिप्पणियों के लिए प्रसिद्ध थे। उन्होंने संतों के प्रति अपराध और वैष्णवों में आपसी भेद का कड़ा विरोध किया और सरल प्रेम मार्ग को ही सर्वोत्तम बताया।\",\"relatedSaints\":[{\"nameEn\":\"Swami Haridas\",\"nameHi\":\"स्वामी हरिदास\",\"slug\":\"haridas\"},{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"}],\"relatedGranthas\":[{\"nameEn\":\"Vyas Vani\",\"nameHi\":\"व्यास वाणी\",\"slug\":\"vyas-vani\"}],\"associatedGlossary\":[{\"termEn\":\"Sadhana\",\"termHi\":\"साधना\",\"slug\":\"sadhana\"},{\"termEn\":\"Saranagati\",\"termHi\":\"शरणागति\",\"slug\":\"saranagati\"},{\"termEn\":\"Braj Bhasha\",\"termHi\":\"ब्रजभाषा\",\"slug\":\"braj-bhasha\"}],\"faq\":[{\"qEn\":\"Where is Vyas Ghera located?\",\"aEn\":\"Vyas Ghera is located in Vrindavan near the Yamuna river, serving as the historical bhajan site and samadhi of Hariram Vyas Ji.\",\"qHi\":\"व्यास घेरा कहाँ स्थित है?\",\"aHi\":\"व्यास घेरा वृंदावन में यमुना नदी के समीप स्थित है, जो हरीराम व्यास जी की भजन स्थली और उनकी समाधि स्थली है।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-84\",\"title\":\"हम कब होहिंगे ब्रजवासी\",\"category\":\"Shloka\",\"sanskrit_text\":\"हम कब होहिंगे ब्रजवासी।ठाकुर नंदकिशोर हमारे, ठकुराइनि राधा सी।।कब मिलि हैं वे सखी सहेली, हरिवंशी हरिदासी।वंशीवट की शीतल छहियाँ, सुभग नदी जमुना सी।।जाकी वैभव करत लालसा, कर-मीत कमलासी।इतनी आस व्यास की पुजवहु वृन्दाविपिन विलासी |\",\"hindi_text\":\"$a\",\"english_text\":null,\"english_translation\":\"(Raag Sarang)\\nHum Kab Hoinge Brajwasi,\\nThakur Yugal Kishor Humare Thakurani Radha Si,\\nKab Mili Hain Ve Sakhi Saheli Harivanshi Haridasi,\\nBanshivata Ki Sheetal Chahiyan, Subhag Nadi Yamunasi,\\nJaaki Vaibhav Karata Lalsa, Kar Meeta Kamla Si,\\nItni Aas Vyas Ki Pujvahu, Vrindavipin Vilasi.\\n-Shri Hariram Vyas (Vishakha Avtaar) - From Vyas Vani, Purvardh (104)\\nWhen will we become true Brajwasis (i.e residents of Braj), since Shri Nand Kishor is our master, and our Queen is one and only Shri Radha rani. When will we meet our dearest sakhi friends like Harivanshi (Hita Sakhi) and Haridasi (Lalita sakhi). When will we dwell in Banshivat, sit under Banshivat shade where nearby charming Yamuna is flowing. The same land which is always desired by Goddess like Maha lakshmi and she is humbly standing to get access to this divine land by holding both the hands pressed together. Shri Hariram Vyas incarnation of Shri Vishakha sakhi says, my only desire is to remain in this land called \\\"Vrindavan\\\" and serve it incessantly!\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0906ff9f7ab760360f9c5f/hum-kab-hohinge-brajwasi-shri-hariram-vyas-vishakha-avtaar-from-vyas-vani\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, पूर्वार्ध (104)\",\"status\":\"published\",\"content_text\":\"$b\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0906ff9f7ab760360f9c5f/hum-kab-hohinge-brajwasi-shri-hariram-vyas-vishakha-avtaar-from-vyas-vani\",\"slug\":\"ham-kab-hohinge-brajavasi\"}],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-131\",\"title\":\"श्री विठ्ठल विपुल जी की जीवनी\",\"category\":\"Katha\",\"sanskrit_text\":\"श्री विठ्ठल विपुल जी\",\"hindi_text\":\"का जन्म 1532 में वृन्दावन के राजपुर गांव (परिक्रमा मार्ग के बगल में) हुआ था। बचपन से ही वह मायिक विकारों से रहित थे और उनकी राधा कृष्ण और स्वामी श्री हरिदास जी के प्रति श्रद्धा थी। जन्म तिथि के अनुसार श्री स्वामी विठ्ठल विपुल देव जी स्वामी हरिदासजी से 5 साल बड़े थे और उनके पहले शिष्य थे। स्वामी श्री हरिदास जी के सहयोग से उन्होंने निधि वन में श्री राधा-कृष्ण के दर्शन किये और उनका जीवन धन्य हो गया। जब स्वामी श्री हरिदास जी ने निकुंज में प्रवेश किया तो श्री विठ्ठल विपुलदेव जी को गहरी पीड़ा हुई और उन्होंने कुछ भी न देखने की इच्छा से अपने आंखों पर एक पट्टी बांध दी । कुछ रसिकों द्वारा रास की व्यवस्था की गईं और ऐसा माना जाता है कि श्री राधा ने उन्हें आंखें खोलने के लिए कहा और जिस क्षण उन्होंने ऐसा किया, उन्होंने श्री राधारानी को देखा। श्री विठ्ठल विपुल देव जी ने प्रियाजी से प्रार्थना की कि वह उनका हाथ न छोड़ें और उन्हें हमेशा अपने साथ रखें। अपने शरीर को छोड़कर वह उनके साथ चले गए। ऐसा माना जाता है कि श्री राधारानी ने उनके शरीर को सखी स्वरुप में बदल दिया।\",\"english_text\":null,\"english_translation\":\"was born in Rajpur Village, Vrindavan in 1532, next to the parikrama path. Since childhood, he was devoid of worldly desires and had a great devotion to Radha Krishn and Swami Shri Haridas Ji.\\nAs per birth dates Sri Swami Vitthal Vipul Dev ji was 5 years elder to Swami Haridasji and was his first disciple. With the association of Swami Shri Haridas Ji, he had a vision of Shri Radha-Krishna at Nidhi Van and his life was blessed. When Swami Shri Haridas Ji entered Nikunja, Shri Vipuldev ji was deeply pained and tied a bandage on his eyes. Several rasiks arranged for the Raas and it is believed that Shri Radha asked him to open the eyes and the moment he did so, he saw Shri Radharani. Sri Vithul Vipul Dev ji prayed to Priyaji not to leave his hand and to always keep him with her always. Leaving his body he became one with her. It is believed that Shri Radharani transformed his body in sakhi swaroop.\",\"description\":\"https://www.brajrasik.org/hi/articles/59690c3c1350677a49620721/shri-vitthal-vipul-dev-ji-rasik-saint-of-vrindavan\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"श्री विठ्ठल विपुल जी\\nका जन्म 1532 में वृन्दावन के राजपुर गांव (परिक्रमा मार्ग के बगल में) हुआ था। बचपन से ही वह मायिक विकारों से रहित थे और उनकी राधा कृष्ण और स्वामी श्री हरिदास जी के प्रति श्रद्धा थी। जन्म तिथि के अनुसार श्री स्वामी विठ्ठल विपुल देव जी स्वामी हरिदासजी से 5 साल बड़े थे और उनके पहले शिष्य थे। स्वामी श्री हरिदास जी के सहयोग से उन्होंने निधि वन में श्री राधा-कृष्ण के दर्शन किये और उनका जीवन धन्य हो गया। जब स्वामी श्री हरिदास जी ने निकुंज में प्रवेश किया तो श्री विठ्ठल विपुलदेव जी को गहरी पीड़ा हुई और उन्होंने कुछ भी न देखने की इच्छा से अपने आंखों पर एक पट्टी बांध दी । कुछ रसिकों द्वारा रास की व्यवस्था की गईं और ऐसा माना जाता है कि श्री राधा ने उन्हें आंखें खोलने के लिए कहा और जिस क्षण उन्होंने ऐसा किया, उन्होंने श्री राधारानी को देखा। श्री विठ्ठल विपुल देव जी ने प्रियाजी से प्रार्थना की कि वह उनका हाथ न छोड़ें और उन्हें हमेशा अपने साथ रखें। अपने शरीर को छोड़कर वह उनके साथ चले गए। ऐसा माना जाता है कि श्री राधारानी ने उनके शरीर को सखी स्वरुप में बदल दिया।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59690c3c1350677a49620721/shri-vitthal-vipul-dev-ji-rasik-saint-of-vrindavan\",\"slug\":\"shri-viththal-vipul-ji-ki-jivani\"},{\"id\":\"local-224\",\"title\":\"जीवनी श्री बिहारिन दास\",\"category\":\"Katha\",\"sanskrit_text\":\"जन्म:\",\"hindi_text\":\"$c\",\"english_text\":null,\"english_translation\":\"$d\",\"description\":\"https://www.brajrasik.org/hi/articles/59fb836659e8c72a534d85d1/shri-biharin-dev-rasik-saint-of-vrindavan\",\"author\":\"युगल सरकार (राधा और कृष्ण) लीला प्रदर्शन कर रहे हैं और यमुना के किनारे विहरण कर रहे हैं।\",\"status\":\"published\",\"content_text\":\"$e\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59fb836659e8c72a534d85d1/shri-biharin-dev-rasik-saint-of-vrindavan\",\"slug\":\"jivani-shri-biharin-dasa\"},{\"id\":\"local-264\",\"title\":\"श्री किशोरी अली जी की जीवनी : ब्रज के रसिक संत\",\"category\":\"Katha\",\"sanskrit_text\":\"आधौ नाम तारिहै राधा |'रा' के कहत रोग सब मिटिहैं, 'धा' के कहत मिटै सब बाधा ||राधा राधा नाम की महिमा, गावत वेद पुराण अगाधा |अलि किशोरी रटौ निरंतर, वेगहि लग जाय भाव समाधा ||\",\"hindi_text\":\"राधा नाम का अर्धांश अर्थात 'रा' का रूपध्यान युक्त उच्चारण करते समस्त मानस रोग मिट जाते हैं, ‘धा' कहते ही जीव की समस्त बाधाएं मिट जाती हैं। वेदो और पुरानो में राधा नाम का ही महिमा मंडन है किन्तु वो भी 'नेती नेती' कहकर हार मान जाते है। रसिक संत अलि किशोरी जी कहते हैं राधा नाम का रूप ध्यान युक्त निरंतर रटन करने से जल्द ही भाव समाधि में प्रवेश मिल जाता है।\",\"english_text\":null,\"english_translation\":\"Only half of the name Radha is sufficient to cross the bondage of maya. Simply by vibrating the sound ‘Ra’, to which if we recite, then all of the mental illnesses get cured, while reciting 'dha', all of the impediments get perished.\\nThe glories of Radha's name have been ornamented in Scriptures, however, all these scriptures also bow down saying 'non-ending non-ending ' the Radha-name. Rasik Saint Ali Kishori says, reciting Radha-name while doing the remembrance of Radha, one can very easily enter into an evolved stage of divine consciousness.\",\"description\":\"https://www.brajrasik.org/hi/articles/59398ed28c96df553692f9d0/shri-kishori-ali-rasik-saint-of-braj\",\"author\":\"श्री अली किशोरी\",\"status\":\"published\",\"content_text\":\"$f\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59398ed28c96df553692f9d0/shri-kishori-ali-rasik-saint-of-braj\",\"slug\":\"s

\\\",\\\"position\\\":2,\\\"name\\\":\\\"पुस्तकालय\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"स्वामिनी कब यौं तुम्हे लड़ाऊँ\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content/svamini-kab-yaun-tumhe-laaun\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-6xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[[\"$\",\"$L6\",null,{\"href\":\"/hi/content\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"पुस्तकालय\"}],[\"$\",\"span\",null,{\"children\":\"→\"}]],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"स्वामिनी कब यौं तुम्हे लड़ाऊँ\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialContent\":{\"id\":\"local-37\",\"title\":\"स्वामिनी कब यौं तुम्हे लड़ाऊँ\",\"category\":\"Shloka\",\"sanskrit_text\":\"स्वामिनी कब यौं तुम्हे लड़ाऊँ,सटकारे कारे केशनी में, सुरभित तेल लगाऊं ||\",\"hindi_text\":\"श्री राधे, ऐसा कब होगा कि आपकी प्रेम पूर्वक मैं सेवा और लाड़ लड़ाउंगी और आपके चिकने और लम्बे कारे केशों में सुगन्धित तेल लगाउंगी ?\",\"english_text\":null,\"english_translation\":\"Oh Shri Radhey Ju, When will that day come, when I will lovingly serve you and apply aromatic oil in your long black hairs!\",\"description\":\"https://www.brajrasik.org/hi/articles/5b66990ef96927004faaba74/swamini-kab-yon-tumhe-ladaun-shri-kishori-ali-kishori-ali-granthwali\",\"author\":\"श्री अली किशोरी, श्री किशोरी अली ग्रंथवाली\",\"status\":\"published\",\"content_text\":\"स्वामिनी कब यौं तुम्हे लड़ाऊँ,\\nसटकारे कारे केशनी में, सुरभित तेल लगाऊं ||\\n- श्री अली किशोरी, श्री किशोरी अली ग्रंथवाली\\nश्री राधे, ऐसा कब होगा कि आपकी प्रेम पूर्वक मैं सेवा और लाड़ लड़ाउंगी और आपके चिकने और लम्बे कारे केशों में सुगन्धित तेल लगाउंगी ?\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b66990ef96927004faaba74/swamini-kab-yon-tumhe-ladaun-shri-kishori-ali-kishori-ali-granthwali\",\"slug\":\"svamini-kab-yaun-tumhe-laaun\"},\"initialRelatedSaint\":{\"name\":\"श्री अली किशोरी\",\"hinglishName\":\"shri ali kishori\",\"slug\":\"shri-ali-kishori\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-16\",\"title\":\"आधौ नाम तारिहै राधा\",\"category\":\"Shloka\",\"sanskrit_text\":\"आधौ नाम तारिहै राधा |'रा' के कहत रोग सब मिटिहैं, 'धा' के कहत मिटै सब बाधा ||राधा राधा नाम की महिमा, गावत वेद पुराण अगाधा |अलि किशोरी रटौ निरंतर, वेगहि लग जाय भाव समाधा ||\",\"hindi_text\":\"राधा नाम का अर्धांश अर्थात 'रा' का रूपध्यान युक्त उच्चारण करते समस्त मानस रोग मिट जाते हैं, ‘धा' कहते ही जीव की समस्त बाधाएं मिट जाती हैं। वेदो और पुरानो में राधा नाम का ही महिमा मंडन है किन्तु वो भी 'नेती नेती' कहकर हार मान जाते है। रसिक संत अलि किशोरी जी कहते हैं राधा नाम का रूप ध्यान युक्त निरंतर रटन करने से जल्द ही भाव समाधि में प्रवेश मिल जाता है।\",\"english_text\":null,\"english_translation\":\"Only half of the name Radha is sufficient to cross the bondage of maya. Simply by vibrating the sound ‘Ra’, to which if we recite, then all of the mental illnesses get cured, while reciting 'dha', all of the impediments get perished.\\nThe glories of Radha's name have been ornamented in Scriptures, however, all these scriptures also bow down saying 'non-ending non-ending ' the Radha-name. Rasik Saint Ali Kishori says, reciting Radha-name while doing the remembrance of Radha, one can very easily enter into an evolved stage of divine consciousness.\",\"description\":\"https://www.brajrasik.org/hi/articles/5919d61411ec2c04484ec009/aadhau-naam-taarihai-radha-pad-written-by-shri-ali-kishori\",\"author\":\"श्री अली किशोरी\",\"status\":\"published\",\"content_text\":\"आधौ नाम तारिहै राधा |\\n'रा' के कहत रोग सब मिटिहैं, 'धा' के कहत मिटै सब बाधा ||\\nराधा राधा नाम की महिमा, गावत वेद पुराण अगाधा |\\nअलि किशोरी रटौ निरंतर, वेगहि लग जाय भाव समाधा ||\\n- श्री अली किशोरी\\nराधा नाम का अर्धांश अर्थात 'रा' का रूपध्यान युक्त उच्चारण करते समस्त मानस रोग मिट जाते हैं, ‘धा' कहते ही जीव की समस्त बाधाएं मिट जाती हैं। वेदो और पुरानो में राधा नाम का ही महिमा मंडन है किन्तु वो भी 'नेती नेती' कहकर हार मान जाते है। रसिक संत अलि किशोरी जी कहते हैं राधा नाम का रूप ध्यान युक्त निरंतर रटन करने से जल्द ही भाव समाधि में प्रवेश मिल जाता है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5919d61411ec2c04484ec009/aadhau-naam-taarihai-radha-pad-written-by-shri-ali-kishori\",\"slug\":\"adhau-nam-tarihai-radha\"},{\"id\":\"local-197\",\"title\":\"हम श्री राधा महारानी जू के बल अभिमानी\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ हम श्री राधा महारानी जू के बल अभिमानी,किशोरी अली निवास हमारो, श्री वृन्दावन रजधानी || ”\",\"hindi_text\":\"हम सदा ही श्री किशोरी जी के बल के अभिमानी हैं। हमारा मन सदैव प्रिय प्रियतम के निज महल वृन्दावन में रहता है, जो कि रसिक संतों और युगल सरकार की राजधानी है।\",\"english_text\":null,\"english_translation\":\"Our only strength is Shri Radha and we are proud of it. We eternally dwell in Vrindavan which is the capital city of Rasik Saints and the Divine Couple.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4ecfd859e8c72a534d86d3/hum-shri-radha-maharani-ju-ke-bal-abhimani-kishori-ali-nivaas-humaro-shri-vrindavan-rajdhani-shri-kishori-ali\",\"author\":\"श्री अली किशोरी\",\"status\":\"published\",\"content_text\":\"“ हम श्री राधा महारानी जू के बल अभिमानी,\\nकिशोरी अली निवास हमारो, श्री वृन्दावन रजधानी || ”\\n- श्री अली किशोरी\\nहम सदा ही श्री किशोरी जी के बल के अभिमानी हैं। हमारा मन सदैव प्रिय प्रियतम के निज महल वृन्दावन में रहता है, जो कि रसिक संतों और युगल सरकार की राजधानी है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4ecfd859e8c72a534d86d3/hum-shri-radha-maharani-ju-ke-bal-abhimani-kishori-ali-nivaas-humaro-shri-vrindavan-rajdhani-shri-kishori-ali\",\"slug\":\"ham-shri-radha-maharani-ju-ke-bal-abhimani\"},{\"id\":\"local-264\",\"title\":\"श्री किशोरी अली जी की जीवनी : ब्रज के रसिक संत\",\"category\":\"Katha\",\"sanskrit_text\":\"आधौ नाम तारिहै राधा |'रा' के कहत रोग सब मिटिहैं, 'धा' के कहत मिटै सब बाधा ||राधा राधा नाम की महिमा, गावत वेद पुराण अगाधा |अलि किशोरी रटौ निरंतर, वेगहि लग जाय भाव समाधा ||\",\"hindi_text\":\"राधा नाम का अर्धांश अर्थात 'रा' का रूपध्यान युक्त उच्चारण करते समस्त मानस रोग मिट जाते हैं, ‘धा' कहते ही जीव की समस्त बाधाएं मिट जाती हैं। वेदो और पुरानो में राधा नाम का ही महिमा मंडन है किन्तु वो भी 'नेती नेती' कहकर हार मान जाते है। रसिक संत अलि किशोरी जी कहते हैं राधा नाम का रूप ध्यान युक्त निरंतर रटन करने से जल्द ही भाव समाधि में प्रवेश मिल जाता है।\",\"english_text\":null,\"english_translation\":\"Only half of the name Radha is sufficient to cross the bondage of maya. Simply by vibrating the sound ‘Ra’, to which if we recite, then all of the mental illnesses get cured, while reciting 'dha', all of the impediments get perished.\\nThe glories of Radha's name have been ornamented in Scriptures, however, all these scriptures also bow down saying 'non-ending non-ending ' the Radha-name. Rasik Saint Ali Kishori says, reciting Radha-name while doing the remembrance of Radha, one can very easily enter into an evolved stage of divine consciousness.\",\"description\":\"https://www.brajrasik.org/hi/articles/59398ed28c96df553692f9d0/shri-kishori-ali-rasik-saint-of-braj\",\"author\":\"श्री अली किशोरी\",\"status\":\"published\",\"content_text\":\"$9\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59398ed28c96df553692f9d0/shri-kishori-ali-rasik-saint-of-braj\",\"slug\":\"shri-kishori-ali-ji-ki-jivani-braj-ke-rasik-snta\"}],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"lang\":\"hi\",\"children\":[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]}]],null],null]},[[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/cbf73327883ccb7f.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/fe995a1e4635138b.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"2\",{\"rel\":\"styleshe

ishna.\\n\\\"Hansani dasana driga fansani gansani asa,rasani na kasa balihaar.”\\nWho will not sacrifice himself completely after seeing Their sweet smile and piercing glances?\\n\\\"Dei sarabasa barabasa rasa basa hvei, basa rasa raasa majhaar.\\\"\\nThose, who have sacrificed themselves to Their infinite nectar of divine love, attain the supreme bliss of Maharas.\\n\\\"Jita ‘Kripalu' chitavati tita tinahina, chitavati gati mati haar.\\\"\\nIn the Words of Jagadguru Shri Kripalu Ji Maharaj these devotees see only Shri Radha and Shri Krishna everywhere. This is because their minds become completely drenched with their divine love.\\n- Prem Ras Madira, Jagadguru Shri Kripalu Ji Maharaj\",\"author\":{\"@type\":\"Person\",\"name\":\"जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:T47f,Both Shri Radha and Shri Krishna dwell permanently in my heart.\n\"Garabaanheen deene rang bheene, chheene chhavi shringaar.\"\nWhen they walk in the intoxication of love putting their arms around each other, they look so beautiful as if they are embarrassing even personification beauty and adornment itself.\n\"Rasa murali ne asa sukha deene, keene basa brajnaar.\"\nThe sweet melody of Shri Krishna’s flute enchanted the Gopis so much that their hearts were entirely captured by Lord Krishna.\n\"Hansani dasana driga fansani gansani asa,rasani na kasa balihaar.”\nWho will not sacrifice himself completely after seeing Their sweet smile and piercing glances?\n\"Dei sarabasa barabasa rasa basa hvei, basa rasa raasa majhaar.\"\nThose, who have sacrificed themselves to Their infinite nectar of divine love, attain the supreme bliss of Maharas.\n\"Jita ‘Kripalu' chitavati tita tinahina, chitavati gati mati haar.\"\nIn the Words of Jagadguru Shri Kripalu Ji Maharaj these devotees see only Shri Radha and Shri Krishna everywhere. This is because their minds become completely drenched with their divine love.\n- Prem Ras Madira, Jagadguru Shri Kripalu Ji Maharajc:[\"slug\",\"base-re-mere-nainan-dou-sarakara\",\"d\"]\n11:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"content\",\"base-re-mere-nainan-dou-sarakara\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"base-re-mere-nainan-dou-sarakara\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"base-re-mere-nainan-dou-sarakara\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"base-re-mere-nainan-dou-sarakara\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"मुख्यपृष्ठ\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"पुस्तकालय\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"बसे रे मेरे, नैनन दोउ सरकार\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content/base-re-mere-nainan-dou-sarakara\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-6xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L7\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[[\"$\",\"$L7\",null,{\"href\":\"/hi/content\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"पुस्तकालय\"}],[\"$\",\"span\",null,{\"children\":\"→\"}]],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"बसे रे मेरे, नैनन दोउ सरकार\"}]]}],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-464\",\"title\":\"बसे रे मेरे, नैनन दोउ सरकार\",\"category\":\"Shloka\",\"sanskrit_text\":\"बसे रे मेरे, नैनन दोउ सरकार |गरबाहीं दीने रँग – भीने, छीने छवि – श्रृंगार |रस मुरली ने अस सुख दीने, कीने बस ब्रजनार |हँसनि दसन, दृग फँसनि गँसनि अस, रसनि कस न बलिहार |दै सरबस बरबस रस – बस ह्वै, बस रस – रास मझार |जित ‘कृपालु’ चितवति तित तिनहिंन, चितवति गति – मतिहार ||\",\"hindi_text\":\"भावार्थ – मेरी आँखों में युगल – सरकार बस गये हैं। परस्पर गलबाहीं दिये हुए प्रेम रस सराबोर छवि एवं श्रृंगार की भी छवि को चुरा रहे हैं। मधुर मुरली की सुरीली तान ने ब्रजांगनाओं को इतना सुख दिया है कि वे सब आत्मविस्मृत हैं। उनके मन्द – मन्द हँसने एवं नुकीले नेत्रों के कटाक्ष के रस के वशीभूत होकर ऐसा कौन जीव है जो उस रस में बलिहार न जाय। जो बलिहार गया, अपना सर्वस्व समर्पित कर दिया, पुन: युगल सरकार के कृपाकटाक्ष से उस रस के वशीभूत हो सर्वदा नित्य रास में अलौकिक रस पाता है। ‘श्री कृपालु जी’ कहते हैं सखी जिस ओर भी देखती हैं श्यामसुन्दर एवं किशोरी जी को देखती हैं और मन – बुद्धि से जगत् की चेतना से परे दिव्य चेतना युक्त रसपान करती हैं।\",\"english_text\":null,\"english_translation\":\"$a\",\"description\":\"https://www.brajrasik.org/hi/articles/59d2b12059e8c72a534d85c9/-base-re-mere-nainan-dou-sarkar-pada-by-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा\",\"status\":\"published\",\"content_text\":\"बसे रे मेरे, नैनन दोउ सरकार |\\nगरबाहीं दीने रँग – भीने, छीने छवि – श्रृंगार |\\nरस मुरली ने अस सुख दीने, कीने बस ब्रजनार |\\nहँसनि दसन, दृग फँसनि गँसनि अस, रसनि कस न बलिहार |\\nदै सरबस बरबस रस – बस ह्वै, बस रस – रास मझार |\\nजित ‘कृपालु’ चितवति तित तिनहिंन, चितवति गति – मतिहार ||\\n- जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा\\nभावार्थ – मेरी आँखों में युगल – सरकार बस गये हैं। परस्पर गलबाहीं दिये हुए प्रेम रस सराबोर छवि एवं श्रृंगार की भी छवि को चुरा रहे हैं। मधुर मुरली की सुरीली तान ने ब्रजांगनाओं को इतना सुख दिया है कि वे सब आत्मविस्मृत हैं। उनके मन्द – मन्द हँसने एवं नुकीले नेत्रों के कटाक्ष के रस के वशीभूत होकर ऐसा कौन जीव है जो उस रस में बलिहार न जाय। जो बलिहार गया, अपना सर्वस्व समर्पित कर दिया, पुन: युगल सरकार के कृपाकटाक्ष से उस रस के वशीभूत हो सर्वदा नित्य रास में अलौकिक रस पाता है। ‘श्री कृपालु जी’ कहते हैं सखी जिस ओर भी देखती हैं श्यामसुन्दर एवं किशोरी जी को देखती हैं और मन – बुद्धि से जगत् की चेतना से परे दिव्य चेतना युक्त रसपान करती हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59d2b12059e8c72a534d85c9/-base-re-mere-nainan-dou-sarkar-pada-by-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"base-re-mere-nainan-dou-sarakara\"},\"initialRelatedSaint\":{\"name\":\"जगद्गुरु श्री कृपालु  महाराज, प्रेम रस मदिरा, रसिया  माधुरी (15)\",\"hinglishName\":\"jagadguru shri kripalu maharaj, prem ras madira, rasiya madhuri (15)\",\"slug\":\"jagadguru-shri-kripalu-maharaj-prem-ras-madira-rasiya-madhuri-15\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-13\",\"title\":\"रसिकन की गति रसिकन जाने | कह कृपालु यह दिव्य विषय किमी\",\"category\":\"Shloka\",\"sanskrit_text\":\"रसिकन की गति रसिकन जाने |कह कृपालु यह दिव्य विषय किमी, जाने विषय रस साने ||\",\"hindi_text\":\"रसिकन की गति रसिकन जाने |\\nकह कृपालु यह दिव्य विषय किमी, जाने विषय रस साने ||\\n- जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा, रसिया - माधुरी (15)\\nरसिक संत की गति केवल रसिक ही जानते हैं। जगद्गुरु श्री कृपालु जी महाराज कहते हैं कि रसिक संतों की बातें, आचरण दिव्य होते हैं, साधारण जीव जो विषय भोग करते हैं, वो कैसे समझ सकते हैं?\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5b8baae65a23dd00503fc868/rasikan-ki-gati-rasikan-jaane-kah-kripalu-yah-divy-vishay-kimi-prem-ras-madira-rasiya-madhuri-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा, रसिया  माधुरी (15)\",\"status\":\"published\",\"content_text\":\"रसिकन की गति रसिकन जाने |\\nकह कृपालु यह दिव्य विषय किमी, जाने विषय रस साने ||\\n- जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा, रसिया - माधुरी (15)\\nरसिक संत की गति केवल रसिक ही जानते हैं। जगद्गुरु श्री कृपालु जी महाराज कहते हैं कि रसिक संतों की बातें, आचरण दिव्य होते हैं, साधारण जीव जो विषय भोग करते हैं, वो कैसे समझ सकते हैं?\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b8baae65a23dd00503fc868/rasikan-ki-gati-rasikan-jaane-kah-kripalu-yah-divy-vishay-kimi-prem-ras-madira-rasiya-madhuri-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"rasikan-ki-gati-rasikan-jane-kah-kripalu-yah-divy-vishay-kimi\"}],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$Lb\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$c\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Ld\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Lb\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$

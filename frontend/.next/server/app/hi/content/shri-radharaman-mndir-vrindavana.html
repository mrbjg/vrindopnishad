7951b7dfbe773fa.js\",\"4785\",\"static/chunks/4785-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"Clie"])</script><script>self.__next_f.push([1,"ntProviders\"]\n12:I[1060,[],\"\"]\n6:T1995,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"श्री  राधारमण मंदिर, वृंदावन\",\"description\":\"https://www.brajrasik.org/hi/articles/5ab512be9f7ab760360f9c07/shri-radharaman-temple-vrindavan\",\"articleBody\":\"इतिहास:\\nतीस वर्ष की आयु में, श्री गोपाल भट्ट गोस्वामी वृंदावन आए। चैतन्य महाप्रभु के चले जाने के बाद, श्री गोपाल भट्ट गोस्वामी भगवान से गहन अलगाव महसूस करते थे। भगवान ने श्री गोपाल भट्ट गोस्वामी को एक सपने में निर्देश दिया कि \\\"यदि आप मेरा दर्शन चाहते हैं तो नेपाल की यात्रा करें\\\"। नेपाल में, श्री गोपाल भट्ट गोस्वामी प्रसिद्ध काली-गंडकी नदी में स्नान कर रहे थे, नदी में अपने पानी के मटके के साथ डुबकी लगाने पर, भट्टजी आश्चर्यचकित हो गए क्योंकि कई शलिग्राम शिला उनके बर्तन में प्रवेश कर गए। इस तरह उन्होंने शालिग्राम पाया। उनसे जुडी एक बहुत ही दिलचस्प घटना प्रसिद्ध है। श्री गोपाल भट्ट जी महाराज श्री शलिग्राम की पूर्ण निष्ठा से सेवा कर रहे थे। एक बार श्री गोपाल भट्ट जी को एक तीव्र इच्छा महसूस की कि \\\"यदि शालीग्राम के अन्य हिस्सों हाथों और चरणों को देखा पाया, तो वो उन्हें गहनों के साथ सजाएँगे।\\\" यही ठाकुर जी की महिमा है। गीता में कहाँ गया है कि जिस भाव से जो मुझे भजता है मैं भी उसी भाव से ही भजता हूँ ।  श्री ठाकुरजी जी ने अपनी लीला दिखाई। अगले दिन जब श्री गोपाल भट्ट जी प्रतिदिन की तरह सेवा के लिए गए तो अगले ही दिन शिलाग्राम के हाथ, चरण और चेहरे का प्रादुर्भाव हुआ । श्री गोपाल भट्ट जी की खुशी का कोई अंत नहीं था।\\nमंदिर का समय:\\nगर्मी\\nसवेरे 5:00 बजे - मंगला आरती\\nसवेरे 10:00 बजे - श्रृंगार आरती\\nदोपहर 12:30 बजे - राजभोग आरती\\nशाम 7:15 बजे - संध्या आरती\\nशाम  9:30 बजे - शयन आरती\\nसमाज गायन - [7:30 PM]\\nसर्दी\\nसवेरे 5:30 बजे - मंगला आरती\\nसवेरे 10:30 बजे - श्रृंगार आरती\\nदोपहर 12:30 बजे - राजभोग आरती\\nशाम 6:30 बजे - संध्या आरती\\nशाम  9:00 बजे - शयन आरती\\nसमाज गायन - [7:00 PM]\\nस्थान:\\nश्री राधारमण जी वृंदावन जिला मथुरा, राज्य उत्तर प्रदेश और देश भारत में स्थित है। यह परिक्रमा मार्ग और श्री बाँके बिहारी मंदिर के पास ही स्थित है।\\nShri Radharaman Ji appeared in the samvat 1591. The temple was built in samwat 1645. Near by is samadhi of Shri Gopal Bhatt Ji who established the temple and service of Shri Radharaman Ji.\\nHistory: At the age of thirty, Gopala Bhatta Gosvami came to Vrindavana. After Chaitanya Mahaprabhu's disappearance, Gopala Bhatta Gosvami felt intense separation from the Lord. The Lord instructed Gopala Bhatta in a dream \\\"If you want my darshan then make a trip to Nepal\\\". In Nepal, Gopala Bhatta bathed in the famous Kali-Gandaki River. Upon dipping his waterpot in the river, he was surprised to see several Shaligrama shilas enter his pot. This is how he found the Shaligram. A very interesting incident regarding his appearance is famous. Shri Gopal Bhatt Ji Maharaj was doing the service of Shri Shaligram Ji with all sincerity. Once Shri Gopal Bhatt Ji felt the strong desire that “If the feet, hand and other parts of my Shaligram Ji could be seen, then even I could bedeck him with ornaments.” This is the Glory of Thakur Ji, as in Gita he says “Yei Yathamam Prapadyantei Tamsthaiv Bhajamyaham” (Whoever desirous of resorting to me, in whatever manner they think of me according to their inclinations, I favor them in the same manner). This is what happened. Shri Shaligram Ji showed his leela. Next day when Shri Gopal Bhatt Ji went for the daily service he had the darshan of the feet, hands, and face. There was no end to the Joy of Shri Gopal Bhatt Ji.\\nTimings of Temple:\\nSummer\\nMangla Aarti: 05:00 AM\\nShringar Aarti:10:00 AM\\nRajbhog Aarti: 12:30 PM\\nSandhya Aarti: 7:15 PM\\nShayan Aarti: 9:30 PM\\nSamaj Gayan: [7:30 PM]\\nWinter\\nMangla Aarti: 05:30 AM\\nShringar Aarti:10:30 AM\\nRajbhog Aarti: 12:30 PM\\nSandhya Aarti: 6:30 PM\\nShayan Aarti: 9:00 PM\\nSamaj Gayan: [7:00 PM]\\nLocation:\\nShri Radharaman Ji is located in Vrindavan District Mathura, State Uttar Pradesh, and Country India. It is situated near to Parikrama Marg and Shri Banke Bihari temple.\",\"author\":{\"@type\":\"Person\",\"name\":\"ब्रज रसिक धरोहर\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:Tfad,"])</script><script>self.__next_f.push([1,"तीस वर्ष की आयु में, श्री गोपाल भट्ट गोस्वामी वृंदावन आए। चैतन्य महाप्रभु के चले जाने के बाद, श्री गोपाल भट्ट गोस्वामी भगवान से गहन अलगाव महसूस करते थे। भगवान ने श्री गोपाल भट्ट गोस्वामी को एक सपने में निर्देश दिया कि \"यदि आप मेरा दर्शन चाहते हैं तो नेपाल की यात्रा करें\"। नेपाल में, श्री गोपाल भट्ट गोस्वामी प्रसिद्ध काली-गंडकी नदी में स्नान कर रहे थे, नदी में अपने पानी के मटके के साथ डुबकी लगाने पर, भट्टजी आश्चर्यचकित हो गए क्योंकि कई शलिग्राम शिला उनके बर्तन में प्रवेश कर गए। इस तरह उन्होंने शालिग्राम पाया। उनसे जुडी एक बहुत ही दिलचस्प घटना प्रसिद्ध है। श्री गोपाल भट्ट जी महाराज श्री शलिग्राम की पूर्ण निष्ठा से सेवा कर रहे थे। एक बार श्री गोपाल भट्ट जी को एक तीव्र इच्छा महसूस की कि \"यदि शालीग्राम के अन्य हिस्सों हाथों और चरणों को देखा पाया, तो वो उन्हें गहनों के साथ सजाएँगे।\" यही ठाकुर जी की महिमा है। गीता में कहाँ गया है कि जिस भाव से जो मुझे भजता है मैं भी उसी भाव से ही भजता हूँ ।  श्री ठाकुरजी जी ने अपनी लीला दिखाई। अगले दिन जब श्री गोपाल भट्ट जी प्रतिदिन की तरह सेवा के लिए गए तो अगले ही दिन शिलाग्राम के हाथ, चरण और चेहरे का प्रादुर्भाव हुआ । श्री गोपाल भट्ट जी की खुशी का कोई अंत नहीं था।\nमंदिर का समय:\nगर्मी\nसवेरे 5:00 बजे - मंगला आरती\nसवेरे 10:00 बजे - श्रृंगार आरती\nदोपहर 12:30 बजे - राजभोग आरती\nशाम 7:15 बजे - संध्या आरती\nशाम  9:30 बजे - शयन आरती\nसमाज गायन - [7:30 PM]\nसर्दी\nसवेरे 5:30 बजे - मंगला आरती\nसवेरे 10:30 बजे - श्रृंगार आरती\nदोपहर 12:30 बजे - राजभोग आरती\nशाम 6:30 बजे - संध्या आरती\nशाम  9:00 बजे - शयन आरती\nसमाज गायन - [7:00 PM]\nस्थान:\nश्री राधारमण जी वृंदावन जिला मथुरा, राज्य उत्तर प्रदेश और देश भारत में स्थित है। यह परिक्रमा मार्ग और श्री बाँके बिहारी मंदिर के पास ही स्थित है।"])</script><script>self.__next_f.push([1,"b:T7a1,Shri Radharaman Ji appeared in the samvat 1591. The temple was built in samwat 1645. Near by is samadhi of Shri Gopal Bhatt Ji who established the temple and service of Shri Radharaman Ji.\nHistory: At the age of thirty, Gopala Bhatta Gosvami came to Vrindavana. After Chaitanya Mahaprabhu's disappearance, Gopala Bhatta Gosvami felt intense separation from the Lord. The Lord instructed Gopala Bhatta in a dream \"If you want my darshan then make a trip to Nepal\". In Nepal, Gopala Bhatta bathed in the famous Kali-Gandaki River. Upon dipping his waterpot in the river, he was surprised to see several Shaligrama shilas enter his pot. This is how he found the Shaligram. A very interesting incident regarding his appearance is famous. Shri Gopal Bhatt Ji Maharaj was doing the service of Shri Shaligram Ji with all sincerity. Once Shri Gopal Bhatt Ji felt the strong desire that “If the feet, hand and other parts of my Shaligram Ji could be seen, then even I could bedeck him with ornaments.” This is the Glory of Thakur Ji, as in Gita he says “Yei Yathamam Prapadyantei Tamsthaiv Bhajamyaham” (Whoever desirous of resorting to me, in whatever manner they think of me according to their inclinations, I favor them in the same manner). This is what happened. Shri Shaligram Ji showed his leela. Next day when Shri Gopal Bhatt Ji went for the daily service he had the darshan of the feet, hands, and face. There was no end to the Joy of Shri Gopal Bhatt Ji.\nTimings of Temple:\nSummer\nMangla Aarti: 05:00 AM\nShringar Aarti:10:00 AM\nRajbhog Aarti: 12:30 PM\nSandhya Aarti: 7:15 PM\nShayan Aarti: 9:30 PM\nSamaj Gayan: [7:30 PM]\nWinter\nMangla Aarti: 05:30 AM\nShringar Aarti:10:30 AM\nRajbhog Aarti: 12:30 PM\nSandhya Aarti: 6:30 PM\nShayan Aarti: 9:00 PM\nS className\":\"hover:text-amber-400 transition-colors\",\"children\":\"पुस्तकालय\"}],[\"$\",\"span\",null,{\"children\":\"→\"}]],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"श्री  राधारमण मंदिर, वृंदावन\"}]]}],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-489\",\"title\":\"श्री  राधारमण मंदिर, वृंदावन\",\"category\":\"Shloka\",\"sanskrit_text\":\"इतिहास:\",\"hindi_text\":\"$a\",\"english_text\":null,\"english_translation\":\"$b\",\"description\":\"https://www.brajrasik.org/hi/articles/5ab512be9f7ab760360f9c07/shri-radharaman-temple-vrindavan\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"$c\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5ab512be9f7ab760360f9c07/shri-radharaman-temple-vrindavan\",\"slug\":\"shri-radharaman-mndir-vrindavana\"},\"initialRelatedSaint\":null,\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$e\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"t

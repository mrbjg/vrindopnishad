ss them with the dust of their lotus feet.\\\"\\nUddhava-Kunda\\nis situated exactly west of Kusum-sarovar on the right side of the parikrama path in Goverdhan. Vajranabha Maharaja manifested Uddhava-Kunda under the guidance of Sandilya and other sages. Uddhav Ji always resides near by here as grass and shrubs in order to be sprinkled by the foot-dust of the gopis. The Shrimad Bhagwatam Mahatma of the Skanda Purana gives an interesting description of this place.\\nAfter the disappearance of Shri Krishn, His queens in Dvaraka were greatly afflicted by sorrow. Once, Vajrnabh came here with them and they loudly performed sankirtan. In that great sankirtan, all the associates of Krishna started to appear one by one. The associates of Dwarika all sang and danced, and Arjuna began to dance and play mridanga. Suddenly, that exalted soul, Shri Uddhava emerged from the grass and shrubs, and he also became immersed in dancing in that maha-sankirtan. How could Krishna not come there? Finally, He also appeared in that maha-sankirtan ras, along with Shri Radhika and the other sakhis and, after some time, disappeared again. In this way, Uddhava pacified the queens at this place.\\nLocation\\n:\\nUddhav Kunda is Located at Goverdhan near to Kusum Sarovar.\",\"author\":{\"@type\":\"Person\",\"name\":\"श्रीमद्भागवत  (10.47.61)\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:Tcc8,"])</script><script>self.__next_f.push([1,"\"ओह! मैं वृन्दावन की इन झाडिय़ों, लताओं तथा जड़ी-बूटियों में से कोई एक भी होने का सौभाग्य प्राप्त करूँ क्योंकि गोपियाँ उन्हें अपने चरणों से रौंदती हैं और अपने चरणकमलों की धूल से उन्हें आशीर्वाद देती हैं ।\"\nस्कन्दपुराण के श्रीमद्भागवत-माहात्म्य प्रसंग में इसका बड़ा ही रोचक वर्णन है। वज्रनाभ महाराज ने शाण्डिल्य आदि ऋषियों के आनुगत्य में यहाँ उद्धव कुण्ड का प्रकाश किया । उद्धव जी यहाँ पास में ही गोपि d Krishna not come there? Finally, He also appeared in that maha-sankirtan ras, along with Shri Radhika and the other sakhis and, after some time, disappeared again. In this way, Uddhava pacified the queens at this place.\nLocation\n:\nUddhav Kunda is Located at Goverdhan near to Kusum Sarovar.c:T1494,"])</script><script>self.__next_f.push([1,"कुसुम सरोवर तक का स्थल उद्धव जी का स्थल कहा जाता है । कुसुम सरोवर के इस पार और उस पार दोनों ओर उद्धव जी का मंदिर है । समीप ही है – उद्धव कुण्ड ।\nउद्धव जी एक दिन के लिए ब्रज मे आए थे की गोपियों को उद्बोधित कर लौट जायेंगे किन्तु ब्रज का स्वरुप एवं गोपियों के ह्रदय का दिव्य प्रेम तथा श्री राधारानी के दर्शन कर वे श्री कृष्ण को भूल गए, ज्ञान का दिव्य अम्बर फट कर गुदड़ी बन गया और 6 महीने ब्रज में ही रहे । तब एक दिन श्री राधारानी ने उद्धव जी को आज्ञा की \"उद्धव ! तुम्हारे सखा तुम्हारी प्रतीक्षा कर रहे होंगे, तुम्हें गमन भी करना है ।\" ऐसा कह कर श्री राधारानी ने उद्धव जी को आशीष प्रदान किया । श्री राधारानी की आज्ञा से न चाहते हुए भी उद्धव जी ने प्रणाम कर प्रस्थान किया । लौटते समय उद्धव जी ने कामना की -\nआसामहो चरणरेणुजुषामहं स्यां वृन्दावने किमपि गुल्मलतौषधीनां ॥\n- श्रीमद्भागवत  (10.47.61)\n\"ओह! मैं वृन्दावन की इन झाडिय़ों, लताओं तथा जड़ी-बूटियों में से कोई एक भी होने का सौभाग्य प्राप्त करूँ क्योंकि गोपियाँ उन्हें अपने चरणों से रौंदती हैं और अपने चरणकमलों की धूल से उन्हें आशीर्वाद देती हैं ।\"\nस्कन्दपुराण के श्रीमद्भागवत-माहात्म्य प्रसंग में इसका बड़ा ही रोचक वर्णन है। वज्रनाभ महाराज ने शाण्डिल्य आदि ऋषियों के आनुगत्य में यहाँ उद्धव कुण्ड का प्रकाश किया । उद्धव जी यहाँ पास में ही गोपियों की चरण धूलि में अभिषिक्त होने के लिए तृण-गुल्म के रूप में सदैव निवास करते हैं । श्रीकृष्ण की लीला अप्रकट होने पर  कृष्ण की द्वारका वाली पटरानियाँ बड़ी दुःखी थीं । एक बार वज्रनाभजी उनको साथ लेकर यहाँ उपस्थित हुए । बड़े जोरों से संकीर्तन आरम्भ हुआ । देखते-देखते उस महासंकीर्तन में कृष्ण के सभी परिकर क्रमशः आविर्भूत होने लगे । अर्जुन मृदंग वादन करते हुए नृत्य करने लगे । इस प्रकार द्वारका के सभी परिकर उस संकीर्तन मण्डल में नृत्य और कीर्तन करने लगे । हठात् महाभागवत उद्धव भी वहाँ के तृण-गुल्म से आविर्भूत होकर नृत्य में विभोर हो गये । फिर भला कृष्ण ही कैसे रह सकते थे? श्रीमती राधिका आदि सखियों के साथ वे भी उस महासंकीर्तन रास में आविर्भूत हो गये । थोड़ी देर के बाद ही वे अंतर्ध्यान हो गये । इस प्रकार उद्धव जी ने द्वारका की महिषियों को इस स्थान पर सांत्वना दी थी ।\nस्थान :\nकुसुम सरोवर, गोवर्धन के ठीक पश्चिम में परिक्रमा मार्ग पर दाहिनी ओर उद्धव कुण्ड स्थित है ।"])</script><script>self.__next_f.push([1,"e:Tcc8,"])</script><script>self.__next_f.push([1,"\"ओह! मैं वृन्दावन की इन झाडिय़ों, लताओं तथा जड़ी-बूटियों में से कोई एक भी होने का सौभाग्य प्राप्त करूँ क्योंकि गोपियाँ उन्हें अपने चरणों से रौंदती हैं और अपने चरणकमलों की धूल से उन्हें आशीर्वाद देती हैं ।\"\nस्कन्दपुराण के श्रीमद्भागवत-माहात्म्य प्रसंग में इसका बड़ा ही रोचक वर्णन है। वज्रनाभ महाराज ने शाण्डिल्य आदि ऋषियों के आनुगत्य में यहाँ उद्धव कुण्ड का प्रकाश किया । उद्धव जी यहाँ पास में ही गोपियों की चरण धूलि में अभिषिक्त होने के लिए तृण-गुल्म के रूप में सदैव निवास करते हैं । श्रीकृष्ण की लीला अप्रकट होने पर  कृष्ण की द्वारका वाली पटरानियाँ बड़ी दुःखी थीं । एक बार वज्रनाभजी उनको साथ लेकर यहाँ उपस्थित हुए । बड़े जोरों से संकीर्तन आरम्भ हुआ । देखते-देखते उस महासंकीर्तन में कृष्ण के सभी परिकर क्रमशः आविर्भूत होने लगे । अर्जुन मृदंग वादन करते हुए नृत्य करने लगे । इस प्रकार द्वारका के सभी परिकर उस संकीर्तन मण्डल में नृत्य और कीर्तन करने लगे । हठात् महाभागवत उद्धव भी वहाँ के तृण-गुल्म से आविर्भूत होकर नृत्य में विभोर हो गये । फिर भला कृष्ण ही कैसे रह सकते थे? श्रीमती राधिका आदि सखियों के साथ वे भी उस महासंकीर्तन रास में आविर्भूत हो गये । थोड़ी देर के बाद ही वे अंतर्ध्यान हो गये । इस प्रकार उद्धव जी ने द्वारका की महिषियों को इस स्थान पर सांत्वना दी थी ।\nस्थान :\nकुसुम सरोवर, गोवर्धन के ठीक पश्चिम में परिक्रमा मार्ग पर दाहिनी ओर उद्धव कुण्ड स्थित है ।"])</script><script>self.__next_f.push([1,"f:T55d,\"Oh, let me be fortunate enough to be one of the bushes, creepers, or herbs in Vrindavan, because the gopis trample them and bless them with the dust of their lotus feet.\"\nUddhava-Kunda\nis situated exactly west of Kusum-sarovar on the right side of the parikrama path in Goverdhan. Vajranabha Maharaja manifested Uddhava-Kunda under the guidance of Sandilya and other sages. Uddhav Ji always resides near by here as grass and shrubs in order to be sprinkled by the foot-dust of the gopis. The Shrimad Bhagwatam Mahatma of the Skanda Purana gives an interesting description of this place.\nAfter the disappearance of Shri Krishn, His queens in Dvaraka were greatly afflicted by sorrow. Once, Vajrnabh came here with them and they loudly performed sankirtan. In that great sankirtan, all the associates of Krishna started to appear one by one. The associates of Dwarika all sang and danced, and Arjuna began to dance and play mridanga. Suddenly, that exalted soul, Shri Uddhava emerged from the grass and shrubs, and he also became immersed in dancing in that maha-sankirtan. How could Krishna not come there? Finally, He also appeared in that maha-sankirtan ras, along with Shri Radhika and the other sakhis and, after some time, disappeared again. In this way, Uddhava pacified the queens at this place.\nLocation\n:\nUddhav Kunda is Located at Goverdhan near to Kusum Sarovar.10:T1494,"])</script><script>self.__next_f.push([1,"कुसुम सरोवर तक का स्थल उद्धव जी का स्थल कहा जाता है । कुसुम सरोवर के इस पार और उस पार दोनों ओर उद्धव जी का मंदिर है । समीप ही है – उद्धव कुण्ड ।\nउद्धव जी एक दिन के लिए ब्रज मे आए थे की गोपियों को उद्बोधित कर लौट जायेंगे किन्तु ब्रज का स्वरुप एवं गोपियों के ह्रदय का दिव्य प्रेम तथा श्री राधारानी के दर्शन कर वे श्री कृष्ण को भूल गए, ज्ञान का दिव्य अम्बर फट कर गुदड़ी बन गया और 6 महीने ब्रज में ही रहे । तब एक दिन श्री राधारानी ने उद्धव जी को आज्ञा की \"उद्धव ! तुम्हारे सखा तुम्हारी प्रतीक्षा कर रहे होंगे, तुम्हें गमन भी करना है ।\" ऐसा कह कर श्री राधारानी ने उद्धव जी को आशीष प्रदान किया । श्री राधारानी की आज्ञा से न चाहते हुए भी उद्धव जी ने प्रणाम कर प्रस्थान किया । लौटते समय उद्धव जी ने कामना की -\nआसामहो चरणरेणुजुषामहं स्यां वृन्दावने किमपि गु [\"$\",\"span\",null,{\"children\":\"→\"}]],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"उद्धव कुण्ड – कुसुम सरोवर\"}]]}],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-486\",\"title\":\"उद्धव कुण्ड – कुसुम सरोवर\",\"category\":\"Shloka\",\"sanskrit_text\":\"आसामहो चरणरेणुजुषामहं स्यां वृन्दावने किमपि गुल्मलतौषधीनां ॥\",\"hindi_text\":\"$a\",\"english_text\":null,\"english_translation\":\"$b\",\"description\":\"https://www.brajrasik.org/hi/articles/5b64384a4b7ba00054cbe6a0/uddhava-kunda\",\"author\":\"श्रीमद्भागवत  (10.47.61)\",\"status\":\"published\",\"content_text\":\"$c\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b64384a4b7ba00054cbe6a0/uddhava-kunda\",\"slug\":\"uddhav-kund-kusum-sarovara\"},\"initialRelatedSaint\":{\"name\":\"श्रीमद्भागवत  (10.47.61)\",\"hinglishName\":\"shrimadbhagavata (10.47.61)\",\"slug\":\"shrimadbhagavata-104761\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[\"$d\"],\"books\":[],\"rawItem\":null},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$L15\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$16\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L17\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L15\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\

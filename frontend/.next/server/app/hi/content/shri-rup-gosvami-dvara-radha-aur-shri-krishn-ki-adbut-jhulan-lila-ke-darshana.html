\"default\"]\n12:I[4707,[],\"\"]\n14:I[6423,[],\"\"]\n15:I[2046,[\"9213\",\"static/chunks/ef7830f0-bde263843179a996.js\",\"1401\",\"static/chunks/d8b2f613-9822c7accee3e330.js\",\"1464\",\"static/chunks/4ea34a6d-26b267dedec28637.js\",\"9762\",\"static/chunks/44530001-97951b7dfbe773fa.js\",\"4785\",\"static/chunks/4785-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"Cl"])</script><script>self.__next_f.push([1,"ientProviders\"]\n17:I[1060,[],\"\"]\n6:T2d92,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@type\":\"Article\",\"headline\":\"श्री रूप गोस्वामी द्वारा राधा और श्री कृष्ण की अद्बुत झूलन लीला के दर्शन\",\"description\":\"https://www.brajrasik.org/hi/articles/59b9861959e8c72a534d85bd/incredible-swing-pastimes-of-radha-krishna-experienced-by-roop-goswami-at-imlitala-radha-kunda\",\"articleBody\":\"\\nराधा कुंड, गोवर्धन में एक ऐसा अद्भुत स्थान है जहाँ एक बहुत बड़ा इमली का वृक्ष है । यह वही स्थान है जहाँ रूप गोस्वामी ने राधा और श्री कृष्ण की सबसे अविश्वसनीय झूलन लीला के दर्शन किए थे।\\n'इमली' शब्द इमली से है और 'तला' का अर्थ है 'वृक्ष'। एक बार श्री रूप गोस्वामी राधा-कुंड में कुछ समय बिता रहे थे, वह आये और इस विशाल इमली के वृक्ष के नीचे बैठ गए और स्मरण में तल्लीन हो गए । वहां उन्होंने वृक्ष से सटे एक झूले को देखा। वह झूला इस प्रकार का था की दो व्यक्ति एक दूसरे के सामने ही बैठ सकते हैं । फिर अचानक, रूप गोस्वामी ने देखा कि राधा और श्री कृष्ण दोनों सखियों के संग झूलन लीला में पधारे। श्री कृष्ण तुरंत झूले पर चढ़ गए और फिर श्री राधा रानी को उनके साथ सम्मिलित करने के लिए आमंत्रित किया। पहले श्री राधा रानी ने मना कर दिया, क्योंकि श्री कृष्ण ने एक बार झूलन को तीव्र गति से झूला दिया था, उन्हें यह स्मरण था। श्री कृष्ण ने तब वचन दिया था कि वह झूलन को अधिक ऊंचा नहीं होने देंगे लेकिन गोपियों ने कहा कि वे स्वयं झूलन को धक्का देंगी और उसे अधिक ऊंचाई पर जाने नहीं देंगी । बहुत अनुरोध करने के बाद, श्री राधा रानी आखिरकार हर किसी के अनुरोध पर सहमत हुई और श्री कृष्ण के सामने झूलन पर पधारीं।\\nतब सखियों ने धीरे से पीछे की तरफ झूलन करना शुरू कर दिया और सब अत्यंत आनंद लेने लगे। जब श्री कृष्ण ने देखा कि राधा रानी और सखी झूलन का आनंद लेते हुए सुख और आनंद की मनोदशा में थे, तो झूलन को उन्होंने धीरे-धीरे ऊंचाई पर ले जाना शुरू किया। बहुत ही कम समय के भीतर सब सखियों के समझने से पहले ही झूलन इतना ऊंचा हो गया कि कोई भी रास्ता नहीं था कि वे उसे नियंत्रित कर सकें। जैसे ही झूलन अधिक हो गया, श्री राधा रानी ने श्री कृष्ण को रोकने के लिए कहा, लेकिन श्री कृष्ण सिर्फ प्रसन्नचित्त मुस्कुराते रहे और झूलन भी ऊंचाई पर था । अचानक झूलन इतनी ऊंचाई पर पहुंच गया कि यह दिखाई देता था कि यह वृक्ष की शाखा के शीर्ष पर एक पूर्ण चक्र होगा। उस क्षण में श्री राधा रानी ज़ोर से चिल्लाई और आगे बढ़ते हुए, श्री कृष्ण को उन्होंने पकड़ लिया । उसी क्षण झूलन वृक्ष की चोटी के ऊपर एक पूर्ण चक्र चला गया और दूसरी तरफ नीचे आ गया। सखियाँ यह देखकर चकित हो गयी । जब झूलन अंत में धीमा हो गया, राधा रानी अभी भी श्री कृष्ण को अपने हृदय से लगा कर उन्हे ज़ोर से पकड़ रखा था । यह सब देखकर सखियाँ बहुत प्रसन्न हुई। उस क्षण में, जो कुछ हुआ था, उसे देखकर, रूप गोस्वामी के शरीर और मन में रोमांच हुआ, अचानक वह चेतना खो गए और जमीन पर गिर गए। जब रूप गोस्वामी ने अंततः अपने इंद्रियों को पुनः प्राप्त किया, तो उन्होने देखा कि श्री राधा रानी और  श्री कृष्ण अपनी सखियों के संग वहां से जा चुके थे, लेकिन झूलन अभी भी वहीँ था। इसके बाद, उन्होंने देखा कि झूले को पकड़ने वाली शाखा पूरी तरह से मुड़ गई थी क्योंकि झूलन की शक्ति के कारण यह ऊपर और नीचे की तरफ एक पूर्ण चक्र में परिवर्तित हो गया था।\\nइस लीला को रूप गोस्वामी ने देखा एवं इमली का वृक्ष बहुत प्रसिद्ध हो गया था और हर तीर्थयात्री जो राधा-कुंड को जातें हैं, इमली तला के दर्शन ज़रूर करते हैं । दुर्भाग्य से, मध्य सत्तर के दशक के दौरान, यह इमली वृक्ष अभी नहीं है । फिर भी, आज भी यहाँ तीर्थ यात्री जिस स्थान पर यह लीला हुई है उसे देखने और याद करने जाते है।\\nImlitala at Radha Kunda, Goverdhan is the place where a very large tamarind tree once stood and it was the place where Roop Goswami witnessed the most incredible swing pastimes of Radha and Krishna known as jhulana-lila. The word ‘imli’ means ‘tamarind’ and ‘tala’ means ‘tree’. Once while Roop Goswami was spending some time at Radha-kunda, he came and sat beneath this huge tamarind tree and became deeply absorbed in chanting. The next thing he became aware of was a very nicely decorated swing that he noticed hanging from one of the tree’s branches. The swing, also called a jhula, was designed in such a way that two persons could sit on the swing while facing each other. Then all of a sudden, Roop Goswami saw both Radha and Krishna arrive at the swing accompanied by all their gopi girlfriends. Krishna immediately climbed onto the swing and then invited Radharani to join Him. Radharani at first refused, because Krishna sometimes made this particular swing go far too high, which would always frighten Her. Krishna then promised that He would not to cause the swing go so high and the gopis said that they would themselves push the swing and would not allow it to go so very high. After much persuading, Radharani ultimately agreed to everyone’s repeated requests and sat down on the swing facing Krishna.\\nThe gopis then began to gently push the swing backwards and forwards much to the pleasure of everyone. When Krishna saw that Radharani and the gopis were in a happy and relaxed mood while enjoying the jhulana pastimes, He cunningly began to move His legs ‘to and fro’ in order to make the swing go gradually higher. Within a very short time, and before the gopis could realize what was happening, the swing was going so high there was no way that they could control it. As the swing went even higher, Radharani pleaded with Krishna to stop, but Krishna just smiled sweetly and made the swing go even higher. Suddenly the swing reached such a height that it appeared that it would go a full circle right over the top of the tree branch. At that moment Radharani screamed aloud and leaped forward, throwing Her arms around Krishna’s neck while holding on for dear life. At that moment the swing went a full circle right over the top of the tree branch and came down on the other side. The gopis were amazed to see the swing go right over the top of the branch with Radharani firmly holding on to Krishna’s neck as if Her very life depended on it. When the swing finally slowed down, Radharani was still holding Krishna tightly in Her arms as if She would never let go. The gopis were so overjoyed and ecstatic to see Radharani embracing Krishna with such force, and they all started to laugh and clap their hands, while praising the incredible and uncommon pastimes of the ‘divine lovers’. At that same moment, having observed all that had happened, as waves of ecstasy flowed through the body and mind of Roop Goswami, he suddenly lost consciousness and fell on the ground. When Roop finally regained his senses, he saw that Radha and Krishna had left with Their friends, but the swing was still there hanging from the tree branch. Then, to his utter amazement, he noticed that the branch holding the swing was completely twisted due to the force of the swing as it went a full circle right over the top and down the other side.\\nThis twisted tamarind tree became very famous and every pilgrim who visited Radha-kunda went to have darshana of the Imli Tala. Unfortunately, during the mid-seventies, this tamarind tree eventually died leaving only a stump. Nevertheless, pilgrims still here by go there just to pay their obeisances and remember the incredible swing pastime witnessed by Roop Goswami.\",\"author\":{\"@type\":\"Person\",\"name\":\"ब्रज रसिक धरोहर\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:T1c2e,"])</script><script>self.__next_f.push([1,"राधा कुंड, गोवर्धन में एक ऐसा अद्भुत स्थान है जहाँ एक बहुत बड़ा इमली का वृक्ष है । यह वही स्थान है जहाँ रूप गोस्वामी ने राधा और श्री कृष्ण की सबसे अविश्वसनीय झूलन लीला के दर्शन किए थे।\n'इमली' शब्द इमली से है और 'तला' का अर्थ है 'वृक्ष'। एक बार श्री रूप गोस्वामी राधा-कुंड में कुछ समय बिता रहे थे, वह आये और इस विशाल इमली के वृक्ष के नीचे बैठ गए और स्मरण में तल्लीन हो गए । वहां उन्होंने वृक्ष से सटे एक झूले को देखा। वह झूला इस प्रकार का था की दो व्यक्ति एक दूसरे के सामने ही बैठ सकते हैं । फिर अचानक, रूप गोस्वामी ने देखा कि राधा और श्री कृष्ण दोनों सखियों के संग झूलन लीला में पधारे। श्री कृष्ण तुरंत झूले पर चढ़ गए और फिर श्री राधा रानी को उनके साथ सम्मिलित करने के लिए आमंत्रित किया। पहले श्री राधा रानी ने मना कर दिया, क्योंकि श्री कृष्ण ने एक बार झूलन को तीव्र गति से झूला दिया था, उन्हें यह स्मरण था। श्री कृष्ण ने तब वचन दिया था कि वह झूलन को अधिक ऊंचा नहीं होने देंगे लेकिन गोपियों ने कहा कि वे स्वयं झूलन को धक्का देंगी और उसे अधिक ऊंचाई पर जाने नहीं देंगी । बहुत अनुरोध करने के बाद, श्री राधा रानी आखिरकार हर किसी के अनुरोध पर सहमत हुई और श्री कृष्ण के सामने झूलन पर पधारीं।\nतब सखियों ने धीरे से पीछे की तरफ झूलन करना शुरू कर दिया और सब अत्यंत आनंद लेने लगे। जब श्री कृष्ण ने देखा कि राधा रानी और सखी झूलन का आनंद लेते हुए सुख और आनंद की मनोदशा में थे, तो झूलन को उन्होंने धीरे-धीरे ऊंचाई पर ले जाना शुरू किया। बहुत ही कम समय के भीतर सब सखियों के समझने से पहले ही झूलन इतना ऊंचा हो गया कि कोई भी रास्ता नहीं था कि वे उसे नियंत्रित कर सकें। जैसे ही झूलन अधिक हो गया, श्री राधा रानी ने श्री कृष्ण को रोकने के लिए कहा, लेकिन श्री कृष्ण सिर्फ प्रसन्नचित्त मुस्कुराते रहे और झूलन भी ऊंचाई पर था । अचानक झूलन इतनी ऊंचाई पर पहुंच गया कि यह दिखाई देता था कि यह वृक्ष की शाखा के शीर्ष पर एक पूर्ण चक्र होगा। उस क्षण में श्री राधा रानी ज़ोर से चिल्लाई और आगे बढ़ते हुए, श्री कृष्ण को उन्होंने पकड़ लिया । उसी क्षण झूलन वृक्ष की चोटी के ऊपर एक पूर्ण चक्र चला गया और दूसरी तरफ नीचे आ गया। सखियाँ यह देखकर चकित हो गयी । जब झूलन अंत में धीमा हो गया, राधा रानी अभी भी श्री कृष्ण को अपने हृदय से लगा कर उन्हे ज़ोर से पकड़ रखा था । यह सब देखकर सखियाँ बहुत प्रसन्न हुई। उस क्षण में, जो कुछ हुआ था, उसे देखकर, रूप गोस्वामी के शरीर और मन में रोमांच हुआ, अचानक वह चेतना खो गए और जमीन पर गिर गए। जब रूप गोस्वामी ने अंततः अपने इंद्रियों को पुनः प्राप्त किया, तो उन्होने देखा कि श्री राधा रानी और  श्री कृष्ण अपनी सखियों के संग वहां से जा चुके थे, लेकिन झूलन अभी भी वहीँ था। इसके बाद, उन्होंने देखा कि झूले को पकड़ने वाली शाखा पूरी तरह से मुड़ गई थी क्योंकि झूलन की शक्ति के कारण यह ऊपर और नीचे की तरफ एक पूर्ण चक्र में परिवर्तित हो गया था।\nइस लीला को रूप गोस्वामी ने देखा एवं इमली का वृक्ष बहुत प्रसिद्ध हो गया था और हर तीर्थयात्री जो राधा-कुंड को जातें हैं, इमली तला के दर्शन ज़रूर करते हैं । दुर्भाग्य से, मध्य सत्तर के दशक के दौरान, यह इमली वृक्ष अभी नहीं है । फिर भी, आज भी यहाँ तीर्थ यात्री जिस स्थान पर यह लीला हुई है उसे देखने और याद करने जाते है।"])</script><script>self.__next_f.push([1,"b:Tea2,"])</script><script>self.__next_f.push([1,"Imlitala at Radha Kunda, Goverdhan is the place where a very large tamarind tree once stood and it was the place where Roop Goswami witnessed the most incredible swing pastimes of Radha and Krishna known as jhulana-lila. The word ‘imli’ means ‘tamarind’ and ‘tala’ means ‘tree’. Once while Roop Goswami was spending some time at Radha-kunda, he came and sat beneath this huge tamarind tree and became deeply absorbed in chanting. The next thing he became aware of was a very nicely decorated swing that he noticed hanging from one of the tree’s branches. The swing, also called a jhula, was designed in such a way that two persons could sit on the swing while facing each other. Then all of a sudden, Roop Goswami saw both Radha and Krishna arrive at the swing accompanied by all their gopi girlfriends. Krishna immediately climbed onto the swing and then invited Radharani to join Him. Radharani at first refused, because Krishna sometimes made this particular swing go far too high, which would always frighten Her. Krishna then promised that He would not to cause the swing go so high and the gopis said that they would themselves push the swing and would not allow it to go so very high. After much persuading, Radharani ultimately agreed to everyone’s repeated requests and sat down on the swing facing Krishna.\nThe gopis then began to gently push the swing backwards and forwards much to the pleasure of everyone. When Krishna saw that Radharani and the gopis were in a happy and relaxed mood while enjoying the jhulana pastimes, He cunningly began to move His legs ‘to and fro’ in order to make the swing go gradually higher. Within a very short time, and before the gopis could realize what was happening, the swing was going so high there was no way that they could control it. As the swing went even higher, Radharani pleaded with Krishna to stop, but Krishna just smiled sweetly and made the swing go even higher. Suddenly the swing reached such a height that it appeared that it would go a full circle right over the top of the tree branch. At that moment Radharani screamed aloud and leaped forward, throwing Her arms around Krishna’s neck while holding on for dear life. At that moment the swing went a full circle right over the top of the tree branch and came down on the other side. The gopis were amazed to see the swing go right over the top of the branch with Radharani firmly holding on to Krishna’s neck as if Her very life depended on it. When the swing finally slowed down, Radharani was still holding Krishna tightly in Her arms as if She would never let go. The gopis were so overjoyed and ecstatic to see Radharani embracing Krishna with such force, and they all started to laugh and clap their hands, while praising the incredible and uncommon pastimes of the ‘divine lovers’. At that same moment, having observed all that had happened, as waves of ecstasy flowed through the body and mind of Roop Goswami, he suddenly lost consciousness and fell on the ground. When Roop finally regained his senses, he saw that Radha and Krishna had left with Their friends, but the swing was still there hanging from the tree branch. Then, to his utter amazement, he noticed that the branch holding the swing was completely twisted due to the force of the swing as it went a full circle right over the top and down the other side.\nThis twisted tamarind tree became very famous and every pilgrim who visited Radha-kunda went to have darshana of the Imli Tala. Unfortunately, during the mid-seventies, this tamarind tree eventually died leaving only a stump. Nevertheless, pilgrims still here by go there just to pay their obeisances and remember the incredible swing pastime witnessed by Roop Goswami."])</script><script>self.__next_f.push([1,"c:T1c2e,"])</script><script>self.__next_f.push([1,"राधा कुंड, गोवर्धन में एक ऐसा अद्भुत स्थान है जहाँ एक बहुत बड़ा इमली का वृक्ष है । यह वही स्थान है जहाँ रूप गोस्वामी ने राधा और श्री कृष्ण की सबसे अविश्वसनीय झूलन लीला के दर्शन किए थे।\n'इमली' शब्द इमली से है और 'तला' का अर्थ है 'वृक्ष'। एक बार श्री रूप गोस्वामी राधा-कुंड में कुछ समय बिता रहे थे, वह आये और इस विशाल इमली के वृक्ष के नीचे बैठ गए और स्मरण में तल्लीन हो गए । वहां उन्होंने वृक्ष से सटे एक झूले को देखा। वह झूला इस प्रकार का था की दो व्यक्ति एक दूसरे के सामने ही बैठ सकते हैं । फिर अचानक, रूप गोस्वामी ने देखा कि राधा और श्री कृष्ण दोनों सखियों के संग झूलन लीला में पधारे। श्री कृष्ण तुरंत झूले पर चढ़ गए और फिर श्री राधा रानी को उनके साथ सम्मिलित करने के लिए आमंत्रित किया। पहले श्री राधा रानी ने मना कर दिया, क्योंकि श्री कृष्ण ने एक बार झूलन को तीव्र गति से झूला दिया था, उन्हें यह स्मरण था। श्री कृष्ण ने तब वचन दिया था कि वह झूलन को अधिक ऊंचा नहीं होने देंगे लेकिन गोपियों ने कहा कि वे स्वयं झूलन को धक्का देंगी और उसे अधिक ऊंचाई पर जाने नहीं देंगी । बहुत अनुरोध करने के बाद, श्री राधा रानी आखिरकार हर किसी के अनुरोध पर सहमत हुई और श्री कृष्ण के सामने झूलन पर पधारीं।\nतब सखियों ने धीरे से पीछे की तरफ झूलन करना शुरू कर दिया और सब अत्यंत आनंद लेने लगे। जब श्री कृष्ण ने देखा कि राधा रानी और सखी झूलन का आनंद लेते हुए सुख और आनंद की मनोदशा में थे, तो झूलन को उन्होंने धीरे-धीरे ऊंचाई पर ले जाना शुरू किया। बहुत ही कम समय के भीतर सब सखियों के समझने से पहले ही झूलन इतना ऊंचा हो गया कि कोई भी रास्ता नहीं था कि वे उसे नियंत्रित कर सकें। जैसे ही झूलन अधिक हो गया, श्री राधा रानी ने श्री कृष्ण को रोकने के लिए कहा, लेकिन श्री कृष्ण सिर्फ प्रसन्नचित्त मुस्कुराते रहे और झूलन भी ऊंचाई पर था । अचानक झूलन इतनी ऊंचाई पर पहुंच गया कि यह दिखाई देता था कि यह वृक्ष की शाखा के शीर्ष पर एक पूर्ण चक्र होगा। उस क्षण में श्री राधा रानी ज़ोर से चिल्लाई और आगे बढ़ते हुए, श्री कृष्ण को उन्होंने पकड़ लिया । उसी क्षण झूलन वृक्ष की चोटी के ऊपर एक पूर्ण चक्र चला गया और दूसरी तरफ नीचे आ गया। सखियाँ यह देखकर चकित हो गयी । जब झूलन अंत में धीमा हो गया, राधा रानी अभी भी श्री कृष्ण को अपने हृदय से लगा कर उन्हे ज़ोर से पकड़ रखा था । यह सब देखकर सखियाँ बहुत प्रसन्न हुई। उस क्षण में, जो कुछ हुआ था, उसे देखकर, रूप गोस्वामी के शरीर और मन में रोमांच हुआ, अचानक वह चेतना खो गए और जमीन पर गिर गए। जब रूप गोस्वामी ने अंततः अपने इंद्रियों को पुनः प्राप्त किया, तो उन्होने देखा कि श्री राधा रानी और  श्री कृष्ण अपनी सखियों के संग वहां से जा चुके थे, लेकिन झूलन अभी भी वहीँ था। इसके बाद, उन्होंने देखा कि झूले को पकड़ने वाली शाखा पूरी तरह से मुड़ गई थी क्योंकि झूलन की शक्ति के कारण यह ऊपर और नीचे की तरफ एक पूर्ण चक्र में परिवर्तित हो गया था।\nइस लीला को रूप गोस्वामी ने देखा एवं इमली का वृक्ष बहुत प्रसिद्ध हो गया था और हर तीर्थयात्री जो राधा-कुंड को जातें हैं, इमली तला के दर्शन ज़रूर करते हैं । दुर्भाग्य से, मध्य सत्तर के दशक के दौरान, यह इमली वृक्ष अभी नहीं है । फिर भी, आज भी यहाँ तीर्थ यात्री जिस स्थान पर यह लीला हुई है उसे देखने और याद करने जाते है।"])</script><script>self.__next_f.push([1,"d:T1975,"])</script><script>self.__next_f.push([1,"बहुत समय पहले की बात है श्री वृंदावन में एक बाबा का निवास था , जो युगल स्वरुप की उपासना किया करते थे। एक बार वे बाबा संध्या वंदन के उपरांत कुञ्जवन की राहपर जा रहे थे। मार्ग में बाबा जब एक वटवृक्ष के नीचे होकर निकले तो उनकी जटा उस वटवृक्ष की जटाओं में उलझ गयी। बहुत प्रयास किया सुलझाने का परन्तु जटा नहीं सुलझी। महात्मा भी महात्मा ही होते हैं। वे आसन जमा कर बैठ गये कि जिसने जटा उलझाई है वो सुलझाने आएगा तो ठीक है नहीं तो मैं ऐसे ही बैठा रहूँगा और प्राण त्याग दूंगा। बाबा को बैठे हुए तीन दिन बीत गये।\nएक सांवला सलोना ग्वाला आया जो पांच-सात वर्ष का था। वो बालक ब्रजभाषा में बड़े दुलार से बोला - \" बाबा ! तुम्हारी तो जटा उलझ गयी, अरे मैं सुलझा दऊँ का ?\" और जैसे ही वो बालक जटा सुलझाने आगे बढ़ा -बाबा ने कहा - \" हाथ मत लगाना , पीछे हटो...कौन हो तुम ?\" ग्वाला - 'अरे ! हमारो जे ही गाम है महाराज! गैया चरा रह्यो तो मैंने देखि बाबा की जटा उलझ गई है तो सोची मैं जाय के सुलझा दऊँ। बाबा -'ना ना ना दूर हट जा। जिसने जटा उलझाई है वही सुलझायगा। ग्वाला - \"अरे महाराज ! तो जाने उलझाई है वाको नाम बताय देयो वाहे बुला लाऊँगो ।\" बाबा - \"तू जा— नाम नहीं बताते हम। कुछ देर तक वो बालक बाबा को समझाता रहा परन्तु जब बाबा नहीं माने तो ग्वाले में से साक्षात्मुरली बजाते हुए भगवान् बांके बिहारी प्रकट हो गये। सांवरिया सरकार बोले - \" महात्मन ! मैंने जटा उलझाई है ? तो लो आ गया मैं।\" और जैसेही सांवरिया जटा सुलझाने आगे बढ़े -बाबा ने कहा - 'हाथ मत लगाना , पीछे हटो। पहले बताओ तुम कौन से कृष्ण हो ?'\nबाबा के वचन सुनकर श्री कृष्ण सोच में पड़ गए कि अरे कृष्ण भी क्या दस-पांच हैं ? श्री कृष्ण बोले -'कौन से कृष्ण हो मतलब ?' बाबा - 'देखो श्री कृष्ण कई हैं। एक देवकी नंदन श्री कृष्ण हैं, एक यशोदानंदन श्री कृष्ण, एक द्वारिकधीश श्री कृष्ण, एक नित्य निकुञ्ज बिहारी श्री कृष्ण।' श्री कृष्ण - 'आपको कौन से चाहिए ?' बाबा - 'मैं तो नित्य निकुञ्जबिहारी श्री कृष्ण का परमोपासक हूँ।' श्री कृष्ण - 'वही तो मैं हूँ। अब सुलझा दूँ क्या ?' जैसे ही श्री कृष्ण जटा सुलझाने के लिए आगे बढ़े तो बाबा बोले - \" हाथ मत लगाना , पीछे हटो। अरे ! नित्य निकुञ्जबिहारी तो किशोरी जू के बिना, मेरी स्वामिनी श्री राधा रानी के बिना एक पल भी नहीं रहते और आप तो अकेले ही खड़े हो।\" बाबा के इतना कहते ही आकाश में बिजली सी चमकी और साक्षात श्री वृषभानुनंदिनी, वृन्दावनेश्वरी, श्री राधिका रानी बाबा के समक्ष प्रकट हो गईं और बोलीं - \"अरे बाबा !\nमैं ही तो ये श्री कृष्ण हूँ और श्री कृष्ण ही तो राधा हैं । हम दोनों एक हैं \" अब तो युगल सरकार का दर्शन पाकर बाबा आनंद विभोर हो उठे। उनकी आँखों से अश्रुधारा बहने लगी। अब जैसे ही श्री राधा-कृष्ण जटा सुलझाने आगे बढ़े -बाबा चरणों में गिर पड़े और बोले - अब जटा क्या सुलझाते हो प्रभु , अब तो जीवन ही सुलझा दो। बाबा ने ऐसी प्रार्थना की और प्रणाम करते करते उनका शरीर शांत हो गया। स्वामिनी जी ने उनको नित्य लीला में स्थान प्रदान किया।"])</script><script>self.__next_f.push([1,"e:Tafd,"])</script><script>self.__next_f.push([1,"Once upon a time in Braj, at Kadambkhandi near Barsana, there lived one saint named Naga Ji, who used to meditate on Yugal Swaroop (Radha and Krishna together). One day, He was going to groves in the evening passing through the big trees, where his hair got stuck with falling branches of one of the trees. He tried a lot to detach his hair but he wasn't able to do so. So he sat under the tree saying “whoever has had my hair stuck to the branches, shall only resolve it, else he will be going lifeless. Three days were passed and baba was still sitting under the tree.\nOne 5-7-year-old beautiful boy came near baba. The boy said politely in Braj language - “Baba can I resolve your stuck hair from branches?” As soon as the boy went ahead to resolve it, Baba suddenly said - “Don't touch it, stay back. Who are you?” Boy - “Ohh baba I am from this village only, I was roaming here to feed cows and saw you in this condition so I thought to help you.” Baba - “No no, stay away. whoever has done this shall resolve it.”\nBoy - “Baba you can tell me the name of the person who had done this, I will call him”.\nBaba - you go from here. I won’t tell you any name. This way, the boy was continuously convincing him but baba didn't agree. When Boy saw that Baba was not willing to take help from him, Suddenly Lord Krishna (with his beautiful flute in his hand) originated from that boy. Lord Krishna then said - Dear Baba! I have done this so here I am.\nAnd as soon as Lord Krishna went ahead to resolve his hair,\nBaba suddenly said - “Don’t touch, Stay back. First, tell me Which Krishn are you?” After listening to Baba's words Shri Krishna thought “whether there are 5-10 Krishn?”\nThen Shri Krishn said - “What do you mean by which Krishn?”\nBaba said - “See, there are many Krishn. One is Devkinandan Krishn, one is Yashoda Nandan Shree Krishn, one is Dwarika Dheesh Krishn, one is Nitya Nikunj Bihari Shri Krishn”.\nShri Krishn said - “Which Shri Krishn do you want?”\nBaba- “I am a follower of Nitya Nikunj Bihari.”\nShree Krishn said - “Yes, I am the same. Can I do it now?”\nAs soon as Shri Krishna went ahead to resolve it, And baba said - “Don't touch it, stay away. Nitya Nikunj Shri Krishna cannot live without Radha Rani for even a single second and you are standing here alone.”\nAs soon as baba said that, there was a thunderstorm struck in the clouds, and then “Shri Vrishbhanu Nandini, Vrindavaneshwari, Shri Radha Rani came in front of baba and said - “Oh baba! See now, we both are here. We both are one.”\nWith the presence of both (yugal sarkar) baba was amazed to see them. He started crying in happiness and both of them together resolved baba’s hairs. Yugal Sarkar Ki Jai. Albeli Sarkar Ki Jai. All Glories to the Rasik Saints of Braj."])</script><script>self.__next_f.push([1,"f:T1975,"])</script><script>self.__next_f.push([1,"बहुत समय पहले की बात है श्री वृंदावन में एक बाबा का निवास था , जो युगल स्वरुप की उपासना किया करते थे। एक बार वे बाबा संध्या वंदन के उपरांत कुञ्जवन की राहपर जा रहे थे। मार्ग में बाबा जब एक वटवृक्ष के नीचे होकर निकले तो उनकी जटा उस वटवृक्ष की जटाओं में उलझ गयी। बहुत प्रयास किया सुलझाने का परन्तु जटा नहीं सुलझी। महात्मा भी महात्मा ही होते हैं। वे आसन जमा कर बैठ गये कि जिसने जटा उलझाई है वो सुलझाने आएगा तो ठीक है नहीं तो मैं ऐसे ही बैठा रहूँगा और प्राण त्याग दूंगा। बाबा को बैठे हुए तीन दिन बीत गये।\nएक सांवला सलोना ग्वाला आया जो पांच-सात वर्ष का था। वो बालक ब्रजभाषा में बड़े दुलार से बोला - \" बाबा ! तुम्हारी तो जटा उलझ गयी, अरे मैं सुलझा दऊँ का ?\" और जैसे ही वो बालक जटा सुलझाने आगे बढ़ा -बाबा ने कहा - \" हाथ मत लगाना , पीछे हटो...कौन हो तुम ?\" ग्वाला - 'अरे ! हमारो जे ही गाम है महाराज! गैया चरा रह्यो तो मैंने देखि बाबा की जटा उलझ गई है तो सोची मैं जाय के सुलझा दऊँ। बाबा -'ना ना ना दूर हट जा। जिसने जटा उलझाई है वही सुलझायगा। ग्वाला - \"अरे महाराज ! तो जाने उलझाई है वाको नाम बताय देयो वाहे बुला लाऊँगो ।\" बाबा - \"तू जा— नाम नहीं बताते हम। कुछ देर तक वो बालक बाबा को समझाता रहा परन्तु जब बाबा नहीं माने तो ग्वाले में से साक्षात्मुरली बजाते हुए भगवान् बांके बिहारी प्रकट हो गये। सांवरिया सरकार बोले - \" महात्मन ! मैंने जटा उलझाई है ? तो लो आ गया मैं।\" और जैसेही सांवरिया जटा सुलझाने आगे बढ़े -बाबा ने कहा - 'हाथ मत लगाना , पीछे हटो। पहले बताओ तुम कौन से कृष्ण हो ?'\nबाबा के वचन सुनकर श्री कृष्ण सोच में पड़ गए कि अरे कृष्ण भी क्या दस-पांच हैं ? श्री कृष्ण बोले -'कौन से कृष्ण हो मतलब ?' बाबा - 'देखो श्री कृष्ण कई हैं। एक देवकी नंदन श्री कृष्ण हैं, एक यशोदानंदन श्री कृष्ण, एक द्वारिकधीश श्री कृष्ण, एक नित्य निकुञ्ज बिहारी श्री कृष्ण।' श्री कृष्ण - 'आपको कौन से चाहिए ?' बाबा - 'मैं तो नित्य निकुञ्जबिहारी श्री कृष्ण का परमोपासक हूँ।' श्री कृष्ण - 'वही तो मैं हूँ। अब सुलझा दूँ क्या ?' जैसे ही श्री कृष्ण जटा सुलझाने के लिए आगे बढ़े तो बाबा बोले - \" हाथ मत लगाना , पीछे हटो। अरे ! नित्य निकुञ्जबिहारी तो किशोरी जू के बिना, मेरी स्वामिनी श्री राधा रानी के बिना एक पल भी नहीं रहते और आप तो अकेले ही खड़े हो।\" बाबा के इतना कहते ही आकाश में बिजली सी चमकी और साक्षात श्री वृषभानुनंदिनी, वृन्दावनेश्वरी, श्री राधिका रानी बाबा के समक्ष प्रकट हो गईं और बोलीं - \"अरे बाबा !\nमैं ही तो ये श्री कृष्ण हूँ और श्री कृष्ण ही तो राधा हैं । हम दोनों एक हैं \" अब तो युगल सरकार का दर्शन पाकर बाबा आनंद विभोर हो उठे। उनकी आँखों से अश्रुधारा बहने लगी। अब जैसे ही श्री राधा-कृष्ण जटा सुलझाने आगे बढ़े -बाबा चरणों में गिर पड़े और बोले - अब जटा क्या सुलझाते हो प्रभु , अब तो जीवन ही सुलझा दो। बाबा ने ऐसी प्रार्थना की और प्रणाम करते करते उनका शरीर शांत हो गया। स्वामिनी जी ने उनको नित्य लीला में स्थान प्रदान किया।"])</script><script>self.__next_f.push([1,"10:Tde8,"])</script><script>self.__next_f.push([1,"एक बार श्री राधा रानी रास-लीला के मध्य एक उदास मनोदशा (मान) में थीं । रास-लीला वृन्दावन धाम में मनोहर जगह हो रही थी। मान की लीला में उन्होंने रास लीला का त्याग कर, यमुना को पार करके वो एक एकांत वन में आ गई। श्री राधा रानी ने श्री

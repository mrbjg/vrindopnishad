ी अवतार श्री हित हरिवंश महाप्रभु, श्री राधा सुधा निधि (73)\\nजहां कुञ्ज-भवन के अभ्यन्तर भाग में परम-प्रेमी श्रीलालजी एवं श्रीवृषभानुनन्दिनीजू की रति-केलि होती रहती है, ब्रजपति श्रीलालजी के स्नेहीजनों की परम्परा वहाँ से दूर ही विराजे, एवं उनके सखा-गण भी दूर ही विराजमान रहें । भृत्य-वर्ग के लोग तो और भी दूर रहें । (इनके अतिरिक्त) अन्य-जनों का तो वहां प्रसङ्ग ही उपस्थित नहीं होता! यहाँ तो केवल उनकी परम-प्रिय किंकरी ही द्वार पर स्थित रहकर विहारावर वणित काञ्ची-ध्वनि श्रवण करती है या मैं श्रवण करती हूँ।\",\"tags\":\"$b\",\"image_urls\":\"$c\",\"video_urls\":\"$d\",\"media_links\":\"$e\",\"source_url\":\"https://www.brajrasik.org/hi/articles/5b827adb5a23dd00503fc85d/dure-sanigdh-parampra-vijaytam-dure-suhunmandali-murali-avtar-shri-hita-harivansh-mahaprahu-shri-radha-sudha-nidhi\",\"slug\":\"dure-snigdh-parampara-vijayatan-dure-suhanmandali\"}\n"])</script><script>self.__next_f.push([1,"10:[\"slug\",\"dure-snigdh-parampara-vijayatan-dure-suhanmandali\",\"d\"]\n15:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"content\",\"dure-snigdh-parampara-vijayatan-dure-suhanmandali\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"dure-snigdh-parampara-vijayatan-dure-suhanmandali\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"dure-snigdh-parampara-vijayatan-dure-suhanmandali\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"dure-snigdh-parampara-vijayatan-dure-suhanmandali\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemLis ्वनि श्रवण करती है या मैं श्रवण करती हूँ।\",\"english_text\":null,\"english_translation\":\"Let the affectionate devotees of Shri Krishn stay far away. Let the friends and servants of him also stay far away. How can anyone approach this Nikunj Vrindavan forest? In a forest grove, King Vrsabhanu's daughter relishes pastimes with Her passionate lover. Standing at the doorway, I, Shri Radha's dear maidservant (Kinkari) will hear the tinkling of the ornaments at Her waist and relish the bliss!\",\"description\":\"https://www.brajrasik.org/hi/articles/5b827adb5a23dd00503fc85d/dure-sanigdh-parampra-vijaytam-dure-suhunmandali-murali-avtar-shri-hita-harivansh-mahaprahu-shri-radha-sudha-nidhi\",\"author\":\"मुरली अवतार श्री हित हरिवंश महाप्रभु, श्री राधा सुधा निधि (73)\",\"status\":\"published\",\"content_text\":\"दूरे स्निग्ध परम्परा विजयतां दूरे सुहन्मण्डली, भृत्याः सन्तु विदूरतो ब्रजपतेरन्य प्रसंगः कुतः ।\\nयत्र श्रीवृषभानुजा कृत रतिः कुञ्जोदरे कामिना, द्वारस्था प्रिय किङ्करी परमहं श्रोष्यामि कांची ध्वनिम् ॥\\n- मुरली अवतार श्री हित हरिवंश महाप्रभु, श्री राधा सुधा निधि (73)\\nजहां कुञ्ज-भवन के अभ्यन्तर भाग में परम-प्रेमी श्रीलालजी एवं श्रीवृषभानुनन्दिनीजू की रति-केलि होती रहती है, ब्रजपति श्रीलालजी के स्नेहीजनों की परम्परा वहाँ से दूर ही विराजे, एवं उनके सखा-गण भी दूर ही विराजमान रहें । भृत्य-वर्ग के लोग तो और भी दूर रहें । (इनके अतिरिक्त) अन्य-जनों का तो वहां प्रसङ्ग ही उपस्थित नहीं होता! यहाँ तो केवल उनकी परम-प्रिय किंकरी ही द्वार पर स्थित रहकर विहारावर वणित काञ्ची-ध्वनि श्रवण करती है या मैं श्रवण करती हूँ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b827adb5a23dd00503fc85d/dure-sanigdh-parampra-vijaytam-dure-suhunmandali-murali-avtar-shri-hita-harivansh-mahaprahu-shri-radha-sudha-nidhi\",\"slug\":\"dure-snigdh-parampara-vijayatan-dure-suhanmandali\"},\"initialRelatedSaint\":{\"name\":\"मुरली अवतार श्री हित हरिवंश , श्री राधा सुधा निधि (73)\",\"hinglishName\":\"murali avatar shri hit harivnsh , shri radha sudha nidhi (73)\",\"slug\":\"shri-hit-harivnsh-mahaprabhu\",\"biography\":\"श्री हित हरिवंश महाप्रभु, श्री वृंदावन धाम के रसिक शिरोमणि संत और श्री कृष्ण की वंशी के अवतार हैं। वे श्री राधारानी को ही अपना गुरु और इष्ट मानते हैं और राधावल्लभ संप्रदाय के मुख्य आचार्य हैं। इनकी उपासना में मुख्य रूप से सहचरी भाव है, जिसमें श्री राधा चरण प्रधानता है।\",\"metadata\":null,\"imageUrl\":null,\"verses\":[\"$a\"],\"books\":[],\"rawItem\":{\"id\":\"saint-local-1\",\"title\":\"श्री हित हरिवंश महाप्रभु\",\"hindi_text\":\"श्री हित हरिवंश महाप्रभु, श्री वृंदावन धाम के रसिक शिरोमणि संत और श्री कृष्ण की वंशी के अवतार हैं। वे श्री राधारानी को ही अपना गुरु और इष्ट मानते हैं और राधावल्लभ संप्रदाय के मुख्य आचार्य हैं। इनकी उपासना में मुख्य रूप से सहचरी भाव है, जिसमें श्री राधा चरण प्रधानता है।\",\"english_translation\":\"\",\"description\":\"https://www.brajrasik.org/hi/tag/hitharivansh\",\"tags\":[\"Braj Rasik\",\"Saint\",\"Biography\"],\"author\":\"BrajRasik.org\",\"category\":\"saint\",\"slug\":\"shri-hit-harivnsh-mahaprabhu\"}},\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$Lf\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$10\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L11\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Lf\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"er

्दावन चले गए। साथ में इनकी कृपापात्री ओरछा की रानी भागमती भी गई। वहाँ जाकर दोनों राधावल्लभ आचार्य गोस्वामी वनचन्द्र जी से दीक्षा लेकर रस-साधना में प्रवृत्त हो गये।\\nउन्होंने अपना परिचय कुछ इस प्रकार दिया है।\\n\\\"सुन्दर श्री बरसानो निवास और बास बसों श्री वृन्दावन धाम है।\\nदेवी हमारे श्री राधिका नागरी गोत सौं श्री हरिवंश नाम है॥\\nदेव हमारे श्रीराधिकावल्लभ रसिक अनन्य सभा विश्राम है।\\nनाम है नागरीदासि अली वृषभान लली की गली को गुलाम है॥”\\nबरसाना आगमन:\\nश्री हितहरिवंश की वाणी तथा आराध्ययुगल के नित्य-विहार में इनकी अगाध आस्था थी। ये प्रतिदिन हितवाणी के किसी एक पद को उठा लेते और अहर्निश उसीकी भावना में मग्न रहते थे। हितवाणी के आगे इनको रासलीला तथा श्रीमद्भागवत की कथा भी फीकी लगती थी। इसलिए उसमें सम्मिलित होने से प्रायः विरत रहते थे। वृन्दावन के कुछ रसभक्तिहीन उपासक इनके इस व्यवहार की आलोचना करते थे।\\nएक बार की बात है, गोस्वामी वनचंद्र जी के पुत्र श्री नागरवर गोस्वामी राधावल्लभ जी के मन्दिर में भागवत की कथा कह रहे थे। विरोधियों ने उनसे नागरीदास के कथा में सम्मिलित न होने की शिकायत की। इस पर नागरवर जी ने नागरीदास को बुलाकर कहा, 'आजकल दशम-स्कन्ध की कथा चल रही है। इसे तो आपको अवश्य श्रवण करना चाहिए। गुरु पुत्र की आज्ञा शिरोधार्य कर उस दिन नागरीदास जी कथा-मण्डप में उपस्थित हुए। धेनुकासुर-वध का प्रसंग चल रहा था। कथा में जैसे ही श्रीकृष्ण द्वारा धेनुकासुर के सहायक गधों का पैर पकड़ कर पटकने का वृत्तान्त सुना, ये अकुलाकर उठ खड़े हुए और उसी झोंक में बाहर चले गये। इनके इस आचरण से वहाँ उपस्थित सभी लोग खिन्न हो गये। दूसरे दिन जब गोस्वामी नागरवरजी ने इन्हें बुलाया और शपथ देकर कथा मण्डप से अकस्मात् उठ जाने का कारण पूछा तो ये बोले - 'उस समय मैं श्री हिताचार्य के एक पद की भावना में लीन था, जिसमें श्यामसुन्दर मानवती श्री राधा का सुन्दर चिबुक सहलाकर मनुहार कर रहे थे।\\nआजु निकुंज मंजु में खेलत, नवल किशोर नवीन किसोरी।\\nहरि उर मुकुर बिलोकि अपनपौ, विभ्रम विकल मानजुत भोरी॥\\nचिबुक सुचारु प्रलोइ प्रबोधित, पिय प्रतिबिंब जनाइ निहोरी।\\nनेति नेति वचनामृत सुनि सुनि, ललितादिक देखति दुरि चोरी।\\nहित हरिवंश करत कर धूनन, प्रणय कोप मालावलि तोरी॥\\nइसी बीच मेरे कानों में भगवान द्वारा धेनुकासुर के सहयोगी गधों के पैर पकड़ कर पटके जाने के शब्द पड़े। मन में विचार आया कि प्रिया की सुकोमल ठोढ़ी सहलाने वाले नागर के हस्त-कमल में गधे की टाँग कैसे शोभा देगी --\\nचिबुक सुचारु प्रलोइ प्रबोधित,\\nतिनकर गदहनि पग क्यों सोभित।\\nअप्रत्याशित व्यवधान से मेरी मानसी भावना खंडित हो गई और मैं उद्विग्न होकर बाहर चला गया। इस स्पष्टीकरण से नागरीदास जी की उच्च आध्यात्मिक स्थिति का संधान पाकर गोस्वामी नागरवर जी ने इन्हें हृदय से लगा लिया। इसके बावजूद निंदकों ने इनका पीछा नहीं छोड़ा। अत: खिन्न होकर ये वृन्दावन छोड़कर राधा जी की लीलास्थली बरसाने चले गये। निंदकों के द्वेषपूर्ण आचरण से उत्पन्न निराशा और असहायता की यथार्थ अभिव्यक्ति इनकी निम्नांकित साखी में मिलती है --\\nजिनके बल निधरक हुते, तेइ बैरी भये बान।\\nतरकस के सर साँप ह्वै, फिरि-फिरि लागे खान॥\\nबरसाने में इन्होंने गहवरवन की पहाड़ी पर अपनी कुटी बनाई जो आज मोर कुटी के नाम से प्रसिद्ध है।\\nश्री राधारानी दर्शन:\\nकहा जाता है कि एक दिन यहीं सखियों सहित श्री राधाजी ने इन्हें दर्शन देकर कृतार्थ किया। स्वामिनी के तेजोमय दिव्यरूप पर दृष्टि पड़ते ही ये मूच्च्छित हो गये । इसी स्थिति में इन्होंने राधा जी को यह कहते सुना --\\nभूखे हैं हम आधी रैन, या बिरिया ख्वावै तब चैन।\\nबरसाने में अस्थल करौ, मेरी बरसगाँठ उर धरौ॥\\n(मैं नित्य प्रति यहाँ खेलने आती हूँ। आधीरात के समय हमें भूख लग जाती है। इस समय यदि कुछ खिलावो तो शान्ति मिले। बरसाने में मेरा मन्दिर बनावो और नियमित रूप से मेरी वर्षगाँठ का आयोजन करो।)\\nनागरीदास जी ने परम हर्षित हो राधाजी को अर्द्धरात्रि में भोजन कराया और निशीथ-भोग (खीर और पूड़ि) के इस नियम का आजीवन निर्वाह करते रहे। राधाजी ने उस समय दूसरी बात बरसाने में अपना मन्दिर बनवाकर प्रति वर्ष जन्मोत्सव मनाने की कही थी। इसके परिपालनार्थ नागरीदास जी ने अपनी कृपापात्री रानी भागमती के सहयोग से वहाँ श्रीराधा-मन्दिर का निर्माण कराया और बड़ी धूमधाम से राधाष्टमीपर्व मनाने की परंपरा स्थापित की जो अब तक अविच्छिन्न रूप से चली आ रही है।\\nग्रंथ रचना:\\nनेह नागरीदास की रचनाओं को विषयानुसार तीन वर्गों में विभाजित किया जा सकता है -\\nसिद्धान्त दोहावली\\n(छन्द सं ९३५),\\nरस पदावली\\n(छंद सं. २३२) तथा\\nपदावली\\n(छंद सं १०२)। इनमें क्रमशः श्री हित हरिवंश का यशोगान तथा उनके द्वारा प्रतिपादित भक्ति-सिद्धान्त का निरूपण, आराध्य युगल की विहारलीला, रास, वृन्दावन एवं बरसाना की महिमा, मन-प्रबोधन आदि विषयों का भावपूर्ण निरूपण किया गया है।\\nअपने व्यक्तित्व तथा कृतित्व द्वारा श्री हित हरिवंश गोस्वामी सम्प्रदाय को सुव्यवस्थित रूप देने वाले महात्माओं में नागरीदास जी का नाम अग्रगण्य है। महात्मा ध्रुवदास और चाचा वृन्दावनदास ने इनका स्मरण निष्ठावान भक्त के रूप में किया है।\\nShri Neh Nagaridas was born around 1590, under the Gondwana region of Madhya Pradesh, in a rich Panwar Kshatriya family in a village named Berchha.\\nSpiritual Life:\\nHe was a devotee and was inclined towards sage service since childhood. Once Radhavallabhiya Rasik Shri Chaturbhuj Das Ji, who was a resident of a village called Gadha of Madhya Pradesh, visited his village along with the saint congregation. With his satsang, he got attracted towards Nitya Vihar Upasna.\\nVrindavan Arrival:\\nUnder the influence of Shri Chaturbhuj Das's satsang, Shri Neh Nagridas Ji left home and went to Vrindavan. Along with him, his benevolent queen Bhagmati of Orchha also went. After going there, both of them took initiation from Radhavallabh Acharya Goswami Vanchandra Ji and started their practice of Nitya Vihar Upasna.\\nHe has introduced himself as follows.\\n\\\"Sundar Shri Barsano Nivaas Aur Baas Bason Shri Vrindavan Dham Hai.\\nDevi Hamaare Shri Radhika Nagri Got Saun Shri Harivansh Naam Hai.\\nDev Hamaare Shriradhikavallabh Rasik Anany Sabha Vishram Hai.\\nNaam Hai Nagridasi Ali Vrishbhan Lali Ki Gali Ko Gulam Hai.”\\nBarsana Arrival:\\nShri Neh Nagridas Ji had great faith in the Vani of Shri Hitharivansh and in the Nitya Vihar of Shri Shyama Shyam. He would take up one of the poems of Hit Vani every day and do contemplation day and night. In front of Hit Vani, the story of Rasleela and Shrimad Bhagwat also seemed to have faded. Therefore, he often stayed away from joining it. Some non-devotional worshipers of Vrindavan used to criticize his behavior.\\nOnce upon a time, Goswami Shri Nagarvar Ji, son of Vanchandra Ji was telling the story of Bhagwat in the temple of Radhavallabh Ji. Opponents complained to him for not being involved in the narrative of Nagaridas. On this, Nagarwar Ji called Nagaridas and said, 'Nowadays the story of Dasam-Skandha is going on. You must listen to this. Nagridas Ji appeared in the Katha-Mandap on that day by obeying the Guru's son. Dhenukasur-slaughter's story was going on. As soon as the story was heard that Shri Krishna holding the legs of Dhenukasura's assistant's asses and slamming, Nagridas Ji stood up in a hurry and went out of the hall. Due to this behavior, all the people present there were upset. On the second day when Goswami Nagarvar Ji called him and asked the reason for accidentally getting up from the Katha Mandap, he said - 'At that time I was absorbed in the poem of pastimes of Shri Hitacharya, in which Shyamsundar was persuading Shri Radha by holding her chin with his tender hand.\\nAaju Nikunj Manju Mein Khelat, Naval Kishor Naveen Kisori.\\nHari Ur Mukur Biloki Apanpau, Vibhram Vikal Maanjut Bhori.\\nChibuk Suchaaru Praloi Prabodhit, Piy Pratibimb Janai Nihori.\\nNeti Neti Vachnamrit Suni Suni, Lalitadik Dekhati Duri Chori.\\nHit Harivansh Karat Kar Dhoonan, Pranay Kop Malavali Tori.\\nMeanwhile, in my ears, the words of Shri Krishna holding Dhenukasura's associate asses and banging. The thought came into my mind how Shri Krishna, who is holding Priya's tender chin, will hold the donkey's leg with his lotus hand.\\nChibuk Sucharu Praloi Prabodhit,\\nTinkar Gadahani Paga Kyon Sobhit.\\nUnexpected disruption ruined my inner sentiment and I rushed out. With this explanation, Goswami Nagarwar Ji got him heartily after finding the high spiritual status of Nagaridas Ji. Despite this, the cynics did not stop pursuing him. So, being disgusted, he left Vrindavan and went to Radha Ji's Pastimes place Barsana. The true expression of despair and helplessness arising out of the malicious behavior of cynicists is found in his following Saakhi -\\nJinake Bal Nidharak Hute, Tei Bairi Bhaye Baan.\\nTarakas Ke Sar Saanp Hvai, Phiri-phiri Laage Khaan.\\nIn Barsana, he built his hut on the hill of Gaharvan, which is famous today as Mor Kuti.\\nShri Radharani Darshan:\\nIt is said that one day, Shri Radhaji, along with his friends, appeared and gave him darshan. As soon as he saw the splendid celestial form of Shri Radha, he became dumb. In this situation, he heard Radha Ji saying -\\nBhukhe Hain Ham Aadhi Rain, Ya Biriya Khvaavai Tab Chain.\\nBarsane Mein Asthal Karau, Meri Barasgaanth Ur Dharau.\\n(We come here every day to play here. We feel hungry at midnight. Can you give us food at midnight? Build my temple in Barsana and organize my birth anniversary regularly.)\\nNagaridas Ji gave a very delicious meal to Radhaji at midnight and continued to live this rule of Nishith-Bhog (kheer and puri). At that time, Radha Ji had said to build a temple in Barsana and celebrate the birth anniversary every year. For this, Nagaridas Ji, with the help of his benevolent queen Bhagmati, built the Shri Radha Temple there and established the tradition of celebrating Radhashtami festival with great pomp, which is still going on uninterruptedly.\\nText composition:\\nThe works of Neh Nagaridas can be divided into three sections according to the subject -\\nSiddhanta Dohavali\\n(verses: 35),\\nRas Padavali\\n(verses: 232) and\\nPadavali\\n(verses: 102). In these, respectively, Glories of Shri Hita Harivansh and the representation of devotion-theory propounded by him, Vihar Lila of the adorable couple, Glory of Raas, Vrindavan and Barsana, Emotional representation of subjects are enlightened.\\nNagaridas Ji's name is foremost among the Rasik's who have given a systematic shape to the Shri Hrit Harivansh Goswami sect by his personality and work. Shri Dhruvdas and Chacha Vrindavandas have mentioned him as a devoted devotee.\",\"author\":{\"@type\":\"Person\",\"name\":\"ब्रज रसिक धरोहर\"},\"publisher\":{\"@type\":\"Organization\",\"name\":\"वृंदोपनिषद्\",\"logo\":{\"@type\":\"ImageObject\",\"url\":\"https://path.vrindopnishad.in/official-logo-dark.svg\"}}}"])</script><script>self.__next_f.push([1,"a:T312e,"])</script><script>self.__next_f.push([1,"नेह नागरीदास का जन्म सन. १५९० के लगभग मध्य प्रदेश के गोंडवाना क्षेत्रान्तर्गत बेरछा नामक गाँव के एक सम्पन्न पँवार क्षत्रिय परिवार में हुआ था।\nआध्यात्मिक जीवन:\nबाल्यावस्था से ही भगवद्भक्ति और साधु सेवा में इनकी रुचि थी । एक बार राधावल्लभीय महात्मा चतुर्भुजदास, जो मध्यप्रदेश के ही गढ़ा नामक गाँव के निवासी थे, सन्त-मण्डली सहित इनके गाँव में पधारे । उनके सत्संग से ये प्रेमोपासना की ओर आकृष्ट हुए।\nवृन्दावन आगमन:\nश्री चतुर्भुजदास जी के सत्संग के प्रभाव से श्री नेह नगरीदास जी घर-बार त्यागकर वृन्दावन चले गए। साथ में इनकी कृपापात्री ओरछा की रानी भागमती भी गई। वहाँ जाकर दोनों राधावल्लभ आचार्य गोस्वामी वनचन्द्र जी से दीक्षा लेकर रस-साधना में प्रवृत्त हो गये।\nउन्होंने अपना परिचय कुछ इस प्रकार दिया है।\n\"सुन्दर श्री बरसानो निवास और बास बसों श्री वृन्दावन धाम है।\nदेवी हमारे श्री राधिका नागरी गोत सौं श्री हरिवंश नाम है॥\nदेव हमारे श्रीराधिकावल्लभ रसिक अनन्य सभा विश्राम है।\nनाम है नागरीदासि अली वृषभान लली की गली को गुलाम है॥”\nबरसाना आगमन:\nश्री हितहरिवंश की वाणी तथा आराध्ययुगल के नित्य-विहार में इनकी अगाध आस्था थी। ये प्रतिदिन हितवाणी के किसी एक पद को उठा लेते और अहर्निश उसीकी भावना में मग्न रहते थे। हितवाणी के आगे इनको रासलीला तथा श्रीमद्भागवत की कथा भी फीकी लगती थी। इसलिए उसमें सम्मिलित होने से प्रायः विरत रहते थे। वृन्दावन के कुछ रसभक्तिहीन उपासक इनके इस व्यवहार की आलोचना करते थे।\nएक बार की बात है, गोस्वामी वनचंद्र जी के पुत्र श्री नागरवर गोस्वामी राधावल्लभ जी के मन्दिर में भागवत की कथा कह रहे थे। विरोधियों ने उनसे नागरीदास के कथा में सम्मिलित न होने की शिकायत की। इस पर नागरवर जी ने नागरीदास को बुलाकर कहा, 'आजकल दशम-स्कन्ध की कथा चल रही है। इसे तो आपको अवश्य श्रवण करना चाहिए। गुरु पुत्र की आज्ञा शिरोधार्य कर उस दिन नागरीदास जी कथा-मण्डप में उपस्थित हुए। धेनुकासुर-वध का प्रसंग चल रहा था। कथा में जैसे ही श्रीकृष्ण द्वारा धेनुकासुर के सहायक गधों का पैर पकड़ कर पटकने का वृत्तान्त सुना, ये अकुलाकर उठ खड़े हुए और उसी झोंक में बाहर चले गये। इनके इस आचरण से वहाँ उपस्थित सभी लोग खिन्न हो गये। दूसरे दिन जब गोस्वामी नागरवरजी ने इन्हें बुलाया और शपथ देकर कथा मण्डप से अकस्मात् उठ जाने का कारण पूछा तो ये बोले - 'उस समय मैं श्री हिताचार्य के एक पद की भावना में लीन था, जिसमें श्यामसुन्दर मानवती श्री राधा का सुन्दर चिबुक सहलाकर मनुहार कर रहे थे।\nआजु निकुंज मंजु में खेलत, नवल किशोर नवीन किसोरी।\nहरि उर मुकुर बिलोकि अपनपौ, विभ्रम विकल मानजुत भोरी॥\nचिबुक सुचारु प्रलोइ प्रबोधित, पिय प्रतिबिंब जनाइ निहोरी।\nनेति नेति वचनामृत सुनि सुनि, ललितादिक देखति दुरि चोरी।\nहित हरिवंश करत कर धूनन, प्रणय कोप मालावलि तोरी॥\nइसी बीच मेरे कानों में भगवान द्वारा धेनुकासुर के सहयोगी गधों के पैर पकड़ कर पटके जाने के शब्द पड़े। मन में विचार आया कि प्रिया की सुकोमल ठोढ़ी सहलाने वाले नागर के हस्त-कमल में गधे की टाँग कैसे शोभा देगी --\nचिबुक सुचारु प्रलोइ प्रबोधित,\nतिनकर गदहनि पग क्यों सोभित।\nअप्रत्याशित व्यवधान से मेरी मानसी भावना खंडित हो गई और मैं उद्विग्न होकर बाहर चला गया। इस स्पष्टीकरण से नागरीदास जी की उच्च आध्यात्मिक स्थिति का संधान पाकर गोस्वामी नागरवर जी ने इन्हें हृदय से लगा लिया। इसके बावजूद निंदकों ने इनका पीछा नहीं छोड़ा। अत: खिन्न होकर ये वृन्दावन छोड़कर राधा जी की लीलास्थली बरसाने चले गये। निंदकों के द्वेषपूर्ण आचरण से उत्पन्न निराशा और असहायता की यथार्थ अभिव्यक्ति इनकी निम्नांकित साखी में मिलती है --\nजिनके बल निधरक हुते, तेइ बैरी भये बान।\nतरकस के सर साँप ह्वै, फिरि-फिरि लागे खान॥\nबरसाने में इन्होंने गहवरवन की पहाड़ी पर अपनी कुटी बनाई जो आज मोर कुटी के नाम से प्रसिद्ध है।\nश्री राधारानी दर्शन:\nकहा जाता है कि एक दिन यहीं सखियों सहित श्री राधाजी ने इन्हें दर्शन देकर कृतार्थ किया। स्वामिनी के तेजोमय दिव्यरूप पर दृष्टि पड़ते ही ये मूच्च्छित हो गये । इसी स्थिति में इन्होंने राधा जी को यह कहते सुना --\nभूखे हैं हम आधी रैन, या बिरिया ख्वावै तब चैन।\nबरसाने में अस्थल करौ, मेरी बरसगाँठ उर धरौ॥\n(मैं नित्य प्रति यहाँ खेलने आती हूँ। आधीरात के समय हमें भूख लग जाती है। इस समय यदि कुछ खिलावो तो शान्ति मिले। बरसाने में मेरा मन्दिर बनावो और नियमित रूप से मेरी वर्षगाँठ का आयोजन करो।)\nनागरीदास जी ने परम हर्षित हो राधाजी को अर्द्धरात्रि में भोजन कराया और निशीथ-भोग (खीर और पूड़ि) के इस नियम का आजीवन निर्वाह करते रहे। राधाजी ने उस समय दूसरी बात बरसाने में अपना मन्दिर बनवाकर प्रति वर्ष जन्मोत्सव मनाने की कही थी। इसके परिपालनार्थ नागरीदास जी ने अपनी कृपापात्री रानी भागमती के सहयोग से वहाँ श्रीराधा-मन्दिर का निर्माण कराया और बड़ी धूमधाम से राधाष्टमीपर्व मनाने की परंपरा स्थापित की जो अब तक अविच्छिन्न रूप से चली आ रही है।\nग्रंथ रचना:\nनेह नागरीदास की रचनाओं को विषयानुसार तीन वर्गों में विभाजित किया जा सकता है -\nसिद्धान्त दोहावली\n(छन्द सं ९३५),\nरस पदावली\n(छंद सं. २३२) तथा\nपदावली\n(छंद सं १०२)। इनमें क्रमशः श्री हित हरिवंश का यशोगान तथा उनके द्वारा प्रतिपादित भक्ति-सिद्धान्त का निरूपण, आराध्य युगल की विहारलीला, रास, वृन्दावन एवं बरसाना की महिमा, मन-प्रबोधन आदि विषयों का भावपूर्ण निरूपण किया गया है।\nअपने व्यक्तित्व तथा कृतित्व द्वारा श्री हित हरिवंश गोस्वामी सम्प्रदाय को सुव्यवस्थित रूप देने वाले महात्माओं में नागरीदास जी का नाम अग्रगण्य है। महात्मा ध्रुवदास और चाचा वृन्दावनदास ने इनका स्मरण निष्ठावान भक्त के रूप में किया है।"])</script><script>self.__next_f.push([1,"b:T1548,"])</script><script>self.__next_f.push([1,"Shri Neh Nagaridas was born around 1590, under the Gondwana region of Madhya Pradesh, in a rich Panwar Kshatriya family in a village named Berchha.\nSpiritual Life:\nHe was a devotee and was inclined towards sage service since childhood. Once Radhavallabhiya Rasik Shri Chaturbhuj Das Ji, who was a resident of a village called Gadha of Madhya Pradesh, visited his village along with the saint congregation. With his satsang, he got attracted towards Nitya Vihar Upasna.\nVrindavan Arrival:\nUnder the influence of Shri Chaturbhuj Das's satsang, Shri Neh Nagridas Ji left home and went to Vrindavan. Along with him, his benevolent queen Bhagmati of Orchha also went. After going there, both of them took initiation from Radhavallabh Acharya Goswami Vanchandra Ji and started their practice of Nitya Vihar Upasna.\nHe has introduced himself as follows.\n\"Sundar Shri Barsano Nivaas Aur Baas Bason Shri Vrindavan Dham Hai.\nDevi Hamaare Shri Radhika Nagri Got Saun Shri Harivansh Naam Hai.\nDev Hamaare Shriradhikavallabh Rasik Anany Sabha Vishram Hai.\nNaam Hai Nagridasi Ali Vrishbhan Lali Ki Gali Ko Gulam Hai.”\nBarsana Arrival:\nShri Neh Nagridas Ji had great faith in the Vani of Shri Hitharivansh and in the Nitya Vihar of Shri Shyama Shyam. He would take up one of the poems of Hit Vani every day and do contemplation day and night. In front of Hit Vani, the story of Rasleela and Shrimad Bhagwat also seemed to have faded. Therefore, he often stayed away from joining it. Some non-devotional worshipers of Vrindavan used to criticize his behavior.\nOnce upon a time, Goswami Shri Nagarvar Ji, son of Vanchandra Ji was telling the story of Bhagwat in the temple of Radhavallabh Ji. Opponents complained to him for not being involved in the narrative of Nagaridas. On this, Nagarwar Ji called Nagaridas and said, 'Nowadays the story of Dasam-Skandha is going on. You must listen to this. Nagridas Ji appeared in the Katha-Mandap on that day by obeying the Guru's son. Dhenukasur-slaughter's story was going on. As soon as the story was heard that Shri Krishna holding the legs of Dhenukasura's assistant's asses and slamming, Nagridas Ji stood up in a hurry and went out of the hall. Due to this behavior, all the people present there were upset. On the second day when Goswami Nagarvar Ji called him and asked the reason for accidentally getting up from the Katha Mandap, he said - 'At that time I was absorbed in the poem of pastimes of Shri Hitacharya, in which Shyamsundar was persuading Shri Radha by holding her chin with his tender hand.\nAaju Nikunj Manju Mein Khelat, Naval Kishor Naveen Kisori.\nHari Ur Mukur Biloki Apanpau, Vibhram Vikal Maanjut Bhori.\nChibuk Suchaaru Praloi Prabodhit, Piy Pratibimb Janai Nihori.\nNeti Neti Vachnamrit Suni Suni, Lalitadik Dekhati Duri Chori.\nHit Harivansh Karat Kar Dhoonan, Pranay Kop Malavali Tori.\nMeanwhile, in my ears, the words of Shri Krishna holding Dhenukasura's associate asses and banging. The thought came into my mind how Shri Krishna, who is holding Priya's tender chin, will hold the donkey's leg with his lotus hand.\nChibuk Sucharu Praloi Prabodhit,\nTinkar Gadahani Paga Kyon Sobhit.\nUnexpected disruption ruined my inner sentiment and I rushed out. With this explanation, Goswami Nagarwar Ji got him heartily after finding the high spiritual status of Nagaridas Ji. Despite this, the cynics did not stop pursuing him. So, being disgusted, he left Vrindavan and went to Radha Ji's Pastimes place Barsana. The true expression of despair and helplessness arising out of the malicious behavior of cynicists is found in his following Saakhi -\nJinake Bal Nidharak Hute, Tei Bairi Bhaye Baan.\nTarakas Ke Sar Saanp Hvai, Phiri-phiri Laage Khaan.\nIn Barsana, he built his hut on the hill of Gaharvan, which is famous today as Mor Kuti.\nShri Radharani Darshan:\nIt is said that one day, Shri Radhaji, along with his friends, appeared and gave him darshan. As soon as he saw the splendid celestial form of Shri Radha, he became dumb. In this situation, he heard Radha Ji saying -\nBhukhe Hain Ham Aadhi Rain, Ya Biriya Khvaavai Tab Chain.\nBarsane Mein Asthal Karau, Meri Barasgaanth Ur Dharau.\n(We come here every day to play here. We feel hungry at midnight. Can you give us food at midnight? Build my temple in Barsana and organize my birth anniversary regularly.)\nNagaridas Ji gave a very delicious meal to Radhaji at midnight and continued to live this rule of Nishith-Bhog (kheer and puri). At that time, Radha Ji had said to build a temple in Barsana and celebrate the birth anniversary every year. For this, Nagaridas Ji, with the help of his benevolent queen Bhagmati, built the Shri Radha Temple there and established the tradition of celebrating Radhashtami festival with great pomp, which is still going on uninterruptedly.\nText composition:\nThe works of Neh Nagaridas can be divided into three sections according to the subject -\nSiddhanta Dohavali\n(verses: 35),\nRas Padavali\n(verses: 232) and\nPadavali\n(verses: 102). In these, respectively, Glories of Shri Hita Harivansh and the representation of devotion-theory propounded by him, Vihar Lila of the adorable couple, Glory of Raas, Vrindavan and Barsana, Emotional representation of subjects are enlightened.\nNagaridas Ji's name is foremost among the Rasik's who have given a systematic shape to the Shri Hrit Harivansh Goswami sect by his personality and work. Shri Dhruvdas and Chacha Vrindavandas have mentioned him as a devoted devotee."])</script><script>self.__next_f.push([1,"c:T313c,"])</script><script>self.__next_f.push([1,"जन्म:\nनेह नागरीदास का जन्म सन. १५९० के लगभग मध्य प्रदेश के गोंडवाना क्षेत्रान्तर्गत बेरछा नामक गाँव के एक सम्पन्न पँवार क्षत्रिय परिवार में हुआ था।\nआध्यात्मिक जीवन:\nबाल्यावस्था से ही भगवद्भक्ति और साधु सेवा में इनकी रुचि थी । एक बार राधावल्लभीय महात्मा चतुर्भुजदास, जो मध्यप्रदेश के ही गढ़ा नामक गाँव के निवासी थे, सन्त-मण्डली सहित इनके गाँव में पधारे । उनके सत्संग से ये प्रेमोपासना की ओर आकृष्ट हुए।\nवृन्दावन आगमन:\nश्री चतुर्भुजदास जी के सत्संग के प्रभाव से श्री नेह नगरीदास जी घर-बार त्यागकर वृन्दावन चले गए। साथ में इनकी कृपापात्री ओरछा की रानी भागमती भी गई। वहाँ जाकर दोनों राधावल्लभ आचार्य गोस्वामी वनचन्द्र जी से दीक्षा लेकर रस-साधना में प्रवृत्त हो गये।\nउन्होंने अपना परिचय कुछ इस प्रकार दिया है।\n\"सुन्दर श्री बरसानो निवास और बास बसों श्री वृन्दावन धाम है।\nदेवी हमारे श्री राधिका नागरी गोत सौं श्री हरिवंश नाम है॥\nदेव हमारे श्रीराधिकावल्लभ रसिक अनन्य सभा विश्राम है।\nनाम है नागरीदासि अली वृषभान लली की गली को गुलाम है॥”\nबरसाना आगमन:\nश्री हितहरिवंश की वाणी तथा आराध्ययुगल के नित्य-विहार में इनकी अगाध आस्था थी। ये प्रतिदिन हितवाणी के किसी एक पद को उठा लेते और अहर्निश उसीकी भावना में मग्न रहते थे। हितवाणी के आगे इनको रासलीला तथा श्रीमद्भागवत की कथा भी फीकी लगती थी। इसलिए उसमें सम्मिलित होने से प्रायः विरत रहते थे। वृन्दावन के कुछ रसभक्तिहीन उपासक इनके इस व्यवहार की आलोचना करते थे।\nएक बार की बात है, गोस्वामी वनचंद्र जी के पुत्र श्री नागरवर गोस्वामी राधावल्लभ जी के मन्दिर में भागवत की कथा कह रहे थे। विरोधियों ने उनसे नागरीदास के कथा में सम्मिलित न होने की शिकायत की। इस पर नागरवर जी ने नागरीदास को बुलाकर कहा, 'आजकल दशम-स्कन्ध की कथा चल रही है। इसे तो आपको अवश्य श्रवण करना चाहिए। गुरु पुत्र की आज्ञा शिरोधार्य कर उस दिन नागरीदास जी कथा-मण्डप में उपस्थित हुए। धेनुकासुर-वध का प्रसंग चल रहा था। कथा में जैसे ही श्रीकृष्ण द्वारा धेनुकासुर के सहायक गधों का पैर पकड़ कर पटकने का वृत्तान्त सुना, ये अकुलाकर उठ खड़े हुए और उसी झोंक में बाहर चले गये। इनके इस आचरण से वहाँ उपस्थित सभी लोग खिन्न हो गये। दूसरे दिन जब गोस्वामी नागरवरजी ने इन्हें बुलाया और शपथ देकर कथा मण्डप से अकस्मात् उठ जाने का कारण पूछा तो ये बोले - 'उस समय मैं श्री हिताचार्य के एक पद की भावना में लीन था, जिसमें श्यामसुन्दर मानवती श्री राधा का सुन्दर चिबुक सहलाकर मनुहार कर रहे थे।\nआजु निकुंज मंजु में खेलत, नवल किशोर नवीन किसोरी।\nहरि उर मुकुर बिलोकि अपनपौ, विभ्रम विकल मानजुत भोरी॥\nचिबुक सुचारु प्रलोइ प्रबोधित, पिय प्रतिबिंब जनाइ निहोरी।\nनेति नेति वचनामृत सुनि सुनि, ललितादिक देखति दुरि चोरी।\nहित हरिवंश करत कर धूनन, प्रणय कोप मालावलि तोरी॥\nइसी बीच मेरे कानों में भगवान द्वारा धेनुकासुर के सहयोगी गधों के पैर पकड़ कर पटके जाने के शब्द पड़े। मन में विचार आया कि प्रिया की सुकोमल ठोढ़ी सहलाने वाले नागर के हस्त-कमल में गधे की टाँग कैसे शोभा देगी --\nचिबुक सुचारु प्रलोइ प्रबोधित,\nतिनकर गदहनि पग क्यों सोभित।\nअप्रत्याशित व्यवधान से मेरी मानसी भावना खंडित हो गई और मैं उद्विग्न होकर बाहर चला गया। इस स्पष्टीकरण से नागरीदास जी की उच्च आध्यात्मिक स्थिति का संधान पाकर गोस्वामी नागरवर जी ने इन्हें हृदय से लगा लिया। इसके बावजूद निंदकों ने इनका पीछा नहीं छोड़ा। अत: खिन्न होकर ये वृन्दावन छोड़कर राधा जी की लीलास्थली बरसाने चले गये। निंदकों के द्वेषपूर्ण आचरण से उत्पन्न निराशा और असहायता की यथार्थ अभिव्यक्ति इनकी निम्नांकित साखी में मिलती है --\nजिनके बल निधरक हुते, तेइ बैरी भये बान।\nतरकस के सर साँप ह्वै, फिरि-फिरि लागे खान॥\nबरसाने में इन्होंने गहवरवन की पहाड़ी पर अपनी कुटी बनाई जो आज मोर कुटी के नाम से प्रसिद्ध है।\nश्री राधारानी दर्शन:\nकहा जाता है कि एक दिन यहीं सखियों सहित श्री राधाजी ने इन्हें दर्शन देकर कृतार्थ किया। स्वामिनी के तेजोमय दिव्यरूप पर दृष्टि पड़ते ही ये मूच्च्छित हो गये । इसी स्थिति में इन्होंने राधा जी को यह कहते सुना --\nभूखे हैं हम आधी रैन, या बिरिया ख्वावै तब चैन।\nबरसाने में अस्थल करौ, मेरी बरसगाँठ उर धरौ॥\n(मैं नित्य प्रति यहाँ खेलने आती हूँ। आधीरात के समय हमें भूख लग जाती है। इस समय यदि कुछ खिलावो तो शान्ति मिले। बरसाने में मेरा मन्दिर बनावो और नियमित रूप से मेरी वर्षगाँठ का आयोजन करो।)\nनागरीदास जी ने परम हर्षित हो राधाजी को अर्द्धरात्रि में भोजन कराया और निशीथ-भोग (खीर और पूड़ि) के इस नियम का आजीवन निर्वाह करते रहे। राधाजी ने उस समय दूसरी बात बरसाने में अपना मन्दिर बनवाकर प्रति वर्ष जन्मोत्सव मनाने की कही थी। इसके परिपालनार्थ नागरीदास जी ने अपनी कृपापात्री रानी भागमती के सहयोग से वहाँ श्रीराधा-मन्दिर का निर्माण कराया और बड़ी धूमधाम से राधाष्टमीपर्व मनाने की परंपरा स्थापित की जो अब तक अविच्छिन्न रूप से चली आ रही है।\nग्रंथ रचना:\nनेह नागरीदास की रचनाओं को विषयानुसार तीन वर्गों में विभाजित किया जा सकता है -\nसिद्धान्त दोहावली\n(छन्द सं ९३५),\nरस पदावली\n(छंद सं. २३२) तथा\nपदावली\n(छंद सं १०२)। इनमें क्रमशः श्री हित हरिवंश का यशोगान तथा उनके द्वारा प्रतिपादित भक्ति-सिद्धान्त का निरूपण, आराध्य युगल की विहारलीला, रास, वृन्दावन एवं बरसाना की महिमा, मन-प्रबोधन आदि विषयों का भावपूर्ण निरूपण किया गया है।\nअपने व्यक्तित्व तथा कृतित्व द्वारा श्री हित हरिवंश गोस्वामी सम्प्रदाय को सुव्यवस्थित रूप देने वाले महात्माओं में नागरीदास जी का नाम अग्रगण्य है। महात्मा ध्रुवदास और चाचा वृन्दावनदास ने इनका स्मरण निष्ठावान भक्त के रूप में किया है।"])</script><script>self.__next_f.push([1,"e:[\"slug\",\"neh-nagari-das-ji\",\"d\"]\n13:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"content\",\"neh-nagari-das-ji\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"neh-nagari-das-ji\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"neh-nagari-das-ji\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"content\",{\"children\":[[\"slug\",\"neh-nagari-das-ji\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$6\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"मुख्यपृष्ठ\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"पुस्तकालय\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"नेह नागरी दास जी\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/content/neh-nagari-das-ji\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-6xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L7\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[[\"$\",\"$L7\",null,{\"href\":\"/hi/content\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"पुस्तकालय\"}],[\"$\",\"span\",null,{\"children\":\"→\"}]],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate max-w-[200px]\",\"children\":\"नेह नागरी दास जी\"}]]}],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$L9\",null,{\"initialContent\":{\"id\":\"local-545\",\"title\":\"नेह नागरी दास जी\",\"category\":\"Shloka\",\"sanskrit_text\":\"जन्म:\",\"hindi_text\":\"$a\",\"english_text\":null,\"english_translation\":\"$b\",\"description\":\"https://www.brajrasik.org/hi/articles/5999622e59e8c72a534d85b1/shri-neh-nagridas-rasik-saint-of-braj\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"$c\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5999622e59e8c72a534d85b1/shri-neh-nagridas-rasik-saint-of-braj\",\"slug\":\"neh-nagari-das-ji\"},\"initialRelatedSaint\":null,\"initialRelatedBook\":null,\"initialRelatedRaga\":null,\"initialRelatedVerses\":[{\"id\":\"local-0\",\"title\":\"बनी श्रीराधा मोहन की जोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"बनी श्रीराधा मोहन की जोरी।इंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।भाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।गज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।नील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\",\"hindi_text\":\"भावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"english_text\":null,\"english_translation\":\"The divine couple, Shri Radha Krishn is all attractive and unique. All attractive Shri Shyam Sundar is effulgent like a blue sapphire and the daughter of Shri Vrishbhanu, Shri Radha is golden complexioned. The divine forehead of Shri Krishn is glorified with distinctive Tilak mark (his forehead is adorned by the mark of bright saffron), whereas beloved Radha rani has charming vermillion in her parting line of head. The walking style of Shri Krishn is most similar to that of the elephant, which is so captivating and Shri Radharani’s extraordinary style of walking is similar to that of an intoxicated elephant as well. Shri Radha wears attractive blue garments and Shri Krishn wears attractive yellow garments. Shri Hit Harivansh Mahaprabhu says, the beauty and bliss of this divine couple is limitless. Shri Krishn, the beloved one of Radha, is actually the crest jewel of all Rasiks and Shri Radha is never ending ocean of the blissful divine beauty who provides ceaseless bliss to the Rasiks.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"author\":\"श्री हित हरिवंश , हित चतुरासी (09)\",\"status\":\"published\",\"content_text\":\"(राग बिलावल)\\nबनी श्रीराधा मोहन की जोरी।\\nइंद्र नील मनि स्याम मनोहर, सात कुंभ तनु गोरी।।\\nभाल बिसाल तिलक हरि, कामिनि चिकुर चंद्र बिच रोरी।\\nगज नाइक प्रभु चाल, गयंदनि गति वृषभानु किसोरी।।\\nनील निचोल जुवति, मोहन पट पीत अरुन सिर खोरी।\\n(जै श्री) हित हरिवंश रसिक राधा पति, सुरत रंग में बोरी।।\\nश्री हित हरिवंश , हित चतुरासी (09)\\nभावार्थ-अति अनुपम जोड़ी है श्री राधा मोहन की। मनोहर श्याम सुन्दर इन्द्र नील मणि की भाँति हैं। तो वृषभानु किशोरी श्रीराधा काञ्चन तनु हैं।लाल के विशाल भाल पर तिलक शोभित है, तो कामिनि प्रिया की केश चन्द्रिका के मध्य (माँग) में रोरी लसित है। मोहन लाल की गति (चाल) मत्त गजराज जैसी मोहक और श्रीवृषभानु नन्दिनी की मत्त करिणी जैसी मद मथर है।नव तरुणि श्रीराधा के श्रीअंग में नीलाम्बर शोभित हैं और श्याम सुन्दर के श्यामाङ्ग पर पीत कौशेय धारण है। उपरोक्त नख शिख शृङ्गार की पूर्णता शिरोभाग पर लसित अरुण खोरी (छोर) कर रहा है। श्रीहित हरिवंश कहते हैं यह जोड़ी सौन्दर्थ्य एवं रस की सीमा है। राधापति श्रीकृष्ण रसिक चूडामणि हैं और श्रीराधा सूरत रस सिन्धु रूपा हैं जो रसिकों को नित्य रस देती हैं ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0d865c9f7ab760360f9c70/bani-shri-radha-mohan-ki-jori-shri-hita-harivansh-mahaprabhu-from-hit-chaturasi-09\",\"slug\":\"bani-shriradha-mohan-ki-jori\"},{\"id\":\"local-1\",\"title\":\"राधा नाम को आधार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को आधार,ललित लालवर रटत निरंतर, सरबस रस को सार ||सब गुण हीन मलीन दीन, अति पतितन में सरदार |ललित किशोरी तासु भरोसे सोवत पॉव पसार ||\",\"hindi_text\":\"श्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"english_text\":null,\"english_translation\":\"Shri Lalit Kishori says, \\\"Shri Radha’s name is the foundation of his devotion. Shri Krishn the crest jewel of all the Rasiks, incessantly chants the same name, which is the essence of all the nectarian bliss. With humbleness, Shri Lalit Kishori says, although I am devoid of the entire expedient, my heart is awfully dirty and decayed. Thus I am an orphan from every point of view and leader of all the fallen souls. But still He says, simply by having a strong faith in Shri Radha’s name, he sleeps fearlessly.”\",\"description\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को आधार,\\nललित लालवर रटत निरंतर, सरबस रस को सार ||\\nसब गुण हीन मलीन दीन, अति पतितन में सरदार |\\nललित किशोरी तासु भरोसे सोवत पॉव पसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०५)\\nश्री ललित किशोरी जी कहते हैं की उनके जीवन का आधार एक मात्रा श्री राधा नाम ही है | यह वह दिव्य नाम है जो श्री लाल जी निरंतर रटन करते हैं एवं समस्त रस का मानो सार ही राधा नाम है | श्री ललित किशोरी जी\\nके विनम्र शब्दों में, \\\"यूँ तो मैं गुण हीन, अशुद्ध हृदय युक्त, दीन एवं समस्त पतितों में शिरोमणि हूँ लेकिन केवल और केवल श्री राधा नाम एवं श्री किशोरीजी के बल से दोनों पॉंव पसार कर अर्थात निर्भय होकर सोता हूँ\\\" |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5af9fc999f7ab760360f9c52/radha-naam-ko-aadhar-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-adhara\"},{\"id\":\"local-3\",\"title\":\"राधा नाम को उर धार\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम को उर धार,मिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,आठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,ललित किशोरी फीके परिहैं सरवस सुख संसार ||\",\"hindi_text\":\"आपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"english_text\":null,\"english_translation\":\"You have to keep Shri Radha's name in your heart all the time, believing the fact that she herself is seated in her name. You will be able to meet Shree Krishna on the gates of the Kunja, without any further efforts. In the words of Shri Lalit Kishoriji, your eyes will relish the ras (bliss) of Shri Radha Krishn at Nikunj Vihaar and even the greatest pleasures of the world will look immaterial (comparable to nothing).\",\"description\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\",\"status\":\"published\",\"content_text\":\"(राग देस)\\nराधा नाम को उर धार,\\nमिलहिं रसिक मुकुटमणि मोहन आपहिं कुंजन द्वार,\\nआठों जाम छकेंगी अँखियाँ छवि निकुंज विहार,\\nललित किशोरी फीके परिहैं सरवस सुख संसार ||\\n- ललित किशोरी जी, अभिलाष माधुरी, विनय (२०४)\\nआपको केवल राधा नाम को हृदय से धारण करना है, यह मान कर की किशोरीजी के नाम में वह बैठी हैं। आपको बिना प्रयास के ही श्याम सुन्दर कुञ्ज द्वार में मिल जाएंगे। श्री ललित किशोरीजी के शब्दों में राधा कृष्ण के रस को आठों याम अँखियाँ चखेंगी और निकुंज विहार रस प्राप्त होगा और संसार का समस्त बड़े से बड़ा सुख भी तुच्छ लगेगा।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a853a8b82274812fecf9694/radha-naam-ko-ur-dhar-pada-written-by-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-ko-ur-dhara\"}]}]}]],null],null],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\",\"$e\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"content\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"lang\":\"hi\",\"children\":[\"$\",\"$Ld\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lf\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\

e, the pastimes of 'Radha Krishn quarrel with each other was fascinating too. At that moment, Shri Krishna was trying his best to free the fastenings at Shri Radharani's waist.\n\"Hari Ura Mukur Biloki Apanpi, Vibhrim Vikal Maan Juta Bhori”\nShree Radha, saw the image of her on the shining chest of Shree Krishn, by misunderstanding she becomes distraught or angry.\n\"Chibuk Suchari Praloi Prabhodhat, Piya Pratibimb Janai Nihori”\nThen beloved Krishn tickled his chin and appealing to her in a humble manner, makes clear that \"Oh Radhe, You are extremely innocent, it is a mere reflection of your beautiful image only”.\n\"Neti Neti Bachnamrit Suni Suni, Lalitadik Dekhati Duti Chori”\nThe companions like Laita and others watching and listening to this divine scene of quarrel secretly in Nikunj Van.\n\"Jai Shri Hita Harivansh Karat Kar Dhunan, Pranay Kopa Malavali Tori\"\nShree Hit Harivansh Mahaprabhu says that, in this divine pastimes of the quarrel of Radha Krishn at Nikunj, Shri Radha saying \"No not my image\" in a fascinating way, Shree Radha is now angry with Shri Krishn, and breaks all of the garlands on his chest. In the temple of the beautiful Nikunj at Vrindavan, the blissfulness of divine pastimes of youthful Radha Krishn duo continues to exist."])</script><script>self.__next_f.push([1,"b:T1208,"])</script><script>self.__next_f.push([1,"(राग विभास)\nआजु निकुंज मंजु में खेलत, नवल किसोर नवीन किसोरी |  अति अनुपम अनुराग परसपर, सुनि अभूत भूतल पर जोरी ||\nविद्रुम फटिक विविध निर्मित धर, नव कर्पूर पराग न थोरी |  कौंमल किसलय सैंन सुपेसल, तापर स्याम निवेसित गोरी ||\nमिथुन हास परिहास परायन, पीक कपोल कमल पर झोरी |  गौर स्याम भुज कलह मनोहर, नीवी बंधन मोचत डोरी ||\nहरि उर मुकुर बिलोकि अपनपी, विभ्रम विकल मान जुत भोरी |  चिबुक सुचारु प्रलोइ प्रवोधत, पिय प्रतिबिंब जनाइ निहोरी ||\n'नेति नेति' बचनामृत सुनि सुनि, ललितादिक देखतिं दुरि चोरी |  (जै श्री) हित हरिवंश करत कर धूनन, प्रनय कोप मालावलि तोरी ||\n- श्री हित हरिवंश महाप्रभु, हित चौरासी (7)\nसुन्दर निकुंज मंदिर में नवल किशोर

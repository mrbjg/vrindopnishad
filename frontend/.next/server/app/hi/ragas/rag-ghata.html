:\"Shloka\",\"sanskrit_text\":\"हँसनि में फुलनि की चाहनि में अमृत की,नख-सिख रूप ही की बरषा सी होती है। [1]केसनि की चंद्रिका सुहाग अनुराग घटा,दामिनी की लसनी दसन ही की दोती है॥ [2]'हित ध्रुव' पानिप तरंग-रस छलकत,ताकि मानौ सहज सिंगार सीवाँ पोति है। [3]अति अलबेली प्रिये भूषित भूषन बिनु,छिन-छिन औरै और बदन की जोति है॥ [4]\",\"hindi_text\":\"श्री प्रिया जी का हास्य कुसुम निर्झर के समान है, और उनका अवलोकन सरस सुधा-प्रवाह के समान है। उनके सर्वांग स्वरूप से रूप-सौंदर्य की वर्षा होती रहती है। [1]\\nउनकी केश-राशि का विस्तार सुहाग और अनुराग में उमड़ते मेघ के समान है, और उनकी दसन-द्युति दामिनी की दमक के समान कान्तियुक्त है। [2]\\nश्री ध्रुवदास जी कहते हैं कि प्रिया के रूप में अद्भुत लावण्यपूर्वक रस की तरंगें छलकती रहती हैं, और कंठ में धारण की हुई पोत की लड़ी श्रृंगार की परमावधि है। [3]\\nअनन्य लावण्य-सौंदर्यमयी प्रिया, भूषण-रहित होते हुए भी भूषणों से अलंकृत होने से अधिक शोभामयी प्रतीत होती हैं, और उनके मुख-मंडल की ज्योति प्रतिक्षण नित्य नवनवायमान होती रहती है। [4]\",\"english_text\":null,\"english_translation\":\"The sweetness of Śrī Rādhā's bewitching smile is spectacular resembling flowers. When She gazes upon someone, it feels as if the pure nectar is raining. [1]\\nShe is plunged from head to toe in the nectar ocean of transcendental beauty. [2]\\nHer hair-parting decorated with vermilion is like a cloud overflowing in the transcendental divine love. Even the glaze of lightning in the sky feels ashamed looking at the glint of Her teeth. [3]\\nŚrī Hita Dhruvdās says that ever-new Heavy tides of amazingly blissful nectar arise in Her form and Her necklace (garland) is the pinnacle of adornment. This fair-complexioned lady is the endless epitome of beauty, is looking gorgeously adorned even without any ornaments. The divine effulgence and splendor of Śrī Rādhā's face is ever-new every moment. [4]\",\"description\":\"https://www.brajrasik.org/hi/articles/5d9ca1ebda8fa90060518c1e/hansani-mein-phulani-ki-shri-hit-dhruvdas-bayalees-leela-shringar-shat-115\",\"author\":\"श्री हित ध्रुवदास, बयालीस लीला, श्रृंगार शत 1 (15)\",\"status\":\"published\",\"content_text\":\"हँसनि में फुलनि की चाहनि में अमृत की,\\nनख-सिख रूप ही की बरषा सी होती है। [1]\\nकेसनि की चंद्रिका सुहाग अनुराग घटा,\\nदामिनी की लसनी दसन ही की दोती है॥ [2]\\n'हित ध्रुव' पानिप तरंग-रस छलकत,\\nताकि मानौ सहज सिंगार सीवाँ पोति है। [3]\\nअति अलबेली प्रिये भूषित भूषन बिनु,\\nछिन-छिन औरै और बदन की जोति है॥ [4]\\n- श्री हित ध्रुवदास, बयालीस लीला, श्रृंगार शत 1 (15)\\nश्री प्रिया जी का हास्य कुसुम निर्झर के समान है, और उनका अवलोकन सरस सुधा-प्रवाह के समान है। उनके सर्वांग स्वरूप से रूप-सौंदर्य की वर्षा होती रहती है। [1]\\nउनकी केश-राशि का विस्तार सुहाग और अनुराग में उमड़ते मेघ के समान है, और उनकी दसन-द्युति दामिनी की दमक के समान कान्तियुक्त है। [2]\\nश्री ध्रुवदास जी कहते हैं कि प्रिया के रूप में अद्भुत लावण्यपूर्वक रस की तरंगें छलकती रहती हैं, और कंठ में धारण की हुई पोत की लड़ी श्रृंगार की परमावधि है। [3]\\nअनन्य लावण्य-सौंदर्यमयी प्रिया, भूषण-रहित होते हुए भी भूषणों से अलंकृत होने से अधिक शोभामयी प्रतीत होती हैं, और उनके मुख-मंडल की ज्योति प्रतिक्षण नित्य नवनवायमान होती रहती है। [4]\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d9ca1ebda8fa90060518c1e/hansani-mein-phulani-ki-shri-hit-dhruvdas-bayalees-leela-shringar-shat-115\",\"slug\":\"hnsani-men-fulani-ki-chahani-men-amrit-ki\"}],\"imageUrl\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"ragas\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"ragas\",\"children\"],\"error\":\

े , आप की कृपा से श्यामा प्यारी जी नृत्य कर रही हैं , सो मैं बलि बलि जाऊँ ।\",\"english_text\":null,\"english_translation\":\"$9\",\"description\":\"https://www.brajrasik.org/hi/articles/59a1bdc359e8c72a534d85b5/kunjbihari-haun-teree-balaee-leun-pad-by-swami-shri-haridas-ji\",\"author\":\"श्री हरिदास, केलिमाल (12)\",\"status\":\"published\",\"content_text\":\"(राग कान्हरौ)\\nकुंजबिहारी हौं तेरी बलाइ\\nलेऊँ नीके हौ गावत।\\nराग रागिनीन के जूथ उपजावत।।\\nतैसीयै तैसी मिली जोरी\\nप्रिया जू की मुख देखत चंद लजावत।\\nश्रीहरिदास के स्वामी स्यामा कौ\\nनृत्य देखत काहि न भावत।।\\n- श्री हरिदास, केलिमाल (12)\\nकुंजबिहारी की भावना है प्यारी जी आप मुझे अंग संग कर कुंजों विहार कर रही हैं , मैं आप की बलायें यानि बलिहारी पर लेता हूँ, आप अपनी कृपालुता बरसाती रहें , आप इसी भांति रहें , बोलें , गाती रहें । आप के आलिंगन से अनेक मनोरथ पूर्ण होते हैं , नये उपजते भी उपजते हैं । सखी बोली - प्रिया जी की मुख चन्द्र के आगे लाल जी का मुख चन्द्र फीका प्रतीत हो रहा है । प्रिया जी के अंग के सम्मुख प्रिय का अंग दब गया है या कहीं छिप गया है । हरिदासी सखी यहाँ सुख विलास रति में किन का नृत्य विशेष है , दर्शाना चाह रही हैं । श्री श्यामा जी का नृत्य श्वास है , यह सुन श्री श्याम जी प्रसन्नता से बोल पड़े , आप की कृपा से श्यामा प्यारी जी नृत्य कर रही हैं , सो मैं बलि बलि जाऊँ ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59a1bdc359e8c72a534d85b5/kunjbihari-haun-teree-balaee-leun-pad-by-swami-shri-haridas-ji\",\"slug\":\"kunjabihari-haun-teri-balai\"}],\"imageUrl\":null}}]}]],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"ragas\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]

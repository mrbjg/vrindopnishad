"ragas\",{\"children\":[[\"slug\",\"rag-sarnga\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"ItemList\\\",\\\"name\\\":\\\"राग सारंग\\\",\\\"description\\\":\\\"राग राग सारंग में रचित पदों की सूची\\\",\\\"numberOfItems\\\":4,\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"url\\\":\\\"https://path.vrindopnishad.in/hi/content/ham-kab-hohinge-brajavasi\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"url\\\":\\\"https://path.vrindopnishad.in/hi/content/jake-man-basai-vrindavana\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"url\\\":\\\"https://path.vrindopnishad.in/hi/content/ati-nagari-vrishabhanu-kisori\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":4,\\\"url\\\":\\\"https://path.vrindopnishad.in/hi/content/jivat-marat-vrindavan-sharanain\\\"}]}\"}}],[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"मुख्यपृष्ठ\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"राग\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/ragas\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"राग सारंग\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/ragas/rag-sarnga\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-4xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/hi/ragas\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"राग\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"राग सारंग\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialRaga\":{\"name\":\"राग सारंग\",\"hinglishName\":\"rag sarnga\",\"slug\":\"rag-sarnga\",\"verses\":[{\"id\":\"local-84\",\"title\":\"हम कब होहिंगे ब्रजवासी\",\"category\":\"Shloka\",\"sanskrit_text\":\"हम कब होहिंगे ब्रजवासी।ठाकुर नंदकिशोर हमारे, ठकुराइनि राधा सी।।कब मिलि हैं वे सखी सहेली, हरिवंशी हरिदासी।वंशीवट की शीतल छहियाँ, सुभग नदी जमुना सी।।जाकी वैभव करत लालसा, कर-मीत कमलासी।इतनी आस व्यास की पुजवहु वृन्दाविपिन विलासी |\",\"hindi_text\":\"$9\",\"english_text\":null,\"english_translation\":\"(Raag Sarang)\\nHum Kab Hoinge Brajwasi,\\nThakur Yugal Kishor Humare Thakurani Radha Si,\\nKab Mili Hain Ve Sakhi Saheli Harivanshi Haridasi,\\nBanshivata Ki Sheetal Chahiyan, Subhag Nadi Yamunasi,\\nJaaki Vaibhav Karata Lalsa, Kar Meeta Kamla Si,\\nItni Aas Vyas Ki Pujvahu, Vrindavipin Vilasi.\\n-Shri Hariram Vyas (Vishakha Avtaar) - From Vyas Vani, Purvardh (104)\\nWhen will we become true Brajwasis (i.e residents of Braj), since Shri Nand Kishor is our master, and our Queen is one and only Shri Radha rani. When will we meet our dearest sakhi friends like Harivanshi (Hita Sakhi) and Haridasi (Lalita sakhi). When will we dwell in Banshivat, sit under Banshivat shade where nearby charming Yamuna is flowing. The same land which is always desired by Goddess like Maha lakshmi and she is humbly standing to get access to this divine land by holding both the hands pressed together. Shri Hariram Vyas incarnation of Shri Vishakha sakhi says, my only desire is to remain in this land called \\\"Vrindavan\\\" and serve it incessantly!\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0906ff9f7ab760360f9c5f/hum-kab-hohinge-brajwasi-shri-hariram-vyas-vishakha-avtaar-from-vyas-vani\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, पूर्वार्ध (104)\",\"status\":\"published\",\"content_text\":\"$a\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0906ff9f7ab760360f9c5f/hum-kab-hohinge-brajwasi-shri-hariram-vyas-vishakha-avtaar-from-vyas-vani\",\"slug\":\"ham-kab-hohinge-brajavasi\"},{\"id\":\"local-112\",\"title\":\"जाके मन बसै वृंदावन\",\"category\":\"Shloka\",\"sanskrit_text\":\"जाके मन बसै वृंदावन।सोई रसिक अनन्य धन्य, जाकैं हितराधामोहन॥ताही नित्य विहार फुरै वन, लीलाकौ अनुकरन।विषय वासना नाँहिन जाकैं, सुधरे अंतहकरन॥लोक वेदकौ भेद न जाकैं, श्रीभागवत सो धन।ताकैं व्यास रास रस वरषत, बहिगई कामिनि कंचन॥\",\"hindi_text\":\"(राग सारंग एवं रामकली)\\nजाके मन बसै वृंदावन।\\nसोई रसिक अनन्य धन्य, जाकैं हितराधामोहन॥\\nताही नित्य विहार फुरै वन, लीलाकौ अनुकरन।\\nविषय वासना नाँहिन जाकैं, सुधरे अंतहकरन॥\\nलोक वेदकौ भेद न जाकैं, श्रीभागवत सो धन।\\nताकैं व्यास रास रस वरषत, बहिगई कामिनि कंचन॥\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (174)\\nजिन महानुभावों का चित्त, श्री धाम वृंदावन एवं श्री राधा कृष्ण से जुड़ गया है, वे रसिक जन धन्य है। जो रसिक महापुरुष विषय वासना से रहित हैं एवं जिनका अंतः करण निर्मल हो चुका है, उन्हीं के ह्रदय में नित्य बिहार रस का प्रकाश होता है एवं नित्य बिहार लीलाओं की स्फुर्णा होती हैं। श्री हरिराम व्यास जी कह रहे हैं “जिनको लोक लाज का भय नहीं, जिनको वेदों की मर्यादा का भय नहीं एवं जिनकी भेद बुद्धि समाप्त हो गयी है, उन्हीं के हृदय में महारास के दिव्य रस की वर्षा होती है और उस रस से कीर्ति, कामिनी एवं कंचन हृदय से बह कर बाहर निकल जाते हैं।”\",\"english_text\":null,\"english_translation\":\"(Raag Sarang or Ramkali)\\nJaake Man Basai Vrindavan.\\nSoee Rasik Anany Dhany, Jaakain HitRadhaMohan.\\nTaahi Nity Vihaar Phurai Van, Leelakau Anukaran.\\nVishay Vaasna Naahin Jaakain, Sudhare Antahkaran.\\nLok Vedkau Bhed Na Jaakain, Shribhaagavat So Dhan.\\nTaakain Vyas Raas Ras Varshat, Bahigayi Kamini Kanchan.\\n- Shri Hariram Vyas (Vishakha Avatar) - Vyas Vani, Purvardh (174)\\nThe blessed soul or the jewel among the Rasiks is the one who is exclusively attached to Shri Vrindavan Dham and Shri Radha Krishn.\\nThat blessed soul receives the exclusive pleasure of Nitya Vihar Rasa and is naturally immersed in the joyous leela (love-play) of the Divine Couple.\\nHis heart is pure and all the sensual desires of this world are destroyed.\\nThe blessed soul completely gives up the decorum of society, Vedas, clan and his true wealth is to remain absorbed in the leelas of the Divine!\\nThe blessed soul drinks the nectar of Raas Ras (dance leela) and his desires of Kaamini (young girls) and Kanchan (wealth) are completely destroyed.\",\"description\":\"https://www.brajrasik.org/hi/articles/5d83ba516851f9006900c88a/jaake-man-basai-vrindavan-shri-hariram-vyas-vishakha-avatar-vyas-vani-174\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, पूर्वार्ध (174)\",\"status\":\"published\",\"content_text\":\"(राग सारंग एवं रामकली)\\nजाके मन बसै वृंदावन।\\nसोई रसिक अनन्य धन्य, जाकैं हितराधामोहन॥\\nताही नित्य विहार फुरै वन, लीलाकौ अनुकरन।\\nविषय वासना नाँहिन जाकैं, सुधरे अंतहकरन॥\\nलोक वेदकौ भेद न जाकैं, श्रीभागवत सो धन।\\nताकैं व्यास रास रस वरषत, बहिगई कामिनि कंचन॥\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (174)\\nजिन महानुभावों का चित्त, श्री धाम वृंदावन एवं श्री राधा कृष्ण से जुड़ गया है, वे रसिक जन धन्य है। जो रसिक महापुरुष विषय वासना से रहित हैं एवं जिनका अंतः करण निर्मल हो चुका है, उन्हीं के ह्रदय में नित्य बिहार रस का प्रकाश होता है एवं नित्य बिहार लीलाओं की स्फुर्णा होती हैं। श्री हरिराम व्यास जी कह रहे हैं “जिनको लोक लाज का भय नहीं, जिनको वेदों की मर्यादा का भय नहीं एवं जिनकी भेद बुद्धि समाप्त हो गयी है, उन्हीं के हृदय में महारास के दिव्य रस की वर्षा होती है और उस रस से कीर्ति, कामिनी एवं कंचन हृदय से बह कर बाहर निकल जाते हैं।”\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d83ba516851f9006900c88a/jaake-man-basai-vrindavan-shri-hariram-vyas-vishakha-avatar-vyas-vani-174\",\"slug\":\"jake-man-basai-vrindavana\"},{\"id\":\"local-287\",\"title\":\"अति नागरि वृषभानु किसोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"अति नागरि वृषभानु किसोरी।सुनि दूतिका चपल मृगनैंनी, आकरषत चितवत चित गोरी।।श्रीफ़ल उरज कंचन सी देही, कटि केहरि गुन सिंधु झकोरी।बैंनी भुजंग चंद्र सत वदनी, कदलि जंघ जलचर गति चोरी।।सुनि ‘हरिवंश’ आजु रजनी मुख , बन मिलाइ मेरी निज जोरी।यद्पि मान समेत भामिनी , सुनि कत रहत भली जिय भोरी।।\",\"hindi_text\":\"$b\",\"english_text\":null,\"english_translation\":\"$c\",\"description\":\"https://www.brajrasik.org/hi/articles/5be47da57b46b400571a5569/ati-nagari-vrishbhanu-kishori-shri-hita-harivansh-mahaprabhu-shri-hita-chaurasi-43-\",\"author\":\"श्री हरिवंश महाप्रभु  हित चतुरासी (43)\",\"status\":\"published\",\"content_text\":\"$d\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5be47da57b46b400571a5569/ati-nagari-vrishbhanu-kishori-shri-hita-harivansh-mahaprabhu-shri-hita-chaurasi-43-\",\"slug\":\"ati-nagari-vrishabhanu-kisori\"},{\"id\":\"local-616\",\"title\":\"जीवत मरत वृन्दावन शरनैं\",\"category\":\"Shloka\",\"sanskrit_text\":\"जीवत मरत वृन्दावन शरनैं ॥सुनहुँ सुचित ह्वै (श्री) राधामोहन, यह विनती मन धरनै।यही परम पुरुषार्थ मेरौ, और कछु नहीं करनैं॥स्याम भरोसे, तेरे व्रत के, नहीं व्यास कौ टरनैं ॥\",\"hindi_text\":\"(राग सारंग)\\nजीवत मरत वृन्दावन शरनैं ॥\\nसुनहुँ सुचित ह्वै (श्री) राधामोहन, यह विनती मन धरनै।\\nयही परम पुरुषार्थ मेरौ, और कछु नहीं करनैं॥\\nस्याम भरोसे, तेरे व्रत के, नहीं व्यास कौ टरनैं ॥\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (289)\\nहे मेरे प्रियतम श्यामा श्याम ध्यानपूर्वक आप मेरे हृदय की विनती सुनिए: \\\"मुझपर ऐसी कृपा कीजिये कि जीवन मरण मैं केवल श्री वृन्दावन धाम की शरण में ही रहूँ \\\"। मेरा केवल एक ही परम पुरुषार्थ है कि मैं जीवन से मरण अवस्था अर्थात हर क्षण केवल श्री वृन्दावन धाम की शरण में ही रहूं | हे श्याम सुन्दर, व्यास दास की यह दृढ़ प्रतिज्ञा आपके ही भरोसे है कृपया आप इसे टाले नहीं।\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5c1fdc207f2c6a00524cdff1/jeevat-marat-vrindavan-sharnein-shri-hariram-vyas-vishakha-avtar-vyas-vani-289\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, पूर्वार्ध (289)\",\"status\":\"published\",\"content_text\":\"(राग सारंग)\\nजीवत मरत वृन्दावन शरनैं ॥\\nसुनहुँ सुचित ह्वै (श्री) राधामोहन, यह विनती मन धरनै।\\nयही परम पुरुषार्थ मेरौ, और कछु नहीं करनैं॥\\nस्याम भरोसे, तेरे व्रत के, नहीं व्यास कौ टरनैं ॥\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (289)\\nहे मेरे प्रियतम श्यामा श्याम ध्यानपूर्वक आप मेरे हृदय की विनती सुनिए: \\\"मुझपर ऐसी कृपा कीजिये कि जीवन मरण मैं केवल श्री वृन्दावन धाम की शरण में ही रहूँ \\\"। मेरा केवल एक ही परम पुरुषार्थ है कि मैं जीवन से मरण अवस्था अर्थात हर क्षण केवल श्री वृन्दावन धाम की शरण में ही रहूं | हे श्याम सुन्दर, व्यास दास की यह दृढ़ प्रतिज्ञा आपके ही भरोसे है कृपया आप इसे टाले नहीं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5c1fdc207f2c6a00524cdff1/jeevat-marat-vrindavan-sharnein-shri-hariram-vyas-vishakha-avtar-vyas-vani-289\",\"slug\":\"jivat-marat-vrindavan-sharanain\"}],\"imageUrl\":null}}]}]],null],null],null]},[null,[\"$\",\"$Le\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"ragas\",\"children\",\"$f\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L10\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$Le\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"ragas\",\"children\"],\"error\":\"$undefined\",\"errorStyles

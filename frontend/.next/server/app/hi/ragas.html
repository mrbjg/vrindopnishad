ें ही सुनी एवं देखी जाती है। निकुंज मंदिर की भूमि दिव्य मूँगा स्फटिक आदि नाना मणियों से खचित है। उस मणिमय भूमि पर नव कर्पूर की रज बिखर रही है। सुकोमल नव पल्लव रचित एक शय्या सुशोभित है। उस शय्या पर श्याम सुन्दर ने श्री प्रिया जी को आग्रह पूर्वक विराज मान किया है। भाव यह है कि उन्हें निकुंजारतगत शय्या में पौढ़ाया है। हास परिहास परायण युगल किशोर ने परस्पर कपोल-कमल पर ताम्दूल की पीक अंकित करके रस विस्तार किया है। उस समय गौर-श्याम का बाहु कलह बड़ा मनोहर प्रतीत होता है। पश्चात् श्याम सुन्दर श्री प्रियाजी के कटि बन्धन मुक्त करने का सरस प्रयास करते हैं। श्रीराधा प्रियतम के उज्जवल वक्ष में अपनी छवि देखकर विभ्रम से व्याकुल तथा मान-युक्त हो जाती हैं। तब प्रियतम उनके अत्यन्त सुन्दर चिबुक को सहलाकर अनुनयपूर्ण निवेदन करते हुए यह स्पष्ट करते हैं कि यह आपकी सुन्दर छवि का ही प्रति बिम्ब है। श्री हित हरिवंश कहते हैं कि इस प्रेम कलह में श्री प्रिया के मुख से 'नेति-नेति' वचनामृत सुनकर ललितादि सहचरी छिपकर चोरी चोरी इस प्रेम कलह का दर्शन कर रही हैं। श्री प्रिया जी ने हाथापाई करते हुए प्रणय कोप वश श्री लाल जी के वृक्ष स्थल की मालाएँ तोड दीं।"])</script><script>self.__next_f.push([1,"1f:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"ragas\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"ragas\",{\"children\":[\"__PAGE__\",{}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"ragas\",{\"children\":[\"__PAGE__\",{},[[\"$L5\",[\"$\",\"$L6\",null,{\"children\":[\"$\",\"$L7\",null,{\"initialRagas\":[{\"name\":\"राग रस\",\"hinglishName\":\"rag rasa\",\"slug\":\"rag-rasa\",\"verses\":[{\"id\":\"local-24\",\"title\":\"नारायण दो बात सों\",\"category\":\"Shloka\",\"sanskrit_text\":\"नारायण दो बात सों, अधिक और नहिं बात |रसिकनको सत्संग नित, युगलध्यान दिनरात ||\",\"hindi_text\":\"नारायण दो बात सों, अधिक और नहिं बात |\\nरसिकनको सत्संग नित, युगलध्यान दिनरात ||\\nश्री नारायण स्वामी - अनुराग रस (183)\\nसाधक के लिए, दो बातों से बड़ी और कोई बात नहीं है:\\n1. यदि रसिकों का संग नित्य मिल जाए।\\n2. रात दिन युगल रूप ध्यान बना रहे।\",\"english_text\":null,\"english_translation\":\"For an aspirant, there is no bigger achievement than these two things:\\n1. Getting association of Rasik Saints ceaselessly.\\n2. To be immersed day and night in loving remembrance of the form of Yugal Sarkar Shri Radha Krishn.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b71cf2ee2a515004edc249c/narayan-do-baat-son-shri-narayan-swami-anurag-ras\",\"author\":\"श्री नारायण स्वामी  अनुराग रस (183)\",\"status\":\"published\",\"content_text\":\"नारायण दो बात सों, अधिक और नहिं बात |\\nरसिकनको सत्संग नित, युगलध्यान दिनरात ||\\nश्री नारायण स्वामी - अनुराग रस (183)\\nसाधक के लिए, दो बातों से बड़ी और कोई बात नहीं है:\\n1. यदि रसिकों का संग नित्य मिल जाए।\\n2. रात दिन युगल रूप ध्यान बना रहे।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b71cf2ee2a515004edc249c/narayan-do-baat-son-shri-narayan-swami-anurag-ras\",\"slug\":\"narayan-do-bat-son\"},{\"id\":\"local-104\",\"title\":\"परस्पर दोउ चकोर, दोउ चंदा\",\"category\":\"Shloka\",\"sanskrit_text\":\"परस्पर दोउ चकोर, दोउ चंदा |दोउ चातक, दोउ स्वाति,दोउ घन, दोउ दामिनी अमंदा ||दोउ अरबिंद, दोउ अलि लंपट, दोउ लोहा दोउ चुबंक |दोउ आसक, महबूब दोउ मिलि, जुरे जुराफा अंबक ||दोउ मुदार, दोउ मोर, दोउ मृग, दोउ राग रस भीने |दोउ मनि बिसद, दोउ बर पन्नग, दोउ बारि दोउ मीने ||भगवतरसिक बिहारिन प्यारी रसिकबिहारी प्यारे |दोउ मुख देखि जियत, अधरामृत पियत, होत नहि न्यारे ||\",\"hindi_text\":\"$8\",\"english_text\":null,\"english_translation\":\"$9\",\"description\":\"https://www.brajrasik.org/hi/articles/5baaac84d8c34c0056850709/paraspar-dou-chakor-dou-chanda-shri-bhagwat-rasik\",\"author\":\"श्री भगवत रसिक, श्री भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ  उत्तरार्ध (6)\",\"status\":\"published\",\"content_text\":\"$a\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5baaac84d8c34c0056850709/paraspar-dou-chakor-dou-chanda-shri-bhagwat-rasik\",\"slug\":\"paraspar-dou-chakor-dou-chnda\"},{\"id\":\"local-357\",\"title\":\"कोऊ नहीं अपनो सगो, बिन राधा गोपाल\",\"category\":\"Shloka\",\"sanskrit_text\":\"कोऊ नहीं अपनो सगो, बिन राधा गोपाल |नारायण तू वृथा मति, परै जगत के जाल ||\",\"hindi_text\":\"कोऊ नहीं अपनो सगो, बिन राधा गोपाल |\\nनारायण तू वृथा मति, परै जगत के जाल ||\\n- श्री नारायण स्वामी - अनुराग रस (50)\\nश्री राधा कृष्ण के सिवाय तुम्हारा अपना कोई नहीं है, यह भली भांति जान लो और संसार के जाल में अपने मन को फ़साना व्यर्थ है।\",\"english_text\":null,\"english_translation\":\"There is no other real companion like Yugal Sarkar, Shri Radha Krishna, Hence It is completely useless to trap your mind in this material world!\",\"description\":\"https://www.brajrasik.org/hi/articles/5b8014f2506f44004fb01264/kou-nahin-apno-sago-bin-radha-gopal-shri-narayan-swami-anurag-ras\",\"author\":\"श्री नारायण स्वामी  अनुराग रस (50)\",\"status\":\"published\",\"content_text\":\"कोऊ नहीं अपनो सगो, बिन राधा गोपाल |\\nनारायण तू वृथा मति, परै जगत के जाल ||\\n- श्री नारायण स्वामी - अनुराग रस (50)\\nश्री राधा कृष्ण के सिवाय तुम्हारा अपना कोई नहीं है, यह भली भांति जान लो और संसार के जाल में अपने मन को फ़साना व्यर्थ है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b8014f2506f44004fb01264/kou-nahin-apno-sago-bin-radha-gopal-shri-narayan-swami-anurag-ras\",\"slug\":\"kuo-nahin-apano-sago-bin-radha-gopala\"},{\"id\":\"local-510\",\"title\":\"वैदग्ध्य सिन्धु अनुराग\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ वैदग्ध्य सिन्धु अनुराग-रसैक सिंधु, वात्सल्य सिंधु, अतिसान्ध्र कृपैक सिंधु ||लावण्य सिन्दु अमृतछवि रूप सिंधु, श्री राधिका स्फुरतु मे हृदय केलि सिंधु || ”\",\"hindi_text\":\"“ वैदग्ध्य सिन्धु अनुराग-रसैक सिंधु, वात्सल्य सिंधु, अतिसान्ध्र कृपैक सिंधु ||\\nलावण्य सिन्दु अमृतछवि रूप सिंधु, श्री राधिका स्फुरतु मे हृदय केलि सिंधु || ”\\n- हित हरिवंश महाप्रभु - श्री राधा सुधा निधि - 17\\nकला विलास की सिंधु, अनुराग रस की एक मात्र सिंधु, अतिशय ममत्व एवं वात्सल्य की सिंधु, अत्यंत प्रगाढ़ कृपा की सिंधु , अत्यंत मोहिनी एवं लावण्य सिंधु, अमृत छवि साक्षात् महाभाव स्वरुप सिंधु, अंतरंग केलि सिंधु स्वरूपा श्री राधा मेरे हृदय में प्रकट हों।\",\"english_text\":null,\"english_translation\":\"\\\"Vaidagdhya Sindhu Anuraga-Rasaika-Sindhu\\nVatsalya-Sindhu Ati-Sandra-Kripaika-Sindhu ||\\nLavanya-Sindhu Amrta-Cchavi-Rupa-Sindhu\\nShri-Radhika Sphurati Me Hrdi Keli-Sindhuh\\\"\\n- Hita Harivansh Mahaprabhu - Shri Radha Sudha Nidhi - 17\\nMay Shri Radha, who is an ocean of intelligence, a nectar ocean of love, an ocean of kind affection, an ocean of great mercy, an ocean of beauty, an ocean of nectar splendor, and an ocean of transcendental pastimes, appear in my heart.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4f314659e8c72a534d86d8/vaidagdhya-sindhu-anuragarasaikasindhu-vatsalyasindhu-atisandrakripaikasindhu-lavanyasindhu-amrtacchavirupasindhu-shriradhika-sphurati-me-hrdi-kelisindhuh-hita-harivansh-mahaprabhu-shri-radha-sudha-nidhi-17\",\"author\":\"हित हरिवंश महाप्रभु  श्री राधा सुधा निधि  17\",\"status\":\"published\",\"content_text\":\"“ वैदग्ध्य सिन्धु अनुराग-रसैक सिंधु, वात्सल्य सिंधु, अतिसान्ध्र कृपैक सिंधु ||\\nलावण्य सिन्दु अमृतछवि रूप सिंधु, श्री राधिका स्फुरतु मे हृदय केलि सिंधु || ”\\n- हित हरिवंश महाप्रभु - श्री राधा सुधा निधि - 17\\nकला विलास की सिंधु, अनुराग रस की एक मात्र सिंधु, अतिशय ममत्व एवं वात्सल्य की सिंधु, अत्यंत प्रगाढ़ कृपा की सिंधु , अत्यंत मोहिनी एवं लावण्य सिंधु, अमृत छवि साक्षात् महाभाव स्वरुप सिंधु, अंतरंग केलि सिंधु स्वरूपा श्री राधा मेरे हृदय में प्रकट हों।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4f314659e8c72a534d86d8/vaidagdhya-sindhu-anuragarasaikasindhu-vatsalyasindhu-atisandrakripaikasindhu-lavanyasindhu-amrtacchavirupasindhu-shriradhika-sphurati-me-hrdi-kelisindhuh-hita-harivansh-mahaprabhu-shri-radha-sudha-nidhi-17\",\"slug\":\"vaidagdhy-sindhu-anuraga\"}],\"imageUrl\":null},{\"name\":\"राग होत\",\"hinglishName\":\"rag hota\",\"slug\":\"rag-hota\",\"verses\":[{\"id\":\"local-40\",\"title\":\"राधा नाम पे मैं वारी\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधा नाम पे मैं वारी, जो सुमरै अनुराग होत, दृग जुगुल रूप हितकारी ||\",\"hindi_text\":\"मैं स्वयं को 'राधा' नाम पर बलिदान देता हूं। जो भी इस नाम को प्रेम के साथ रटता है, यह नाम इतना लाभदायक है कि आंखें में दिव्य युगल के रूप का प्रादुर्भाव प्राप्त हो जाता है।\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5adf23189f7ab760360f9c36/radha-naam-pe-main-vaari-jo-sumirai-anurag-hot-drig-jugul-roop-hitkari-his-holiness-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"श्री ललित किशोरी, अभिलाष माधुरी, विनय (200)\",\"status\":\"published\",\"content_text\":\"राधा नाम पे मैं वारी, जो सुमरै अनुराग होत, दृग जुगुल रूप हितकारी ||\\n- श्री ललित किशोरी, अभिलाष माधुरी, विनय (200)\\nमैं स्वयं को 'राधा' नाम पर बलिदान देता हूं। जो भी इस नाम को प्रेम के साथ रटता है, यह नाम इतना लाभदायक है कि आंखें में दिव्य युगल के रूप का प्रादुर्भाव प्राप्त हो जाता है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5adf23189f7ab760360f9c36/radha-naam-pe-main-vaari-jo-sumirai-anurag-hot-drig-jugul-roop-hitkari-his-holiness-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"radha-nam-pe-main-vari\"}],\"imageUrl\":null},{\"name\":\"राग सारंग\",\"hinglishName\":\"rag sarnga\",\"slug\":\"rag-sarnga\",\"verses\":[{\"id\":\"local-84\",\"title\":\"हम कब होहिंगे ब्रजवासी\",\"category\":\"Shloka\",\"sanskrit_text\":\"हम कब होहिंगे ब्रजवासी।ठाकुर नंदकिशोर हमारे, ठकुराइनि राधा सी।।कब मिलि हैं वे सखी सहेली, हरिवंशी हरिदासी।वंशीवट की शीतल छहियाँ, सुभग नदी जमुना सी।।जाकी वैभव करत लालसा, कर-मीत कमलासी।इतनी आस व्यास की पुजवहु वृन्दाविपिन विलासी |\",\"hindi_text\":\"$b\",\"english_text\":null,\"english_translation\":\"(Raag Sarang)\\nHum Kab Hoinge Brajwasi,\\nThakur Yugal Kishor Humare Thakurani Radha Si,\\nKab Mili Hain Ve Sakhi Saheli Harivanshi Haridasi,\\nBanshivata Ki Sheetal Chahiyan, Subhag Nadi Yamunasi,\\nJaaki Vaibhav Karata Lalsa, Kar Meeta Kamla Si,\\nItni Aas Vyas Ki Pujvahu, Vrindavipin Vilasi.\\n-Shri Hariram Vyas (Vishakha Avtaar) - From Vyas Vani, Purvardh (104)\\nWhen will we become true Brajwasis (i.e residents of Braj), since Shri Nand Kishor is our master, and our Queen is one and only Shri Radha rani. When will we meet our dearest sakhi friends like Harivanshi (Hita Sakhi) and Haridasi (Lalita sakhi). When will we dwell in Banshivat, sit under Banshivat shade where nearby charming Yamuna is flowing. The same land which is always desired by Goddess like Maha lakshmi and she is humbly standing to get access to this divine land by holding both the hands pressed together. Shri Hariram Vyas incarnation of Shri Vishakha sakhi says, my only desire is to remain in this land called \\\"Vrindavan\\\" and serve it incessantly!\",\"description\":\"https://www.brajrasik.org/hi/articles/5b0906ff9f7ab760360f9c5f/hum-kab-hohinge-brajwasi-shri-hariram-vyas-vishakha-avtaar-from-vyas-vani\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, पूर्वार्ध (104)\",\"status\":\"published\",\"content_text\":\"$c\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b0906ff9f7ab760360f9c5f/hum-kab-hohinge-brajwasi-shri-hariram-vyas-vishakha-avtaar-from-vyas-vani\",\"slug\":\"ham-kab-hohinge-brajavasi\"},{\"id\":\"local-112\",\"title\":\"जाके मन बसै वृंदावन\",\"category\":\"Shloka\",\"sanskrit_text\":\"जाके मन बसै वृंदावन।सोई रसिक अनन्य धन्य, जाकैं हितराधामोहन॥ताही नित्य विहार फुरै वन, लीलाकौ अनुकरन।विषय वासना नाँहिन जाकैं, सुधरे अंतहकरन॥लोक वेदकौ भेद न जाकैं, श्रीभागवत सो धन।ताकैं व्यास रास रस वरषत, बहिगई कामिनि कंचन॥\",\"hindi_text\":\"(राग सारंग एवं रामकली)\\nजाके मन बसै वृंदावन।\\nसोई रसिक अनन्य धन्य, जाकैं हितराधामोहन॥\\nताही नित्य विहार फुरै वन, लीलाकौ अनुकरन।\\nविषय वासना नाँहिन जाकैं, सुधरे अंतहकरन॥\\nलोक वेदकौ भेद न जाकैं, श्रीभागवत सो धन।\\nताकैं व्यास रास रस वरषत, बहिगई कामिनि कंचन॥\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (174)\\nजिन महानुभावों का चित्त, श्री धाम वृंदावन एवं श्री राधा कृष्ण से जुड़ गया है, वे रसिक जन धन्य है। जो रसिक महापुरुष विषय वासना से रहित हैं एवं जिनका अंतः करण निर्मल हो चुका है, उन्हीं के ह्रदय में नित्य बिहार रस का प्रकाश होता है एवं नित्य बिहार लीलाओं की स्फुर्णा होती हैं। श्री हरिराम व्यास जी कह रहे हैं “जिनको लोक लाज का भय नहीं, जिनको वेदों की मर्यादा का भय नहीं एवं जिनकी भेद बुद्धि समाप्त हो गयी है, उन्हीं के हृदय में महारास के दिव्य रस की वर्षा होती है और उस रस से कीर्ति, कामिनी एवं कंचन हृदय से बह कर बाहर निकल जाते हैं।”\",\"english_text\":null,\"english_translation\":\"(Raag Sarang or Ramkali)\\nJaake Man Basai Vrindavan.\\nSoee Rasik Anany Dhany, Jaakain HitRadhaMohan.\\nTaahi Nity Vihaar Phurai Van, Leelakau Anukaran.\\nVishay Vaasna Naahin Jaakain, Sudhare Antahkaran.\\nLok Vedkau Bhed Na Jaakain, Shribhaagavat So Dhan.\\nTaakain Vyas Raas Ras Varshat, Bahigayi Kamini Kanchan.\\n- Shri Hariram Vyas (Vishakha Avatar) - Vyas Vani, Purvardh (174)\\nThe blessed soul or the jewel among the Rasiks is the one who is exclusively attached to Shri Vrindavan Dham and Shri Radha Krishn.\\nThat blessed soul receives the exclusive pleasure of Nitya Vihar Rasa and is naturally immersed in the joyous leela (love-play) of the Divine Couple.\\nHis heart is pure and all the sensual desires of this world are destroyed.\\nThe blessed soul completely gives up the decorum of society, Vedas, clan and his true wealth is to remain absorbed in the leelas of the Divine!\\nThe blessed soul drinks the nectar of Raas Ras (dance leela) and his desires of Kaamini (young girls) and Kanchan (wealth) are completely destroyed.\",\"description\":\"https://www.brajrasik.org/hi/articles/5d83ba516851f9006900c88a/jaake-man-basai-vrindavan-shri-hariram-vyas-vishakha-avatar-vyas-vani-174\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, पूर्वार्ध (174)\",\"status\":\"published\",\"content_text\":\"(राग सारंग एवं रामकली)\\nजाके मन बसै वृंदावन।\\nसोई रसिक अनन्य धन्य, जाकैं हितराधामोहन॥\\nताही नित्य विहार फुरै वन, लीलाकौ अनुकरन।\\nविषय वासना नाँहिन जाकैं, सुधरे अंतहकरन॥\\nलोक वेदकौ भेद न जाकैं, श्रीभागवत सो धन।\\nताकैं व्यास रास रस वरषत, बहिगई कामिनि कंचन॥\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (174)\\nजिन महानुभावों का चित्त, श्री धाम वृंदावन एवं श्री राधा कृष्ण से जुड़ गया है, वे रसिक जन धन्य है। जो रसिक महापुरुष विषय वासना से रहित हैं एवं जिनका अंतः करण निर्मल हो चुका है, उन्हीं के ह्रदय में नित्य बिहार रस का प्रकाश होता है एवं नित्य बिहार लीलाओं की स्फुर्णा होती हैं। श्री हरिराम व्यास जी कह रहे हैं “जिनको लोक लाज का भय नहीं, जिनको वेदों की मर्यादा का भय नहीं एवं जिनकी भेद बुद्धि समाप्त हो गयी है, उन्हीं के हृदय में महारास के दिव्य रस की वर्षा होती है और उस रस से कीर्ति, कामिनी एवं कंचन हृदय से बह कर बाहर निकल जाते हैं।”\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d83ba516851f9006900c88a/jaake-man-basai-vrindavan-shri-hariram-vyas-vishakha-avatar-vyas-vani-174\",\"slug\":\"jake-man-basai-vrindavana\"},{\"id\":\"local-287\",\"title\":\"अति नागरि वृषभानु किसोरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"अति नागरि वृषभानु किसोरी।सुनि दूतिका चपल मृगनैंनी, आकरषत चितवत चित गोरी।।श्रीफ़ल उरज कंचन सी देही, कटि केहरि गुन सिंधु झकोरी।बैंनी भुजंग चंद्र सत वदनी, कदलि जंघ जलचर गति चोरी।।सुनि ‘हरिवंश’ आजु रजनी मुख , बन मिलाइ मेरी निज जोरी।यद्पि मान समेत भामिनी , सुनि कत रहत भली जिय भोरी।।\",\"hindi_text\":\"$d\",\"english_text\":null,\"english_translation\":\"$e\",\"description\":\"https://www.brajrasik.org/hi/articles/5be47da57b46b400571a5569/ati-nagari-vrishbhanu-kishori-shri-hita-harivansh-mahaprabhu-shri-hita-chaurasi-43-\",\"author\":\"श्री हरिवंश महाप्रभु  हित चतुरासी (43)\",\"status\":\"published\",\"content_text\":\"$f\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5be47da57b46b400571a5569/ati-nagari-vrishbhanu-kishori-shri-hita-harivansh-mahaprabhu-shri-hita-chaurasi-43-\",\"slug\":\"ati-nagari-vrishabhanu-kisori\"},{\"id\":\"local-616\",\"title\":\"जीवत मरत वृन्दावन शरनैं\",\"category\":\"Shloka\",\"sanskrit_text\":\"जीवत मरत वृन्दावन शरनैं ॥सुनहुँ सुचित ह्वै (श्री) राधामोहन, यह विनती मन धरनै।यही परम पुरुषार्थ मेरौ, और कछु नहीं करनैं॥स्याम भरोसे, तेरे व्रत के, नहीं व्यास कौ टरनैं ॥\",\"hindi_text\":\"(राग सारंग)\\nजीवत मरत वृन्दावन शरनैं ॥\\nसुनहुँ सुचित ह्वै (श्री) राधामोहन, यह विनती मन धरनै।\\nयही परम पुरुषार्थ मेरौ, और कछु नहीं करनैं॥\\nस्याम भरोसे, तेरे व्रत के, नहीं व्यास कौ टरनैं ॥\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (289)\\nहे मेरे प्रियतम श्यामा श्याम ध्यानपूर्वक आप मेरे हृदय की विनती सुनिए: \\\"मुझपर ऐसी कृपा कीजिये कि जीवन मरण मैं केवल श्री वृन्दावन धाम की शरण में ही रहूँ \\\"। मेरा केवल एक ही परम पुरुषार्थ है कि मैं जीवन से मरण अवस्था अर्थात हर क्षण केवल श्री वृन्दावन धाम की शरण में ही रहूं | हे श्याम सुन्दर, व्यास दास की यह दृढ़ प्रतिज्ञा आपके ही भरोसे है कृपया आप इसे टाले नहीं।\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5c1fdc207f2c6a00524cdff1/jeevat-marat-vrindavan-sharnein-shri-hariram-vyas-vishakha-avtar-vyas-vani-289\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, पूर्वार्ध (289)\",\"status\":\"published\",\"content_text\":\"(राग सारंग)\\nजीवत मरत वृन्दावन शरनैं ॥\\nसुनहुँ सुचित ह्वै (श्री) राधामोहन, यह विनती मन धरनै।\\nयही परम पुरुषार्थ मेरौ, और कछु नहीं करनैं॥\\nस्याम भरोसे, तेरे व्रत के, नहीं व्यास कौ टरनैं ॥\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (289)\\nहे मेरे प्रियतम श्यामा श्याम ध्यानपूर्वक आप मेरे हृदय की विनती सुनिए: \\\"मुझपर ऐसी कृपा कीजिये कि जीवन मरण मैं केवल श्री वृन्दावन धाम की शरण में ही रहूँ \\\"। मेरा केवल एक ही परम पुरुषार्थ है कि मैं जीवन से मरण अवस्था अर्थात हर क्षण केवल श्री वृन्दावन धाम की शरण में ही रहूं | हे श्याम सुन्दर, व्यास दास की यह दृढ़ प्रतिज्ञा आपके ही भरोसे है कृपया आप इसे टाले नहीं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5c1fdc207f2c6a00524cdff1/jeevat-marat-vrindavan-sharnein-shri-hariram-vyas-vishakha-avtar-vyas-vani-289\",\"slug\":\"jivat-marat-vrindavan-sharanain\"}],\"imageUrl\":null},{\"name\":\"राग बढ़त\",\"hinglishName\":\"rag badhata\",\"slug\":\"rag-badhata\",\"verses\":[{\"id\":\"local-87\",\"title\":\"प्यारी मोहि दीजै श्री वृन्दावन वास\",\"category\":\"Shloka\",\"sanskrit_text\":\"प्यारी मोहि दीजै श्री वृन्दावन वास।छिन प्रति नव अनुराग बढ़त जहाँ भक्त प्रेम रस रास॥\",\"hindi_text\":\"प्यारी जू मुझे अब आप श्री वृंदावन का वास दीजिए जहाँ भक्त हृदय में प्रेम रस एवं रास का नित्य ही नव नवायमान अनुराग बढ़ता है ।\",\"english_text\":null,\"english_translation\":\"Oh my beloved Swamini, Shri Radhey Ju! Bless me with the residence of Shri Vrindavan, where the heart of the devotee gets filled with the bliss of divine love which is ever increasing incessantly.\",\"description\":\"https://www.brajrasik.org/hi/articles/5baa9449d8c34c0056850708/pyari-mohi-dije-shri-vrindavan-vaas-shri-lalit-kishori-abhilash-madhuri\",\"author\":\"श्री ललित किशोरी, अभिलाष माधुरी, विनय (१४०)\",\"status\":\"published\",\"content_text\":\"प्यारी मोहि दीजै श्री वृन्दावन वास।\\nछिन प्रति नव अनुराग बढ़त जहाँ भक्त प्रेम रस रास॥\\n- श्री ललित किशोरी, अभिलाष माधुरी, विनय (१४०)\\nप्यारी जू मुझे अब आप श्री वृंदावन का वास दीजिए जहाँ भक्त हृदय में प्रेम रस एवं रास का नित्य ही नव नवायमान अनुराग बढ़ता है ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5baa9449d8c34c0056850708/pyari-mohi-dije-shri-vrindavan-vaas-shri-lalit-kishori-abhilash-madhuri\",\"slug\":\"pyari-mohi-dijai-shri-vrindavan-vasa\"}],\"imageUrl\":null},{\"name\":\"राग काफी\",\"hinglishName\":\"rag kafi\",\"slug\":\"rag-kafi\",\"verses\":[{\"id\":\"local-96\",\"title\":\"बलि जैहौं श्रीरसिकचारज\",\"category\":\"Shloka\",\"sanskrit_text\":\"बलि जैहौं श्रीरसिकचारज।नित्य बिहार उद्धार कियौ जिन, मथि निज हृदय सिन्धु बारज॥भ्रम, तम, स्रम सब हरे हमारे, कर गहि सकल संभारे कारज।भगवत रसिक प्रसंसित कीने, स्यामा स्याम सहायक आरज॥\",\"hindi_text\":\"(राग काफी)\\nबलि जैहौं श्रीरसिकचारज।\\nनित्य बिहार उद्धार कियौ जिन, मथि निज हृदय सिन्धु बारज॥\\nभ्रम, तम, स्रम सब हरे हमारे, कर गहि सकल संभारे कारज।\\nभगवत रसिक प्रसंसित कीने, स्यामा स्याम सहायक आरज॥\\n- श्री भगवत रसिक जी, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ - पूर्वार्द्ध (32)\\nभावार्थ - भगवतरसिकजी कहते हैं - रसिकाचार्य स्वामी श्री हरिदासजी! मैं आपकी बलिहारी जाता हूँ जिन्होंने अपने हृदय सिन्धु का मन्थन करके यह नित्य विहार रूपी अद्भुत रत्न प्रकट किया है। आपने हाथ पकड़कर मेरी सारी भ्रान्तियों, अविद्याओं और भटकनों को दूर करके मेरे सब काम स्वयं बना दिये हैं। आप श्रीश्यामाश्याम की नित्य केलि में योगदान करने वाली सहचरियों में शिरोमणि स्वरूप हैं, इसीलिए सब रसिकों ने आपकी प्रशंसा की है।\",\"english_text\":null,\"english_translation\":\"(Raag Kaafi)\\nBali Jaihaun ShriRasikachaaraj.\\nNity Bihaar Uddhaar Kiyau Jin, Mathi Nij Hriday Sindhu Baaraj.\\nBhram, Tam, Sram Sab Hare Hamaare, Kar Gahi Sakal Sambhaare Kaaraj.\\nBhagwat Rasik Prasansit Keene, Syama Syam Sahaayak Aaraj.\\n- Shri Bhagwat Rasik Ji, Bhagwat Rasik Ki Vani, AnanyaNishchayatma Granth - Purvardh (32)\\nShri Bhagwat Rasik says - O, Rasik Acharya Swami Shri Haridasji! I sacrifice myself upon you again and again. After churning your heart, you have revealed this most amazing jewel in the form of the nectar called \\\"Nitya Vihar\\\". Oh my master, You hold my hand and removed all my illusions, ignorance and wandering and have forcibly rectified my future. You are crest jewel among all the Rasiks and among the companions of Shri Radha Krishn, who are contributing day and night in the Keli leelas. That's why all the Rasik devotees have sung your glories.\",\"description\":\"https://www.brajrasik.org/hi/articles/5d8cc48589c4660060055df9/bali-jaihaun-shrirasikachaaraj-shri-bhagwat-rasik-ji-bhagwat-rasik-ki-vani-32\",\"author\":\"श्री भगवत रसिक जी, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ  पूर्वार्द्ध (32)\",\"status\":\"published\",\"content_text\":\"(राग काफी)\\nबलि जैहौं श्रीरसिकचारज।\\nनित्य बिहार उद्धार कियौ जिन, मथि निज हृदय सिन्धु बारज॥\\nभ्रम, तम, स्रम सब हरे हमारे, कर गहि सकल संभारे कारज।\\nभगवत रसिक प्रसंसित कीने, स्यामा स्याम सहायक आरज॥\\n- श्री भगवत रसिक जी, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ - पूर्वार्द्ध (32)\\nभावार्थ - भगवतरसिकजी कहते हैं - रसिकाचार्य स्वामी श्री हरिदासजी! मैं आपकी बलिहारी जाता हूँ जिन्होंने अपने हृदय सिन्धु का मन्थन करके यह नित्य विहार रूपी अद्भुत रत्न प्रकट किया है। आपने हाथ पकड़कर मेरी सारी भ्रान्तियों, अविद्याओं और भटकनों को दूर करके मेरे सब काम स्वयं बना दिये हैं। आप श्रीश्यामाश्याम की नित्य केलि में योगदान करने वाली सहचरियों में शिरोमणि स्वरूप हैं, इसीलिए सब रसिकों ने आपकी प्रशंसा की है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d8cc48589c4660060055df9/bali-jaihaun-shrirasikachaaraj-shri-bhagwat-rasik-ji-bhagwat-rasik-ki-vani-32\",\"slug\":\"bali-jaihaun-shrirasikacharaja\"}],\"imageUrl\":null},{\"name\":\"राग केदारो\",\"hinglishName\":\"rag kedaro\",\"slug\":\"rag-kedaro\",\"verses\":[{\"id\":\"local-121\",\"title\":\"जयति नव नागरी , कृष्ण\",\"category\":\"Shloka\",\"sanskrit_text\":\"जयति नव नागरी , कृष्ण-सुख-सागरी ,सकल गुन-आगरी , दीनन भोरी !जयति हरि-भामिनि , कृष्ण-घन-दामिनी ,मत्त गज-गामिनी , नव किशोरी !!जयति पिय-केलि हित, कनक नव बेलिसमकृष्ण कलकलप निसि मिलि बिलासिनी !जयति वृषभान-कुल-कुमुद-बन-कुमुदिनी ,कृष्ण-सुख हिमकर निरख प्रकासिनी !!जयति गोपाल मन-मधुप नव मालती ,जयति गोविंद-मुख-कमल-भृंगी !जयति नँदनंदन-उर, परम आनंद-निधि ,लाल गिरिधरन पिय-प्रेम-रंगी !!जयति सौभाग्य-मनि , कृष्ण-अनुराग-मनि,सकल पिय मुकुट-मनि , सुजस लीजै !दीजियै दान यह \\\"व्यास' निज दास कों ,कृष्ण सों बहुरि नहिं मान कीजै !!\",\"hindi_text\":\"(राग केदारो व कामोद)\\nजयति नव नागरी , कृष्ण-सुख-सागरी ,\\nसकल गुन-आगरी , दीनन भोरी !\\nजयति हरि-भामिनि , कृष्ण-घन-दामिनी ,\\nमत्त गज-गामिनी , नव किशोरी !!\\nजयति पिय-केलि हित, कनक नव बेलिसम\\nकृष्ण कलकलप निसि मिलि बिलासिनी !\\nजयति वृषभान-कुल-कुमुद-बन-कुमुदिनी ,\\nकृष्ण-सुख हिमकर निरख प्रकासिनी !!\\nजयति गोपाल मन-मधुप नव मालती ,\\nजयति गोविंद-मुख-कमल-भृंगी !\\nजयति नँदनंदन-उर, परम आनंद-निधि ,\\nलाल गिरिधरन पिय-प्रेम-रंगी !!\\nजयति सौभाग्य-मनि , कृष्ण-अनुराग-मनि,\\nसकल पिय मुकुट-मनि , सुजस लीजै !\\nदीजियै दान यह \\\"व्यास' निज दास कों ,\\nकृष्ण सों बहुरि नहिं मान कीजै !!\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (47)\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5b44cf159f7ab760360f9cd5/jayati-nava-nagari-krishn-sukh-sagari-by-shri-hariram-vyas-from-vyas-vani\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, पूर्वार्ध (47)\",\"status\":\"published\",\"content_text\":\"(राग केदारो व कामोद)\\nजयति नव नागरी , कृष्ण-सुख-सागरी ,\\nसकल गुन-आगरी , दीनन भोरी !\\nजयति हरि-भामिनि , कृष्ण-घन-दामिनी ,\\nमत्त गज-गामिनी , नव किशोरी !!\\nजयति पिय-केलि हित, कनक नव बेलिसम\\nकृष्ण कलकलप निसि मिलि बिलासिनी !\\nजयति वृषभान-कुल-कुमुद-बन-कुमुदिनी ,\\nकृष्ण-सुख हिमकर निरख प्रकासिनी !!\\nजयति गोपाल मन-मधुप नव मालती ,\\nजयति गोविंद-मुख-कमल-भृंगी !\\nजयति नँदनंदन-उर, परम आनंद-निधि ,\\nलाल गिरिधरन पिय-प्रेम-रंगी !!\\nजयति सौभाग्य-मनि , कृष्ण-अनुराग-मनि,\\nसकल पिय मुकुट-मनि , सुजस लीजै !\\nदीजियै दान यह \\\"व्यास' निज दास कों ,\\nकृष्ण सों बहुरि नहिं मान कीजै !!\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, पूर्वार्ध (47)\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b44cf159f7ab760360f9cd5/jayati-nava-nagari-krishn-sukh-sagari-by-shri-hariram-vyas-from-vyas-vani\",\"slug\":\"jayati-nav-nagari-krishna\"}],\"imageUrl\":null},{\"name\":\"राग परमाद्भुत\",\"hinglishName\":\"rag paramadbhuta\",\"slug\":\"rag-paramadbhuta\",\"verses\":[{\"id\":\"local-126\",\"title\":\"ब्रह्मेश्वरादि सुदुरूह पदारविन्द, श्रीमत्पराग परमाद्भुत वैभवाया\",\"category\":\"Shloka\",\"sanskrit_text\":\"ब्रह्मेश्वरादि सुदुरूह पदारविन्द, श्रीमत्पराग परमाद्भुत वैभवायाः |सर्वार्थ साररस वर्षि कृपार्द्रदृष्टे, तस्या नमोऽस्तु वृषभानुभुवो महिम्ने | |\",\"hindi_text\":\"ब्रह्मेश्वरादि सुदुरूह पदारविन्द, श्रीमत्पराग परमाद्भुत वैभवायाः |\\nसर्वार्थ साररस वर्षि कृपार्द्रदृष्टे, तस्या नमोऽस्तु वृषभानुभुवो महिम्ने | |\\n- श्री हित हरिवंश महाप्रभु - श्री राधा सुधा निधि (2)\\nजिनके चरण कमल ब्रह्मा, शंकर आदि के लिए भी अत्यंत दुरूह हैं, जिन चरण कमलों का शोभामय पराग परम अद्बुध वैभवशाली है, एवं जिनकी कृपा दृष्टि मात्र से प्रेम रस का वर्षण होता है, ऐसी वृषभानु नंदनी श्री राधा को नमन है।\",\"english_text\":null,\"english_translation\":\"Obeisances to the glory of Sri Vrsabhanu's daughter Shri Radha. The glories of her lotus feet knows no bounds. Such is the magnitude of those lotus feet that It is very difficult for even Lord Brahma, Siva and all the demigods to attain the pollen of her lotus feet. Her merciful glance showers the best of all nectars!\",\"description\":\"https://www.brajrasik.org/hi/articles/5a73e6bc82274812fecf9672/brahmeshwaradi-suduruh-padarvind-shrimat-parag-param-shri-hit-harivansh-mahaprabhu-shri-radha-sudha-nidhi-2\",\"author\":\"श्री हित हरिवंश महाप्रभु  श्री राधा सुधा निधि (2)\",\"status\":\"published\",\"content_text\":\"ब्रह्मेश्वरादि सुदुरूह पदारविन्द, श्रीमत्पराग परमाद्भुत वैभवायाः |\\nसर्वार्थ साररस वर्षि कृपार्द्रदृष्टे, तस्या नमोऽस्तु वृषभानुभुवो महिम्ने | |\\n- श्री हित हरिवंश महाप्रभु - श्री राधा सुधा निधि (2)\\nजिनके चरण कमल ब्रह्मा, शंकर आदि के लिए भी अत्यंत दुरूह हैं, जिन चरण कमलों का शोभामय पराग परम अद्बुध वैभवशाली है, एवं जिनकी कृपा दृष्टि मात्र से प्रेम रस का वर्षण होता है, ऐसी वृषभानु नंदनी श्री राधा को नमन है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a73e6bc82274812fecf9672/brahmeshwaradi-suduruh-padarvind-shrimat-parag-param-shri-hit-harivansh-mahaprabhu-shri-radha-sudha-nidhi-2\",\"slug\":\"brahmeshvaradi-suduruh-padaravind-shrimatparag-paramadbhut-vaibhavaya\"}],\"imageUrl\":null},{\"name\":\"राग बढ़त\",\"hinglishName\":\"rag baढ़ta\",\"slug\":\"rag-bata\",\"verses\":[{\"id\":\"local-140\",\"title\":\"बसीवो श्री वृन्दावन को नीकौ\",\"category\":\"Shloka\",\"sanskrit_text\":\"बसीवो श्री वृन्दावन को नीकौ,छिन्न छिन्न प्रति अनुराग बढ़त दिन, दरस बिहारीजी कौ ॥ [1]नैंन श्रवण रसना रस अँचवत, अंग संग प्यारी पी कौ |श्री बिहारी बिहारिनि दासी, अंग संग बिछुरत नाहीं कौ ॥ [2]\",\"hindi_text\":\"(राग कलिंगडा)\\nबसीवो श्री वृन्दावन को नीकौ,\\nछिन्न छिन्न प्रति अनुराग बढ़त दिन, दरस बिहारीजी कौ ॥ [1]\\nनैंन श्रवण रसना रस अँचवत, अंग संग प्यारी पी कौ |\\nश्री बिहारी बिहारिनि दासी, अंग संग बिछुरत नाहीं कौ ॥ [2]\\n- श्री बिहारिन देव - श्री बिहारिन देव जी की वाणी, सिद्धान्त के पद (185)\\nश्री वृन्दावन में निवास करना अत्यंत सुंदर है। प्रत्येक क्षण श्री बिहारीजी के दर्शन से प्रेम निरंतर बढ़ता रहता है। [1]\\nनेत्र, कान और जिह्वा श्री राधा-कृष्ण के रूप, वाणी और स्वाद का रस लेते रहते हैं। श्री बिहारिन देव कहते हैं कि वृन्दावन की कृपा से वह जीव बिहारी बिहारिन की दासता को प्राप्त कर उनसे एक क्षण भी विलग नहीं रहता। [2]\",\"english_text\":null,\"english_translation\":\"Dwelling in Shri Vrindavan is most delightful. Day by day, love grows stronger with each glimpse of Sri Bihariji. [1]\\nThe eyes, ears, and tongue constantly relish the rasa of Shri Radha-Krishna’s form, speech, and taste. Shri Biharini Dev says that by the grace of Vrindavan, such a soul attains the servitude of Bihariji and Biharini Ji and never becomes separated from them, not even for a moment. [2]\",\"description\":\"https://www.brajrasik.org/hi/articles/5b09b8569f7ab760360f9c60/basibo-shri-vrindavan-ko-neeko-shri-biharin-dev-ji-from-shri-biharin-dev-ji-ki-vani\",\"author\":\"श्री बिहारिन देव  श्री बिहारिन देव जी की वाणी, सिद्धान्त के पद (185)\",\"status\":\"published\",\"content_text\":\"(राग कलिंगडा)\\nबसीवो श्री वृन्दावन को नीकौ,\\nछिन्न छिन्न प्रति अनुराग बढ़त दिन, दरस बिहारीजी कौ ॥ [1]\\nनैंन श्रवण रसना रस अँचवत, अंग संग प्यारी पी कौ |\\nश्री बिहारी बिहारिनि दासी, अंग संग बिछुरत नाहीं कौ ॥ [2]\\n- श्री बिहारिन देव - श्री बिहारिन देव जी की वाणी, सिद्धान्त के पद (185)\\nश्री वृन्दावन में निवास करना अत्यंत सुंदर है। प्रत्येक क्षण श्री बिहारीजी के दर्शन से प्रेम निरंतर बढ़ता रहता है। [1]\\nनेत्र, कान और जिह्वा श्री राधा-कृष्ण के रूप, वाणी और स्वाद का रस लेते रहते हैं। श्री बिहारिन देव कहते हैं कि वृन्दावन की कृपा से वह जीव बिहारी बिहारिन की दासता को प्राप्त कर उनसे एक क्षण भी विलग नहीं रहता। [2]\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b09b8569f7ab760360f9c60/basibo-shri-vrindavan-ko-neeko-shri-biharin-dev-ji-from-shri-biharin-dev-ji-ki-vani\",\"slug\":\"basivo-shri-vrindavan-ko-nikau\"}],\"imageUrl\":null},{\"name\":\"राग नित\",\"hinglishName\":\"rag nita\",\"slug\":\"rag-nita\",\"verses\":[{\"id\":\"local-141\",\"title\":\"प्रेम रस रूप अगाधा राधा\",\"category\":\"Shloka\",\"sanskrit_text\":\"प्रेम रस रूप अगाधा राधा ।सोइ बिनु बाधा पाय रास – रस, जोइ राधा आराधा ॥ [1]नित्य विहार करति बनि सहचरि, रस न विरह पल आधा ।रासहिं रिझवत सानुराग नित, ताल राग स्वर साधा ॥ [2]निरतत दिव्य हाव – भावन सों, कहि धा तिर – किट – धा – धा – धा ।लहि ‘कृपालु’ इमि युगल – रास – रस, होति धन्य बिनु बाधा ॥ [3]\",\"hindi_text\":\"श्री किशोरी जी प्रेम – रस एवं रूप की अनंत राशि हैं । उनकी जो उपासना करता है वह सहज ही दिव्य रास – रस प्राप्त करता है ।  [1]\\nइतना ही नहीं, वह किशोरी जी की सहचरी बनकर उनके साथ नित्य विहार करता है । उसे आधे पल के लिये भी रस का वियोग नहीं हो सकता । वह सदा स्वरों को साध कर अनुराग – युक्त विविध रागों के द्वारा किशोरी जी के गुणों को गाकर उन्हें प्रसन्न करता है । [2]\\nएवं ‘धा – तिर – किट – धा – धा’ आदि नृत्य के शब्दों का उच्चारण करता हुआ विविध हाव – भाव द्वारा अलौकिक नृत्य करता है । ‘श्री कृपालु जी’ कहते हैं कि वह इस प्रकार सहज ही श्यामा – श्याम के दिव्य प्रेमानन्द का निरन्तर अनुभव करता हुआ कृतार्थ रहता है । [3]\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5976483e1350677a49620728/prem-ras-roop-agadha-radha-pad-written-by-jagadguru-shri-kripalu-ji-maharaj\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा, श्रीराधा माधुरी (26)\",\"status\":\"published\",\"content_text\":\"प्रेम रस रूप अगाधा राधा ।\\nसोइ बिनु बाधा पाय रास – रस, जोइ राधा आराधा ॥ [1]\\nनित्य विहार करति बनि सहचरि, रस न विरह पल आधा ।\\nरासहिं रिझवत सानुराग नित, ताल राग स्वर साधा ॥ [2]\\nनिरतत दिव्य हाव – भावन सों, कहि धा तिर – किट – धा – धा – धा ।\\nलहि ‘कृपालु’ इमि युगल – रास – रस, होति धन्य बिनु बाधा ॥ [3]\\n- जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा, श्रीराधा माधुरी (26)\\nश्री किशोरी जी प्रेम – रस एवं रूप की अनंत राशि हैं । उनकी जो उपासना करता है वह सहज ही दिव्य रास – रस प्राप्त करता है ।  [1]\\nइतना ही नहीं, वह किशोरी जी की सहचरी बनकर उनके साथ नित्य विहार करता है । उसे आधे पल के लिये भी रस का वियोग नहीं हो सकता । वह सदा स्वरों को साध कर अनुराग – युक्त विविध रागों के द्वारा किशोरी जी के गुणों को गाकर उन्हें प्रसन्न करता है । [2]\\nएवं ‘धा – तिर – किट – धा – धा’ आदि नृत्य के शब्दों का उच्चारण करता हुआ विविध हाव – भाव द्वारा अलौकिक नृत्य करता है । ‘श्री कृपालु जी’ कहते हैं कि वह इस प्रकार सहज ही श्यामा – श्याम के दिव्य प्रेमानन्द का निरन्तर अनुभव करता हुआ कृतार्थ रहता है । [3]\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5976483e1350677a49620728/prem-ras-roop-agadha-radha-pad-written-by-jagadguru-shri-kripalu-ji-maharaj\",\"slug\":\"prem-ras-rup-agadha-radha\"}],\"imageUrl\":null},{\"name\":\"राग गौरी\",\"hinglishName\":\"rag gauri\",\"slug\":\"rag-gauri\",\"verses\":[{\"id\":\"local-153\",\"title\":\"रसभरे राजत रसिकबहारी\",\"category\":\"Shloka\",\"sanskrit_text\":\"रसभरे राजत रसिकबहारी |गौर स्याम अभिराम रूप दोऊ नव नेह विहारी  |यह सुख निरखि सखी नित प्रमुदित, प्रान करै बलिहारी |भगवतरसिक पियत या रस को और लगै सब खारी ||\",\"hindi_text\":\"(राग गौरी)\\nरसभरे राजत रसिकबहारी |\\nगौर स्याम अभिराम रूप दोऊ नव नेह विहारी  |\\nयह सुख निरखि सखी नित प्रमुदित, प्रान करै बलिहारी |\\nभगवतरसिक पियत या रस को और लगै सब खारी ||\\n- श्री भगवत रसिक - भगवत रसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (6.6)\\nयहाँ श्यामा श्याम ही रसिकबिहारी है। वे रस भरे हैं। वे नव नव नेह भरे खेल खेलते हैं। उनके सुख से सखियाँ प्रमोदित हैं। भगवतरसिक जी इस रस का पान कर तृप्त हो रहे हैं और  इसके सामने ओर सभी रस उन्हें खारे लगते हैं।\",\"english_text\":null,\"english_translation\":\"In the words of Shri Bhagwat Rasik, Yugal Sarkar Shri Shyama Shyam, The ever-young blissful Divine Couple i.e fair complexioned Shri Radha \u0026 blue complexioned Shri Krishna are Rasik Bihari and are full of unprecedented love, unprecedented joy and unprecedented blissful nectar blossom among each other. O Sakhi friend, Look at the nectarine bliss of \\\"Nitya Vihar\\\" (Pastimes of Yugal Sarkar without being separated even for half a moment) which are always relished by Sakhis and offer your life on this bliss. Shri Bhagwat Rasik says, by drinking an amzing bliss of \\\"Nitya Vihar\\\", all other kinds of pleasures look worthless.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b54059f5dbf5475ed9a43da/ras-bhare-rajat-rasik-bihari-gaur-shyam-abhiram-roop-dou-nav-neh-bihari-yeh-sukh-nirakhi-sakhi-nit-pramudit-praan-kare-balihari-bhagwat-rasik-piyat-ya-ras-ko-aur-lage-sab-khari-shri-bhagwat-rasik-bhagwat-rasik-ki-vani\",\"author\":\"श्री भगवत रसिक  भगवत रसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (6.6)\",\"status\":\"published\",\"content_text\":\"(राग गौरी)\\nरसभरे राजत रसिकबहारी |\\nगौर स्याम अभिराम रूप दोऊ नव नेह विहारी  |\\nयह सुख निरखि सखी नित प्रमुदित, प्रान करै बलिहारी |\\nभगवतरसिक पियत या रस को और लगै सब खारी ||\\n- श्री भगवत रसिक - भगवत रसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (6.6)\\nयहाँ श्यामा श्याम ही रसिकबिहारी है। वे रस भरे हैं। वे नव नव नेह भरे खेल खेलते हैं। उनके सुख से सखियाँ प्रमोदित हैं। भगवतरसिक जी इस रस का पान कर तृप्त हो रहे हैं और  इसके सामने ओर सभी रस उन्हें खारे लगते हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b54059f5dbf5475ed9a43da/ras-bhare-rajat-rasik-bihari-gaur-shyam-abhiram-roop-dou-nav-neh-bihari-yeh-sukh-nirakhi-sakhi-nit-pramudit-praan-kare-balihari-bhagwat-rasik-piyat-ya-ras-ko-aur-lage-sab-khari-shri-bhagwat-rasik-bhagwat-rasik-ki-vani\",\"slug\":\"rasabhare-rajat-rasikabahari\"}],\"imageUrl\":null},{\"name\":\"राग रंग\",\"hinglishName\":\"rag rnga\",\"slug\":\"rag-rnga\",\"verses\":[{\"id\":\"local-168\",\"title\":\"बने दोउ रसिक बिहारी बिहारनी\",\"category\":\"Shloka\",\"sanskrit_text\":\"सिंहासन श्रीहरिप्रिया, सोहत सुढर ढरे।रसिक बिहारी बिहारनी, दोउ गुन रूप भरे ॥\",\"hindi_text\":\"(दोहा)\\nश्रीहरि एवं प्रिया, मानों सुन्दरता रूपी साँचे में अच्छी प्रकार से ढले हुए सिंहासन पर सुशोभित हैं । ये दोनों रसिक बिहारी बिहारनी रूप तथा समस्त गुणों से भरपूर हैं।\\n(पद)\\nये दोनों रसिक बिहारी बिहारनि रूप तथा समस्त गुणों से भरपूर हैं। इनके अंग प्रत्यंग अनुराग रंग से रंजित हैं और ये रत्न जड़ित आभूषण पहने हुए हैं। सुन्दर रंग-बिरंगे वस्त्रों को धारण किये हुए इनकी छबि सब के मनों को हरण करने वाली है। मानों यह किसी अनिर्वचनीय सुन्दरता रूपी साँचे में ढले हुए हों। श्रीहरि एवं प्रिया इस समय सिंहासन पर बैठे हुए परस्पर ढरारे नेत्र कमलों से देख रहे हैं।\",\"english_text\":null,\"english_translation\":\"(Doha)\\nThe ocean of Beauty, the divine couple Shri Radha Krishn are sitting on a throne. Both the Rasiks, Bihari, and Biharini are bright with fine qualities.\\n(Pada)\\nBoth the Rasiks, Shri Bihari (Krishn) and Shri Biharni (Shri Radha) whose forms are filled with the sweetest bliss, are adept in fine qualities. Their limbs are submerged in the color of divine love and are naturally adorned with many Gem-studded jewels. The glimpses of their beautiful form wearing colorful clothes forcibly enchant the mind of all, as if their form were cast in a mold of inexplicable beauty. At this moment, Shri Hari and Priya (The Divine couple) are sitting on a throne and looking at each other with unblinking eyes.\",\"description\":\"https://www.brajrasik.org/hi/articles/5d81239daa02b8006926fef2/bane-dou-rasik-bihari-biharni-shri-harivyas-devacharya-mahavani-sewa-sukh-58\",\"author\":\"श्री हरिव्यास देवाचार्य, महावाणी, सेवा सुख (58)\",\"status\":\"published\",\"content_text\":\"(दोहा)\\nसिंहासन श्रीहरिप्रिया, सोहत सुढर ढरे।\\nरसिक बिहारी बिहारनी, दोउ गुन रूप भरे ॥\\n(पद)\\nबने दोउ रसिक बिहारी बिहारनी रूप भरे गुन भरे ।\\nअंग अंग सोहें रंग भीने अभरन रतन जरे ॥\\nपहरें बसन सुबरनी छबि मनहरनी ढरनि ढरे।\\nश्रीहरिप्रिया बैठे सिंहासन निरखति नैन ठरे ॥\\n- श्री हरिव्यास देवाचार्य, महावाणी, सेवा सुख (58)\\n(दोहा)\\nश्रीहरि एवं प्रिया, मानों सुन्दरता रूपी साँचे में अच्छी प्रकार से ढले हुए सिंहासन पर सुशोभित हैं । ये दोनों रसिक बिहारी बिहारनी रूप तथा समस्त गुणों से भरपूर हैं।\\n(पद)\\nये दोनों रसिक बिहारी बिहारनि रूप तथा समस्त गुणों से भरपूर हैं। इनके अंग प्रत्यंग अनुराग रंग से रंजित हैं और ये रत्न जड़ित आभूषण पहने हुए हैं। सुन्दर रंग-बिरंगे वस्त्रों को धारण किये हुए इनकी छबि सब के मनों को हरण करने वाली है। मानों यह किसी अनिर्वचनीय सुन्दरता रूपी साँचे में ढले हुए हों। श्रीहरि एवं प्रिया इस समय सिंहासन पर बैठे हुए परस्पर ढरारे नेत्र कमलों से देख रहे हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d81239daa02b8006926fef2/bane-dou-rasik-bihari-biharni-shri-harivyas-devacharya-mahavani-sewa-sukh-58\",\"slug\":\"bane-dou-rasik-bihari-biharani\"}],\"imageUrl\":null},{\"name\":\"राग छेड़\",\"hinglishName\":\"rag chheda\",\"slug\":\"rag-chheda\",\"verses\":[{\"id\":\"local-221\",\"title\":\"नयौ नेह नव रंग नयौ रस\",\"category\":\"Shloka\",\"sanskrit_text\":\"नयौ नेह नव रंग नयौ रस, नवल स्याम वृषभानु किसोरी।नव पीतांबर नवल चूनरी, नई नई बूंदनि भींजति गोरी।।नव वृन्दावन हरित मनोहर, नव चातक बोलत मोर मोरी।नव मुरली जु मलार नई गतिः, श्रवन सुनत आये घन घोरी।।नव भूषन नव मुकुट विराजत, नई नई उरप लेत थोरी थोरी।(जै श्री) हित हरिवंश असीस देत मुख, चिरजीवी भूतल यह जोरी।।\",\"hindi_text\":\"आज नवल श्याम और नवल वृषभानु किशोरी में (परस्पर) नवीन स्नेह, नवीन आनन्द एवं नया ही रस भर रहा है। यहाँ श्याम सुन्दर का नया पीत पट है तो वहाँ वृषभानु किशोरी की नयी चूनरी । (उस नवल चूनरी को पहिने हुए) गोरी नयी ही नयी बूंदों से भींग रही हैं। जैसा नया, हरा-भरा और मनोहर वृन्दावन है, वैसे ही उसमें नये ही नये चातक, मोर और मयूरियां बोल रही हैं इधर नवल श्याम सुन्दर ने अपनी नयी मुरली में नयी ही गति से नवीन प्रकार का मलार राग छेड़ दिया है, जिसे सुनकर नये नये मेघ भी घिर कर घुमड़ आये हैं। श्रीश्याम सुन्दर के श्री अंगों में नये ही तो आभूषण हैं और सिर पर नया मुकुट विराज रहा है। वे नृत्य में उरप और तिरप नामक गतिया मन्द मंद ले रहे हैं। (इस नवीन सुख एवं समाज को देख कर) श्रीहित हरिवंश चन्द्र महाप्रभु पाद (प्रीति पूर्वक) अपने मुख से आशीष देते हैं कि यह जोड़ी भूतल (इस लोक में मथुरा मण्डलान्तर्गत प्रकट श्रीवृन्दावन धाम) में क्रीड़ा करती हुई चिरजीवी रहे।)\",\"english_text\":null,\"english_translation\":\"$10\",\"description\":\"https://www.brajrasik.org/hi/articles/5ac3dac69f7ab760360f9c1d/nayo-neh-nava-rang-nayo-ras-shri-hita-harivansh-mahaprabhu-shri-hita-chaturasi\",\"author\":\"श्री हित हरिवंश महाप्रभु, श्री हित चतुरासी (54)\",\"status\":\"published\",\"content_text\":\"$11\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5ac3dac69f7ab760360f9c1d/nayo-neh-nava-rang-nayo-ras-shri-hita-harivansh-mahaprabhu-shri-hita-chaturasi\",\"slug\":\"nayau-neh-nav-rng-nayau-rasa\"}],\"imageUrl\":null},{\"name\":\"राग |बहुत\",\"hinglishName\":\"rag |bahuta\",\"slug\":\"rag-bahuta\",\"verses\":[{\"id\":\"local-261\",\"title\":\"करु मन जुगलचरण अनुराग\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\"करु मन जुगलचरण अनुराग |बहुत दिवस तोहिं सोवत बीते, जाग रे मूरख जाग | |बेमुखियन की संगति सों तू, जैसे बनै त्यों भाग |बस वृन्दावन भज राधावर, भूलिके अन्त न लाग  | |\\\"\",\"hindi_text\":\"अरे मन, युगल सरकार के कमल चरणों से प्रेम करो। तुम अनंत काल से अज्ञानता में सो रहे हो। हे मूर्ख, यह जागने का समय है। जो तेरी भक्ति के पक्ष में एवं उसमें बाधा पहुँचाने वाले हैं, उनसे किसी भी तरह दूर भाग जा। वृंदावन का आश्रय ले, श्री युगल सरकार का भजन कर और भूल कर भी अन्य जगह मन का लगाव न कर ।\",\"english_text\":null,\"english_translation\":\"Oh Mind, drench yourself in the love of the lotus feet of Yugal Sarkar. You have been sleeping in the stupor of ignorance since eternity, Oh foolish one, This is the time to wake up. Run away by any means possible, from the association of those who are not in the favor of your devotion. Reside and Take Shelter in Vrindavan, chant the glories of Shri Yugal Sarkar exclusively!\",\"description\":\"https://www.brajrasik.org/hi/articles/5b1c90e59f7ab760360f9c87/karu-mana-yugal-charan-anurag-bahut-divas-tohin-sovat-beete-jaag-re-murakh-jaag-bimukhan-ki-sangati-son-tu-jaise-bane-tyon-bhaag-bas-vrindavan-bhaj-radhavan-bhulike-anant-na-laag-shri-narayan-swami-braj-vihaar\",\"author\":\"श्री नारायण स्वामी, ब्रज विहार, पद सिद्धान्त (4)\",\"status\":\"published\",\"content_text\":\"(राग कालिंगडा)\\n\\\"करु मन जुगलचरण अनुराग |\\nबहुत दिवस तोहिं सोवत बीते, जाग रे मूरख जाग | |\\nबेमुखियन की संगति सों तू, जैसे बनै त्यों भाग |\\nबस वृन्दावन भज राधावर, भूलिके अन्त न लाग  | |\\\"\\n- श्री नारायण स्वामी, ब्रज विहार, पद सिद्धान्त (4)\\nअरे मन, युगल सरकार के कमल चरणों से प्रेम करो। तुम अनंत काल से अज्ञानता में सो रहे हो। हे मूर्ख, यह जागने का समय है। जो तेरी भक्ति के पक्ष में एवं उसमें बाधा पहुँचाने वाले हैं, उनसे किसी भी तरह दूर भाग जा। वृंदावन का आश्रय ले, श्री युगल सरकार का भजन कर और भूल कर भी अन्य जगह मन का लगाव न कर ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b1c90e59f7ab760360f9c87/karu-mana-yugal-charan-anurag-bahut-divas-tohin-sovat-beete-jaag-re-murakh-jaag-bimukhan-ki-sangati-son-tu-jaise-bane-tyon-bhaag-bas-vrindavan-bhaj-radhavan-bhulike-anant-na-laag-shri-narayan-swami-braj-vihaar\",\"slug\":\"karu-man-jugalacharan-anuraga\"}],\"imageUrl\":null},{\"name\":\"राग गर्व\",\"hinglishName\":\"rag garva\",\"slug\":\"rag-garva\",\"verses\":[{\"id\":\"local-268\",\"title\":\"श्री निकुंज रहस्य\",\"category\":\"Shloka\",\"sanskrit_text\":\"श्लोक 1नव ललितवयस्कौ नव्यलावण्यपुञ्जौनव रस चलचित्तौ नूतनप्रेमवित्तौ।नव निधुवनलीला कौतुकेनातिलोलौस्मर निभृतनिकुञ्जे राधिकाकृष्णचन्द्रौ॥\",\"hindi_text\":\"$12\",\"english_text\":null,\"english_translation\":\"$13\",\"description\":\"https://www.brajrasik.org/hi/articles/5902fe7311ec2c04484ebff5/shri-nikunjarahasyastava-prayer-by-shri-roop-goswami\",\"author\":\"\",\"status\":\"published\",\"content_text\":\"$14\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5902fe7311ec2c04484ebff5/shri-nikunjarahasyastava-prayer-by-shri-roop-goswami\",\"slug\":\"shri-nikunj-rahasya\"}],\"imageUrl\":null},{\"name\":\"राग रागिनीन\",\"hinglishName\":\"rag raginina\",\"slug\":\"rag-raginina\",\"verses\":[{\"id\":\"local-319\",\"title\":\"कुंजबिहारी हौं तेरी बलाइ\",\"category\":\"Shloka\",\"sanskrit_text\":\"कुंजबिहारी हौं तेरी बलाइलेऊँ नीके हौ गावत।राग रागिनीन के जूथ उपजावत।।तैसीयै तैसी मिली जोरीप्रिया जू की मुख देखत चंद लजावत।श्रीहरिदास के स्वामी स्यामा कौनृत्य देखत काहि न भावत।।\",\"hindi_text\":\"कुंजबिहारी की भावना है प्यारी जी आप मुझे अंग संग कर कुंजों विहार कर रही हैं , मैं आप की बलायें यानि बलिहारी पर लेता हूँ, आप अपनी कृपालुता बरसाती रहें , आप इसी भांति रहें , बोलें , गाती रहें । आप के आलिंगन से अनेक मनोरथ पूर्ण होते हैं , नये उपजते भी उपजते हैं । सखी बोली - प्रिया जी की मुख चन्द्र के आगे लाल जी का मुख चन्द्र फीका प्रतीत हो रहा है । प्रिया जी के अंग के सम्मुख प्रिय का अंग दब गया है या कहीं छिप गया है । हरिदासी सखी यहाँ सुख विलास रति में किन का नृत्य विशेष है , दर्शाना चाह रही हैं । श्री श्यामा जी का नृत्य श्वास है , यह सुन श्री श्याम जी प्रसन्नता से बोल पड़े , आप की कृपा से श्यामा प्यारी जी नृत्य कर रही हैं , सो मैं बलि बलि जाऊँ ।\",\"english_text\":null,\"english_translation\":\"$15\",\"description\":\"https://www.brajrasik.org/hi/articles/59a1bdc359e8c72a534d85b5/kunjbihari-haun-teree-balaee-leun-pad-by-swami-shri-haridas-ji\",\"author\":\"श्री हरिदास, केलिमाल (12)\",\"status\":\"published\",\"content_text\":\"(राग कान्हरौ)\\nकुंजबिहारी हौं तेरी बलाइ\\nलेऊँ नीके हौ गावत।\\nराग रागिनीन के जूथ उपजावत।।\\nतैसीयै तैसी मिली जोरी\\nप्रिया जू की मुख देखत चंद लजावत।\\nश्रीहरिदास के स्वामी स्यामा कौ\\nनृत्य देखत काहि न भावत।।\\n- श्री हरिदास, केलिमाल (12)\\nकुंजबिहारी की भावना है प्यारी जी आप मुझे अंग संग कर कुंजों विहार कर रही हैं , मैं आप की बलायें यानि बलिहारी पर लेता हूँ, आप अपनी कृपालुता बरसाती रहें , आप इसी भांति रहें , बोलें , गाती रहें । आप के आलिंगन से अनेक मनोरथ पूर्ण होते हैं , नये उपजते भी उपजते हैं । सखी बोली - प्रिया जी की मुख चन्द्र के आगे लाल जी का मुख चन्द्र फीका प्रतीत हो रहा है । प्रिया जी के अंग के सम्मुख प्रिय का अंग दब गया है या कहीं छिप गया है । हरिदासी सखी यहाँ सुख विलास रति में किन का नृत्य विशेष है , दर्शाना चाह रही हैं । श्री श्यामा जी का नृत्य श्वास है , यह सुन श्री श्याम जी प्रसन्नता से बोल पड़े , आप की कृपा से श्यामा प्यारी जी नृत्य कर रही हैं , सो मैं बलि बलि जाऊँ ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59a1bdc359e8c72a534d85b5/kunjbihari-haun-teree-balaee-leun-pad-by-swami-shri-haridas-ji\",\"slug\":\"kunjabihari-haun-teri-balai\"}],\"imageUrl\":null},{\"name\":\"राग री।सकल\",\"hinglishName\":\"rag ri.sakala\",\"slug\":\"rag-risakala\",\"verses\":[{\"id\":\"local-341\",\"title\":\"आज नीकी बनी श्रीराधिका नागरी\",\"category\":\"Shloka\",\"sanskrit_text\":\"आज नीकी बनी श्रीराधिका नागरी।ब्रज जुवति जूथ में रूप अरु चतुरई,सील सिंगार गुन सबनितें आगरी ॥कमल दक्षिण भुजा वाम भुज अंस सखि,गाँवती सरस मिलि मधुर सुर राग री।सकल विद्या विदित रहसि 'हरिवंश हित’,मिलत नव कुञ्ज वर स्याम बड़ भाग री॥\",\"hindi_text\":\"भावार्थ- “हे सखि ! आज नागरी राधिका बड़ी नीकी (सुन्दर) बनी हैं। वे समस्त ब्रज युवती समूह में रूप, चातुर्य शील श्रृंगार एव गुण सभी बातो में सबसे बढ़ी-चढ़ी श्रेष्ठ हैं।उनके दाहिने हाथ में कमल है और वे अपनी बायीं भुजा सखि के कंघे पर रखे हुए सब सहचरियों से मिलकर सरस एव मधुर राग का स्वर पूर्वक गान कर रही हैं। श्रीहित हरिवंश चंद्र कहते हैं -\\\" ये राधा समस्त विद्याओं की ज्ञाता है।अहो ! वे आज बड़भागी श्रीश्यामसुन्दर से रहस्य निकुंजवर मंन्दिर में (आनंद पूर्वक) मिल रही हैं” ।\",\"english_text\":null,\"english_translation\":\"Shri Hita Harivansh Mahaprabhu says, \\\"Hey sakhi (friend)! Today ‘Nagari’ Shri Radhika is looking extremely charming. She possesses the best beauty, wisdom, morality, well-adorned makeup, and virtues, among all of the young women of Braj.\\nShe is holding a lotus in her right hand and her left hand is placed upon the shoulders of her ‘sakhi' (companion) and she is singing with sweet, melodious voice with other companions.\\nShri Hita Harivansh Chandra says - \\\"Shri Radha is the knower of all types of arts. Alas! Today she is going to meet joyfully with the luckiest ‘Shyamasundar' at the mysterious Nikunj groves of Vrindavan”.\",\"description\":\"https://www.brajrasik.org/hi/articles/5c16b856e9f5c7005876baa4/aaj-niki-bani-shri-radhika-nagri-shri-hita-harivansh-mahaprabhu-from-hita-chaurasi-25\",\"author\":\"श्री हित हरिवंश महाप्रभु, हित चौरासी (25)\",\"status\":\"published\",\"content_text\":\"(राग धनाश्री)\\nआज नीकी बनी श्रीराधिका नागरी।\\nब्रज जुवति जूथ में रूप अरु चतुरई,\\nसील सिंगार गुन सबनितें आगरी ॥\\nकमल दक्षिण भुजा वाम भुज अंस सखि,\\nगाँवती सरस मिलि मधुर सुर राग री।\\nसकल विद्या विदित रहसि 'हरिवंश हित’,\\nमिलत नव कुञ्ज वर स्याम बड़ भाग री॥\\n- श्री हित हरिवंश महाप्रभु, हित चौरासी (25)\\nभावार्थ- “हे सखि ! आज नागरी राधिका बड़ी नीकी (सुन्दर) बनी हैं। वे समस्त ब्रज युवती समूह में रूप, चातुर्य शील श्रृंगार एव गुण सभी बातो में सबसे बढ़ी-चढ़ी श्रेष्ठ हैं।उनके दाहिने हाथ में कमल है और वे अपनी बायीं भुजा सखि के कंघे पर रखे हुए सब सहचरियों से मिलकर सरस एव मधुर राग का स्वर पूर्वक गान कर रही हैं। श्रीहित हरिवंश चंद्र कहते हैं -\\\" ये राधा समस्त विद्याओं की ज्ञाता है।अहो ! वे आज बड़भागी श्रीश्यामसुन्दर से रहस्य निकुंजवर मंन्दिर में (आनंद पूर्वक) मिल रही हैं” ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5c16b856e9f5c7005876baa4/aaj-niki-bani-shri-radhika-nagri-shri-hita-harivansh-mahaprabhu-from-hita-chaurasi-25\",\"slug\":\"aj-niki-bani-shriradhika-nagari\"}],\"imageUrl\":null},{\"name\":\"राग में\",\"hinglishName\":\"rag men\",\"slug\":\"rag-men\",\"verses\":[{\"id\":\"local-375\",\"title\":\"रँगीली लाड़िली रँगभीने मोहनलाल\",\"category\":\"Shloka\",\"sanskrit_text\":\"कुंजनि कुंजनि डोलहीं हो मत्त मराल की चाल।मूरति प्रेम सिंगार की रँगभीने दोउ लाल॥\",\"hindi_text\":\"(दोहा)\\nफिर परस्पर के अनुराग में भीगे हुए दोनों लाल अर्थात् मूतिमान प्रेम श्रीप्रियाजू और साक्षात् श्रृंगार रस स्वरूप श्रीलालजू परस्पर गल बहियाँ दिये हए एक कुंज से दूसरी कुंज में डोलने लगे ।\\n(पद)\\nफिर रंगीली श्री लाडली जू और अनुराग में निमग्न श्री मोहनलाल जो स्वाभाविक ही प्रेम और श्रृंगार की रसीली मूर्तियाँ हैं, एक निकुंज से दूसरी निकुंज में मस्त हँस की चाल से डोलने लगे यह परस्पर गल बहियां दिये हुए चलते चलते बातें करते जाते हैं, और कभी कभी मुस्कराने लगते हैं गोरी प्यारी जू स्वर्ण लता सरीखी और प्यारे श्याम तमाल जैसे प्रतीत होते हैं। श्री हरि प्रिया सखी जी यह चाहती हैं कि यह आनन्द रूप रसाल जोरी सदा मेरे हृदय में ऐसे ही विराजमान रहे।\",\"english_text\":null,\"english_translation\":null,\"description\":\"https://www.brajrasik.org/hi/articles/5d8b90dd6851f9006900c89a/rangeeli-ladili-rangbheene-mohanlaal-shri-harivyas-devacharya-mahavani-utsah-sukh-30\",\"author\":\"श्री हरिव्यास देवाचार्य, महावानी, उत्साह सुख (30)\",\"status\":\"published\",\"content_text\":\"$16\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d8b90dd6851f9006900c89a/rangeeli-ladili-rangbheene-mohanlaal-shri-harivyas-devacharya-mahavani-utsah-sukh-30\",\"slug\":\"rngili-ladaili-rngabhine-mohanalala\"}],\"imageUrl\":null},{\"name\":\"राग आसावरी\",\"hinglishName\":\"rag asavari\",\"slug\":\"rag-asavari\",\"verses\":[{\"id\":\"local-421\",\"title\":\"सुनि मेरो वचन छबीली राधा, तैं पायो रस सिंधु अगाधा\",\"category\":\"Shloka\",\"sanskrit_text\":\"सुनि मेरो वचन छबीली राधा, तैं पायो रस सिंधु अगाधा ।।तूँ वृषभानु गोप की बेटी, मोहनलाल रसिक हँसि भेंटी ।जाहि बिरंचि उमापति नाये, तापै तैं बन फूल बिनाये ।।जो रस नेति-नेति श्रुति भाख्यो, ताकौ तैं अधर सुधारस चाख्यौ ।तेरौ रूप कहत नहीं आवै, जै श्रीहित हरिवंश कछुक जस गावै ।\",\"hindi_text\":\"(राग आसावरी)\\nसुनि मेरो वचन छबीली राधा, तैं पायो रस सिंधु अगाधा ।।\\nतूँ वृषभानु गोप की बेटी, मोहनलाल रसिक हँसि भेंटी ।\\nजाहि बिरंचि उमापति नाये, तापै तैं बन फूल बिनाये ।।\\nजो रस नेति-नेति श्रुति भाख्यो, ताकौ तैं अधर सुधारस चाख्यौ ।\\nतेरौ रूप कहत नहीं आवै, जै श्रीहित हरिवंश कछुक जस गावै ।\\n- मुरली अवतार श्री हित हरिवंश महाप्रभु - श्री हित चतुरासी (18)\\nभावार्थ- \\\"हे छविमयी राधे ! तू मेरी बात सुन ! तूने रस का गम्भीर समुद्र पाया है । यद्यपि तू वृषभानु गोप की ही बेटी है, फिर भी तूने प्रसन्नता पूर्वक रसिक मोहन लाल का आलिंगन किया है, जिन श्रीकृष्ण का नमन ब्रह्म और उमापति शङ्कर भी करते है, तूने उन्हों से फूल विनाये (चुनवाये) हैं । आरी ! जिस श्रीकृष्ण (परम पुरुष भगवान) के रस (लीला, प्रभाव, गुण माहात्म्य आदि) के लिये श्रुतियों ने भी (असमर्थता पूर्वक) नेति नेति कह दिया तूने तो उसका भी अधर रस पान किया है। राधे ! तेरा रूप तो कुछ कहने में ही नहीं आता, हित हरिवंश तो तेरा कुछ थोड़ा सा सुयश मात्र ही गा रहा है |\",\"english_text\":null,\"english_translation\":\"Oh, Shri Radhey, Please listen to me, You have got the ultimate mine of bliss. You are the daughter of Shri Vrishbhanu and have lovingly embraced Shri Krishna. [1]\\nThe supreme God Shri Krishn who is always worshipped by Lord Bhrama and Lord Shiva, has especially picked up flowers for you from the forest. Even Vedas declare Him as out of reach, and you can easily drink the nectar of His lips. [2]\\nShri Hita Harivansh Mahaprabhu, the incarnation of Shri Krishn’s Murali says “By any means possible, Its utterly impossible to explain your divine beauty, and the glimpse in the words, Whatever I am explaining is just the fraction of it!” [3]\",\"description\":\"https://www.brajrasik.org/hi/articles/5b7e7ee8506f44004fb01262/suni-mero-vachan-chabeeli-radha-shri-hita-harivansh-mahaprabhu-shri-hita-chaturasi-98\",\"author\":\"मुरली अवतार श्री हित हरिवंश महाप्रभु  श्री हित चतुरासी (18)\",\"status\":\"published\",\"content_text\":\"(राग आसावरी)\\nसुनि मेरो वचन छबीली राधा, तैं पायो रस सिंधु अगाधा ।।\\nतूँ वृषभानु गोप की बेटी, मोहनलाल रसिक हँसि भेंटी ।\\nजाहि बिरंचि उमापति नाये, तापै तैं बन फूल बिनाये ।।\\nजो रस नेति-नेति श्रुति भाख्यो, ताकौ तैं अधर सुधारस चाख्यौ ।\\nतेरौ रूप कहत नहीं आवै, जै श्रीहित हरिवंश कछुक जस गावै ।\\n- मुरली अवतार श्री हित हरिवंश महाप्रभु - श्री हित चतुरासी (18)\\nभावार्थ- \\\"हे छविमयी राधे ! तू मेरी बात सुन ! तूने रस का गम्भीर समुद्र पाया है । यद्यपि तू वृषभानु गोप की ही बेटी है, फिर भी तूने प्रसन्नता पूर्वक रसिक मोहन लाल का आलिंगन किया है, जिन श्रीकृष्ण का नमन ब्रह्म और उमापति शङ्कर भी करते है, तूने उन्हों से फूल विनाये (चुनवाये) हैं । आरी ! जिस श्रीकृष्ण (परम पुरुष भगवान) के रस (लीला, प्रभाव, गुण माहात्म्य आदि) के लिये श्रुतियों ने भी (असमर्थता पूर्वक) नेति नेति कह दिया तूने तो उसका भी अधर रस पान किया है। राधे ! तेरा रूप तो कुछ कहने में ही नहीं आता, हित हरिवंश तो तेरा कुछ थोड़ा सा सुयश मात्र ही गा रहा है |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b7e7ee8506f44004fb01262/suni-mero-vachan-chabeeli-radha-shri-hita-harivansh-mahaprabhu-shri-hita-chaturasi-98\",\"slug\":\"suni-mero-vachan-chhabili-radha-tain-payo-ras-sindhu-agadha\"}],\"imageUrl\":null},{\"name\":\"राग घटा\",\"hinglishName\":\"rag ghata\",\"slug\":\"rag-ghata\",\"verses\":[{\"id\":\"local-437\",\"title\":\"हँसनि में फुलनि की चाहनि में अमृत की\",\"category\":\"Shloka\",\"sanskrit_text\":\"हँसनि में फुलनि की चाहनि में अमृत की,नख-सिख रूप ही की बरषा सी होती है। [1]केसनि की चंद्रिका सुहाग अनुराग घटा,दामिनी की लसनी दसन ही की दोती है॥ [2]'हित ध्रुव' पानिप तरंग-रस छलकत,ताकि मानौ सहज सिंगार सीवाँ पोति है। [3]अति अलबेली प्रिये भूषित भूषन बिनु,छिन-छिन औरै और बदन की जोति है॥ [4]\",\"hindi_text\":\"श्री प्रिया जी का हास्य कुसुम निर्झर के समान है, और उनका अवलोकन सरस सुधा-प्रवाह के समान है। उनके सर्वांग स्वरूप से रूप-सौंदर्य की वर्षा होती रहती है। [1]\\nउनकी केश-राशि का विस्तार सुहाग और अनुराग में उमड़ते मेघ के समान है, और उनकी दसन-द्युति दामिनी की दमक के समान कान्तियुक्त है। [2]\\nश्री ध्रुवदास जी कहते हैं कि प्रिया के रूप में अद्भुत लावण्यपूर्वक रस की तरंगें छलकती रहती हैं, और कंठ में धारण की हुई पोत की लड़ी श्रृंगार की परमावधि है। [3]\\nअनन्य लावण्य-सौंदर्यमयी प्रिया, भूषण-रहित होते हुए भी भूषणों से अलंकृत होने से अधिक शोभामयी प्रतीत होती हैं, और उनके मुख-मंडल की ज्योति प्रतिक्षण नित्य नवनवायमान होती रहती है। [4]\",\"english_text\":null,\"english_translation\":\"The sweetness of Śrī Rādhā's bewitching smile is spectacular resembling flowers. When She gazes upon someone, it feels as if the pure nectar is raining. [1]\\nShe is plunged from head to toe in the nectar ocean of transcendental beauty. [2]\\nHer hair-parting decorated with vermilion is like a cloud overflowing in the transcendental divine love. Even the glaze of lightning in the sky feels ashamed looking at the glint of Her teeth. [3]\\nŚrī Hita Dhruvdās says that ever-new Heavy tides of amazingly blissful nectar arise in Her form and Her necklace (garland) is the pinnacle of adornment. This fair-complexioned lady is the endless epitome of beauty, is looking gorgeously adorned even without any ornaments. The divine effulgence and splendor of Śrī Rādhā's face is ever-new every moment. [4]\",\"description\":\"https://www.brajrasik.org/hi/articles/5d9ca1ebda8fa90060518c1e/hansani-mein-phulani-ki-shri-hit-dhruvdas-bayalees-leela-shringar-shat-115\",\"author\":\"श्री हित ध्रुवदास, बयालीस लीला, श्रृंगार शत 1 (15)\",\"status\":\"published\",\"content_text\":\"हँसनि में फुलनि की चाहनि में अमृत की,\\nनख-सिख रूप ही की बरषा सी होती है। [1]\\nकेसनि की चंद्रिका सुहाग अनुराग घटा,\\nदामिनी की लसनी दसन ही की दोती है॥ [2]\\n'हित ध्रुव' पानिप तरंग-रस छलकत,\\nताकि मानौ सहज सिंगार सीवाँ पोति है। [3]\\nअति अलबेली प्रिये भूषित भूषन बिनु,\\nछिन-छिन औरै और बदन की जोति है॥ [4]\\n- श्री हित ध्रुवदास, बयालीस लीला, श्रृंगार शत 1 (15)\\nश्री प्रिया जी का हास्य कुसुम निर्झर के समान है, और उनका अवलोकन सरस सुधा-प्रवाह के समान है। उनके सर्वांग स्वरूप से रूप-सौंदर्य की वर्षा होती रहती है। [1]\\nउनकी केश-राशि का विस्तार सुहाग और अनुराग में उमड़ते मेघ के समान है, और उनकी दसन-द्युति दामिनी की दमक के समान कान्तियुक्त है। [2]\\nश्री ध्रुवदास जी कहते हैं कि प्रिया के रूप में अद्भुत लावण्यपूर्वक रस की तरंगें छलकती रहती हैं, और कंठ में धारण की हुई पोत की लड़ी श्रृंगार की परमावधि है। [3]\\nअनन्य लावण्य-सौंदर्यमयी प्रिया, भूषण-रहित होते हुए भी भूषणों से अलंकृत होने से अधिक शोभामयी प्रतीत होती हैं, और उनके मुख-मंडल की ज्योति प्रतिक्षण नित्य नवनवायमान होती रहती है। [4]\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d9ca1ebda8fa90060518c1e/hansani-mein-phulani-ki-shri-hit-dhruvdas-bayalees-leela-shringar-shat-115\",\"slug\":\"hnsani-men-fulani-ki-chahani-men-amrit-ki\"}],\"imageUrl\":null},{\"name\":\"राग परसपर\",\"hinglishName\":\"rag parasapara\",\"slug\":\"rag-parasapara\",\"verses\":[{\"id\":\"local-566\",\"title\":\"आजु निकुंज मंजु में खेलत\",\"category\":\"Shloka\",\"sanskrit_text\":\"आजु निकुंज मंजु में खेलत, नवल किसोर नवीन किसोरी |  अति अनुपम अनुराग परसपर, सुनि अभूत भूतल पर जोरी ||विद्रुम फटिक विविध निर्मित धर, नव कर्पूर पराग न थोरी |  कौंमल किसलय सैंन सुपेसल, तापर स्याम निवेसित गोरी ||मिथुन हास परिहास परायन, पीक कपोल कमल पर झोरी |  गौर स्याम भुज कलह मनोहर, नीवी बंधन मोचत डोरी ||हरि उर मुकुर बिलोकि अपनपी, विभ्रम विकल मान जुत भोरी |  चिबुक सुचारु प्रलोइ प्रवोधत, पिय प्रतिबिंब जनाइ निहोरी ||'नेति नेति' बचनामृत सुनि सुनि, ललितादिक देखतिं दुरि चोरी |  (जै श्री) हित हरिवंश करत कर धूनन, प्रनय कोप मालावलि तोरी ||\",\"hindi_text\":\"$17\",\"english_text\":null,\"english_translation\":\"$18\",\"description\":\"https://www.brajrasik.org/hi/articles/5a9d8c2e9f7ab760360f9bef/aaju-nikunj-manju-mein-khelat-naval-kishor-naveel-kisori-shri-hita-harivansh-mahaprabhu-hit-chaturasi-7\",\"author\":\"श्री हित हरिवंश महाप्रभु, हित चौरासी (7)\",\"status\":\"published\",\"content_text\":\"$19\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a9d8c2e9f7ab760360f9bef/aaju-nikunj-manju-mein-khelat-naval-kishor-naveel-kisori-shri-hita-harivansh-mahaprabhu-hit-chaturasi-7\",\"slug\":\"aju-nikunj-mnju-men-khelata\"}],\"imageUrl\":null}]}]}],null],null],null]},[null,[\"$\",\"$L1a\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"ragas\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L1b\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"lang\":\"hi\",\"children\":[\"$\",\"$L1a\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L1b\",null,{}],\"templateStyles\":\"$undefined\",\"templateScript

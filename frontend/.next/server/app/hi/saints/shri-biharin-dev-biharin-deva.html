या जा सकता है |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a71371082274812fecf9670/jo-chahe-chita-de-mahilan-ke-ang-sang-anusar-shri-biharin-dev-shri-biharin-dev-ki-vani\",\"slug\":\"jo-chahe-chit-dai-mahilan-ke-ang-sng-anusara\"},{\"id\":\"local-184\",\"title\":\"देत आसीस विहारिनि दासी करहुं नवल नित रलियां\",\"category\":\"Shloka\",\"sanskrit_text\":\"\\\" देत आसीस विहारिनि दासी करहुं नवल नित रलियां || \\\"\",\"hindi_text\":\"- श्री बिहारिन देव - बिहारिन देव जी की वाणी\\nश्री बिहारीन देव श्री युगल सरकार को आशीर्वाद देते हैं और कहते हैं, की आप हमेशा श्री वृंदावन में नए-नए अद्भुत 'नित्य विहार' लीला का प्रदर्शन करते रहें ।\",\"english_text\":null,\"english_translation\":\"Shri Biharin Dev gives blessings to Shri Yugal Sarkar and says “May they always perform this ever-new amazing ‘Nitya Vihaar’ Leela at Vrindavan”.\",\"description\":\"https://www.brajrasik.org/hi/articles/5b5415f45dbf5475ed9a43de/-deta-aasis-biharini-dasi-karhun-naval-nita-raliyan-shri-biharin-dev-shri-biharin-dev-ju-ki-vani\",\"author\":\"श्री बिहारिन देव  बिहारिन देव जी की वाणी\",\"status\":\"published\",\"content_text\":\"\\\" देत आसीस विहारिनि दासी करहुं नवल नित रलियां || \\\"\\n- श्री बिहारिन देव - बिहारिन देव जी की वाणी\\nश्री बिहारीन देव श्री युगल सरकार को आशीर्वाद देते हैं और कहते हैं, की आप हमेशा श्री वृंदावन में नए-नए अद्भुत 'नित्य विहार' लीला का प्रदर्शन करते रहें ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b5415f45dbf5475ed9a43de/-deta-aasis-biharini-dasi-karhun-naval-nita-raliyan-shri-biharin-dev-shri-biharin-dev-ju-ki-vani\",\"slug\":\"det-asis-viharini-dasi-karahun-naval-nit-raliyan\"},{\"id\":\"local-186\",\"title\":\"नित्य बिहारिनि दासी कहत श्यामा के रस बस\",\"category\":\"Shloka\",\"sanskrit_text\":\"नित्य बिहारिनि दासी कहत श्यामा के रस बस,संतत श्याम अधीन दीन मन मोहन मृदु रस।\",\"hindi_text\":\"नित्य बिहारिनि दासी कहत श्यामा के रस बस,\\nसंतत श्याम अधीन दीन मन मोहन मृदु रस।\\n- श्री बिहारिन देव - बिहारिन देव जी की वाणी\\nनित्य बिहारिनि श्री राधारानी की दासी तुमसे यह बात कह रही है कि हमारी श्री राधारानी ऐसा दुर्लभ रस बरसाती हैं कि और की बात तो जाने दो, श्याम सुन्दर भी जिनके रस के वश अति लालायित होकर नित्य दीन ही बने रहते हैं।\",\"english_text\":null,\"english_translation\":\"The maidservant of Nitya Biharini Shri Radha is saying to you, “What to say about others even Lord Krishn always stays humble and needy before Shri Radha, being captivated and enslaved by the nectarean rare bliss which she showers”!!\",\"description\":\"https://www.brajrasik.org/hi/articles/5bfaa06574377100587eb55d/nitya-biharini-dasi-kahat-shyama-ke-ras-bas-shri-biharin-dev-ji-shri-biharin-dev-ji-ki-vani\",\"author\":\"श्री बिहारिन देव  बिहारिन देव जी की वाणी\",\"status\":\"published\",\"content_text\":\"नित्य बिहारिनि दासी कहत श्यामा के रस बस,\\nसंतत श्याम अधीन दीन मन मोहन मृदु रस।\\n- श्री बिहारिन देव - बिहारिन देव जी की वाणी\\nनित्य बिहारिनि श्री राधारानी की दासी तुमसे यह बात कह रही है कि हमारी श्री राधारानी ऐसा दुर्लभ रस बरसाती हैं कि और की बात तो जाने दो, श्याम सुन्दर भी जिनके रस के वश अति लालायित होकर नित्य दीन ही बने रहते हैं।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5bfaa06574377100587eb55d/nitya-biharini-dasi-kahat-shyama-ke-ras-bas-shri-biharin-dev-ji-shri-biharin-dev-ji-ki-vani\",\"slug\":\"nity-biharini-dasi-kahat-shyama-ke-ras-basa\"},{\"id\":\"local-340\",\"title\":\"श्रीबिहारिनदास को यह बिसन राधा नाम हृदय धरि वसि रहैं वृन्दावन\",\"category\":\"Shloka\",\"sanskrit_text\":\"श्रीबिहारिनदास को यह बिसन राधा नाम हृदय धरि वसि रहैं वृन्दावन |\",\"hindi_text\":\"- श्री बिहारिन देव - बिहारिन देव जी की वाणी\\nश्री बिहारिन दास जी कहते हैं कि जीव अत्यंत प्रकार के नशे करता है जो तुरंत उतर जाता है और दुख/अशांति प्रदान करता है, परंतु उन्हें राध

hunks/app/layout-2163618386e90fe6.js\"],\"ClientPr"])</script><script>self.__next_f.push([1,"oviders\"]\nf:I[1060,[],\"\"]\n9:T946,"])</script><script>self.__next_f.push([1,"ādau śraddhā tataḥ sādhu-saṅgo’tha bhajana-kriyā |\ntato’nartha-nivṛttiḥ syāt tato niṣṭhā rucis tataḥ ||1.4.15||\nathāsaktis tato bhāvas tataḥ premābhyudañcati |\nsādhakānām ayaṃ premnaḥ prādurbhāve bhavet kramaḥ ||1.4.16||\n- Shri Roop Goswami, Bhakti Rasamrit Sindhu (1.4.15- 1.4.16)\n1.\nSraddha\n: Faith\n2.\nSadhu-sanga\n: Association with\nSaints.\n3.\nBhajana-Kriya\n: Performance\nof devotional practices.\n4.\nAnartha Nivrtti\n: Decreasing of\nunwanted attachments.\n5.\nNistha\n: Steadiness.\n6.\nRuchi\n: Taste.\n7.\nAsakti\n: Attachment.\n8.\nBhava\n: Love.\n9.\nPrema\n: Pure love for God.\nIn the beginning, one must have a “Shrddha” a preliminary desire for God realization. This means an individual’s eager desire leads one to be in the company of a God realized Saint which is called “Sadhu Sanga”, in order to learn the methods of spiritual practices for God-realization alone and for no other purpose. In the next stage, one follows the instructions of a spiritual master and begins the process of “Bhajan-Kriya”, devotional practices like\nListening, Singing and Chanting the Qualities of God with his mind. By execution of devotional practises, one becomes free from all material attachment (”Anartha Nivritti”), attains “Nishtha” i.e steadiness, and thereafter acquires a “Ruchi”, taste for hearing about Sri Krishna. This taste leads one further forward to attachment for Krishna called “Asakti”, which is matured in “Bhava”, or the preliminary stage of transcendental love of God where one develops an intense longing for his Beloved Lord. Here a devotee, doesn’t wastes his time, even for the twinkling of an eye without being constantly engaged in his Bhajans. He sometimes feels the presence of Krishna near him, and is drowned in the stream of ecstasy (the menifestation of “Satvik Bhao”). Last Stage is called “Prema”, Pure (Real) love for God. the highest perfectional stage of life where the Spiritual Master bestows his special mercy and grace to his completely surrendered disciple and give him “Prema”. So, by the process of devotional service, under the guidance of the spiritual master, one can attain the highest stage of divine bliss, being freed from all material attachment. Then thereafter one can ultimately reach to the abode of the Supreme Lord, “Golok Dham” to serve God."])</script><script>self.__next_f.push([1,"b:[\"slug\",\"shril-rup-gosvami-bhakti-rasamrit-sindhu-1415-1416\",\"d\"]\n10:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"saints\",\"shril-rup-gosvami-bhakti-rasamrit-sindhu-1415-1416\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shril-rup-gosvami-bhakti-rasamrit-sindhu-1415-1416\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"shril-rup-gosvami-bhakti-rasamrit-sindhu-1415-1416\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shril-rup-gosvami-bhakti-rasamrit-sindhu-1415-1416\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"श्रील रूप गोस्वामी,  भक्ति रसामृत सिंधु  (1.4.15 1.4.16)\\\",\\\"alternateName\\\":\\\"shril rup gosvami, bhakti rasamrit sindhu (1.4.15 1.4.16)\\\",\\\"description\\\":\\\"ब्रज परंपरा के वैष्णव संत।\\\",\\\"url\\\":\\\"https://path.vrindopnishad.in/hi/saints/shril-rup-gosvami-bhakti-rasamrit-sindhu-1415-1416\\\",\\\"knowsAbout\\\":[\\\"Vaishnavism\\\",\\\"Bhakti Yoga\\\",\\\"Braj Rasik Heritage\\\",\\\"Vrindavan\\\"]}\"}}],[\"$\",\"script\",null,{\"type\":\"appli धु में श्रील रूपगोस्वामी, भक्ति के क्रमिक विकास का वर्णन करते हुए कहते हैं कि:-\\nआदौ श्रद्धा ततः साधुसंगोऽथ भजनक्रिया। ततोऽनर्थनिवृत्तिः स्यात्तत्तो निष्ठा रुचिस्ततः।।\\nअथासक्तिस्ततो भावस्ततः प्रेमाऽभ्युदञ्चति। साधकानामयं प्रेम्णः प्रादुर्भावे भवेत् क्रमः।।\\n- श्रील रूप गोस्वामी,  भक्ति रसामृत सिंधु  (1.4.15- 1.4.16)\\nअर्थातः- सर्वप्रथम श्रद्धा अर्थात शास्त्र वचनों में विश्वास होता है, उसके बाद साधु-संग होता है, फिर भजन क्रिया प्रारम्भ होती है, भजन क्रिया के बाद अनर्थ-निवृति, फिर निष्ठा, फिर रूचि, तदनन्तर आसक्ति और फिर भाव का उदय होता है । उसके बाद प्रेम प्राप्त होता है रसिक गुरु की शरण में रहकर, तदनन्तर जीव कृत कृत हो जाता है, एवं श्री भगवान् के धाम पहुँचता है।\",\"english_text\":null,\"english_translation\":\"$9\",\"description\":\"https://www.brajrasik.org/hi/articles/599dd92159e8c72a534d85b4/the-nine-stages-of-bhakti-yoga-bhakti-rasamrit-sindhu-by-shri-roop-goswami\",\"author\":\"श्रील रूप गोस्वामी,  भक्ति रसामृत सिंधु  (1.4.15 1.4.16)\",\"status\":\"published\",\"content_text\":\"भक्तिरसामृत सिन्धु में श्रील रूपगोस्वामी, भक्ति के क्रमिक विकास का वर्णन करते हुए कहते हैं कि:-\\nआदौ श्रद्धा ततः साधुसंगोऽथ भजनक्रिया। ततोऽनर्थनिवृत्तिः स्यात्तत्तो निष्ठा रुचिस्ततः।।\\nअथासक्तिस्ततो भावस्ततः प्रेमाऽभ्युदञ्चति। साधकानामयं प्रेम्णः प्रादुर्भावे भवेत् क्रमः।।\\n- श्रील रूप गोस्वामी,  भक्ति रसामृत सिंधु  (1.4.15- 1.4.16)\\nअर्थातः- सर्वप्रथम श्रद्धा अर्थात शास्त्र वचनों में विश्वास होता है, उसके बाद साधु-संग होता है, फिर भजन क्रिया प्रारम्भ होती है, भजन क्रिया के बाद अनर्थ-निवृति, फिर निष्ठा, फिर रूचि, तदनन्तर आसक्ति और फिर भाव का उदय होता है । उसके बाद प्रेम प्राप्त होता है रसिक गुरु की शरण में रहकर, तदनन्तर जीव कृत कृत हो जाता है, एवं श्री भगवान् के धाम पहुँचता है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/599dd92159e8c72a534d85b4/the-nine-stages-of-bhakti-yoga-bhakti-rasamrit-sindhu-by-shri-roop-goswami\",\"slug\":\"bhakti-ke-kramik-vikas-ka-varnana\"}],

दाय (सखी संप्रदाय)\",\"timelineEn\":\"1478–1573 AD (Vikram Samvat 1535 - 1630)\",\"timelineHi\":\"1478–1573 ईस्वी (विक्रम संवत 1535 - 1630)\",\"associatedPlacesEn\":\"Nidhivan, Vrindavan\",\"associatedPlacesHi\":\"निधिवन, वृंदावन\",\"discipleOfEn\":\"Shri Ashudhir Dev Ji (his father and guru)\",\"discipleOfHi\":\"श्री आशुधीर देव जी (पिता एवं गुरु)\",\"influencedByEn\":\"Nimbarka Sampradaya philosophy\",\"influencedByHi\":\"निम्बार्क संप्रदाय सिद्धांत\",\"associatedSampradayaEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"associatedSampradayaHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"devotionalMoodEn\":\"Nitya Vihar, Sakhi Bhava (Lalita Sakhi incarnate)\",\"devotionalMoodHi\":\"नित्य विहार, सखी भाव (ललिता सखी अवतार)\",\"teachingsEn\":\"Worship of the Divine Couple in the mood of Lalita Sakhi; focused purely on the eternal love-play (Nitya Vihar) in the secluded bowers (Nikunj) of Vrindavan, entirely devoid of majesty (aishwarya) or physical separation (viraha).\",\"teachingsHi\":\"ललिता सखी के भाव में युगल उपासना; वृंदावन के निकुंजों में होने वाले अखंड नित्य विहार रस पर पूर्ण ध्यान, जिसमें ऐश्वर्य भाव या वियोग का कोई स्थान नहीं है।\",\"literaryStyleEn\":\"Composed Kelimal (केलिमाल) and Siddhanta Pada (सिद्धान्त के पद) in sweet Braj Bhasha, characterized by deep musicality, classical raag notations, and intimate description of the Divine Couple's pastimes.\",\"literaryStyleHi\":\"मधुर ब्रजभाषा में 'केलिमाल' और 'सिद्धान्त के पद' की रचना की, जो राग-रागिनियों की शास्त्रीय विधा और निकुंज लीलाओं के सूक्ष्म चित्रण से परिपूर्ण हैं।\",\"biographyEn\":\"Swami Haridas was a spiritual master, classical music pioneer, and the founding acharya of the Haridasi Sampradaya. He is widely revered as the direct incarnation of Lalita Sakhi, the chief confidante of Srimati Radharani. Swami Haridas performed his intense bhajan in the sacred grove of Nidhivan in Vrindavan. His musical devotion was so deep and pure that the Divine Couple, Shri Radha and Krishna, appeared before him and manifested themselves in a single, combined deity form—Sri Bankey Bihari Ji. Swami Haridas taught that the ultimate spiritual destination is not cosmic liberation or majestic worship, but witnessing the confidential loving service of the Divine Couple in the eternal groves of Braj.\",\"biographyHi\":\"स्वामी हरिदास वृंदावन के रसिक शिरोमणि संत और भारतीय शास्त्रीय संगीत के महान आचार्य थे। उन्हें श्री राधा जी की प्रधान सखी श्री ललिता जी का साक्षात् अवतार माना जाता है। उन्होंने वृंदावन के निधिवन को अपनी साधना स्थली बनाया, जहाँ उनके संगीत अनुराग से खिंचकर युगल सरकार ने बांके बिहारी जी के रूप में प्रकट होकर दर्शन दिए। तानसेन और बैजू बावरा जैसे संगीत सम्राट इनके शिष्य थे। स्वामी जी ने सिद्ध किया कि भक्ति शुष्क तपस्या नहीं, बल्कि राग-रागिनियों के माध्यम से प्रभु चरणों में पूर्ण आत्मसमर्पण है।\",\"relatedSaints\":[{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"},{\"nameEn\":\"Shri Hariram Vyas\",\"nameHi\":\"श्री हरिराम व्यास\",\"slug\":\"hariram-vyas\"}],\"relatedGranthas\":[{\"nameEn\":\"Kelimal\",\"nameHi\":\"केलिमाल\",\"slug\":\"kelimal\"},{\"nameEn\":\"Siddhanta Pada\",\"nameHi\":\"सिद्धान्त के पद\",\"slug\":\"siddhanta-pada\"}],\"associatedGlossary\":[{\"termEn\":\"Nitya Vihar\",\"termHi\":\"नित्य विहार\",\"slug\":\"nitya-vihar\"},{\"termEn\":\"Nikunj\",\"termHi\":\"निकुंज\",\"slug\":\"nikunj\"},{\"termEn\":\"Sakhi Bhava\",\"termHi\":\"सखी भाव\",\"slug\":\"sakhi-bhava\"}],\"faq\":[{\"qEn\":\"Who was Swami Haridas?\",\"aEn\":\"Swami Haridas was a 16th-century rasik saint, musicologist, and founder of the Haridasi Sampradaya, renowned for manifesting the Bankey Bihari deity through his music in Nidhivan.\",\"qHi\":\"स्वामी हरिदास कौन थे?\",\"aHi\":\"स्वामी हरिदास 16वीं शताब्दी के एक महान रसिक संत, संगीतकार और हरिदासी संप्रदाय के प्रवर्तक थे, जिन्होंने अपने संगीत साधना से निधिवन में ठाकुर बांके बिहारी जी को प्रकट किया था।\"},{\"qEn\":\"Who were the famous disciples of Swami Haridas?\",\"aEn\":\"The legendary musicians Tansen (the royal singer of Akbar's court) and Baiju Bawra were disciples of Swami Haridas.\",\"qHi\":\"स्वामी हरिदास के प्रसिद्ध शिष्य कौन थे?\",\"aHi\":\"अकबर के दरबार के नवरत्नों में से एक संगीत सम्राट तानसेन और बैजू बावरा स्वामी हरिदास जी के प्रमुख शिष्य थे।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-495\",\"title\":\"आजु की बानिक प्यारे तेरी , प्यारी तुम्हारी छवि बरनी न जाइ छबि। (29)\",\"category\":\"Shloka\",\"sanskrit_text\":\"आजु की बानिक प्यारे तेरी , प्यारी तुम्हारी छवि बरनी न जाइ छबि।​इनकी स्यामता , तुम्हारी गौरता, जैसे सित-असित बैनी, रही ज्यौं भुवंगम दबी ।।​इनकौ पीताम्बर, तुम्हारौ नील निचोल, ज्यों ससि कुंदन जेब रबि।​श्री हरिदास के स्वामी स्यामा-कुंजबिहारी की,​सोभा बरनी न जाये, जो मिलें रसिक कोटि कवी ।।\",\"hindi_text\":\"सखी प्रिया प्रियतम से कह रही है - आज आप दोनों की शोभा ऐसी बनी सो न कभी नहीं देखी । इस छवि का वर्णन नहीं किया जा सकता । प्यारी जी ! प्यारे की श्यामता आपकी गौरता में लीन हो झलक रहा है । प्रिय के अंग का प्रतिबिम्ब प्यारी जी के अंगों में तथा प्यारी जी के अंगों का प्रतिविम्ब प्रिय के अंगों से दरस रहा है । मानो श्याम वर्ण अंगों की श्यामलता ने गौरवर्ण अंगों की गौरता को दबा रखा हो । प्यारे जी का श्रृंगार पिताम्बर है तो आपके कंचन रूपी तन पर नीले रंग की ओढ़नी शोभा पा रही है । आपका मुख चन्द्रमा समान है और ये बिरह रूप रवि हैं । हरिदासी सखी की स्वामिनी राधे जी कैसी है ? यद्यपि  कुंजबिहारी की शोभा का बिहार में वर्णन करना संभव नहीं परन्तु बिहारिनी जी जो कृपालता से भरी राशि है , उनकी शोभा का वर्णन कोटि रसिक सखी जन भी करने में समर्थ नहीं है । हरिदासी सखीजन भी करने में समर्थ नहीं है । हरिदासी सखी कह रही हैं हम आप दोनों की सुन्दर छवि , शोभा दर्शन जो सुख की राशि हैं, की शोभा का वर्णन कैसे करें ?\",\"english_text\":null,\"english_translation\":\"The divine couple, as usual, is surrounded by Sakhis in the Nikunj mahal. Sakhis are amazed to see their beauty today and one Sakhi tells others that today's beauty is unique from other days. Both of them are looking fresh and youthful. The dark complexion of Shri Krishn and the fair complexion of Radharani are lightening each other. Shri Krishn's chest is adorned with a yellow garment and Radha Rani is dressed in the blue garments and it's like red gold which is decorated with white flowers and the moon in the dark blue sky. The Sakhi’s are amazed to see such a beautiful form of the duo which is indescribable. Swami Shri Hari Das Ji says, There are no words to describe this beauty, which even millions of Rasik Saints cannot describe. The Sakhis are feeling fortunate to have a glimpse of the most blissful Jori which is ever-youthful.\",\"description\":\"https://www.brajrasik.org/hi/articles/59303d398c96df553692f9cc/aaaju-kee-banik-pyare-teri-pad-written-by-swami-shri-haridas-ji\",\"author\":\"श्री हरिदास, केलिमाल (29)\",\"status\":\"published\",\"content_text\":\"$9\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59303d398c96df553692f9cc/aaaju-kee-banik-pyare-teri-pad-written-by-swami-shri-haridas-ji\",\"slug\":\"aju-ki-banik-pyare-teri-pyari-tumhari-chhavi-barani-n-jai-chhabi-29\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"

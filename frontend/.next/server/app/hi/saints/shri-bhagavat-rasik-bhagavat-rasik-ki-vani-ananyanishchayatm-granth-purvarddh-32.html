बारज॥भ्रम, तम, स्रम सब हरे हमारे, कर गहि सकल संभारे कारज।भगवत रसिक प्रसंसित कीने, स्यामा स्याम सहायक आरज॥\",\"hindi_text\":\"(राग काफी)\\nबलि जैहौं श्रीरसिकचारज।\\nनित्य बिहार उद्धार कियौ जिन, मथि निज हृदय सिन्धु बारज॥\\nभ्रम, तम, स्रम सब हरे हमारे, कर गहि सकल संभारे कारज।\\nभगवत रसिक प्रसंसित कीने, स्यामा स्याम सहायक आरज॥\\n- श्री भगवत रसिक जी, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ - पूर्वार्द्ध (32)\\nभावार्थ - भगवतरसिकजी कहते हैं - रसिकाचार्य स्वामी श्री हरिदासजी! मैं आपकी बलिहारी जाता हूँ जिन्होंने अपने हृदय सिन्धु का मन्थन करके यह नित्य विहार रूपी अद्भुत रत्न प्रकट किया है। आपने हाथ पकड़कर मेरी सारी भ्रान्तियों, अविद्याओं और भटकनों को दूर करके मेरे सब काम स्वयं बना दिये हैं। आप श्रीश्यामाश्याम की नित्य केलि में योगदान करने वाली सहचरियों में शिरोमणि स्वरूप हैं, इसीलिए सब रसिकों ने आपकी प्रशंसा की है।\",\"english_text\":null,\"english_translation\":\"(Raag Kaafi)\\nBali Jaihaun ShriRasikachaaraj.\\nNity Bihaar Uddhaar Kiyau Jin, Mathi Nij Hriday Sindhu Baaraj.\\nBhram, Tam, Sram Sab Hare Hamaare, Kar Gahi Sakal Sambhaare Kaaraj.\\nBhagwat Rasik Prasansit Keene, Syama Syam Sahaayak Aaraj.\\n- Shri Bhagwat Rasik Ji, Bhagwat Rasik Ki Vani, AnanyaNishchayatma Granth - Purvardh (32)\\nShri Bhagwat Rasik says - O, Rasik Acharya Swami Shri Haridasji! I sacrifice myself upon you again and again. After churning your heart, you have revealed this most amazing jewel in the form of the nectar called \\\"Nitya Vihar\\\". Oh my master, You hold my hand and removed all my illusions, ignorance and wandering and have forcibly rectified my future. You are crest jewel among all the Rasiks and among the companions of Shri Radha Krishn, who are contributing day and night in the Keli leelas. That's why all the Rasik devotees have sung your glories.\",\"description\":\"https://www.brajrasik.org/hi/articles/5d8cc48589c4660060055df9/bali-jaihaun-shrirasikachaaraj-shri-bhagwat-rasik-ji-bhagwat-rasik-ki-vani-32\",\"author\":\"श्री भगवत रसिक जी, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ  पूर्वार्द्ध (32)\",\"status\":\"published\",\"content_text\":\"(राग काफी)\\nबलि जैहौं श्रीरसिकचारज।\\nनित्य बिहार उद्धार कियौ जिन, मथि निज हृदय सिन्धु बारज॥\\nभ्रम, तम, स्रम सब हरे हमारे, कर गहि सकल संभारे कारज।\\nभगवत रसिक प्रसंसित कीने, स्यामा स्याम सहायक आरज॥\\n- श्री भगवत रसिक जी, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ - पूर्वार्द्ध (32)\\nभावार्थ - भगवतरसिकजी कहते हैं - रसिकाचार्य स्वामी श्री हरिदासजी! मैं आपकी बलिहारी जाता हूँ जिन्होंने अपने हृदय सिन्धु का मन्थन करके यह नित्य विहार रूपी अद्भुत रत्न प्रकट किया है। आपने हाथ पकड़कर मेरी सारी भ्रान्तियों, अविद्याओं और भटकनों को दूर करके मेरे सब काम स्वयं बना दिये हैं। आप श्रीश्यामाश्याम की नित्य केलि में योगदान करने वाली सहचरियों में शिरोमणि स्वरूप हैं, इसीलिए सब रसिकों ने आपकी प्रशंसा की है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d8cc48589c4660060055df9/bali-jaihaun-shrirasikachaaraj-shri-bhagwat-rasik-ji-bhagwat-rasik-ki-vani-32\",\"slug\":\"bali-jaihaun-shrirasikacharaja\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"lang\":\"hi\",\"children

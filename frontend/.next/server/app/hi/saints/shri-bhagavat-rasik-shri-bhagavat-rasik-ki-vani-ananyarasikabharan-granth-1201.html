text\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"BreadcrumbList\\\",\\\"itemListElement\\\":[{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":1,\\\"name\\\":\\\"मुख्यपृष्ठ\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"संत\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/saints\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"श्री भगवत रसिक, श्री भगवत रसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (1.20.1)\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/saints/shri-bhagavat-rasik-shri-bhagavat-rasik-ki-vani-ananyarasikabharan-granth-1201\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-4xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/hi/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"संत\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"श्री भगवत रसिक, श्री भगवत रसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (1.20.1)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री भगवत रसिक, श्री भगवत रसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (1.20.1)\",\"hinglishName\":\"shri bhagavat rasik, shri bhagavat rasik ki vani, ananyarasikabharan granth (1.20.1)\",\"slug\":\"shri-bhagavat-rasik-shri-bhagavat-rasik-ki-vani-ananyarasikabharan-granth-1201\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-466\",\"title\":\"अद्भुत रस की खानि, सदा सुखदानि बिहारिनि रानी\",\"category\":\"Shloka\",\"sanskrit_text\":\"अद्भुत रस की खानि, सदा सुखदानि बिहारिनि रानी।\",\"hindi_text\":\"भगवत रसिक जी के शब्दों में नित्य सुख देने वाली निकुंजेश्वरी श्रीकिशोरी जी नित्य विहार रस की विलक्षण खान है। (सामान्य खाने, खनिज निकालते निकालते एक दिन रिक्त हो जाती हैं, किंतु ये निरंतर रस बरसाती हुई भी सदा रस से भरी रहती हैं)। ये बिहारी जी महाराज की जीवन संजीवनी है। उनके प्राणों का धन हैं। नित्य वृन्दावन इनकी रजधानी है। इन किशोरी जी का न आदि है न अंत । ये तो सनातन और टहल हैं । ये सहज स्वाभाविक मानवती हैं। (नैमितिमक मान इनमें नहीं है। ये बड़ी ही सुकुमार हैं और नित्य नवनवायमान स्वरूप से विद्यमान रहती हैं। श्री बिहारी जी महाराज ही इनके स्वरूप को नित्य पहचानते हैं |\",\"english_text\":null,\"english_translation\":\"In the words of Shree Bhagavat Rasik, Shri Radha, the goddess of Nikunj who delivers continual happiness to all, is actually the wonderful treasurers /mines of divine bliss. A normal mine, from which extracting minerals continually, get exhausted on one day. However, In spite of showering bliss continually, Shri Radha Rani remains blissful like always. She is the reason of life for Lord Krishn and his complete wealth. Vrindavan is her capital for eternity. Shri Kishori Radha holds neither beginning nor end. She is eternal and divine. Being herself the topmost personality possess no pride. Her heart beats with compassion and always manifest herself in ever new divine forms every moment. The crest jewel of all the Rasiks, Lord Krishn knows her divinity.\",\"description\":\"https://www.brajrasik.org/hi/articles/5afe048c9f7ab760360f9c5c/adbhuth-ras-ki-khani-sada-sukhdani-biharini-rani-shri-bhagwat-rasik\",\"author\":\"श्री भगवत रसिक, श्री भगवत रसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (1.20.1)\",\"status\":\"published\",\"content_text\":\"(राग भैरो)\\nअद्भुत रस की खानि, सदा सुखदानि बिहारिनि रानी।\\nजीवन मूरि बिहारी कौ धन, वृन्दावन रजधानी ।।\\nआदि न अंत, सनातन, अबिचल, सहज सुभाव सुमानी।\\nनागरि अति सुकुमारि, नवल नित रसिक सिरोमणि जानी।।\\n- श्री भगवत रसिक, श्री भगवत रसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (1.20.1)\\nभगवत रसिक जी के शब्दों में नित्य सुख देने वाली निकुंजेश्वरी श्रीकिशोरी जी नित्य विहार रस की विलक्षण खान है। (सामान्य खाने, खनिज निकालते निकालते एक दिन रिक्त हो जाती हैं, किंतु ये निरंतर रस बरसाती हुई भी सदा रस से भरी रहती हैं)। ये बिहारी जी महाराज की जीवन संजीवनी है। उनके प्राणों का धन हैं। नित्य वृन्दावन इनकी रजधानी है। इन किशोरी जी का न आदि है न अंत । ये तो सनातन और टहल हैं । ये सहज स्वाभाविक मानवती हैं। (नैमितिमक मान इनमें नहीं है। ये बड़ी ही सुकुमार हैं और नित्य नवनवायमान स्वरूप से विद्यमान रहती हैं। श्री बिहारी जी महाराज ही इनके स्वरूप को नित्य पहचानते हैं |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5afe048c9f7ab760360f9c5c/adbhuth-ras-ki-khani-sada-sukhdani-biharini-rani-shri-bhagwat-rasik\",\"slug\":\"adbhut-ras-ki-khani-sada-sukhadani-biharini-rani\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"lang\":\"hi\",\"children\":[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"

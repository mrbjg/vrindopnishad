\\"मुख्यपृष्ठ\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"संत\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/saints\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"जगद्गुरु श्री कृपालु  महाराज, प्रेम रस मदिरा, निकुंज माधुरी (17)\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/saints/jagadguru-shri-kripalu-maharaj-prem-ras-madira-nikunj-madhuri-17\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-4xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/hi/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"संत\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"जगद्गुरु श्री कृपालु  महाराज, प्रेम रस मदिरा, निकुंज माधुरी (17)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"जगद्गुरु श्री कृपालु  महाराज, प्रेम रस मदिरा, निकुंज माधुरी (17)\",\"hinglishName\":\"jagadguru shri kripalu maharaj, prem ras madira, nikunj madhuri (17)\",\"slug\":\"jagadguru-shri-kripalu-maharaj-prem-ras-madira-nikunj-madhuri-17\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-166\",\"title\":\"बलि जाउँ निकुंज लतान की\",\"category\":\"Shloka\",\"sanskrit_text\":\"बलि जाउँ निकुंज लतान की |\",\"hindi_text\":\"भावार्थ – मैं विविध प्रकार की लताओं के कुंजों की बार–बार बलैया लेता हूँ | मैं वृक्षों में लिपटी हुई लता एवं लताओं में फूले हुए विविध प्रकार के फूल तथा फूलों पर मँडराते हुए भौंरों के झुण्ड़ों की बार – बार बलैया लेता हूँ | मृगों के नेत्रों के समान चंचल तरंगों से युक्त मृगनयनी वृषभानुनन्दिनी की बार – बार बलैया लेता हूँ | लोकातीत प्रेम की अन्तरंग लीलाओं के माधुर्य में उन्मत्त रसिक – शिरोमणि श्यामसुन्दर की बलैया लेता हूँ | अंधकार में भी विविध प्रकार की मणियों से जटित गहनों के प्रकाश की बिजली के समान चमक की बार – बाए बलैया लेती हूँ | ‘श्री कृपालु जी’ कहते हैं कि प्रेम के अमृत के रस की सार – स्वरूपा प्रिया – प्रियतम की अनोखी जोड़ी को देखते हुए बार – बार बलिहार जाता हूँ |\",\"english_text\":null,\"english_translation\":\"I sacrifice myself on the beautiful Bowers of Nikunja of Vrindavan that are covered with different types of creepers. I offer myself again and on those vines, and on the swarms of black bees flying around, humming on those flowers. I sacrifice myself on Vrishbhanu Nandini Shri Radha, whose eyes are as beautiful and full of the waves of playfulness as those of a deer. I sacrifice myself on the crest-jewel of Rasiks, Shyamasundara, who is intoxicated with the sweetness of the intimate 'Keli Leelas' of love that is absolutely divine and beyond the world. I offer myself again and again at the effulgence of Radha Krishn's ornaments, studded with different types of gems and precious stones which shine even in the darkness like a flash of lightning. Jagadguru Shri Kripalu Ji says I sacrifice myself repeatedly on the unique pair of beloved Radha and Krishn, made of the essence of the nectar of divine love.\",\"description\":\"https://www.brajrasik.org/hi/articles/59b6f47959e8c72a534d85bb/bali-jaun-nikunj-latan-ki-pad-by-jagadguru-shri-kripalu-ji-maharaj-nikunj-madhuri-prem-ras-madira\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा, निकुंज माधुरी (17)\",\"status\":\"published\",\"content_text\":\"बलि जाउँ निकुंज लतान की |\\nअलि कुल  संकुल विपुल सुफूलनि, लतनि तरुनि लिपटान की |\\nनैन  कुरंग तरंग तरंगिणि, कुँवरि भूप वृषभान की |\\nरति रस सरस केलि रस लंपट, सुंदर श्याम सुजान की |\\nमणि गण किरण कदंबनि भूषण, दामिनि दुति उनमान की |\\nलखत ‘कृपालु’ अनूपम जोरी, प्रेम सुधा रस खान की ||\\n- जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा, निकुंज माधुरी (17)\\nभावार्थ – मैं विविध प्रकार की लताओं के कुंजों की बार–बार बलैया लेता हूँ | मैं वृक्षों में लिपटी हुई लता एवं लताओं में फूले हुए विविध प्रकार के फूल तथा फूलों पर मँडराते हुए भौंरों के झुण्ड़ों की बार – बार बलैया लेता हूँ | मृगों के नेत्रों के समान चंचल तरंगों से युक्त मृगनयनी वृषभानुनन्दिनी की बार – बार बलैया लेता हूँ | लोकातीत प्रेम की अन्तरंग लीलाओं के माधुर्य में उन्मत्त रसिक – शिरोमणि श्यामसुन्दर की बलैया लेता हूँ | अंधकार में भी विविध प्रकार की मणियों से जटित गहनों के प्रकाश की बिजली के समान चमक की बार – बाए बलैया लेती हूँ | ‘श्री कृपालु जी’ कहते हैं कि प्रेम के अमृत के रस की सार – स्वरूपा प्रिया – प्रियतम की अनोखी जोड़ी को देखते हुए बार – बार बलिहार जाता हूँ |\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59b6f47959e8c72a534d85bb/bali-jaun-nikunj-latan-ki-pad-by-jagadguru-shri-kripalu-ji-maharaj-nikunj-madhuri-prem-ras-madira\",\"slug\":\"bali-jaun-nikunj-latan-ki\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"lang\":\"hi\",\"children\":[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\"],\"erro

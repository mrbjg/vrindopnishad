 थे, इतने में राधा रानी अपनी सखीयाँ सहित आ गयी, वो यह नाम सुनकर आचम्भित हुई और ललिता सखी को पूछने लगी, यह कौन है जो मेरा नाम इतनी करुण क्रंदन युक्त ले रहा है।\nसखी उनको समझाने लगी, हे राधा रानी, यह आपको नहीं बुला रहा है, ये अपनी पत्नी किशोरी की मृत्यु से बेचैन है। अकारण करुण श्री राधा प्यारी बोली, हे सखी! यह गहवर वन में ये मेरा ही नाम ले रहा है। उसको मेरे पास बुलाओ। राधा रानी ने उन पर कृपा दृष्टि डाल उनपर कृपा कर दी। यह दिव्य लीला उस सज्जन के साथ ही हुई। और इस लीला को देखते देखते वो मूर्छित हो गए । इसके बाद वो \"किशोरी अली\" नाम से राधा रानी के भक्त बन गए । राधा रानी की अपार कृपा और प्रेम पाकर वो दिव्य शरीर प्राप्त किये और दिव्य लीला में प्रवेश किए । वे गहवर वन में वास किए। किशोरी अली जी की समाधि श्रीकृष्ण कुण्ड [श्री राधा सरोवर]के पास लता- पत्तों के बीच स्थित है । यह भक्तों के लिए एक प्रेरणास्रोत है।\nश्री किशोरी अलि जी का एक प्रसिद्ध पद जिन्हें ब्रज में सभी गाते हैं वह इस प्रकार है:\nआधौ नाम तारिहै राधा |\n'रा' के कहत रोग सब मिटिहैं, 'धा' के कहत मिटै सब बाधा ||\nराधा राधा नाम की महिमा, गावत वेद पुराण अगाधा |\nअलि किशोरी रटौ निरंतर, वेगहि लग जाय भाव समाधा ||\n- श्री अली किशोरी\nराधा नाम का अर्धांश अर्थात 'रा' का रूपध्यान युक्त उच्चारण करते समस्त मानस रोग मिट जाते हैं, ‘धा' कहते ही जीव की समस्त बाधाएं मिट जाती हैं। वेदो और पुरानो में राधा नाम का ही महिमा मंडन है किन्तु वो भी 'नेती नेती' कहकर हार मान जाते है। रसिक संत अलि किशोरी जी कहते हैं राधा नाम का रूप ध्यान युक्त निरंतर रटन करने से जल्द ही भाव समाधि में प्रवेश मिल जाता है।"])</script><script>self.__next_f.push([1,"b:[\"slug\",\"shri-ali-kishori\",\"d\"]\n10:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"saints\",\"shri-ali-kishori\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shri-ali-kishori\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"shri-ali-kishori\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children e\":\"shri ali kishori\",\"slug\":\"shri-ali-kishori\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-16\",\"title\":\"आधौ नाम तारिहै राधा\",\"category\":\"Shloka\",\"sanskrit_text\":\"आधौ नाम तारिहै राधा |'रा' के कहत रोग सब मिटिहैं, 'धा' के कहत मिटै सब बाधा ||राधा राधा नाम की महिमा, गावत वेद पुराण अगाधा |अलि किशोरी रटौ निरंतर, वेगहि लग जाय भाव समाधा ||\",\"hindi_text\":\"राधा नाम का अर्धांश अर्थात 'रा' का रूपध्यान युक्त उच्चारण करते समस्त मानस रोग मिट जाते हैं, ‘धा' कहते ही जीव की समस्त बाधाएं मिट जाती हैं। वेदो और पुरानो में राधा नाम का ही महिमा मंडन है किन्तु वो भी 'नेती नेती' कहकर हार मान जाते है। रसिक संत अलि किशोरी जी कहते हैं राधा नाम का रूप ध्यान युक्त निरंतर रटन करने से जल्द ही भाव समाधि में प्रवेश मिल जाता है।\",\"english_text\":null,\"english_translation\":\"Only half of the name Radha is sufficient to cross the bondage of maya. Simply by vibrating the sound ‘Ra’, to which if we recite, then all of the mental illnesses get cured, while reciting 'dha', all of the impediments get perished.\\nThe glories of Radha's name have been ornamented in Scriptures, however, all these scriptures also bow down saying 'non-ending non-ending ' the Radha-name. Rasik Saint Ali Kishori says, reciting Radha-name while doing the remembrance of Radha, one can very easily enter into an evolved stage of divine consciousness.\",\"description\":\"https://www.brajrasik.org/hi/articles/5919d61411ec2c04484ec009/aadhau-naam-taarihai-radha-pad-written-by-shri-ali-kishori\",\"author\":\"श्री अली किशोरी\",\"status\":\"published\",\"content_text\":\"आधौ नाम तारिहै राधा |\\n'रा' के कहत रोग सब मिटिहैं, 'धा' के कहत मिटै सब बाधा ||\\nराधा राधा नाम की महिमा, गावत वेद पुराण अगाधा |\\nअलि किशोरी रटौ निरंतर, वेगहि लग जाय भाव समाधा ||\\n- श्री अली किशोरी\\nराधा नाम का अर्धांश अर्थात 'रा' का रूपध्यान युक्त उच्चारण करते समस्त मानस रोग मिट जाते हैं, ‘धा' कहते ही जीव की समस्त बाधाएं मिट जाती हैं। वेदो और पुरानो में राधा नाम का ही महिमा मंडन है किन्तु वो भी 'नेती नेती' कहकर हार मान जाते है। रसिक संत अलि किशोरी जी कहते हैं राधा नाम का रूप ध्यान युक्त निरंतर रटन करने से जल्द ही भाव समाधि में प्रवेश मिल जाता है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5919d61411ec2c04484ec009/aadhau-naam-taarihai-radha-pad-written-by-shri-ali-kishori\",\"slug\":\"adhau-nam-tarihai-radha\"},{\"id\":\"local-197\",\"title\":\"हम श्री राधा महारानी जू के बल अभिमानी\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ हम श्री राधा महारानी जू के बल अभिमानी,किशोरी अली निवास हमारो, श्री वृन्दावन रजधानी || ”\",\"hindi_text\":\"हम सदा ही श्री किशोरी जी के बल के अभिमानी हैं। हमारा मन सदैव प्रिय प्रियतम के निज महल वृन्दावन में रहता है, जो कि रसिक संतों और युगल सरकार की राजधानी है।\",\"english_text\":null,\"english_translation\":\"Our only strength is Shri Radha and we are proud of it. We eternally dwell in Vrindavan which is the capital city of Rasik Saints and the Divine Couple.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a4ecfd859e8c72a534d86d3/hum-shri-radha-maharani-ju-ke-bal-abhimani-kishori-ali-nivaas-humaro-shri-vrindavan-rajdhani-shri-kishori-ali\",\"author\":\"श्री अली किशोरी\",\"status\":\"published\",\"content_text\":\"“ हम श्री राधा महारानी जू के बल अभिमानी,\\nकिशोरी अली निवास हमारो, श्री वृन्दावन रजधानी || ”\\n- श्री अली किशोरी\\nहम सदा ही श्री किशोरी जी के बल के अभिमानी हैं। हमारा मन सदैव प्रिय प्रियतम के निज महल वृन्दावन में रहता है, जो कि रसिक संतों और युगल सरकार की राजधानी है।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5a4ecfd859e8c72a534d86d3/hum-shri-radha-maharani-ju-ke-bal-abhimani-kishori-ali-nivaas-humaro-shri-vrindavan-rajdhani-shri-kishori-ali\",\"slug\":\"ham-shri-radha-maharani-ju-ke-bal-abhimani\"},{\"id\":\"local-264\",\"title\":\"श्री किशोरी अली जी की जीवनी : ब्रज के रसिक संत\",\"category\":\"Katha\",\"sanskrit_text\":\"आधौ नाम तारिहै राधा |'रा' के कहत रोग सब मिटिहैं, 'धा' के कहत मिटै सब बाधा ||राधा राधा नाम की महिमा, गावत वेद पुराण अगाधा |अलि किशोरी रटौ निरंतर, वेगहि लग जाय भाव समाधा ||\",\"hindi_text\":\"राधा नाम का अर्धांश अर्थात 'रा' का रूपध्यान युक्त उच्चारण करते समस्त मानस रोग मिट जाते हैं, ‘धा' कहते ही जीव की समस्त बाधाएं मिट जाती हैं। वेदो और पुरानो में राधा नाम का ही महिमा मंडन है किन्तु वो भी 'नेती नेती' कहकर हार मान जाते है। रसिक संत अलि किशोरी जी कहते हैं राधा नाम का रूप ध्यान युक्त निरंतर रटन करने से जल्द ही भाव समाधि में प्रवेश मिल जाता है।\",\"english_text\":null,\"english_translation\":\"Only half of the name Radha is sufficient to cross the bondage of maya. Simply by vibrating the sound ‘Ra’, to which if we recite, then all of the mental illnesses get cured, while reciting 'dha', all of the impediments get perished.\\nThe glories of Radha's name have been ornamented in Scriptures, however, all these scriptures also bow down saying 'non-ending non-ending ' the Radha-name. Rasik Saint Ali Kishori says, reciting Radha-name while doing the remembrance of Radha, one can very easily enter into an evolved stage of divine consciousness.\",\"description\":\"https://www.brajrasik.org/hi/articles/59398ed28c96df553692f9d0/shri-kishori-ali-rasik-saint-of-braj\",\"author\":\"श्री अली किशोरी\",\"status\":\"published\",\"content_text\":\"$9\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/59398ed28c96df553692f9d0/shri-kishori-ali-rasik-saint-of-braj\",\"slug\":\"shri-kishori-ali-ji-ki-jivani-braj-ke-rasik-snta\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$La\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\",\"$b\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lc\",null,{}],\"templateSty

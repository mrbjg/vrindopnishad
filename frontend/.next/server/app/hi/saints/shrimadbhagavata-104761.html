 भी होने का सौभाग्य प्राप्त करूँ क्योंकि गोपियाँ उन्हें अपने चरणों से रौंदती हैं और अपने चरणकमलों की धूल से उन्हें आशीर्वाद देती हैं ।\"\nस्कन्दपुराण के श्रीमद्भागवत-माहात्म्य प्रसंग में इसका बड़ा ही रोचक वर्णन है। वज्रनाभ महाराज ने शाण्डिल्य आदि ऋषियों के आनुगत्य में यहाँ उद्धव कुण्ड का प्रकाश किया । उद्धव जी यहाँ पास में ही गोपियों की चरण धूलि में अभिषिक्त होने के लिए तृण-गुल्म के रूप में सदैव निवास करते हैं । श्रीकृष्ण की लीला अप्रकट होने पर  कृष्ण की द्वारका वाली पटरानियाँ बड़ी दुःखी थीं । एक बार वज्रनाभजी उनको साथ लेकर यहाँ उपस्थित हुए । बड़े जोरों से संकीर्तन आरम्भ हुआ । देखते-देखते उस महासंकीर्तन में कृष्ण के सभी परिकर क्रमशः आविर्भूत होने लगे । अर्जुन मृदंग वादन करते हुए नृत्य करने लगे । इस प्रकार द्वारका के सभी परिकर उस संकीर्तन मण्डल में नृत्य और कीर्तन करने लगे । हठात् महाभागवत उद्धव भी वहाँ के तृण-गुल्म से आविर्भूत होकर नृत्य में विभोर हो गये । फिर भला कृष्ण ही कैसे रह सकते थे? श्रीमती राधिका आदि सखियों के साथ वे भी उस महासंकीर्तन रास में आविर्भूत हो गये । थोड़ी देर के बाद ही वे अंतर्ध्यान हो गये । इस प्रकार उद्धव जी ने द्वारका की महिषियों को इस स्थान पर सांत्वना दी थी ।\nस्थान :\nकुसुम सरोवर, गोवर्धन के ठीक पश्चिम में परिक्रमा मार्ग पर दाहिनी ओर उद्धव कुण्ड स्थित है ।"])</script><script>self.__next_f.push([1,"a:T55d,\"Oh, let me be fortunate enough to be one of the bushes, creepers, or herbs in Vrindavan, because the gopis trample them and bless them with the dust of their lotus feet.\"\nUddhava-Kunda\nis situated exactly west of Kusum-sarovar on the right side of the parikrama path in Goverdhan. Vajranabha Maharaja manifested Uddhava-Kunda under the guidance of Sandilya and other sages. Uddhav Ji always resides near by here as grass and shrubs in order to be sprinkled by the foot-dust of the gopis. The Shrimad Bhagwatam Mahatma of the Skanda Purana gives an interesting description of this place.\nAfter the disappearance of Shri Krishn, His queens in Dvaraka were greatly afflicted by sorrow. Once, Vajrnabh came here with them and they loudly performed sankirtan. In that great sankirtan, all the associates of Krishna started to appear one by one. The associates of Dwarika all sang and danced, and Arjuna began to dance and play mridanga. Suddenly, that exalted soul, Shri Uddhava emerged from the grass and shrubs, and he also became immersed in dancing in that maha-sankirtan. How could Krishna not come there? Finally, He also appeared in that maha-sankirtan ras, along with Shri Radhika and the other sakhis and, after some time, disappeared again. In this way, Uddhava pacified the queens at this place.\nLocation\n:\nUddhav Kunda is Located at Goverdhan near to Kusum Sarovar.b:T1494,"])</script><script>self.__next_f.push([1,"कुसुम सरोवर तक का स्थल उद्धव जी का स्थल कहा जाता है । कुसुम सरोवर के इस पार और उस पार दोनों ओर उद्धव जी का मंदिर है । समीप ही है – उद्धव कुण्ड ।\nउद्धव जी एक दिन के लिए ब्रज मे आए थे की गोपियों को उद्बोधित कर लौट जायेंगे किन्तु ब्रज का स्वरुप एवं गोपियों के ह्रदय का दिव्य प्रेम तथा श्री राधारानी के दर्शन कर वे श्री कृष्ण को भूल गए, ज्ञान का दिव्य अम्बर फट कर गुदड़ी बन गया और 6 महीने ब्रज में ही रहे । तब एक दिन श्री राधारानी ने उद्धव जी को आज्ञा की \"उद्धव ! तुम्हारे सखा तुम्हारी प्रतीक्षा कर रहे होंगे, तुम्हें गमन भी करना है ।\" ऐसा कह कर श्री राधारानी ने उद्धव जी को आशीष प्रदान किया । श्री राधारानी की आज्ञा से न चाहते हुए भी उद्धव जी ने प्रणाम कर प्रस्थान किया । लौटते समय उद्धव जी ने कामना की -\nआसामहो चरणरेणुजुषामहं स्यां वृन्दावने किमपि गुल्मलतौषधीनां ॥\n- श्रीमद्भागवत  (10.47.61)\n\"ओह! मैं वृन्दावन की इन झाडिय़ों, लताओं तथा जड़ी-बूटियों में से कोई एक भी होने का सौभाग्य प्राप्त करूँ क्योंकि गोपियाँ उन्हें अपने चरणों से रौंदती हैं और अपने चरणकमलों की धूल से उन्हें आशीर्वाद देती हैं ।\"\nस्कन्दपुराण के श्रीमद्भागवत-माहात्म्य प्रसंग में इसका बड़ा ही रोचक वर्णन है। वज्रनाभ महाराज ने शाण्डिल्य आदि ऋषियों के आनुगत्य में यहाँ उद्धव कुण्ड का प्रकाश किया । उद्धव जी यहाँ पास में ही गोपियों की चरण धूलि में अभिषिक्त होने के लिए तृण-गुल्म के रूप में सदैव निवास करते हैं । श्रीकृष्ण की लीला अप्रकट होने पर  कृष्ण की

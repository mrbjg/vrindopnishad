riye.\nSahaj Maadhuri Ang Ang Ki Kahi Kaasaun Patatariye.\"\nThe intellects of all the poet-saints of Heaven, earth, other planetary systems get frightened to hear the glory of Shri Radha’s divinity. They fear in thinking that how can they justify her divinity or how can they give a compliment on Shri Radha’s divinity (which is is unparalleled in the entire universe). Shri Hita Harivansh Mahaprabhu says, in description of which the whole poet’s and Rasik's mind is blurred, then to whom how can I express the magnanimous of the beauty)\n\"(Jai Shri) Hit Harivansh Prataap Roop Gun Vay Bal Syaam Ujagar.\nJaaki Bhroo Vilaas Bas Pasuriv Din Vithakat Ras Saagar.\"\nFinally, Shri Hita Harivansh Mahaprabhu descension of Shri Krishn’s Murali says, Lord Krishna who is known to be all-powerful in all respects (i.e. splendor, beauty, virtues, age, strength) and Even Lord Krishna Himself constantly observes the mood of Shri Radha Rani through the movement of her eyebrows like a helpless cattle.\n- Shri Hita Harivansh Mahaprabhu, Hit Chaurasi (52)b:Tf38,"])</script><script>self.__next_f.push([1,"(राग मल्हार) [वर्षा समय]\nदेखौ माई सुंदरता की सीवाँ।\nव्रज नव तरुनि कदंब नागरी, निरखि करतिं अधग्रीवाँ।।\nजो कोउ कोटि कलप लगि जीवे रसना कोटिक पावै।\nतऊ रुचिर वदनारबिंद की सोभा कहत न आवै।।\nदेव लोक भूलोक रसातल सुनि कवि कुल मति डरिये।\nसहज माधुरी अंग अंग की कहि कासौं पटतरिये।।\n(जै श्री) हित हरिवंश प्रताप रूप गुन वय बल स्याम उजागर।\nजाकी भ्रू विलास बस पसुरिव दिन विथकत रस सागर\n- हित हरिवंश महाप्रभु, हित चौरासी (52)\nभावार्थ- श्रीहित सखी (श्री हित हरिवंश महाप्रभु) कहती हैं- हे सखियों ! सुन्दरता की सीमा (श्रीराधा) को तो देखो !जिस नागरी को देख कर समस्त व्रज की नव युवती गण (उसकी सौंदर्य राशि के सामने लज्जावश अपना) सिर झुका लेती हैं अर्थात् उनके रूप के सामने अपने रूप की लघुता स्वीकार करके सिर नीचा कर लेती हैं लजाकर । उन अपार श्रीप्रिया रूप की शोभा का वर्णन करने के लिये यदि कोई कोटि कोटि कल्पों तक जीवित रहकर कोटि कोटि जिह्वायें प्राप्त कर भी ले तो भी उस रुचि पूर्ण मुख कमल की शोभा का वर्णन वह नहीं क

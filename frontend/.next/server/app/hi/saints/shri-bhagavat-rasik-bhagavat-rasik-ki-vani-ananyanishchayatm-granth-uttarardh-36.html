ni.  [2]\nTritiya Kare Guru Samujhi, Daksh Sarvagya Raseelo. [3]\nChauthey Hoi Virakt, Base Vanraaj Jasilo. [4]\nPaanche Bhuley Deh Sudh, Chathe Bhavna Raas Ki. [5]\nSaate Pavein Reeti Ras, Shri Swami Haridas Ki. [6]\n- Shri Bhagwat Rasik, Bhagwat Rasik Ki Vaani, AnanyaNishchayatma Granth - Uttarardh (36)\nFirst, listen to Sri Bhagwat Katha,\u0026 Sri Bhagwat Gita, and scriptures from a pure devotee. [1]\nSecond, practice the Navdha bhakti as stated by Sri Vyas Ji. [2]\nThird, surrender unto the lotus feet of a Rasik Guru (Master). [3]\nFourth, renounce worldly pleasure and develop a longing to live in the holy land of Vrindavan. [4]\nFifth, one should forget the distinction between the male and female body. In the sixth stage of divine love consciousness, One becomes qualified to receive Krishn’s love as Gopis received in Maharaas Leela where Gopis received the complete love of Krishn. [5]\nAccording to the Shrimad Bhagwatam, Raas is the final stage of divine love. But Shri Bhagwad Rasik, Rasik Saint of Vrindavan says there is still, even more, higher than Maharaas which is the final stage. The top most and final destination, where one rarely gets qualified to do the personal service of Radharani at Nikunj which is Divine Vrindavan as recommended by Swami Shri Haridas. This stage is achieved by only the Rasiks who are very fortunate, that too by the special mercy of Shri Radha Rani. [6]b:Tea2,"])</script><script>self.__next_f.push([1,"(छप्पय)\nप्रथम सुने भागवत, भक्त मुख भगवत वाणी । [1]\nद्वितीय अराधे भक्ति, व्यास नव भांति बखानी ॥ [2]\nतृतीय करे गुरु समुझी, दक्ष सर्वज्ञ रसीलो । [3]\nचौथे होई विरक्त, बसे वनराज जसि ॥ [4]\nपांचे भूले देह सुध, छठी भावना रास की । [5]\nसातै पावे रीति रस श्री स्वामी हरिदास की ॥ [6]\n- श्री भगवत रसिक, भगवत रसिक की वाणी, अनन्यनिश्चयात्म ग्रन्थ - उत्तरार्ध (36)\nसबसे पहले किसी भगवद भक्त के मुख से श्रीमद्भागवत, श्री भगवद्गीता, सत्शास्त्र आदि का श्रवण करे । [1]\nदूसरे चरण में व्यास जी द्वारा बताई गई नवधा भक्ति (श्रवणम्, कीर्तनम्, स्मरणम्, वन्दन

-cdf95064ba03b923.js\",\"2046\",\"static/chunks/2046-1af21fb14bbb5d36.js\",\"3185\",\"static/chunks/app/layout-2163618386e90fe6.js\"],\"ClientPr"])</script><script>self.__next_f.push([1,"oviders\"]\n10:I[1060,[],\"\"]\n9:T434,Meaning - Our Kishori Ji is completely drenched in the bliss of love. She is beautifying the throne of gold, studded with gems and is putting even personified adornment to shame by the sweetness of Her beauty. She is wearing a crescent-shaped ornament on the crown of gold, studded with gems. Her bashful eyes are naturally of the colour of collyrium and embarrass even lotuses. The nose-ring and the besara in the nose are swinging and jolting Absolutely indescribable is the beauty of the pearl chain extending from the nose-ring up to the ear. Jewelled and flower shaped earrings made of gold are graced in Her ears and the necklaces of gems and pearls are prettified on Her chest Her head is covered with a blue coloured chunari and Her blouse and lehenga are blue as well. The gem-studded kankanas, bracelets and bangles around Her wrists are looking extremely charming and absolutely captivating is the henna on Her hands. Jagadguru Shri Kripalu Ji says that Kishori Ji's lotus-feet are looking ineffably beautiful with red mihura, jingling anklets and taking toe rings.a:Td1a,"])</script><script>self.__next_f.push([1,"प्रेम-रस-बोरी भानुदुलार।\nरतन जटित सिंहासन राजति, लाजत लखि श्रृंगार।\nमणिन-जटित सिर कनक-मुकुट पर, चारू चंद्रिका धार।\nलोचन सलज सहज कजरारे, जलज लजावन हार।\nझुकि झुकि परत नाक नथ-बेसर, उर मोतिन रिझवार।\nकानन करणफूल मणि मंडित, उर मुक्तन-मणि हार।\nचुनरी नील नील पट कंचुकि, लहँगा नील निहार।\nकर करपत्र चुरी मणि-कंकण, मेंहँदी अरूण सँवार।\nपग जावक 'कृपालु' भल पायल, बिछुवनि छवि छविदार।।\n- जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा, श्रीराधा माधुरी (25)\nभावार्थ :--\nहमारी किशोरी जी प्रेम-रस में सराबोर हैं। जड़े हुए रत्नों से युक्त सिंहासन पर सुशोभित हैं एवं उनकी रूप-माधुरी को देखकर मूर्तिमान श्रृंगार भी लज्जित होता है। मणिमंडित स्वर्ण मुकुट पर चन्द्रिका धारण किये हुए हैं।\nलज्जा से युक्त नेत्र स्वाभावतः कजरारे हैं एवं कमल को भी लज्जित करने वाले हैं। नासिका में सुशोभित नथ और बेसर झूम-झूम कर झोंके खा रही हैं।\nकान पर्यन्त मोतियों की लड़ का तो कहना ही क्या है। कान में मणियों से जड़े हुए स्वर्ण के कर्णफूल झूल रहे हैं। एंव वक्षःस्थल पर मोतियों तथा मणियों के हार अलंकृत हैं।\nनीले रंग की चुनरी ओढ़े हुए हैं, नीले रंग की ही अंगिया पहने ह्रै एवं नीले रंग का ही लहंगा धारण किये हैं।\nहाथों में मणियों के कंकण, करपत्र एवं चूड़ियाँ सुशोभित हैं तथा मेहँदी की रचना तो अत्यन्त ही आकर्षक है। 'श्री कृपालु जी' कहते हैं, चरण-कमलों में लाल मिहावर शोभायमान है। पायल पहने हुए हैं तथा अंगुलियों में बिछुओं की छवि तो अनिवर्चनीय ही है।"])</script><script>self.__next_f.push([1,"c:[\"slug\",\"jagadguru-shri-kripalu-maharaj-prem-ras-madira-shriradha-madhuri-25\",\"d\"]\n11:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"saints\",\"jagadguru-shri-kripalu-maharaj-prem-ras-madira-shriradha-madhuri-25\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"jagadguru-shri-kripalu-maharaj-prem-ras-madira-shriradha-madhuri-25\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"jagadguru-shri-kripalu-maharaj-prem-ras-madira-shriradha-madhuri-25\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"jagadguru-shri-kripalu-maharaj-prem-ras-madira-shriradha-madhuri-25\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"जगद्गुरु श्री कृपालु  महाराज, प्रेम रस मदिरा, श्रीराधा माधुरी (25)\\\",\\\"alternateName\\\":\\\"jagadguru shri kripalu maharaj, prem ras madira, shriradha madhuri (25)\\\",\\\"description\\\":\\\"ब्रज परंप raphy\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-237\",\"title\":\"प्रेम\",\"category\":\"Shloka\",\"sanskrit_text\":\"प्रेम-रस-बोरी भानुदुलार।रतन जटित सिंहासन राजति, लाजत लखि श्रृंगार।मणिन-जटित सिर कनक-मुकुट पर, चारू चंद्रिका धार।लोचन सलज सहज कजरारे, जलज लजावन हार।झुकि झुकि परत नाक नथ-बेसर, उर मोतिन रिझवार।कानन करणफूल मणि मंडित, उर मुक्तन-मणि हार।चुनरी नील नील पट कंचुकि, लहँगा नील निहार।कर करपत्र चुरी मणि-कंकण, मेंहँदी अरूण सँवार।पग जावक 'कृपालु' भल पायल, बिछुवनि छवि छविदार।।\",\"hindi_text\":\"भावार्थ :--\\nहमारी किशोरी जी प्रेम-रस में सराबोर हैं। जड़े हुए रत्नों से युक्त सिंहासन पर सुशोभित हैं एवं उनकी रूप-माधुरी को देखकर मूर्तिमान श्रृंगार भी लज्जित होता है। मणिमंडित स्वर्ण मुकुट पर चन्द्रिका धारण किये हुए हैं।\\nलज्जा से युक्त नेत्र स्वाभावतः कजरारे हैं एवं कमल को भी लज्जित करने वाले हैं। नासिका में सुशोभित नथ और बेसर झूम-झूम कर झोंके खा रही हैं।\\nकान पर्यन्त मोतियों की लड़ का तो कहना ही क्या है। कान में मणियों से जड़े हुए स्वर्ण के कर्णफूल झूल रहे हैं। एंव वक्षःस्थल पर मोतियों तथा मणियों के हार अलंकृत हैं।\\nनीले रंग की चुनरी ओढ़े हुए हैं, नीले रंग की ही अंगिया पहने ह्रै एवं नीले रंग का ही लहंगा धारण किये हैं।\\nहाथों में मणियों के कंकण, करपत्र एवं चूड़ियाँ सुशोभित हैं तथा मेहँदी की रचना तो अत्यन्त ही आकर्षक है। 'श्री कृपालु जी' कहते हैं, चरण-कमलों में लाल मिहावर शोभायमान है। पायल पहने हुए हैं तथा अंगुलियों में बिछुओं की छवि तो अनिवर्चनीय ही है।\",\"english_text\":null,\"english_translation\":\"$9\",\"description\":\"https://www.brajrasik.org/hi/articles/5d89ad476851f9006900c896/premarasabori-bhanudulara-jagadguru-shri-kripalu-ji-maharaj-prem-ras-madira-shri-radha-madhuri-25\",\"author\":\"जगद्गुरु श्री कृपालु जी महाराज, प्रेम रस मदिरा, श्रीराधा माधुरी (25)\",\"status\":\"published\",\"content_text\":\"$a\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d89ad476851f9006900c896/premarasabori-bhanudulara-jagadguru-shri-kripalu-ji-maha

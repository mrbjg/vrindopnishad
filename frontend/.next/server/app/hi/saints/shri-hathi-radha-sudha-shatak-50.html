select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/hi/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"संत\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"श्री हठी , राधा सुधा शतक (50)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री हठी , राधा सुधा शतक (50)\",\"hinglishName\":\"shri hathi , radha sudha shatak (50)\",\"slug\":\"shri-hathi-radha-sudha-shatak-50\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-78\",\"title\":\"हीन हौं, अधीन हौं तिहारो ब्रज\",\"category\":\"Shloka\",\"sanskrit_text\":\"हीन हौं, अधीन हौं तिहारो ब्रज-साहिबनी!हिय में मलीन करुना की कोर ढरिए। [1]भारी भवसागर में बोरत बचायौ मोहिं,काम क्रोध लोभ मोह लागे सब अरिए॥ [2]बुरो-भलो, जैसो-तैसो, तेरे द्वार पर्यौ हौं तौं,मेरे गुन-औगुन तूं मन में न धरिए। [3]कीरति-किसोरी, वृषभानु की दुहाई तोंहिं,लच्छ-लच्छ भाँति सों 'हठी' को पच्छ करिए॥ [4]\",\"hindi_text\":\"हे वृंदावनेश्वरी! यद्यपि मैं अयोग्य और तुच्छ हूँ, फिर भी आपके चरणकमलों की शरण में आया हूँ। कृपया अपनी करुणामयी दृष्टि मुझ पर डालें, क्योंकि मेरा ह्रदय पापों और दोषों से भरा हुआ है। [1]\\nहे श्री राधे, मैं भवसागर में डूब रहा हूँ। कृपया मेरा हाथ पकड़कर मुझे बचा लीजिए, जिससे काम, क्रोध, लोभ, मोह आदि मुझे शत्रु प्रतीत हों और मैं जन्म-मृत्यु के बंधन से मुक्त हो जाऊँ। [2]\\nचाहे मैं अच्छा हूँ या बुरा, जैसा भी हूँ, परन्तु मैंने आपकी शरण ली है।  कृपया मेरे गुण-अवगुणों पर विचार न करें। अब मैं केवल आपका हूँ और किसी का नहीं! [3]\\nकवि श्री हठी जी ने कीर्ति दुलारी श्री राधा से प्रार्थना की है कि वे अपने पिता वृषभानु जी की शपथ लेकर सदा उनपर कृपा बनाए रखें। [4]\",\"english_text\":null,\"english_translation\":\"Oh Goddess of Braj, Although I am a sinner, I am under the refuge of your lotus feet. Please have a graceful glimpse upon me as my heart is awfully dirty. [1]\\nOh Rādhey, please hold my hand so that I may consider lust, anger, greed, attachment etc as my enemy and can be relieved from falling back into the realm of birth and death. [2]\\nWhether I am good or bad, I have taken eventual refuge at your door, Please ignore my merits and demerits. I am simply yours and yours alone! [3]\\nFinally, Śrī Hatījī asked Kīrti's daughter Śrī Rādhā to swear the oath of her father Vṛṣbhanu to make sure that She will always be on Śrī Hati's side. [4]\",\"description\":\"https://www.brajrasik.org/hi/articles/5dadf5c699ef5400603fa6b6/hin-haun-adheen-haun-tihaaro-brajsaahibani-shri-hati-ji\",\"author\":\"श्री हठी जी, राधा सुधा शतक (50)\",\"status\":\"published\",\"content_text\":\"(कवित्त)\\nहीन हौं, अधीन हौं तिहारो ब्रज-साहिबनी!\\nहिय में मलीन करुना की कोर ढरिए। [1]\\nभारी भवसागर में बोरत बचायौ मोहिं,\\nकाम क्रोध लोभ मोह लागे सब अरिए॥ [2]\\nबुरो-भलो, जैसो-तैसो, तेरे द्वार पर्यौ हौं तौं,\\nमेरे गुन-औगुन तूं मन में न धरिए। [3]\\nकीरति-किसोरी, वृषभानु की दुहाई तोंहिं,\\nलच्छ-लच्छ भाँति सों 'हठी' को पच्छ करिए॥ [4]\\n- श्री हठी जी, राधा सुधा शतक (50)\\nहे वृंदावनेश्वरी! यद्यपि मैं अयोग्य और तुच्छ हूँ, फिर भी आपके चरणकमलों की शरण में आया हूँ। कृपया अपनी करुणामयी दृष्टि मुझ पर डालें, क्योंकि मेरा ह्रदय पापों और दोषों से भरा हुआ है। [1]\\nहे श्री राधे, मैं भवसागर में डूब रहा हूँ। कृपया मेरा हाथ पकड़कर मुझे बचा लीजिए, जिससे काम, क्रोध, लोभ, मोह आदि मुझे शत्रु प्रतीत हों और मैं जन्म-मृत्यु के बंधन से मुक्त हो जाऊँ। [2]\\nचाहे मैं अच्छा हूँ या बुरा, जैसा भी हूँ, परन्तु मैंने आपकी शरण ली है।  कृपया मेरे गुण-अवगुणों पर विचार न करें। अब मैं केवल आपका हूँ और किसी का नहीं! [3]\\nकवि श्री हठी जी ने कीर्ति दुलारी श्री राधा से प्रार्थना की है कि वे अपने पिता वृषभानु जी की शपथ लेकर सदा उनपर कृपा बनाए रखें। [4]\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5dadf5c699ef5400603fa6

ि वृषभानु किसोरी।\nसुनि दूतिका चपल मृगनैंनी, आकरषत चितवत चित गोरी।।\nश्रीफ़ल उरज कंचन सी देही, कटि केहरि गुन सिंधु झकोरी।\nबैंनी भुजंग चंद्र सत वदनी, कदलि जंघ जलचर गति चोरी।।\nसुनि ‘हरिवंश’ आजु रजनी मुख , बन मिलाइ मेरी निज जोरी।\nयद्पि मान समेत भामिनी , सुनि कत रहत भली जिय भोरी।।\nश्री हरिवंश महाप्रभु - हित चतुरासी (43)\nभावार्थ - (श्रीलालजी ने कहा-) हे दूतिके !सुन; वृषभानु किशोरी अत्यन्त चतुर है, जब वह चपल मृगलोचनि गोरी अपने मनोहर नेत्रों से अवलोकन करती है तो मानो उसी क्षण-देखते ही चित्त का आकर्षण कर लेती है। उस नागरी की देह प्रभा स्वर्ण की सी है तथा ह्रदय देश है श्रीफल (नारियल) के भाँति । कटि प्रदेश सिंह जैसी है और (उसमें इतने गुण हैं) मानो वह गुण रूप समुद्र में अच्छी तरह सराबोर की हुई है। उस शत शत चन्द्र जैसे मुखमयी-शत मयङ्क मुखी वेणी क्या है, मानो भुजंग ! (चिकनी-चिकनी) कदली जैसे ऊरु प्रदेश हैं और चरणों में ऐसी गति है मानो उसने जलचर-हंस की चाल ही छीन ली है।\" हे हरिवंश दूतिके ! (ध्यान पूर्वक) सुन ! आज संध्या समय मेरी अपनी जोड़ी (अत्यन्त अन्तर प्रिया आत्म स्वरूपा श्रीराधा) को वन में अवश्य ही मिला । यद्यपि यह भामिनि मानवती है फिर भी वह अपने स्वभाव से भली और भोली है । (तेरे द्वारा मेरा निवेदन) सुन कर भी भला वह वहाँ कैसे बैठी रह सकती है ? अवश्य आ मिलेगी ।”"])</script><script>self.__next_f.push([1,"a:T458,Shri Krishn says to Hita Sajani - O messenger listen! Fair complexioned Shri Radha is very wise. When she looks at me with her 'Mrignani' eyes (resembles that of a deer) then, after seeing the same moment, she steals my heart! Fair complexion of her body shines like Gold, and her breasts are like the fruit of the wood apple's tree. The waist of her resembles like an elegant lion, which has got innumerable qualities that seems like it is completely immersed in an ocean of unlimited qualities. The black lavish long hair resembles like a serpent on her beautiful face (which surpass even the combined beauty of crores of moons). Her thighs are like tender banana-leaves. She walks in such an intoxicated manner as to put even a swan to shame. Shri Krishn says to Shri Hita Ha

x-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/hi/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"संत\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"श्री ध्रुवदास , भजन शत लीला (103)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री ध्रुवदास , भजन शत लीला (103)\",\"hinglishName\":\"shri dhruvadas , bhajan shat lila (103)\",\"slug\":\"shri-dhruvadas-bhajan-shat-lila-103\",\"biography\":\"\",\"metadata\":{\"lineageEn\":\"Radhavallabh Sampradaya\",\"lineageHi\":\"राधावल्लभ संप्रदाय\",\"timelineEn\":\"17th Century AD\",\"timelineHi\":\"17वीं शताब्दी\",\"associatedPlacesEn\":\"Vrindavan\",\"associatedPlacesHi\":\"वृंदावन\",\"discipleOfEn\":\"Shri Hit Harilal Ji (disciplic lineage of Shri Hit Harivansh)\",\"discipleOfHi\":\"श्री हित हरिलाल जी (श्री हित हरिवंश महाप्रभु की शिष्य परंपरा)\",\"influencedByEn\":\"Shri Hit Harivansh Mahaprabhu\",\"influencedByHi\":\"श्री हित हरिवंश महाप्रभु\",\"associatedSampradayaEn\":\"Radhavallabh Sampradaya\",\"associatedSampradayaHi\":\"राधावल्लभ संप्रदाय\",\"devotionalMoodEn\":\"Manjari Bhava, Sahachari Bhava\",\"devotionalMoodHi\":\"मंजरी भाव, सहचरी भाव\",\"teachingsEn\":\"Detailed categorization of the levels of devotion (Bhakti), descriptions of the beauty of Srimati Radharani, and instructions on how to meditate on the pastimes of the Nikunj.\",\"teachingsHi\":\"भक्ति के विभिन्न चरणों का वर्गीकरण, श्री राधारानी के नख-शिख सौंदर्य का वर्णन और निकुंज लीलाओं के ध्यान की क्रमिक विधि का प्रतिपादन।\",\"literaryStyleEn\":\"Author of the monumental Bayalees Leela (बयालीस लीला), written in structured, elegant Braj Bhasha poetry. His style is highly descriptive, analytical, and serving as a study guide for sadhakas.\",\"literaryStyleHi\":\"महान ग्रंथ 'बयालीस लीला' के रचयिता, जो सरल, सुबोध और शास्त्रीय ब्रजभाषा काव्य में रचित है। उनका लेखन विश्लेषणात्मक है जो साधकों को ध्यान की गहराइयों में ले जाता है।\",\"biographyEn\":\"Shri Dhruvdas was a stellar saint and one of the most prolific writers in the history of the Radhavallabh Sampradaya. Living in the 17th century, he took it upon himself to systematically record and explain the esoteric teachings of the earlier rasik acharyas. His life was spent in quiet meditation and literary composition in the groves of Vrindavan. His masterpiece, the \\\"Bayalees Leela\\\" (Forty-Two Lilas), is a collection of 42 separate tracts covering theological concepts, meditation guidelines, descriptions of Vrindavan forest, and intimate love pastimes of the Divine Couple. His works remain the most accessed manuals for studying the philosophy of Braj Ras.\",\"biographyHi\":\"श्री ध्रुवदास राधावल्लभ संप्रदाय के सर्वाधिक रचनाकार संतों में से एक हैं। उन्होंने पूर्ववर्ती आचार्यों के सिद्धांतों को साधकों के लिए सुलभ बनाने हेतु 'बयालीस लीला' ग्रंथ की रचना की। ध्रुवदास जी ने शांत स्वभाव से वृंदावन के कुंजों में रहकर केवल लेखन और स्मरण किया। उनके ग्रंथों में भक्ति के सैद्धांतिक पक्ष और निकुंज लीला के व्यावहारिक अनुभव का ऐसा संगम है जो अन्यत्र मिलना दुर्लभ है।\",\"relatedSaints\":[{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"},{\"nameEn\":\"Shri Premanand Ji Maharaj\",\"nameHi\":\"श्री प्रेमानंद जी महाराज\",\"slug\":\"premanand-ji-maharaj\"}],\"relatedGranthas\":[{\"nameEn\":\"Bayalees Leela\",\"nameHi\":\"बयालीस लीला\",\"slug\":\"bayalees-leela\"}],\"associatedGlossary\":[{\"termEn\":\"Manjari Bhava\",\"termHi\":\"मंजरी भाव\",\"slug\":\"manjari-bhava\"},{\"termEn\":\"Lila\",\"termHi\":\"लीला\",\"slug\":\"lila\"},{\"termEn\":\"Seva\",\"termHi\":\"सेवा\",\"slug\":\"seva\"}],\"faq\":[{\"qEn\":\"What is the Bayalees Leela?\",\"aEn\":\"The Bayalees Leela is a collection of 42 distinct poetic works composed by Dhruvdas Ji, covering everything from Vrindavan glory to details of aesthetic devotion.\",\"qHi\":\"बयालीस लीला क्या है?\",\"aHi\":\"'बयालीस लीला' श्री ध्रुवदास जी द्वारा रचित ४२ अलग-अलग लीला-काव्यों का संग्रह है, जिसमें वृंदावन धाम की महिमा से लेकर सखी भाव की साधना का सम्पूर्ण विवेचन है।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-95\",\"title\":\"वंदावन रस रीति\",\"category\":\"Shloka\",\"sanskrit_text\":\"वंदावन रस रीति, रहे विचारत चित्त ध्रुव,पुनि जैहे वय बीति, भजियै नवल-किसोर दोउ |\",\"hindi_text\":\"श्री ध्रुवदास जी कहते हैं कि उपासक, अपने मन में श्री वृन्दावन की रसमयी उपासना श्री लाडली लाल युगल स्वरूप का (नित्य ही युगल किशोर अवस्था में रहने वाले) सदा चिंतन करता रहे, क्योंकि आयु व्यतीत हुई जा रही है ! इस मधुरतम उपासना से जीव अत्यंत दुर्लभ वृन्दावन रस प्राप्त कर लेगा।\",\"english_text\":null,\"english_translation\":\"\\\"Vrindavan Ras Reeti, Rahe Vicharat Chita Dhruv,\\nPuni Jaihe Bay Beeti, Bhajiye Naval Kishor Dou\\\"\\n- Shri Dhruvdas - Bhajan Shat Leela (103)\\nChant the glories of ever young Divine Couple and remember the unique tendency of love and bliss adopted by the Rasiks of Vrindavan. Remember, by following the footsteps of Rasiks, One can obtain the ultimate bliss of Vrindavan (Vrindavan Ras), as the false body is depreciating day by day.\",\"description\":\"https://www.brajrasik.org/hi/articles/5ad387e29f7ab760360f9c2f/vrindavan-ras-reeti-bhajan-shat-quote-nby-shri-dhruv-das\",\"author\":\"श्री ध्रुवदास , भजन शत लीला (103)\",\"status\":\"published\",\"content_text\":\"वंदावन रस रीति, रहे विचारत चित्त ध्रुव,\\nपुनि जैहे वय बीति, भजियै नवल-किसोर दोउ |\\n- श्री ध्रुवदास , भजन शत लीला (103)\\nश्री ध्रुवदास जी कहते हैं कि उपासक, अपने मन में श्री वृन्दावन की रसमयी उपासना श्री लाडली लाल युगल स्वरूप का (नित्य ही युगल किशोर अवस्था में रहने वाले) सदा चिंतन करता रहे, क्योंकि आयु व्यतीत हुई जा रही है ! इस मधुरतम उपासना से जीव अत्यंत दुर्लभ वृन्दावन रस प्राप्त कर लेगा।\",\"tags\":[\"Br

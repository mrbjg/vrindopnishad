:\\\"https://path.vrindopnishad.in/hi/saints\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, साखी (67)\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/saints/shri-hariram-vyas-vishakha-avatara-vyas-vani-sakhi-67\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-4xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/hi/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"संत\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, साखी (67)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, साखी (67)\",\"hinglishName\":\"shri hariram vyas (vishakha avatara) vyas vani, sakhi (67)\",\"slug\":\"shri-hariram-vyas-vishakha-avatara-vyas-vani-sakhi-67\",\"biography\":\"\",\"metadata\":{\"lineageEn\":\"Vaishnav Rasik Tradition (Haritrayi)\",\"lineageHi\":\"वैष्णव रसिक परंपरा (हरित्रयी)\",\"timelineEn\":\"1510–1612 AD\",\"timelineHi\":\"1510–1612 ईस्वी\",\"associatedPlacesEn\":\"Vyas Ghera, Vrindavan\",\"associatedPlacesHi\":\"व्यास घेरा, वृंदावन\",\"discipleOfEn\":\"Shri Madhavdas Bhatta (disciple of Hit Harivansh)\",\"discipleOfHi\":\"श्री माधवदास भट्ट जी (हित हरिवंश महाप्रभु के शिष्य)\",\"influencedByEn\":\"Swami Haridas and Shri Hit Harivansh Mahaprabhu (forming the Haritrayi)\",\"influencedByHi\":\"स्वामी हरिदास एवं श्री हित हरिवंश महाप्रभु (हरित्रयी परंपरा)\",\"associatedSampradayaEn\":\"Radhavallabh / Haritrayi Tradition\",\"associatedSampradayaHi\":\"राधावल्लभ / हरित्रयी परंपरा\",\"devotionalMoodEn\":\"Humility, Raganuga Bhakti, Sakhi Bhava\",\"devotionalMoodHi\":\"परम विनम्रता, रागानुगा भक्ति, सखी भाव\",\"teachingsEn\":\"Emphasized pure, unadorned devotion based on absolute humility, rejection of caste pride, and criticism of ritualistic hypocrisy. Believed that only a humble heart can experience the sweet nectar of Vrindavan.\",\"teachingsHi\":\"जाति-पाति के अभिमान का त्याग, बाह्य कर्मकांडों का विरोध और परम विनम्रता पर आधारित भक्ति। उनका मानना था कि केवल अहंकार रहित हृदय ही वृंदावन रस का अधिकारी है।\",\"literaryStyleEn\":\"Author of Vyas Vani (व्यास वाणी), written in bold, direct Braj Bhasha. His verses contain both ecstatic descriptions of the Divine Couple and sharp, instructional remarks on behavior and sincerity.\",\"literaryStyleHi\":\"'Vyas Vani' के रचयिता, जो अपनी स्पष्टवादिता और ठेठ ब्रजभाषा के लिए जानी जाती है। इनके पदों में लीला रस के साथ-साथ साधकों के लिए व्यावहारिक उपदेश भी प्रचुरता में हैं।\",\"biographyEn\":\"Shri Hariram Vyas, affectionately known as Vyas Ji, was a prominent contemporary of Swami Haridas and Hit Harivansh Mahaprabhu. Together, these three saints are celebrated as the \\\"Haritrayi\\\" (spiritual triad) of Vrindavan, who established the foundations of Rasik theology. Born in Orchha, Madhya Pradesh, Hariram Vyas left his high royal position and vast scholarship to live as a humble beggar in the dust of Vrindavan. He established his ashram at Vyas Ghera and worshiped the deity of Jugal Kishor Ji. His writings are famously candid, warning devotees against spiritual vanity and urging them to seek the shelter of true saintly association (Sadhu Sanga).\",\"biographyHi\":\"श्री हरिराम व्यास (व्यास जी) वृंदावन के ऐतिहासिक त्रिमूर्ति 'हरित्रयी' के तीसरे स्तम्भ थे। वे ओरछा के एक प्रतिष्ठित विद्वान थे, परंतु सब कुछ त्यागकर वृंदावन की धूल में आ बसे। उन्होंने व्यास घेरा में रहकर युगल किशोर जी की सेवा की। व्यास जी अपनी बेबाक और स्पष्ट टिप्पणियों के लिए प्रसिद्ध थे। उन्होंने संतों के प्रति अपराध और वैष्णवों में आपसी भेद का कड़ा विरोध किया और सरल प्रेम मार्ग को ही सर्वोत्तम बताया।\",\"relatedSaints\":[{\"nameEn\":\"Swami Haridas\",\"nameHi\":\"स्वामी हरिदास\",\"slug\":\"haridas\"},{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"}],\"relatedGranthas\":[{\"nameEn\":\"Vyas Vani\",\"nameHi\":\"व्यास वाणी\",\"slug\":\"vyas-vani\"}],\"associatedGlossary\":[{\"termEn\":\"Sadhana\",\"termHi\":\"साधना\",\"slug\":\"sadhana\"},{\"termEn\":\"Saranagati\",\"termHi\":\"शरणागति\",\"slug\":\"saranagati\"},{\"termEn\":\"Braj Bhasha\",\"termHi\":\"ब्रजभाषा\",\"slug\":\"braj-bhasha\"}],\"faq\":[{\"qEn\":\"Where is Vyas Ghera located?\",\"aEn\":\"Vyas Ghera is located in Vrindavan near the Yamuna river, serving as the historical bhajan site and samadhi of Hariram Vyas Ji.\",\"qHi\":\"व्यास घेरा कहाँ स्थित है?\",\"aHi\":\"व्यास घेरा वृंदावन में यमुना नदी के समीप स्थित है, जो हरीराम व्यास जी की भजन स्थली और उनकी समाधि स्थली है।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-313\",\"title\":\"व्यास विवेकी भगत सौं दृढ़ करि कीजै प्रीति\",\"category\":\"Shloka\",\"sanskrit_text\":\"व्यास विवेकी भगत सौं दृढ़ करि कीजै प्रीति।अविवेकी कौ संग तजि, इहै भक्ति की रीति।\",\"hindi_text\":\"व्यास विवेकी भगत सौं दृढ़ करि कीजै प्रीति।\\nअविवेकी कौ संग तजि, इहै भक्ति की रीति।\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, साखी (67)\\nश्री हरिराम व्यास जी भक्ति की रीति समझते हुए कहते हैं कि यदि भक्ति में आगे बढ़ना है तो रसिक भक्त का दृढ़ता पूर्वक संग करिये और श्री राधा कृष्ण में प्रीती बढ़ाइए, और अविवेकी (जिन्हे भक्ति से कुछ लेना देना नहीं है ) एवं दुष्ट जनों का संग पूर्ण रूप से त्यागिए।\",\"english_text\":null,\"english_translation\":\"Shri Hariram Vyas says the path of devotion is very subtle, so if one wants to progress in devotion then one should do the association of Rasik saint which will help in increasing the love towards God, and at the same time, one should completely renounce the association of those who are not in favor of devotion.\",\"description\":\"https://www.brajrasik.org/hi/articles/5c097f9176381f005960ffcc/vyas-viveki-bhagat-saun-dridh-kari-keejai-preeti-shri-hariram-vyas-vyas-vani\",\"author\":\"श्री हरिराम व्यास (विशाखा अवतार)  व्यास वाणी, साखी (67)\",\"status\":\"published\",\"content_text\":\"व्यास विवेकी भगत सौं दृढ़ करि कीजै प्रीति।\\nअविवेकी कौ संग तजि, इहै भक्ति की रीति।\\n- श्री हरिराम व्यास (विशाखा अवतार) - व्यास वाणी, साखी (67)\\nश्री हरिराम व्यास जी भक्ति की रीति समझते हुए कहते हैं कि यदि भक्ति में आगे बढ़ना है तो रसिक भक्त का दृढ़ता पूर्वक संग करिये और श्री राधा कृष्ण में प्रीती बढ़ाइए, और अविवेकी (जिन्हे भक्ति से कुछ लेना देना नहीं है ) एवं दुष्ट जनों का संग पूर्ण रूप से त्यागिए।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5c097f9176381f005960ffcc/vyas-viveki-bhagat-saun-dridh-kari-keejai-preeti-shri-hariram-vyas-vyas-vani\",\"slug\":\"vyas-viveki-bhagat-saun-dri-kari-kijai-priti\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\",\"$a\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\",\"saints\",\"children\"],\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$Lb\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"notFoundStyles\":\"$undefined\"}]],null]},[[null,[\"$\",\"div\",null,{\"lang\":\"hi\",\"children\":[\"$\",\"$L9\",null,{\"parallelRouterKey\":\"children\",\"segmentPath\":[\"children\",\"hi\",\"children\"],\"error\":\"$undefined\

ext-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/hi/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"संत\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"श्री भोरी सखी, प्रेम की पीर (38)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री भोरी सखी, प्रेम की पीर (38)\",\"hinglishName\":\"shri bhori sakhi, prem ki pir (38)\",\"slug\":\"shri-bhori-sakhi-prem-ki-pir-38\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-363\",\"title\":\"सर्वोपरि म्हारी महरानी\",\"category\":\"Shloka\",\"sanskrit_text\":\"सर्वोपरि म्हारी महरानी।जीत लियौ घनश्याम लाड़ली, स्ववस एक रस दानी॥ललितादिक संग सखी सहचरी, वृंदावन रज धानी।ब्रह्मा विष्णु शंभु सनकादिक, महिमा नैकु न जानी॥वेद पुराण सबै पचि हारे, श्री हरिवंश बखानी।भोरी ओर कृपा करि हेरौ, अलबेली ठकुरानी॥\",\"hindi_text\":\"हमारी महारानी श्री राधिका रानी सर्वोपरि हैं, जिन्होंने तीनों लोकों को मोहित करने वाले श्री श्यामसुंदर को जीत लिया है और उन्हें प्रेमामृत का दान कर रहीं हैं। वह अनंत सखी सहचरियों के समूह के साथ विचरण करती हैं और उनकी राजधानी श्री धाम वृंदावन है। भगवान विष्णु, ब्रह्मा जी,भगवान शिव एवं सनकादिक भी श्री राधा रानी की महिमा को संपूर्ण रूप से नहीं जान पाए हैं और वेद पुराण कहते कहते हार गए हैं क्यूंकि उनकी निकुंज में गति नहीं है, परन्तु श्री राधा की सबसे निकटतम सहचरी श्री हरिवंश महाप्रभु (हित सजनी) ने अपनी वाणी में बखान किया है। श्री भोरी सखी कह रही हैं \\\"हे श्री अलबेली ठकुरानी जू, कृपा कर मुझे एक बार अपनी कृपा दृष्टि से निहारीये।\\\"\",\"english_text\":null,\"english_translation\":\"Our Queen Shri Radha Maharani reigns Supreme. She wins the heart of Shri Krishn and bestows him the sweetest nectar incessantly.\\nShe is surrounded and accompanied by her Sehcharis like Lalita and her capital is Vrindavan Dham.\\nThe great personalities like Lord Brahma, Vishnu, Lord Shiva, and Sankadik etc doesn't know her glory completely. Even the Vedas, Puranas doesn't have entry into her Kingdom of Nikunj, How would they know her glory?\\nShri Harivansh Mahaprabhu being her intimate sakhi of Nikunj, described her glory.\\nShri Bhori sakhi asks from the Albeli Thakurani to cast her sidelong glace of grace upon him.\",\"description\":\"https://www.brajrasik.org/hi/articles/5d8787ef6851f9006900c893/-sarvopari-mhaari-mahrani-shri-bhori-sakhi-prem-ki-peer-38\",\"author\":\"श्री भोरी सखी, प्रेम की पीर (38)\",\"status\":\"published\",\"content_text\":\"सर्वोपरि म्हारी महरानी।\\nजीत लियौ घनश्याम लाड़ली, स्ववस एक रस दानी॥\\nललितादिक संग सखी सहचरी, वृंदावन रज धानी।\\nब्रह्मा विष्णु शंभु सनकादिक, महिमा नैकु न जानी॥\\nवेद पुराण सबै पचि हारे, श्री हरिवंश बखानी।\\nभोरी ओर कृपा करि हेरौ, अलबेली ठकुरानी॥\\n- श्री भोरी सखी, प्रेम की पीर (38)\\nहमारी महारानी श्री राधिका रानी सर्वोपरि हैं, जिन्होंने तीनों लोकों को मोहित करने वाले श्री श्यामसुंदर को जीत लिया है और उन्हें प्रेमामृत का दान कर रहीं हैं। वह अनंत सखी सहचरियों के समूह के साथ विचरण करती हैं और उनकी राजधानी श्री धाम वृंदावन है। भगवान विष्णु, ब्रह्मा जी,भगवान शिव एवं सनकादिक भी श्री राधा रानी की महिमा को संपूर्ण रूप से नहीं जान पाए हैं और वेद पुराण कहते कहते हार गए हैं क्यूंकि उनकी निकुंज में गति नहीं है, परन्तु श्री राधा की सबसे निकटतम सहचरी श्री हरिवंश महाप्रभु (हित सजनी) ने अपनी वाणी में बखान किया है। श्री भोरी सखी कह रही हैं \\\"हे श्री अलबेली ठकुरानी जू, कृपा कर मुझे एक बार अपनी कृपा दृष्टि से निहारीये।\\\"\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5d8787ef6851f9006900c893/-sarvopari-mhaari-mahrani-shri-bhori-sakhi-prem-ki-peer-38\",\"slug\":\"sarvopari-mhari-maharani\"}],\"books\":[],\"rawItem\":null}}]}]],null],null],null]},[null,[\"$\",\"$L9\",null,{\"parallelRouterKe

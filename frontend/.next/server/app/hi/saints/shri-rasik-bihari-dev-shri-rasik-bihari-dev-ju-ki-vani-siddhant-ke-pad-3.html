ven Lord Brahma and Lord Shiva. [1]\nThis rare human life has been wasted innumerable times without the dust of Vrindavan (Dust of Shri Radha’s lotus feet).\nThe same dust has graced me and provided me with the topmost shelter and immense bliss.  [2]\nOne who comes to Vrindavan meets their actual relatives after a long time i.e. Shri Shyama Shyam and sakhis (their Rasik devotees). Those relatives welcome us with their open arms and Shri Hari opens his arms to embrace the soul happily.\nShri Shyama Shyam continually dwells together in the different places of Vrindavan and helps us meet their other Sakhi devotees (Rasiks gathering 'Samaaj') and helps us provide their association. [3]\nAfter reaching to this divine place, meeting the devotees, and getting the grace of Shyama Shyama and the dust of Vrindavan, no one should ever be sad again, since one has hit the target on the right spot and the rat race of uncountable lifetimes finally over.\nShri Rasik Bihari Dev says, that one gets the love of Shri Bihariji and Biharini Shri Radharani and should consider oneself to be very fortunate to be blessed with the holy dust of Vrindavan. [4]b:T1182,"])</script><script>self.__next_f.push([1,"(राग विहागरौ)\nभाग बड़ौ वृन्दावन पायौ।\nजा रज कौं सुर नर मुनि वंछित विधि संकर सिर नायौ॥ [1]\nबहुतक जुग या रज बिनु बीते जन्म जन्म डहकायौ।\nसो रज अब कृपा करि दीनी अभै निसान बजायौ॥ [2]\nआइ मिल्यौ परिवार आपने हरि हँसि कंठ लगायौ।\nस्यामा स्यामा जू बिहरत दोऊ सखी समाज मिलायौ॥ [3]\nसोग संताप करौ मति कोई दाव भलौ बनि आयौ।\nश्रीरसिकबिहारी की गति पाई धनि धनि लोक कहायौ॥ [4]\n- श्री रसिक बिहारी देव, श्री रसिक बिहारी देव जू की वाणी, सिद्धांत के पद (3)\nश्रीवृन्दावन अखंड वास करनेवाले निज आश्रित जनों से श्री रसिक देव कह रहे हैं -\nहे भाई! तुमको सर्वोपरि श्रीनित्यविहारिनीजू का निज विलासरस महल श्रीवृन्दावन का अखंड वास प्राप्त हो गया है, यह तुम्हारा अहो भाग्य है।\nमनुष्य, देवता एवं मुनिगण भी वृन्दावन की इस रज की वांछा करते हैं, एवं ब्रह्मा तथा भगवान शिव इस रज को माथे पर चढ़ाते हैं। [1]\nश्री राधा के चरण कमलों से आच्छादित श्री वृंदावन की रज के बिना यह दुर्लभ मानव जीवन असंख्य बार व्यर्थ गया है।\nउसी रज ने मुझ पर अब कृपा की है और मुझे सर्वोच्च आश्रय और अपार आनंद प्रदान किया है। [2]\nजो वृंदावन आता है वह अपने वास्तविक सम्बन्धी अर्थात श्री श्यामा श्याम और सखियों (उनके रसिक भक्त) से मिलता है। वे सम्बन्धी खुले हाथों से हमारा स्वागत करते हैं और श्री हरि प्रसन्नता पूर्वक अपने कंठ से लगाते हैं।\nश्री श्यामा श्याम नित्य ही वृंदावन के विभिन्न स्थानों में विचरण करते हैं और हमें उनके सखी (रासिकों) से मिलने में सहायता करते हैं तथा हमें उनका सहयोग प्रदान करने में भी सहायता करते हैं। [3]\nइस दिव्य स्थान पर पहुंचकर, भक्तों से मिल कर और श्यामा श्यामा की कृपा और वृंदावन की रज को पाकर, किसी को भी फिर कभी दुखी नहीं होना चाहिए, क्योंकि लक्ष्य की प्राप्ति हो गयी है और अनगिनत जन्मों का आवागमन आखिरकार समाप्त हो गया है।\nश्री रसिक बिहारी देव कहते हैं, \"श्री बिहारीजी और बिहारिनी श्री राधारानी का प्रेम प्राप्त कर के और वृंदावन की पावन रज से युक्त होकर अपने आप को बहुत भाग्यशाली समझना चाहिए\"। [4]"])</script><script>self.__next_f.push([1,"d:[\"slug\",\"shri-rasik-bihari-dev-shri-rasik-bihari-dev-ju-ki-vani-siddhant-ke-pad-3\",\"d\"]\n12:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"saints\",\"shri-rasik-bihari-dev-shri-rasik-bihari-dev-ju-ki-vani-siddhant-ke-pad-3\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shri-rasik-bihari-dev-shri-rasik-bihari-dev-ju-ki-vani-siddhant-ke-pad-3\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"shri-rasik-bihari-dev-shri-rasik-bihari-dev-ju-ki-vani-siddhant-ke-pad-3\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"shri-rasik-bihari-dev-shri-rasik-bihari-dev-ju-ki-vani-siddhant-ke-pad-3\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dan

 है, जो उसका अधिकारी है। एक की वस्तु को दूसरा नहीं पा सकता। वाणी सरूपी बीजक हैं और नित्य विहार सम्पति है। बीजक, वस्तु की सूचना भर देते हें। भगवतरसिक जी कहते हैं कि आचार्य और रसिकों की रचनाओं को तो सारा संसार ही पढता है, किंतु उनमें निर्देशित वस्तु नित्यबिहार किसी विरले अधिकारी के ही हाथ लगती है।वस्तुतः यह नित्य विहार की बात विषयी हृदय को जचेगी ही नहीं। भगवतरसिक जी जैसे अनुभवी रसिक संत जिसके गूढ गुणों का गायन करते हैं, वह श्यामा श्याम को परमानंद प्रदान करने वाला नित्यबिहार वस्तुतः ऐसा ही अगम्य है।\",\"english_text\":null,\"english_translation\":\"The Words of Rasik Saints are made available only to the eligible devotees. One can't attain another's owned property. Otherwise, these 'Vanis' (Writings of Rasik Saints) would not appeal to the one who is finding great interest in sensual desires. One would not be able to relish the bliss and would turn away from these 'Vanis'. Shri Bhagvatrasik says the world can just read the spiritual writings of the spiritual master and Rasik saints, but the actual 'Nitya Vihaar' (eternal ever-going loveplay of Yugal Sarkar) mentioned by Rasiks, can only be acquired by rarest most eligible devotees. In fact, Shri Bhagavad Rasik says the Nitya Vihaar, which gives unlimited happiness to Shri Radha Krishn as well, is very rarely obtained to the most eligible devotee.\",\"description\":\"https://www.brajrasik.org/hi/articles/5a8fcf1582274812fecf96aa/bani-beejak-vastu-ko-bijak-vastu-na-hoi-shri-bhagwat-rasik-bhagwat-rasik-ki-vaani\",\"author\":\"श्री भगवत रसिक, भगवतरसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (11.7)\",\"status\":\"published\",\"content_text\":\"बानी बीजक बस्तु कौ बीजक बस्तु न होइ |\\nबीजक बस्तु बतावही, लहै जासु की होइ ||\\nलहै जासु की होइ, और की, और न पावै |\\nगावै सब संसार, हाथ बिरतले के आवै ||\\nऐसौहिं नित्यबिहार स्याम स्यामाँ सुखदानी |\\nभगवत रसिक अनन्य गूढ गुन गावत बानी ||\\n- श्री भगवत रसिक, भगवतरसिक की वाणी, अनन्यरसीकाभरण ग्रन्थ (11.7)\\nरसिकों की वाणियों (नित्यबिहार रूपी सम्पत्ति) वस्तु उसे ही मिलती है, जो उसका अधिकारी है। एक क

},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":2,\\\"name\\\":\\\"संत\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/saints\\\"},{\\\"@type\\\":\\\"ListItem\\\",\\\"position\\\":3,\\\"name\\\":\\\"श्री गोविन्दशरण देवाचार्य , श्री गोविन्दशरण देवाचार्य  (69)\\\",\\\"item\\\":\\\"https://path.vrindopnishad.in/hi/saints/shri-govindasharan-devachary-shri-govindasharan-devachary-69\\\"}]}\"}}],[\"$\",\"div\",null,{\"className\":\"max-w-4xl mx-auto px-4 pt-4 mb-2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/hi/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"संत\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"श्री गोविन्दशरण देवाचार्य , श्री गोविन्दशरण देवाचार्य  (69)\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"श्री गोविन्दशरण देवाचार्य , श्री गोविन्दशरण देवाचार्य  (69)\",\"hinglishName\":\"shri govindasharan devachary , shri govindasharan devachary (69)\",\"slug\":\"shri-govindasharan-devachary-shri-govindasharan-devachary-69\",\"biography\":\"\",\"metadata\":null,\"imageUrl\":null,\"verses\":[{\"id\":\"local-57\",\"title\":\"राधेजू मेरौ जनम सुधारौ\",\"category\":\"Shloka\",\"sanskrit_text\":\"राधेजू मेरौ जनम सुधारौ।अब मोंहि वृन्दावन में डारौ॥ [1]महा-अपावन खान औगुन की,ऐसी जान न बिसारौ। [2]निरबल दीन जान अपनावौ,ये ही बिरद संभारौ॥ [3]जनम - जनम घर जाई चेरी,अब कहा देत हो टारौ। [4]'गोविंदसरन' मोस्युँ कृपा कीज्यौ,गहौ क्यों न हाथ हमारौ॥ [5]\",\"hindi_text\":\"हे श्री राधाजू, मुझे वृंदावन वास प्रदान कर मेरे जीवन को सफल बना दीजिए। [1]\\nमैं महापतित और समस्त अवगुणों की खान हूँ, परंतु यह जानकर आप मेरा त्याग न कीजिए। [2]\\nमेरे समान निर्बल और दीन कौन होगा, मुझे असहाय जानकर अपना लीजिए। आपके सिवा संसार में मेरा कोई नहीं है, मेरी यह प्रार्थना स्वीकार कर लीजिए। [3]\\nअनन्त जन्मों से संसार के बंधन में भटक रहा हूँ, हे स्वामिनीजू, अब आप क्यों देरी कर रही हैं? [4]\\nश्री गोविंद शरण जी कह रहे हैं, \\\"हे श्री राधाजू, मेरा हाथ पकड़ कर संसार से उबार कर मुझे अपनी शरण क्यों नहीं दे रही हो?\\\" [5]\",\"english_text\":null,\"english_translation\":\"Oh Shri Radhey! Please put an end to my miserable plight. Please give me residence at your lotus feet at Vrindavan anyhow.\\nAlthough I am the greatest sinner and a mine of sinfulness, yet please don't forget me, considering my bad qualities.\\nOh Kishori Ji! accept me as your very own, as I am devoid of all means and absolutely destitute. You, on the other hand, are the unfathomable ocean of love and causeless mercy. Please think about your greatness!\\nI am wandering aimlessly in this material world from uncountable lives, and waiting unceasingly for Your blissful sight, please don't delay it further.\\nShri Govind Sharan says, \\\"Oh dear Kishori Ji, why don't you bless me with your grace and hold my hand forever.\\\"\",\"description\":\"https://www.brajrasik.org/hi/articles/5d924fb489c4660060055e02/radheju-merau-janam-sudharau-shri-govindsharan-devachary-ji-shri-govindsharan-devachary-ji-ki-vani\",\"author\":\"श्री गोविन्दशरण देवाचार्य जी, श्री गोविन्दशरण देवाचार्य जी की वाणी (69)\",\"status\":\"published\",\"content_text\":\"राधेजू मेरौ जनम सुधारौ।\\nअब मोंहि वृन्दावन में डारौ॥ [1]\\nमहा-अपावन खान औगुन की,\\nऐसी जान न बिसारौ। [2]\\nनिरबल दीन जान अपनावौ,\\nये ही बिरद संभारौ॥ [3]\\nजनम - जनम घर जाई चेरी,\\nअब कहा देत हो टारौ। [4]\\n'गोविंदसरन' मोस्युँ कृपा कीज्यौ,\\nगहौ क्यों न हाथ हमारौ॥ [5]\\n- श्री गोविन्दशरण देवाचार्य जी, श्री गोविन्दशरण देवाचार्य जी की वाणी (69)\\nहे श्री राधाजू, मुझे वृंदावन वास प्रदान कर मेरे जीवन को सफल बना दीजिए। [1]\\nमैं महापतित और समस्त अवगुणों की खान हूँ, परंतु यह जानकर आप मेरा त्याग न कीजिए। [2]\\nमेरे समान निर्बल और दीन कौन होगा, मुझे असहाय जानकर अपना लीजिए। आपके सिवा संसार में

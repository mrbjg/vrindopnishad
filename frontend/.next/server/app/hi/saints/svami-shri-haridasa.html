2 flex items-center gap-1.5 text-xs text-white/50 select-none\",\"children\":[[\"$\",\"$L6\",null,{\"href\":\"/hi\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"मुख्यपृष्ठ\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"$L6\",null,{\"href\":\"/hi/saints\",\"className\":\"hover:text-amber-400 transition-colors\",\"children\":\"संत\"}],[\"$\",\"span\",null,{\"children\":\"→\"}],[\"$\",\"span\",null,{\"className\":\"text-white/80 font-medium truncate\",\"children\":\"स्वामी श्री हरिदास, केलिमाल\"}]]}],[\"$\",\"$L7\",null,{\"children\":[\"$\",\"$L8\",null,{\"initialSaint\":{\"name\":\"स्वामी श्री हरिदास, केलिमाल\",\"hinglishName\":\"svami shri haridas, kelimala\",\"slug\":\"svami-shri-haridasa\",\"biography\":\"स्वामी श्री हरिदास, वृंदावन के रसिक शिरोमणि संत थे, जो श्री ललिता सखी के अवतार थे, जो श्री राधारानी की मुख्य सखी हैं। स्वामी हरिदास जी ने 'केलिमाल' की रचना में 'अखंड नित्य विहार' रस निकुंज उपासना को प्रस्तुत किया है ।\",\"metadata\":{\"lineageEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"lineageHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"timelineEn\":\"1478–1573 AD (Vikram Samvat 1535 - 1630)\",\"timelineHi\":\"1478–1573 ईस्वी (विक्रम संवत 1535 - 1630)\",\"associatedPlacesEn\":\"Nidhivan, Vrindavan\",\"associatedPlacesHi\":\"निधिवन, वृंदावन\",\"discipleOfEn\":\"Shri Ashudhir Dev Ji (his father and guru)\",\"discipleOfHi\":\"श्री आशुधीर देव जी (पिता एवं गुरु)\",\"influencedByEn\":\"Nimbarka Sampradaya philosophy\",\"influencedByHi\":\"निम्बार्क संप्रदाय सिद्धांत\",\"associatedSampradayaEn\":\"Haridasi Sampradaya (Sakhi Sampradaya)\",\"associatedSampradayaHi\":\"हरिदासी संप्रदाय (सखी संप्रदाय)\",\"devotionalMoodEn\":\"Nitya Vihar, Sakhi Bhava (Lalita Sakhi incarnate)\",\"devotionalMoodHi\":\"नित्य विहार, सखी भाव (ललिता सखी अवतार)\",\"teachingsEn\":\"Worship of the Divine Couple in the mood of Lalita Sakhi; focused purely on the eternal love-play (Nitya Vihar) in the secluded bowers (Nikunj) of Vrindavan, entirely devoid of majesty (aishwarya) or physical separation (viraha).\",\"teachingsHi\":\"ललिता सखी के भाव में युगल उपासना; वृंदावन के निकुंजों में होने वाले अखंड नित्य विहार रस पर पूर्ण ध्यान, जिसमें ऐश्वर्य भाव या वियोग का कोई स्थान नहीं है।\",\"literaryStyleEn\":\"Composed Kelimal (केलिमाल) and Siddhanta Pada (सिद्धान्त के पद) in sweet Braj Bhasha, characterized by deep musicality, classical raag notations, and intimate description of the Divine Couple's pastimes.\",\"literaryStyleHi\":\"मधुर ब्रजभाषा में 'केलिमाल' और 'सिद्धान्त के पद' की रचना की, जो राग-रागिनियों की शास्त्रीय विधा और निकुंज लीलाओं के सूक्ष्म चित्रण से परिपूर्ण हैं।\",\"biographyEn\":\"Swami Haridas was a spiritual master, classical music pioneer, and the founding acharya of the Haridasi Sampradaya. He is widely revered as the direct incarnation of Lalita Sakhi, the chief confidante of Srimati Radharani. Swami Haridas performed his intense bhajan in the sacred grove of Nidhivan in Vrindavan. His musical devotion was so deep and pure that the Divine Couple, Shri Radha and Krishna, appeared before him and manifested themselves in a single, combined deity form—Sri Bankey Bihari Ji. Swami Haridas taught that the ultimate spiritual destination is not cosmic liberation or majestic worship, but witnessing the confidential loving service of the Divine Couple in the eternal groves of Braj.\",\"biographyHi\":\"स्वामी हरिदास वृंदावन के रसिक शिरोमणि संत और भारतीय शास्त्रीय संगीत के महान आचार्य थे। उन्हें श्री राधा जी की प्रधान सखी श्री ललिता जी का साक्षात् अवतार माना जाता है। उन्होंने वृंदावन के निधिवन को अपनी साधना स्थली बनाया, जहाँ उनके संगीत अनुराग से खिंचकर युगल सरकार ने बांके बिहारी जी के रूप में प्रकट होकर दर्शन दिए। तानसेन और बैजू बावरा जैसे संगीत सम्राट इनके शिष्य थे। स्वामी जी ने सिद्ध किया कि भक्ति शुष्क तपस्या नहीं, बल्कि राग-रागिनियों के माध्यम से प्रभु चरणों में पूर्ण आत्मसमर्पण है।\",\"relatedSaints\":[{\"nameEn\":\"Shri Hit Harivansh\",\"nameHi\":\"श्री हित हरिवंश\",\"slug\":\"hit-harivansh\"},{\"nameEn\":\"Shri Hariram Vyas\",\"nameHi\":\"श्री हरिराम व्यास\",\"slug\":\"hariram-vyas\"}],\"relatedGranthas\":[{\"nameEn\":\"Kelimal\",\"nameHi\":\"केलिमाल\",\"slug\":\"kelimal\"},{\"nameEn\":\"Siddhanta Pada\",\"nameHi\":\"सिद्धान्त के पद\",\"slug\":\"siddhanta-pada\"}],\"associatedGlossary\":[{\"termEn\":\"Nitya Vihar\",\"termHi\":\"नित्य विहार\",\"slug\":\"nitya-vihar\"},{\"termEn\":\"Nikunj\",\"termHi\":\"निकुंज\",\"slug\":\"nikunj\"},{\"termEn\":\"Sakhi Bhava\",\"termHi\":\"सखी भाव\",\"slug\":\"sakhi-bhava\"}],\"faq\":[{\"qEn\":\"Who was Swami Haridas?\",\"aEn\":\"Swami Haridas was a 16th-century rasik saint, musicologist, and founder of the Haridasi Sampradaya, renowned for manifesting the Bankey Bihari deity through his music in Nidhivan.\",\"qHi\":\"स्वामी हरिदास कौन थे?\",\"aHi\":\"स्वामी हरिदास 16वीं शताब्दी के एक महान रसिक संत, संगीतकार और हरिदासी संप्रदाय के प्रवर्तक थे, जिन्होंने अपने संगीत साधना से निधिवन में ठाकुर बांके बिहारी जी को प्रकट किया था।\"},{\"qEn\":\"Who were the famous disciples of Swami Haridas?\",\"aEn\":\"The legendary musicians Tansen (the royal singer of Akbar's court) and Baiju Bawra were disciples of Swami Haridas.\",\"qHi\":\"स्वामी हरिदास के प्रसिद्ध शिष्य कौन थे?\",\"aHi\":\"अकबर के दरबार के नवरत्नों में से एक संगीत सम्राट तानसेन और बैजू बावरा स्वामी हरिदास जी के प्रमुख शिष्य थे।\"}]},\"imageUrl\":null,\"verses\":[{\"id\":\"local-23\",\"title\":\"यह कौन बात जू अबहीं और अबहीं और\",\"category\":\"Shloka\",\"sanskrit_text\":\"“ यह कौन बात जू अबहीं और अबहीं और |श्री हरिदास के स्वामी श्यामा कुञ्ज बिहारी या रस ही बस भये और की और || ”\",\"hindi_text\":\"श्री हरिदास जी कहते हैं की श्री बिहारीजी श्री राधारानी से कहती हैं कि हे प्रिय जो आपका यह रस कितना अलौकिक है और किस प्रकार का है कि जितना भी इस रस को पियो ऐसा मन करता है कि इसको और पियो, अभी शान्ति नहीं हुई | श्री लाल जी तो मानो श्यामा जू के रस के अधीन ही हैं |\",\"english_text\":null,\"english_translation\":\"O Shri Radhey Ju, What is this amazing bliss of yours? Where a mind doesn’t settle without th

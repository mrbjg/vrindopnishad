ित्र मधुमक्खी को दूर करके लौट आया, तो उसने कहा, \"मधु चला गया है\"।\nयहाँ मधु का मतलब मधुमक्खी है और मधु कृष्ण का नाम भी है। राधा रानी को लगा की कृष्ण दूर चले गए और उन्होंने रोना शुरू कर दिया। राधा रानी बार-बार रोने लगी, \"ओह, प्राण-नाथ, तुम कहाँ गए हो? वह महाभाव में थी कि वह यह नहीं पहचान सकी कि कृष्ण उनके साथ बैठे है। कृष्ण ने उसे सांत्वना देने की कोशिश कि लेकिन राधा रानी की अलगाव का रोना देखकर, कृष्ण भी भूल गए कि वह उनकी गोद में बैठी थी और उन्होंने रोना शुरू कर दिया और प्रेम के आंसुओं के मिश्रण से प्रेम सरोवर उभरा।\nजब साखियों ने उनकी हालत देखी तो वे भी भूल गई। राधा रानी की महिला तोता ने राधा के नाम का ज़ोरदार उच्चारण करना शुरू कर दिया और पुरुष तोते ने श्रीकृष्ण के नाम का ज़ोरदार उच्चारण करना शुरू किया। जैसे ही उन्होंने एक-दूसरे के नाम को सुना राधा और कृष्ण ने बाहरी चेतना वापस ली और एक दूसरे पर बहुत उत्सुकता से देखा। प्रेम सरोवर दोनों युगल के विरह के आंसुओं एवं अश्रु धार से उभरा हालांकि वे एक साथ ही थे उस समय।\n\"प्रेम सरोवर प्रेम की भरी रहे दिन रैन,\nजहाँ जहाँ प्यारी पग धरत श्याम धरत तहँ नैन\"\n- श्री कुंभन दास\nब्रज में प्रेम-सरोवर नित्य दिव्य प्रेम से भरा हुआ है। प्यारी राधा जहाँ कमल चरण रखती हैं, श्री कृष्ण अपनी आंखों में चरण कमल के दर्शन करना चाहते हैं, इसलिए उनके नयन उनके चरणों से अंकित रज की तरफ रहती है ।\nप्रेम सरोवर प्रेम सों पूरन परम रसाल ।\nनेंकु नीर के परसितें वसें हिये जुग लाल ॥\n- श्री प्रियादास जी, रसिक मोहिनी (25)\nबरसाना में स्थित प्रेम सरोवर प्रेम से परिपूर्ण है जो परम रसाल है जहां श्री राधा कृष्ण ने प्रेम से आँसु बहाए थे, उस सरोवर के नीर (आंसुओं) के थोड़े से स्पर्श से (यदि भाव से किया जाये) प्रिया लाल ह्रदय में बस जाते हैं ।\nस्थान:\nप्रेम सरोवर बरसाना के 1 कि मी उत्तर में स्थित है।"])</script><script>self.__next_f.push([1,"b:[\"slug\",\"shri-kunbhan-dasa\",\"d\"]\n10:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"saints\",\"shri-kunbhan-dasa\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\"

 लीजै॥ [2]\nजहाँ राधा राधा गावै, तहाँ सुनवे को हम जावै।\nश्री राधा मेरी सम्पति, श्री राधा मेरी दम्पति॥ [3]\nश्री राधा मेरी सोभा, श्री राधा को चित लोभा।\nमैं राधा के संग नीको, राधा बिन लागत फीको॥ [4]\n- ब्रज रसिक\nश्री कृष्ण कहते हैं - जब भी मैं श्री वृषभानु नंदिनी श्री राधा का दर्शन करता हूँ, तब मैं अपने जीवन को पूर्ण और सार्थक मानता हूँ। मैं निरंतर “राधा-राधा” नाम का जप करता हूँ और उनकी प्रसन्नता के लिए ही अपनी मधुर मुरली बजाता हूँ। [1]\nमुझे ‘श्री राधा रमण’ कहा जाता है—क्योंकि मैं केवल श्री राधा के संग नित्य क्रीड़ाओं में रत रहता हूँ। मैं किसी अन्य नाम की अभिलाषा क्यों करूँ? जहाँ भी श्री राधा की लीलाओं का रसिक गान हो रहा हो, वहाँ का प्रथम श्रोता मुझे ही जानो। [2]\nजहाँ उनके गुणों का मधुर गान हो रहा हो, वहाँ मेरी उपस्थिति निश्चय मानो। श्री राधा ही मेरी सर्वस्व सम्पत्ति हैं और मेरी अनन्य नित्य-संगिनी हैं। [3]\nवे ही मेरी शोभा का आभूषण हैं, वे ही मेरे हृदय की परम अभिलाषा हैं। मैं जब श्री राधा के संग होता हूँ, तभी सब कुछ रमणीय लगता है; उनके बिना समस्त संसार फीका और शून्य प्रतीत होता है। [4]"])</script><script>self.__next_f.push([1,"b:[\"slug\",\"braj-rasika\",\"d\"]\n10:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L4\",null,{\"buildId\":\"Xt0P2co0XkF6MKDXqPjpt\",\"assetPrefix\":\"\",\"urlParts\":[\"\",\"hi\",\"saints\",\"braj-rasika\"],\"initialTree\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"braj-rasika\",\"d\"],{\"children\":[\"__PAGE__?{\\\"slug\\\":\\\"braj-rasika\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"hi\",{\"children\":[\"saints\",{\"children\":[[\"slug\",\"braj-rasika\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L5\",[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"{\\\"@context\\\":\\\"https://schema.org\\\",\\\"@type\\\":\\\"Person\\\",\\\"name\\\":\\\"ब्रज रसिक\\\",\\\"alternateName\\\":\\\"braj rasika\\\",\\\"description\\\":\\\"ब्रज परंपरा के वैष्णव संत।\\\",\\\"url\\\":\\\"https://path.vrindopnis

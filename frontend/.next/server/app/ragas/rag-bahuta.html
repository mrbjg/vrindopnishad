 त्यों भाग |बस वृन्दावन भज राधावर, भूलिके अन्त न लाग  | |\\\"\",\"hindi_text\":\"अरे मन, युगल सरकार के कमल चरणों से प्रेम करो। तुम अनंत काल से अज्ञानता में सो रहे हो। हे मूर्ख, यह जागने का समय है। जो तेरी भक्ति के पक्ष में एवं उसमें बाधा पहुँचाने वाले हैं, उनसे किसी भी तरह दूर भाग जा। वृंदावन का आश्रय ले, श्री युगल सरकार का भजन कर और भूल कर भी अन्य जगह मन का लगाव न कर ।\",\"english_text\":null,\"english_translation\":\"Oh Mind, drench yourself in the love of the lotus feet of Yugal Sarkar. You have been sleeping in the stupor of ignorance since eternity, Oh foolish one, This is the time to wake up. Run away by any means possible, from the association of those who are not in the favor of your devotion. Reside and Take Shelter in Vrindavan, chant the glories of Shri Yugal Sarkar exclusively!\",\"description\":\"https://www.brajrasik.org/hi/articles/5b1c90e59f7ab760360f9c87/karu-mana-yugal-charan-anurag-bahut-divas-tohin-sovat-beete-jaag-re-murakh-jaag-bimukhan-ki-sangati-son-tu-jaise-bane-tyon-bhaag-bas-vrindavan-bhaj-radhavan-bhulike-anant-na-laag-shri-narayan-swami-braj-vihaar\",\"author\":\"श्री नारायण स्वामी, ब्रज विहार, पद सिद्धान्त (4)\",\"status\":\"published\",\"content_text\":\"(राग कालिंगडा)\\n\\\"करु मन जुगलचरण अनुराग |\\nबहुत दिवस तोहिं सोवत बीते, जाग रे मूरख जाग | |\\nबेमुखियन की संगति सों तू, जैसे बनै त्यों भाग |\\nबस वृन्दावन भज राधावर, भूलिके अन्त न लाग  | |\\\"\\n- श्री नारायण स्वामी, ब्रज विहार, पद सिद्धान्त (4)\\nअरे मन, युगल सरकार के कमल चरणों से प्रेम करो। तुम अनंत काल से अज्ञानता में सो रहे हो। हे मूर्ख, यह जागने का समय है। जो तेरी भक्ति के पक्ष में एवं उसमें बाधा पहुँचाने वाले हैं, उनसे किसी भी तरह दूर भाग जा। वृंदावन का आश्रय ले, श्री युगल सरकार का भजन कर और भूल कर भी अन्य जगह मन का लगाव न कर ।\",\"tags\":[\"Braj Rasik\",\"Mass Import\"],\"image_urls\":[],\"video_urls\":[],\"media_links\":[],\"source_url\":\"https://www.brajrasik.org/hi/articles/5b1c90e59f7ab760360f9c87/karu-mana-yugal-charan-anurag-bahut-divas-tohin-sovat-beete-jaag-re-murakh-

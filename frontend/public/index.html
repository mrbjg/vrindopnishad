    <!-- Theme colors for light and dark mode -->

    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0D12" />

    <title>Vrindopnishad — Authentic Spiritual & Vedic Knowledge</title>
    <meta name="description"
        content="Vrindopnishad is the official digital sanctuary for authentic spiritual and Vedic knowledge. Explore a curated collection of sacred art, divine wisdom, and interactive pilgrimage guides." />
    <meta name="keywords"
        content="Vrindopnishad, Vedic Knowledge, Spiritual Wisdom, Indian Culture, Sacred Art, Hindu Philosophy, Meditation, Yoga, Vrindavan, Bhagavad Gita, Upanishads, Vrindavan, BhaktiPath, premanand ji maharaj, radha keli kunj, barsana, nandgaav, govardhan, Sant-Vaani, vrindopnishad" />

    <link rel="canonical" href="https://vrindopnishad.in/" />

    <!-- Open Graph / Facebook -->

    <meta property="og:title" content="Vrindopnishad — Authentic Spiritual & Vedic Knowledge">

        content="Explore a digital sanctuary of ancient wisdom and modern creativity at Vrindopnishad.">
    <meta property="og:image" content="https://vrindopnishad.in/Vrindopnishad%20Web/class/logo/v-logo.png">

    <!-- Twitter -->

    <meta property="twitter:image" content="https://vrindopnishad.in/Vrindopnishad%20Web/class/logo/v-logo.png">

    <!-- Prevent flash of wrong theme -->
    <script>
        (function () {
            // Check localStorage first
            const stored = localStorage.getItem('theme');
            let theme = stored;

            // If system mode or no stored preference, check system preference
            if (!stored || stored === 'system') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            // Apply the theme class immediately (before CSS loads)
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
  <!-- Global Vrindopnishad Favicon -->
  <link rel="icon" href="https://vrindopnishad.in/favicon.ico" sizes="48x48">

</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('%PUBLIC_URL%/service-worker.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />

    <!-- Theme colors for light and dark mode -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F7F4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0D12" />

    <meta name="description"
        content="Vrindopnishad - A sacred repository of Hindu Vaidik Sanskriti. Explore timeless wisdom through Shlokas, Strotras, and devotional poetry." />

    <!-- PWA & Mobile Settings -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Vrindopnishad | Sant-Vaani App</title>
    <meta property="og:title" content="Vrindopnishad — Sant-Vaani App">
    <meta property="og:description"
        content="Explore timeless wisdom through Shlokas, Strotras, and devotional poetry on the go.">
    <meta property="og:image" content="https://imbajrangi.github.io/Company/Vrindopnishad%20Web/class/logo/v-logo.png">
    <meta property="twitter:card" content="summary">
    <meta property="twitter:title" content="Vrindopnishad — Sant-Vaani App">
    <meta property="twitter:description"
        content="Explore timeless wisdom through Shlokas, Strotras, and devotional poetry.">
    <meta property="twitter:image"
        content="https://imbajrangi.github.io/Company/Vrindopnishad%20Web/class/logo/v-logo.png">

    <!-- Prevent flash of wrong theme -->
    <script>
        (function () {
            // Check localStorage first
            const stored = localStorage.getItem('theme');
            let theme = stored;

            // If system mode or no stored preference, check system preference
            if (!stored || stored === 'system') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            // Apply the theme class immediately (before CSS loads)
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('%PUBLIC_URL%/service-worker.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>

</html>

    <!-- Prevent flash of wrong theme -->
    <script>
        (function () {
            let theme = 'dark';
            try {
                const saved = localStorage.getItem('user_settings');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.theme) {
                        theme = parsed.theme;
                    }
                }
            } catch (e) {}

            document.documentElement.setAttribute('data-theme', theme);

            // Dark themes list:
            const darkThemes = ['dark', 'night', 'space', 'void'];
            const isDark = darkThemes.indexOf(theme) !== -1;

            if (isDark) {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light-mode');
            } else {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>

    <!-- SEO: Dynamic Canonical & Hreflang for SPA pages -->
    <script>
        (function () {
            var p = window.location.pathname;
            var isHi = p.indexOf('/hi') === 0;
            var cleanPath = isHi ? (p.replace(/^\/hi/, '') || '/') : p;
            var base = 'https://path.vrindopnishad.in';
            var hiPath = '/hi' + (cleanPath === '/' ? '' : cleanPath);

            // Set canonical to current exact URL
            var c = document.createElement('link');
            c.rel = 'canonical';
            c.href = base + p;
            document.head.appendChild(c);

            // Hreflang alternates
            var tags = [
                { hl: 'en', hr: base + cleanPath },
                { hl: 'hi', hr: base + hiPath },
                { hl: 'x-default', hr: base + cleanPath }
            ];
            for (var i = 0; i < tags.length; i++) {
                var a = document.createElement('link');
                a.rel = 'alternate';
                a.hreflang = tags[i].hl;
                a.href = tags[i].hr;
                document.head.appendChild(a);
            }
        })();
    </script>

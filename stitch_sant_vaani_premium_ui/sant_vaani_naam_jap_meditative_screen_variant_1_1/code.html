<html class="dark"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#f2a60d",
            "background-light": "#f8f7f5",
            "background-dark": "#1a160d",
          },
          fontFamily: {
            "display": ["Newsreader", "serif"]
          },
          borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .glass {
      background: rgba(242, 166, 13, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(242, 166, 13, 0.1);
    }
    .mandala-bg {
      background-image: radial-gradient(circle at center, rgba(242, 166, 13, 0.08) 0%, transparent 70%);
    }
    .glow-gold {
      text-shadow: 0 0 20px rgba(242, 166, 13, 0.6);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased selection:bg-primary/30">
<div class="relative flex h-screen w-full flex-col overflow-hidden mandala-bg">
<!-- Top Header / Stats Bar -->
<div class="flex items-center justify-between p-6 pt-12">
<div class="text-primary cursor-pointer">
<span class="material-symbols-outlined text-3xl">chevron_left</span>
</div>
<div class="glass px-6 py-2 rounded-full flex gap-6 border-primary/20">
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase tracking-widest text-primary/70 font-bold">Mala Count</span>
<span class="text-lg font-bold text-primary">2</span>
</div>
<div class="w-[1px] bg-primary/20 my-1"></div>
<div class="flex flex-col items-center">
<span class="text-[10px] uppercase tracking-widest text-primary/70 font-bold">Remaining</span>
<span class="text-lg font-bold text-primary">84</span>
</div>
</div>
<div class="text-primary cursor-pointer">
<span class="material-symbols-outlined text-3xl">info</span>
</div>
</div>
<!-- Main Meditative Area -->
<div class="flex-1 flex flex-col items-center justify-center relative">
<!-- Subtle Mandala Pattern Overlay -->
<div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
<svg class="w-[120%] h-[120%]" viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<path class="text-primary" d="M100 0 A100 100 0 0 1 200 100 A100 100 0 0 1 100 200 A100 100 0 0 1 0 100 A100 100 0 0 1 100 0 Z" fill="currentColor" opacity="0.1"></path>
<g transform="translate(100,100)">
<circle fill="none" r="80" stroke="currentColor" stroke-dasharray="2 4" stroke-width="0.5"></circle>
<circle fill="none" r="60" stroke="currentColor" stroke-width="0.2"></circle>
</g>
</svg>
</div>
<!-- Central Progress Ring & Om -->
<div class="relative flex items-center justify-center w-72 h-72">
<!-- Outer Glow Ring -->
<div class="absolute inset-0 rounded-full border-4 border-primary/10 shadow-[0_0_50px_rgba(242,166,13,0.1)]"></div>
<!-- Saffron Progress Ring (SVG) -->
<svg class="absolute inset-0 w-full h-full -rotate-90 drop-shadow-[0_0_8px_rgba(242,166,13,0.4)]">
<circle class="text-primary/10" cx="144" cy="144" fill="none" r="130" stroke="currentColor" stroke-width="8"></circle>
<circle class="text-primary" cx="144" cy="144" fill="none" r="130" stroke="currentColor" stroke-dasharray="816" stroke-dashoffset="285" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<!-- Inner Glass Circle -->
<div class="w-56 h-56 rounded-full glass flex items-center justify-center border-primary/30 shadow-inner">
<div class="text-8xl text-primary glow-gold select-none">ॐ</div>
</div>
</div>
<!-- Current Progress Text -->
<div class="mt-12 text-center">
<p class="text-primary/60 text-sm tracking-[0.2em] uppercase font-bold mb-1">Mala Progress</p>
<p class="text-4xl font-light text-primary">65%</p>
</div>
</div>
<!-- Bottom Controls -->
<div class="p-8 flex flex-col items-center gap-8">
<button class="glass px-8 py-3 rounded-full text-primary/80 text-sm font-bold tracking-widest uppercase border-primary/10 hover:bg-primary/10 transition-colors">
        Reset Session
      </button>
<!-- Bottom Nav Bar Component Integrated -->
<div class="w-full glass rounded-full flex gap-2 p-2 border-primary/20 shadow-[0_0_20px_rgba(242,166,13,0.1)]">
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary/50 py-2" href="#">
<span class="material-symbols-outlined text-2xl">home</span>
<p class="text-[10px] font-medium leading-normal">Home</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary bg-primary/20 rounded-full py-2 shadow-[0_0_15px_rgba(242,166,13,0.2)]" href="#">
<span class="material-symbols-outlined text-2xl" style="font-variant-settings: 'FILL' 1">self_improvement</span>
<p class="text-[10px] font-bold leading-normal">Jap</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary/50 py-2" href="#">
<span class="material-symbols-outlined text-2xl">groups</span>
<p class="text-[10px] font-medium leading-normal">Satsang</p>
</a>
<a class="flex flex-1 flex-col items-center justify-center gap-1 text-primary/50 py-2" href="#">
<span class="material-symbols-outlined text-2xl">account_circle</span>
<p class="text-[10px] font-medium leading-normal">Profile</p>
</a>
</div>
</div>
<!-- Decorative Corner Gradients -->
<div class="absolute -top-24 -left-24 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute -bottom-24 -right-24 w-64 h-64 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>
</div>
</body></html>

<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

          extend: {

              "primary": "#f2a60d",

              "background-dark": "#1a160f",

            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},

      }

<style>.mandala-bg {
    background-image: radial-gradient(circle at center, rgba(242, 166, 13, 0.08) 0%, transparent 70%), url(https://lh3.googleusercontent.com/aida-public/AB6AXuDI2q7_BdBU72jh7_uCrdSVN4QYAaOKLM4-P3vZGPwweE6xwMhhadV-AO9IOfvGWFLUKZRQZKbgJiTL0jj7Y1Ydihh9HXKBiIUWrB7TMithDUntPoEA6hYtU2nTlY9wTujdx_kKa1t08aSo_MJ2APwAvAgH_UBAOXGgJxAkEApB0Zy5eC5rK7JHRWvCsscHER3Z5ZTZY4GMxMgiAnb0NwdYGdHCrn8udU7CMTapwn1d6JbT1aIWs9ljPnhRa_-m-sxJpBm6X1FedGM)
    }
.glass-gold {
    background: rgba(242, 166, 13, 0.1);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(242, 166, 13, 0.3);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37)

.om-glow {
    filter: drop-shadow(0 0 15px rgba(242, 166, 13, 0.6))

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col items-center justify-between overflow-hidden">
<!-- Top Navigation / Header -->
<div class="w-full flex items-center justify-between px-6 pt-12 pb-4 z-10">
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined">chevron_left</span>
</div>
<h2 class="text-lg font-bold tracking-tight text-slate-100 uppercase">Naam Jap</h2>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined">settings</span>
</div>
</div>
<!-- Stats Section -->
<div class="w-full px-6 grid grid-cols-2 gap-4 mt-4 z-10">
<div class="flex flex-col items-center justify-center p-4 rounded-xl glass-gold">
<p class="text-[10px] uppercase tracking-[0.2em] text-primary/70 font-bold">Mala</p>
<p class="text-2xl font-extrabold text-slate-100 mt-1">12</p>
</div>
<div class="flex flex-col items-center justify-center p-4 rounded-xl glass-gold">
<p class="text-[10px] uppercase tracking-[0.2em] text-primary/70 font-bold">Total Jap</p>
<p class="text-2xl font-extrabold text-slate-100 mt-1">1,296</p>
</div>
</div>
<!-- Central Meditative Area -->
<div class="relative flex flex-col items-center justify-center flex-1 w-full mandala-bg overflow-visible">
<!-- Progress Ring Wrapper -->
<div class="relative flex items-center justify-center w-72 h-72">
<!-- Pulsing Outer Ring -->
<div class="absolute inset-0 rounded-full border-2 border-primary/20 scale-110"></div>
<!-- Main Progress Ring -->
<svg class="w-full h-full transform -rotate-90">
<circle class="text-primary/10" cx="50%" cy="50%" fill="transparent" r="48%" stroke="currentColor" stroke-width="6"></circle>
<circle class="text-primary" cx="50%" cy="50%" fill="transparent" r="48%" stroke="currentColor" stroke-dasharray="603" stroke-dashoffset="150" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<!-- Central Om Container -->
<div class="absolute flex flex-col items-center justify-center w-56 h-56 rounded-full glass-gold border-2 border-primary/50 shadow-2xl">
<!-- Golden Om Symbol (using data-alt as requested) -->
<div class="text-primary om-glow mb-2">
<span class="material-symbols-outlined !text-7xl font-light">self_improvement</span>
</div>
<div class="flex flex-col items-center">
<span class="text-5xl font-black text-slate-100">108</span>
<span class="text-[10px] uppercase tracking-[0.3em] text-primary/80 mt-1">Beads Left</span>
</div>
</div>
</div>
<!-- Reset Button -->
<button class="mt-12 text-sm font-semibold text-primary/60 tracking-widest uppercase border-b border-primary/20 pb-1 hover:text-primary transition-colors">
            Reset Session
        </button>
</div>
<!-- Immersive Background Element -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/5 rounded-full blur-[100px] -z-10"></div>
<!-- Floating Bottom Navigation -->
<div class="w-full px-6 pb-8 pt-4 z-20">
<div class="flex items-center justify-around bg-background-dark/80 backdrop-blur-xl border border-primary/20 rounded-full py-4 px-6 shadow-[0_0_20px_rgba(242,166,13,0.15)]">
<a class="flex flex-col items-center gap-1 text-primary/40 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">home</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary/40 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">auto_stories</span>
</a>
<!-- Active State -->
<a class="relative flex flex-col items-center gap-1 text-primary transition-all" href="#">
<div class="absolute -top-10 flex items-center justify-center w-14 h-14 rounded-full bg-primary shadow-[0_0_25px_rgba(242,166,13,0.5)] border-4 border-background-dark">
<span class="material-symbols-outlined text-background-dark !font-bold">prayer_times</span>
</div>
<span class="text-[10px] mt-6 font-bold uppercase tracking-wider">Jap</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary/40 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">headset</span>
</a>
<a class="flex flex-col items-center gap-1 text-primary/40 hover:text-primary transition-all" href="#">
<span class="material-symbols-outlined">person</span>
</a>
</div>
</div>
<!-- Visual Hint for Tapping -->
<div class="fixed bottom-32 left-1/2 -translate-x-1/2 text-primary/30 text-[10px] uppercase tracking-[0.4em] pointer-events-none">
        Tap screen to count
    </div>

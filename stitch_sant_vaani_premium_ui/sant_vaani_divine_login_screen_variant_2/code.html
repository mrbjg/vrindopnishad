<body class="bg-background-dark font-display text-slate-100 selection:bg-primary/30">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden bg-gradient-to-b from-[#1a160f] via-[#221c10] to-[#130f0a] px-6 py-12 mandala-bg">
<!-- Header / Logo Section -->
<div class="flex flex-col items-center mb-10">
<div class="relative flex items-center justify-center size-24 mb-6">
<!-- Glowing Aura -->
<div class="absolute inset-0 bg-primary/20 blur-3xl rounded-full"></div>
<!-- Om Icon Placeholder -->
<div class="relative flex size-20 items-center justify-center rounded-full border border-primary/30 bg-primary/10">
<span class="material-symbols-outlined text-5xl text-primary" style="font-variation-settings: 'FILL' 1">
                        brightness_7
                    </span>
</div>
</div>
<h1 class="text-4xl font-extrabold tracking-tight text-primary drop-shadow-sm">Sant-Vaani</h1>
<p class="mt-2 text-slate-400 text-sm font-medium tracking-wide uppercase">The Voice of Saints</p>
</div>
<!-- Login Form Card -->
<div class="w-full max-w-md glass-card p-8 rounded-xl shadow-2xl">
<h2 class="text-2xl font-bold text-center mb-2">Welcome Back</h2>
<p class="text-slate-400 text-center text-sm mb-8">Reconnect with your spiritual self</p>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-primary/80 uppercase tracking-widest ml-1">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60 text-xl">mail</span>
<input class="w-full bg-white/5 border border-primary/20 rounded-xl py-4 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="name@divine.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-xs font-semibold text-primary/80 uppercase tracking-widest ml-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60 text-xl">lock</span>
<input class="w-full bg-white/5 border border-primary/20 rounded-xl py-4 pl-12 pr-4 text-slate-100 placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary/50 transition-all" placeholder="••••••••" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 cursor-pointer hover:text-primary transition-colors">visibility</span>
</div>
<div class="flex justify-end pt-1">
<a class="text-xs font-medium text-primary hover:text-saffron transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full bg-gradient-to-r from-primary to-saffron text-[#1a160f] font-bold text-lg py-4 rounded-xl shadow-[0_4px_20px_rgba(242,166,13,0.3)] hover:shadow-[0_6px_25px_rgba(242,166,13,0.4)] transition-all active:scale-[0.98] mt-4" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative flex items-center my-8">
<div class="flex-grow border-t border-white/10"></div>
<span class="flex-shrink mx-4 text-xs font-medium text-slate-500 uppercase tracking-widest">Or continue with</span>
<div class="flex-grow border-t border-white/10"></div>
</div>
<!-- Social Logins -->
<div class="flex justify-center gap-6">
<button class="flex items-center justify-center size-14 rounded-full glass-card hover:bg-white/10 border border-white/5 transition-all">
<svg class="size-6 fill-slate-200" viewbox="0 0 24 24">
